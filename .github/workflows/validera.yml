name: Validera

# Arbetsorder 2026-08-03, punkt 4 — samma grind som pre-commit-hooken
# (scripts/git-hooks/pre-commit), men här utan möjlighet att kringgås
# med --no-verify. Körs på varje push och pull request mot main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # regressionsskyddet behöver historik mot main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera beroenden
        run: npm ci

      - name: Schemavalidering
        run: node --experimental-strip-types scripts/validera-data.ts

      - name: Regressionsskydd (bidragsantal mot main)
        if: github.ref != 'refs/heads/main'
        run: node --experimental-strip-types scripts/verify-ingen-bidrag-regression.ts --ci-mot=origin/main

      - name: Regressionsskydd (krav_fullstandiga mot main)
        if: github.ref != 'refs/heads/main'
        run: node --experimental-strip-types scripts/verify-krav-fullstandiga-regression.ts --ci-mot=origin/main

      - name: Avregistreringslänk i bevakningsmejlen (J1.3)
        run: node --experimental-strip-types scripts/verify-mejl-avregistrering.ts

      - name: astro build
        run: npm run build

      - name: Matchning
        run: node --experimental-strip-types scripts/verify-matching.ts

      - name: Golden set
        run: node --experimental-strip-types scripts/verify-generator.ts

      - name: Belopp-avser golden set
        run: node --experimental-strip-types scripts/verify-belopp-avser.ts

      - name: Beloppsrendering
        run: node --experimental-strip-types scripts/verify-belopp-rendering.ts

      - name: Giltighetsregler G1 golden set
        run: node --experimental-strip-types scripts/verify-giltighet-regler.ts

      - name: Källa/CTA-konsistens
        run: node --experimental-strip-types scripts/verify-kalla-cta.ts

      - name: KLAR.md-talet (rapport, fäller aldrig)
        run: node --experimental-strip-types scripts/verify-kommun-klar.ts --ci
