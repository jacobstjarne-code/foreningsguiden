  malgrupp: Föreningar med ridskoleverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Sammankomsten ska vara planerad i förväg och pågå minst 45 minuter
  - Ledas av minst en ledare, fyllt 13 år och medlem i föreningen
  - Minst tre bidragsberättigade deltagare utöver ledare
  - Deltagare 4-25 år eller med funktionsvariation, folkbokförda i Kumla kommun
  - Redovisning av antal ridlektioner bifogas ansökan i efterhand
  belopp: 100 kr per bidragsberättigad deltagare och genomförd sammankomst, för max 10 deltagare
