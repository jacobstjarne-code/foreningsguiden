  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningens huvudsakliga verksamhetsområde ska vara Kumla kommun eller en del av kommunen
  - Föreningen ska fira 25, 75 eller 125 år eller ett jämnt tiotal år från och med 30 år; samma slags jubileumsstöd kan ges med minst 15 års mellanrum
  - Ansökan ska lämnas senast sex månader före jubileumsfirandet
  - Stöd till offentlig jubileumsaktivitet förutsätter att aktiviteten är fritt tillgänglig för allmänheten och äger rum i kommunen
  - Ansökan om jubileumsaktivitet ska innehålla preliminärt program och kostnadskalkyl
