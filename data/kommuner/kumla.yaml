- namn: Sydnärkebidrag
  kategori:
  - funktionsratt
  - social
  malgrupp: Föreningar med verksamhet i minst två Sydnärkekommuner
  deadlines:
    typ: fasta
    datum:
    - 05-01
  krav:
  - Föreningen ska bedriva verksamhet i minst två av de fyra Sydnärkekommunerna Askersund, Hallsberg, Kumla eller Laxå
  - Föreningen ska tillhöra en riksorganisation, undantag kan beviljas om riksorganisation saknas
  - Föreningen ska vara uppbyggd och fungera enligt demokratiska principer och vara öppen för alla som stödjer föreningens
    ändamål
  - Föreningen ska ha egen ekonomi som innefattar medlemsavgifter
  - Föreningen ska ha organisationsnummer och bank- eller plusgiro
  - Föreningen är skyldig att uppge om bidrag erhålls från andra bidragsgivare
