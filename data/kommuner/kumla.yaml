  krav:
  - Föreningen ska ha beviljats startbidrag eller grundbidrag under de senaste 12 månaderna
  - Utbildningen ska pågå minst två timmar exklusive pauser och genomföras inom Norden
  - Utbildningen ska förbättra föreningens verksamhet och höja kvaliteten på kultur-, idrotts- eller fritidsverksamhet för kommunens invånare
  - Utbildningen ska ha begränsade möjligheter till annan finansiering och ansökan ska innehålla kostnadskalkyl
  - Skriftlig rapport och ekonomisk redovisning ska lämnas senast sex veckor efter utbildningens slut
  belopp: 100 procent av kurskostnaden, högst 5 000 kronor per förening och år
