  krav:
  - Föreningen ska ha beviljats startbidrag eller grundbidrag under de senaste 12 månaderna
  - Sammankomsten ska vara planerad, öppen för kommunens invånare, pågå minst 45 minuter och ha gemensam samling och avslutning
  - Minst tre bidragsberättigade deltagare utöver ledare ska delta och ledaren ska vara minst 13 år samt medlem i föreningen
