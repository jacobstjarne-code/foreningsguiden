  - Specifikation av värmekostnader för perioden, om tillämpligt
  - Specifikation av el-, VA- och sophämtningskostnader för perioden, om tillämpligt
  - Specifikation av lokalens eller anläggningens totala driftkostnader och hyresintäkter (om föreningen äger lokalen)
