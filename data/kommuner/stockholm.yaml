  - id: stockholm-medlemsaktivitetsstod
    namn: Medlemsaktivitetsstöd (idrottsförvaltningen)
    kategori:
      - idrott
      - funktionsratt
    malgrupp: Föreningar med ledarledd barn- och ungdomsverksamhet samt verksamhet för personer med funktionsnedsättning
    deadlines:
      typ: fasta
      datum:
        - 02-25
    krav:
      - Aktivitetstillfälle minst 45 min (30 min för personer med funktionsnedsättning), minst tre medlemmar, ledarlett
      - Ansökan och medlemsförteckning registrerade digitalt i Idrottsportalen, komplett med bilagor
      - Medlemmar registrerade per 31 december föregående år
      - Föreningen ska vara ideell, demokratiskt uppbyggd och uppfylla Stockholms stads demokrativillkor
      - Föreningen ska ha eget organisationsnummer och plus- eller bankgiro i föreningens namn
      - Föreningen ska ha säte och huvudsaklig verksamhet i Stockholms stad samt lämna begärda årliga handlingar
    belopp: Grundstöd 5 000 kr per förening och år samt 3,50 kr per aktivitet för 7–12 år och 13,80 kr för 13 år och äldre
    sen_ansokan: Om ansökan inte inkommit senast 25 februari reduceras stödbeloppet med 25 %
    kalla_url: >-
      https://foreningsservice.stockholm/stod-till-foreningar-och-organisationer/stod-till-deltagaraktiviteter/medlemsaktivitetsstod/
