- id: mora-sarskilt-bidrag
  namn: Särskilt bidrag
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen ska uppfylla kommunens grundvillkor för föreningsstöd
  - Kan endast sökas av föreningar som redan har årsbidrag
  - Avser verksamhet som inte kunnat förutses när överenskommelsen om årsbidrag gjordes (t.ex. nystartad verksamhet, projekt
    eller oförutsedda händelser i föreningsägd anläggning)
  - Ansökan ska avse verksamhet eller en händelse under innevarande år
  belopp: Inget fast belopp - beslutas individuellt av kultur- och fritidsnämnden
  sen_ansokan: Ansökningar efter angiven sista dag kan avvisas
  kalla_url: https://morakommun.se/uppleva-och-gora/foreningar-och-foreningsstod/soka-foreningsstod/arsbidrag.html
