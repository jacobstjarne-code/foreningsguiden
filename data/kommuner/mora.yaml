    - 09-30
  krav:
  - Föreningen ska ha ansvarig styrelse, revisorer och antagna stadgar godkända av riksorganisation eller kommunen
  - Föreningen ska vara ideell, ha sitt säte och huvuddelen av sina medlemmar i Mora kommun
  - Föreningen ska ha minst 10 aktiva medlemmar, organisationsnummer och ta ut medlemsavgift
  - Verksamhetsberättelse med resultat- och balansrapport från senaste årsmötet
  - Revisionsberättelse från senaste årsmötet
  - Verksamhetsplan och budget för kommande verksamhetsår
  - Redovisning av aktiva medlemmar och sammankomster (idrottsföreningar redovisar sökt statligt LOK-stöd)
  - Deltagande i dialogmöte med kommunen krävs om bidraget ligger över delegationsnivån
  belopp: Inget fast belopp - bedöms individuellt utifrån föreningens verksamhetsomfattning, kostnader och lokal-/anläggningskostnader
  sen_ansokan: Ansökningar efter angiven sista dag kan avvisas
