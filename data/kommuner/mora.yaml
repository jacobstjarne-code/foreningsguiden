- id: mora-arrangemangsbidrag
  namn: Arrangemangsbidrag
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara godkänd för föreningsstöd och uppfylla kommunens grundvillkor
  - Beräknad budget för arrangemanget med kostnader och intäkter ska bifogas ansökan
  - Arrangemanget ska äga rum i Mora kommun och vara offentligt, öppet för alla
  - Ansökan ska lämnas in minst två månader före planerat arrangemang
  - Arrangemanget ska marknadsföras, bland annat i kommunens evenemangskalender
  - Redovisning ska lämnas efter genomfört arrangemang som underlag för utbetalning
  - Stöd ges inte till mästerskap, tävlingar eller arrangemang med religiös eller politisk inriktning
  - Bidraget kan inte sökas för arrangemang som föreningen redan får årsbidrag för
  belopp: Förlustgaranti med maxbelopp utifrån beräknad förlust; lokalsubvention för eventlokal högst 50 procent av lokalkostnaden
    eller max 10 000 kronor per arrangemang
  sen_ansokan: Kontakta kommunen om ansökningsförfarandet
  kalla_url: https://morakommun.se/uppleva-och-gora/foreningar-och-foreningsstod/soka-foreningsstod/arrangemangsbidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
