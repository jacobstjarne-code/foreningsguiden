  kommunens_pott: null
  foreningstyp:
  - idrott
  - kultur
  - hembygd
  - friluft
  - social
  - ungdom
  - annat
  anteckning: Ansökan ska lämnas senast två månader före arrangemanget; stödet fungerar som förlustgaranti.
- id: mora-kulturarvsbidrag
  namn: Kulturarvsbidrag
  kategori:
  - kultur
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska uppfylla kommunens grundvillkor för föreningsstöd
  - Plan med budget för genomförandet ska bifogas ansökan
  - Vid kulturarvsantikvariska insatser ska planen vara framtagen i samråd med yrkesverksam antikvarie eller motsvarande
  - Insatsen ska äga rum i Mora kommun och skapa mervärde för trakten
  - Projektet ska redovisas inom två månader efter avslutat projekt, annars ska bidraget återbetalas
  - Stöd ges inte till byggnadsantikvariska insatser
  belopp: Inget fast belopp - betalas ut helt eller delvis beroende på projektets omfattning
  sen_ansokan: Ansökningsfristen är inte verifierad. Kontrollera kommunens aktuella information.
  kalla_url: https://morakommun.se/uppleva-och-gora/foreningar-och-foreningsstod/soka-foreningsstod/kulturarvsbidrag.html
