- id: vingaker-hyresbidrag
  namn: Hyresbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar med verksamhet för 7–25-åringar som behöver hyra en extern lokal eller anläggning
  deadlines:
    typ: fasta
    datum: ['08-25']
  krav:
  - Föreningen ska bedriva barn- och ungdomsverksamhet för åldersgruppen 7–25 år
  - Föreningen ska ha ett särskilt behov av en extern lokal eller anläggning för en ändamålsenlig verksamhet
  - Möjligheten att använda en kommunal lokal till subventionerad hyra ska alltid prövas först
  - Hyreskontrakt och årshyra för inom- eller utomhusanläggningen ska redovisas
  - Årsmötesprotokoll, verksamhetsberättelse, balans- och resultaträkning samt revisionsberättelse ska lämnas om kommunen inte redan har dem
  - Föreningsregistrets uppgifter och medlemsförteckningen över bidragsberättigade ungdomar ska vara uppdaterade
  belopp: Kommunens anslag för hyresbidrag fördelas proportionellt mellan de godkända sökandena
