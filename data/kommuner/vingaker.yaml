- id: vingaker-sponsring
  namn: Sponsring till föreningar och organisationer
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *allatyper
  malgrupp: Ideella föreningar och organisationer som ger kommunen tydlig exponering genom elitidrott eller publikdragande arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sponsringen ska riktas till en förening eller organisation och får inte betalas till en individuell idrottare
  - Aktiviteten eller evenemanget ska vara publikt och vända sig till allmänheten
  - Insatsen ska ge ömsesidig nytta och stärka Vingåkers kommuns varumärke genom en affärsmässigt värderad motprestation
  - Kommunen ska exponeras i annonser, affischer, programblad, kläder, skyltar eller på annat överenskommet sätt
  - Ett skriftligt avtal ska ange åtagande, motprestation och uppföljning och får omfatta högst ett år eller ett evenemang
  - Föreningen ska rapportera resultat och exponering; utbetald sponsring ska återbetalas om arrangemanget ställs in eller verksamheten upphör
  belopp: Individuellt beslutad sponsring i kontanta medel, varor eller tjänster efter målgrupp, publik, uppmärksamhetsvärde och medial exponering
