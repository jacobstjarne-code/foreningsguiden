- id: vingaker-socialnamndens-basbidrag
  namn: Socialnämndens basbidrag
  status: aktiv
  kategori: [social, pensionar, funktionsratt, ovrig]
  foreningstyp: [social, annat]
  malgrupp: Ideella föreningar och organisationer som arbetar inom socialnämndens område för kommuninvånare, särskilt utsatta grupper
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
  - Sökanden ska vara en ideell förening med organisationsnummer, stadgar, styrelse och revisorer och vara ansluten till riksorganisation om sådan finns
  - Verksamheten ska ligga inom socialnämndens område, bedrivas i Vingåkers kommun och vara öppen och demokratiskt uppbyggd
  - Föreningen ska ha minst fem betalande medlemmar bosatta i Vingåkers kommun och ta ut medlemsavgift
  - Antagna stadgar, resultat- och balansräkning, verksamhets- och revisionsberättelse samt aktuell styrelse- och revisorsförteckning ska bifogas
  - Ansökan ska ange plus- eller bankgiro, uppdaterade föreningsuppgifter samt antal betalande kommunmedlemmar under respektive över 20 år
  - Föreningen ska ha en drogpolicy och redovisa andra sökta stöd samt hur tidigare kommunstöd har använts
  belopp: 1 000 kr i grundbelopp plus 25 kr per betalande medlem bosatt i kommunen; förening med säte utanför kommunen får halvt grundbelopp vid dokumenterad lokal verksamhet
