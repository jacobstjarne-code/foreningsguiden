- id: vingaker-driftbidrag
  namn: Driftbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar som driver en egen anläggning eller sköter en kommunal anläggning på uppdrag
  deadlines:
    typ: fasta
    datum: ['08-25']
  krav:
  - Föreningen ska ansvara för driften av en egen anläggning eller helt eller delvis sköta en kommunägd anläggning på kommunens uppdrag
  - Anläggningen ska användas regelbundet i föreningens huvudsakliga verksamhet
  - Anläggningen ska vara tillgänglig för andra föreningar och kommunens invånare
  - Ansökan ska redovisa faktiska kostnader för perioden 1 augusti föregående år till 31 juli innevarande år
  - Stödgrundande kostnader är ränta, el, vatten, försäkring, renhållning, arrende, drivmedel, underhåll och mindre reparationer
  - Årsmötesprotokoll, verksamhetsberättelse, balans- och resultaträkning samt ägarhandling eller hyresavtal ska lämnas om kommunen inte redan har dem
  belopp: Fördelas i förhållande till föreningens verifierade faktiska driftskostnader inom kommunens årliga anslag
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan för innevarande år ska lämnas senast 25 augusti; sena ansökningar behandlas inte
