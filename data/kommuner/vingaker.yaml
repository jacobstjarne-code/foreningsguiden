- id: vingaker-aktivitetsstod
  namn: Aktivitetsstöd
  status: aktiv
  kategori: [idrott, kultur, funktionsratt, ovrig]
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Registrerade föreningar med ledarledd verksamhet för barn och unga 7–25 år
  deadlines:
    typ: fasta
    datum: ['02-25', '08-25']
  krav:
  - Föreningen ska vara registrerad i kommunens föreningsregister och uppfylla de allmänna kraven på ideell, demokratisk och lokalt samhällsnyttig verksamhet
  - Aktiviteten ska vara ledarledd och uppfylla Riksidrottsförbundets gällande föreskrifter för lokalt aktivitetsstöd
  - Deltagarna ska normalt vara 7–25 år; de särskilda åldersreglerna för verksamhet för personer med funktionsnedsättning följer RF:s föreskrifter
  - Föreningen ska redovisa antal sammankomster och deltagartillfällen uppdelat på period, kön och ålder
  - Redovisningen ska intygas av ordförande och kassör och kunna styrkas med närvarounderlag
  - Barn- och ungdomsverksamheten ska vara drogfri och följa barnkonventionen samt, för idrott, RF:s antidopningsregler
  belopp: Belopp enligt Riksidrottsförbundets gällande LOK-stödsföreskrifter; kommunen publicerar ingen egen generell kronnivå
