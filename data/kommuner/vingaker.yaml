  krav:
  - Föreningen ska äga eller långsiktigt hyra eller arrendera anläggningen i Vingåkers kommun
  - Investeringen ska avse ny-, till- eller ombyggnad, förbättring eller reparation, fast inredning eller en förstudie inför aktivitet eller arrangemang
  - Ansökan ska beskriva investeringen, planerat genomförande och vilken anläggning som berörs
  - En specificerad kostnadsberäkning, finansieringsplan, egen insats och sökt belopp ska redovisas
  - Årsmötesprotokoll, verksamhetsberättelse, balans- och resultaträkning, revisionsberättelse och ägarhandling eller hyresavtal ska lämnas
  - Genomförd investering ska redovisas efter verksamhetsårets slut
