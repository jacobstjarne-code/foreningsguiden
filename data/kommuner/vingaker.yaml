  kategori: [social, pensionar, funktionsratt, ovrig]
  foreningstyp: [social, annat]
  malgrupp: Föreningar som ordnar aktiviteter för boende eller andra av socialnämndens målgrupper
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
  - Föreningen ska uppfylla socialnämndens allmänna villkor och verksamheten ska riktas till nämndens målgrupper
  - Avgiftsfri lokal förutsätter att verksamheten till stor del riktas till boende på Sävstagården eller Ekgården och Humlegården och planeras i samverkan med kommunen
  - Upplåtelsen får inte inkräkta på kommunens egen verksamhet
  - Nettohyra gäller för förening som får bidrag av socialnämnden eller kommunens kultur- och fritidsverksamhet och som inte har särskilda avtalsvillkor
  - Vid entrébelagt evenemang tas alltid den högre ordinarie hyran ut
