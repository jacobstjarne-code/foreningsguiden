    datum: ['03-31']
  krav:
  - Föreningen ska uppfylla socialnämndens allmänna villkor för ideell, demokratisk och lokalt verksam organisation
  - Insatsen ska avlasta kommunens ansvar, ge direkt stöd till utsatta grupper eller erbjuda aktivering, självhjälp, intressebevakning eller andra samhällsnyttiga aktiviteter
  - Ett ettårigt avtal ska beskriva vad föreningen åtar sig, stödets form och storlek samt parternas uppföljning
  - Ansökan ska innehålla verksamhets- och ekonomihandlingar, aktuell planering och de uppgifter som krävs för basbidraget
  - Stödet ska användas för det avtalade ändamålet och verksamhetsförändringar ska omgående meddelas kommunen
