  anteckning: 'SAKNADES I FÖREGÅENDE VERSION — tillagd vid korrigerande omkörning 2026-07-20 (RESEARCH_SPEC_v2.md §2.7, samlat
    bidrag). Kommunen förvaltar minst 22 stiftelser/fonder, varav minst 13 är sökbara med gemensamt ansökningsdatum 31 mars
    (övriga 8 är märkta ''Kan ej sökas'' — tilldelas internt av sektorschef/rektor/enhetschef, i huvudsak elevfonder för enskilda
    studenter, och ingår inte här; ytterligare en, Per Ahlquists donationsfond, administreras via extern huvudman och är utelämnad
    enligt §2.4/§4). Av de sökbara stiftelserna tillåter flera uttryckligen både privatpersoner och föreningar att söka (verifierat
    vid denna körning: Stiftelsen Söderhamns sociala fond — föreningar som arbetar socialt bland barn/vuxna med särskilt stödbehov,
    10 256 kr 2025; Stiftelsen Wennströmska minnesfonden — Söderhamn-Sandarne församling, 232 157 kr 2026; Stiftelsen Edlingska
    fonden — Söderhamn-Sandarne församling, 35 011 kr 2026; Stiftelsen Frida Bodells fond — Skogs församling, 12 952 kr 2025).
    Belopp och exakt målgrupp varierar per stiftelse — se respektive stiftelses undersida under kalla_url. Beslut fattas i
    juni, i huvudsak av Barn- och lärandenämndens presidium.'
  senast_verifierad: '2026-08-03'
