  - Lokalen ska uppfylla skäliga krav på god standard och säkerhet
  - Lokalen ska minst vara tillgänglighetsanpassad med rullstolsramp, RWC och teleslinga
  - Lokalen ska hållas tillgänglig för varje organisation eller grupp med organiserad verksamhet på orten, opartiskt och på
    skäliga villkor
  - Det ska finnas goda ekonomiska förutsättningar att driva och förvalta lokalen
  - Ingen verksamhet som strider mot lag eller annan författning får förekomma i lokalen
