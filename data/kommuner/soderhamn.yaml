- id: soderhamn-bidragsberattigad-forening
  vad: Bli bidragsberättigad förening
  beskrivning: 'Föreningen ska uppfylla Skatteverkets krav för en allmännyttig ideell förening: syftet ska vara till nytta
    för allmänheten, minst 90 procent av verksamheten ska bidra till att uppfylla föreningens syfte, minst 80 procent av inkomsterna
    ska användas till detta syfte, och föreningen ska vara öppen för alla som vill bli medlemmar. Därutöver krävs minst 10
    medlemmar som betalar medlemsavgift, säte och stämma i Söderhamns kommun, samt styrelse och revisorer valda på årsmöte.
    Föreningar som bedriver barn- och ungdomsverksamhet ska ha en nedtecknad policy mot alkohol, narkotika, doping och tobak
    (ANDT-policy).'
  system: Rbok
