- id: soderhamn-elitbidrag
  namn: Elitbidrag
  kategori:
  - idrott
  malgrupp: Idrottsföreningar i Söderhamns kommun med representation på seniornivå inom högsta nationella serie eller motsvarande,
    anslutna till något av Riksidrottsförbundets 72 specialidrottsförbund
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidraget omfattar endast verksamhet med representation på seniornivå
  - Bidrag kan endast ges till föreningar, inte individuella idrottare
  - Föreningen ska tillhöra något av Riksidrottsförbundets 72 specialidrottsförbund
  - 'Idrott ska utövas på högsta nationella nivå (lagidrott: representation i högsta nationella serie eller motsvarande; individuell
    idrottare: lägst nationell seniormästerskapsnivå och topp 5 i Sverige föregående år)'
  - Föreningen eller idrottaren ska exponeras i regional och nationell media
  - Föreningen ska bifoga dokumentation på föreningens ekonomiska status
  - Föreningen medger motprestationer, t.ex. exponering av kommunens platsstärkande budskap på arena eller matchdräkt
  belopp: null
  belopp_avser: okand
  kommunens_pott: "Pott 1: 10% delas lika; pott 2: 65% till lagidrotter; pott 3: resterande"
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.soderhamn.se/download/18.7fcd969d198e5faf46d1c02a/1756813757946/Regelverk%20f%C3%B6r%20elitbidrag%20SKFS%2008:2025:01.pdf
  belopp_status: okand
  deadline_status: olast
  krav_status: olast
  krav_fullstandiga: null
  anteckning: 'KONFLIKT VID DUBBELHÄMTNING (föregående version): en automatisk sammanfattning av kommunens webbsida angav
    ''sista ansökningsdag 20 november 2025''. Det officiella regelverket (antaget av kommunstyrelsen 2025-08-05) anger endast
    att elitbidrag ''kan sökas och beviljas en gång per år'' via kommunens e-tjänst, utan fast kalenderdag — kommunstyrelsen
    beslutar årligen om bidragets storlek i samband med budgetbeslutet. Ingen fast deadline kunde verifieras i primärkällan,
    satt till löpande. Kontrollerad på nytt vid omkörning 2026-07-20, ingen ny avvikelse hittad. Fördelningsmodell: 10 procent
    av anslaget (pott 1) delas lika mellan alla mottagare, 65 procent (pott 2) mellan mindre och större lagidrotter, resterande
    (pott 3) mellan större lagidrotter.'
  senast_verifierad: '2026-08-03'
- id: soderhamn-foreningsmiljonen-medlem
  namn: 'Föreningsmiljonen: medlemsrekrytering'
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Alla bidragsberättigade föreningar i Söderhamns kommun, för aktiviteter i syfte att öka medlemsantalet, riktade
    till barn och unga (prioriterad grupp 6–25 år samt fysiskt inaktiva och underrepresenterade grupper)
  deadlines:
    typ: fasta
    datum:
    - 04-30
    - 10-31
  krav:
  - Aktiviteterna ska vara öppna för alla barn och unga i Söderhamns kommun
  - Aktiviteterna ska vara kostnadsfria för deltagarna
  - Aktiviteterna ska registreras i appen SHMN.NU
  - Utgifterna ska vara direkt kopplade till aktiviteten, inte föreningens löpande eller ordinarie verksamhet
