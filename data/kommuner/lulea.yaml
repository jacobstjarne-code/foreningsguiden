  - Idrottsföreningar ska vara anslutna till godkänd riksorganisation; övriga föreningar ska anmäla sig till kultur- och fritidsförvaltningen
    innan ansökan
  belopp: 5 kr per deltagartillfälle (6–20 år), 10 kr per deltagartillfälle för personer med funktionsnedsättning, 5 kr per
    deltagartillfälle för ledare 13–25 år
