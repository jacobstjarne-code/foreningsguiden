    datum:
    - 02-25
    - 08-25
  krav:
  - Gruppen ska bestå av minst 3 och högst 30 deltagare
  - Aktiviteten ska vara ledarledd av minst en ledare som fyllt 13 år och är medlem i föreningen; ledaren får inte ansvara
    för flera gruppaktiviteter samtidigt
