- id: enkoping-verksamhetsstod
  namn: Årligt verksamhetsstöd
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - idrott
  - kultur
  - social
  - pensionar
  - funktionsratt
  - ovrig
  malgrupp: Bidragsberättigade föreningar; barn, unga och äldre ska premieras i fördelningen av bidrag
  deadlines:
    typ: fasta
    datum:
    - 03-01
  krav:
  - Stödet är retroaktivt och fördelas utifrån föregående kalenderårs verksamhet
  - Föreningar med barn- och ungdomsverksamhet ska kunna redogöra för hur de inkluderat barn och unga
  - Bidrag fördelas utifrån antal aktiviteter och antal deltagartillfällen (aktiv förening)
  - Föreningar med beslutat styrdokument inom barn/unga, demokrati/inflytande, inkludering, miljö/hållbarhet eller trygghet/säkerhet
    kan få upp till 5 % högre stöd (hållbar förening)
  - En aktivitet kräver minst tre deltagare under minst 45 minuter, med en ansvarig person, och får inte vara helt finansierad
    av deltagaravgifter eller andra bidrag
  belopp: Årligen beslutade nivåer per aktivitet och deltagartillfälle; upp till 5 procent tillägg för hållbar förening och ett årligt beslutat lägsta totalbelopp tillsammans med grundstödet
