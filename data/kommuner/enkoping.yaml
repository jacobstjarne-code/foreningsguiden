- id: enkoping-arrangorsstod
  namn: Arrangörsstöd för publika kulturarrangemang
  foreningstyp: [kultur]
  kategori:
  - kultur
  malgrupp: Bidragsberättigade föreningar som planerar och genomför publika kulturarrangemang öppna för allmänheten
  deadlines:
    typ: fasta
    datum:
    - 11-30
    - 04-30
  krav:
  - Arrangemanget ska erbjuda en kulturupplevelse (musik, teater, dans, litteratur, bild och form, film, kulturarv, design,
    spoken word eller liknande) — traditionella firanden kan omfattas om de har ett tydligt kulturellt inslag
  - Arrangemanget ska vara öppet för allmänheten och ha en publik
  - Arrangemanget ska medföra kostnader för föreningen (gage/arvode till kulturutövare eller andra relevanta utgifter)
  - Arrangören ansvarar för eventuella tillstånd och säkerhet
  - Arrangemanget ska marknadsföras med tydlig angivelse av kommunens stöd
  belopp: Upp till 50 % av godkända kostnader; högsta ansökningsbelopp beslutas årligen utifrån kommunens budget
  belopp_avser: per_forening
  sen_ansokan: Sent inkommen ansökan hanteras inte
