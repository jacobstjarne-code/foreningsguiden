- id: enkoping-oppen-aktivitet
  namn: Öppen aktivitet
  foreningstyp: [idrott, kultur, social, ungdom, annat]
  kategori:
  - idrott
  - kultur
  - social
  - pensionar
  - funktionsratt
  - ovrig
  malgrupp: Bidragsberättigade föreningar som erbjuder kostnadsfria prova-på-aktiviteter för barn och unga 9–15 år
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Aktiviteten ska vara gratis och öppen för barn och unga 9–15 år, frivillig och utan krav på prestation eller utrustning
  - Medlemskap får normalt inte krävas; om medlemskap krävs för försäkring får ingen medlemsavgift tas ut
  - Minst två trygga vuxna ska ansvara för aktiviteten och ledarnas aktuella registerutdrag ska kontrolleras
  - Föreningen ska vara bidragsberättigad, delta i kommunens möten och marknadsföra aktiviteten i evenemangskalendern
  - Aktiviteten ska vara fri från mobbning, trakasserier, alkohol, rökning och droger
  - Bidraget söks i efterhand och samma aktivitet får inte finansieras av en annan part
  belopp: 1 000 kronor per genomförd aktivitet; en aktivitet ska ha tydlig start och sluttid och pågå 1–4 timmar
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
