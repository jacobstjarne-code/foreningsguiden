  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökningsperioden är 1 mars–30 juni och kommunens sida publicerar fortfarande 2024 års grundnivå med årlig KPI-justering.
