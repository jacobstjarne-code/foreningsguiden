    från Trafikverket täcker kommunen 13 % av det statsbidragsberättigade beloppet (exkl. moms)
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
  kalla_url: https://enkoping.se/trafik-och-gator/vagbidrag.html
