- id: enkoping-investeringsstod
  namn: Investeringsstöd
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - idrott
  - kultur
  - social
  - pensionar
  - funktionsratt
  - ovrig
  malgrupp: Bidragsberättigade föreningar som äger sin lokal eller anläggning och behöver bygga nytt, bygga om, genomföra
    standardhöjande reparationer eller tillgänglighetsanpassa
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Föreningen måste äga sin lokal/anläggning, eller ha arrendeavtal på minst 5 år om marken inte ägs av föreningen
  - Anläggningen ska vara besiktigad och bedömd lämplig och säker
  - Total utgift måste överstiga ett prisbasbelopp; ej till redan påbörjade projekt
  - Vid utveckling av befintlig anläggning krävs minst 50 bidragsberättigade aktiviteter föregående kalenderår på anläggningen
  - Utbetalning villkoras av säkrad extern medfinansiering
  - Åtgärden ska vara genomförd senast två år efter beslut
  belopp: 40 % av den totala utgiften, dock högst 120 000 kronor (belopp och procentsats kan ändras vid särskilda skäl)
  belopp_avser: per_forening
  sen_ansokan: Sent inkommen ansökan hanteras inte
  kalla_url: https://enkoping.se/fritid-och-kultur/forening-i-enkoping/sok-foreningsbidrag/bidrag-att-soka.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'Ansökningsfönster 15 februari–31 mars. Prioriterade insatser: undanröjer akut hinder, ökar säkerhet/trygghet,
    ökar tillgänglighet, minskar miljöpåverkan, främjar jämställdhet.'
  senast_verifierad: '2026-08-18'
- id: enkoping-lovbidrag
  namn: Stöd för kostnadsfria lovaktiviteter
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - idrott
  - kultur
  - social
  - pensionar
  - funktionsratt
  - ovrig
  malgrupp: Bidragsberättigade föreningar som anordnar kostnadsfria aktiviteter för barn och unga 6–17 år, främst under sommarlovet
  deadlines:
    typ: fasta
    datum:
    - 04-30
    - 10-31
  krav:
  - Aktiviteten ska vara kostnadsfri för deltagarna (6–17 år) och äga rum i Enköping
  - Ingen särskild förkunskap får krävas för deltagande
  - Ansvarig ledare (minst 18 år, utsedd av föreningen) ska vara närvarande
  - Aktiviteten ska registreras i kommunens evenemangskalender
  - Föreningen ska delta i eventuella förberedande möten/utbildningar som förvaltningen arrangerar
  - Ges inte till ordinarie föreningsverksamhet som redan stöds av andra bidrag
  - En majoritet av deltagarna ska bo i Enköpings kommun och aktiviteten ska främja likvärdigt deltagande och möten mellan barn med olika bakgrund
  belopp: Individuellt lovbidrag bedöms efter aktivitetens budget och kan hel- eller delfinansiera godkända kostnader; något fast belopp publiceras inte
