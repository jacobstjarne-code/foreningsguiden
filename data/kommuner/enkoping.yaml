- id: enkoping-vagbidrag
  namn: Kommunalt vägbidrag för enskild väg
  foreningstyp: [annat]
  kategori:
  - ovrig
  malgrupp: Enskilda väghållare, vägföreningar, vägsamfälligheter och samfällighetsföreningar med ansvar för en enskild väg
  deadlines:
    typ: fasta
    datum:
    - 06-30
  krav:
  - Vägen ska normalt vara 400–1000 meter lång (kortare sidovägar kan godkännas om minst 200 m och minst 400 m från allmän
    väg; längre vägar kräver statsbidrag)
  - Minst en permanentbostad ska finnas utmed vägen
  - Vägen ska hållas öppen och farbar för allmän trafik
  - Ansökan ska kompletteras med senaste verksamhetsårets mötesprotokoll och årsredovisning för samfällighetsföreningen/vägföreningen
  - Årlig förnyad ansökan krävs
