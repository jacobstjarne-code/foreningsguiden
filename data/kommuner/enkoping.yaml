  - Kan ej sökas för renovering av byggnader/anläggningar eller större inköp av utrustning/material
  - Nystartade föreningar prioriteras under förutsättning att övriga kriterier är uppfyllda
  - Bidraget får täcka faktiska kostnader för bland annat kommunikation, tillfällig lokal, material, resor och vissa tillfälliga arvoden
