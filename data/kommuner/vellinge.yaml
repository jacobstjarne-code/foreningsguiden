- id: vellinge-evenemangsbidrag
  namn: Evenemangsbidrag
  kategori:
  - kultur
  - idrott
  malgrupp: Förening som arrangerar offentligt evenemang av betydelse för Vellinge kommun.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Evenemanget ska vara av stort intresse för kommunens invånare, öppet för alla och kunna stärka Vellinge kommuns varumärke
  - Arrangören ska visa kunnande, kompetens och förmåga att genomföra ett evenemang av god kvalitet
  - Evenemanget ska vara politiskt och religiöst obundet samt kunna attrahera en stor publik och/eller deltagare i alla åldrar
  - Budget för evenemanget ska bifogas ansökan
  - Bidrag får inte erhållas från flera kommunala instanser för samma projekt
