- id: vellinge-social-verksamhet
  namn: Föreningsbidrag för social verksamhet
  kategori:
  - social
  malgrupp: Förening som bedriver social verksamhet för målgrupper i behov av samhällets stöd.
  foreningstyp: [social]
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Föreningen ska vara ideell, demokratiskt uppbyggd samt religiöst och partipolitiskt obunden
  - Verksamheten ska ha lokal anknytning, rikta sig till Vellingebor inom omsorgsnämndens område och ge mervärde utöver kommunens service
  - Föreningen ska vara öppen för alla inom målgruppen på lika villkor
  - Ungdomsverksamhet ska präglas av ett alkohol- och drogfritt förhållningssätt
  - Verksamhet som helt finansieras genom andra bidrag är inte bidragsberättigad
  - Verksamhetsberättelse, stadgar och redovisning av eventuellt tidigare kommunalt föreningsbidrag ska bifogas
