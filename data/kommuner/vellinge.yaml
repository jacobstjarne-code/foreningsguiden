  - Väghållaren ska ansvara enligt förrättning för de vägar, grönytor eller lekplatser som ansökan avser
  - Bidragsberättigade vägar, grönytor och lekplatser ska vara öppna för allmänheten
  - Nybildade samfälligheter ska bifoga förrättningshandlingar, uppgifter om ytor och lekplatser, kontaktuppgifter samt konto
  - Ekonomisk redovisning med verksamhetsberättelse, resultat- och balansräkning och undertecknad revisionsberättelse ska lämnas årligen
  - För lekplatser krävs årlig säkerhetsbesiktning av certifierad besiktningsperson och inskickat besiktningsprotokoll
