  krav:
  - Föreningen ska ha stadgar godkända av riksorganisation eller kommunen
  - Minst 10 medlemmar som betalar årlig medlemsavgift och regelbundet deltar i verksamheten
  - Föreningen ska ha organisationsnummer med tillhörande post- eller bankgirokonto
  - Verksamheten och huvuddelen av medlemmarna ska finnas i kommunen
