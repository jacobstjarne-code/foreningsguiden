  belopp: Inget fast kronbelopp per förening anges. 17,5 % av kommunens budget för föreningsstöd avsätts till övrig, organiserad
    eller ledarledd barn- och ungdomsverksamhet och fördelas efter ansökan med verksamhetsplan; beslut tas i kultur-, fritids-
