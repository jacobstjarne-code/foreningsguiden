- id: arvidsjaur-upp-ungdomsprojektpengar
  namn: UPP – ungdomsprojektpengar
  kategori:
  - kultur
  - ovrig
  malgrupp: Ungdomar 13–25 år i kommunen, med projekt kopplat till en förening eller annan juridisk person
  deadlines:
    typ: okand
    datum: []
  krav:
  - Sökande ska vara mellan 13 och 25 år
  - Idén presenteras för de UPP-ansvariga, som kan erbjuda stöd och handledning vid behov
  - Projektet ska ha en vuxen samarbetspartner, en ansvarig ungdom och koppling till en förening eller annan juridisk person
  - Ungdomarna ska själva driva och genomföra projektet
  - Efter genomfört projekt krävs en utvärdering samt en rapport om hur pengarna använts
  belopp: En gemensam pott på 50 000 kronor avsedd att användas av och för ungdomar via UPP-projekt. Inget maxbelopp per enskilt
    projekt anges i källan.
  sen_ansokan: Ansökningsfristen är inte verifierad. Kontrollera kommunens aktuella information.
  kalla_url: https://arvidsjaur.se/kulturfritid/ungiarvidsjaur/ungdomsprojektpengar.944.html
  belopp_status: kontrollast
  deadline_status: okand
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan görs genom att presentera sin idé för UPP-ansvariga (Katarina eller Emma, Kultur & fritid); besked lämnas
    inom max 7 dagar. Ingen ansökningsfrist anges i kommunens material.
