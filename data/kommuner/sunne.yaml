- namn: Årsbidrag
  kategori:
  - kultur
  - social
  - pensionar
  - funktionsratt
  - ovrig
  malgrupp: Föreningar med regelbunden verksamhet
  deadlines:
    typ: fasta
    datum:
    - 11-01
  krav:
  - 'Föreningen ska uppfylla kommunens grundregler: aktiv verksamhet och hemvist i Sunne kommun, godkända stadgar, demokratiska
    grunder, minst 1 års verksamhet, aktuell drog- och alkoholpolicy samt registrerat bank- eller plusgiro'
  - Ansökan ska innehålla verksamhetsberättelse, bestyrkt balans- och resultaträkning, revisionsberättelse, redovisning av
    barn- och ungdomsarbete, alkohol- och drogpolicy samt jämställdhetspolicy
  - Antalet medlemmar ska redovisas per kön och åldersintervall (0–6, 7–12, 13–16, 17–20, 21 år och äldre)
  - Årsbidrag måste sökas och beviljas innan föreningen kan söka övriga kommunala bidrag
  - Ansökan lämnas senast 1 november och avser kommande år
  belopp: Grundbidrag 200 kr per föreningssektion, samt 20 kr per aktiv medlem (för föreningar med medlemsavgift på minst
    25 kr) upp till 300 medlemmar; stödmedlemmar räknas inte
  sen_ansokan: Ej angivet i källan
