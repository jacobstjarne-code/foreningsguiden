  id: sunne-sponsring
- namn: Byapeng
  kategori:
  - kultur
  - ovrig
  malgrupp: Icke-kommersiella aktörer utanför Sunne tätort
  deadlines:
    typ: fasta
    datum:
    - 02-28
    - 05-31
    - 09-30
  krav:
  - Sökanden ska vara en icke-kommersiell aktör med fast hemvist utanför Sunne tätort, och insatsen ska genomföras i samma
    område
  - Stöd beviljas inte till insatser riktade till enskilda personer eller företag
  - Insatsen ska bidra till en ekologisk, social och ekonomisk hållbar utveckling av området med strategisk och långsiktig
    inriktning, hög allmännytta och bred lokal förankring
  - Hög andel medfinansiering i pengar, material eller tid värderas, liksom identifiering och undanröjande av hinder mot tillgänglighet
  - Projektet ska slutredovisas inom 24 månader från beslutsdatum, med delredovisning minst var sjätte månad
  - Det går inte att söka byapeng för projekt som redan beviljats kommunal sponsring
  belopp: null
  sen_ansokan: Ej angivet i källan
