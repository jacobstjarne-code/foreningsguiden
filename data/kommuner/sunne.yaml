- namn: Sponsring
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Verksamhet eller evenemang som stärker kommunens varumärke
  deadlines:
    typ: fasta
    datum:
    - 02-14
    - 05-15
    - 09-15
  krav:
  - Den sponsrade ska bedriva samhällsnyttig och tillväxtfrämjande verksamhet som stärker kommunens varumärke, i linje med
    kommunens värdegrund
  - Sponsringen ska riktas till en angiven verksamhet, aktivitet eller evenemang vars målgrupp till stor del nås utanför Sunne
    kommun
  - Den sponsrade ska göra en motprestation i form av en aktiv marknadsförings- eller informationsinsats för kommunens räkning
  - Ett skriftligt avtal tecknas mellan kommunen och den sponsrade innan beviljade medel betalas ut som förskott
  - Företag och kommunalägda bolag sponsras inte, och det går inte att söka sponsring för projekt som redan beviljats byapeng
  belopp: null
