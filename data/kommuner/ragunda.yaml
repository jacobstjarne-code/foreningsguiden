  malgrupp: Lokalt förankrade föreningar som arrangerar kulturprogram eller utvecklar kulturprojekt i Ragunda kommun
  deadlines:
    typ: fasta
    datum:
    - 09-01
  krav:
  - Projektet eller arrangemanget ska ha kulturinnehåll och allmänintresse samt bidra till ett levande och jämställt kulturliv
  - Stödberättigade kostnader omfattar bland annat artistarvoden, medverkandes resor, ljud, ljus och lokalhyra
  - Stöd lämnas inte till arrangörsarvoden, arrangörsresor, stödgalor, intern verksamhet, förtäring, mötesarrangemang, medieproduktion, administration eller religiös eller politisk verksamhet
  - Ansökan ska avse innevarande år och föreningen ska kunna lämna underlag för kommunens kontroll
  belopp: Högst 50 procent av totalkostnaden för arrangemang riktade till vuxna från 20 år och högst 65 procent för barnverksamhet
