      Föreningen ansöker om att bli godkänd som stödberättigad, vilket krävs innan föreningsbidrag kan sökas. Föreningen
      ska ha en vald styrelse, hålla årsmöte, ta ut medlemsavgift och ha antagna stadgar, ha minst 10 medlemmar varav
      merparten folkbokförda i Lidköpings kommun, vara öppen för alla, motverka diskriminering och aktivt verka för
      drogfri verksamhet, vara registrerad hos Skatteverket med organisationsnummer, samt ha registrerat bank- eller
      plusgiro.
