  - id: lidkoping-socialt-arbete-foreningsbidrag
    namn: Socialt arbete, föreningsbidrag
    kategori:
      - social
    malgrupp: Ideella föreningar som bedriver frivilligt socialt arbete i Lidköpings kommun
    deadlines:
      typ: lopande
      datum: []
    krav:
      - Föreningen ska ha en vald styrelse, stadgar och regelbundna möten samt ha ett ideellt syfte
      - Föreningen ska ha huvuddelen av sina medlemmar folkbokförda i Lidköpings kommun
      - Föreningen ska bedriva en verksamhet som motverkar diskriminering och främjar lika rättigheter och möjligheter
      - Föreningen ska aktivt verka för att all verksamhet är drogfri
      - Föreningen ska vara registrerad hos Skatteverket och ha ett organisationsnummer
      - Föreningen ska ha registrerat bank- eller plusgiro
