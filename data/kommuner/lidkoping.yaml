      - ovrig
    malgrupp: >-
      Stödberättigade föreningar med verksamhet för barn och unga 7–25 år; barn/unga och personer med
      funktionsnedsättning prioriteras
    deadlines:
      typ: lopande
      datum: []
    krav:
      - Föreningen ska vara godkänd som stödberättigad innan ansökan
      - Minst 10 aktiva medlemmar i åldersgruppen krävs för att bidrag ska betalas ut
      - Aktiv medlem = deltagit vid minst 8 ledarledda sammankomster under kalenderåret
      - Föreningen ska vara godkänd som stödberättigad av Lidköpings kommun innan ansökan
