- id: vaxholm-lokalbidrag-barn-och-utbildningsnamnden
  namn: Lokalbidrag inom barn- och utbildningsnämndens område
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Lokala ideella föreningar vars verksamhet kompletterar utbildningsförvaltningen och gagnar Vaxholms barn och ungdomar
  deadlines: {typ: fasta, datum: [02-28]}
  krav:
  - Föreningen ska vara en lokalt verksam ideell förening med minst tio aktiva medlemmar och verksamhet som kompletterar och tillför mervärde inom barn- och utbildningsnämndens område
  - Verksamheten ska vara inriktad på Vaxholms barn och ungdomar och föreningens medlemmar ska stadigvarande bo i kommunen
  - Föreningen ska ha medlemsvald styrelse, demokratiska stadgar, vara öppen för alla och bedriva ett aktivt jämställdhetsarbete som beskrivs i verksamhetsberättelsen
  - Föreningen ska följa barnkonventionen, ha en tillämpad policy mot alkohol, narkotika och tobak samt bedriva verksamhet fri från mobbning, trakasserier, hot, våld och övergrepp
  - Lokal eller anläggning ska användas för föreningsverksamheten och kommunal lokal ska saknas eller särskilda skäl föreligga
  - Ansökan ska redovisa lokalens godkända kostnader och hyresintäkter; samma kostnad får inte ersättas av flera kommunala nämnder
  - Föreningen ska årligen lämna en revisorsgranskad verksamhetsberättelse som visar hur bidraget har använts
  belopp: 30 procent av godkända kostnader för hyra, markarrende, el och uppvärmning, vatten, sopor samt vissa räntor och försäkringar; hyresintäkter dras av
  belopp_avser: per_forening
