- id: vaxholm-lokalbidrag
  namn: Lokalbidrag – idrotts- och friluftsföreningar
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: &idrott_friluft [idrott, friluft]
  malgrupp: Bidragsberättigade idrotts- och friluftsföreningar som hyr eller äger lokal eller anläggning när kommunal lokal saknas
  deadlines: {typ: fasta, datum: [02-01]}
  krav:
  - Föreningen ska vara en registrerad ideell idrotts- eller friluftsförening som huvudsakligen verkar i Vaxholm för kommunens invånare och har minst tio aktiva medlemmar
  - Föreningen ska ha demokratisk styrelse och stadgar, vara öppen för alla, sakna oreglerade kommunskulder och hålla verksamhetsberättelse, årsmötesprotokoll och ekonomisk redovisning aktuella i Rbok
  - Föreningen ska hyra eller äga lokalen eller anläggningen därför att kommunal lokal inte finns att tillgå eller därför att särskilda skäl föreligger
  - Lokalen ska användas för föreningsverksamhet; vid exklusiv hyra av kommunal fastighet är endast hyra som avser barn- och ungdomsverksamheten stödgrundande
  - Stödgrundande kostnader och hyresintäkter ska redovisas; hyresintäkterna räknas av från stödet
  - Barn- och ungdomsföreningar ska följa barnkonventionen och ha en tillämpad policy mot alkohol, narkotika och tobak
  belopp: 30 procent av godkända kostnader för hyra, markarrende, el och uppvärmning, vatten, sopor samt vissa räntor och försäkringar; hyresintäkter dras av
