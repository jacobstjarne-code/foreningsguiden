- id: vaxholm-aktivitetsbidrag
  namn: Aktivitetsbidrag
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: *idrott_friluft
  malgrupp: Bidragsberättigade idrotts- och friluftsföreningar med aktiviteter för barn och ungdomar 7–20 år
  deadlines: {typ: fasta, datum: [02-28, 08-30]}
  krav:
  - Föreningen ska vara registrerad, ideell och demokratiskt uppbyggd, huvudsakligen verksam i Vaxholm och ha minst tio aktiva medlemmar samt inga oreglerade skulder till kommunen
  - Aktiviteten ska vara planerad och ledarledd, pågå i minst 60 minuter och samla minst fem deltagare utöver ledaren
  - Deltagarna ska vara 7–20 år och ledaren ska vara utsedd av föreningen och minst 13 år
  - Föreningen ska redovisa minst tio godkända sammankomster under ansökningsperioden; stöd ges högst en gång per dag och grupp
  - Närvaro ska rapporteras i Rbok eller via Riksidrottsförbundets kommunfil senast den 25 februari respektive den 25 augusti
  - Föreningen ska hålla senaste verksamhetsberättelse, årsmötesprotokoll och ekonomiska redovisning aktuella samt följa barnkonventionen och sin policy mot alkohol, narkotika och tobak
  belopp: Ett årligen fastställt grundbelopp per sammankomst plus en årligen fastställd deltagarpeng per sammankomst
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan för höstterminen ska lämnas senast den 28 februari följande år och för vårterminen senast den 30 augusti samma år; sena ansökningar behandlas inte
