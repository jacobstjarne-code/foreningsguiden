- id: vaxholm-lokalsubvention
  namn: Subventionerad föreningstaxa i kommunala idrottslokaler
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: *idrott_friluft
  malgrupp: Bidragsberättigade Vaxholmsföreningar som bokar sporthallar, gymnastiksalar och andra motionsanläggningar
  deadlines: {typ: okand, datum: []}
  krav:
  - Föreningen ska uppfylla nämndens grundkrav och vara registrerad som bidragsberättigad ideell idrotts- eller friluftsförening i Vaxholm
  - Föreningen ska ha demokratisk styrelse och stadgar, minst tio aktiva medlemmar, inga oreglerade kommunskulder och aktuella årshandlingar i Rbok
  - Lokalen ska vara en av stadens sporthallar, gymnastiksalar eller andra motionsanläggningar och bokningen ska göras i kommunens bokningssystem
  - Föreningen ska uppfylla villkoren i kommunens årligen beslutade taxor och avgifter; staden kontrollerar behörigheten i samband med fördelning av säsongstider
  - Föreningar med barn- och ungdomsverksamhet ska följa barnkonventionen och sin policy mot alkohol, narkotika och tobak
