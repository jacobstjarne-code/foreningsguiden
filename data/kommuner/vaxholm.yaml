- id: vaxholm-socialnamndens-foreningsbidrag
  namn: Föreningsbidrag från socialnämnden
  status: aktiv
  kategori: [social, funktionsratt, pensionar]
  foreningstyp: [social, annat]
  malgrupp: Ideella föreningar med verksamhet som kompletterar socialtjänsten och riktar sig till Vaxholmsbor
  deadlines: {typ: fasta, datum: [12-31]}
  krav:
  - Föreningen ska vara en juridisk person med organisationsnummer och ha plusgiro, bankgiro eller bankkonto i föreningens namn
  - Verksamheten ska ha relevans för socialnämndens ansvarsområde och bedrivas i Vaxholm eller rikta sig till medlemmar eller hjälpsökande som bor i kommunen
  - Föreningen ska ha demokratiska stadgar, styrelse och revisorer, vara öppen för målgruppen och arbeta för jämställdhet, delaktighet, lika rättigheter och barnkonventionen
  - Verksamheten får inte vara partipolitisk, religiös, vinstdriven, droguppmuntrande, diskriminerande eller motarbeta det demokratiska styrelseskicket
  - Ansökan ska beskriva mål och inriktning samt antal medlemmar eller hjälpsökande i Vaxholm och innehålla verksamhetsplan med budget
  - Efter årsmötet ska senaste verksamhetsberättelse, resultat- och balansräkning, undertecknad revisionsberättelse och årsmötesprotokoll lämnas senast den 30 april
  - Beviljat bidrag ska kunna redovisas och väsentliga förändringar ska rapporteras utan dröjsmål
  belopp: Individuellt beslutat inom socialnämndens årliga budget utifrån verksamhetens relevans och nytta samt antalet medlemmar eller hjälpsökande i Vaxholm
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan för kommande år ska vara inne senast den 31 december; ofullständiga handlingar kompletteras efter årsmötet men senast den 30 april och sena ansökningar behandlas inte
