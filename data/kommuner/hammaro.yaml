  malgrupp: Föreningar med aktiviteter för deltagare 7–25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - En gruppaktivitet ska omfatta minst tre deltagare och högst 20 deltagare per ledare; två ledare ska alltid finnas och minst en ska vara vuxen
  - Aktiviteten ska vara planerad, pågå minst 1 timme och innehålla gemensam samling och avslutning
  - Förening ska ha minst 5 godkända, redovisade gruppaktiviteter per termin (halvår)
  - Deltagare ska vara 7–25 år; ledare 13–25 räknas och för deltagare med funktionsnedsättning finns ingen övre åldersgräns
  - Samma person får bara räknas en gång per dag och förening och närvarounderlag eller RF-fil ska lämnas
  - Bidrag utgår inte till studiecirkelsammankomster, entrébelagda tävlingar eller kommersiella arrangemang
  belopp: Årligt fastställt belopp per deltagartillfälle; 2026 års nivå publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: '1–7 dagar sent: 10 procents avdrag; 8–14 dagar: 50 procents avdrag; senare ansökan behandlas inte.'
