forutsattningar:
- id: svenljunga-godkand-forening
  vad: Godkänd och registrerad ideell förening
  beskrivning: Föreningen ska vara verksam i Svenljunga kommun sedan minst sex månader, ha minst tio medlemmar i medlemsregister och ta ut minst 25 kronor i årsavgift. Den ska ha årsmötesantagna stadgar, demokratiskt vald styrelse, organisationsnummer och vara öppen, jämställd och icke-diskriminerande. Byalag och samlingslokaler är undantagna medlemskravet.
  system: Svenljungas föreningsregister
  ledtid: 180
