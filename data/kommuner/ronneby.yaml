  malgrupp: Föreningsmedlemmar för utbildning och kompetensutveckling
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska ha redovisat aktiviteter och medlemsantal i åldern 0-25 år
  - Bidraget söks och kan beviljas innan genomförd utbildning
  - Underlag med kursprogram, kursintyg och kvitto på kursavgift ska redovisas efter genomförd utbildning för att bidraget
    ska betalas ut
  - Omfattningen av kurs/utbildning ska vara 1-14 dagar och minst 4 timmar per dag
  - Bidrag beviljas inte för medverkan på konferens, förbundsmöte eller läger
