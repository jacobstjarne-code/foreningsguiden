    belopp_status: kontrollast
    deadline_status: kontrollast
    krav_status: kontrollast
    krav_fullstandiga: true
    anteckning: >-
      Stödberättigande kostnader: hyra/arrende, ränta avseende lån, värme, el, renhållning/sotning/vatten/avlopp,
      fastighetsförsäkring, vägavgift, bredband (kategori A, max 50 %); taxa i annan kommun samt kostnad för fordon helt
      nödvändigt för aktiviteten (kategori B, max 30 %). Stödet omfattar inte investeringar, hyra i andra hand, eller
      redan kommunalt subventionerade lokaler. Ansökan ska ha fakturakopior bifogade. Utbetalning senast 31 maj,
      engångsbelopp om inget annat meddelas.
