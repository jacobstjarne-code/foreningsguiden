bidrag:
  - id: kungalv-lok-stod
    ansokningsvag: "En separat kommunal ansökan eller aktivitetsredovisning krävs via Kommunens e-tjänst (Självservice och Mina sidor); RF-rapporteringen räcker inte ensam."
    namn: Kommunalt lokalt aktivitetsstöd (LOK-stöd)
    kategori:
      - idrott
      - funktionsratt
      - ovrig
    malgrupp: >-
      Föreningar som bedriver verksamhet för barn och ungdomar 7–20 år samt personer med funktionsnedsättning (ingen
      övre åldersgräns)
    deadlines:
      typ: fasta
      datum:
        - 08-25
        - 02-25
    krav:
      - Föreningen ska ha barn- och ungdomsverksamhet för åldersgruppen 7–20 år, alternativt paraidrottsverksamhet
      - Minst tre deltagare utöver ledare per redovisad sammankomst
      - Alla sammankomster ska ske i alkohol-, drog- och rökfri miljö
      - >-
        För e-sportsföreningar: spelarna och ledaren/coachen ska befinna sig i samma spel, aktiviteten arrangerad av
        föreningen
      - >-
        Föreningen ska bedriva ideell verksamhet inom Kungälvs kommuns geografiska område och fungera enligt
        demokratiska principer
      - >-
        Föreningen ska ha årsmötesgodkända stadgar, vald styrelse med minst tre personer, revisorer och
        organisationsnummer
      - Föreningen ska ha ett bankkonto registrerat i föreningens namn och finnas i kommunens föreningsregister
      - Föreningen ska redovisa minst sex bidragsberättigade sammankomster per år
      - >-
        Föreningen får inte bedriva eller främja våld, diskriminering, antidemokratiskt agerande eller bruk av alkohol,
        tobak eller droger
    belopp: Belopp beslutas individuellt; kommunen publicerar inget fast belopp
    sen_ansokan: Ej angivet i källan
    kalla_url: >-
      https://www.kungalv.se/siteassets/dokument/kommun-och-politik/styrdokument/kultur-fritid-foreningar/riktlinje-for-forenings--och-studieforbundsstod.pdf
    belopp_status: ingen_regel
    deadline_status: kontrollast
    krav_status: kontrollast
    krav_fullstandiga: true
    anteckning: >-
      Stödet ges endast för aktiva medlemmar, max 30 deltagare per sammankomst räknas bidragsgrundande, och samma
      deltagare i flera sammankomster samma dag i samma förening räknas bara en gång. Fester, läxläsning,
      högtidsfirande, religiösa studier, skolverksamhet och studiecirklar är inte stödberättigade. Statligt lokalt
      aktivitetsstöd söks separat av föreningen enligt Riksidrottsförbundets/specialförbundens anvisningar
      (IdrottOnline) — det är ett annat stöd än den kommunala delen. Redovisning sker via systemet APN (Aktivitetskort
      på nätet): period jan–juni redovisas senast 25 augusti, period jul–dec senast 25 februari påföljande år. Beloppet
      utbetalas per halvår; kvarvarande medel i potten fördelas ibland som fyllnadsutbetalning, aldrig garanterat.
    senast_verifierad: '2026-08-17'
    belopp_avser: per_forening
    kommunens_pott: null
