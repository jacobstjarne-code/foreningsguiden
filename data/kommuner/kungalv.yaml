    beskrivning: >-
      För att erhålla föreningsstöd måste föreningen säkerställa att alla som anställs eller har uppdrag i föreningen
      med direkt och regelbunden kontakt med barn har begärt begränsat registerutdrag ur belastningsregistret hos
      Polisen vid nytillsättning. Föreningen kontrollerar utdraget, dokumenterar att kontrollen genomförts, och
