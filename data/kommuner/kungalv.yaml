      - friluft
      - social
      - ungdom
      - annat
  - id: kungalv-driftstod-idrott
    namn: Driftstöd för idrotts- och friluftslivsverksamhet
    kategori:
      - idrott
    malgrupp: >-
      Idrotts- och friluftsföreningar med huvudsaklig inriktning på barn- och ungdomsverksamhet (7–20 år) som äger eller
      hyr sin anläggning/lokal (hyreskontrakt minst ett år) i Kungälvs kommun
    deadlines:
      typ: fasta
      datum:
        - 02-28
    krav:
      - Föreningen ska ha sitt största fokus på åldersgruppen 7–20 år
      - Endast lokalyta exklusiv för verksamheten är bidragsgrundande
      - >-
        Fastigheten/anläggningen ska vara geografiskt placerad i Kungälvs kommun och uppfylla myndighetskrav (bygglov,
        brandsäkerhet, försäkring)
      - Föreningen ansöker samtidigt om lokalt aktivitetsstöd (LOK-stöd)
      - >-
        Föreningen ska bedriva ideell verksamhet inom Kungälvs kommuns geografiska område och fungera enligt
        demokratiska principer
      - >-
        Föreningen ska ha årsmötesgodkända stadgar, vald styrelse med minst tre personer, revisorer och
        organisationsnummer
      - Föreningen ska ha ett bankkonto registrerat i föreningens namn och finnas i kommunens föreningsregister
      - Föreningen ska redovisa minst sex bidragsberättigade sammankomster per år
      - >-
        Föreningen får inte bedriva eller främja våld, diskriminering, antidemokratiskt agerande eller bruk av alkohol,
        tobak eller droger
    belopp: >-
      Kategori 1–2 (egen anläggning eller verksamhet utan anläggning): max 50 % av sökt bidragssumma. Kategori 3
      (kommunal anläggning): max 30 % av sökt bidragssumma. Procentsatsen beror på budget och antal sökande och kan
      variera år till år
    sen_ansokan: Ej angivet i källan
