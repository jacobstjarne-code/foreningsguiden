  krav_status: kontrollast
  krav_fullstandiga: true
  belopp_avser: per_forening
  anteckning: Verksamhetsbidrag kan även omfatta förebyggande eller social stödverksamhet som inte består av regelbundna medlemsaktiviteter.
  senast_verifierad: '2026-08-18'
