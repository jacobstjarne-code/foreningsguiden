- id: sigtuna-verksamhetsbidrag-social
  namn: Verksamhetsbidrag — socialnämndens föreningsbidrag
  foreningstyp: [social, ungdom, annat]
  kategori:
  - social
  malgrupp: Ideella föreningar vars verksamhet riktar sig till barn/unga i social utsatthet, personer med missbruksproblematik,
    vålds- eller brottsutsatta, anhöriga till dessa grupper, nyanlända barn och vuxna, eller personer som saknar egen försörjning
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Föreningen ska vara registrerad i Sigtuna kommuns föreningsregister och ha bank- eller plusgiro i föreningens namn
  - Verksamheten ska rikta sig till minst en av socialnämndens publicerade målgrupper
  - Verksamheten ska komplettera socialnämndens ordinarie verksamhet
  - Föreningen ska beskriva hur den säkrar god kvalitet, hanterar känsliga personuppgifter och agerar när barn riskerar att fara illa
  - Ansökan ska redovisa andra sökta bidrag och hur verksamheten förhåller sig till andra aktörers insatser
  - Föreningar med barn- och ungdomsverksamhet ska bifoga riktlinjer mot droger, mobbning, trakasserier, rasism och kränkande behandling samt arbeta förebyggande med ANDTS
  - Ansökan om lokalkostnader kräver ett behov av anpassad lokal som kommunen inte kan erbjuda och en skriftlig SBA-plan
  - Föreningen ska redovisa tidigare beviljat stöd innan nytt bidrag kan beslutas
  belopp: Socialnämnden publicerar inget fast individuellt belopp för verksamhetsbidraget
  sen_ansokan: Senast 30 november året före verksamhetsåret
