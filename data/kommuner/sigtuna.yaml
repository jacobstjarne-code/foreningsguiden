- id: sigtuna-projekt-ovrig-fritid
  namn: Bidrag till projekt och/eller övrig verksamhet – fritid
  foreningstyp: [idrott, friluft, ungdom, annat]
  kategori:
  - idrott
  - ovrig
  malgrupp: Idrotts- och fritidsföreningar med projekt eller övrig verksamhet
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökanden ska vara en fritids- eller idrottsförening
  - Insatsen ska komplettera kommunens övriga bidragsformer
  - Insatsen ska avse exempelvis inkludering, jämställdhet, tillgänglighet, folkhälsa, skolsamverkan, försöksverksamhet, inventarier eller ett viktigt arrangemang
  - Projekt för integration och inkludering uppmuntras särskilt
  - Ett arrangemang ska vara offentligt, rikta sig till allmänheten och genomföras i Sigtuna kommun
  - Ansökan kan behöva kompletteras med verksamhetsbeskrivning, projektplan eller motsvarande
  - Pensionärsorganisationer söker i stället stöd hos vård- och omsorgsnämnden
  - Ansökan efter avslutad aktivitet ska lämnas senast en månad efter genomförandet
  belopp: Kommunens aktuella sida publicerar inget fast individuellt maxbelopp för bidraget
  sen_ansokan: Ansökan efter genomförd aktivitet ska ha kommit in senast en månad efter genomförandet
