- id: sigtuna-ledarutbildningsbidrag-fritid
  namn: Ledarutbildningsbidrag – fritid
  foreningstyp: [idrott, friluft, ungdom, annat]
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med ungdomsverksamhet vars ledare genomgår utbildning
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningens verksamhet ska rikta sig till barn och unga upp till 25 år
  - Utbildningen ska vara anordnad av en riks- eller distriktsorganisation eller arrangerad av en lokal förening
  - Föreningen ska välja billigaste färdsätt och redovisa samtliga faktiska kostnader
  - Kursprogram ska bifogas ansökan
  - Kursintyg eller annat underlag som styrker deltagandet ska bifogas
  - Kursfaktura och eventuella resekvitton ska bifogas
  - Lokal ledarutbildning kräver fullständig kostnadsredovisning
  - Ledarutbildningen får inte samtidigt räknas som sammankomst i verksamhetsbidraget
  belopp: Upp till 100 % av kurskostnaden, max tre prisbasbelopp per deltagare och år
  sen_ansokan: Ansökan ska ha kommit in senast sex månader efter avslutad utbildning
