- id: sigtuna-leader-upplandsbygd
  namn: Leaderstöd för landsbygdsutveckling
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - ovrig
  malgrupp: Föreningar och organisationer med lokalt förankrade utvecklingsprojekt i Sigtuna kommuns landsbygd utanför Märsta tätort
  deadlines:
    typ: okand
    datum: []
  krav:
  - Projektets huvudsakliga nytta ska finnas i Leader Upplandsbygds verksamhetsområde och utanför Märsta tätort
  - Projektet ska vara lokalt lett och förankrat hos flera parter
  - Projektet ska passa minst ett insatsområde i Upplandsbygds strategi
  - Projektet ska bidra positivt till social, ekologisk eller ekonomisk hållbarhet utan negativ påverkan på de andra dimensionerna
  - Projektet ska ge bred samhällsnytta och inte bara gynna en enskild aktör
  - Flera aktörer och sektorer ska samverka och projektets resultat ska vara långsiktigt och möjligt att sprida
  - Sökanden ska börja med en idéskiss till Leaderkontoret och därefter göra den formella ansökan i Jordbruksverkets e-tjänst
  belopp: För större leaderprojekt rekommenderas minst 100 000 kr; något generellt tak publiceras inte, men särskilda stödformer kan ha egna maxbelopp
  sen_ansokan: Ingen generell sista ansökningsdag publiceras för större leaderprojekt; särskilda utlysningar har egna perioder
  kalla_url: https://www.sigtuna.se/foretag-och-foreningar/information-for-foreningar/foreningsbidrag/stod-for-landsbygdsutveckling.html
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  belopp_avser: per_forening
  anteckning: Stödet beslutas av Leader Upplandsbygd och söks i Jordbruksverkets system. Kommunen ingår i Leaderområdet tillsammans med Knivsta, Uppsala, Vallentuna och Östhammar.
  senast_verifierad: '2026-08-18'
forutsattningar:
- id: sigtuna-registrerad-forening
  vad: Bli registrerad förening i Sigtuna kommuns föreningsregister
  beskrivning: Föreningen registreras först hos Skatteverket och därefter hos Sigtuna kommun. Kommunen kräver styrelse med minst ordförande, kassör och sekreterare, revisor, antagna stadgar, bildande- och firmatecknarprotokoll, föreningsuppgift, medlemsförteckning och bankkonto i föreningens namn. Fritidsföreningar ska normalt ha minst 20 medlemmar och kultur- och pensionärsföreningar minst 10; medlemsavgiften ska vara minst 25 kronor per person och år. Uppdaterad föreningsuppgift ska lämnas efter årsmötet och senast den 31 december varje år.
  system: Sigtuna kommuns föreningsregister
  ledtid: null
  ledtid_text: Ingen handläggningstid publicerad
