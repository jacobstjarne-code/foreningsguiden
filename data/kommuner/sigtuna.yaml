- id: sigtuna-arligt-verksamhetsbidrag-fritid
  namn: Årligt verksamhetsbidrag – fritid
  foreningstyp: [idrott, friluft, ungdom, annat]
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med ledarledd ungdomsverksamhet för 7–25-åringar
  deadlines:
    typ: fasta
    datum:
    - 10-31
  krav:
  - Föreningen ska bedriva verksamhet för barn och unga i åldern 7–25 år
  - Verksamheten ska vara öppen för alla inom den åldersgrupp som föreningen omfattar
  - Minst tre deltagare och ledare ska delta per redovisad sammankomst
  - Ansökan ska avse sammankomster genomförda under föregående kalenderår
  - Årsmöteshandlingarna får inte vara äldre än nio månader
  - Årsmötesprotokoll, firmatecknarunderlag, verksamhetsberättelse samt ekonomisk berättelse med revisionsberättelse ska bifogas
  - Skriftliga ANDTS-riktlinjer ska bifogas
  - Handlingsplan mot mobbning, trakasserier, rasism och kränkande behandling ska bifogas
  belopp: Beloppet beräknas utifrån föregående års bidragsberättigade sammankomster och kultur- och fritidsnämndens årliga grundbelopp
  sen_ansokan: Senast 31 oktober varje år
