- id: sigtuna-kulturprogram-bidrag
  namn: Bidrag till offentliga kulturprogram – kultur
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - kultur
  malgrupp: Kultur- och fritidsföreningar som arrangerar offentliga kulturprogram för allmänheten
  deadlines:
    typ: fasta
    datum:
    - 04-15
    - 10-15
  krav:
  - Arrangemanget ska vara tillgängligt för allmänheten och genomföras i eller utgå från Sigtuna kommun
  - Arrangemanget ska annonseras och minst marknadsföras i kommunens evenemangskalender
  - Marknadsföringen ska ange att arrangemanget genomförs med stöd av Sigtuna kommun
  - Publiken ska genom biljettintäkter bära en rimlig del av kostnaden när föreningen söker underskottstäckning
  - Föreningens egen insats och arrangörens måltider är inte bidragsberättigade
  - Föreningen ansvarar för nödvändiga tillstånd
  - Tidigare arrangemang ska vara redovisade innan en ny ansökan prövas
  - Redovisning med ekonomisk rapport, publikstatistik, marknadsföring och utvärdering ska lämnas senast sex veckor efter arrangemanget
