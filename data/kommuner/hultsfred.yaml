- id: hultsfred-grundbidrag
  namn: Årligt grundbidrag
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsgodkända ungdoms-, pensionärs-, funktionsrätts- och kulturföreningar
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningen ska vara bidragsgodkänd och ha verksamhet för ungdomar, pensionärer eller personer med funktionsnedsättning, eller bedriva kulturverksamhet
  - Föreningen ska ha minst tio aktiviteter per år, huvuddelen av verksamheten i kommunen och minst tio stödberättigade medlemmar i rätt målgrupp
  - Ansökan ska innehålla verksamhetsberättelse, resultat- och balansräkning samt revisionsberättelse för föregående år
  - En arbetsplan för verksamhetsåret ska lämnas och grundbidragsansökan ligger till grund för andra föreningsbidrag
  belopp: 1 470 kr per år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast en månad efter föreningens årsmöte
