  namn: Bidrag till scoutföreningar
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [friluft, ungdom, annat]
  malgrupp: Scoutkårer med regelbunden gruppverksamhet
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Sökanden ska vara en scoutkår i Hultsfreds kommun
  - Varje stödgrundande scoutgrupp ska ha regelbunden verksamhet en gång per vecka
  - Bidraget grundas på föregående års verksamhet och söks samtidigt med grundbidraget
  - Scoutkåren ska kunna visa verksamhets- och ekonomiska handlingar vid kommunens kontroll
