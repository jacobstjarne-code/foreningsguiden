- id: hultsfred-aktivitetsbidrag
  namn: Aktivitetsbidrag
  status: aktiv
  kategori: [idrott, kultur, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsgodkända föreningar med planerade och ledarledda aktiviteter
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Aktiviteten ska vara planerad, beslutad av styrelse eller sektion och ingå i den lokala föreningens verksamhet
  - Aktiviteten ska pågå minst 60 minuter med en utsedd ledare som närvarar och normalt minst fyra deltagare 4–20 år
  - Åldersgränsen gäller inte bidragsberättigade pensionärs- och funktionsrättsföreningar och tennis eller bordtennis kan godtas med färre deltagare
  - En aktivitet får redovisas en gång per dag och grupp; entrébelagda, kommersiella eller statsbidragsgrundande studiecirklar ger inte stöd
  - Närvarokort med namn och födelsedata ska föras, intygas av ledaren och sparas i minst fyra år
  belopp: 55 kr per redovisad och godkänd aktivitet
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Den 25 augusti gäller aktiviteter 1 januari–30 juni och den 25 februari aktiviteter 1 juli–31 december; för sen ansökan ger ingen rätt till bidrag
  kalla_url: https://www.hultsfred.se/files/2026/01/Bidragsregler-2026-2.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
