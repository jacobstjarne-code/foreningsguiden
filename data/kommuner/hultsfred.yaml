- id: hultsfred-startbidrag
  namn: Startbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Nystartade ideella föreningar i Hultsfreds kommun
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska vara nystartad och ansökan ska avse föreningens första verksamhetsår
  - Föreningen ska ha godkända stadgar, vald styrelse och revisorer samt vara öppen för medlemmar enligt stadgarna
  - Föreningen ska vara demokratiskt uppbyggd, bedriva huvuddelen av verksamheten i kommunen och arbeta för en rök-, alkohol- och drogfri miljö
  - Utbetalning görs endast till ett bankkonto, plusgiro eller bankgiro i föreningens namn
