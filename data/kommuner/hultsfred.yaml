- id: hultsfred-bidrag-till-studieforbund
  namn: Bidrag till studieförbund
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Statsbidragsgodkända studieförbund med verksamhet i Hultsfreds kommun
  deadlines:
    typ: fasta
    datum: [04-30]
  krav:
  - Studieförbundets centrala organisation och verksamhet ska vara godkänd för statsbidrag av Folkbildningsrådet
  - Studieförbundet ska bedriva folkbildning eller kulturverksamhet i Hultsfreds kommun och stödet får inte användas till uppdragsutbildning eller kommersiell verksamhet
  - Ansökan ska redovisa studietimmar i studiecirklar, annan folkbildningsverksamhet, kulturprogram och unika deltagare i kommunen
  - Balans- och resultaträkning, verksamhets- och revisionsberättelse samt kommunsammandrag ska bifogas och undertecknas av ordförande och revisor
  - Kommunens bidragsmottagare ska ställa räkenskaper och redovisningshandlingar till kommunens förfogande
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Det årliga kommunanslaget fördelas med 70 procent grundbidrag efter föregående kommunbidrag och 30 procent volymbidrag efter redovisade studietimmar; kulturprogram räknas som nio studietimmar och totalsumman publiceras inte
  sen_ansokan: Ansökan och föregående års redovisning ska lämnas senast den 30 april
  kalla_url: https://www.hultsfred.se/artikel/bidragsregler-for-studieforbund/
