- id: hultsfred-lokalbidrag
  namn: Bidrag för lokaler
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsgodkända föreningar som hyr eller äger en lokal
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska vara bidragsgodkänd och ha lämnat sin årliga grundbidragsansökan
  - Hyrd eller ägd lokal ska användas för föreningens verksamhet och kommunen ska kontaktas innan ett nytt köp- eller hyresavtal tecknas
  - För en föreningsägd lokal ska driftkostnader som el, vatten, sophämtning och försäkring kunna styrkas i bokföringen
  - Intäkter från uthyrning ska dras av från lokalkostnaderna och föreningar ska i första hand försöka samverka om lokaler
  belopp: 50 procent av hyran i kultur- och fritidsförvaltningens lokaler samt Skeppet, Vena bygdegård och Silverdalens Folkets hus; för övriga hyrda lokaler 40 procent, högst 5 000 kr; ägd lokal prövas mot nettodriften utan publicerad fast nivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen separat sista ansökningsdag
  kalla_url: https://www.hultsfred.se/files/2026/01/Bidragsregler-2026-2.pdf
