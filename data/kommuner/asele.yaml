- id: asele-aktivitetsbidrag
  namn: Kommunalt aktivitetsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Föreningar och organisationer med aktiviteter för deltagare i åldern 7–25 år
  deadlines:
    typ: fasta
    datum: [05-15, 08-15]
  krav:
  - Aktiviteten ska vara beslutad och ekonomiskt planerad av föreningen, pågå i minst 60 minuter och ha minst tre stödberättigade deltagare utöver ledaren
  - Ledaren ska vara minst 13 år, närvara under sammankomsten, intyga närvaron och får inte samtidigt leda flera stödgrundande grupper
  - Samma deltagare och grupp kan få stöd högst en gång per dag; entrébelagda eller kommersiella arrangemang och studiecirklar är inte stödgrundande
  - Närvarokort och ansökningskopia ska sparas i minst fyra år och kunna granskas av kommunen
  - Aktivitet som anordnas av riksorganisation, distrikt eller lokalt samarbetsorgan får inte stöd, och kommunen betalar inte om föreningen redan fått RF-SISU:s aktivitetsbidrag för samma aktivitet
  belopp: 30 kronor per godkänd sammankomst
  sen_ansokan: Normen anger 15 augusti för 1 januari–30 juni och 15 maj för 1 juli–31 december; den äldre blanketten som kommunen fortfarande länkar anger 15 februari för höstperioden
  kalla_url: https://www.asele.se/media/buvo0k0m/bidragsnormer-2025-grafisk2-0.pdf
  belopp_status: kontrollast
  belopp_avser: per_forening
  kommunens_pott: null
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
