  kraver_registrering: true
  sate_i_kommunen: true
  status: aktiv
  senast_verifierad: 2026-08-23
  anteckning: Detta är Åsele kommuns eget aktivitetsbidrag. Kommunen förbjuder dubbel ersättning för samma aktivitet från kommunens stöd och RF-SISU.
- id: asele-lokal-anlaggningsbidrag
  namn: Lokal- och anläggningsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Föreningar som äger eller hyr en lokal eller anläggning i Åsele kommun för regelbunden ungdomsverksamhet
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Lokalen eller anläggningen ska ligga i Åsele kommun och användas för regelbunden verksamhet för ungdomar i åldern 7–25 år
  - Föreningen ska samråda med kommunens fritidshandläggare innan bindande avtal om byggande, inköp eller hyra tecknas
  - Lokalen eller anläggningen ska kunna lånas ut till andra föreningar i den omfattning som kommunen och föreningen kommer överens om
  - Ansökan ska redovisa föregående års skötsel- och driftskostnader, hyresintäkter samt budget för kommande år; hyreskontrakt eller betalningsverifikat och specificerat kassautdrag ska bifogas
  - Större nödvändigt underhåll får inte påbörjas innan det anmälts till och diskuterats med kommunen
  belopp: 80 procent av nettokostnaden, högst 15 000 kronor per år för hyrd lokal eller anläggning och 18 000 kronor för egen
  sen_ansokan: Den aktuella blanketten på kommunens sida anger 31 mars; 2025 års normtext anger 5 maj
  kalla_url: https://www.asele.se/media/w13h1q2w/lokal-anlaggningsbidrag.pdf
  belopp_status: kontrollast
  belopp_avser: per_forening
  kommunens_pott: null
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kraver_registrering: true
  sate_i_kommunen: true
  status: aktiv
  senast_verifierad: 2026-08-23
  anteckning: Bidraget lämnas bara när kommunen inte upplåter en lokal kostnadsfritt; en ansökan ska lämnas för varje anläggning.
- id: asele-administratorsbidrag
  namn: Administratörsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Stora föreningar med anställd administratör och omfattande öppen verksamhet i kommunen
  deadlines:
    typ: fasta
    datum: [04-30]
  krav:
  - Föreningen ska bedriva dokumenterad, utåtriktad och öppen verksamhet på minst en plats i kommunen utöver sin interna verksamhet
  - Föreningen ska ha minst 200 medlemmar i åldern 7–25 år som är bosatta i Åsele kommun och minst 400 sammankomster per år
  - Föreningen bör ha kollektivavtal och ska kunna visa kommunen hur tillämpliga arbetsmarknadslagar och avtal följs
  - Administratören ska delta i sammankomster när kommunens fritidsenhet kallar
  belopp: Högst 50 procent av lönekostnaden inklusive sociala avgifter för en anställd administratör
  sen_ansokan: Ansökan ska vara kommunen tillhanda senast 30 april året före det år stödet avser
  kalla_url: https://www.asele.se/media/buvo0k0m/bidragsnormer-2025-grafisk2-0.pdf
