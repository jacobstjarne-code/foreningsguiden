- id: asele-sarskilt-bidrag
  namn: Särskilt bidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Bidragsberättigade Åseleföreningar med ett undantagsbehov som inte ryms i ordinarie stöd
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska uppfylla Åsele kommuns allmänna bidragsnormer och vara registrerad i kommunens föreningsregister
  - Bidraget kan endast beviljas i undantagsfall
  - Föreningen ska först upprätta en dialog med chef och handläggare vid Åsele kommuns fritidsenhet innan ansökan prövas
  - Föreningen ska ha stadgar, vald styrelse, egen kassaförvaltning och medlemsavgift samt kunna lämna fullständiga års- och granskningshandlingar
  belopp: Individuellt beslutat belopp; kommunen publicerar ingen generell nivå
  sen_ansokan: Kommunens norm publicerar ingen sista ansökningsdag
