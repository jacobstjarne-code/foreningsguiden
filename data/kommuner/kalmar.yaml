    medlemsavgift om minst 50 kronor per medlem, skriftliga stadgar antagna på årsmöte, vald styrelse, medlemsförteckning,
    organisationsnummer från Skatteverket, bank- eller plusgirokonto, säte och huvudsaklig verksamhet i Kalmar kommun, demokratisk
