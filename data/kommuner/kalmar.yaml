- id: kalmar-elitidrottsstod
  namn: Elitidrottsstöd
  kategori:
  - idrott
  malgrupp: Idrottsföreningar med säte i Kalmar kommun som har lag på nationell elitnivå, individuella idrottsutövare eller
    parasportidrottare på nationell respektive internationell elitnivå, eller elitförberedande verksamhet för ungdomar från
    16 år. Det ska vara föreningen som ansöker, inte enskilda idrottare, lag eller träningsgrupper
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen ska ha sitt säte i Kalmar kommun och idrotten ska vara ansluten till Riksidrottsförbundet
  - Laget ska tävla i högsta eller näst högsta serien för stora lagidrotter, eller högsta nationella serien för mindre lagidrotter
  - Elitförberedande projekt ska rikta sig till ungdomar från 16 år på väg mot seniorelit
  - Föreningen ska inom ett år arrangera minst en kostnadsfri provaktivitet för barn och ungdomar
  - Föreningen ska redogöra för hur stödet har kommit laget eller elitverksamheten till nytta
