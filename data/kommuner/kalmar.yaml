  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'Stödet är uppdelat i tre delar med årliga budgetramar (ej belopp per förening): del 1 (stora lagidrotter/internationell
    elit) 800 000–1 200 000 kronor, del 2 (mindre lagidrotter/nationell elit) 500 000–800 000 kronor, del 3 (elitförberedande,
    projektbaserat) 300 000–500 000 kronor. Riktlinjerna gäller från 2026 och omfattar även individuella idrottsutövare och
    parasportidrottare — målgruppen kompletterad vid omverifieringen 2026-09-17, den nämnde tidigare bara lag. Fördelningen
