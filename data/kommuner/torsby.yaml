  - ovrig
  malgrupp: Lokala initiativ som bidrar till landsbygdsutveckling i Torsby kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara en ideell förening som bedöms vara en icke-kommersiell aktör med fast hemvist i Torsby kommun; enskilda
    personer, ekonomiska föreningar eller företag beviljas inte stöd
  - Kan inte sökas för föreningens ordinarie verksamhet, och inte för ett nytt projekt om föreningen redan har ett pågående
    projekt
  - Endast projektkostnader för insatser som sker efter att ansökan lämnats in är stödberättigande
  - Maxbelopp 50 000 kr per ansökan
  - Ansökan ska undertecknas av föreningens behöriga firmatecknare
