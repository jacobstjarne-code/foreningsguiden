- namn: Bidrag till samlingslokaler
  status: aktiv
  kategori:
  - kultur
  - social
  - ovrig
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar och organisationer som driver samlingslokal
  deadlines:
    typ: fasta
    datum:
    - 02-15
  krav:
  - Föreningen ska ha säte i Torsby kommun och äga en samlingslokal belägen i kommunen
  - Aktiviteten ska genomföras i lokalen eller dess omedelbara närhet, ha minst fem deltagare och pågå minst en timme
  - 'Stöd beräknas med grundbelopp 65 kr per aktivitet, multiplicerat efter deltagarantal: 1x vid 5–40 deltagare, 2x vid 41–90,
    3x vid 91 eller fler'
  - Förberedelse, städning, möbelutlämning, reparationer och kommersiell verksamhet är inte stödberättigande
  - Ansökan senast 15 februari för föregående kalenderår, med verifierad deltagarredovisning
  - Varje aktivitet ska ha en namngiven ansvarig person som kan verifiera deltagaruppgifterna; samma grupp kan ge högst en
    stödberättigad aktivitet per dag
  belopp: 65 kr per aktivitet vid 5–40 deltagare, 130 kr vid 41–90 och 195 kr vid minst 91 deltagare
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Underlaget för föregående kalenderår ska vara fritidsavdelningen tillhanda senast 15 februari.
