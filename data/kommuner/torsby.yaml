  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Sidan anger att 18 maj kan vara sista ansökningsdagen 2026 eftersom lite medel återstår.
  id: torsby-landsbygdspotten
