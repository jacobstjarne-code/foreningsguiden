- namn: Aktivitetsbidrag för barn, unga och seniorer 65+
  status: aktiv
  kategori:
  - idrott
  - kultur
  - pensionar
  - funktionsratt
  - ovrig
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med regelbunden verksamhet för barn och unga eller deltagare från 65 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Minst 20 aktiva medlemmar som under året fyller lägst 6 och högst 25 år (ingen övre åldersgräns för handikappförening)
  - Föreningen ska bedriva ideell verksamhet i drogfri miljö, vara demokratiskt uppbyggd, öppen för alla och medlem i en riksorganisation
    som ger statligt stöd till barn- och ungdomsverksamhet
  - Godkända stadgar, ansvarig styrelse och revisorer samt årligt årsmöte där verksamhetsberättelse, resultat- och balansräkning
    och revisionsberättelse godkänns och redovisas till kommunen
  - Deltagare ska vara 7–25 år, minst fem per sammankomst, sammankomsten ska pågå minst 60 minuter och ledas av en ledare
    som fyllt minst 13 år
  - Ansökan görs på särskild blankett med närvarokort, senast 25 augusti (period januari–juni) respektive 25 februari (period
    juli–december); närvarokort ska sparas av föreningen i fem år
  - En deltagare får räknas högst en gång per dag och verksamhet; fester, högtidsfiranden, publika arrangemang, skolaktiviteter
    och studiecirklar är inte stödberättigande
  - Barn och unga respektive seniorer 65+ ska redovisas på skilda närvarokort
  belopp: Ersättning per godkänd sammankomst och deltagartillfälle; kommunen publicerar ingen generell kronnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: 25 februari för juli–december och 25 augusti för januari–juni; aktiviteter får inte flyttas mellan perioder.
  kalla_url: https://torsby.se/upplevagora/stodochhjalptillforeningar/foreningsbidragstodochstipendierforforeningar/aktivitetsbidragforforeningarlokaltaktivitetsstod.4.7143cdc21924bc27be5117b.html
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Från den 1 juli 2026 omfattar stödet även deltagare från och med det år de fyller 65 år.
  id: torsby-aktivitetsbidrag
  senast_verifierad: '2026-08-19'
- namn: Lokal- och anläggningsbidrag
  status: aktiv
  kategori:
  - idrott
  - ovrig
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med hyrd eller ägd lokal för barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 09-30
  krav:
  - Föreningen ska uppfylla fritidsavdelningens allmänna villkor (godkända stadgar, styrelse, revisorer, årsmöte, minst 20
    aktiva medlemmar 6–25 år m.m.)
  - Föreningen ska ha egen eller långtidsförhyrd verksamhetslokal för barn- och ungdomsverksamhet, godkänd av kommunen
  - Föreningen ska vara beviljad aktivitetsstöd eller kunna påvisa barn- och ungdomsverksamhet
  - Lokalen ska uppfylla myndighetskrav avseende bygglov, brandsäkerhet och försäkring
  - Föreningar i kommunala anläggningar, med lokal hyrd av privatperson, hyrd i andra hand eller belägen utanför kommunen
    kan inte söka
  - Ansökan senast 30 september
  - Ansökan avser kostnader under året före ansökningsåret
  belopp: Individuellt efter anläggningsart, verksamhetens omfattning, skolans och allmänhetens nyttjande samt tillgängliga medel
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast 30 september.
  kalla_url: https://torsby.se/upplevagora/stodochhjalptillforeningar/foreningsbidragstodochstipendierforforeningar/lokalochanlaggningsbidragforforeningar.4.7143cdc21924bc27be511ae.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  id: torsby-lokal-och-anlaggningsbidrag
  senast_verifierad: '2026-08-19'
- namn: Ledarutbildningsbidrag
  status: aktiv
  kategori:
  - idrott
  - ovrig
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som utbildar ungdomsledare eller arbetar med föreningsutveckling
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningen ska vara beviljad aktivitetsstöd föregående år eller kunna påvisa barn- och ungdomsverksamhet
  - Ledaren ska fylla minst 13 år det kalenderår utbildningen genomförs
  - Utbildningen ska till minst 25 procent bestå av ungdomsledarskap, föreningskunskap, metodik eller pedagogik och anordnas
    av förening, distriktsförbund, riksorganisation, SISU Idrottsutbildarna eller studieförbund
  - Kursprogram och kursintyg (eller annat styrkande underlag) ska lämnas in innan stödet betalas ut
  - Ansökan ska skickas in snarast, dock senast tre månader efter kursens genomförande
  - Studiecirklar, tränings- och distriktsläger, fjällresor, yrkesutbildning, kongresser och beslutande möten ger inte stöd
  belopp: Upp till 50 procent av godkänd kurskostnad och 100 procent av billigaste resa; särskilt dyra kurser prövas individuellt
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Löpande, men senast en månad efter genomgången kurs enligt huvudsidans aktuella ansökningstider.
  kalla_url: https://torsby.se/upplevagora/stodochhjalptillforeningar/foreningsbidragstodochstipendierforforeningar/ledarutbildningsbidragforforeningar.4.7143cdc21924bc27be511b9.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Den bidragsspecifika sidan anger tre månader efter kursen, medan den senare uppdaterade huvudsidans ansökningstider
    anger en månad.
  id: torsby-ledarutbildningsbidrag
  senast_verifierad: '2026-08-19'
