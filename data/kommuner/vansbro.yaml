  - Föreningsägda anläggningar ska utan kostnad upplåtas för barnomsorgens samt grund- och gymnasieskolans behov
  - Bidrag ges endast per byggnad; kommunen ska kontaktas innan om- eller tillbyggnad respektive anskaffning av byggnad för
    besked om framtida bidrag
