  - Föreningen ska ha minst 10 medlemmar som varit registrerade och erlagt fastställd medlemsavgift under närmast föregående
    verksamhetsår
  - Ansökan ska göras av föreningens huvudstyrelse, inte av sektionsstyrelse eller liknande
  - Ansökan ska innehålla verksamhetsberättelse för senaste verksamhetsåret, uppgift om antal medlemmar samt föreningens intäkter
