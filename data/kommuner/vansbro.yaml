    datum:
    - 12-31
  krav:
  - Studieförbundet ska bedriva verksamhet i Vansbro kommun och dess centrala organisation ska få statsbidrag från Folkbildningsrådet
  - Studieförbundet ska ha en ansvarig styrelse och ekonomisk redovisning enligt bokföringslagen
  - Ansökan ska lämnas som verksamhetsplan senast den 31 december året före bidragsåret
  - Kommunintyg, verksamhetsberättelse och revisionsberättelse ska lämnas senast den 30 april bidragsåret
  - Redovisningen ska styrka kommunfördelningen och ange deltagartimmar för studiecirklar, kulturprogram och övrig folkbildning i Vansbro
  - Kulturprogram som räknas in ska vara öppna för alla och annonseras i förväg
