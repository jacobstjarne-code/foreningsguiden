  - ovrig
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 08-31
  krav:
  - Föreningen ska ha minst 10 medlemmar som varit registrerade och erlagt fastställd medlemsavgift under närmast föregående
    verksamhetsår
  - Ansökan ska göras av föreningens huvudstyrelse, inte av sektionsstyrelse eller liknande
  - Ansökan ska innehålla verksamhetsberättelse för senaste verksamhetsåret, uppgift om antal medlemmar samt föreningens intäkter
    av medlemsavgifter vid verksamhetsårets utgång
  - Ansökan ska innehålla resultaträkning och balansräkning för senaste verksamhetsåret
  - Föreningen ska äga eller stadigvarande förhyra lokalen; för förhyrd lokal ska hyresavtal bifogas ansökan
  - Föreningsägda anläggningar ska utan kostnad upplåtas för barnomsorgens samt grund- och gymnasieskolans behov
  - Bidrag ges endast per byggnad; kommunen ska kontaktas innan om- eller tillbyggnad respektive anskaffning av byggnad för
    besked om framtida bidrag
  belopp: Beloppet varierar efter lokal-/anläggningstyp, t.ex. klubblokal/bystuga/ordenshus 2 200 kr/år, hembygdsgård 6 000
    kr/år, fotbollsplan högst 20 000 kr/år, omklädningsbyggnad 3 500–7 500 kr/år. Förhyrda lokaler ersätts med 90 % av hyreskostnaden,
    högst 7 000 kr/år. Fullständig lista över samtliga anläggningstyper finns i kommunens regeldokument.
