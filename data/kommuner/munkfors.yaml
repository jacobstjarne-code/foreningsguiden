  krav:
  - Sammankomsten ska vara minst 45 minuter och ha minst 3 stödberättigade deltagare
  - Sammankomsten ska vara planerad och ledd av en ledare som är lägst 13 år
  - Närvarokort ska föras vid varje sammankomst, flickor och pojkar redovisas var för sig
  - Ansökan ska innehålla verksamhetsberättelse, resultat- och balansräkning samt tobak-, alkohol- och drogpolicy
