  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - &grund Föreningen ska vara ideell, ha årsmötesantagna stadgar, giltigt organisationsnummer samt säte och/eller verksamhet i Nordanstigs kommun
  - &medlemmar Föreningen ska ha minst 10 medlemmar, uppdaterad medlemsmatrikel och aktuella uppgifter på föreningskontot i e-serve
  - &handlingar Föreningen ska lämna årsmötesprotokoll och verksamhetsberättelse samt ge kommunen insyn i räkenskaper och andra efterfrågade handlingar
  - &vardegrund Föreningen ska vara demokratiskt organiserad, arbeta för delaktighet, jämlikhet, jämställdhet, mångfald och inkludering samt bedriva all stödberättigad verksamhet alkohol- och drogfritt
  - Minst 10 medlemmar i föreningen
  - Ledarledd gruppaktivitet om minst 60 minuter
  - Minst 2 deltagare och 1 ledare (ledaren minst 13 år)
  - Minst 5 godkända sammankomster per år
  - Deltagare högst 25 år, dock ingen övre åldersgräns för funktionsvariationsverksamhet och 65+ för äldreaktiviteter
  - Idrottsföreningar rapporterar via IdrottOnline, övriga föreningar direkt i e-serve
  - Alla deltagare 0–25 år ska närvarorapporteras eftersom kommunen saknar den undre sjuårsgränsen
  belopp: 70 kr per godkänd sammankomst; återstående del av respektive budgetpott fördelas procentuellt efter föreningens antal deltagartillfällen
  belopp_avser: per_forening
  kommunens_pott: 800 000 kr per år för barn och unga samt 150 000 kr per år för personer med funktionsvariationer och personer 65 år och äldre; potterna fördelas vid två ansökningstillfällen
  sen_ansokan: Period 1 (1 januari–30 juni) rapporteras senast 25 augusti och period 2 (1 juli–31 december) senast 25 februari följande år
  kalla_url: *huvud
  belopp_status: kontrollast
