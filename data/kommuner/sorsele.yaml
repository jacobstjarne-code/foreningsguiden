- id: sorsele-anstallningsstod-verksamhetsutveckling
  namn: Anställningsstöd för verksamhetsutveckling
  kategori: [social, ovrig]
  malgrupp: Föreningar och studieförbund i Sorsele som anställer en kommuninvånare med statligt anställningsstöd
  deadlines: {typ: relativ, datum: []}
  krav:
  - Föreningen eller studieförbundet ska vara verksamt i Sorsele kommun och den anställda ska vara folkbokförd i kommunen
  - Ett statligt anställningsstöd ska vara beviljat och kommunens kompletterande stöd ska godkännas före rekvisition
  - Rekvisition med löne- och beslutsunderlag ska lämnas kvartalsvis under närmast följande kvartal
  - Ett avbrott i anställningen på minst sex månader kräver en ny kommunal prövning och förändringar ska anmälas till kommunen
  belopp: 10 procent av det beviljade statliga anställningsstödet per månad
  sen_ansokan: Rekvisition ska lämnas under kvartalet närmast efter den period som ersättningen avser; senare rekvisition avslås
