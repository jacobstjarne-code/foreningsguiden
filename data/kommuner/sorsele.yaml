- id: sorsele-aktivitets-och-foreningsbidrag
  namn: Kommunalt aktivitetsstöd
  kategori: [idrott, kultur, funktionsratt, ovrig]
  malgrupp: Lokala föreningar med verksamhet för barn och unga 7–25 år eller deltagare med funktionsnedsättning
  deadlines: {typ: fasta, datum: [03-01, 09-01]}
  krav:
  - Föreningen ska vara knuten till en relevant riks- eller distriktsorganisation och bedriva stödberättigad verksamhet i Sorsele
  - Sammankomstbidrag kräver en planerad ledarledd aktivitet med minst fem deltagare i åldern 7–25 år; för deltagare med funktionsnedsättning gäller ingen övre åldersgräns
  - Resebidrag gäller resa till och från aktivitet inom 100 mil och lämnas inte för arrangemang med prispengar
  - Ledarutbildning ska anordnas av riks-, läns-, distrikts- eller lokalorganisation och får inte vara kongress eller förbundsmöte
  - Ansökan och närvarounderlag ska avse rätt halvårsperiod och lämnas med kommunens fullständiga föreningshandlingar
  belopp: 'Sammankomstbidrag: 40 kronor per aktivitet. Resebidrag: 5 kronor per mil för 1–8 personer och 10 kronor per mil för minst 9 personer. Ledarutbildning: högst 2 000 kronor i kursavgift per kurs samt resa enligt normen, högst två deltagare per organisation och år; lokalt anordnad kurs 500 kronor en gång per år.'
  sen_ansokan: Senast 1 mars för perioden juli–december och 1 september för januari–juni
  kalla_url: https://www.sorsele.se/kultur-och-fritid/foereningsliv-och-foereningsbidrag/kommunala-bidrag-och-stoed/kommunalt-aktivitetsstoed/
