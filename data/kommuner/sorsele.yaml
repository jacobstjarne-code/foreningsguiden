- id: sorsele-kommunal-sponsring
  namn: Kommunal sponsring
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar och organisationer samt evenemang som anordnas av en förening, organisation eller ett företag
  deadlines: {typ: okand, datum: []}
  krav:
  - Föreningen, organisationen eller evenemanget ska bidra till lokal utveckling, skapa stolthet eller synliggöra Sorsele som en attraktiv plats att leva på, verka i och besöka
  - Sponsringen ska bygga på ett affärsmässigt skriftligt avtal med en värderad motprestation, belopp eller värde, parternas åtaganden, avtalstid och redovisningskrav
  - Politisk eller religiös verksamhet, obetalda skatter eller avgifter och samarbeten som riskerar förtroendeskada kan inte sponsras
  - Social och ekologisk hållbarhet, dopningsarbete, andra sponsorer, lokal förankring och arrangemangets räckvidd vägs in i bedömningen
  belopp: Kommunen publicerar ingen fast sponsringsnivå; pengar, material, utrustning, arbetsinsatser och hyresreduktion värderas i kronor i avtalet
  sen_ansokan: Kommunen publicerar ingen generell ansökningsfrist
