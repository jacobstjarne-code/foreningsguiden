bidrag:
- namn: Aktivitetsbidrag – vår
  kategori:
  - idrott
  - ovrig
  malgrupp: Ungdomsorganisationer med verksamhet för 7–20 år
  deadlines:
    typ: fasta
    datum:
    - 08-25
  krav:
  - Verksamheten ska rikta sig till barn och ungdomar 7–20 år
  - Verksamheten ska bedrivas minst 20 gånger under verksamhetsåret
  - Närvaroförteckning med namn, födelseår, aktivitet, datum, klockslag och ledare ska föras vid varje sammankomst
  - Sammankomsten ska vara ledarledd med minst 3 och max 30 bidragsberättigade deltagare i minst 60 minuter
  - Vid sammankomst för enbart barn och ungdomar med funktionsnedsättning utgår bidrag oavsett antal deltagare
  - Bidrag utbetalas endast en gång per dag och deltagare
  - Bidrag utgår inte till entrébelagda tävlingar, kommersiella arrangemang, fritidsgårdsverksamhet eller studiecirkelsammankomst
  belopp: 8 kr per deltagartillfälle; 16 kr för deltagare med funktionsnedsättning
  sen_ansokan: Efter 25 augusti minskas bidraget med 10 procent; efter 30 september lämnas inget bidrag
  kalla_url: https://funktion.solvesborg.se/bidrag/
  belopp_status: kontrollast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
