  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Gäller ungdomsförening som erhåller aktivitetsbidrag
  - Lokalen eller anläggningen ska ligga inom kommunen och vara godkänd av fritids- och kulturnämnden
  - Avtal om förhyrning eller kontrakt för egen lokal ska i förväg godkännas av nämnden
  - Bidrag ges inte för hyreskostnader i kommunalt subventionerade lokaler
  - Bidrag ges inte för lokaler som i huvudsak används till kommersiell verksamhet eller för entrébelagda arrangemang i kommunägda
    lokaler
  belopp: 'Förhyrd lokal: högst 80 procent av hyreskostnaden (hyra, vatten, el), maximalt 50 000 kr per förening och år. Egen
    lokal/anläggning: högst 80 procent av godkänd nettokostnad för drift och löpande underhåll, maximalt 120 000 kr per förening
    och år'
