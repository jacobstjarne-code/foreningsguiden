  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Gruppverksamheten ska bestå av minst tre och högst 20 deltagare i bidragsberättigad ålder (7–25 år)
  - Varje gruppverksamhet ska vara ledarledd
  - Sammankomsten ska omfatta minst 60 minuter
  - Föreningen ska redovisa minst tio bidragsberättigade sammankomster per kalenderår
  - Närvarokort ska sparas i minst fyra år
  - Aktiviteten ska ha gemensam samling, instruktion och avslutning; entrétävlingar, kommersiell verksamhet och studiecirklar räknas inte
  - Ledaren ska vara minst 13 år, närvara och intyga närvarokortet; ordförande samt revisor eller kassör intygar ansökan
  belopp: Ersättning per deltagartillfälle; kommunen publicerar ingen aktuell sats
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan senast 25 februari respektive 25 augusti.
