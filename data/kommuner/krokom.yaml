  namn: Skoterledsbidrag
  kategori:
  - ovrig
  foreningstyp: [idrott, friluft, annat]
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 12-01
  krav:
  - Leden ska vara godkänd av byggnadsnämnden
  - Leden ska hållas uppröjd till minst 2 meters bredd
  - Uppmärkning ska ske enligt Naturvårdsverkets riktlinjer
  - Föreningen är skyldig att omgående anmäla eventuella förändringar till kommunen
  - Leden ska underhållas, renhållas och skyltarna kontrolleras löpande; ansvarig förening och kontaktperson ska anges
  belopp: 1 000 kronor per mil godkänd led och år
