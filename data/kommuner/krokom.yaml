  - Lokalen ska hyras för föreningens verksamhet och ligga i Krokoms kommun
  - Kommunala lokaler ska användas i första hand
  - Verksamhets- och ekonomisk berättelse samt betalda hyresverifikat ska lämnas
  - Högre stöd än normalgränsen kan bara prövas där kommunal lokal saknas och kräver budget och verksamhetsplan
  belopp: 100 procent av skälig hyra, normalt högst 3 000 kr per förening och år
