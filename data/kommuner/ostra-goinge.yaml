- namn: Ekonomiskt stöd för feriearbete
  kategori:
  - social
  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Föreningen ska vara en registrerad allmännyttig förening som uppfyller kommunens villkor för föreningsbidrag
  - Föreningen ska samverka med facklig organisation
  - Föreningen ska registrera sig som arbetsgivare hos Skatteverket
  - Föreningen ansvarar fullt ut för arbetsmiljön i sin roll som arbetsgivare
  - Föreningen ska anskaffa försäkring och säkerhetsutrustning
  - Föreningen ska utse en handledare som är minst 18 år och har minst ett års erfarenhet
  - Föreningen ska genomföra introduktion för ungdomen
  - Föreningen ska begära utdrag ur belastningsregister om arbetet innebär kontakt med barn eller unga
  - Föreningen ska skriva anställningsavtal med ungdomen
  - Föreningen ska få målsmans samtycke för ungdomar under 18 år
  - Föreningen ska inhämta Skatteverkets intyg innan löneutbetalning sker utan skatteavdrag
  - Föreningen måste anmäla sina ferieplatser till kommunen senast 30 mars
  belopp: Upp till 8 871 kr per ungdom
