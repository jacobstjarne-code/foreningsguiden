- id: ostra-goinge-ekonomiskt-stod-for-feriearbete
  namn: Ekonomiskt stöd för föreningar vid feriearbete
  status: aktiv
  kategori: [social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Registrerade allmännyttiga föreningar som anställer kommunens feriearbetare
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Föreningen ska vara registrerad och allmännyttig i Östra Göinge och uppfylla kommunens villkor för föreningsbidrag
  - Ferieplatsen ska anmälas till kommunen senast 30 mars och föreningen ska ta emot en ungdom som kommunen placerar
  - Föreningen ska vara arbetsgivare, vara registrerad hos Skatteverket och samverka med facklig organisation och skyddsombud
  - Föreningen ansvarar för arbetsmiljö, riskbedömning, försäkring, skyddsutrustning och reglerna för minderåriga
  - En handledare som är minst 18 år och har minst ett års erfarenhet ska utses och ungdomen ska få introduktion
  - Föreningen ska skriva anställningsavtal, inhämta vårdnadshavares samtycke för minderårig och vid behov begära belastningsregisterutdrag
  - Ungdomen ska fylla 16, 17 eller 18 år under året och arbeta högst 90 timmar under tre veckor
  - Lön och arbetsgivaravgift ska redovisas för utbetalning i efterskott
  belopp: Upp till 8 871 kr per ungdom, beräknat som 75 kr per timme i högst 90 timmar inklusive semesterersättning samt arbetsgivaravgift
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ferieplatsen anmäls senast 30 mars och ekonomiskt stöd söks senast 30 november
  kalla_url: https://ostragoinge.se/jobb-och-foretagande/praktik-och-ideellt-arbete/arbete-for-ungdomar-feriearbete
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
