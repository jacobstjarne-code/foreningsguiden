bidrag:
- id: ostra-goinge-aktivitetsstod
  namn: Aktivitetsstöd
  status: aktiv
  kategori: [idrott, kultur, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade ungdomsföreningar med verksamhet för 7–20 år eller deltagare med funktionsnedsättning
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara registrerad och godkänd i Östra Göinge, ha minst 10 betalande medlemmar 7–20 år och minst 10 sammankomster under året
  - En majoritet av föreningens medlemmar ska vara bosatta i Östra Göinge kommun
  - Sammankomsten ska vara planerad, beslutad och anordnad av föreningen, ledarledd och pågå minst 60 minuter med gemensam samling och avslutning
  - Varje sammankomst ska ha minst 3 och högst 30 stödberättigade deltagare utöver ledaren eller ledarna
  - Ansvarig ledare ska vara minst 15 år, medlem i föreningen och får inte ansvara för flera samtidiga sammankomster
  - Deltagaren ska normalt vara medlem och vara 7–20 år; för deltagare med funktionsnedsättning finns ingen övre åldersgräns
  - En deltagare kan räknas högst en gång per dag i samma förening och vid högst 120 sammankomster per verksamhetsår
  - Ansökan och närvaroredovisning ska lämnas via Interbook FRI, NärvaroGo eller godkänd kommunfil enligt kommunens anvisning
  belopp: Årligen fastställda nivåer för ledarstöd, extra ledarstöd och deltagarstöd; 2026 års kronnivåer publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: 1–30 dagar sent minskar stödet med 25 procent, 31–90 dagar med 50 procent och efter mer än 90 dagar lämnas inget stöd
  kalla_url: https://ostragoinge.se/download/18.3adfc157195b297da7711704/1765955189889/St%C3%B6dregler%20f%C3%B6r%20ungdomsf%C3%B6reningar%20aktivitetsst%C3%B6d.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
- id: ostra-goinge-arrangemangsbidrag
  namn: Arrangemangsbidrag för föreningar
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som genomför utvecklingsfrämjande och kvalitetshöjande arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Arrangemanget ska genomföras i föreningens regi och ligga i linje med föreningens huvudsakliga verksamhet
  - Arrangemanget ska utveckla föreningens verksamhet och skapa mervärde för kommunens invånare
  - Ansökan ska beskriva arrangemanget och innehålla ekonomisk kalkyl, tidplan och sökt belopp
  - Ett samarbetsavtal ska reglera föreningens och kommunens åtaganden inför arrangemanget
  - Intäkter och kostnader ska kunna verifieras på kommunens begäran
  - Föreningen kan bli återbetalningsskyldig om arrangemanget inte genomförs eller får annan omfattning än ansökan
  belopp: Individuell kommunal delfinansiering efter arrangemangets status och omfattning; ingen generell nivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan sker löpande och bör lämnas minst två månader före arrangemanget
  kalla_url: https://ostragoinge.se/download/18.72996c41926b04e98ae842/1765809153866/Ans%C3%B6kan%20om%20arrangemangsbidrag.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kulturarrangemangsstödet som även är öppet för enskilda kulturaktörer ingår inte i denna föreningsbegränsade stödform.
  senast_verifierad: '2026-08-19'
- id: ostra-goinge-driftsbidrag-egen-anlaggning
  namn: Driftsbidrag – ungdomsförening med egen anläggning
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade ungdomsföreningar som helt ansvarar för en egen anläggnings drift och kostnader
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen ska föregående år ha redovisat minst 10 godkända sammankomster
  - Föreningen ska helt svara för driften och driftskostnaderna för den anläggning eller plan som ansökan avser
  - Likvida medel får inte överstiga de senaste två årens drift- och verksamhetskostnader, om överskottet inte är avsatt till ett särskilt verksamhetsändamål som redovisas
  - Ansökan ska beskriva anläggningarna och planerna samt ange antal, storlek, underlag och andra relevanta uppgifter
  - Senaste årsmötesprotokoll, ekonomisk rapport, revisionsberättelse, verksamhetsberättelse och konstituerande protokoll ska vara inlämnade
  - Kommunen får besikta anläggningen och granska underlag som rör driften
  belopp: Fast bidrag per anläggning eller plan enligt nivåer som Kultur och fritid fastställer årligen; 2026 års nivåer publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Den allmänna ungdomsregeln minskar bidraget med 25 procent efter 1–30 dagar, 50 procent efter 31–90 dagar och till noll efter mer än 90 dagar
  kalla_url: https://ostragoinge.se/download/18.72996c41926b04e98ae84a/1765809573169/Ans%C3%B6kan%20om%20driftsbidrag%20-%20ungdomsf%C3%B6rening%20med%20egen%20anl%C3%A4ggning.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Utbetalning sker enligt regeln senast den 31 maj.
  senast_verifierad: '2026-08-19'
- id: ostra-goinge-ledarutbildningsbidrag
  namn: Ledarutbildningsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade ungdomsföreningar som utbildar ledare och tränare
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningen ska föregående år ha redovisat minst 10 godkända sammankomster för aktivitetsstöd
  - Utbildningen ska öka kompetensen specifikt inom den verksamhet som föreningen bedriver
  - Kursen ska uppfylla kraven från den riksorganisation eller det riksförbund som föreningen är ansluten till
  - Ansökan ska innehålla kursprogram med kurskostnad samt deltagarförteckning
  - Efter kursen ska kursintyg, faktura eller kvitto och övrigt kostnadsunderlag lämnas senast inom en månad
  - Bidraget får aldrig överstiga föreningens faktiska kostnad och kan återkrävas om utbildningen inte genomförs som beskrivet
  belopp: Kurs- och resekostnader upp till ett årligt föreningstak som Kultur och fritid beslutar; 2026 års tak publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan sker löpande men ska lämnas minst en månad före utbildningen
