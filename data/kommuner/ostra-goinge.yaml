- id: ostra-goinge-driftsbidrag-samlingslokal
  namn: Driftsbidrag – föreningsägd samlingslokal
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, hembygd, social, ungdom, annat]
  malgrupp: Föreningar som äger och driver en samlingslokal
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen ska äga och driva den samlingslokal som ansökan avser
  - Föregående års och kommande års kostnader för bränsle, el, sotning, sophämtning, vatten och avlopp, försäkring och eventuellt arrende ska redovisas
  - Övriga driftkostnader och årliga underhållskostnader ska specificeras
  - Kassabehållning och senaste årets resultat ska anges
  - Aktiviteter och extern användning av samlingslokalen ska redovisas på kommunens särskilda bilaga
  - Kommunen ska kunna granska lämnade ekonomi- och verksamhetsuppgifter
