  krav:
  - Minst hälften av föreningens medlemmar ska vara folkbokförda i Stenungsunds kommun.
  - Föreningen ska vara registrerad i kommunens offentliga föreningsregister.
  - Föreningen ska vara öppen för alla och uppbyggd utifrån demokratiska principer.
  - Föreningen ska föra närvarostatistik per termin.
  - Föreningen ska arbeta för en drog- och dopingfri verksamhet och miljö.
  - Föreningen ska årligen genomföra ledarutbildning.
