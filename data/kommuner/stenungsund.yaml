- namn: Verksamhetsbidrag till pensionärs- och funktionsrättsföreningar
  kategori:
  - pensionar
  - funktionsratt
  malgrupp: Pensionärs- och funktionsrättsföreningar
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen ska driva frågor på lokal nivå för bättre villkor för pensionärer eller personer med funktionsnedsättning.
  - Föreningen ska årligen anordna verksamhet för sin målgrupp i Stenungsunds kommun.
  - Föreningen ska vara öppen för alla och bygga på demokratiska principer.
  - Föreningen ska ha genomfört minst ett verksamhetsår innan kategorisering.
