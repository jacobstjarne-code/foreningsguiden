- id: stenungsund-kommunalt-lok-stod
  namn: Kommunalt lokalt aktivitetsstöd
  kategori: [idrott, kultur, funktionsratt, ovrig]
  malgrupp: Bidragsberättigade ungdomsföreningar och RF-anslutna funktionsrättsföreningar
  deadlines:
    typ: fasta
    datum: ['02-25', '08-25']
  krav:
  - Föreningen ska vara registrerad och årligen kategoriserad som bidragsberättigad ungdoms- eller funktionsrättsförening
  - Ungdomsföreningen ska ha minst 15 aktiva medlemmar 7–20 år och minst hälften ska vara folkbokförda i Stenungsunds kommun
  - RF-anslutna föreningar ska ha beviljats statligt LOK-stöd föregående år
  - Närvarofil ska importeras i Rbok senast 25 februari respektive 25 augusti
  - Aktiviteter och deltagare ska uppfylla kommunens och RF:s regler för lokalt aktivitetsstöd
  belopp: null
  belopp_avser: ren_pott
