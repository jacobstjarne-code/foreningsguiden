  kalla_url: https://www.stenungsund.se/download/18.3ee1479219207b67ae6261c3/1726751265548/Riktlinjer%20f%C3%B6r%20bidrag%20till%20ungdoms-%20%20pension%C3%A4rs-%20och%20funktionsr%C3%A4ttsf%C3%B6reningar%20%28fr%C3%A5n%20och%20med%202025-01-01%29.pdf
