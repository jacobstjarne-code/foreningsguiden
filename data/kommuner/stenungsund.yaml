- namn: Bidrag till föreningar utanför kommunen
  kategori:
  - social
  - ovrig
  malgrupp: Föreningar som bedriver socialt arbete eller integrationsarbete för kommuninvånare
  deadlines:
    typ: fasta
    datum:
    - 05-31
  krav:
  - Verksamheten ska riktas mot invånare i Stenungsund, och varje kommuninvånare ska ha rätt att bli medlem utan godtyckliga
    uteslutningsgrunder.
  - Föreningens huvudsakliga inriktning ska vara socialt arbete eller integrationsarbete.
  - Föreningen får inte ha en uppmuntrande attityd till eller bedriva verksamhet som skapar positiva attityder till missbruk
    av tobak, alkohol eller droger.
  - Föreningen får inte medverka till eller utsätta någon för diskriminering utifrån diskrimineringslagens sju grunder.
  - Föreningen ska medverka i kommunens kontrollåtgärder.
  - Ansökan ska innehålla verksamhetsberättelse, bokslut, revisionsberättelse, kontaktuppgifter och bankkontouppgifter, och
    görs via e-tjänsten Mina sidor med Bank-ID.
  belopp: null
