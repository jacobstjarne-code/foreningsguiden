- id: skelleftea-bidragsberattigad-forening
  vad: Bli godkänd som bidragsberättigad förening
  beskrivning: Föreningen ansöker om att registreras i kommunens föreningsregister och bli bidragsberättigad. Kräver att föreningen
    bedrivs under demokratiska former, är ideellt uppbyggd, motverkar diskriminering och följer barnkonventionen, har valt
    styrelse, antagit stadgar och bokför sin ekonomi, har organisationsnummer samt postgiro, bankgiro eller bankkonto, samt
    tillhör distrikt- eller riksorganisation när sådan krävs. Föreningen ska ha sitt säte i Skellefteå kommun. Föreningen
    ska årligen uppdatera styrelseuppgifter i Interbook Go, lämna in senaste årshandlingar och ladda upp stadgar. Om vuxna
    i föreningen har kontakt med barn ska föreningen ha begärt ut begränsat utdrag ur belastningsregistret.
