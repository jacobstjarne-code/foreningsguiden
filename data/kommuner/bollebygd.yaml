  krav:
  - &grund Föreningen ska ha säte eller föreningsadress i Bollebygd, bedriva verksamhet för kommuninvånare och vara införd i kommunens föreningsregister
  - &formalia Föreningen ska ha organisationsnummer, konto i föreningens namn, demokratiska stadgar, vald styrelse, revisor och ordnad bokföring
  - &arshandlingar Justerat årsmötesprotokoll, verksamhetsberättelse, ekonomisk berättelse, revisionsberättelse och verksamhetsplan ska kunna lämnas till kommunen
