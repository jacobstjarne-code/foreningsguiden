bidrag:
- id: bollebygd-aktivitetsstod
  namn: Aktivitetstöd
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för aktiviteter och verksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Sammankomsten ska ha minst 5 deltagare i åldern 4–20 år
  - En sammankomst ska vara minst 45 minuter
  - Föreningen ska uppfylla kommunens allmänna bestämmelser, bl.a. finnas i föreningsregistret och ha säte eller adress i
    Bollebygds kommun
  belopp: 30 kr per sammankomst för aktiviteter i hyresfria lokaler, 50 kr per sammankomst för aktiviteter i egen anläggning
    eller hyrd lokal
  sen_ansokan: Ansökan ska vara inskickad senast 25/2 för höstens aktiviteter (perioden 1/7–31/12) respektive 25/8 för vårens
    aktiviteter (perioden 1/1–30/6). Bidraget betalas ut två gånger per år.
  kalla_url: https://www.bollebygd.se/download/18.587e3e9718c33e1677021cc/1730464073313/Riktlinjer%20f%C3%B6r%20Bollebygds%20st%C3%B6d%20till%20f%C3%B6reningar%20och%20studief%C3%B6rbund.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Uppdaterad enligt Riktlinjer för Bollebygds stöd till föreningar och studieförbund (Utbildningsnämnden 2024-10-02,
    § 63), avsnitt 'Lokalt aktivitetsstöd (LOK-stöd)'. Tidigare uppgift om löpande ansökan stämmer inte med källan, som anger
    två fasta ansökningsdatum per år.
- id: bollebygd-anlaggningsbidrag
  namn: Anläggningsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för anläggningsunderhåll och investeringar
  deadlines:
    typ: fasta
    datum:
    - 01-31
  krav:
  - Ansökan ska innehålla redogörelse för planerad anläggning och syfte, fastighetskarta, styrkt kopia av nyttjanderättshandlingar
    (arrendekontrakt minst 10 år)/köpehandlingar/lagfartsbevis, ritningar eller arbetsbeskrivning samt kostnadsberäkning styrkt
    av offert
  - Arbetet ska vara färdigställt och slutredovisat inom tre år från beslutsdatum för att bidraget ska betalas ut
  - Föreningen kan inte få flera kommunala bidrag till samma anläggningsarbete
  belopp: 'Bidrag till ny-, om- eller tillbyggnad av lokal/anläggning: max 40 % av totala kostnaden (kostnaden måste överstiga
    15 000 kr). Bidrag till kostnadskrävande redskap (inköp över 30 000 kr): 30 % av inköpsbeloppet, max 30 000 kr. Bidrag
    till orienteringskartor: nyritning max 2 000 kr/km, revidering max 500 kr/km'
  sen_ansokan: Ansökan ska vara inskickad till kommunen senast den 31 januari det år bidraget önskas.
  kalla_url: https://www.bollebygd.se/download/18.587e3e9718c33e1677021cc/1730464073313/Riktlinjer%20f%C3%B6r%20Bollebygds%20st%C3%B6d%20till%20f%C3%B6reningar%20och%20studief%C3%B6rbund.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Uppdaterad enligt Riktlinjer för Bollebygds stöd till föreningar och studieförbund (Utbildningsnämnden 2024-10-02,
    § 63), avsnitt 'Investeringsbidrag'. Tidigare krav ('äga eller ha långtidskontrakt på anläggning') hittas inte ordagrant
    i källan utan ersätts av källans faktiska ansökningskrav.
- id: bollebygd-driftbidrag
  namn: Driftbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för drift och underhåll av lokaler
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningen ska själv driva anläggningen
  - Anläggningen ska motsvara en av de anläggningstyper som anges i kommunens bidragstabell (Utbildningsnämndens beslut om
    ytterligare anläggningstyper är normgivande)
  - Föreningen ska uppfylla kommunens allmänna bestämmelser, bl.a. finnas i föreningsregistret
  belopp: 'Fast bidrag per anläggning enligt kommunens tabell, t.ex.: fotbollsplan gräs/konstgräs minst 4000 kvm 12 000 kr,
    minst 3250 kvm 7 000 kr, minst 1500 kvm 4 000 kr; fotbollsplan grus minst 1500 kvm 3 000 kr; belysning per fotbollsplan
    3 000 kr; läktare 1 000 kr; ridanläggning (manege) 9 000 kr, (belyst paddock) 5 000 kr; båtsport-/vattenskidanläggning
    4 000 kr; motionsspår 400 kr/km, belyst 8 000 kr/km; golfbana 800 kr/hål; discgolf 800 kr/hål; downhilled inkl. lift 8
    000 kr/km; skidbacke med konstsnö 10 000 kr/km; revidering av orienteringskartor 3 500 kr/km; skjutbana 1 500 kr; boulebana
    500 kr/bana; skateboardanläggning 2 000 kr'
  sen_ansokan: Ansökan om driftbidrag ska vara inskickad till kommunen senast en (1) månad efter föreningens årsmöte. Bidraget
    betalas ut en gång per år.
  kalla_url: https://www.bollebygd.se/download/18.587e3e9718c33e1677021cc/1730464073313/Riktlinjer%20f%C3%B6r%20Bollebygds%20st%C3%B6d%20till%20f%C3%B6reningar%20och%20studief%C3%B6rbund.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Uppdaterad enligt Riktlinjer för Bollebygds stöd till föreningar och studieförbund (Utbildningsnämnden 2024-10-02,
    § 63), avsnitt 'Driftbidrag till idrotts/fritidsanläggningar'. Tidigare uppgift om löpande ansökan stämmer inte med källan,
    som anger deadline en månad efter årsmötet.
- id: bollebygd-ledarutbildning
  namn: Ledarutbildning
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningsrepresentanter för ledarskapsutbildning
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Kursdeltagare från registrerad förening i Bollebygd
  - Utbildning måste vara relevant för föreningen
  - Ansökan skickas via e-post
  belopp: null
  sen_ansokan: Möjlig löpande
  kalla_url: https://meeting.bollebygd.se/committees/utbildningsnamnden/mote-2024-09-25
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Kontrollerat mot Riktlinjer för Bollebygds stöd till föreningar och studieförbund (Utbildningsnämnden 2024-10-02,
    § 63), kommunens sida för föreningsbidrag och nämndens sammanträdesprotokoll 2024-09-25. Inget av dessa källor beskriver
    ett bidrag till ledarutbildning i Bollebygds kommun. Belopp, krav och deadline kan därför inte verifieras utifrån tillgängliga
    officiella källor; posten bör granskas manuellt för att avgöra om den är korrekt.
- id: bollebygd-verksamhetsbidrag
  namn: Verksamhetsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar för basalverksamhet och operationell kostnad
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Ansökan ska innehålla information om antalet medlemmar, verksamhetsberättelse, ekonomisk redovisning och revisionsberättelse
  - Bidraget beräknas utifrån medlemmar i åldern 4–20 år
  - Föreningen ska uppfylla kommunens allmänna bestämmelser, bl.a. finnas i föreningsregistret
  belopp: Beräknas som antal medlemmar × antal sammankomster × 0,8 (verksamhet i hyresfria lokaler) eller × 1,2 (verksamhet
    i egna/hyrda lokaler), i kronor per år
  sen_ansokan: Ansökan ska vara inskickad till kommunen senast en (1) månad efter föreningens årsmöte. Bidraget betalas ut
    en gång per år.
  kalla_url: https://www.bollebygd.se/download/18.587e3e9718c33e1677021cc/1730464073313/Riktlinjer%20f%C3%B6r%20Bollebygds%20st%C3%B6d%20till%20f%C3%B6reningar%20och%20studief%C3%B6rbund.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Uppdaterad enligt Riktlinjer för Bollebygds stöd till föreningar och studieförbund (Utbildningsnämnden 2024-10-02,
    § 63), avsnitt 'Verksamhetsbidrag'. Tidigare uppgift om löpande ansökan stämmer inte med källan, som anger deadline en
    månad efter årsmötet.
- id: bollebygd-lokalbidrag
  namn: Lokalbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för bidrag till lokalhyra och lokalkostnader
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Ansökan ska ange lokalens/fastighetens storlek (antal kvadratmeter), totalkostnad för lokalen/fastigheten (el, hyra, värme,
    vatten, avlopp, sophämtning) samt antal medlemmar i åldern 4–20 år
  - Hyrd lokal kräver hyresavtal samt full disponeringsrätt av lokalen
  - Utbildningsnämnden ska godkänna lokalen innan bidrag betalas ut
  - Lokalbidrag betalas inte ut till föreningar som får bidrag till bygdegårdar och samlingslokaler
  belopp: 'Egen lokal: lokalstödet utgår med 90 % av kostnaderna, högst 300 kr/kvm, baserat på antal medlemmar 4–20 år och
    kommunens tabell för berättigad bidragsyta. Egen fastighet: extra lokalbidrag på 25 kr/kvm, max 35 000 kr. Hyrd lokal:
    lokalstödet utgår med 75 % av lokalhyran, högst 200 kr/kvm, baserat på samma medlems-/bidragsytetabell'
  sen_ansokan: Ansökan ska vara inskickad till kommunen senast en (1) månad efter föreningens årsmöte. Bidraget betalas ut
    en gång per år.
  kalla_url: https://www.bollebygd.se/download/18.587e3e9718c33e1677021cc/1730464073313/Riktlinjer%20f%C3%B6r%20Bollebygds%20st%C3%B6d%20till%20f%C3%B6reningar%20och%20studief%C3%B6rbund.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Uppdaterad enligt Riktlinjer för Bollebygds stöd till föreningar och studieförbund (Utbildningsnämnden 2024-10-02,
    § 63), avsnitt 'Lokalbidrag'. Tidigare uppgift om löpande ansökan stämmer inte med källan, som anger deadline en månad
    efter årsmötet.
