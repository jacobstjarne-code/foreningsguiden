- id: jokkmokk-ideell-kreativitet
  namn: Ideell kreativitet – aktiviteter och projekt
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Ideella föreningar med verksamhet i Jokkmokks kommun
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Bidrag kan endast lämnas till föreningens huvudstyrelse och aktiviteten eller projektet ska ha samband med föreningsverksamheten
  - Stödet kan avse utbildning, föreningsutveckling, tävling, marknadsföring, aktiviteter för ledare, medlemmar eller allmänhet samt mindre verksamhetsinvesteringar
  - En investering får uppgå till högst 30 000 kronor; större investeringar hänvisas till andra stödformer
  - Stöd lämnas inte till löpande kostnader eller för att täcka underskott, och utbildning eller tävling ska ha en angiven ansvarig huvudman
  - Efter genomförandet ska föreningen lämna ekonomisk redovisning och rapport och återbetala medel som inte har använts till det beslutade ändamålet
  belopp: null
  sen_ansokan: Kan sökas före aktiviteten eller senast tre månader efter att aktiviteten avslutats
  kalla_url: https://www.jokkmokk.se/riktlinjer-foer-bidragsgivning-ideell-kreativitet/
  belopp_status: kontrollast
  belopp_avser: ren_pott
  kommunens_pott: Ideell Kreativitet är en kommunalt fördelad pott av bygdemedel; totalsumman publiceras inte. Handläggare får besluta om högst 7 500 kronor och mindre investeringar får omfatta högst 30 000 kronor.
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kraver_registrering: false
  sate_i_kommunen: true
  status: aktiv
  senast_verifierad: 2026-08-23
  anteckning: Kultur- och fritidsnämnden beslutar och kommunen betalar stödet. Det skiljer sig från investeringsstödet via Länsstyrelsen, som inte är en kommunpost.
- id: jokkmokk-kupp-kulturstod
  namn: KUPP – bidrag till kulturprojekt
  kategori: [kultur, ovrig]
  malgrupp: Föreningar och andra aktörer med utvecklingsinriktade kultur- och upplevelseprojekt i Jokkmokks kommun
  deadlines:
    typ: fasta
    datum: [01-27, 02-24, 05-12, 09-08, 11-10]
  krav:
  - Projektet ska röra kulturliv eller kulturupplevelser i Jokkmokks kommun, vara utvecklingsinriktat och ha en tydlig huvudman med ansvar för genomförande och ekonomi
  - Stöd lämnas inte till löpande verksamhet, underskott eller redan genomförda projekt, och tidigare KUPP-stöd ska vara redovisade
  - Projekt för eller av unga, lokal kultur, nya målgrupper och samarbeten samt långsiktigt hållbar verksamhet prioriteras
  - Sökanden ska respektera demokrati, jämställdhet och förbud mot diskriminering; välgörenhets-, insamlings- och vuxna partipolitiska organisationer kan inte få stöd
  - Slutredovisning med hela projektekonomin, genomförande och resultat ska lämnas senast två månader efter projektets slut
  belopp: Kommunalt KUPP-stöd för ansökningar upp till 30 000 kronor; högre ansökningar hanteras av Länsstyrelsen
  sen_ansokan: Fem beslutsomgångar 2026; ansökan ska lämnas i god tid före projektstart och marknadsarrangemang 2027 senast 8 september 2026
  kalla_url: https://www.jokkmokk.se/kultur-och-fritid/kultur/ansoek-om-kupp-kulturstoed/
