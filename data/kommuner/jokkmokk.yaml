- id: jokkmokk-subventionerad-foreningstaxa
  namn: Subventionerad föreningstaxa i kommunala idrotts- och badanläggningar
  kategori: [idrott, social, pensionar, funktionsratt, ovrig]
  malgrupp: Ideella föreningar som bokar kommunens sporthall, simhall eller varmvattenbassäng
  deadlines:
    typ: okand
    datum: []
  krav:
  - Bokning ska göras hos kommunens kultur- och fritidsverksamhet och önskad tid fördelas efter kommunens prioriteringsordning
  - Avgiftsfri sport- och simhall gäller idrottsföreningars barn- och ungdomsverksamhet; pensionärs-, barn- och funktionsrättsföreningar har särskild taxa i Kaitumbadet
  - Ansvarig ledare för hyrd simhall ska ha genomgått livräddningskurs och kunna styrka förmåga att hantera en livräddningssituation i vatten
  - Barn- och ungdomsidrott prioriteras först vid tidsfördelning och grupper för barn till och med 16 år har företräde före klockan 20
  belopp: Östra sport- och simhall är avgiftsfri för föreningars barn- och ungdomsidrott; Kaitumbadet kostar 100 kronor per timme, högst tre timmar per vecka, för pensionärsföreningar, barnföreningsverksamhet och funktionsrättsföreningar; övriga ideella föreningar betalar 200 kronor per timme
  sen_ansokan: Ingen särskild sista bokningsdag publiceras; boka i god tid eftersom handläggningstid kan förekomma
  kalla_url: https://www.jokkmokk.se/kultur-och-fritid/boka-idrotts-och-fritidsanlaeggningar/
