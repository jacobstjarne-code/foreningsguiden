- id: jokkmokk-lovaktiviteter
  namn: Bidrag till lovaktiviteter
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Föreningar, organisationer och kulturarbetare som ordnar avgiftsfria lovaktiviteter för barn och unga
  deadlines:
    typ: okand
    datum: []
  krav:
  - Aktiviteten ska rikta sig till barn och unga under ett skollov i kommunen
  - Aktiviteten ska vara öppen för alla intresserade och inte enbart för den egna föreningens medlemmar
  - Aktiviteten ska vara helt avgiftsfri för deltagarna
  - Materialersättning avser förbrukningsmaterial och inte varaktiga verktyg eller inventarier
  - Ansökan ska ange aktivitet, tid, plats, målgrupp, kostnader och ansvarig arrangör
  belopp: Ledare till och med 20 år 100 kronor per timme inklusive förberedelse; fika 25 kronor och måltid 50 kronor per deltagare; anläggning högst 500 kronor per tillfälle i kommunal lokal eller 1 000 kronor i egen anläggning; även material, extern ledare och fordon kan ersättas
  sen_ansokan: Kommunen publicerar en särskild frist för varje lov; höstlovet 2025 hade sista ansökningsdag 5 oktober
  kalla_url: https://www.jokkmokk.se/kultur-och-fritid/foereningar-och-foereningsliv/lovaktiviteter/
