  krav:
  - Minst 10 medlemmar som regelbundet deltar i föreningens verksamhet
  - Föreningens stadgar ska vara godkända av riksorganisation eller kommunen
  - Huvuddelen av medlemmarna ska vara bosatta i kommunen
  - Föreningen ska bedriva verksamhet i kommunen
  - Ekonomiska föreningar, politiska vuxenföreningar, elevföreningar (utom Skol-IF), försvarsrelaterade föreningar och supporterklubbar
