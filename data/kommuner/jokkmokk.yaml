bidrag:
- id: jokkmokk-verksamhetsbidrag
  namn: Verksamhetsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Ideella föreningar med regelbunden verksamhet i Jokkmokks kommun
  deadlines:
    typ: fasta
    datum: [05-31]
  krav:
  - Föreningen ska ha minst tio medlemmar som regelbundet deltar i verksamheten, bedriva verksamhet i kommunen och ha huvuddelen av medlemmarna bosatta där
  - Stadgarna ska vara godkända av en riksorganisation eller av kommunen och föreningen ska respektera demokratins idéer och mänskliga rättigheter
  - Verksamheten ska vara fri från narkotika och dopning; barn- och ungdomsverksamhet ska även främja frihet från alkohol, tobak, nikotin och spel om pengar
  - Ansökan från huvudstyrelsen ska innehålla styrelse, aktiva medlemmar och avgifter samt föregående verksamhetsberättelse, balans- och resultaträkning och kommande verksamhetsplan
  - Ekonomiska föreningar, vuxna partipolitiska föreningar, elevföreningar utom Skol-IF, försvarsorganisationer och supporterklubbar är inte stödberättigade
  belopp: null
  sen_ansokan: Senast 31 maj året före verksamhetsåret; kommunen kan sänka bidraget om ansökan kommer in sent
  kalla_url: https://www.jokkmokk.se/riktlinjer-foer-jokkmokks-kommuns-verksamhetsbidrag-foer-ideella-foereningar/
  belopp_status: kontrollast
  belopp_avser: ren_pott
  kommunens_pott: Kultur- och fritidsnämndens årliga budget för verksamhetsbidrag fördelas efter föreningsdialog och individuell bedömning; totalsumman publiceras inte
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
