- id: jokkmokk-vagbidrag
  namn: Kommunalt bidrag till enskild väg
  kategori: [ovrig]
  malgrupp: Väg- och samfällighetsföreningar som sköter en enskild väg utan statligt driftbidrag
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Väghållaren ska vara en vägförening eller vägsamfällighet och vägen får inte ha statligt driftbidrag
  - Vägen ska vara 100–999 meter, betjäna permanent bebodda helårsbostäder och inte vara en privat infart eller ligga i ett planlagt fritidshusområde
  - Vägen ska ligga i Jokkmokks kommun, vara öppen för allmän trafik och kunna trafikeras med motorfordon året runt
  - Ansökan ska avse föregående års väghållning och innehålla kommunens efterfrågade väg- och föreningsuppgifter
  belopp: 4 kronor per meter väg; kommunen kan sänka nivån om budgetmedlen inte räcker och belopp under 300 kronor betalas inte ut
  sen_ansokan: Senast 31 mars varje år; stödet betalas i efterhand
  kalla_url: https://www.jokkmokk.se/bygga-bo-och-miljoe/gator-och-vaegar/enskilda-vaegar/
