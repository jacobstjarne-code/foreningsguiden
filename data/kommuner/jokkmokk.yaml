  status: aktiv
  senast_verifierad: 2026-08-23
  anteckning: Avtalet om verksamhetsbidrag kan skrivas för ett till tre år. Stödet beslutas och betalas av Jokkmokks kommun.
- id: jokkmokk-startstod
  namn: Startstöd till nybildade föreningar
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Nybildade ideella föreningar som startar verksamhet i Jokkmokks kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökanden ska vara en nybildad ideell förening
  - Stödet ska avse kostnader som uppstår när föreningens verksamhet startas, exempelvis avgifter för banktjänster
  - Föreningen ska uppfylla verksamhetsstödets demokrati-, stadge- och lokala verksamhetsvillkor
  belopp: Högst 5 000 kronor
  sen_ansokan: Kan sökas under hela året
  kalla_url: https://www.jokkmokk.se/riktlinjer-foer-jokkmokks-kommuns-verksamhetsbidrag-foer-ideella-foereningar/
