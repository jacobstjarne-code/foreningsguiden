- id: mullsjo-verksamhetsbidrag
  namn: Verksamhetsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska ha minst 10 medlemmar i bidragsberättigad ålder (7–20 år), eller vara en handikappförening med medlemmar
    i alla åldrar, samt genomföra minst 15 bidragsberättigade aktiviteter per år.
  - En bidragsberättigad aktivitet är en sammankomst med minst tre deltagare i åldern 7–20 år, en ledare som är minst 13 år,
    en varaktighet på minst 60 minuter, beslutad och ekonomiskt planerad av styrelse, sektion eller medlemsmöte, och genomförd
    av lokalavdelningen (ej av riksorganisation, distrikt eller samarbetsorgan).
  - Föreningen ska uppfylla kommunens allmänna bestämmelser (antagna stadgar, vald styrelse med minst en myndig person, anslutning
    till riksorganisation med statligt stöd, registrering hos Kultur- och fritidsutskottet).
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.mullsjo.se/download/18.93f508818e5a765bd516c2f/1711537373728/Bidragsnormer%20f%C3%B6r%20f%C3%B6reningar.pdf
  belopp_status: okand
  deadline_status: olast
  krav_status: kontrollast
