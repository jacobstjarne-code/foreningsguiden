- id: mullsjo-ovriga-bidrag
  namn: Övriga bidrag
  kategori:
  - ovrig
  malgrupp: Bidragsberättigade föreningar
  deadlines:
    typ: fasta
    datum:
    - 05-15
  krav:
  - Bidraget riktar sig till lokala organisationer med ideell föreningsverksamhet som inte omfattas av kommunens övriga bidragsbestämmelser,
    samt till interkommunala/regionala distriktsorganisationer med betydelse för kommunen.
  - Ansökan ska innehålla föregående verksamhetsårs verksamhetsberättelse och ekonomiska redogörelse, kort redogörelse för
    planerad verksamhet inklusive budget, uppgifter om föreningens styrelse och kontaktperson, samt antal medlemmar i åldersgrupperna
    4–19 år och 20 år och äldre.
