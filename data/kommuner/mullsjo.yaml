- id: mullsjo-verksamhetsbidrag
  namn: Verksamhetsbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - ovrig
  - funktionsratt
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska ha minst 10 medlemmar i bidragsberättigad ålder (7–20 år), eller vara en handikappförening med medlemmar
    i alla åldrar, samt genomföra minst 15 bidragsberättigade aktiviteter per år.
  - En bidragsberättigad aktivitet är en sammankomst med minst tre deltagare i åldern 7–20 år, en ledare som är minst 13 år,
    en varaktighet på minst 60 minuter, beslutad och ekonomiskt planerad av styrelse, sektion eller medlemsmöte, och genomförd
    av lokalavdelningen (ej av riksorganisation, distrikt eller samarbetsorgan).
  - Föreningen ska uppfylla kommunens allmänna bestämmelser (antagna stadgar, vald styrelse med minst en myndig person, anslutning
    till riksorganisation med statligt stöd, registrering hos Kultur- och fritidsutskottet).
  - Verksamheten ska bedrivas i drog-, rök- och dopningsfri miljö och föreningen ska arbeta för integration.
  belopp: 23 kronor per sammankomst plus 5 kronor per deltagartillfälle enligt kommunens publicerade beloppsbilaga, som är märkt 2016
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Aktuell kommunwebb anger 25 februari och 25 augusti; en ansökan som kommer högst en månad sent minskas med 20 procent och därefter lämnas inget stöd
  kalla_url: *belopp
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Den aktuella webbsidans 25 februari och 25 augusti ersätter norm-PDF:ens äldre datum 15 februari och 15 augusti. Beloppsbilagan är märkt 2016.
  senast_verifierad: '2026-08-19'
- id: mullsjo-ledarutbildning
  namn: Ledarutbildningsbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som utbildar ledare
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Ledarutbildningen ska arrangeras eller samordnas av riks- eller regional ungdomsorganisation, eller genomföras i egen
    regi som lokal utbildning.
  - Kursdeltagarna ska vara fyllda 15 år.
  - Bidraget är maximerat per lokalavdelning och år utifrån föregående års verksamhetsbidrag, och kan inte utgå om annat bidrag
    till ledarutbildning redan lämnats, t.ex. genom studiecirkelbidrag.
  - Föreningen ska uppfylla kommunens allmänna bestämmelser för bidrag till ungdomsorganisationer.
  - Endast utbildningsavgift och resa tur och retur med billigaste färdmedel är stödgrundande.
  belopp: 80 procent av utbildningsavgift och stödgrundande resa; högst 50 procent av föregående års verksamhetsbidrag, minst 3 000 och högst 20 000 kronor per förening och år enligt den publicerade bilagan märkt 2016
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Aktuell kommunwebb anger 25 februari och 25 augusti; en ansökan som kommer högst en månad sent minskas med 20 procent och därefter lämnas inget stöd
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Normen anger 80 procent av stödgrundande kostnader. Den fortsatt länkade beloppsbilagan anger årsgränserna och är märkt 2016.
  senast_verifierad: '2026-08-19'
- id: mullsjo-lokal-anlaggning
  namn: Lokal- och anläggningsbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med kostnader för lokal eller anläggning
  deadlines:
    typ: fasta
    datum:
    - 05-15
  krav:
  - Lokalen eller anläggningen ska vara belägen i kommunen och verksamheten ska i huvudsak vara avsedd för åldersgruppen 7–20
    år.
  - Vid lokalbidrag ska avtal om förhyrning godkännas i förväg av Kultur- och fritidsutskottet och lokalen brukas regelbundet
    minst 15 gånger per år.
  - Vid anläggningsbidrag ska anläggningen vara föreningsägd eller långfristigt förhyrd och godkänd av Kultur- och fritidsutskottet
    som bidragsberättigad, brukas regelbundet av föreningen, och föreningen förbinder sig att vårda och underhålla anläggningen.
  - Föreningen ska uppfylla kommunens allmänna bestämmelser för bidrag till ungdomsorganisationer.
  - Ansökan ska redovisa faktiska kostnader för det senast avslutade hela redovisningsåret och eventuella hyresintäkter.
  belopp: Lokalbidrag är 75 procent av godkänd hyra eller nettodrift, högst tre gånger föregående års verksamhetsbidrag och 22 000 kronor enligt bilagan märkt 2016; anläggningsbidrag lämnas enligt publicerade schabloner, exempelvis 48 000 kronor för A-fotbollsplan, 32 000 för övrig fullstor gräsplan och 3 500 för grustennisbana
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: En ansökan som kommer högst en månad efter 15 maj minskas med 20 procent; därefter lämnas inget stöd
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunala lokaler upplåts dessutom till starkt subventionerad föreningstaxa. Den publicerade schablonbilagan är märkt 2016.
  senast_verifierad: '2026-08-19'
- id: mullsjo-forfogande
  namn: Bidrag till kultur- och fritidsnämndens förfogande
  status: aktiv
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med särskilda behov eller initiativ
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidraget prövas i varje enskilt fall av Kultur- och fritidsutskottet efter särskild framställning, för insatser eller
    projekt som inte täcks av de generella bidragsreglerna, t.ex. insatser inom viss målgrupp, projekt för nya metoder, utvecklingsstöd
    för ideologiskt markerade organisationer, eller mindre ombyggnader/inventarier i egna anläggningar och lokaler.
  - Ansökan ska behandlas av Kultur- och fritidsutskottet eller dess presidium innan objektet påbörjas.
  - Sökanden ska vara en förening som omfattas av kommunens allmänna bidragsvillkor.
