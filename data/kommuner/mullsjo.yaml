    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara nystartad och uppfylla kommunens allmänna bestämmelser för bidrag till ungdomsorganisationer (minst
    10 medlemmar i åldern 7–20 år, antagna stadgar, vald styrelse med minst en myndig person, anslutning till riksorganisation
    som får statligt stöd, samt registrering hos Kultur- och fritidsutskottet).
  - Ansökan ska åtföljas av protokoll från föreningens bildande, stadgar, intyg som styrker upptagande i riksorganisation
    samt redogörelse för planerad verksamhet och budget för närmaste verksamhetsåret.
  - Föreningen ska bedriva verksamheten i drog-, rök- och dopningsfri miljö och arbeta för integration i föreningslivet.
  belopp: 3 000 kronor enligt kommunens publicerade beloppsbilaga, som är märkt 2016
