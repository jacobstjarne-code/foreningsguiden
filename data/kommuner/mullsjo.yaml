  anteckning: null
- id: mullsjo-lokal-anlaggning
  namn: Lokal- och anläggningsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med kostnader för lokal eller anläggning
  deadlines:
    typ: fasta
    datum:
    - 05-15
  krav:
  - Lokalen eller anläggningen ska vara belägen i kommunen och verksamheten ska i huvudsak vara avsedd för åldersgruppen 7–20
    år.
  - Vid lokalbidrag ska avtal om förhyrning godkännas i förväg av Kultur- och fritidsutskottet och lokalen brukas regelbundet
    minst 15 gånger per år.
  - Vid anläggningsbidrag ska anläggningen vara föreningsägd eller långfristigt förhyrd och godkänd av Kultur- och fritidsutskottet
    som bidragsberättigad, brukas regelbundet av föreningen, och föreningen förbinder sig att vårda och underhålla anläggningen.
  - Föreningen ska uppfylla kommunens allmänna bestämmelser för bidrag till ungdomsorganisationer.
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.mullsjo.se/download/18.93f508818e5a765bd516c2f/1711537373728/Bidragsnormer%20f%C3%B6r%20f%C3%B6reningar.pdf
  belopp_status: okand
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: mullsjo-forfogande
  namn: Bidrag till kultur- och fritidsnämndens förfogande
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med särskilda behov eller initiativ
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidraget prövas i varje enskilt fall av Kultur- och fritidsutskottet efter särskild framställning, för insatser eller
    projekt som inte täcks av de generella bidragsreglerna, t.ex. insatser inom viss målgrupp, projekt för nya metoder, utvecklingsstöd
    för ideologiskt markerade organisationer, eller mindre ombyggnader/inventarier i egna anläggningar och lokaler.
  - Ansökan ska behandlas av Kultur- och fritidsutskottet eller dess presidium innan objektet påbörjas.
