- id: mullsjo-investeringsbidrag
  namn: Investeringsbidrag 1 och 2
  status: aktiv
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som planerar investeringar
  deadlines:
    typ: fasta
    datum:
    - 05-15
  krav:
  - Bidraget avser ny- eller tillbyggnad, större underhållsarbeten på egna fastigheter/anläggningar, eller inköp av maskiner
    som förutsättning för anläggningens drivande, och projektet ska bedömas som synnerligen angeläget för föreningen och/eller
    kommunen.
  - Ansökan ska innehålla bilagor som inriktning, kostnadskalkyl, finansieringsplan och eventuella ritningar, och ska behandlas
    innan objektet påbörjas.
  - För det stora investeringsbidraget (över 2 basbelopp) krävs att en stor ideell insats ingår i projektet och att bidrag
    också söks från statlig myndighet där det är möjligt.
  - Ansökan ska lämnas senast 15 maj året före förväntad utbetalning och beslutas innan projektet påbörjas.
  belopp: Litet investeringsbidrag är högst två tredjedelar av verifierade kostnader för köpta tjänster och material och högst två prisbasbelopp; stort investeringsbidrag över två prisbasbelopp lämnas som ränte- och amorteringsfritt lån efter individuell prövning
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast 15 maj året före förväntad utbetalning; en ansökan som kommer högst en månad sent minskas med 20 procent och därefter lämnas inget stöd
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
