  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Lokalägande föreningar som driver en allmän samlingslokal eller bystuga i Åre kommun
  deadlines:
    typ: fasta
    datum: [05-31]
  krav:
  - Föreningen ska uppfylla kommunens grundvillkor och äga en lokal som ligger i Åre kommun
  - Lokalen ska hållas tillgänglig för allmänheten, andra föreningar och skolan i så stor utsträckning som möjligt
  - Föreningen ska redovisa barn- och ungdomsaktiviteter genom det lokala aktivitetsstödet
  - Verksamhetsberättelse och bokslut från föregående år ska bifogas ansökan
  - Lokalägarförening som får lokalbidrag kan inte samtidigt få kommunens elbidrag
  belopp: Högst 37 500 kr per år för större lokaler och 15 000 kr per år för mindre bystugor
  belopp_avser: per_forening
  kommunens_pott: null
