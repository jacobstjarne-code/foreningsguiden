  - Föreningen ska uppfylla kommunens grundvillkor och redovisa verksamhet för äldre över 65 år eller personer med funktionsnedsättning
  - Grundbidraget ska användas för föreningens ordinarie verksamhet och kontinuitet
  - Aktivitetsbidraget ska avse en planerad främjande eller förebyggande aktivitet utöver det lokala aktivitetsstödet
  - Aktivitetsbidrag ska sökas i förväg och aktivitetens innehåll och kostnader ska redovisas
  - Verksamhetsberättelse, bokslut och revisionsberättelse från föregående år ska bifogas den årliga ansökan
  belopp: 5 000 kr i årligt grundbidrag samt högst 500 kr per redovisad aktivitet, högst tio aktiviteter per år
