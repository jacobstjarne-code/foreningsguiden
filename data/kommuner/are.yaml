- id: are-kulturarrangemang
  namn: Kulturarrangemangsbidrag
  kategori:
  - kultur
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara verksam i Åre kommun och registrerad i Åre kommuns föreningsregister
  - Bidraget gäller offentliga kulturarrangemang och betalas till den arrangerande föreningen
  - Bidrag ges för arvode och resekostnader för artister/medverkande (ej föreningens egna medlemmar), kostnader för ljud/ljus,
    marknadsföring samt extern lokalhyra för arrangemanget
  - Ansökan ska beskriva arrangemangets namn och innehåll, sökt bidragsbelopp samt en enkel budget med intäkter/utgifter och
    budgeterat överskott/underskott
  - Redovisning av aktivitet och ekonomi ska lämnas in direkt efter genomförandet, varefter bidraget betalas ut
  - Åre kommuns kommunlogotyp ska synas i marknadsföringen av arrangemanget
  belopp: "Maxbelopp 25 000 kr per arrangemang"
