  krav:
  - Minst 3 matrikelförda medlemmar och registrering i Åre kommuns föreningsregister
  - Föreningen ska vara aktiv och bedriva ideell verksamhet till nytta för kommunens invånare
  - Verksamheten ska bygga på demokratiska grunder och vara öppen för alla som stödjer föreningens ändamål
  - Föreningen ska vara registrerad hos Skatteverket samt ha post- eller bankgiro och organisationsnummer
  - Verksamhetsberättelse, balansräkning och revisionsberättelse ska skickas in årligen senast 15 mars
  - Gäller barn och unga 4–25 år samt vuxna över 65 år
  - Gruppaktiviteten ska vara minst 45 minuter lång och ledas av minst en av föreningen utsedd ledare med minst tre aktiva
    deltagare
  - Stöd ges för högst 20 deltagare per närvarande ledare
  - Ledaren ska ha fyllt 13 år, vara medlem i föreningen och får inte ansvara för flera gruppaktiviteter samtidigt
  - Deltagarna ska vara medlemmar i föreningen
  - Bidrag utgår endast en gång per dag och grupp
  - Närvarokort ska föras vid varje träff och vara korrekt ifyllda
