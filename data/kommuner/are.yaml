- id: are-lokalt-aktivitetsbidrag
  namn: Lokalt kommunalt aktivitetsbidrag
  status: aktiv
  kategori: [idrott, kultur, pensionar, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar med ledarledd verksamhet för barn och unga 4–25 år eller vuxna över 65 år
  deadlines:
    typ: fasta
    datum: [03-30]
  krav:
  - Föreningen ska uppfylla kommunens grundvillkor, vara registrerad i föreningsregistret och redovisa verksamhet för deltagare 4–25 år eller över 65 år
  - Varje gruppaktivitet ska pågå minst 45 minuter, vara ledd av minst en utsedd ledare och ha minst tre aktiva deltagare
  - Stöd lämnas för högst 20 deltagare per närvarande ledare; ledaren ska vara minst 13 år, medlem i föreningen och får inte ansvara för flera grupper samtidigt
  - Deltagarna ska vara medlemmar och en grupp får räknas högst en gång per dag
  - Närvarokort ska föras vid varje träff och sparas för kommunens kontroll; endast en sammanställning lämnas med ansökan
  belopp: Högst 20 kr per sammankomst och 7 kr per deltagare; den faktiska nivån beror på antalet ansökningar
  belopp_avser: per_forening
  kommunens_pott: Kommunfullmäktige fastställer årligen budgetramen; totalsumman publiceras inte
  sen_ansokan: Fullständig ansökan för 2026 ska lämnas senast 30 mars
