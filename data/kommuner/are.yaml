- id: are-kulturarrangemang
  namn: Kulturarrangemangsbidrag
  status: aktiv
  kategori: [kultur]
  foreningstyp: [kultur, hembygd, annat]
  malgrupp: Registrerade föreningar i Åre kommun som arrangerar offentliga kulturarrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökanden ska vara en förening verksam i Åre kommun och registrerad i kommunens föreningsregister
  - Arrangemanget ska vara offentligt och bidra till ett varierat kulturutbud och geografisk spridning; kultur för barn och unga prioriteras
  - Stöd kan avse arvoden och resor för externa artister eller medverkande, ljud och ljus, marknadsföring och extern lokalhyra
  - Ansökan ska beskriva arrangemanget och innehålla sökt belopp samt en budget med intäkter, utgifter och beräknat resultat
  - Aktivitet och ekonomi ska redovisas direkt efter arrangemanget före utbetalning
  - Åre kommuns logotyp och samverkan ska framgå av marknadsföringen
  belopp: Högst 25 000 kr per arrangemang för hela eller delar av en eventuell förlust
  belopp_avser: per_forening
  kommunens_pott: null
