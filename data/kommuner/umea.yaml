- id: umea-bidragsberattigad
  vad: Bli godkänd som bidragsberättigad förening
  beskrivning: Föreningen utser en föreningsadministratör som loggar in med BankID och ansöker om att bli kund i kommunens boknings- och bidragssystem.
    Bifoga stadgar, nybildnings- eller årsmötesprotokoll, organisationsnummer och bankuppgifter. Stadgarna ska ange att föreningen har sitt säte
    i Umeå. Minst fem medlemmar.
