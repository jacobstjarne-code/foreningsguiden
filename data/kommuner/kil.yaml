- id: kil-aktivitetsbidrag
  namn: Kommunalt aktivitetsbidrag
  status: aktiv
  kategori: [idrott, kultur, funktionsratt, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med barn- och ungdomsverksamhet samt funktionsrättsföreningar utan övre åldersgräns
  deadlines: {typ: fasta, datum: [02-25, 08-25]}
  krav:
  - Sammankomsten ska vara planerad och beslutad av styrelse, medlemsmöte eller motsvarande och pågå minst 45 minuter
  - Minst fem deltagare ska närvara och deltagare räknas normalt i åldern 7–25 år; funktionsrättsföreningar saknar övre åldersgräns
  - En deltagare får räknas i högst en sammankomst per dag i samma organisation och en aktivitet får bara ett bidrag per sammankomst och dag
  - Närvarobok ska föras och kunna kontrolleras i minst fyra år
  - Föreningen ska redovisa via Rbok, med fil från IdrottOnline eller annan digital plattform när sådan används
  belopp: 35 kr per godkänd sammankomst
  belopp_avser: per_forening
