- id: kil-arrangemangsbidrag
  namn: Arrangemangsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar som genomför offentliga arrangemang i Kils kommun
  deadlines: {typ: relativ, datum: []}
  krav:
  - Arrangemanget ska vara öppet för allmänheten, äga rum i Kils kommun och främja ett kommunalt medborgarperspektiv
  - Ansökan ska innehålla arrangemangsbeskrivning, ekonomisk kalkyl samt föreningens och externa parters insatser
  - Ansökan om högst 15 000 kr ska lämnas minst tre månader före arrangemanget
  - Ansökan över 15 000 kr kräver särskilt beslut av kommunstyrelsen och ska lämnas sex till tolv månader före arrangemanget
  - Redovisning ska lämnas senast två månader efter genomförandet och avvikande eller uteblivet genomförande kan medföra återbetalning
  belopp: Individuellt prövat; ansökningar till och med 15 000 kr handläggs kvartalsvis och högre belopp kräver särskilt beslut
