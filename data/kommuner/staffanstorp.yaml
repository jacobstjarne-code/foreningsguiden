- id: staffanstorp-lokalt-aktivitetsstod
  ansokningsvag: null
  namn: Lokalt aktivitetsstöd
  kategori: [idrott, kultur, funktionsratt, ovrig]
  malgrupp: Bidragsberättigade föreningar med ledarledda gruppaktiviteter för barn och unga
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara öppen för alla och driva ideell verksamhet
  - Föreningen ska vara uppbyggd och fungera enligt demokratiska principer
  - Föreningen ska ha minst 15 medlemmar som erlagt fastställd medlemsavgift och kan delta i årsmöte
  - Föreningen ska ha antagna skriftliga stadgar, som tillsammans med kopia av protokollet vid föreningens bildande ska skickas
    in till kultur- och föreningsförvaltningen i samband med föreningsregistrering
  - Föreningen ska ha en stadgeenligt vald styrelse om minst tre personer samt valda/utsedda revisorer
  - Föreningen ska ha och kunna redovisa en policy för att motverka sexuella trakasserier och användning av dopingpreparat
    samt för att upprätthålla barnkonventionen
  - Föreningen ska utse en person som ansvarar för att policydokumenten upprätthålls och hålls uppdaterade
  - Föreningen ska ha organisationsnummer från Skatteverket samt inneha plus- eller bankgirokonto
  - Stödberättigad aktivitet är en ledarledd gruppaktivitet med minst 3 medlemmar i åldern 4–25 år (stöd kan även ges till
    föreningens 'prova-på'-verksamhet och liknande aktiviteter i rekryteringssyfte)
  - Ledaren ska vara utsedd av föreningen och kan inte vara ansvarig för flera gruppaktiviteter samtidigt
  - En gruppaktivitet ska pågå minst 45 minuter
  - Gruppaktiviteten ska vara beslutad och ekonomiskt planerad av styrelse, medlemsmöte eller liknande och genomförd i föreningens
    regi
  - En deltagare får endast räknas som deltagare i 1 gruppaktivitet per dag i samma förening
  - Gruppaktiviteten ska dokumenteras på föreskrivet sätt och dokumentationen förvaras i minst sju år
  belopp: 6 kr per deltagare 4–6 år, 8 kr för 7–12 år, 10 kr för 13–19 år och 4 kr för 20–25 år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Januari–juni redovisas senast 25 augusti och juli–december senast 25 februari
  kalla_url: https://staffanstorp.se/app/uploads/2025/09/kultur-och-foreningsnamndens-bidrag-stod-och-stipendier-2023.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Prova-på-verksamhet och liknande rekryteringsaktiviteter kan också vara stödberättigade.
  foreningstyp: [idrott, kultur, ungdom, annat]
  senast_verifierad: '2026-08-18'
- id: staffanstorp-anlaggningsstod
  namn: Anläggningsstöd
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar som äger en anläggning inom Staffanstorps kommun
  deadlines:
    typ: fasta
    datum: ['04-01']
  krav:
  - Föreningen ska äga anläggningen och anläggningen ska ligga inom Staffanstorps kommun
  - Föreningen ska uppfylla kommunens allmänna villkor för ideell och demokratiskt organiserad föreningsverksamhet
  - Godkända nettodriftskostnader är renhållning, försäkring, vatten och avlopp, sotning, värme, el samt löpande skötsel och underhåll
  - Investeringar som gjorts under året före ansökningsåret får tas med i underlaget
  - Minst 250 deltagartillfällen per år för åldern 4–25 år eller motsvarande verksamhet krävs för den högre stödnivån
  belopp: Högst 50 procent av godkända nettokostnader vid minst 250 deltagartillfällen per år; annars högst 25 procent
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast 1 april
  kalla_url: https://staffanstorp.se/app/uploads/2025/09/kultur-och-foreningsnamndens-bidrag-stod-och-stipendier-2023.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet beräknas på föregående års kostnader och investeringar.
  foreningstyp: [idrott, kultur, ungdom, friluft, annat]
  senast_verifierad: '2026-08-18'
