- id: staffanstorp-verksamhetsstod
  namn: Verksamhetsstöd
  kategori: [kultur, ovrig]
  malgrupp: Främst föreningar och andra aktörer som bedriver kulturverksamhet av vikt för kommunen
  deadlines:
    typ: fasta
    datum: ['10-01']
  krav:
  - Verksamheten ska vara riktad till kommuninvånarna och vara av betydelse för kommunen
  - Medlemmarnas tillfälliga eller kontinuerliga verksamhet ska vara en viktig del och bygga på frivilliga ledarinsatser
  - Ansökan ska beskriva stödbehovet, sökt belopp, annan sökt finansiering och hur verksamheten bidrar till ett rikt kulturliv
  - Verksamheten ska vara öppen och föreningen ska beskriva vilken motprestation den kan erbjuda kommunen
  - Ett inledande samtal med kultur- och föreningsförvaltningen ska genomföras före den digitala ansökan
  belopp: Kommunen publicerar inget generellt belopp; stödet prövas individuellt och kan vara ekonomiskt stöd, marknadsföring eller tillfällig lokal
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast 1 oktober
  kalla_url: https://staffanstorp.se/app/uploads/2025/09/kultur-och-foreningsnamndens-bidrag-stod-och-stipendier-2023.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stöd kan även delvis avse vård av en kulturhistoriskt värdefull byggnad när verksamheten motsvarar stödets syfte.
  foreningstyp: [kultur, hembygd, annat]
  senast_verifierad: '2026-08-18'
- id: staffanstorp-arrangemangsstod
  namn: Arrangemangsstöd
  kategori: [kultur, ovrig]
  malgrupp: Föreningar och andra aktörer som inte får verksamhetsstöd och genomför ett offentligt arrangemang i kommunen
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Arrangemanget ska genomföras inom kommunen och vara öppet för alla invånare
  - God tillgänglighet ska eftersträvas vid arrangemangets genomförande
  - Sökanden får inte samtidigt få verksamhetsstöd från kultur- och föreningsnämnden
  - Ansökan sker digitalt senast sex veckor före arrangemangets genomförande
  - Redovisning av arrangemanget ska lämnas på fastställd blankett till Kultur- och föreningsenheten senast två månader efter
    genomförandet, samt genom en muntlig presentation vid någon av kommunens träffar för kulturella och kreativa näringar
  belopp: Kommunen publicerar inget generellt belopp; stödet prövas individuellt som ekonomiskt bidrag eller förlustgaranti, marknadsföring eller tillfällig lokal
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast sex veckor före arrangemanget
  kalla_url: https://staffanstorp.se/app/uploads/2025/09/kultur-och-foreningsnamndens-bidrag-stod-och-stipendier-2023.pdf
