- namn: Föreningsbidrag till sociala föreningar och organisationer
  kategori:
  - social
  - pensionar
  - funktionsratt
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Föreningen ska ha lokal anknytning och vända sig till invånarna i Staffanstorps kommun
  - Föreningen ska vara demokratiskt uppbyggd, dvs. ha en vald styrelse, stadgar och regelbundna möten
  - Föreningen ska vara registrerad hos Skatteverket och ha ett organisationsnummer
  - Föreningen ska presentera mål för verksamheten och arbeta för att följa upp resultaten
  - Föreningen ska bedriva frivilligt socialt arbete för äldre människor eller personer med funktionsnedsättning och inte
    huvudsakligen bedriva sportslig eller tävlingsverksamhet
  - Ansökan om mer än 100 000 kronor ska innehålla en beskrivning av hur föreningen arbetar för att motverka ofrivillig ensamhet
    i föreningens målgrupp
  - Ansökan ska innehålla föreningens namn, kontaktuppgifter till ordförande, kassör och revisor, bankens namn och kontonummer,
    antal medlemmar varav antal boende i Staffanstorps kommun, redovisning av hur förra årets bidrag använts, beskrivning
    av hur det sökta bidraget avses användas, protokoll från senaste årsmötet, årsbokslut, ekonomisk berättelse, revisionsberättelse,
    föreningens stadgar samt uppgift om ansökan om föreningsbidrag även görs i annan kommun
  - Ansökan kan endast avse medlemmar bosatta i Staffanstorps kommun
