- id: staffanstorp-kommunstyrelsens-foreningsbidrag
  namn: Kommunstyrelsens föreningsbidrag
  kategori: [social, kultur, ovrig]
  malgrupp: Ideella föreningar med allmännyttigt ändamål och anknytning till kommunen eller dess invånare
  deadlines:
    typ: fasta
    datum: ['11-01']
  krav:
  - Föreningen ska vara ideell och verka för ett allmännyttigt ändamål
  - Ändamålet ska ha anknytning till Staffanstorps kommuns område eller kommunens invånare
  - Ansökan ska innehålla senaste årsmötesprotokoll, årsberättelse och ekonomiska berättelse
  - Ansökan ska innehålla innevarande eller kommande års budget, verksamhetsplan och senast antagna stadgar om kommunen inte redan har dem
  - Ansökan ska avse nästkommande verksamhetsår
