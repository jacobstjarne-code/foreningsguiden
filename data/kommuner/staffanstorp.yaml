  - Bokslut och revisionsberättelse ska upprättas för varje kalenderår och bifogas ansökan
  - Vägen ska vara i gott skick vid kommunens besiktning före utbetalning
  belopp: 20 procent av klassad schablonkostnad per meter för vägföreningar med statsbidrag och 50 procent för övriga berättigade vägföreningar
