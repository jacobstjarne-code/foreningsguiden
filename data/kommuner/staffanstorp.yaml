bidrag:
- namn: Lokalt aktivitetsstöd
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med ungdomsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara öppen för alla och driva ideell verksamhet
  - Föreningen ska vara uppbyggd och fungera enligt demokratiska principer
  - Föreningen ska ha minst 15 medlemmar som erlagt fastställd medlemsavgift och kan delta i årsmöte
  - Föreningen ska ha antagna skriftliga stadgar, som tillsammans med kopia av protokollet vid föreningens bildande ska skickas
    in till kultur- och föreningsförvaltningen i samband med föreningsregistrering
  - Föreningen ska ha en stadgeenligt vald styrelse om minst tre personer samt valda/utsedda revisorer
  - Föreningen ska ha och kunna redovisa en policy för att motverka sexuella trakasserier och användning av dopingpreparat
    samt för att upprätthålla barnkonventionen
  - Föreningen ska utse en person som ansvarar för att policydokumenten upprätthålls och hålls uppdaterade
  - Föreningen ska ha organisationsnummer från Skatteverket samt inneha plus- eller bankgirokonto
  - Stödberättigad aktivitet är en ledarledd gruppaktivitet med minst 3 medlemmar i åldern 4–25 år (stöd kan även ges till
    föreningens 'prova-på'-verksamhet och liknande aktiviteter i rekryteringssyfte)
  - Ledaren ska vara utsedd av föreningen och kan inte vara ansvarig för flera gruppaktiviteter samtidigt
  - En gruppaktivitet ska pågå minst 45 minuter
  - Gruppaktiviteten ska vara beslutad och ekonomiskt planerad av styrelse, medlemsmöte eller liknande och genomförd i föreningens
    regi
  - En deltagare får endast räknas som deltagare i 1 gruppaktivitet per dag i samma förening
  - Gruppaktiviteten ska dokumenteras på föreskrivet sätt och dokumentationen förvaras i minst sju år
