  - Godkända nettokostnader är kallhyra, renhållning, försäkring, vatten och avlopp, sotning, värme, el och tomträttsarrende
  - Minst 250 deltagartillfällen per år för åldern 4–25 år eller motsvarande verksamhet krävs för den högre stödnivån
  belopp: Högst 50 procent av godkända nettokostnader vid minst 250 deltagartillfällen per år; annars högst 25 procent
