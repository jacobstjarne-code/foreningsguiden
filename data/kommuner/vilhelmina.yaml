- id: vilhelmina-lokalt-aktivitetsstod
  namn: Kommunalt lokalt aktivitetsstöd
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: *alla
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara registrerad i Vilhelmina kommuns föreningsregister, vilket bland annat kräver minst 10 medlemmar,
    antagna stadgar, vald styrelse samt säte och/eller verksamhet i Vilhelmina kommun
  - Sammankomsten ska vara planerad av föreningen, ledarledd av en person som är lägst 13 år, bestå av minst 3 bidragsberättigade
    deltagare i åldern 7–25 år (eller personer med funktionsvariationer även över 25 år) och pågå minst 60 minuter med gemensam
    inledning och avslutning
  - Närvarokort ska föras vid varje sammankomst av gruppledaren och bifogas ansökan
  - En deltagare får endast räknas en gång per dag i sammanhängande verksamhet/idrott/förening, och en grupp får inte delas
    i mindre grupper för att öka antalet sammankomster
  - Aktivitetsstöd utgår inte till entrébelagda tävlingar, kommersiella arrangemang eller studiecirkelsammankomster/lärgruppstimmar
  - Ansökan ska styrkas av föreningens av styrelsen utsedda firmatecknare
  belopp: 50 kr per sammankomst, under förutsättning att ramen för av kommunstyrelsen anvisade medel inte överskrids
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningar efter angiven sista dag kan avvisas
  kalla_url: https://sjalvservice.vilhelmina.se/oversikt/overview/286
