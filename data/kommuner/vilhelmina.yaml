- id: vilhelmina-bygdemedel
  namn: Bygdemedel
  kategori:
  - kultur
  - ovrig
  foreningstyp: *alla
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: fasta
    datum:
    - 01-31
  krav:
  - Sökande ska vara en organisation öppen för alla, med organisationsnummer (t.ex. bygdegårds-, hembygds- eller idrottsförening);
    stiftelser, samfälligheter och ekonomiska föreningar kan undantagsvis beviljas bygdemedel
  - Organisationen ska vara verksam i den berörda bygden/kommunen
  - Bygdemedel finansierar normalt högst 90 % av faktiska, godkända och styrkta kostnader
  - Bidrag ges inte till driftkostnader, investeringar som kan kräva fortsatt medfinansiering, eller eget arbete
  - Ansökan görs till Länsstyrelsen Västerbotten, inte till kommunen
  belopp: Inget fast kronbelopp; bygdemedel kan normalt finansiera högst 90 % av faktiska, godkända och styrkta kostnader,
