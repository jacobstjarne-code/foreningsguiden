- id: vilhelmina-kulturellt-verksamhetsstod
  namn: Kulturellt verksamhetsstöd
  kategori:
  - kultur
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen ska vara registrerad i Vilhelmina kommuns föreningsregister, vilket bland annat kräver minst 10 medlemmar,
    antagna stadgar, vald styrelse samt säte och/eller verksamhet i Vilhelmina kommun
  - Verksamheten ska ha huvudsaklig kulturell inriktning, t.ex. musik, teater, film, konst, konsthantverk eller kulturminnesvård
  - Ansökan söks en gång per år för föreningens ordinarie verksamhet och ska vara kommunen tillhanda senast 15 april
  - Till ansökan ska bifogas verksamhetsplan för kommande år, verksamhets- och årsberättelse, bokslut med resultat- och balansräkning,
    revisionsberättelse samt årsmötesprotokoll från senast avslutade verksamhets-/räkenskapsår
  belopp: Stödets storlek prövas och fastställs årligen av Vilhelmina kommun; inget fast belopp anges
  sen_ansokan: Ansökningar med tillhörande handlingar som inte inkommit till Utvecklingsenheten inom föreskriven tid kan inte
    komma i fråga för stöd
  kalla_url: https://www.vilhelmina.se/media/2872/riktlinjer-foer-foereningar-i-vilhelmina-kommun.pdf
