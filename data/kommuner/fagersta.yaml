- id: fagersta-sponsring
  namn: Sponsring från Fagersta kommun
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med publik samhällsnyttig verksamhet, aktivitet eller evenemang med anknytning till Fagersta
  deadlines:
    typ: fasta
    datum: [08-25]
  krav:
  - Sökanden ska vara en förening; kommunen sponsrar inte enskilda personer eller företag och inte politiska eller religiösa organisationer
  - Verksamheten, evenemanget eller aktiviteten ska vara publik, rikta sig till allmänheten och stärka platsvarumärket Fagersta
  - Ansökan ska beskriva syfte, budget, förväntad publik och uppmärksamhet, jämställdhetsarbete, samarbetspartner och parternas åtaganden
  - Föreningen ska ge en motprestation genom aktiv marknadsföring eller aktivitet för kommunen och använda kommunens logotyp och platsvarumärke
  - Samma verksamhet får inte samtidigt få annat ekonomiskt kommunstöd; uppföljning ska lämnas inom sex veckor efter genomförandet
  belopp: Individuellt sponsringsbelopp efter syfte, förväntad publik, uppmärksamhetsvärde och mottagarens jämställdhetsarbete
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ordinarie ansökan senast den 25 augusti året före genomförandet; extra period kan utlysas vid behov
  kalla_url: https://fagersta.se/uppleva--gora/foreningsinformation/sponsring
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
- id: fagersta-kostnadsfria-lovaktiviteter-2026
  namn: Bidrag för kostnadsfria lovaktiviteter 2026
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ideella föreningar som ordnar avgiftsfria lovaktiviteter för barn och unga 7–25 år
  deadlines:
    typ: fasta
    datum: [03-22, 05-03, 10-04, 12-06]
  krav:
  - Aktiviteten ska vara öppen och helt avgiftsfri för barn och unga och får inte vara ordinarie verksamhet som träning eller match
  - Aktiviteten ska stimulera både flickor och pojkar, vara möjlig att delta i oavsett förutsättningar och främja fysiskt eller psykiskt välmående
  - Ansökan ska beskriva aktivitet, målgrupp och budget; kvalitet, deltagarnivå, geografisk spridning och ideella insatser vägs in
  - Beviljade ledare ska genomföra kommunens digitala jämlikhetsutbildning före aktiviteten
  - Föreningen ska redovisa deltagare, genomförande, kvitton, fakturor och annan dokumentation inom fyra veckor; utbetalning sker efter godkänd redovisning
  belopp: Individuellt prövat belopp; kommunen publicerar ingen generell 2026-nivå utanför den aktuella ansökningsomgången
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Påsklov 22 mars, sommarlov 3 maj, höstlov 4 oktober och jullov 6 december 2026
  kalla_url: https://fagersta.se/nyheter/nyhetsarkiv/2026-03-05-ansok-om-bidrag-for-kostnadsfria-lovaktiviteter-2026
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet finansieras med medel från Tillväxtverket; föreningen behöver enligt den aktuella kommunsidan inte vara godkänd som bidragsberättigad
  senast_verifierad: '2026-08-19'
- id: fagersta-stod-till-studieforbund
  namn: Stöd till studieförbund
  status: aktiv
  kategori: [kultur, ovrig]
