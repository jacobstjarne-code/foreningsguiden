- id: fagersta-drift-underhall
  namn: Drift- och underhållsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar som äger, driver eller hyr en anläggning eller lokal för regelbunden föreningsverksamhet i Fagersta
  deadlines:
    typ: fasta
    datum: [08-25]
  krav:
  - Föreningen ska äga, driva eller hyra en lokal eller anläggning som används för regelbunden föreningsverksamhet i Fagersta
  - Stödet får avse drift, underhåll och mindre investeringar som behövs för säker och ändamålsenlig användning
  - Kommunalt hyrd lokal får inte få stöd för delar som redan finansieras genom kommunens driftansvar
  - Tidigare mottagare ska redovisa hur stödet och verksamheten använts; ansökan över 30 000 kr ska innehålla en treårsplan för drift- och underhållskostnader
  - Verksamhetens omfattning och målgrupp, anläggningens kommunala betydelse, tillgänglighet, planering och egenfinansiering vägs in
  belopp: Individuellt beslutat efter verksamhetens omfattning, målgrupp, anläggningens betydelse, föreningens ekonomi och egenfinansiering
