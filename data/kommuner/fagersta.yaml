- id: fagersta-aterhamtningsstod-svinpest-2025-2027
  namn: Återhämtningsstöd med anledning av afrikansk svinpest 2025–2027
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ideella Fagerstaföreningar som drabbades ekonomiskt av restriktionerna efter utbrottet av afrikansk svinpest
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Föreningen ska ha säte i Fagersta, bedriva ideell verksamhet och vara demokratiskt uppbyggd
  - Föreningen ska ha bedrivit verksamhet minst ett år före svinpestutbrottet och kunna styrka det med begärd dokumentation
  - Föreningen ska ha drabbats ekonomiskt av restriktionerna med anledning av afrikansk svinpest
  - Ansökan ska beskriva det förlorade värdet och konkreta återhämtningsåtgärder som ska locka tillbaka medlemmar eller andra intressenter
  - Stödet avser återhämtningsinsatser under 2025–2027 och kan sökas årligen
  belopp: Kommunen publicerar ingen generell beloppsnivå eller beräkningsregel
