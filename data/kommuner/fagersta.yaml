    datum: [03-25]
  krav:
  - Studieförbundet ska vara statsbidragsberättigat enligt Folkbildningsrådet och bedriva verksamhet i Fagersta kommun
  - Verksamheten ska främja demokrati, delaktighet, bildning, minskade utbildningsklyftor och ett bredare deltagande i kulturlivet
  - Verksamhetsberättelse, årsmötesprotokoll, ekonomisk redovisning och STUV-listor för föregående verksamhetsår ska lämnas årligen
