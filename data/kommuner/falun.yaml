  malgrupp: Bidragsberättigade idrotts- och kulturföreningar med barn- och ungdomsverksamhet, medlemmar 7-25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska ha minst tio medlemmar 7-25 år som betalt av årsmötet beslutad medlemsavgift
  - Minst tio bidragsgrundande sammankomster under året (minst 60 minuter, ledare utsedd av föreningen, minst tre aktiva deltagare)
  - Stöd ges för högst 30 deltagare per aktivitet, ledaren ska ha fyllt 13 år
  belopp: '32 kr per sammankomst. Tillägg: 1 kr/sammankomst vid jämställd styrelse (60/40), 1 kr/sammankomst vid etablerad
    verksamhet för båda könen (70/30), 5 kr/sammankomst + 1 000 kr/år för godkänd ''utmärkt förening'''
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.falun.se/gora--uppleva/foreningar-och-bidrag/bidrag-stod-och-stipendier/bidrag-till-kultur--idrotts--och-fritidsforeningar/bidragsregler-for-kultur--och-fritidsforvaltningen.html
  anteckning: 'Ansökan avser föregående periods aktiviteter: vårperiod (1 jan-30 jun) senast 25 augusti, höstperiod (1 jul-31
    dec) senast 25 februari. Medlemmar i Riksidrottsförbundet räcker det att registrera aktiviteten hos förbundet. Bekräftat
    oförändrat vid omkörning 2026-07-21 mot regelverkets §2.1.2, läst i fulltext.'
  krav_status: angivet
  krav_fullstandiga: false
  belopp_status: overifierat
