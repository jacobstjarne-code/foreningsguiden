  - Aktiviteten ska utveckla verksamheten för barn och unga eller personer som är 65 år eller äldre
  - Insatsen ska bidra till långsiktig utveckling och inte enbart vara ett avgränsat kortvarigt projekt
  - Aktiv fritid, barnrätt, jämställdhet, hållbarhet, inkludering, integration och samverkan prioriteras
