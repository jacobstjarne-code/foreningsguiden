  namn: Medlemsbidrag
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ideella föreningar med verksamhet för barn och unga och/eller personer över 65 år
  deadlines:
    typ: fasta
    datum: [10-31]
  krav: &grundkrav
  - Föreningen ska vara hemmahörande i Aneby kommun, gagna invånarna och ha varit ideellt verksam i minst sex månader
  - Föreningen ska vara öppen och demokratisk med stadgar, årsmöte och vald styrelse
  - Verksamheten ska rikta sig till barn och unga och/eller personer över 65 år och omfatta minst 10 aktiviteter under året
  - Föreningen ska ha registrerade medlemmar som varit aktiva under det senaste verksamhetsåret
  - Verksamheten ska följa kommunens strategiska mål, Barnkonventionen, hållbarhetsprinciperna och förbudet mot diskriminering
  - Föreningen ska ha en tydlig ANDTS-hållning och delta i kommunens två årliga föreningsträffar
  - Ansökan ska innehålla verksamhetsberättelse, årsmötesprotokoll, balans- och resultaträkning samt undertecknad revisionsberättelse
  belopp: Beräknas utifrån registrerade aktiva medlemmar i åldersgrupperna 6–25 år, 26–64 år och 65 år eller äldre; aktuella kronor per medlem publiceras inte
