  krav:
  - Arrangören ska vara en förening; kommunkoncernen beviljar normalt inte stödet när ett företag är arrangör
  - Sponsringen ska synliggöra kommunen eller dess bolag eller avse ett arrangemang som främjar samhällsnytta
  - Föreningen ska ansvara fullt ut för arrangemanget, respektera grundläggande fri- och rättigheter och allas lika värde samt beakta barn-, jämställdhets- och miljöperspektiv
  - Arrangemang med barn- eller ungdomsfokus ska vara alkohol-, drog- och nikotinfria
  - Ansökan ska beskriva syfte, innehåll, arrangemangstyp, önskad stödform och omfattning, förväntat deltagarantal och föreningens motprestation i form av synligt varumärke
