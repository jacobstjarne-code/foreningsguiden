- id: olofstrom-investeringsbidrag-over-prisbasbelopp
  namn: Investeringsbidrag över ett prisbasbelopp
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar med egna lokaler eller anläggningar och en investering över ett prisbasbelopp
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Föreningen ska uppfylla de allmänna villkoren och investeringen ska förbättra eller rusta upp en egen lokal eller anläggning som är angelägen för föreningen och kommunen
  - Föreningen ska söka tillgängliga statliga och andra bidrag; extern finansiering och frivilligt arbete avräknas från totalkostnaden före kommunens beräkning
  - Fritidsföreningar ska ha minst femton medlemsaktiviteter under året; full nivå prioriterar föreningar där minst hälften av de aktiva medlemmarna är 7–20 år
  - Arbetet får inte börja före beslut utan särskilt igångsättningstillstånd och ett tidigare investeringsprojekt ska vara slutredovisat innan nytt stöd kan lämnas
  - Ansökan ska innehålla kostnadskalkyl, offerter, eventuella ritningar, finansiering och tidsplan och kostnaderna ska redovisas inom bidragsåret
  - Lokalen eller anläggningen får inte säljas, överlåtas eller få ändrad användning inom tio år utan kommunens medgivande
  belopp: Högst 50 procent av godkänd kostnad och högst tre prisbasbelopp per förening och år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 31 mars; sen ansökan avslås
