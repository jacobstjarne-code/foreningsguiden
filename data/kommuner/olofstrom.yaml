bidrag:
- id: olofstrom-lokalt-aktivitetsstod
  ansokningsvag: "En separat fullständig ansökan ska lämnas till Olofströms kommun. RF-anslutna föreningar ska även bifoga RF-ansökan och underlag som visar utbetalt statligt LOK-stöd."
  namn: Lokalt aktivitetsstöd
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott, friluft, ungdom, annat]
  malgrupp: Föreningar anslutna till Riksidrottsförbundet eller en statsbidragsberättigad riksorganisation som ordnar aktiviteter för barn och unga
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Föreningen ska vara ideell och bidragsberättigad i Olofström samt tillhöra Riksidrottsförbundet eller en riksorganisation som får stöd av MUCF
  - Föreningen ska under året genomföra minst tio ledarledda verksamhetstillfällen för medlemmar 7–20 år
  - Ett verksamhetstillfälle ska vara beslutat av föreningen, pågå minst 60 minuter och ha minst tre deltagare
  - Närvaro ska registreras vid varje tillfälle; en deltagare får räknas högst en gång per dygn och förening och högst två ledare i bidragsberättigad ålder får räknas
  - Studiecirklar, aktivitet under skoltid, privat verksamhet och verksamhet som redan får annat kommunalt eller statligt stöd berättigar inte till bidrag
  - Kopia av ansökan om statligt LOK-stöd och underlag för utbetalt statsbidrag ska visas när sådant stöd lämnas
  belopp: 5 kr per deltagare och tillfälle för 7–12 år och 9,50 kr för 13–20 år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Komplett ansökan ska vara inne 25 februari respektive 25 augusti; sena ansökningar avslås
