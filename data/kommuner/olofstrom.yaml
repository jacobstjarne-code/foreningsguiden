  krav:
  - Sökanden ska vara en registrerad förening eller annan uttryckligen berättigad ideell organisation och bokningen ska följa kommunens taxor, prioriteringar och lokalregler
  - Föreningen ansvarar för arrangemanget, nödvändiga tillstånd, laglig ljudnivå, försäkringar, STIM, låsning, larmning, städning och egna arrangemangskostnader
