  senast_verifierad: '2026-08-19'
- id: olofstrom-hyresbidrag
  namn: Hyresbidrag för icke-kommunal lokal eller anläggning
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott, friluft, ungdom, annat]
  malgrupp: Ideella fritids- och idrottsföreningar som hyr en icke-kommunal lokal eller anläggning för sin verksamhet
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Föreningen ska uppfylla de allmänna villkoren och under året ha genomfört minst tio medlemsaktiviteter i lokalen eller anläggningen
  - Lokalen eller anläggningen ska finnas i Olofströms kommun och hyresavtalet ska godkännas av kultur- och fritidsnämnden i förväg
  - Stöd lämnas inte för kommunalt subventionerade lokaler, kommersiella arrangemang eller en anläggning som redan får driftsbidrag
  - Ansökan ska redovisa hyra, el, värme, vatten, andra kostnader och samtliga hyres- eller uthyrningsintäkter
  - Årsmötes- och konstituerande protokoll, verksamhets- och revisionsberättelse, resultat- och balansrapport, kostnadsverifikat och verksamhetsplan ska bifogas
  belopp: 70 procent av godkända kostnader; maxbeloppet 10 000 kr från basåret 2006 räknas upp årligen med konsumentprisindex
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 31 mars; sen eller ofullständig ansökan avslås
