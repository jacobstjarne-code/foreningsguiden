  - Lokalen eller anläggningen ska ligga i Olofströms kommun och stödet ska avse löpande drift, periodiskt underhåll eller inköp och reparation av inventarier och material
  - För egen lokal får arrende, el eller värme, vatten och avlopp, soptömning, sotning och fastighetsförsäkring redovisas
  - Föreningen ska redovisa stödberättigade anläggningsytor och kostnader samt bifoga årsmöteshandlingar, ekonomiska rapporter, kostnadsverifikat och verksamhetsplan
  - Felaktiga uppgifter kan medföra avstängning och återbetalningsskyldighet och kommunen har rätt till insyn och kontroll
  belopp: Schabloner per anläggning eller yta enligt bidragsreglerna samt 70 procent av redovisade kostnader för egen lokal; maxbeloppet 50 000 kr från basåret 2006 räknas upp årligen med konsumentprisindex
