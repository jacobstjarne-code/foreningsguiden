bidrag:
- id: valdemarsvik-grundstod
  namn: Grundstöd
  kategori:
  - ovrig
  malgrupp: Bidragsberättigade ideella föreningar
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Minst tio betalande medlemmar
  - Föreningen ska ha varit verksam minst sex månader
  belopp: 500 kronor per förening plus 25 kronor per stödberättigad medlem, minst 750 och högst 5 000 kronor
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
