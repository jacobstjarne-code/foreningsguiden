forutsattningar:
- id: valdemarsvik-registrering-och-arsuppdatering
  vad: Bidragsberättigande, registrering och årlig uppdatering
  beskrivning: Föreningen ska vara ideell och demokratisk med årsmötesvald styrelse och stadgar, ha organisationsnummer, ha varit verksam minst sex månader, ha säte och huvuddelen av verksamheten i kommunen samt normalt minst tio betalande medlemmar med minst 50 kronor i medlemsavgift. Föreningen ska registreras och godkännas i kommunens digitala föreningssystem och där årligen uppdatera och godkänna föreningsuppgifter, signerat årsmötesprotokoll, verksamhetsberättelse, resultat- och balansräkning, signerad revisionsberättelse, verksamhetsplan, budget och stadgar.
  system: Mina sidor
  ledtid: null
  ledtid_text: Uppgifterna och handlingarna ska uppdateras och godkännas varje år; kommunen publicerar inget gemensamt fast datum
  giltighet: Registreringen och fullständiga föreningshandlingar ska hållas aktuella genom årlig uppdatering i det digitala föreningssystemet
