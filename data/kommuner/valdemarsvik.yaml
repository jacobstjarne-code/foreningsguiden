- id: valdemarsvik-aktivitetsstod
  namn: Lokalt aktivitetsstöd
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med gruppverksamhet för barn och unga 4–25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Deltagare i åldern 4–25 år, eller deltagare med funktionsnedsättning utan övre åldersgräns
  - Minst fyra deltagare i åldern 4–25 år utöver ledare per gruppaktivitet, högst 30 deltagare per sammankomst
  - Ledaren ska under kalenderåret minst fylla 13 år och vara medlem i föreningen
  - Gruppaktiviteten ska vara planerad och ekonomiskt beslutad av föreningen samt pågå minst 45 minuter
  - Maximalt 15 deltagare per ledare
  - Deltagare ska vara medlem i föreningen, utom vid av föreningen begränsat genomförd aktivitet i rekryteringssyfte
  - Endast deltagare bosatta eller skrivna i Valdemarsviks kommun får räknas
  - Bidrag utgår endast en gång per dag och grupp oavsett antal deltagare eller aktivitetens längd
  - Bidrag utgår inte till entrébelagda tävlingar, kommersiella arrangemang, studiecirklar, aktiviteter under skoltid eller
    verksamhet som får bidrag på annat sätt eller bedrivs i privat regi
  - Bidrag utgår inte till aktivitet som anordnas av riksorganisation, distriktsorganisation eller lokalt samarbetsorgan
  - Underlag för närvaro ska registreras vid varje gruppaktivitet och sparas i minst tre år
  belopp: 20 kronor per sammankomst och 2 kronor per deltagare, högst 80 kronor per sammankomst
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: valdemarsvik-driftstod
  namn: Driftstöd
  kategori:
  - ovrig
  malgrupp: Föreningar som äger eller disponerar anläggning
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Anläggningen ska ägas eller disponeras av föreningen genom ett längre avtal (minst ettårigt) eller liknande
  - Anläggningen ska vara belägen i Valdemarsviks kommun
  - Anläggningen ska vara i sådant skick, tillgänglig och av sådan typ som krävs för att föreningens verksamhet ska kunna
    bedrivas
  - Föreningen ska ha haft tillgång till anläggningen större delen av tiden 12 månader innan stödet söks
  - Driftstöd som söks för samlingslokaler och avser högre belopp än 10 000 kronor beslutas av kommunstyrelsen
  - Ansökan ska tydligt beskriva den verksamhet som planeras bedrivas vid anläggningen samt den verksamhet som bedrivits under
    föregående år vid respektive anläggning
  belopp: 'Beloppet varierar per anläggningstyp enligt bilaga 1: Apellplan 2 500 kr, Bangolfanläggning 4 000 kr, Båtsportsanläggning
    6 000 kr, Discgolfbana 2 000 kr, Elljusspår (barmarksskötsel) 3 500 kr, Elljusspår (scooterspårning) 50 kr/timme, Fotbollsplan
    gräs fullstor (max 2 planer per förening) 40 000 kr, Fotbollsplan gräs fullstor (utöver 2 planer) 20 000 kr, Fotbollsplan
    gräs 7-manna (ca 60x40 m) 9 000 kr, Kartframställning 10 000 kr, Motorbana/motoranläggning 6 000 kr, Naturisbana/spolning
    av isbana 3 000 kr, Padelbana (max 2 planer per förening) 2 000 kr, Ridanläggning 15 000 kr, Ridanläggning endast utomhus
    4 000 kr, Samlingslokaler (ansökningar över 10 000 kr beslutas av kommunstyrelsen), Skidbacke 17 000 kr, Skjutbana 4 000
    kr, Tennisbana 4 000 kr'
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: valdemarsvik-investeringsstod
  namn: Investerings- och upprustningsstöd
  kategori:
  - ovrig
  malgrupp: Föreningar med egen eller långsiktigt arrenderad anläggning
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Föreningen ska äga eller driva anläggningen under ägarliknande förhållanden (avtal med nyttjanderätt eller arrende om
    minst ett år eller längre från ansökningsdatum)
  - Anläggningen ska vara belägen i Valdemarsviks kommun och av sådan typ som krävs för att föreningens verksamhet ska kunna
    bedrivas
  - Projektet får inte vara påbörjat före ansökan
  - En förening får inte beviljas stöd mer än en gång per år (vid flera sektioner gäller begränsningen per specialidrottsförbund)
  - Om föreningen kan få statligt stöd för investeringen är föreningen skyldig att utnyttja det stödet
  - Vid budgetöverskridande prioriteras föreningar med barn- och ungdomsverksamhet samt föreningar som inte sökt tidigare
    eller inte tilldelats bidrag för ett investeringsprojekt under de senaste åren
  - Kvitton och fakturor för genomförd investering ska vara inlämnade inom ett år från besked om stöd
  belopp: Max 50 000 kronor
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: valdemarsvik-lokalstod
  namn: Lokalstöd
  kategori:
  - ovrig
  malgrupp: Föreningar med egna eller hyrda lokaler
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Föreningen ska ha tillgång till egna eller hyrda lokaler
  - Stöd kan sökas för hyreskostnader samt kostnader för el och värme
  - Föreningen ska ha haft tillgång till lokalen större delen av tiden 12 månader innan stödet söks
  - Föreningar kan inte ansöka om stödet för lokaler som hyrs subventionerat av kommunen
  - 'Lokalkostnaderna ska styrkas: vid hyrd lokal genom intyg av hyresvärd, vid egen lokal av föreningens ordförande'
  belopp: 50 procent av kostnaderna, max 5 000 kronor
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: valdemarsvik-evenemangsstod
  namn: Evenemangsstöd
  kategori:
  - kultur
  malgrupp: Föreningar och intressegrupper som arrangerar evenemang
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Arrangera publikt evenemang i Valdemarsviks kommun
  - Evenemanget ska ha lokal anknytning och vara av allmänintresse för kommuninvånarna eller bedömas ha en positiv påverkan
    på turism- och besöksnäringen i kommunen
  - Ansökan ska innehålla en redogörelse för evenemangets program och tidsperiod samt en finansieringsplan
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: valdemarsvik-ungdomspotten-”snabbslanten”
  namn: Ungdomspotten ”snabbslanten”
  kategori:
  - ovrig
  malgrupp: Ungdomar 13–25 år som genomför projekt
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Kan inte sökas av förening, endast av enskilda eller grupper av enskilda personer
  - Personer kan söka stödet från och med det år de fyller 13 till och med det år de fyller 25
  - Arrangera en publik aktivitet (inte enbart för en begränsad grupp, t.ex. medlemmar) i Valdemarsviks kommun
  - Projektet ska vara alkohol-, narkotika-, dopnings- och tobaksfritt
  - Ansökan ska innehålla en kort beskrivning av den planerade aktiviteten inklusive tidpunkt, ungefärlig varaktighet och
    en ungefärlig kostnadsberäkning
  belopp: Maximalt 5 000 kronor per projekt
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: valdemarsvik-kulturforeningsstod
  namn: Kulturföreningsstöd
  kategori:
  - kultur
  malgrupp: Föreningar med kulturverksamhet i kommunen
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Stödet kan sökas av registrerade kulturföreningar eller motsvarande föreningar eller projekt som bedriver offentlig kulturverksamhet
    i kommunen
  - Föreningen ska leva upp till de generella villkoren för föreningsstöd
  - Ansökan ska åtföljas av verksamhetsberättelse för kommande år samt årsberättelse för föregående års verksamhet, inklusive
    resultat- och balansräkning, vinst- och förlusträkning samt revisionsberättelse
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: valdemarsvik-stod-till-studieforbund-och-barnrattsorganisationer
  namn: Stöd till studieförbund och barnrättsorganisationer
  kategori:
  - ovrig
  malgrupp: Studieförbund och barnrättsorganisationer
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Studieförbundet ska bedriva verksamhet i Valdemarsviks kommun
  - Studieförbundet ska vara demokratiskt uppbyggt och styras av stadgar samt av årsmötet utsedd styrelse, samt vara öppet
    för alla och verka i enlighet med RF 1 kap. 2 §
  - Barnrättsorganisationen ska bedriva verksamhet riktad mot barn och ungdomar i Valdemarsviks kommun
  - Studieförbund ska via Bildningsförbundet Östergötland årligen redovisa verksamheten samt studietimmar enligt fördelningsmodellen,
    och inkomma med verksamhetsberättelse, verksamhetsplan, uppgifter om styrelsens sammansättning samt revisionsberättelse
  - Barnrättsorganisationer ska tillsammans med ansökan lämna in verksamhetsberättelse, verksamhetsplan, budget, stadgar samt
    revisionsberättelse
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.valdemarsvik.se/wp-content/uploads/2023/02/riktlinjer-foreningsstod-klk-2025-79-c2a7-5.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
