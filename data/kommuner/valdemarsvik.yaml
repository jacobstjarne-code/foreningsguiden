  krav:
  - Minst tio betalande medlemmar
  - Föreningen ska ha varit verksam minst sex månader
  - Föreningen ska vara ideell och demokratiskt uppbyggd, ha en årsmötesvald styrelse, fastställda stadgar och organisationsnummer hos Skatteverket
