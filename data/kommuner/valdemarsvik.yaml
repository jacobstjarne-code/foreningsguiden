- id: valdemarsvik-bygdepeng
  namn: Kommunal-regional bygdepeng
  status: aktiv
  kategori: [social, ovrig]
  foreningstyp: [hembygd, social, annat]
  malgrupp: Föreningar som formellt företräder en lokal utvecklingsgrupp på landsbygden eller i en ort med färre än 1 000 invånare
  deadlines: {typ: okand, datum: []}
  krav:
  - Ansökan måste formellt lämnas av en förening, exempelvis byalag, intresse-, hembygds-, socken- eller samhällsförening, som företräder utvecklingsgruppen och samtliga berörda lokala aktörer.
  - Utvecklingsarbetet ska omfatta alla boende i området och gruppen ska bjuda in boende och föreningar att gemensamt besluta hur pengen används.
  - Endast en utvecklingsgrupp i varje geografiskt område kan få bygdepeng; området ska ligga på landsbygden eller vara en ort med färre än 1 000 invånare.
  - Pengarna får användas för omkostnader i lokalt utvecklingsarbete, exempelvis mötesplats, lokal, material, resa eller föreläsare, men inte löner.
  - Gruppen ska vara kontaktlänk till kommunen och lämna slutredovisning av användning och effekter senast 31 oktober.
  - Tidigare bygdepeng ska vara förbrukad eller intecknad för ett specifikt ändamål innan en ny ansökan lämnas.
  belopp: 6 000 kronor per bygdepeng, varav Region Östergötland bidrar med 4 000 kronor och kommunen med minst 2 000 kronor
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan lämnas i början av året; kommunen publicerar ingen exakt sista ansökningsdag, medan slutredovisningen ska lämnas senast 31 oktober
  kalla_url: https://www.valdemarsvik.se/naringsliv/utveckling/landsbygdsutveckling/bygdepeng/
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Sidan beskriver utvecklingsgruppen brett, men den aktuella officiella ansökningsblanketten kräver att en förening är formell sökande.
