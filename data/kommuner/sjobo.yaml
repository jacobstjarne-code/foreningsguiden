  krav:
  - Ledarledd sammankomst med minst 3 deltagare i åldrarna 3–25 år, +65 år eller personer med funktionsnedsättning, som pågår
    minst 60 minuter
  - Ledaren ska vara minst 13 år, närvarande under hela sammankomsten och utsedd av föreningen
  - Sammankomsten ska dokumenteras (typ, datum, deltagare, ledare) och sparas i minst sju år
  - Beviljas inte för verksamhet under skoldagen, kommersiella/entrébelagda aktiviteter eller verksamhet som redan får annat
    kommunalt stöd
  belopp: Lägst 4,50 kr/deltagartillfälle (3–6 år och 21–25 år), 6 kr/deltagartillfälle (7–20 år och +65 år), 12 kr/deltagartillfälle
    för personer med funktionsnedsättning
  sen_ansokan: 'Ansökan som kommer in för sent ger reducerat stöd: 1–7 dagar för sent -10 %, 8–14 dagar -25 %, 15–21 dagar
    -50 %; senare än 21 dagar är föreningen inte berättigad till stöd'
