  anteckning: 'SAKNADES I FÖREGÅENDE VERSION, uttryckligen exkluderad med motiveringen ''administreras av andra förvaltningar''
    — inte ett godkänt uteslutningsskäl enligt RESEARCH_SPEC_v2.md §2.4. Beslutas av kommunstyrelsen två gånger per år. KÄLLKONFLIKT
    (§2.5): vårfönstrets öppningsdatum anges som 31 januari på kommunens fonder-och-stiftelser-sida men som 13 februari på
    trygghetsfondens egen självservicesida — inget av källorna daterat, slutdatumet 1 april sammanfaller i båda så själva
    deadline-fältet påverkas inte. Höstfönstret (20 augusti–30 september) var samstämmigt i båda källorna. Formell riktlinje-PDF
    finns (riktlinger-240105.pdf) men gav 200-svar med binärt/olisbart innehåll vid extraktion — detaljer hämtade från självservicesidan
    istället. Räknas formellt bland kommunens ''fonder och stiftelser'' men skrivs som eget bidrag här eftersom det har egen
    dedikerad ansökningsväg och egen post på kultur- och fritidsnämndens huvudöversikt över bidrag, till skillnad från övriga
    stiftelser (se norrtalje-stiftelser-fonder).'
