- namn: Aktivitetsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med ledarledd verksamhet för barn och unga 5–20 år
  deadlines:
    typ: fasta
    datum:
    - 03-01
    - 09-01
  krav:
  - Aktiviteten ska vara beslutad och ekonomiskt planerad av föreningens styrelse, sektion, medlemsmöte eller motsvarande
  - Aktiviteten ska pågå minst 60 minuter, ha gemensam samling och instruktion samt gemensam avslutning
  - Gruppen ska bestå av minst fem deltagare i åldern 5–20 år; ledare i åldern 15–20 år får räknas som deltagare
  - Ledaren ska vara närvarande under aktiviteten, får inte ansvara för flera grupper samtidigt och ska föra närvarokort som ordförande och revisor eller kassör intygar
  - Stödet gäller lokal förening, inte riks- eller distriktsorganisation eller samarbetsorgan på lokal nivå
  belopp: 25 kr per godkänd sammankomst, högst 8 000 kr per halvår och 16 000 kr per år
  sen_ansokan: Senast 1 mars för perioden juli–december föregående år och 1 september för perioden januari–augusti innevarande år; för sen ansökan ger inte rätt till bidrag
