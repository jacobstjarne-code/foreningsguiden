  - ovrig
  malgrupp: Statsbidragsberättigade studieförbund med verksamhet i Ljusnarsbergs kommun
  deadlines:
    typ: fasta
    datum:
    - 05-30
  krav:
  - Studieförbundet ska vara berättigat till och få statsbidrag enligt Folkbildningsrådets villkor
  - Ansökan ska innehålla föregående års kommunala verksamhets- eller förvaltningsberättelse, ekonomisk redovisning eller årsredovisning, signerat årsmötesprotokoll eller förvaltningsberättelse och signerad revisionsberättelse
  - Verksamheten ska beskrivas enligt kommunens redovisningsmall och en verksamhetsplan ska bifogas
  - Under hösten ska studieförbundet delta i dialogmöte som kommunen kallar till
  - Kommunen får begära ytterligare handlingar, återkräva felaktigt stöd upp till tre år tillbaka och avslå eller kvitta stöd vid skuld till kommunen
