  malgrupp: Föreningar verksamma i kommunen
  deadlines:
    typ: fasta
    datum:
    - 06-30
  krav:
  - Föreningen ska ha verksamhet och hemvist i Ljusnarsbergs kommun
  - Minst fem medlemmar som betalat fastställd avgift för senast avslutade verksamhetsår
  - Föreningen ska dela samhällets demokratiska värderingar
  - Demokratiskt vald styrelse och antagna stadgar utformade enligt vedertagna demokratiska principer
  - Öppen för alla oavsett religion, ålder, kön, nationalitet, sexuella preferenser eller fysiska och psykiska förutsättningar
  - Bidrag utgår inte till elevföreningar, politiska föreningar, ekonomiska föreningar, supporterföreningar eller distrikts-/riksförbund
  - Föreningen ska på begäran kunna uppvisa räkenskapshandlingar, revisionshandlingar, medlemsmatrikel och närvarokort för
    granskning
  belopp: 40 kr per medlem 5–20 år, 10 kr per medlem över 20 år och 90 kr per familjekort; högst 7 000 kr per förening och år
  sen_ansokan: Ansökan avser föregående verksamhetsår och ska vara inne senast 30 juni; för sen ansökan ger inte rätt till bidrag
