  - kultur
  - ovrig
  malgrupp: Föreningar med investeringsbehov
  deadlines:
    typ: fasta
    datum:
    - 06-30
  krav:
  - Föreningen ska verka i Ljusnarsbergs kommun
  - Föreningen ska ha en fungerande styrelse
  - Föreningens verksamhet ska vara i enlighet med kommunens värdegrunder
  - 'Medfinansiering krävs: föreningen ska själv finansiera en del av projektet och/eller ha andra medfinansiärer'
  - Ansökan ska innehålla justerat styrelseprotokoll som visar att föreningen beslutat om ansökan samt dokumentation av firmatecknare
  - Ansökan ska innehålla finansieringskalkyl samt resultat- och balansräkning för senaste kalenderår
  belopp: Högst 50 000 kr per förening; kommunen kan justera maxbeloppet enskilda år vid få sökande
  sen_ansokan: Ansökan är öppen 1 mars–30 juni och utbetalning sker senast 31 augusti efter beslut och fullständiga handlingar
