  - Kostnaden för projektet/investeringen ska uppgå till minst 3 000 kronor
  - Kontakt ska tas med kommunen innan ansökan lämnas in
  - Ansökan ska innehålla en enkel beskrivning av projektet, tidplan och budget
  - En enkel rapport ska skrivas efter projektets slutförande
  belopp: Ersättning för faktiska kostnader, bidragets storlek bestäms efter bedömning av varje enskild ansökan. Kostnaden
