  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: För studiecirklar och annan folkbildningsverksamhet viktas deltagare och studietimmar lika; kulturarrangemang fördelas efter antal kulturprogram.
