  anteckning: Bidraget består av grundbidrag och driftbidrag. Telefon, internet, förbrukningsmaterial och personalkostnader
    räknas inte som driftkostnad.
- id: hjo-studieforbundsbidrag
  namn: Kommunalt bidrag till studieförbund
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, annat]
  malgrupp: Studieförbund med statsbidragsberättigad lokal folkbildningsverksamhet
  deadlines:
    typ: fasta
    datum: [02-28]
  krav:
  - Studieförbundets riksorganisation ska vara mottagare av statligt anslag
  - Studieförbundet ska redovisa den verksamhet som har bedrivits i Hjo kommun, inklusive deltagare, studietimmar och kulturprogram enligt fördelningsmodellen
  - Ansökan ska innehålla verksamhetsberättelse, verksamhetsplan för kommande år och ekonomisk redovisning
  - Uppgifterna ska ge kommunen underlag för att fördela anslaget mellan studiecirklar, annan folkbildningsverksamhet och kulturarrangemang
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Kommunens årliga anslag fördelas med 70 procent till studiecirklar, 10 procent till annan folkbildningsverksamhet och 20 procent till kulturarrangemang; totalsumman publiceras inte
  sen_ansokan: Kommunen publicerar ingen regel för sen ansökan
