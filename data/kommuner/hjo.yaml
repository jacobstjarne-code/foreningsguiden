    datum: []
  krav:
  - Föreningen ska vara registrerad och godkänd som bidragsberättigad förening i Hjo kommun och uppdatera sina registeruppgifter minst en gång per år
  - Föreningen ska vara demokratiskt uppbyggd, ha organisationsnummer och plus- eller bankgiro, bedriva verksamhet i Hjo och vara öppen för alla
  - Bokningen ska avse en kommunal lokal, anläggning eller grönyta och göras genom kommunens bokningssystem
  - Föreningen ska följa villkoren och den publicerade standardavgiften för den aktuella resursen; vissa resurser och säsongsavgifter är endast tillgängliga för bidragsberättigade föreningar
  belopp: Bidragsberättigade Hjo-föreningar får 50 procents subvention på den publicerade standardavgiften
