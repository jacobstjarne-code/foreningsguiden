bidrag:
- id: hjo-aktivitetsbidrag
  namn: Aktivitetsbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - social
  - pensionar
  - funktionsratt
  - ovrig
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar med redovisade aktiviteter
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara registrerad i Hjo kommuns föreningsregister, demokratiskt uppbyggd, ha organisationsnummer samt plusgiro-
    eller bankgirokonto och bedriva verksamhet i Hjo kommun
  - Föreningen ska uppdatera sina registeruppgifter minst årligen, vara öppen för alla och bedriva barn- och ungdomsverksamhet enligt barnkonventionen i drog-, rök- och dopningsfria miljöer
  - Minst 10 bidragsberättigade sammankomster per halvår för barn 5–20 år, funktionsnedsatta oavsett ålder eller pensionärer
    65 år och äldre
  - En sammankomst ska ha minst 3 deltagare utöver ledare, vara ledarledd, pågå minst 60 minuter och ledas av person som fyllt
    minst 13 år
  - Entrébelagd tävling, kommersiellt arrangemang, styrelsemöte eller studiecirkel räknas inte som bidragsgrundande sammankomst
  - Samma person får bara räknas i en aktivitet per dag och sektion och en grupp får inte delas i mindre grupper för att ge högre stöd
  - Föreningen ska varje år skicka in årsmötesprotokoll, ekonomisk redovisning och revisionsberättelse för senaste verksamhetsåret
  belopp: 8 kr/deltagare (5–12 år), 11 kr/deltagare (13–17 år), 6 kr/deltagare (18–20 år), 6 kr/deltagare (65 år och äldre),
    11 kr/deltagare (funktionsnedsatta oavsett ålder), per bidragsberättigad sammankomst
  sen_ansokan: Ej angivet i källan
  kalla_url: &norm https://hjo.se/globalassets/dokument/kultur-turism-och-fritid/fritid/bidrag/bidrag-2021/foreningsbidragriktlinjer.pdf
  belopp_avser: per_forening
  kommunens_pott: null
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Se Riktlinjer för föreningsbidrag (Kommunstyrelsen 2021-02-10 § 7) för fullständiga allmänna bestämmelser.
- id: hjo-utvecklings-och-investeringsbidrag
  namn: Utvecklings- och investeringsbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade föreningar med utvecklings- eller investeringsbehov
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara registrerad i Hjo kommuns föreningsregister, demokratiskt uppbyggd, ha organisationsnummer samt plusgiro-
    eller bankgirokonto och bedriva verksamhet i Hjo kommun
  - Föreningen ska uppdatera sina registeruppgifter minst årligen, vara öppen för alla och varje år lämna årsmötesprotokoll, ekonomisk redovisning och revisionsberättelse
  - Verksamhet för barn och unga ska följa barnkonventionen och bedrivas i drog-, rök- och dopningsfria miljöer
  - Kostnaden för projektet/investeringen ska uppgå till minst 3 000 kronor
  - Kontakt ska tas med kommunen innan ansökan lämnas in
  - Ansökan ska innehålla en enkel beskrivning av projektet, tidplan och budget
  - Utvecklingsinsatsen kan avse rekrytering, nya prioriterade målgrupper, ökad tillgänglighet, utbildning eller större lovaktiviteter; investeringen kan avse nödvändiga inventarier, nyanläggning, nybyggnation, renovering eller ombyggnad
  - Vid större ansökningar prioriteras föreningar som bidrar med egna medel och/eller annan extern finansiering
  - En enkel rapport ska skrivas efter projektets slutförande
  belopp: Ersättning för faktiska kostnader, bidragets storlek bestäms efter bedömning av varje enskild ansökan. Kostnaden
    för projektet/investeringen ska uppgå till minst 3 000 kronor
  sen_ansokan: Ej tillämpligt (löpande ansökan) — ansökan ska lämnas i god tid innan satsningen ska göras
  kalla_url: *norm
  belopp_avser: per_forening
  kommunens_pott: null
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Bidraget kan sökas när som helst under året men i god tid innan satsningen ska göras.
- id: hjo-anlaggningsbidrag
  namn: Anläggningsbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade föreningar med lokal eller anläggning
  deadlines:
    typ: fasta
    datum:
    - 04-01
  krav:
  - Föreningen ska vara registrerad i Hjo kommuns föreningsregister, demokratiskt uppbyggd, ha organisationsnummer samt plusgiro-
    eller bankgirokonto och bedriva verksamhet i Hjo kommun
  - Föreningen ska uppdatera sina registeruppgifter minst årligen, vara öppen för alla och varje år lämna årsmötesprotokoll, ekonomisk redovisning och revisionsberättelse
  - Verksamhet för barn och unga ska följa barnkonventionen och bedrivas i drog-, rök- och dopningsfria miljöer
  - Föreningen ska ha kostnader för lokaler eller anläggning och äga eller på lång tid hyra lokalen/anläggningen
  - Anläggningsbidrag kan inte sökas för kommunala lokaler
  - Föreningar med verksamhet för barn- och ungdomar, funktionsnedsatta eller pensionärer över 65 år prioriteras vid fördelningen
  - Endast hyra, arrende, sophämtning, vatten, värme, el, bränsle och försäkring räknas som driftkostnader; telefon, internet, förbrukningsmaterial och personalkostnader utesluts
  - Avgifter och andra intäkter från medlemmar och externa kunder kan räknas av från driftkostnaderna
  belopp: Grundbidrag max 50 % av prisbasbeloppet (aktivitetsytor, klubbrum och omklädningsrum) eller max 25 % av prisbasbeloppet
    (enbart klubbrum och/eller omklädningsrum). Driftbidrag max 80 % av godkända driftkostnader (hyra, arrende, sophämtning,
    vatten, värme, el, bränsle och försäkringar)
  sen_ansokan: Ej angivet i källan
