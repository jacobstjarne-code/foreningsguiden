  - Investeringen ska ha långsiktig betydelse för föreningens verksamhet och gagna kommuninvånare eller föreningsliv
  - Ansökan ska innehålla projektbeskrivning, kostnadskalkyl, finansieringsplan och uppgift om andra sökta eller beviljade stöd
  - Behörigt styrelsebeslut, stadgar och senaste års-, ekonomi- och revisionshandlingar ska bifogas
  - Föreningen ska beskriva ägande eller långsiktig nyttjanderätt, risker, tidplan och hur investeringen ska förvaltas
  - Beviljade medel ska användas enligt beslut och projektet ska återrapporteras med ekonomiskt utfall
  belopp: Individuellt beslutad kommunal medfinansiering; kommunen publicerar ingen generell procentsats eller beloppsgräns
