- id: vaggeryd-kommunal-medfinansiering-investeringar
  namn: Kommunal medfinansiering av investeringar
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Ideella föreningar som genomför en investering av långsiktig betydelse
  deadlines: {typ: okand, datum: []}
  krav:
