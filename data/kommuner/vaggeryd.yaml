  krav_fullstandiga: true
  anteckning: Kan sökas löpande efter årsmötet, senast 30 september.
- id: vaggeryd-lokalt-aktivitetsstod
  namn: Kommunalt lokalt aktivitetsstöd
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med bidragsberättigad barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-28
    - 08-28
  krav:
  - Föreningen ska vara en ideell förening enligt statsbidragsförordningarna för idrott (1999:1177), barn- och ungdomsorganisationer
    (2011:65) eller handikapporganisationer (2000:7)
  - Gruppaktivitet ska vara minst 60 minuter och ledas av minst en ledare som fyllt 13 år och är medlem i föreningen
  - En gruppaktivitet ska ha minst 3 och högst 30 aktiva deltagare i åldern 6–25 år (barn- och ungdomsverksamhet) respektive
    7–25 år (idrott); funktionsrättsföreningar oavsett ålder
  - Närvarokort ska föras vid varje sammankomst och intygas av ledaren
  - Ansökan ska göras av en av föreningsstyrelsen utsedd person
  belopp: 40 kronor per sammankomst
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.vaggeryd.se/uppleva-och-gora/foreningar-foreningsliv/foreningsbidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: vaggeryd-registreringsstod
  namn: Registreringsstöd
  kategori:
  - ovrig
  malgrupp: Nya föreningar som registreras som bidragsberättigade
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara registrerad hos Skatteverket som ideell förening
  - Föreningen ska vara ansluten till ett Riksförbund eller Riksorganisation godkänd för statliga bidrag
  - Föreningen ska ha giltigt plus-, bank- eller postgiro/bankkonto och organisationsnummer
  - Föreningen ska ha godkända stadgar, vald styrelse och vald revisor
  - Föreningen ska vara allmännyttig, ideell och öppen för alla att bli medlem
  - Föreningen ska ta ut en medlemsavgift på minst 100 kr för medlemmar från 18 år
  - Registrering prövas i varje enskilt fall av kultur- och fritidsnämnden
  belopp: 1 000 kr engångsstöd
  sen_ansokan: Ej angivet i källan
