- id: vaggeryd-vuxenvandring-2026
  namn: Vuxenvandring 2026
  status: aktiv
  kategori: [social, ovrig]
  foreningstyp: *alla
  malgrupp: Registrerade föreningar som genomför vuxenvandring i Vaggeryd och Skillingaryd
  deadlines: {typ: fasta, datum: [02-26]}
  krav:
  - Föreningen ska vara registrerad i Vaggeryds kommun och lämna intresseanmälan via Rbok
  - Varje vandring ska genomföras av fyra föreningsmedlemmar som är minst 23 år
  - Föreningen ska vandra både fredag och lördag enligt tilldelat schema och täcka både Vaggeryd och Skillingaryd
  - Vandrarna ska följa kommunens instruktioner, bära tillhandahållna västar och vara nyktra under uppdraget
  - Föreningen ska rapportera genomförandet efter båda kvällarna innan ersättningen betalas ut
  - Antalet platser är begränsat och kommunen fördelar tillgängliga helger mellan sökande föreningar
  belopp: 3 000 kr per genomförd kväll, normalt 6 000 kr för fredag och lördag; ytterligare 1 500 kr kan betalas för vandring under större helg
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Intresseanmälan för 2026 skulle lämnas senast 26 februari.
  kalla_url: https://www.vaggeryd.se/omsorg-och-hjalp/trygg-och-saker/brottsforebyggande-arbete/vuxenvandring.html
