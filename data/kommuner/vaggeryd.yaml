  krav_fullstandiga: true
  anteckning: null
- id: vaggeryd-utvecklingsbidrag
  namn: Utvecklingsbidrag
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  malgrupp: Bidragsberättigade föreningar som vill utveckla verksamhet, organisation eller aktiviteter
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidraget kan lämnas till föreningar som är allmännyttiga, utan vinstsyfte och registrerade som bidragsberättigad förening
    i Vaggeryds kommun
  - Åtgärden får som huvudregel inte ha påbörjats innan kultur- och fritidsnämnden fattat beslut i ärendet, om inte föreningen
    haft tidig dialog med förvaltningen
  - Åtgärden ska vara verksamhetsinriktad och av väsentlig betydelse för föreningens verksamhet
  - Ansökan görs via Rbok och bör innehålla syfte, samarbetspartners, ekonomisk redovisning/kostnadskalkyl, redovisning av
    andra sökta bidrag samt justerat styrelseprotokoll
