- id: vaggeryd-medlemsbidrag
  namn: Medlemsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Registrerade föreningar i Vaggeryds kommun
  deadlines:
    typ: fasta
    datum:
    - 09-30
  krav:
  - Föreningen ska vara medlem och ansluten till ett Riksförbund/riksorganisation och betala årlig medlemsavgift dit
  - Föreningen ska ta ut en medlemsavgift på minst 100 kr för medlemmar från 18 år; inget krav på avgift för medlemmar under
    18 år
  - Föreningens medlemsmatrikel ska stämma överens med ekonomisk redovisning och kunna visa medlemsregister med namn och ålder
    vid stickkontroll
  - Kyrkor och religiösa samfund är inte berättigade till medlemsbidrag
  belopp: 10 kronor per registrerad medlem
  sen_ansokan: Ej angivet i källan
