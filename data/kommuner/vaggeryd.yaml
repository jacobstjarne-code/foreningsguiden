- id: vaggeryd-lokalt-aktivitetsstod
  ansokningsvag: null
  namn: Kommunalt lokalt aktivitetsstöd
  status: aktiv
  kategori: [idrott, funktionsratt, ovrig]
  foreningstyp: [idrott, friluft, social, ungdom, annat]
  malgrupp: Föreningar med bidragsberättigad barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara en ideell förening enligt statsbidragsförordningarna för idrott (1999:1177), barn- och ungdomsorganisationer
    (2011:65) eller handikapporganisationer (2000:7)
  - Gruppaktivitet ska vara minst 60 minuter och ledas av minst en ledare som fyllt 13 år och är medlem i föreningen
  - En gruppaktivitet ska ha minst 3 och högst 30 aktiva deltagare i åldern 6–25 år (barn- och ungdomsverksamhet) respektive
    7–25 år (idrott); funktionsrättsföreningar oavsett ålder
  - Närvarokort ska föras vid varje sammankomst och intygas av ledaren
  - Ansökan ska göras av en av föreningsstyrelsen utsedd person
  - Studiecirklar, kommersiella arrangemang och aktiviteter utan gemensam samling, ledning och avslutning ger inte stöd
  belopp: 40 kronor per sammankomst
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: För sent inkommen ansökan reduceras enligt kommunens regel och kan därefter avslås.
  kalla_url: https://www.vaggeryd.se/uppleva-och-gora/foreningar-foreningsliv/foreningsbidrag/kommunalt-lokalt-aktivitetsstod.html
