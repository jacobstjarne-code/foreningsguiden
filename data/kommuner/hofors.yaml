  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Statsbidragsberättigade studieförbund med verksamhet i Hofors kommun
  deadlines:
    typ: fasta
    datum: ['04-30']
  krav:
  - Studieförbundet ska vara verksamt i Hofors och dess centrala organisation ska vara godkänd av Folkbildningsrådet för statsbidrag
  - Kommunbidraget får inte användas till kommersiell verksamhet eller uppdragsutbildning
  - Avdelningsstyrelsen ska ansöka och bifoga verksamhetsberättelse, resultat- och balansräkning samt revisionsberättelse; flerkkommunal verksamhet ska särredovisa Hofors
  - Kommunsammandrag, förenings- och organisationsuppgifter samt verksamhetsplan med budget ska bifogas
  - Verksamheten ska redovisas årligen både skriftligt och vid muntlig träff som kommunen kallar till; för högt utbetalt bidrag ska återbetalas
  - Underlaget ska redovisa studiecirklar, kulturprogram, annan gruppverksamhet, deltagare och deltagartimmar inklusive publicerade målgrupper
