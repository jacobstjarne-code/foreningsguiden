- id: hofors-drift-och-hyresbidrag
  namn: Drift- och hyresbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar som bedriver verksamhet i en egen eller hyrd anläggning eller lokal
  deadlines:
    typ: fasta
    datum: ['10-31']
  krav:
  - Föreningen ska uppfylla kommunens allmänna bidragsvillkor
  - Anläggningen eller lokalen ska ligga i Hofors kommun eller dess omedelbara närhet och utnyttjas av kommunens invånare
  - Verksamheten i lokalen ska stämma överens med reglerna för kommunalt bidrag och lokalen får inte redan vara kommunalt subventionerad genom exempelvis hyresnedsättning
  - För egen fastighet får räntor, försäkring, skatt, arrende, värme, vatten, sotning, sophämtning, vaktmästeri och icke standardhöjande underhåll räknas; för hyrd lokal får grundhyra, värme, el och städning räknas
  - Mindre investeringar upp till 25 000 kr enligt kommunens publicerade gräns kan prövas inom driftbidraget
  - Ansökan ska innehålla framtidsplaner, verksamhetsberättelse, resultat- och balansräkning, budget och eventuell underhållsplan
  belopp: Individuellt prövat utifrån publicerade bidragsgrundande drift- och hyreskostnader; kommunen publicerar ingen generell procentsats eller maxnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast 31 oktober året före bidragsåret
  kalla_url: https://www.hofors.se/kultur--fritid/foreningsbidrag/drift--och-hyresbidrag.html
