- id: hofors-grundbidrag
  namn: Grundbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar med bidragsberättigade medlemmar i åldern 7–25 år
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor och redovisa minst 15 betalande medlemmar från 7 års ålder
  - Ansökan ska ange antalet bidragsberättigade medlemmar i åldern 7–25 år
  - En bidragsberättigad medlem ska ha betalat årsavgift, finnas personligen i medlemsmatrikeln och ha rätt att delta i föreningsarbetet
  - Den bidragsberättigade medlemmen ska vara bosatt i Hofors kommun eller dess omedelbara närhet
  - Person som endast betalar entré-, kurs- eller anmälningsavgift räknas inte som medlem
  belopp: 30 kr per bidragsberättigad medlem i åldern 7–25 år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska ha kommit in senast två månader efter föreningens årsmöte
  kalla_url: https://www.hofors.se/kultur--fritid/foreningsbidrag/grundbidrag.html
