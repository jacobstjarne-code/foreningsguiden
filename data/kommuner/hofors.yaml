- id: hofors-samlingslokaler
  namn: Bidrag till allmänna samlingslokaler
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar som tillhandahåller allmänna samlingslokaler i Hofors kommun
  deadlines:
