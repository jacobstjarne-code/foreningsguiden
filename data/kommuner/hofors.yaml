- id: hofors-aktivitetsbidrag
  namn: Aktivitetsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Registrerade föreningar som ordnar lokal aktivitet för barn och unga
  deadlines:
    typ: fasta
    datum: ['06-30', '12-31']
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor om registrering, organisationsnummer, styrelse, stadgar, föreningskonto, öppenhet, lokal verksamhet, medlemsantal och drogfri verksamhet
  - En statsbidragsberättigad förening ska bifoga kopia av ansökan om statligt LOK-stöd och kontoutdrag som visar beviljat statsbidrag
  - En förening som inte är statsbidragsberättigad ska bifoga kopia av närvarokort för de redovisade aktivitetstillfällena
  - Aktiviteten ska avse barn och unga; bidrag lämnas inte till studiecirklar
  - Ansökan ska göras av föreningens firmatecknare och alla uppgifter ska vara fullständiga och korrekta
  belopp: Bidrag per deltagare och sammankomst; Föreningsutskottet kan prioritera vissa åldersgrupper inom tillgängligt anslag men publicerar ingen generell kronnivå
