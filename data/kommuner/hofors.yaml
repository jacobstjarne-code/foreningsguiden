    datum: ['04-30']
  krav:
  - Föreningen ska tillhandahålla en allmän samlingslokal för exempelvis kultur, utbildning och privata tillställningar i Hofors kommun
  - Bidragsgrundande kostnader är räntor, försäkringar, skatt, arrende, värme, vatten, sotning, sophämtning, vaktmästeri och icke standardhöjande underhåll eller reparation
  - Ansökan ska beskriva föreningens framtidsplaner
  - Senaste årsmötesprotokoll, verksamhetsberättelse med resultat- och balansräkning, budget och förteckning över föregående års driftskostnader ska bifogas
  - Planritning där fastighetens allmänna samlingslokaler är markerade ska bifogas
