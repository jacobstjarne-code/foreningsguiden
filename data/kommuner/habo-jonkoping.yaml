  - Föreningen ska vara ideell med säte och verksamhet i Habo kommun
  - Projektet ska ligga utanför ordinarie verksamhet, utveckla verksamheten eller vara ett startprojekt för en nystartad förening
  - Endast kostnader med direkt samband till projektet är stödgrundande; ordinarie kostnader och egna lönekostnader ingår inte
  - Projektet kan beviljas för ett till tre år men en ny ansökan och delredovisning krävs inför varje nytt år
