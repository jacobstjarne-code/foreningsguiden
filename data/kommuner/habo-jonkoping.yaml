- id: habo-jonkoping-driftsbidrag
  namn: Driftsbidrag
  kategori:
  - ovrig
  malgrupp: Föreningar med driftskostnader
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Föreningen ska vara en ideell förening med säte och verksamhet i Habo kommun
  - Verksamheten ska bedrivas i en drogfri miljö och i enlighet med FN:s barnkonvention
  - Föreningen ska äga, hyra eller arrendera lokaler och/eller anläggningar
  - Kan inte sökas för egna lönekostnader eller hyra/arrende hos Habo kommun
  - Justerat årsmötesprotokoll, verksamhetsberättelse, ekonomisk redovisning och bokslut, signerad revisionsberättelse samt
    stadgar för närmast föregående år ska vara uppladdade i Rbok
  belopp: Bidrag utgår med som mest 75 % av nettokostnaden (driftsutgifter minus uthyrningsinkomster). Ansökan avser föregående
    års kostnader och tillgängliga medel fördelas bland sökande. Kan sökas för t.ex. elkostnader, hyra/arrende, städartiklar,
    avfallshantering och försäkringar.
  sen_ansokan: Vid ansökan inom 30 dagar efter ansökningstidens utgång kan bidraget minskas med upp till 50 %. Ansökan senare
    än 30 dagar efter ansökningstidens utgång behandlas inte.
