- id: habo-jonkoping-aktivitetsbidrag
  namn: Aktivitetsbidrag
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med bidragsberättigad aktivitet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara en ideell förening med säte och verksamhet i Habo kommun
  - Verksamheten ska bedrivas i en drogfri miljö och i enlighet med FN:s barnkonvention
  - Föreningen ska ha minst 10 medlemmar i åldern 5-25 år
  - Föreningen ska ha genomfört minst 10 bidragsberättigade aktiviteter under föregående halvår
  - Justerat årsmötesprotokoll, verksamhetsberättelse, ekonomisk redovisning och bokslut, signerad revisionsberättelse samt
    stadgar för närmast föregående år ska vara uppladdade i Rbok
  - Policy för föreningens förebyggande arbete mot droger krävs för verksamhet riktad till barn och unga
  belopp: 35 kronor per godkänd aktivitet. Godkänd aktivitet är en ledarledd gruppaktivitet med minst 5 deltagare i åldern
    5-25 år som pågår i minst 45 minuter. Utgår inte för entrébelagda tävlingar eller kommersiella arrangemang.
  sen_ansokan: Vid ansökan inom 30 dagar efter ansökningstidens utgång kan bidraget minskas med upp till 50 %. Ansökan senare
    än 30 dagar efter ansökningstidens utgång behandlas inte.
