  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Föreningen ska ha bedrivit verksamhet i minst ett år inom socialnämndens verksamhetsområde
  - Verksamheten ska direkt eller indirekt rikta sig till kommuninvånare i Habo
