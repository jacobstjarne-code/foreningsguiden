- id: habo-jonkoping-projektbidrag
  namn: Projektbidrag
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Föreningar som genomför projekt
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Föreningen ska vara en ideell förening med säte och verksamhet i Habo kommun
  - Verksamheten ska bedrivas i en drogfri miljö och i enlighet med FN:s barnkonvention
  - Bidraget avser projekt utöver ordinarie verksamhet, utvecklingsprojekt eller startbidrag för nystartad förening
  - Kan sökas för kostnader med direkt samband till projektet, inte för föreningens ordinarie kostnader eller egna lönekostnader
  - Ett projekt kan beviljas för 1-3 år; för projekt längre än ett år krävs delredovisning och ny ansökan inför varje nytt
    år
  - Justerat årsmötesprotokoll, verksamhetsberättelse, ekonomisk redovisning och bokslut, signerad revisionsberättelse samt
    stadgar för närmast föregående år ska vara uppladdade i Rbok
  belopp: En förening kan ansöka om bidrag för upp till 50 % av kostnaderna i projektet, som mest 50 000 kronor per år. 75
    % av beviljat bidrag betalas ut i juni, resterande 25 % efter redovisning.
  sen_ansokan: Vid ansökan inom 30 dagar efter ansökningstidens utgång kan bidraget minskas med upp till 50 %. Ansökan senare
    än 30 dagar efter ansökningstidens utgång behandlas inte.
