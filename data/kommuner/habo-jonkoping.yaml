  krav:
  - Föreningen ska vara en ideell förening med säte och verksamhet i Habo kommun
  - Verksamheten ska bedrivas i en drogfri miljö och i enlighet med FN:s barnkonvention
  - Bidrag beviljas enbart för planerade investeringar, inte för redan gjorda investeringar
  - Kan inte sökas för egna lönekostnader eller för arbetsinsats som inte kräver specifik behörighet
  - Hur bidraget använts ska redovisas till kultur- och fritidsnämnden efter slutförd investering
  - Justerat årsmötesprotokoll, verksamhetsberättelse, ekonomisk redovisning och bokslut, signerad revisionsberättelse samt
