  malgrupp: Föreningar som arrangerar evenemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Kan sökas av personer eller föreningar i Habo kommun som vill anordna ett publikt evenemang i kommunen
  - Vid kulturevenemang eller unga arrangörer (13-25 år) krävs ingen förening
  - Evenemanget ska vara öppet för allmänheten och annonseras allmänt, inte enbart för föreningens medlemmar
  - Kan inte sökas för egna lönekostnader
  - Det ekonomiska resultatet ska redovisas till kultur- och fritidsförvaltningen efter avslutat evenemang
  belopp: null
