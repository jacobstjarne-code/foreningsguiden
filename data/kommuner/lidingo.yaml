forutsattningar:
- id: lidingo-godkand-forening
  vad: Bli godkänd förening / registrera sig i Föreningsregistret (FRI)
  beskrivning: Föreningen ska vara ideell, ange Lidingö som verksamhetsområde i sina stadgar, ha organisationsnummer samt
    plus- eller bankgiro, ha haft dokumenterad verksamhet det senaste året, säkerställa att medlemmar erlägger medlemsavgift
    (redovisad som egen post eller fotnot i balans- och resultaträkning, skild från tränings-/aktivitetsavgifter) samt årligen
    delge staden sina årsmöteshandlingar. Föreningen ska vara uppbyggd och fungera enligt demokratiska principer och värderingar.
    Registrering och uppladdning av obligatoriska handlingar (signerat årsmötesprotokoll, signerad revisionsberättelse, verksamhetsberättelse
    och ekonomiskt bokslut, verksamhetsplan och budget) sker i Föreningsregistret (FRI).
