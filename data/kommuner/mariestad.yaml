  krav:
  - Föreningen ska ha sitt säte i Mariestad och vara registrerad i Mariestads kommuns föreningsregister
  - Minst 60 procent av föreningens medlemmar ska vara folkbokförda i Mariestads kommun
  - Föreningen ska ha minst tio (10) registrerade och aktiva medlemmar, varav en ordförande, en sekreterare och en kassör
  - Bidraget avser barn- och ungdomsaktiviteter för åldersgruppen 6–25 år
  - En aktivitet ska vara minst 60 minuter och ledas av minst en ledare, som inte får ansvara för flera grupper samtidigt
  - Minst tre (3) medlemmar i bidragsberättigad ålder ska delta vid varje aktivitetstillfälle, och närvarorapport ska föras
    och rapporteras via Rbok
  - Föreningen ska ha redovisat minst 15 sammankomster under föregående kalenderår
  - Ansökan ska göras senast 30 september via Rbok, med stadgar, årsmötesprotokoll, verksamhetsplan, balans- och resultaträkning,
    verksamhetsberättelse och revisionsberättelse från senaste årsmötet
  belopp: Bidraget beräknas i grundbelopp efter antalet aktiva medlemmar och bidragsberättigade sammankomster enligt regelverkets vägningstabell
