  - Anläggningen ska främja gemenskap, kunskap och kultur samt fungera som en naturlig samlingsplats
  - Föreningen får inte vara berättigad till andra fasta kommunala bidrag, förutom hyresbidrag
  - Bidraget söks digitalt via Rbok, och i samband med ny ansökan ska föregående års bidrag redovisas
