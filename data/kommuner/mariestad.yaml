- namn: Hyresbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med lokalhyra
  deadlines:
    typ: fasta
    datum:
    - 09-30
  krav:
  - Föreningen ska vara registrerad i Mariestads kommuns föreningsregister och äga eller hyra den aktuella lokalen
  - Lokalen ska vara belägen i Mariestads kommun, disponeras helt av föreningen och brukas regelbundet
  - Bidrag utgår inte för lokaler som ingår i kommunens anläggningsbestånd och kan inte ges för amorteringar
  - Föreningen ska bifoga kontrakt och förväntade hyreskostnader för lokalen i ansökan
  - Bidraget betalas inte ut per automatik utan ska sökas och prövas på nytt varje år; ansökan ska göras senast 30 september
    via Rbok
  - Redovisning av hyreskostnader ska lämnas efter föreningens årsmöte, med ekonomisk redovisning och beskrivning av verksamheten
    i lokalen
  belopp: Bidrag utgår med högst 12,5 grundbelopp per förening och år. Om ansökningarna sammanlagt överstiger bidragets maxbelopp
    reduceras och fördelas bidraget jämnt över de sökande föreningarna.
