- namn: Bidrag för tillfälliga arrangemang
  kategori:
  - kultur
  - ovrig
  malgrupp: Föreningar med tidsbegränsade aktiviteter
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidraget gäller offentliga arrangemang som når en bred allmänhet och som inte omfattas av andra föreningsbidragsregler
  - Arrangemanget ska äga rum i Mariestads kommun, vara öppet och informerat till allmänheten samt får inte vara entrébelagt
  - Bidrag lämnas inte till arrangemang som arrangeras av eller för företag, ingår i ordinarie verksamhet (t.ex. cuper och
    turneringar), är fester, har vinstdrivande syfte, eller där föreningen har skuld till Mariestads kommun
  - Ansökan kan lämnas löpande under året via Rbok och ska innehålla typ av arrangemang, syfte, målgrupp, datum/tid/plats
    samt ekonomisk kalkyl med kostnader och eventuella intäkter
  - Ansökan är möjlig så länge avsatta budgetmedel inte är förbrukade
  - Redovisning ska lämnas senast två (2) månader efter arrangemangets avslut, med ekonomisk redovisning, beskrivning av resultat
    och uppskattat antal deltagare
  belopp: Högsta bidragsbelopp är max 10 000 kronor per år och kan fördelas på flera arrangemang och tillfällen.
