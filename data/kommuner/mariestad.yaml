  krav:
  - Bidraget riktar sig till nybildade föreningar som bedriver regelbunden verksamhet
  - Föreningen ska ha en styrelse bestående av minst tre (3) personer, valda på ett föreningsmöte av medlemmarna
  - Föreningen ska ha stadgar antagna på ett konstituerande föreningsmöte
  - Ansökan kan lämnas löpande under året via Rbok och kräver ett obligatoriskt möte med kommunens fritidskontor
  - Ansökan ska innehålla föreningens stadgar, kopia på beslutet om organisationsnummer från Skatteverket samt protokoll från
    föreningens bildandemöte
  - Redovisning ska lämnas i form av handlingar från föreningens första ordinarie föreningsmöte
  belopp: Startbidraget utgår med fem (5) grundbelopp. Bidragets grundbelopp beslutas av kommunstyrelsen.
