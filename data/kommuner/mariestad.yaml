  - Föreningen ska äga eller hyra anläggningen och ansvara för den, samt använda den regelbundet
  - Bidragets storlek grundas på antalet genomförda aktiviteter för barn och ungdom (6–25 år) under föregående verksamhetsår
  - Bidrag kan sökas för nybyggnation, ombyggnation, renovering, upprustning, energi- och miljöinvesteringar, säkerhetsförbättringar,
    inventarier, driftkostnader och underhåll
  - Ansökan ska göras senast 31 mars via Rbok, med stadgar, årsmötesprotokoll, verksamhetsplan, balans- och resultaträkning,
    verksamhetsberättelse och revisionsberättelse från senaste årsmötet
  - Redovisning ska lämnas senast 60 dagar efter insatsens avslut, med ekonomisk redovisning inklusive fakturor och kvitton;
    ej utnyttjade medel återbetalas
