- id: markaryd-aktivitetsbidrag
  namn: Aktivitetsstöd
  kategori: [idrott, kultur, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ideella föreningar med ledarledd verksamhet för barn och unga 4–25 år eller handikappidrott utan övre åldersgräns
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - &grund Föreningen ska vara ideell, hemmahörande och/eller verksam i Markaryd, öppen för alla, demokratiskt uppbyggd och aktiv med verksamhet till nytta för kommunens invånare
  - &formalia Föreningen ska ha vald styrelse, antagna stadgar, medlemsmatrikel med årlig medlemsavgift och normalt vara ansluten till en riksorganisation; kommunen kan godkänna undantag
  - &arshandlingar Årsmötesprotokoll, verksamhetsberättelse, resultat- och balansräkning, revisionsberättelse samt aktuella medlems- och registeruppgifter ska lämnas årligen
  - &ansokan Ansökan ska vara komplett, sökas digitalt av huvudstyrelsen och undertecknas av ordförande eller utsedd firmatecknare; kommunen har rätt till ekonomisk och verksamhetsmässig insyn
  - &trygghet Föreningar med barn- och ungdomsverksamhet ska årligen ha antagen ANDTS- och likabehandlingspolicy samt kontrollera belastningsregister för berörda ledare från 15 år
  - Aktiviteten ska vara planerad och ledarledd, pågå minst 45 minuter och ha minst tre deltagare 4–25 år utöver ledaren; maximalt 30 deltagare får räknas
  - Ledaren ska vara minst 13 år, närvarande och inte leda flera samtidiga grupper; medlemmen får räknas högst en gång per dag och förening
  - Närvarokort ska föras; entrétävlingar, kommersiella arrangemang, studiecirklar och skolaktiviteter under skoltid är inte stödgrundande
  belopp: 5 kr per deltagare och sammankomst samt 10 kr per sammankomst; beloppen minskas proportionellt om årspotten överskrids
  belopp_avser: per_forening
  kommunens_pott: 360 000 kr per verksamhetsår
  sen_ansokan: 25 augusti gäller verksamhet 1 januari–30 juni och 25 februari gäller 1 juli–31 december; RF-anslutna söker 6–25-årsverksamhet via statligt LOK-underlag.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  status: aktiv
  senast_verifierad: '2026-08-19'
  anteckning: null
