- namn: Driftsbidrag
  kategori:
  - social
  - ovrig
  malgrupp: Registrerade organisationer och föreningar verksamma i Perstorps kommun
  deadlines:
    typ: okand
    datum: []
  krav:
  - Sökande kan enbart få driftsbidrag om denne ej redan erhållit bidrag från kommunens övriga bidragsdelar, exempelvis kultur-
    och föreningsbidrag
  - Sökande organisation/förening ska vara verksam inom Perstorps kommun och vara registrerad hos kommunen
  - Verksamheten ska vara öppen för alla och inte diskriminera på grund av etnisk tillhörighet, kön, könsöverskridande identitet
    eller uttryck, funktionshinder, religion eller annan trosuppfattning samt sexuell läggning
  - Verksamheten eller dess företrädare får inte främja rasism, våld, alkohol- och/eller drogmissbruk, eller bestå av partipolitiskt
    eller religiöst arbete
  - Bidraget kan endast utgöra ett tillskott till verksamheten, inte huvudfinansiering
  - Till ansökan ska biläggas föreningens stadgar, årsmöteshandlingar (protokoll, verksamhetsberättelse, ekonomisk berättelse
    med RR och BR, revisionsberättelse), beskrivning av verksamheten och budget, organisationsnummer samt uppgifter om plusgiro/bankgiro
  - Bidrag beviljas inte till föreningar med skatteskuld som drivs in av Kronofogden
  - Ansökningsperiod är 1 april–31 maj
