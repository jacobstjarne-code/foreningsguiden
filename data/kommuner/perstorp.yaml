- namn: Kulturföreningsbidrag
  kategori:
  - kultur
  malgrupp: Kulturföreningar i kommunen
  deadlines:
    typ: okand
    datum: []
  krav:
  - Kan sökas av styrelse för kulturförening eller annan sammanslutning inom kulturområdet, med säte och verksamhet inom Perstorps
    kommun
  - Ges i första hand till väl etablerade ideella föreningar med en dokumenterad verksamhet, riktad åt en bred allmänhet
  - Sökande organisation ska ha antagit stadgar samt valt styrelse och revisorer
  - Kultur- och Fritidsförvaltningen ska ha full insyn i den sökande organisationens verksamhet
  - Med ansökan ska bifogas verksamhetsberättelse, ekonomisk rapport och revisionsberättelse; nya föreningar ska även bifoga
    stadgar
  - Föreningsbidrag söks senast 15 augusti och avser befintligt budgetår
