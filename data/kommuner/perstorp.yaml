- namn: Föreningsbidrag för social verksamhet
  kategori:
  - social
  - pensionar
  - funktionsratt
  malgrupp: Föreningar med social verksamhet
  deadlines:
    typ: okand
    datum: []
  krav:
  - Verksamheten ska vända sig till någon av grupperna barn och ungdomar, äldre, funktionshindrade, missbrukare, anhöriga/närstående
    eller brottsoffer
  - Föreningen ska vara verksam i Perstorps kommun och vända sig till alla inom målgruppen oavsett eventuellt medlemskap
  - Föreningen ska ha antagna stadgar och en vald styrelse
  - Föreningen ska visa på kontinuitet och ha bedrivit verksamhet i minst ett år
  - Föreningen ska årligen på avsedd ansökan redovisa målgrupp, arbetssätt, fortsatt arbete, antal nådda kommunmedborgare,
    resultat av aktiviteterna samt ekonomisk ställning
  - Ansökan jämte verksamhetsberättelse och revisionsberättelse för senast avslutat verksamhetsår ska lämnas till Kultur-
    och Fritidsförvaltningen senast 15/8 varje år
  - Föreningsbidrag utgår aldrig för aktiviteter som redan fått andra kommunala bidrag
  - Sökande förening ska lämna den insyn i verksamheten som behövs för kontroll av att bidraget används på angivet sätt
