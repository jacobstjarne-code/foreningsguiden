  krav:
  - Ska bedriva ungdomsfostrande verksamhet riktad till ungdomar tillhörande Perstorps kommun
  - Ska ha säte och stämma i Perstorps kommun
  - Ska ha minst 10 bidragsberättigade medlemmar
  - Ska ha minst 100 sammankomstdeltagare under året före ansökningsåret, eller om nystartad minst 25 sammankomstdeltagare
    per kvartal
  - Ska vara öppen för envar samt ha utsett styrelse och revisorer och antagit stadgar
  - Ska föra medlemsmatrikel med namn, adress, födelsedatum och datum för medlemsavgiftens erläggande
  - Ska årligen lämna uppgift om antal bidragsberättigade medlemmar, verksamhetsberättelse, ekonomisk redovisning och revisionsberättelse
  - Ansökan ska vara kommunen tillhanda senast 25/2 respektive 25/8
