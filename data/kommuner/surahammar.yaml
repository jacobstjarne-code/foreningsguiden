- namn: Projektbidrag för kulturföreningar
  kategori:
  - kultur
  malgrupp: Kulturföreningar med tidsbegränsat projekt
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen ska vara en ideell förening med minst 10 aktiva medlemmar och tydlig kulturverksamhet, ha en demokratiskt uppbyggd
    organisation och stadgar samt bedriva verksamhet inom kommunen öppen för allmänheten
  - Föreningen ska ha ekonomi i balans, aktiv styrelse och regelbundna medlemsmöten samt kunna redovisa tidigare beviljade
    bidrag korrekt
  - Projektet ska ha en tydlig kulturkoppling, bidra till nytänkande eller utveckling inom kulturområdet samt vara tidsbegränsat
    med tydlig början och slut
  - Föreningen ska presentera en projektplan med syfte, mål och genomförande samt en detaljerad budget med redovisning av
    andra eventuella finansieringskällor
  - Projektet ska genomföras inom kommunens geografiska område och vara öppet för allmänheten; bidraget kan inte användas
    för löpande driftskostnader eller ordinarie verksamhet
  - Föreningen ska redovisa projektets resultat och användning av bidraget efter genomförandet
  - Ansökan skickas på avsedd blankett via e-post till kommunen@surahammar.se senast 15 april
