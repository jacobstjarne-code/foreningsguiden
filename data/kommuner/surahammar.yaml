- namn: Verksamhetsbidrag för kulturföreningar
  kategori:
  - kultur
  malgrupp: Kulturföreningar med långsiktig verksamhet
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen ska vara en ideell förening med minst 10 aktiva medlemmar och tydlig kulturverksamhet, ha en demokratiskt uppbyggd
    organisation och stadgar samt bedriva verksamhet inom kommunen öppen för allmänheten
  - Föreningen ska ha ekonomi i balans, aktiv styrelse och regelbundna medlemsmöten samt kunna redovisa tidigare beviljade
    bidrag korrekt
  - Föreningen ska ha bedrivit sin verksamhet i minst ett år och verksamheten ska vara kontinuerlig med minst 5 aktiviteter
    per år
  - Föreningen ska ha en tydlig verksamhetsplan eller programblad och budget samt kunna redovisa hur tidigare verksamhetsbidrag
    har använts
  - Ansökan skickas på avsedd blankett via e-post till kommunen@surahammar.se senast 15 april
