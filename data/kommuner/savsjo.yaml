- id: savsjo-lovsbidrag
  namn: Lovsbidrag
  kategori:
  - ovrig
  malgrupp: Aktiviteter för barn och unga 6–15 år
  deadlines:
    typ: okand
    datum: []
  krav:
  - Aktiviteten ska vara kostnadsfri eller endast kosta en symbolisk summa
  - Ska rikta sig till barn och ungdomar 6–15 år
  - Ska genomföras utöver ordinarie verksamhet eller förstärka/utöka befintliga aktiviteter
  - Ingen behovsprövning får göras av deltagande barn
  - Redovisning av genomförda aktiviteter ska lämnas efter avslutat lov
  belopp: null
