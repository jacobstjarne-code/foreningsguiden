  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Sammankomsten ska ha minst fem bidragsberättigade deltagare, pågå minst 45 minuter och vara ledarledd
  - Högst 20 deltagare får redovisas per ledare; ledare 13–25 år får räknas vid högst fem aktiviteter per vecka
  - Närvaro ska registreras i IdrottOnline eller föreningsportalen och samma deltagare får bara redovisas en gång per dag och verksamhet
  - Deltagare 7–9 år får redovisas högst tre gånger per idrott och vecka och deltagare 10–25 år högst fem gånger
  - Skolverksamhet, studiecirkel eller samma aktivitet som får annat aktivitetsbidrag är inte stödgrundande
