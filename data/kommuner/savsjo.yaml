bidrag:
- id: savsjo-arrangemangsbidrag
  namn: Arrangemangsbidrag
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Organisationer som genomför publika arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Ansökan lämnas via föreningsportalen senast sex veckor innan arrangemanget genomförs
  - Arrangemanget ska vända sig till fler än föreningens egna medlemmar och ligga utanför den normala verksamheten
  - Organisationen ansvarar själv för eventuella tillstånd från polis och andra myndigheter
  - Arrangemanget ska marknadsföras och det ska framgå att det fått stöd av Sävsjö kommun
  - Redovisning ska lämnas senast två månader efter avslutat arrangemang
  belopp: Upp till 15 000 kronor för vinstgivande arrangemang med stort mervärde
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.savsjo.se/kultur-och-fritid/foreningar-och-bidrag/foreningsbidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Ansökan ska lämnas senast sex veckor före arrangemanget.
- id: savsjo-hyresbidrag
  namn: Hyresbidrag
  kategori:
  - ovrig
  malgrupp: Föreningar med barn- och ungdomsverksamhet som hyr lokal eller anläggning
  deadlines:
    typ: fasta
    datum:
    - 03-01
  krav:
  - Bidrag utgår ej för hyra av kommunalt ägda lokaler, idrotts- och/eller fritidsanläggningar
  - Bidrag utgår ej för hyreskostnader vid entrébelagda tävlingar, matcher eller andra entrébelagda arrangemang
  - Kontraktshandlingar bifogas ansökan vid första ansökningstillfället och vid förändrade förutsättningar
  belopp: 100 kronor per bidragsberättigad medlem, max 80 procent av kostnaden och 15 000 kronor
  sen_ansokan: För sent inkommen ansökan minskar beviljat bidrag med 25 procent. Ansökan inkommen 1 månad efter sista datum
    minskar beviljat bidrag med 50 procent. Ansökan inkommen 3 månader efter sista datum hanteras ej.
  kalla_url: https://www.savsjo.se/kultur-och-fritid/foreningar-och-bidrag/foreningsbidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: null
- id: savsjo-anlaggningsbidrag
  namn: Anläggningsbidrag
  kategori:
  - ovrig
  malgrupp: Föreningar som äger och driver egen anläggning
  deadlines:
    typ: fasta
    datum:
    - 03-01
  krav:
  - Anläggningen ska vara tillgänglig för allmänheten, skolor, andra ideella föreningar och organisationer mot skäliga villkor
  - Bidraget baseras på föreningens driftskostnader (uppvärmning, vatten/el, sophämtning, försäkring) per 31 december föregående
    år
  - Bidraget kan reduceras om anläggningen inte används regelbundet eller om redovisade kostnader understiger schablonen
  belopp: Baseras på föreningens driftskostnader (uppvärmning, vatten/el, sophämtning, försäkring av fastigheten) enligt schablon
    för föregående kalenderår
  sen_ansokan: För sent inkommen ansökan minskar beviljat bidrag med 25 procent. Ansökan inkommen 1 månad efter sista datum
    minskar beviljat bidrag med 50 procent. Ansökan inkommen 3 månader efter sista datum hanteras ej.
  kalla_url: https://www.savsjo.se/kultur-och-fritid/foreningar-och-bidrag/foreningsbidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: null
