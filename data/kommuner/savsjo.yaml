  namn: Investeringsbidrag
  kategori:
  - ovrig
  malgrupp: Föreningar som investerar i verksamhet eller anläggning
  deadlines:
    typ: fasta
    datum:
    - 03-01
    - 09-01
  krav:
  - Arbetet eller inköpen får inte påbörjas innan beslut om bidrag har fattats
  - Investeringen ska ha en hållbarhet på minst 3 år
  - Ansökningar över 50 000 kronor kan tas upp för särskild prövning
  belopp: Upp till 60 procent av investeringskostnaden
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.savsjo.se/kultur-och-fritid/foreningar-och-bidrag/foreningsbidrag.html
  belopp_status: kontrollast
