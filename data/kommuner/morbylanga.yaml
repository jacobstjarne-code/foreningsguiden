- namn: Kommunalt driftbidrag till enskild väg
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Aktiva vägföreningar och vägsamfälligheter utan statligt driftbidrag
  deadlines:
    typ: fasta
    datum: [02-15]
  krav:
  - Sökanden ska vara en aktiv vägsamfällighet eller vägförening med organisationsnummer och andelstal, eller en organiserad frivillig förening
  - Vägen får inte vara berättigad till statligt vägbidrag och ska betjäna permanentbostad utan att vara en privat infart
  - Vägen ska vara 200–990 meter, öppen för allmän motortrafik och uppfylla regler om beläggning, bredd, fri höjd och vändplats
  - Årsmötesprotokoll ska godkänna riktlinjer, ansökan och kontaktperson; årlig driftkostnad ska redovisas och kommunen får utöva tillsyn
  belopp: 16 kr per löpmeter asfaltväg och 12 kr per löpmeter grusväg
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperiod 15 januari–15 februari; senare ansökningar behandlas inte.
  kalla_url: &vagnorm https://www.morbylanga.se/wp-content/uploads/2025/09/riktlinjer-for-kommunalt-vagbidrad-enskilda-vagar-beslutad-av-tn-250819-61.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-18'
  anteckning: Reglerna gäller från och med 1 januari 2026.
  id: morbylanga-kommunalt-driftsbidrag-enskild-vag
- namn: Kommunalt investeringsbidrag till enskild väg
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Aktiva vägföreningar med en större investering i vägnätet
  deadlines:
    typ: fasta
    datum: [02-15]
  krav:
  - Sökanden ska vara en aktiv vägförening utan statligt bidrag, eller med statligt bidrag men utan särskilt driftbidrag i klassen Hög
  - Investeringen ska avse vägnätet, exempelvis beläggning, bärighet, mötesplats, räcke eller trumma
  - Vägen ska betjäna permanentbostad, vara öppen för allmän motortrafik och uppfylla kommunens tekniska kriterier
  - Årsmötesprotokoll, offert eller kostnadsunderlag och Trafikverkets protokoll som visar klass Mellan eller Låg ska bifogas
  belopp: 50 procent av beräknad kostnad, högst 100 000 kr per år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperiod 15 januari–15 februari; senare ansökningar behandlas inte.
  kalla_url: *vagnorm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-18'
  anteckning: null
  id: morbylanga-kommunalt-investeringsbidrag-enskild-vag
- namn: Kommunalt snöbidrag
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Föreningar som är berättigade till kommunal vinterväghållning men sköter snöröjningen själva
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Föreningen ska vara berättigad till kommunal vinterväghållning och välja snöröjning i egen regi
  - Vägen ska uppfylla kommunens kriterier för permanentboende, längd, bredd, framkomlighet och vändplats
  - Föreningen ska fakturera kommunen för stödberättigad väglängd senast 31 mars
  belopp: 3 kr per löpmeter berättigad väg, indexuppräknat enligt gällande index
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Faktura för årets snöbidrag ska lämnas senast 31 mars.
  kalla_url: https://www.morbylanga.se/wp-content/uploads/2024/08/riktlinjer-for-snorojning-och-vintervaghallning-antagen-av-tn-2024-05-28.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-18'
  anteckning: Nyansökan om kommunal snöröjning har perioden 15 augusti–15 september, men den årliga bidragsinlämningen är fakturan den 31 mars.
  id: morbylanga-kommunalt-snobidrag
- id: morbylanga-samarbetsstod-marknadsforing
  namn: Ekonomiskt stöd i samarbete om marknadsföring
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar och arrangörer vars verksamhet eller arrangemang ger kommunen ett samhälls- eller marknadsföringsvärde
  deadlines: {typ: okand, datum: []}
  krav:
  - Samarbetet ska avse en aktör, ett arrangemang eller en arrangemangstyp som kommunen bedömer angelägen inom årets inriktning
  - Parterna ska teckna avtal med en tydlig och konkret motprestation som kommunen bedömer likvärdig med eller mer värd än stödet
  - Minst ett villkor ska uppfyllas: aktiv barn- och ungdomsverksamhet, ett öppet samhällsutvecklande arrangemang eller ett tydligt immateriellt marknadsföringsvärde för kommunen
  - Samarbetet ska bidra till att stärka kommunens vision
  - Avtalet ska följas upp och utvärderas av ansvarig verksamhet
  belopp: Kommundirektören kan besluta om högst 50 000 kr; högre belopp beslutas av kommunstyrelsen eller ansvarig nämnd
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen allmän ansökningsperiod eller sista ansökningsdag.
  kalla_url: https://www.morbylanga.se/wp-content/uploads/2023/05/anvisningar-for-sponsring-7.pdf
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet är även öppet för andra arrangörer, företag och kulturutövare; föreningar konkurrerar därför med andra sökandetyper och stödet förutsätter en avtalad marknadsföringsmotprestation.
  senast_verifierad: '2026-08-23'
