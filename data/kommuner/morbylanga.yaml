    datum:
    - 08-25
  krav:
  - Föreningen ska uppfylla kraven i kommunens allmänna bestämmelser för föreningsbidrag (bl.a. öppen för alla, antagna stadgar,
    medlemsförteckning, egen styrelse och kassaförvaltning)
  - Simskolan ska arrangeras i Mörbylånga kommun och vara öppen för alla
  - Simskolan ska ha minst tio deltagare och minst tio lektionstillfällen för varje barn
  - Simskoleverksamheten ska ledas av simlärare utbildade av SLS eller Svenska Simförbundet
  - Ansvarig ledare på plats ska vara minst 18 år
