  krav:
  - Föreningen ska vara ansluten till en riksorganisation som är berättigad till statsbidrag för sin centrala verksamhet
  - Föreningen ska ha en av årsmötet antagen policy för alkohol/tobak/doping/droger/spel
  - Gruppaktivitet ska pågå i minst 60 minuter, ledas av minst en ledare utsedd av föreningen och bestå av minst tre aktiva
    deltagare i åldern 5-25 år som är medlemmar i föreningen
  - Gruppaktiviteten ska innehålla en gemensam samling och avslutning
  - Ledaren ska ha fyllt 13 år, vara medlem i föreningen och får inte vara ansvarig för flera gruppaktiviteter samtidigt
  - Fritidsföreningar som inte är anslutna till Riksidrottsförbundet ska redovisa gruppaktiviteter och aktuellt medlemsregister
    i samband med bidragsansökan
  belopp: null
