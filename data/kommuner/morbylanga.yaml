  krav:
  - Lokalen ska drivas av en ideell förening och vara öppen och tillgänglig för föreningars och privatpersoners verksamheter
    (möten, sammankomster, studier, kultur- och fritidsaktiviteter, fester och liknande)
  - I ansökan ska yta anges för den del av byggnaden som används som samlingslokal
  - Antal interna och externa sammankomster under senaste verksamhetsåret ska redovisas i ansökan
