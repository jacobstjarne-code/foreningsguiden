  krav:
  - Föreningen måste registrera närvaro i Rbok-systemet för aktivitetsbidrag
  - Föreningen ska ha sitt säte i Båstads kommun och/eller bedriva verksamheten i Båstads kommun med majoriteten av medlemmarna
