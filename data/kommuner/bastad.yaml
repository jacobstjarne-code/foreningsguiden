  krav:
  - Föreningen ska vara ideell och allmännyttig, ha säte eller huvudsaklig verksamhet i Båstad och uppfylla kommunens gemensamma föreningsvillkor
  - Minst tio registrerade medlemmar ska vara 4–25 år och ingen likadan föreningsverksamhet får ha funnits på orten de senaste tre åren
  - Intyg om riksorganisation, konstituerande protokoll, stadgar, verksamhetsplan, giro och styrelsekontakter ska lämnas
