- id: bastad-verksamhetsstod-barn-unga
  namn: Verksamhetsstöd till barn- och ungdomsföreningar
  kategori: [idrott, ovrig]
  foreningstyp: *ungdomstyper
  malgrupp: Föreningar med regelbunden verksamhet för barn och unga 4–25 år
  deadlines: {typ: fasta, datum: [02-25, 08-25]}
  krav:
  - Föreningen ska ha minst tio medlemmar 4–25 år och minst 300 deltagaraktiviteter per år
  - Varje medlem ska vara aktiv minst åtta gånger per år och närvaro ska registreras digitalt
  - Aktiviteten ska vara planerad, pågå minst 45 minuter och normalt ha minst fem deltagare inklusive ledare; tennis, padel, ridning och bågskytte får ha tre
  - En person får räknas högst en gång per idrott och dag och högst fyra gånger per vecka
  - Entrétävlingar, kommersiell verksamhet, lovaktiviteter och studiecirklar är inte stödberättigade
  belopp: 6 kr per deltagaraktivitet för 4–6 år, 18 kr för 7–20 år och 6 kr för 21–25 år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Hösttermin redovisas senast 25 februari och vårtermin senast 25 augusti.
