- id: bastad-kommunalt-underhallsbidrag-enskild-vag
  namn: Kommunalt underhållsbidrag till enskild väg
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Vägföreningar, vägsamfälligheter och andra väghållare för enskilda vägar
  deadlines: {typ: fasta, datum: [02-28]}
  krav:
  - Vägförening eller vägsamfällighet ska normalt vara bildad; undantag gäller väg utanför byggnadsplaneområde utan statsbidrag och enskild utfartsväg
  - Vägen och de allmänna platser som får bidrag ska vara öppna för allmän trafik och får inte stängas utan kommunens medgivande
  - Vägsamfällighetsföreningen ska vara registrerad i kommunens föreningsregister och hålla kontaktuppgifterna aktuella
  - Årsredovisning för föregående år ska lämnas senast 28 februari; en förstagångssökande ska dessutom skicka en särskild ansökan för kommunens prövning
  - Väghållaren ska lämna de uppgifter kommunen behöver och följa kommunens beslut och väghållningskrav
  belopp: Grundbeloppen indexeras årligen från 2013 års nivåer; normen anger 2,50 kr per meter för grupp A samt särskilda schabloner för väg, gång- och cykelväg, grönyta, lekplats och administration i grupp B
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Årsredovisning för föregående år ska vara kommunen till handa senast 28 februari; kommunen anger ingen separat fast sista dag för en första ansökan.
  kalla_url: &vagnorm https://www.bastad.se/trafik-och-gator/gator/kommunalt-bidrag-till-enskild-vag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet är öppet för vägföreningar och samfälligheter men normens undantag omfattar även vissa enskilda väghållare, vilket innebär konkurrens från sökande som inte är föreningar.
  senast_verifierad: '2026-08-23'
- id: bastad-sarskilt-driftsbidrag-enskild-vag
  namn: Särskilt driftsbidrag till enskild väg
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Väghållare som redan får årligt kommunalt underhållsbidrag och behöver göra en större underhållsåtgärd
  deadlines: {typ: fasta, datum: [04-30]}
  krav:
  - Väghållaren ska redan få kommunalt underhållsbidrag för den aktuella vägen
  - Arbetet ska vara en större underhålls- eller förbättringsåtgärd och kosta minst 5 000 kr exklusive moms
  - Ansökan ska lämnas innan kommunen fattar beslut och kostnader som uppstått före beslut ersätts normalt inte
  - En väg utan statligt bidrag ska redovisa tre offerter och arbetet ska utföras av företaget med den billigaste offerten
  - En väg med statligt särskilt driftsbidrag ska bifoga Trafikverkets beslut
  - Utbetalning sker först efter utfört och kommunalt godkänt arbete samt inlämnad fakturakopia
  belopp: För väg med statligt särskilt driftsbidrag kan kommunen täcka mellanskillnaden så att väghållaren betalar 15 procent av godkänd kostnad; väg utan statligt bidrag kan få högst 85 procent
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan senast 30 april det år arbetet ska utföras och alltid före beslut och projektstart.
  kalla_url: *vagnorm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Behörigheten följer det årliga underhållsbidraget och omfattar därför både föreningar och de enskilda väghållare som normens undantag släpper in.
  senast_verifierad: '2026-08-23'
