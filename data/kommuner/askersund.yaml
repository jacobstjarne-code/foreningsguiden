- id: askersund-aktivitetsbidrag
  namn: Aktivitetsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Ungdoms- och barnföreningar
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Deltagaren ska aktivt delta minst 45 minuter i en bidragsberättigad gruppaktivitet, i åldern 7–21 år (från det kalenderår
    åldern uppnås)
  - Endast barn- och ungdomsaktiviteter utan religiös påverkan godkänns
  - Minst 3 och max 20 deltagare i bidragsberättigad ålder per aktivitetstillfälle (ledare 13–21 år får räknas som deltagare)
  - Aktiviteten/gruppen ska ha minst en ledare som inte samtidigt är ledare för en annan grupp
  - Aktiviteten genomförs i föreningens regi och bidrag ges endast en gång per dag och deltagare inom samma förening
  - Bidrag utgår inte till aktivitet som ordnas av riksorganisation, distrikt eller lokalt samarbetsorgan, till kommersiella
    arrangemang eller till studiecirklar anordnade av studieförbund
  - Närvarokort ska föras vid varje sammankomst
  belopp: 50 kronor per sammankomst och deltagare i åldern 7–12 år. För deltagare i åldern 13–21 år utgår 3 kronor extra per
    deltagartillfälle.
  sen_ansokan: 'Två ansökningstillfällen per år: 25 februari för aktiviteter januari-juni, 25 augusti för juli-december'
  kalla_url: https://www.askersund.se/download/18.454c2f5419c47bd71125acb/1771330899047/Bidrag%20och%20st%C3%B6d%20till%20civilsamh%C3%A4llet.pdf
