- id: boxholm-aktivitetsbidrag
  namn: Aktivitetsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar för aktivitets- och mötesverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska bedriva barn- och ungdomsverksamhet för 7–25 år eller verksamhet för personer med funktionsnedsättning
  - Aktiviteten ska vara planerad, ledarledd och pågå i minst 45 minuter med minst tre stödberättigade deltagare utöver ledare
  - Ledaren ska fylla minst 13 år, vara medlem och närvara hela aktiviteten; högst 20 deltagare får redovisas per ledare
  - Deltagare ska normalt vara medlemmar och får räknas högst en gång per dag inom samma förening
  - Närvaro ska registreras vid varje aktivitet och ansökan samt närvarounderlag sparas i minst tre år
  - Entrébelagda tävlingar, kommersiella arrangemang, studiecirklar, skoltid och privat verksamhet är inte stödgrundande
  belopp: 15 kronor i ledarstöd per gruppaktivitet, 7 kronor i extra ledarstöd vid minst två ledare och cirka 7 kronor per deltagare och aktivitet
  sen_ansokan: Höstens aktiviteter söks senast 25 februari och vårens aktiviteter senast 25 augusti
