  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan ska göras innan kostnaden uppstår eller projektet genomförs.
  senast_verifierad: '2026-08-18'
- id: nynashamn-lovaktiviteter
  namn: Stöd till lovaktiviteter
  kategori: [idrott, kultur, ovrig]
  malgrupp: Ideella föreningar som ordnar kostnadsfria lovaktiviteter för barn, unga och deras vårdnadshavare.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: relativ, datum: [] }
  krav:
  - Föreningen ska uppfylla kommunens allmänna föreningsvillkor och aktiviteten ska genomföras i Nynäshamns kommun
  - Aktiviteten ska vara kostnadsfri, offentlig och hålla god kvalitet under ett skollov för barn, unga och deras vårdnadshavare; påsklovsaktiviteter omfattas inte
  - Stöd ges inte till medlemsintern verksamhet, permanenta investeringar, religiösa eller politiska aktiviteter, välgörenhet eller vinstsyfte
  - Ansökan ska innehålla aktivitetsbeskrivning och budget och lämnas minst sex veckor före det aktuella lovet
  - Genomförandet ska redovisas senast två månader efter aktiviteten
  belopp: Ledararvode får beräknas till högst 95 kr per timme och ledare; övrigt stöd prövas mot redovisad budget
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas minst sex veckor före det lov då aktiviteten ska genomföras.
  kalla_url: https://nynashamn.se/download/18.2cb62a9619b081ae16b2a5f3/1765973638790/Riktlinjer%20f%C3%B6r%20st%C3%B6d%20till%20kultur%20och%20fritidsverksamheter%20i%20Nyn%C3%A4shamns%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet kan också användas för utbildning av unga ledare inom lovverksamheten.
  senast_verifierad: '2026-08-18'
- id: nynashamn-samkraftsvandring
  namn: Samkraftsvandring (nattvandring)
  kategori: [social, ovrig]
  malgrupp: Registrerade föreningar som trygghetsvandrar under större helger i Nynäshamns kommun.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: okand, datum: [] }
  krav:
  - Föreningen ska vara registrerad i kommunens föreningsregister och uppfylla kommunens allmänna villkor för föreningsstöd
  - Föreningen ska teckna avtal med Nattvandring.nu och får genom avtalet utbildning, västar och försäkring
  - Helg, tid och plats ska överenskommas med kommunens samordnare
  - Varje vandringsgrupp ska bestå av minst fyra personer från föreningen, samtliga över 18 år, och begärda utdrag ur belastningsregistret ska lämnas
  - Minst en person i varje grupp ska ha genomfört Nattvandring.nu:s grundutbildning och varje ersättningsgrundande pass ska pågå i fyra timmar
  belopp: 3 000 kr per genomfört fyratimmarspass under en större helg
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen sista ansökningsdag; helger och pass planeras med samordnaren.
  kalla_url: https://nynashamn.se/service/kultur--fritid/foreningsliv/foreningsbidrag-inom-kultur-och-fritid
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ersättningen betalas ut efter genomförd vandring.
  senast_verifierad: '2026-08-18'
