bidrag:
- id: nynashamn-startbidrag
  namn: Startbidrag
  kategori: [idrott, kultur, ovrig]
  malgrupp: Nystartade ideella föreningar inom kultur- och fritidsområdet i Nynäshamns kommun.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: relativ, datum: [] }
  krav:
  - Föreningen ska vara ideell, demokratiskt uppbyggd, öppen för målgruppen och bedriva kontinuerlig verksamhet i Nynäshamns kommun
  - Föreningen ska ha bildats under de senaste tre månaderna och ansökan ska lämnas inom tre månader från bildandet
  - Ansökan ska innehålla konstituerande protokoll, stadgar, verksamhetsplan, uppgift om hur stödet ska användas, medlemsförteckning eller revisorsintyg, organisationsnummer och konto
  - Föreningen ska vara registrerad i kommunens föreningsregister, ha minst 100 kronor i årlig medlemsavgift om inte undantag medges och uppfylla kommunens demokrati-, försäkrings- och dokumentationsvillkor
  - Stödet ska redovisas senast sex månader efter utbetalningen
  belopp: Kommunen publicerar ingen generell beloppsnivå för startbidraget
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan kan lämnas under året men måste komma in inom tre månader från föreningens bildande.
