  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan görs digitalt och kan avse den nya föreningens uppstart, inte en ny sektion i en befintlig förening.
  senast_verifierad: '2026-08-18'
- id: nynashamn-lokalt-aktivitetsstod
  ansokningsvag: "En separat kommunal ansökan eller aktivitetsredovisning krävs via E-tjänster för bidrag inom kultur och fritid; RF-rapporteringen räcker inte ensam."
  namn: Kommunalt lokalt aktivitetsstöd
  kategori: [idrott, kultur, ovrig]
  malgrupp: Ideella föreningar med gruppaktiviteter för barn och unga 6–20 år eller personer med funktionsnedsättning oavsett ålder.
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [02-25, 08-25] }
  krav:
  - Föreningen ska uppfylla kommunens allmänna föreningsvillkor och vara registrerad i föreningsregistret och Aktivitetskort på nätet
  - En sammankomst ska vara planerad, pågå minst 60 minuter, ha gemensam start och avslutning samt ledas av en ansvarig ledare som fyllt 15 år
  - Gruppen ska ha minst tre bidragsberättigade medlemmar; deltagare 6–12 år får räknas vid högst 40 och deltagare 13–15 år vid högst 60 sammankomster per halvår
  - Närvaro ska registreras löpande och en ledare får inte samtidigt ansvara för flera grupper; normalt räknas högst en aktivitet per förening och dag
  - Ansökan för januari–juni ska lämnas senast 25 augusti och för juli–december senast 25 februari
  belopp: Stödet beräknas efter godkända deltagartillfällen; integrerad verksamhet där deltagare med funktionsnedsättning kräver extra ledare får tre gånger ordinarie stöd
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Sena ansökningar avslås om inte föreningen visar rimliga och relevanta omständigheter.
  kalla_url: https://nynashamn.se/download/18.2cb62a9619b081ae16b2a5f3/1765973638790/Riktlinjer%20f%C3%B6r%20st%C3%B6d%20till%20kultur%20och%20fritidsverksamheter%20i%20Nyn%C3%A4shamns%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunen publicerar beräkningsgrunden men inte den ordinarie kronnivån; stödet rapporteras halvårsvis i ApN.
  alder_min: 6
  alder_max: 20
  senast_verifierad: '2026-08-18'
- id: nynashamn-stod-publika-evenemang
  namn: Stöd till publika evenemang
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar, organisationer, juridiska personer, grupper och enskilda som arrangerar kortare offentliga kultur-, idrotts- eller traditionsanknutna evenemang i kommunen.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [03-25, 09-25] }
  krav:
  - Evenemanget ska vara offentligt, hålla god kvalitet, ha allmänintresse och genomföras i Nynäshamns kommun
  - Ansökan ska innehålla projektplan och ekonomisk plan och kommunen ska anges som stödgivare med kommunens logotyp
  - Stöd ges inte till kommunal eller redan kommunfinansierad verksamhet, bestående investeringar, religiösa eller politiska projekt, välgörenhet eller vinstsyfte
  - Sökande föreningar ska uppfylla kommunens allmänna demokrati-, försäkrings-, register- och dokumentationsvillkor
  - Evenemanget och ekonomin ska redovisas senast tre månader efter genomförandet
  belopp: Stödet prövas individuellt och får inte finansiera hela evenemanget; kommunen publicerar ingen generell beloppsnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 mars för evenemang april–september och 25 september för evenemang oktober–mars.
  kalla_url: https://nynashamn.se/download/18.2cb62a9619b081ae16b2a5f3/1765973638790/Riktlinjer%20f%C3%B6r%20st%C3%B6d%20till%20kultur%20och%20fritidsverksamheter%20i%20Nyn%C3%A4shamns%20kommun.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet kan även sökas av enskilda och grupper, men posten ingår eftersom föreningar uttryckligen är bidragsberättigade.
  senast_verifierad: '2026-08-18'
- id: nynashamn-lokal-och-driftsbidrag
  namn: Lokal- och driftsbidrag
  kategori: [idrott, kultur, ovrig]
  malgrupp: Ideella föreningar vars huvudsakliga verksamhet bedrivs i en egen eller externt hyrd lokal eller anläggning.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [03-31] }
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor och huvudsakligen använda lokalen eller anläggningen för sin bidragsberättigade verksamhet
  - Kommunal lokal ska saknas för verksamheten; en ny sökande ska kontakta kommunen före ansökan och lokal utanför kommunen godtas bara när motsvarande möjlighet saknas lokalt
  - Stödet avser verksamhetsyta, inte kontor eller klubblokal, och kostnader och intäkter ska kunna styrkas; kulturbyggnader ska vara godkända i förväg
  - Godtagbara kostnader är investeringar i verksamhetsytor, el, vatten och avlopp, värme, avfall, försäkring, hyra, ränta och tomträtt eller arrende
  - Ansökan ska avse föregående års kostnader och lämnas senast 31 mars
  belopp: Högst 50 procent av beräknad nettolokalkostnad upp till 1 000 000 kr och högst 70 procent för kostnadsdelen mellan 1 000 000 och 1 500 000 kr
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast 31 mars; utbetalning sker senast 30 april.
  kalla_url: https://nynashamn.se/download/18.2cb62a9619b081ae16b2a5f3/1765973638790/Riktlinjer%20f%C3%B6r%20st%C3%B6d%20till%20kultur%20och%20fritidsverksamheter%20i%20Nyn%C3%A4shamns%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Fördelningen påverkas av kommunens årliga budget och antalet godkända ansökningar.
  senast_verifierad: '2026-08-18'
- id: nynashamn-studieforbundsbidrag
  namn: Bidrag till studieförbund
  kategori: [kultur]
  malgrupp: Lokala avdelningar av studieförbund som är godkända av Folkbildningsrådet och bedriver verksamhet i Nynäshamns kommun.
  foreningstyp: [kultur, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [04-30] }
  krav:
  - Studieförbundet ska vara godkänt av Folkbildningsrådet, följa dess statsbidragsvillkor och ha en lokal avdelning med verksamhet i Nynäshamns kommun
  - Ansökan får endast avse den lokala verksamheten och samma verksamhet får inte få annat kommunalt stöd
  - Ansökan ska innehålla stadgar, verksamhetsberättelse, årsmötes- och konstituerande protokoll, resultat- och balansräkning, revisionsberättelse och firmateckningsunderlag
  - Folkbildningsrådets sammanställning över föregående års studietimmar i kommunen ska bifogas
  - Ansökan ska lämnas senast 30 april
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Det årliga anslaget till studieförbunden fördelas efter godkända studietimmar och tillgänglig budget
  sen_ansokan: Ansökan ska lämnas senast 30 april; utbetalning sker senast 31 maj.
  kalla_url: https://nynashamn.se/download/18.2cb62a9619b081ae16b2a5f3/1765973638790/Riktlinjer%20f%C3%B6r%20st%C3%B6d%20till%20kultur%20och%20fritidsverksamheter%20i%20Nyn%C3%A4shamns%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Fördelningen ska främja likvärdiga förutsättningar mellan studieförbunden.
  senast_verifierad: '2026-08-18'
- id: nynashamn-sarskilt-bidrag
  namn: Särskilt bidrag
  kategori: [idrott, kultur, ovrig]
  malgrupp: Ideella och ekonomiska föreningar med en tillfällig kostnad, investering eller ett projekt utanför den ordinarie verksamheten.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: lopande, datum: [] }
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor; även ekonomiska föreningar kan söka detta stöd
  - Ansökan ska avse en nödvändig engångskostnad, ett inköp, ett projekt eller en investering utanför ordinarie verksamhet och innehålla beskrivning och budget
  - Åtgärden får inte redan vara genomförd eller finansierad och stödet får inte täcka hela kostnaden
  - Verksamhet för barn och unga, pensionärer och personer med funktionsnedsättning samt geografisk spridning prioriteras
  - Beviljat stöd ska redovisas senast tre månader efter genomförandet
  belopp: Högst 50 000 kr per förening och år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan kan lämnas löpande; normal handläggningstid är cirka en månad.
