bidrag:
- namn: Verksamhetsstöd till idrotts- och friluftsföreningar
  kategori:
  - idrott
  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska vara ideell och ha godkända stadgar, antingen av en riksorganisation eller av kommunen
  - Föreningen ska ha en styrelse, stadgar och hålla årsmöte
  - Föreningen ska ha ett organisationsnummer och ett post- eller bankgirokonto
  - Medlemmarna ska kunna påverka föreningens verksamhet
  - Minst 10 medlemmar ska vara folkbokförda i Lomma kommun och delta regelbundet i verksamheten
  - Föreningen ska ta ut en medlemsavgift (personlig, familj eller institutionell)
  - Stöd ges normalt inte till verksamheter som redan får annat kommunalt stöd
  - Föreningen ska följa kommunens alkohol- och drogpolitiska program och arbeta aktivt för en drogfri verksamhet
  - Föreningen ska vid behov kunna visa upp ekonomiska verifikationer
  belopp: Stödets storlek fastställs inte i förväg utan bestäms efter samtal mellan kommunen och föreningens ordförande och
    kassör. Verksamhetsstödet påverkas av föreningens sociala bokslut.
