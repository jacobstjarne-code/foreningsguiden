  krav:
  - Studieförbundets centrala organisation ska vara godkänd för statsbidrag
  - Lokalavdelningen ska lämna in verksamhetsplan med mål och riktlinjer för det kommande året
  - Lokalavdelningen ska lämna in en utvärderings- och uppföljningsplan
  - Lokalavdelningen ska lämna in verksamhetsberättelse
  - Årlig redovisning (skriftlig och muntlig vid möte sammankallat av kulturnämnden) ska omfatta måluppfyllelse, antal cirklar/kulturgrupper/evenemang,
    deltagarantal per ämnesområde samt resursfördelning mellan verksamhet och administration
  belopp: Stödets storlek fastställs inte i förväg utan bestäms på uppföljningssamtal mellan kommunen och studieförbundet.
  sen_ansokan: Studieförbund ansöker om verksamhetsstöd en gång årligen senast den 1 december.
