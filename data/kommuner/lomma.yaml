- namn: Sociala bidrag – föreningsbidrag
  kategori:
  - social
  - pensionar
  - funktionsratt
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 09-30
  krav:
  - Föreningen ska bedriva verksamhet riktad till invånare i Lomma kommun
  - Bidrag kan lämnas till föreningar som bedriver verksamhet inom socialnämndens ansvarsområde
  - Föreningen ska ha stadgar som är godkända av riksorganisation eller av kommunen
  - Föreningen ska ha en demokratisk uppbyggnad med egen styrelse, kassaförvaltning samt post-/bankgirokonto och organisationsnummer
  - Föreningen ska stå öppen för alla, inom respektive kategori, på lika villkor
  - Föreningens verksamhet ska vara ett komplement till nämndens uppdrag och får inte ersätta eller överta dess funktioner
  - Föreningen har skyldighet att ställa sina räkenskaper och revisionshandlingar till förfogande för granskning
  - Bidrag utgår normalt inte till verksamhet som är berättigad till annat kommunalt stöd
  belopp: Bidraget är avsett att täcka en del av kostnaderna för föreningens verksamhet. Exakt belopp anges inte i regeldokumentet.
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan avseende nästkommande år ska ha inkommit till socialnämnden senast den 30 september. Beslut om bidrag
    fattas senast i december och utbetalning sker i januari påföljande år.
