- namn: Driftsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med driftkostnader
  deadlines:
    typ: fasta
    datum:
    - 03-25
  krav:
  - Bidraget baseras på faktiska kostnader föreningen haft för sin verksamhet och anläggning
  - 'Kostnader som får anges: el och uppvärmning; vatten och avlopp; hyra av föreningslokal som inte tillhör Tjörns kommun;
    hyra av mötesplats till löpande verksamhet; avgift till vägförening; försäkringar och larm; verksamhetsspecifikt underhåll
    (t.ex. drivmedel, maskinhyra, snöröjning, grus, strö, djurfoder, veterinärvård)'
  - Kapitalkostnader (avskrivningar och räntor) betalas endast ut efter särskilt beslut i kultur- och fritidsnämnden
  - 'Obligatoriskt underlag: redovisning/verifikat av verksamhetens/anläggningens faktiska drift- och underhållskostnader
    under föregående år'
  belopp: Inget fast belopp; bidraget beräknas utifrån redovisade faktiska kostnader.
  sen_ansokan: Ej angivet i källan
