bidrag:
- namn: Aktivitetsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med aktiviteter
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Aktiviteten ska vara ledarledd och rikta sig till barn och unga 7–25 år (ingen övre åldersgräns för deltagare med funktionsvariation)
  - Aktiviteten ska ha gemensam samling och avslutning och pågå minst 45 minuter
  - Aktiviteten ska ha minst tre och högst 30 deltagare utöver ledare
  - Aktiviteten ska ledas av minst en ledare (lägst 13 år) som är medlem i och utsedd av föreningen; ledaren får inte ansvara
    för flera aktiviteter samtidigt
  - Bidrag beviljas endast för ett tillfälle per person, dygn och förening, oavsett antal aktiviteter
  - 'Obligatoriskt underlag i ansökan: uppgifter om antal aktiviteter, deltagare och ledare'
  belopp: 'Deltagarstöd: 50 % av Riksidrottsförbundets (RF) beslutade LOK-stödsbelopp. Ledarstöd: 10 kr per ledarledd gruppaktivitet,
    plus 5 kr per extra ledare vid två eller fler ledare. Tillägg för deltagare med funktionsnedsättning (minst en deltagare
    per aktivitet, extra ledare krävs): 75 kr per deltagare och 75 kr per extra ledare.'
  sen_ansokan: Ej angivet i källan
