- namn: Arrangemangsbidrag
  kategori:
  - kultur
  - ovrig
  malgrupp: Föreningar med arrangemang
  deadlines:
    typ: fasta
    datum:
    - 02-01
    - 04-01
    - 09-01
  krav:
  - Kan sökas av föreningar, organisationer och enskilda individer, även utan huvudsaklig verksamhet i Tjörns kommun, under
    förutsättning att sökande arbetar för Tjörns invånares allmänna intresse och har särskild anknytning till Tjörns geografiska
    område
  - Arrangemanget ska äga rum i Tjörns kommun, vara offentligt och annonseras för allmänheten med tydlig angivelse att det
    genomförs med stöd av Tjörns kommun
  - Arrangemanget ska präglas av öppenhet och kunna granskas av allmänheten utan risk för bristande tilltro
  - Sökande ska ställa sig bakom kommunens värdegrund för föreningsbidrag (avsnitt 2.2)
  - 'Obligatoriskt underlag: utförlig beskrivning av arrangemanget (inklusive syfte och huvudsaklig målgrupp), ekonomisk kalkyl
    (kostnader och intäkter), information om övrig finansiering, marknadsföringsplan'
  belopp: Inget fast belopp angivet; beslut fattas av kultur- och fritidsnämnden.
