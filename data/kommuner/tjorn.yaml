- namn: Projektbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med projekt
  deadlines:
    typ: fasta
    datum:
    - 02-01
    - 04-01
    - 09-01
  krav:
  - Bidraget ska uppmuntra utveckling och nya initiativ, till exempel nyinvestering i föreningsanläggning, oförutsedda händelser
    eller delfinansiering vid ansökan om annan extern finansiering
  - Ansökan om projektbidrag ska göras innan projektet startar
  - Bidrag ges inte till jubileer, stödgalor, interna arrangemang, inköp av mat och dryck eller renodlade pedagogiska projekt
    (t.ex. studiecirkelform)
  - Kräver alltid viss självfinansiering — föreningen måste gå in med egna medel i projektet
  - 'Obligatoriskt underlag: projektbeskrivning (inklusive marknadsföring), budget, tidplan (inklusive tidpunkt för återkoppling
    och redovisning); vid investering även motivering till investeringen, kostnadskalkyl, finansieringsplan och offerter från
    minst två leverantörer om planerad investering är minst 50 000 kronor'
  belopp: Inget fast belopp; kräver alltid viss självfinansiering. Beslut fattas av kultur- och fritidsnämnden.
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.tjorn.se/kultur-fritid-och-turism/stod-bidrag-och-stipendier
