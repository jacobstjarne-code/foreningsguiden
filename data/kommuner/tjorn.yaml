    - 11-01
  krav:
  - Ansökan ska göras samma år som utbildningen genomförs
  - Bidrag beslutas på delegation av avdelningschefen för fritid
  - 'Obligatoriskt underlag: kortfattad beskrivning av utbildningen och dess syfte, antal deltagare, kurskostnad per deltagare;
    underlag på genomförd utbildning bifogas ansökan'
  belopp: Max 75 % av kurskostnaden, högst 5 000 kronor per förening och år.
