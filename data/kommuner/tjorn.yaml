  krav:
  - Kan endast sökas av kulturföreningar
  - Föreningen ska bedriva kontinuerlig och utåtriktad kulturverksamhet
  - Ansökan ska specificera vilka kostnader som avses
  - 'Obligatoriskt underlag: verksamhetsplan samt budget för det år bidraget avser'
