  krav:
  - Arrangemanget ska äga rum i Tjörns kommun, vara offentligt och annonseras för allmänheten
  - Marknadsföringen ska tydligt ange att arrangemanget genomförs med stöd av Tjörns kommun
  - Sökanden ska arbeta för Tjörninvånarnas allmänna intresse och ha särskild anknytning till Tjörns geografiska område
  - Arrangemanget ska präglas av öppenhet och sökanden ska ställa sig bakom kommunens värdegrund för föreningsbidrag
  - Ansökan ska innehålla en utförlig beskrivning med syfte och målgrupp, ekonomisk kalkyl, uppgifter om övrig finansiering och marknadsföringsplan
  - Nytänkande, lyskraft, entreprenörsanda, stärkta traditioner samt anknytning till Tjörns historia och kulturarv är meriterande
  belopp: Individuellt efter prövning; kommunen publicerar ingen generell beloppsnivå
