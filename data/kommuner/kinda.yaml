- id: kinda-aktivitetsbidrag
  namn: Aktivitetsbidrag
  kategori: [idrott, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, friluft, social, ungdom, annat]
  malgrupp: Föreningar med idrotts- eller fritidsverksamhet för barn och unga 7–25 år, seniorer 65+ eller personer med funktionsnedsättning
  deadlines:
    typ: fasta
    datum: [02-25]
  krav:
  - &ideell Föreningen ska vara ideell, ha säte i Kinda och ha varit verksam minst ett år före bidragsåret; en förening i närliggande kommun kan undantagsvis godkännas om motsvarande aktivitet saknas i Kinda
  - &formalia Föreningen ska ha stadgar, stadgeenligt vald styrelse och revisorer, årsmöte, eget organisationsnummer, eget konto och grundläggande försäkringsskydd
  - &medlemmar Föreningen ska normalt ha minst tio matrikelförda och avgiftsbetalande medlemmar, minst hälften folkbokförda i Kinda och en medlemsavgift på minst 50 kr per år
  - &varderingar Föreningen ska vara öppen och demokratisk samt arbeta för jämställdhet, jämlikhet, integration och tillgänglighet; normens uttryckligen undantagna organisationer får inte stöd
  - &barn Föreningar med barn- och ungdomsverksamhet ska följa barnkonventionen, kontrollera belastningsregister och ha en årsmötesgodkänd ANDTS-policy
  - &arshandlingar Huvudstyrelsen ska bifoga undertecknad verksamhetsberättelse, fullständig resultat- och balansrapport samt revisionsberättelse för närmast avslutat redovisningsår
  - Aktiviteten ska vara planerad, föreningsgenomförd, målgruppsanpassad, minst 60 minuter och ha minst tre deltagande medlemmar; ledare som räknas ska vara minst 13 år
  - Stödgrundande deltagare ska vara folkbokförda i Kinda och får räknas vid högst en aktivitet per dag i samma förening
  - Närvarokort ska sparas fyra år; entrétävlingar, kommersiella arrangemang, studiecirklar och aktivitet under skoltid räknas inte
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Årets pott fördelas efter varje förenings andel av den sammanlagda aktivitetstotalen; totalsumman publiceras inte
  sen_ansokan: Ansökan avser föregående år och ska lämnas senast 25 februari; sena eller ofullständiga ansökningar behandlas inte.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  status: aktiv
