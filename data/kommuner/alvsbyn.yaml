  krav:
  - Föreningen får inte vara en politisk organisation, stödförening (supporterklubb) eller ekonomisk förening
  - Föreningen ska ha antagit stadgar, valt styrelse och varit verksam minst 3 månader före bidragsåret
  - Föreningen ska bedriva sin verksamhet och ha huvuddelen av sina medlemmar i kommunen
  - Bidrag lämnas för drift och underhåll av föreningsägd anläggning samt skötsel och underhåll av skoterleder (huvudleder)
  - Rena hyresbidrag kan endast sökas om kommunen inte kan upplåta en kommunalägd lokal till föreningens verksamhetsbehov
    minst två tillfällen per vecka, och kräver redovisning/kvitton samt hyresavtal
  belopp: 'Schablonbelopp per anläggningstyp: elljusspår 5 000 kr/km (max 15 000 kr), 11-manna gräsplan 8 000 kr (plan 1)
    + 4 000 kr (plan 2), omklädningsbyggnad med dusch 15 000 kr, övrig byggnad 5 000 kr, isbana 3 000 kr, skoterled (huvudled)
    70 kr/km, motorstadion 60 000 kr, allmän badplats 3 000 kr. Rena hyresbidrag max 40 000 kr per år, får ej överstiga redovisad
    kostnad.'
