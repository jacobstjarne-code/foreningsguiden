  beskrivning: Föreningen ska vara registrerad i kommunens föreningsregister, ha huvuddelen av verksamheten i Sollefteå, vald styrelse, årsmöte och stadgar, vara öppen och inte bedrivas för medlemmarnas ekonomiska intresse. Registeruppgifterna ska uppdateras varje år.
