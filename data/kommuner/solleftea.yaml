- id: solleftea-kommunalt-bidrag-enskild-vag
  namn: Kommunalt bidrag till enskild väg
  foreningstyp: [annat]
  kategori: [ovrig]
  malgrupp: Vägföreningar, vägsamfälligheter och andra gemensamma väghållare för enskilda vägar utanför detaljplan
  deadlines:
    typ: okand
    datum: []
  krav:
  - Vägen ska vara en nödvändig utfartsväg från stadigvarande bebott bostadshus till allmän väg och vara längre än 150 meter
  - En gemensam väg ska ha en utsedd kontaktperson med fullmakt samt en förteckning över intressenterna och deras kostnadsandelar
  - Vägen ska underhållas i den omfattning som krävs för att vara farbar, inklusive normalt sommarunderhåll och vinterväghållning
  - Kommunalt bidrag lämnas inte om statligt underhållsbidrag betalas för samma väg; stöd från annat håll ska sökas först när det är möjligt
  - Ansökan ska lämnas varje år på kommunens särskilda blankett och vägen registreras i kommunens register för enskilda vägar
  belopp: 7,50 kr per meter väg och år för sträckan över 150 meter; vid fler än en fastighet minskas den bidragsgrundande sträckan med 50 meter per tillkommande fastighet
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas varje år, men kommunen publicerar ingen fast sista ansökningsdag
  kalla_url: https://www.solleftea.se/download/18.728d385c1977727aecd1/1750054476927/Ans%C3%B6kan%20om%20bidrag%20f%C3%B6r%20v%C3%A4gsamf%C3%A4llighet%20rev%202025.pdf
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet är även öppet för privatpersoner som är permanent boende vid vägen. Vägföreningar och vägsamfälligheter konkurrerar därför med enskilda väghållare om kommunens medel.
  senast_verifierad: '2026-08-23'
