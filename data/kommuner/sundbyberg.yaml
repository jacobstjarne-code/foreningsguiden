- id: sundbyberg-verksamhetsbidrag-social-arbetsmarknad
  namn: Verksamhetsbidrag (social- och arbetsmarknadsnämnden)
  status: aktiv
  foreningstyp: [social, ungdom, annat]
  kategori:
  - social
  - funktionsratt
  malgrupp: Föreningar vars verksamhet förbättrar förutsättningarna för barn och unga i social utsatthet, personer med funktionsnedsättning,
    personer med skadligt bruk eller beroende, personer i hemlöshet eller utanförskap på arbets- eller bostadsmarknaden samt personer
    utsatta för våld eller brott
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Föreningen ska vara ideell, ha organisationsnummer och bedriva demokratisk verksamhet som är öppen för alla inom målgruppen
  - Verksamheten ska komma Sundbybergs invånare till del och komplettera social- och arbetsmarknadsnämndens egna verksamheter
  - Föreningen ska ha ordnad ekonomi, bokföring och redovisning samt lämna de verksamhets- och årsmöteshandlingar som efterfrågas i ansökningssystemet
  - Föreningen får inte vara en politisk organisation eller facklig organisation
  - Verksamhet för barn ska ha rutiner för trygghet, drogförebyggande arbete och kontroll av registerutdrag när lagen kräver det
  - Föreningen ska arbeta strukturerat med kvalitet, missförhållanden, klagomål och säker hantering av personuppgifter
  - Ansökan ska göras digitalt och avse nästkommande kalenderår
  belopp: Beloppet bestäms efter prövning; kommunen publicerar inget fast belopp eller maxtak
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.sundbyberg.se/download/18.34133d8619ed43a35321fd7c/1786955737975/Riktlinjer%20f%C3%B6r%20f%C3%B6reningsbidrag%20%20inom%20social-%20och%20arbetsmarknadsn%C3%A4mnden.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ny riktlinje beslutad av social- och arbetsmarknadsnämnden 21 april 2026 och giltig från 1 augusti 2026. Verksamhetsbidrag är den enda stödformen i riktlinjen och söks digitalt i Actor för nästkommande år.
  senast_verifierad: '2026-08-26'
