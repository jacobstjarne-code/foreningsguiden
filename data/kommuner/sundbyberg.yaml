forutsattningar:
- id: sundbyberg-stodberattigad-kultur-fritid
  vad: Bli stödberättigad förening (godkänd Sundbybergsförening) hos kultur- och fritidsnämnden
  beskrivning: Föreningen registrerar sig hos kultur- och fritidssektorn och skickar in stadgar och verksamhetshandlingar.
    Sektorn bedömer om föreningen uppfyller grundkraven (demokratisk uppbyggnad, öppen för alla att bli medlem, ideellt engagemang,
    verksamhet i Sundbyberg) samt tilläggskravet att minst 50 % av de aktiva medlemmarna ska vara bosatta i Sundbyberg, eller
    att den största medlemsgruppen är bosatt i Sundbyberg (undantag finns för avtalsföreningar, funktionsrättsföreningar och
    föreningar med stort regionalt upptagningsområde). Politiska partier, ekonomiska föreningar, stiftelser, företagsföreningar,
    riksförbund utan lokalavdelning i Sundbyberg och studieförbund kan inte bli stödberättigade föreningar (studieförbund
    har i stället rätt att söka det egna studieförbundsbidraget).
  system: null
  ledtid: 90
  ledtid_text: Det är först tre månader efter godkänd registrering som föreningen kan hyra lokaler till den subventionerade
    taxan för kategori 'Stödberättigad förening'; innan dess gäller taxan för 'Övriga föreningar'
  giltighet: null
  ordning: 1
  kalla_url: https://www.sundbyberg.se/download/18.2e6195c8190a64a78d4179af/1722426253668/Krav%20f%C3%B6r%20att%20bli%20st%C3%B6dber%C3%A4ttigad%20f%C3%B6rening%20inom%20kultur-%20och%20fritidsn%C3%A4mnden%20-%20tillg%C3%A4nglighetsanpassad.pdf
  giltighet_status: ingen_regel
