- id: ekero-publika-arrangemang
  namn: Bidrag till publika arrangemang och öppna aktiviteter
  kategori: [kultur, idrott, ovrig]
  malgrupp: Godkända ideella kultur- och idrottsföreningar som ordnar publika arrangemang, upplevelser eller öppna aktiviteter i Ekerö kommun.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: lopande, datum: [] }
  krav:
  - Föreningen ska vara godkänd för bidrag, finnas i föreningsregistret och uppfylla kommunens demokrati- och likabehandlingsvillkor
  - Arrangemanget eller aktiviteten ska genomföras i Ekerö kommun och vara öppet för alla i den tänkta målgruppen, inte bara föreningens medlemmar
  - Stöd ges till en del av kostnaderna, exempelvis gage, marknadsföring och utrustning; föreningen ska medfinansiera och stöd ges inte till lön eller arvode för egna medlemmar
  - Regelbunden kursverksamhet som kräver föranmälan omfattas inte
  - Aktiviteten ska marknadsföras till målgruppen, publiceras i kommunens evenemangskalender samt utvärderas och återrapporteras
  belopp: Högst 20 000 kr för en enstaka aktivitet; stöd för aktiviteter under hela verksamhetsåret prövas separat
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Enstaka aktiviteter under 20 000 kr söks löpande med besked inom tre veckor; årsansökan för nästkommande verksamhetsår ska lämnas senast 31 oktober.
  kalla_url: https://www.ekero.se/download/18.7a1eecc51773f534e56395ee/1613476866439/Bidrag%20och%20stipendier%20f%C3%B6r%20f%C3%B6reningar%20och%20privatpersoner.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: E-tjänsten har en separat årsansökan och en ansökan för enstaka arrangemang; årsansökan 2026 har sista ansökningsdag 31 oktober.
  senast_verifierad: '2026-08-18'
- id: ekero-aktivitetsstod
  namn: Aktivitetsstöd
  kategori: [idrott, kultur, ovrig]
  malgrupp: Godkända ideella föreningar med fritidsverksamhet för barn och unga 6–20 år eller personer med funktionsnedsättning 6–29 år.
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [02-25, 08-25] }
  krav:
  - Föreningen ska vara godkänd för bidrag, finnas i föreningsregistret, ha minst tio medlemmar i målgrupperna sammanlagt och vara ansluten till en riksorganisation som får statsbidrag
  - Verksamheten ska bedrivas på fritiden i Ekerö kommun, finnas i föreningens verksamhetsplan och främja barnrätt, etik, delaktighet, ideellt engagemang, jämställdhet, integration och drogfrihet
  - En gruppaktivitet ska pågå minst 45 minuter, ha gemensam start och avslutning samt bestå av minst tre och högst 30 deltagare utöver en utsedd ledare som fyllt 13 år
  - Deltagaren ska vara kommuninvånare och medlem i föreningen, med ett begränsat undantag för rekryteringsaktiviteter; ledaren får inte ansvara för flera aktiviteter samtidigt
  - Närvaro med föreskrivna deltagar- och aktivitetsuppgifter ska redovisas löpande och kunna visas för kommunen
  belopp: 10 kr per deltagare och tillfälle; 30 kr per deltagare med funktionsnedsättning och tillfälle
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 augusti för aktiviteter januari–juni och 25 februari för aktiviteter juli–december; ursäktande omständigheter kan ge reducerat eller fullt stöd vid sen ansökan.
  kalla_url: https://ekero.fri-go.se/bidrag/ansokaninfo.aspx?type=1&year=2026
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Om redovisad aktivitetsvolym överstiger nämndens budget minskas anslaget proportionellt vid årets sista utbetalning.
  alder_min: 6
  alder_max: 29
  min_medlemmar: 10
  senast_verifierad: '2026-08-18'
- id: ekero-kompetens-utveckling
  namn: Bidrag för föreningars kompetens och utveckling
  kategori: [kultur, idrott, ovrig]
  malgrupp: Godkända föreningar med aktivitetsbaserad, utåtriktad eller publik kultur- och fritidsverksamhet i Ekerö kommun.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: lopande, datum: [] }
  krav:
  - Föreningen ska vara godkänd för bidrag, verksam i Ekerö kommun och respektera demokrati, allas lika värde, jämlikhet, jämställdhet och förbud mot diskriminering
  - Insatsen ska utveckla verksamhetens kompetens, kvalitet eller tillgänglighet inom exempelvis integration, trygghet, inkludering, bemötande eller metodutveckling
  - Stödet får inte avse en utvecklingsinsats som förbättrar idrotts- eller tävlingsprestationer
  - Ansökan ska avse ett eget projekt eller en utbildningsinsats hos en annan arrangör och innehålla kalkyl
  - Aktiviteten ska utvärderas och återrapporteras
  belopp: Bidragets storlek prövas individuellt; kommunen publicerar ingen generell beloppsnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan sker löpande; upp till 20 000 kr ges besked inom tre veckor och högre belopp beslutas vid nästkommande nämndsammanträde.
  kalla_url: https://ekero.fri-go.se/bidrag/ansokaninfo.aspx?type=7&year=2026
