- id: ekero-anlaggningsstod-drift
  namn: Anläggningsstöd för drift
  kategori: [idrott, kultur, ovrig]
  malgrupp: Godkända föreningar som äger eller arrenderar en lokal eller anläggning som står till allmänhetens förfogande.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [05-31] }
  krav:
