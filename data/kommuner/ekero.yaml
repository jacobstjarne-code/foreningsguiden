  - Föreningen ska äga eller arrendera lokalen eller anläggningen
  - Lokalen eller anläggningen ska vara bokningsbar för allmänheten eller användas för verksamhet som är öppen för allmänheten
  - Varje sökt kostnad ska verifieras så att det tydligt framgår vad stödet ska användas till
  - Ansökan för bidragsår 2026 ska lämnas senast 31 maj
  belopp: Högst 50 procent av godkända kostnader för den egna lokalen eller anläggningen
