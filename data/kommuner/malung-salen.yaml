bidrag:
- id: malung-salen-lokal-anlaggnings-och-driftsbidrag
  namn: Lokal-, anläggnings- och driftsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Är en ideell förening med styrelse och verksamhet förlagd till Malung-Sälens kommun
  - Är demokratiskt uppbyggd med allmännyttigt syfte och lagenlig verksamhet, och ger alla oavsett kön, etnisk tillhörighet,
    religion, sexuell läggning och funktionsvariation samma rättigheter, skyldigheter och möjligheter
  - Är öppen för alla som vill ansluta sig till föreningens stadgar, har en ansvarig styrelse och godkända stadgar
  - Lämnar in en kopia av intyg om organisationsnummer från Skatteverket en gång per år vid ansökan
  - Håller en uppdaterad medlemslista med medlemmar som betalat beslutad medlemsavgift, och är registrerad med uppdaterade
    uppgifter i kommunens föreningsregister
  - Består av minst 10 medlemmar, varav minst 51 % ska vara skrivna i Malung-Sälens kommun
  - Balans- och resultaträkning för föregående år ska bifogas ansökan, och föreningen ska redovisa vad den gjort för att få
    in pengar till föreningen
  - Bidrag beviljas inte till bl.a. ekonomiska föreningar, politiska organisationer (utom partier representerade i kommunfullmäktige),
    fackliga organisationer, bostadsrättsföreningar/samfälligheter, fiber- eller vägföreningar, religiösa samfund, supporterklubbar,
    företagsbaserade korpidrottsföreningar eller kooperativa föreningar
  - Till ansökan ska verksamhetsplan, revisionsberättelse (från föregående år) och medlemsredovisning enligt GDPR bifogas
  - Bidraget avser föreningar som äger, hyr eller driver egen lokal/anläggning
  - Bidrag kan sökas för el-, värme- och vattenkostnader, sophämtning och försäkring
  - Föregående års resultaträkning ligger till grund för ansökan
  belopp: Bidrag utbetalas med högst 50 % av föreningens faktiska driftskostnader (el, värme, vatten, sophämtning, försäkring)
  sen_ansokan: Bidragsansökningar som inte inkommit inom angiven tidsram kommer inte att behandlas. Ofullständig ansökan som
    inte kompletteras inom 5 arbetsdagar avslås. Bidrag kan endast sökas för angiven tidsperiod och aldrig retroaktivt.
  kalla_url: https://malung-salen.se/kultur-och-fritid/foreningar-stod-och-stipendier
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
