  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan senast 1 november avser medel ur kommande budgetår. Redovisning ska lämnas senast 30 november året efter
    beslut.
  senast_verifierad: '2026-08-18'
- id: harryda-utvecklingsstod
  namn: Utvecklingsstöd
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  malgrupp: Föreningar som genomför utvecklingsprojekt (t.ex. ungdomsråd, nätverk, handledning)
