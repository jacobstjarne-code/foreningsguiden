- id: harryda-aktivitetsstod-deltagare
  namn: Aktivitetsstöd - deltagare
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med ledarledd gruppaktivitet för barn och ungdom 7–20 år, personer med funktionsvariationer (alla åldrar),
    eller pensionärer 65+ år
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska verka enligt demokratiska principer och aktivt motsätta sig våld, rasism och diskriminering
  - Föreningen ska ha antagna stadgar och årsmöte
  - Föreningen ska ha minst fyra möten per år (inklusive årsmöte) och styrelse med minst tre personer (ordförande, sekreterare,
    kassör)
  - Föreningen ska ha säte och bedriva verksamhet i Härryda kommun
  - Majoritet av medlemmarna ska vara bosatta i Härryda kommun
  - Föreningen ska ha registrerat bank-/plusgiro-konto i föreningens namn
  - Aktiviteterna rapporteras via närvaron kort i e-tjänsten Rbok
  - Max 30 deltagar-tillfällen per aktivitet räknas
  - En deltagar-tillfälle = en person en dag (flera aktiviteter samma dag räknas som ett)
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Det anslagna stödet fördelas mellan alla sökande föreningar utifrån deltagartillfällen och utjämningsfaktorer
  sen_ansokan: För sent inlämnade ansökningar behandlas inte.
  kalla_url: https://www.harryda.se/upplevaochgora/foreningar/stodtillideellaforeningar/reglerforstodtillideellaforeningar/aktivitetsstoddeltagare.4.446cba66182e9265b814f4c.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Det anslagna stödet fördelas mellan alla sökande föreningar och exakt föreningsbelopp kan därför inte anges i
    förväg. Ansökningsdatumen motsvarar Riksidrottsförbundets LOK-stöd.
  alder_min: 7
  alder_max: 20
  senast_verifierad: '2026-08-18'
- id: harryda-aktivitetsstod-arrangemang
  namn: Aktivitetsstöd - arrangemang
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar som arrangerar publika, icke-kommersiella aktiviteter för allmänheten
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Arrangemanget ska vara publikt och icke-kommersiellt
  - Ansökan ska lämnas in före arrangemanget genomförs
  - För bidrag över 5 000 kr krävs ansökan minst en månad före arrangemang
  - Redovisning av kostnader och närvaro ska lämnas inom två månader efter arrangemang, senast 31 december samma år
  - 'Ej bidragsberättigat: kommersiella arrangemang, interna föreningsaktiviteter, politiska evenemang eller tävlingar'
  - En ansvarig person ska vara närvarande vid arrangemanget
  - Relevanta marknadsföringsinsatser ska planeras och genomföras
  belopp: Max 10 000 kr per organisation och år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Utbetalning sker senast fyra veckor efter godkänd redovisning
  kalla_url: https://www.harryda.se/upplevaochgora/foreningar/stodtillideellaforeningar/reglerforstodtillideellaforeningar/aktivitetsstodarrangemang.4.446cba66182e9265b814f77.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kostnadsstöd för arrangemang (t.ex. honorärer, resor, lokal). Prioritering för arrangemang med barn-/ungdomsdeltagare,
    samverkan, unikt samhällsvärde och deltagar-medverkan.
  senast_verifierad: '2026-08-18'
- id: harryda-fobjudring-lokal-anlaggning
  namn: Stöd till förbättring av lokal eller anläggning
  kategori:
  - idrott
  - kultur
  - ovrig
