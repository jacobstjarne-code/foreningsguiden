- id: harryda-aktivitetsstod-deltagare
  namn: Aktivitetsstöd - deltagare
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med ledarledd gruppaktivitet för barn och ungdom 7–20 år, personer med funktionsvariationer (alla åldrar),
    eller pensionärer 65+ år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska verka enligt demokratiska principer och aktivt motsätta sig våld, rasism och diskriminering
  - Föreningen ska ha antagna stadgar och årsmöte
  - Föreningen ska ha minst fyra möten per år (inklusive årsmöte) och styrelse med minst tre personer (ordförande, sekreterare,
    kassör)
  - Föreningen ska ha säte och bedriva verksamhet i Härryda kommun
  - Majoritet av medlemmarna ska vara bosatta i Härryda kommun
  - Föreningen ska ha registrerat bank-/plusgiro-konto i föreningens namn
  - Aktiviteterna rapporteras via närvaron kort i e-tjänsten Rbok
  - Max 30 deltagar-tillfällen per aktivitet räknas
  - En deltagar-tillfälle = en person en dag (flera aktiviteter samma dag räknas som ett)
  belopp: null
  sen_ansokan: Ej angiven
  kalla_url: https://www.harryda.se/upplevaochgora/foreningar/stodtillideellaforeningar/reglerforstodtillideellaforeningar/aktivitetsstoddeltagare.4.446cba66182e9265b814f4c.html
  belopp_status: overifierat
