  krav:
  - Insatsen ska vara nyskapande utveckling av föreningens verksamhet, exempelvis ny verksamhet, nya målgrupper eller innovativa samarbeten
  - Ansökan ska innehålla projektbeskrivning med mål, syfte, aktiviteter, tidplan och budget
  - Ansökan ska redovisa vilka andra organisationer som medel har sökts och/eller beviljats hos
  - Projektet ska ha en rimlig plan för hur utvecklingsinsatsen integreras i föreningens verksamhet efter projekttidens slut
