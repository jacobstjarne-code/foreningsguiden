  krav_fullstandiga: false
  anteckning: Totalt tilldelat stöd (15 prisbasbelopp från 2026) fördelas bland alla godkända föreningar. Exakta belopp kan
    inte förutses. Motsvarar Riksidrottsförbundets LOK-stöddatum (25 feb, 25 aug).
  alder_min: 7
  alder_max: 20
  senast_verifierad: '2026-08-03'
