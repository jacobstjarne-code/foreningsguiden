  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet prioriterar bland annat ungas delaktighet, möten över generationer, digital inkludering och samarbete med
