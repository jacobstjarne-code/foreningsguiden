  krav:
  - Åtgärden ska behövas för att föreningen ska kunna utöva sin verksamhet; vanligt underhåll beviljas inte stöd
  - Tillgänglighetsanpassningar och energieffektiviserande åtgärder prioriteras
  - Föreningen ska ha god medfinansiering genom pengar och/eller ideellt arbete
  - Insatsen bör inte ha påbörjats innan föreningen har sökt och beviljats stöd
