- id: haparanda-lokalt-aktivitetsstod
  namn: Lokalt aktivitetsstöd
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar med verksamhet för barn och unga 5–25 år
  deadlines:
    typ: fasta
    datum: ['04-30']
  krav:
  - Föreningen ska vara ansluten till en riksorganisation och bedriva stödberättigad verksamhet för deltagare 5–25 år
  - Sammankomsten ska vara planerad, ledarledd och pågå i minst 45 minuter
  - Minst tre stödberättigade deltagare ska delta och ledaren ska vara minst 13 år och utsedd av föreningen
  - Närvaro ska registreras vid varje sammankomst och underlagen ska bevaras för kommunens kontroll
  - Fester, högtidsfiranden, offentliga arrangemang, överordnade organisationers möten, skolverksamhet och studiecirklar är inte stödberättigade
  - Ansökan ska avse föregående kalenderårs verksamhet och lämnas komplett tillsammans med de underlag kommunen begär
  belopp: 2,7 kr per deltagartillfälle för pojkar och 5,2 kr per deltagartillfälle för flickor
