- id: haparanda-samlingslokal
  namn: Driftbidrag till samlingslokal
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [hembygd, social, annat]
  malgrupp: Bygdegårdsföreningar eller motsvarande som driver samlingslokal utanför centralorten
  deadlines:
    typ: fasta
    datum: ['04-30']
  krav:
  - Sökanden ska vara en bygdegårdsförening eller motsvarande som äger lokalen eller har ett långsiktigt hyresavtal
  - Lokalen ska ligga utanför centralorten och föreningen ska ansvara för dess drift och underhåll
  - Föreningar utanför centralorten som saknar egen bygdegård ska kunna använda lokalen utan hyra för möten
  - Andra hyresgäster ska erbjudas en skälig hyra som täcker den faktiska kostnaden för uthyrningen
  - Endast verifierade kostnader för el, uppvärmning, hushållsavfall, vatten och avlopp samt försäkring är stödgrundande
  - Ansökan ska avse följande år och innehålla senaste justerade årsmötesprotokoll och revisionsberättelse
