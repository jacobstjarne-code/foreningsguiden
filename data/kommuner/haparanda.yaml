- id: haparanda-anstallningsstod
  namn: Kommunalt anställningsstöd
  kategori:
  - social
  - ovrig
  malgrupp: Föreningar som anställer person med lönebidrag från Arbetsförmedlingen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara verksam i Haparanda kommun
  - Kopia på anställningsavtal med arbetsbeskrivning samt Arbetsförmedlingens beslut om lönebidrag ska bifogas
  - En ansökan krävs per anställd om föreningen har fler än en person med lönebidrag
  - Högst två heltidstjänster per förening
  - Förändringar i anställningen ska omgående anmälas till kommunen
  belopp: Högst 2 000 kr per månad vid heltid
  sen_ansokan: Ansökan kan göras löpande
