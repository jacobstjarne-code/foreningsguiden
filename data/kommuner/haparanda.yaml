  - Boknings- och ordningsregler ska följas, förändrad verksamhet ska meddelas och avbokning ska ske minst sju dagar före bokad tid
  - Föreningen kan förlora den subventionerade taxan vid skuld, misskötsel eller brott mot demokrativillkoren
