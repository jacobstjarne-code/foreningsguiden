  krav:
  - Sökanden ska vara en ideell förening med säte och verksamhet i Haparanda
  - Investeringen ska avse utrustning, lokal eller anläggning som gagnar föreningens verksamhet eller kommuninvånarna, minskar klimatpåverkan eller höjer säkerheten
  - Normalt och periodiskt underhåll, löpande driftkostnader och personlig utrustning för enskilda utövare är inte stödgrundande
  - Föreningen ska lämna en beskrivning, kostnads- och finansieringsplan samt verifierbara underlag och finansiera minst 20 procent av nettokostnaden
