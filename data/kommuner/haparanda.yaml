- id: haparanda-sarskilt
  namn: Särskilt bidrag
  kategori:
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar som arrangerar offentliga fritids- och kulturarrangemang
  deadlines:
    typ: fasta
    datum:
    - 04-30
    - 09-30
  krav:
  - Ansökan minst två veckor före arrangemanget
  - Arrangemanget ska vara öppet för alla att delta vid, genomföras i Haparanda kommun under aktuellt kalenderår och marknadsföras
    på ett rimligt sätt
  - Det ska framgå att stöd utgår från Haparanda stad
  - Ges inte till ordinarie verksamhet, cuper, turneringar eller annan tävlingsverksamhet, eller till privatpersoner och företag
  belopp: Upp till 100 % av verifierade nettokostnader
