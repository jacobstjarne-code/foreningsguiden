  - Kunduppgifter och föreningshandlingar i Rbok ska vara aktuella och godkända och föreningen får inte ha obetalda skulder till kommunen
  - Säsongstider ska sökas i Rbok senast 31 juli; strötider kan bokas när kommunens fördelning är klar
