- id: haparanda-mindre-investeringar
  namn: Bidrag till mindre investeringar
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar med investeringsbehov
  deadlines:
    typ: fasta
    datum:
    - 04-30
    - 09-30
  krav:
  - Kan sökas av bidragsberättigad förening med hemvist i Haparanda
  - Gäller utrustning eller lokal/anläggning för föreningens verksamhet, eller åtgärder som minskar klimatpåverkan eller höjer
    säkerheten
  - Ges inte till löpande underhåll, löpande driftkostnader eller utrustning som används av enskild utövare
  - Högst en ansökan per förening och år
  belopp: Högst 50 000 kr och högst 80 % av investeringskostnaden
  sen_ansokan: För sent inkommen ansökan behandlas inte
