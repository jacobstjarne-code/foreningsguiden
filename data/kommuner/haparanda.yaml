- id: haparanda-subventionerad-foreningstaxa
  namn: Subventionerad föreningstaxa och träningstider
  status: aktiv
  kategori: [idrott, kultur, pensionar, funktionsratt, ovrig]
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade föreningar med säte i Haparanda som bokar kommunala lokaler och anläggningar
  deadlines:
