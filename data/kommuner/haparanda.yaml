  - Vid en ny anställning ska föreningen lämna anställningsavtal med arbetsbeskrivning och Arbetsförmedlingens beslut
  - En separat ansökan ska lämnas för varje anställd och förändringar i anställning eller stöd ska omedelbart meddelas kommunen
  - Stöd lämnas normalt för högst två heltidsanställningar per förening; undantag kräver särskild prövning
