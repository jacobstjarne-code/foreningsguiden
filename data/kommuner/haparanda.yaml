  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade föreningar som genomför offentliga kultur- och fritidsarrangemang i Haparanda
  deadlines:
    typ: fasta
    datum: ['04-30', '09-30']
  krav:
  - Sökanden ska vara en bidragsberättigad förening; privatpersoner och företag kan inte få stödet
  - Arrangemanget ska genomföras i Haparanda under aktuellt kalenderår, vara öppet för allmänheten och marknadsföras på ett rimligt sätt
  - Arrangemanget ska ligga utanför föreningens ordinarie verksamhet och främja ett varierat, tillgängligt och inkluderande kultur- eller fritidsutbud
  - Stöd lämnas inte till cuper, turneringar, annan tävlingsverksamhet eller redan genomförda arrangemang
  - Ansökan ska lämnas minst två veckor före arrangemanget och innehålla syfte, beskrivning, plats, marknadsföringsplan samt en detaljerad och realistisk budget med andra stöd
  - Kommunens stöd ska framgå av marknadsföringen och alla inkomster och kostnader ska kunna verifieras efter genomförandet
