- id: eda-barn-ungdom
  namn: Bidrag till föreningar med verksamhet för barn och ungdomar
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med barn- och ungdomsverksamhet
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska vara registrerad i kommunens föreningsregister
  - Föreningens huvudsakliga verksamhet ska rikta sig till barn och ungdomar i åldern 7–20 år
  - Föreningen ska ha minst 10 medlemmar i åldrarna 7–20 år som regelbundet deltar i verksamheten
  - Föreningen ska redovisa minst 15 aktiviteter per år (med ledare)
  - Av verksamhetsberättelsen ska det framgå att verksamheten riktar sig till barn, ungdomar och invandrare, motverkar bruk
    av droger, våld, rasism och tidig utslagning samt främjar jämställdhet mellan könen
  - Föreningen ska ha sin verksamhet och hemvist i Eda kommun och vara ansluten till en riksorganisation som får statsbidrag
    (eller godkännas efter särskild prövning av servicenämnden om den inte är ansluten)
  - Verksamheten ska bedrivas utifrån demokratiska grunder och vara öppen för alla som stöder föreningens ändamål och syften,
    vilket ska framgå av fastställda stadgar
  - Föreningen ska ha bedrivit verksamhet i minst 6 månader i Eda kommun
  - Föreningen ska årligen, direkt efter årsmötet, lämna in verksamhetsberättelse, resultaträkning, balansräkning, revisionsberättelse
    och årsmötesprotokoll samt uppgifter till föreningsregister
  belopp: 'Bidraget omfattar fem stödformer: Aktivitetsbidrag 35 kronor per sammankomst/aktivitet (minst fem deltagare utöver
    ledaren), Driftbidrag enligt fastställda bidragsschabloner för anläggningar/lokaler (Bilaga 1), Investeringsbidrag max
    10 000 kronor per år (mindre bidrag) eller efter särskild prövning för större belopp, Lönebidrag enligt Arbetsmarknadsverkets
    beslut om statligt stöd, och Utbildningsbidrag max 500 kronor per dag och deltagare för kursavgift.'
  sen_ansokan: 'Ansökningsdatum varierar per stödform: Aktivitetsbidrag senast 15 december för innevarande års verksamhet,
    Lönebidrag senast 31 januari, Utbildningsbidrag löpande under året, Investeringsbidrag (större belopp) i god tid inför
    kommunens budgetarbete.'
