- id: stromstad-folkhalsomedel
  namn: Folkhälsomedel
  status: aktiv
  kategori: [social, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Lokala organisationer med en utvecklingsinsats som stärker folkhälsan i Strömstads kommun
  deadlines:
    typ: fasta
    datum:
    - 09-10
  krav:
  - Insatsen ska ligga inom folkhälsoplanens prioriteringar jämlik hälsa, trygga och goda uppväxtvillkor eller goda levnadsvanor
  - Arbetet ska vara hälsofrämjande, förebyggande och befolkningsinriktat och får inte vara sökandens ordinarie verksamhet
  - Sökanden eller en annan verksamhet ska medfinansiera minst hälften; egen arbetstid får räknas
  - Medel betalas endast till organisationer med anknytning till eller aktivt samarbete med Strömstads kommun
  - Samverkan mellan minst två verksamheter eller aktörer bör ingå
  - Sökanden ska ha ett pågående rättighetsbaserat värdegrundsarbete och motverka diskriminering och trakasserier
  - Insatsen ska redovisas efter genomförandet och ansökan ska beskriva hur ett lyckat arbete kan fortsätta efter bidragstiden
