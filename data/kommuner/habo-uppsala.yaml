- id: habo-uppsala-uppdragsbidrag
  namn: Uppdragsbidrag
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Lokala föreningar och andra aktörer med kontinuerlig kultur- eller fritidsverksamhet
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Verksamheten ska komplettera, utöka eller ersätta kultur- eller fritidsverksamhet som bedrivs i kommunal eller annan regi
  - Verksamheten ska vara av intresse och till nytta för kommuninvånarna
  - Verksamheten ska vara utåtriktad och av stort värde för fler än de egna medlemmarna
  - Föreningen eller aktören ska teckna en överenskommelse med kommunen om uppdragets innehåll
  - Löpande uppdrag ska redovisas och följas upp årligen enligt överenskommelsen
