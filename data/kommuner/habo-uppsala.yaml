- id: habo-uppsala-projekt-publika-arrangemang
  namn: Projektbidrag för publika arrangemang
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar, organisationer och enskilda personer som ordnar ett kortare publikt arrangemang i Håbo kommun
  deadlines:
    typ: fasta
    datum: [02-01, 04-01, 10-01]
  krav:
  - Arrangemanget ska pågå under en kortare begränsad tid och inte återkomma oftare än en gång om året
  - Arrangemanget ska hålla god kvalitet, vara öppet för allmänheten och bidra till ett brett utbud
  - Arrangemanget ska ha anknytning till Håbo kommun eller kommunens invånare
  - Ansökan ska visa en hållbar finansiering och innehålla en plan för målgruppsarbete och marknadsföring
  - Arrangören ansvarar för säkerhet, nödvändiga tillstånd och försäkring
  - Projekt med huvudsakligen religiös, politisk eller kommersiell inriktning samt investeringar, stödgalor, utbildning och forskning får inte stöd
  - Bidraget ska redovisas senast en månad efter projektets slut och oanvända medel ska återbetalas
