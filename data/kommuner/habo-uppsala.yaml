  namn: Ungdomsbidrag
  kategori:
  - ovrig
  malgrupp: Ungdomar 12–18 år och föreningar/ungdomsgrupper med projekt för unga
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara 12–18 år
  - Sökande ska bo i Håbo kommun
  - Bidraget kan sökas av ungdomar i föreningar samt av ungdomar/ungdomsgrupper som inte är föreningsanknutna
  - Bidraget kan sökas för aktiviteter, projekt och arrangemang av och för barn och unga
  - Redovisning ska ske på särskild blankett senast en månad efter att projektet avslutats
  - Utbetalda pengar som inte använts i projektet ska återbetalas till kommunen
