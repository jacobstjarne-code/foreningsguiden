- id: habo-uppsala-verksamhet-publika-arrangemang
  namn: Verksamhetsbidrag för publika arrangemang
  foreningstyp: [idrott, kultur, hembygd, ungdom, annat]
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Ideella föreningar med återkommande publika arrangemang
  deadlines:
    typ: fasta
    datum:
    - 11-01
  krav:
  - Endast ideella organisationer med etablerad och kontinuerlig verksamhet kan söka
  - Verksamheten ska hålla god kvalitet och tillföra allmänheten ett brett utbud
  - Verksamheten ska vara öppen för allmänheten och präglas av allmänintresse
  - Verksamheten ska anordnas av en organisation med säte i Håbo kommun
  - Verksamheten ska vara av väsentlig betydelse för Håbo kommun
  - Verksamheten ska huvudsakligen gynna boende i Håbo kommun
  - Bidrag kan inte beviljas till investeringar i lokaler/utrustning, verksamhet med övervägande religiös eller politisk inriktning,
    stödgalor eller annan verksamhet för välgörande ändamål, verksamhet med huvudsakligt syfte att främja vinst inom kommersiell
    näringsverksamhet, verksamhet inom utbildning eller forskning, eller renodlad pedagogisk verksamhet
  - En kalkyl ska bifogas ansökan
  - Arrangören ansvarar för att arrangemangen är säkra, att nödvändiga tillstånd finns och att arrangemangen är försäkrade
