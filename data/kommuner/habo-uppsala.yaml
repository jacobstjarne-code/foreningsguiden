- id: habo-uppsala-projekt-publika-arrangemang
  namn: Projektbidrag för publika arrangemang
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Föreningar, organisationer och enskilda som ordnar publika arrangemang i Håbo
  deadlines:
    typ: fasta
    datum:
    - 02-01
    - 04-01
    - 10-01
  krav:
  - Kan sökas av organisationer (t.ex. ideell eller ekonomisk förening), enskilda personer eller grupp av enskilda personer
  - Arrangemanget ska hålla god kvalitet och tillföra allmänheten ett brett utbud
  - Arrangemanget ska vara öppet för allmänheten och präglas av allmänintresse
  - Arrangemanget ska ha anknytning till Håbo kommuns område eller till kommunens medlemmar
  - Arrangemanget ska följa kommunens allmänna bestämmelser om värdegrund
  - Bidrag kan inte beviljas till investeringar i lokaler/utrustning, projekt med övervägande religiös eller politisk inriktning,
    stödgalor eller annan verksamhet för välgörande ändamål, projekt med huvudsakligt syfte att främja vinst inom kommersiell
    näringsverksamhet, projekt inom utbildning eller forskning, eller renodlad pedagogisk verksamhet
  - Projektplan och ekonomisk plan ska bifogas ansökan
  - Arrangören ansvarar för att arrangemanget är säkert, att nödvändiga tillstånd finns och att arrangemanget är försäkrat
