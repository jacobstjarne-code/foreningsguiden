  - pensionar
  - funktionsratt
  malgrupp: Lokala föreningar och organisationer med verksamhet inom socialnämndens eller vård- och omsorgsnämndens område
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen eller organisationen ska vara lokal och bedriva verksamhet med anknytning till nämndens verksamhetsområde
  - Verksamheten ska innehålla fritidskvalitet, stöd- eller hjälpinsatser för Håbo kommuns invånare
