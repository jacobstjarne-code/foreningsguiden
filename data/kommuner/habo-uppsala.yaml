- id: habo-uppsala-aktivitetsbidrag
  namn: Aktivitetsbidrag
  foreningstyp: [idrott, friluft, ungdom, annat]
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med verksamhet för barn och unga 3–25 år
  deadlines:
    typ: fasta
    datum:
    - 03-01
  krav:
  - Föreningen ska ha verksamhet i Håbo kommun
  - Föreningen ska ha verksamhet som gynnar boende i Håbo kommun
  - Föreningen ska ha minst 5 medlemmar bosatta i Håbo kommun
  - Föreningen ska ha stadgar, en demokratiskt vald styrelse samt en revisor
  - Föreningen ska ha organisationsnummer, alternativt personnummer för firmatecknare
  - Föreningen ska bedriva ideell verksamhet
  - Föreningen ska vara ansluten till riksorganisation om sådan finns (undantag kan medges efter särskild prövning av nämnd)
  - Föreningens medlemmar och verksamhet ska vara försäkrade, antingen genom anslutning till riksförbund eller på annat sätt
  - Minst 5 medlemmar i åldern 3–25 år, varav minst 5 boende i Håbo kommun
  - Medlemsförteckning uppdelad i åldersgrupperna 3–12, 13–20 och 21–25 år
  - Medlemsavgift på minst 50 kronor per år för deltagare i verksamheten
  - Godkänd gruppaktivitet ska ha minst 3 deltagare i åldern 3–25 år samt pågå minst 60 minuter med gemensam samling och avslutning
  - Ledaren för gruppaktiviteten ska ha fyllt 13 år och får inte ansvara för flera gruppaktiviteter samtidigt
  - Deltagare får endast ingå i en gruppaktivitet per dag och ska vara medlem i den förening som bedriver aktiviteten (undantag
    vid rekrytering)
  - Närvaro ska registreras vid varje sammankomst och ledaren ska vara närvarande under hela sammankomsten
  - Aktivitetsbidrag kan inte sökas för lovverksamhet
  belopp: Belopp per redovisat deltagartillfälle; ersättningsnivån beslutas årligen av kommunen
