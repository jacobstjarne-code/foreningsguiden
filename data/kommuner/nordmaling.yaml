- id: nordmaling-ovrigt
  namn: Övrigt föreningsstöd
  kategori:
  - ovrig
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Ideella föreningar som av någon anledning inte uppfyller kommunens ordinarie krav (t.ex. saknar säte i Nordmalings kommun
    men har anknytning till kommunen och dess medborgare, saknar idag lokal organisation i kommunen men vill starta en, eller
    söker för verksamhet som inte täcks av kategorierna i reglerna eller utanför ordinarie bidragsperiod) har rätt att få
    sin ansökan prövad av kommunstyrelsen
  - Ansökan ska innehålla uppgift om vad bidraget avser, bidragets betydelse för föreningens verksamhetsutveckling, sökt belopp
    och övrig finansiering, hur bidraget bidrar till kommunens mål för föreningslivet, årsbokslut samt verksamhetsberättelse
  - Efter genomförandet ska föreningen redovisa hur stödet använts, vilket resultat det gett och styrka kostnaderna med fakturor
