- id: nordmaling-investeringsbidrag-samlingslokaler
  namn: Investeringsbidrag för allmänna samlingslokaler
  kategori:
  - ovrig
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara aktiebolag, stiftelse eller förening som arbetar utan vinstsyfte
  - Sökande ska vara fristående från kommunen och från kommunala företag
  - Sökande ska äga lokalen eller ha ett långsiktigt nyttjanderättsavtal
  - Lokalen ska vara en allmän samlingslokal som ägs eller disponeras av ideella organisationer och är öppen och tillgänglig
    för föreningslivets möten, studieverksamhet, kulturell verksamhet, förströelse eller fritidssysselsättning
  - Det ska finnas ett varaktigt behov av lokalen på orten, och lokalen ska hålla rimlig standard samt ha goda ekonomiska
    förutsättningar för drift och förvaltning
  - En förutsättning för kommunalt stöd är normalt att sökande även beviljats stöd från Boverket, Jordbruksverket eller annat
    projekt som kräver offentlig medfinansiering; i annat fall kan kommunen ändå pröva ansökan enligt reglementets §3
  - Projektet får inte påbörjas innan beslut om bidrag fattats, om inte synnerliga skäl föreligger
  - Det kommunala bidraget motsvarar minst 30 procent av det bidragsunderlag som berättigar till det statliga bidraget, dock
    maximalt 200 000 kr, och medel måste finnas budgeterade
  belopp: Minst 30 procent av statligt stödberättigande bidragsunderlag, högst 200 000 kr
