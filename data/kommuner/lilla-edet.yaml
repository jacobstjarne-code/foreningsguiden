- namn: Utvecklings- och arrangemangsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Registrerade föreningar som genomför avgränsade utvecklingsinsatser, arrangemang eller investeringar
  deadlines:
    typ: fasta
    datum: [04-15, 10-15]
  krav:
  - Insatsen ska ligga utanför föreningens ordinarie verksamhet och vara ny, unik eller rikta sig till en ny målgrupp
  - Projektet får inte vara påbörjat innan kommunen har beviljat stödet
  - Ansökan ska beskriva syfte, målgrupp, genomförande, tidsplan, budget och annan sökt eller beviljad finansiering
  - Kommunen prioriterar insatser som stärker platsens varumärke, bidrar till ett gott samhälle eller bygger på innovation och samskapande
  - Projektet ska redovisas ekonomiskt och verksamhetsmässigt senast två månader efter avslut
  belopp: Högst 50 000 kr per förening och år för projekt, utveckling och arrangemang; högst 70 000 kr för större inköp eller investering
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan öppnar en månad före respektive sista ansökningsdag; kommunen fattar normalt beslut inom en månad.
  kalla_url: https://www.lillaedet.se/download/18.7e68bb2a19afce95ea32a4a/1765386561028/F%C3%B6reningsbidrag%20-%20Reviderade%20best%C3%A4mmelser%20%20nov25.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: En förening som får stöd till ett större inköp eller en investering kan inte få projekt-, utvecklings- eller arrangemangsbidrag samma år.
  id: lilla-edet-utvecklings-och-arrangemangsbidrag
  senast_verifierad: '2026-08-18'
