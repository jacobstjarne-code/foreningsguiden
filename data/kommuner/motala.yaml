  anteckning: 'KONFLIKT LÖST vid denna omkörning (se filhuvud): föregående version hade en olöst trevägskonflikt (15/2+15/8,
    25/2+25/8, 15/5). Både regelverket ''Riktlinjer för föreningsbidrag inom Verksamhet kultur och fritid'' (reviderat av
    Bildningsnämnden 2026-01-21, gäller från 2026-02-01) och den levande webbsidan (senast uppdaterad 2026-02-25) anger entydigt
    25 februari och 25 augusti. Ingen av de tidigare kandidatdatumen förekommer längre i någon källa.'
  krav_status: angivet
  krav_fullstandiga: false
