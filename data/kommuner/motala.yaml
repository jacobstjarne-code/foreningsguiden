- id: motala-social-frivilligt-arbete
  namn: Föreningsbidrag för föreningar/organisationer som bedriver frivilligt arbete inom det sociala området
  kategori:
  - social
  malgrupp: Lokal förening/organisation anknuten till en riksorganisation, med verksamhet för att förebygga sociala problem
    eller stödja medlemmar som utför samhälleliga uppdrag. Verksamheten ska huvudsakligen bedrivas i Motala kommun.
  deadlines:
    typ: fasta
    datum:
    - 09-30
  krav:
  - Ska ha varit verksam i minst ett år och ha minst 15 medlemmar
  - Ska vara demokratiskt uppbyggd med av årsmötet antagna stadgar, vald styrelse och valda revisorer
  - Ansökan (med ekonomisk berättelse, verksamhetsberättelse, årsmötesprotokoll, budget, verksamhetsplan, revisorsintyg m.m.)
    lämnas via e-tjänst under perioden 1–30 september och kräver e-signering av behörig styrelseledamot
  belopp: Grundersättning 2 000 kronor per förening plus 20 kronor per medlem (från medlem nummer 16), enligt kommunens webbplats.
    Verksamhetsbidrag kan ges med högst 25 procent av prisbasbeloppet till förening vars verksamhet syftar till att förbättra
    människors levnadsvillkor.
  sen_ansokan: Ansökan kan inte göras före eller efter perioden 1–30 september. Ansökan kan inte skickas in om inte alla obligatoriska
    bilagor är med.
  kalla_url: https://www.motala.se/uppleva-och-gora/foreningar-och-foreningsbidrag/foreningsbidrag-inom-det-sociala-omradet/
  anteckning: 'KONFLIKT (§2.5): Socialnämndens antagna regelverk (beslutat 2024-09-18, diarienummer 2024/00229, § 109) anger
    ''medlemsbidrag med 2 000 kr som grundbelopp per förening och därutöver 30 kr per medlem'' utan tröskel. Kommunens webbplats
    (senast uppdaterad 2025-03-13, nyare än regelverksbeslutet) anger istället ''2 000 kronor per förening plus 20 kronor
    per medlem, gäller från medlem nummer 16''. Webbplatsens värde används eftersom den är nyare, men osäkerheten noteras.
    Verksamhetsbidraget (25 procent av prisbasbeloppet) nämns bara på webbplatsen, inte i det granskade regelverket (SKRIVET_EJ_I_REGELVERK).
    Religiösa organisationer, studieförbund, ekonomiska/fackliga föreningar samt föreningar med väsentliga anslag från centralorganisation
    eller annan kommunal nämnd är uttryckligen undantagna. Mottagare av detta bidrag kan inte samtidigt få bidrag enligt pensionärs-/funktionsrättsregelverket
    nedan (motala-social-pensionar-funktionsratt), och vice versa.'
  krav_status: angivet
  krav_fullstandiga: false
  belopp_status: overifierat
  deadline_status: overifierat
  giltighet_status: overifierat
  senast_verifierad: '2026-08-03'
- id: motala-social-pensionar-funktionsratt
  namn: Föreningsbidrag för pensionärsföreningar och föreningar för personer med funktionsnedsättning
  kategori:
  - pensionar
  - funktionsratt
  malgrupp: Pensionärsföreningar och föreningar för personer med funktionsnedsättning, anslutna till en riksorganisation som
    erhåller statsbidrag från Socialstyrelsen, med socialt stödjande och hälsofrämjande arbete för dessa grupper och deras
    anhöriga
  deadlines:
    typ: fasta
    datum:
    - 09-30
  krav:
  - Ska ha varit verksam i minst ett år, ha minst 15 medlemmar och huvudsakligen bedriva verksamhet i Motala kommun
  - Ska vara demokratiskt uppbyggd med av årsmötet antagna stadgar, vald styrelse och valda revisorer
  - Ansökan (med ekonomisk berättelse, verksamhetsberättelse, årsmötesprotokoll, budget, verksamhetsplan, revisorsintyg m.m.)
    lämnas via e-tjänst under perioden 1–30 september och kräver e-signering av behörig styrelseledamot
  belopp: Grundbelopp 2 000 kronor (minst 15 medlemmar) per förening, plus ersättning per medlem — se anteckning om källkonflikt
    kring kronbeloppet per medlem.
  sen_ansokan: Ansökan kan inte göras före eller efter perioden 1–30 september. Ansökan kan inte skickas in om inte alla obligatoriska
    bilagor är med.
  kalla_url: https://www.motala.se/media/uploads/Riktlinjer-for-foreningsbidrag-pensionarsforeningar-och-foreningar-for-personer-med-funktionsnedsattning.pdf
  anteckning: SAKNADES HELT SOM EGET BIDRAG I FÖREGÅENDE VERSION — tillagd vid korrigerande omkörning 2026-07-20. Eget regelverk
    (Socialnämnden, beslutat 2024-09-18, diarienummer SN 2024/0088, § 108), separat diarienummer och paragraf från det generella
    sociala bidraget ovan, och de två bidragen är uttryckligen ömsesidigt uteslutande enligt båda regelverken. Regelverket
    anger 30 kr per medlem utan tröskel; kommunens sociala-området-webbsida ger en odifferentierad sammanfattning ('20 kr
    per medlem från medlem 16') som inte uttryckligen skiljer mellan detta bidrag och det generella sociala bidraget — samma
    konfliktbedömning som motala-social-frivilligt-arbete tillämpad här (§2.5, nyare källa/webbsida väger tyngre, men se osäkerhetsnot
    där). Om lokal förening tillhör en samorganisation kan samorganisationen söka och fördela bidraget. Religiösa organisationer,
    studieförbund, ekonomiska/fackliga föreningar samt föreningar med väsentliga anslag från centralorganisation eller annan
    kommunal nämnd är uttryckligen undantagna.
  krav_status: angivet
  krav_fullstandiga: false
  belopp_status: overifierat
  deadline_status: overifierat
  giltighet_status: overifierat
  senast_verifierad: '2026-08-03'
