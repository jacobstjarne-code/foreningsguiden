- id: ockelbo-allmankulturbidrag
  namn: Allmänkulturbidrag
  kategori:
  - kultur
  foreningstyp: [kultur, hembygd, annat]
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 05-30
    - 11-30
  krav:
  - Sökande ska vara en förening, stiftelse eller annan kulturorganisation som bedriver verksamhet inom exempelvis litteratur, musik, kulturarv, fotografering, scenkonst eller dans
  - Sökande ska arbeta efter antagna, demokratiska stadgar
  - Sökande som bedriver barn- och ungdomsverksamhet ska begära registerutdrag ur belastningsregistret för personer som arbetar
    i verksamheten
  - Sökande ska ha bankgiro, plusgiro eller bankkonto registrerat i organisationens namn
  - Bidraget ska sökas i god tid före angiven ansökningsperiod och betalas inte ut retroaktivt
  - Föreningar ska bedriva sin verksamhet och ha huvuddelen av sina medlemmar i Ockelbo kommun samt på sitt årsmöte ha valt
    styrelse och revisor
  - Kommunen tar inte emot ansökningar från företag eller från verksamhet som bedriver propaganda för extremism eller främlingsfientlighet
  belopp: Individuellt prövat bidrag till kultursatsningar och kulturevenemang; kommunen publicerar ingen generell nivå
