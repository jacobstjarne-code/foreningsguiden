  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen ska ha antagna, demokratiska stadgar som är godkända av riksorganisationen eller av kommunen
  - Föreningen ska bedriva sin verksamhet och ha huvuddelen av sina medlemmar inom Ockelbo kommun
  - Föreningen ska ha minst 10 betalande medlemmar som regelbundet deltar i verksamheten
  - Föreningen ska på sitt årsmöte ha valt styrelse och revisor
  - Föreningen ska vara registrerad hos Skatteverket och ha haft organisationsnummer i minst ett år
  - Ansökan görs av föreningens firmatecknare via e-tjänst med e-legitimation och ska bland annat innehålla stadgar, senaste
    årsmötesprotokoll (ej äldre än ett år), bokslut med revisions- och verksamhetsberättelse samt verksamhetsplan och budget
  - Föreningar med barn- och ungdomsverksamhet ska bifoga sin ANDTS-policy samt rutin för hantering av registerutdrag ur belastningsregistret
    för ledare
  - Bidraget söks i förväg och betalas inte ut retroaktivt
  - Föreningen ska ha bankgiro, plusgiro eller bankkonto registrerat i organisationens namn
