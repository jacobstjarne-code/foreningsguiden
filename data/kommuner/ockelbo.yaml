- id: ockelbo-sommarlovsaktiviteter-2026
  namn: Sommarlovsstöd 2026
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar och organisationer som ordnar kostnadsfria sommarlovsaktiviteter för barn 6–15 år
  deadlines:
    typ: fasta
    datum: [04-19]
  krav:
  - Sökande ska vara en förening eller organisation registrerad i Ockelbo kommun; organisationer utanför föreningsregistret ska kontakta kommunen före ansökan
  - Aktiviteten ska vara kostnadsfri och genomföras under sommarlovet 11 juni–19 augusti 2026 för barn 6–15 år
  - Aktiviteten ska ge stimulans och personlig utveckling samt vara öppen utan behovsprövning
  - Satsningen ska behandla barn lika, stimulera både flickors och pojkars deltagande, främja integration och skapa nya kontakter mellan barn med olika social bakgrund
  - Aktiviteter under minst fem dagar för flera deltagare prioriteras
  - Föreningen ska bekräfta genomförandet senast 4 maj, lämna aktivitetsdetaljer senast 13 maj och slutredovisa senast 30 september 2026
  belopp: Individuellt prövat bidrag som kan beviljas helt eller delvis; ingen generell nivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska vara kommunen tillhanda senast 19 april 2026
