  beskrivning: Ordinarie föreningsstöd kräver en ideell allmännyttig och demokratiskt styrd förening med verksamhet och huvuddelen av medlemmarna i Ockelbo, minst tio betalande aktiva medlemmar, organisationsnummer sedan minst ett år och konto i organisationens namn. Med ansökan lämnas aktuella stadgar, årsmötesprotokoll, bokslut, revision, verksamhetsberättelse, plan och budget. Kommunen publicerar ingen separat giltighetstid eller förnyelseregel för godkännandet.
