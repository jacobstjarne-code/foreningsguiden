- id: hogsby-lokalt-aktivitetsstod
  ansokningsvag: "En separat kommunal ansökan eller aktivitetsredovisning krävs via Rbok och Högsby kommuns Mina sidor; RF-rapporteringen räcker inte ensam."
  namn: Lokalt aktivitetsstöd
  kategori: [idrott, kultur, social, pensionar, ovrig]
  malgrupp: Föreningar och organisationer med organiserad verksamhet för barn och unga 7–25 år eller seniorer från 65 år
  deadlines:
    typ: fasta
    datum: [03-01, 09-01]
  krav:
  - Aktiviteten ska vara planerad och beslutad inom föreningens syfte, ledarledd och pågå minst 45 minuter
  - Sammankomsten ska ha minst tre stödberättigade deltagare; högst 20 deltagare ersätts per närvarande ledare
  - Deltagaren ska normalt vara medlem och närvaro med namn och födelsedata ska föras, intygas och sparas för kontroll
  - Samma grupp får stöd högst en gång per dag; entrébelagd eller kommersiell verksamhet, studiecirklar och aktivitet som ordnas av riksorganisation eller distrikt stöds inte
  belopp: 20 kronor per deltagartillfälle för barn och unga 7–25 år samt 5 kronor per deltagartillfälle för seniorer från 65 år
  sen_ansokan: Senast 1 mars för juli–december föregående år och 1 september för januari–juni; sena ansökningar behandlas inte
