  krav:
  - Åtgärden ska avse en enskild väg med statsbidrag och Trafikverket ska ha beviljat motsvarande särskilt stöd
  - Vägföreningen ska lämna Trafikverkets godkända besiktningsprotokoll innan kommunen betalar ut stödet
  - Vägen ska vara öppen för allmän trafik och föreningen ska uppfylla riktlinjens väghållaransvar
  - Bidrag lämnas inte för lantmäteriförrättning och högre kommunalt belopp kräver särskilt kommunstyrelsebeslut
  belopp: Den del av Trafikverkets bidragsgrundande kostnad inklusive moms som återstår efter det statliga stödet, normalt högst 200 000 kronor
  sen_ansokan: Den gemensamma e-tjänsten är öppen 1 mars–30 juni; utbetalning sker efter godkänt besiktningsprotokoll och i turordning om kommunens årsmedel är slut
