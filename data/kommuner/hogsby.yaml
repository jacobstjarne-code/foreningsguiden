  beskrivning: Föreningen ska ha huvuddelen av verksamheten i kommunen, vara registrerad hos Skatteverket och i kommunens register, ha eget organisationsnummer, minst tio stadigvarande medlemmar, godkända stadgar, årligt årsmöte, demokratiskt vald styrelse och revisorer samt normalt vara ansluten till riksorganisation där sådan finns.
