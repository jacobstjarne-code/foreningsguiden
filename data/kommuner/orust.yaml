forutsattningar:
- id: orust-arlig-registrering
  vad: Årlig registrering i kommunens föreningsregister
  beskrivning: Föreningen ska vara ideell, skriven och verksam i Orust, ha varit verksam minst ett år och ha minst tio aktiva betalande medlemmar. Vid registreringen lämnas organisationsnummer, konto, verksamhetsberättelse, ekonomisk redovisning och revisionsberättelse. Inget stöd betalas utan godkänd aktuell registrering.
  system: Orust självservice
  ledtid: null
  ledtid_text: Registrering senast 1 maj varje år
  giltighet: Ett kalenderår; förnyas genom årlig registrering senast 1 maj
  ordning: 1
  kalla_url: https://www.orust.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod
  giltighet_status: kontrollast
- id: orust-allmanna-villkor
  vad: Allmänna demokrati- och kontrollvillkor
  beskrivning: Föreningen ska vara ideell och demokratisk, om möjligt riksansluten, lämna riktiga uppgifter och spara stödgrundande handlingar i tio år. Barn- och ungdomsföreningar ska följa barnkonventionen och arbeta med nolltolerans mot alkohol och droger.
  system: Orust självservice
  ledtid: null
  ledtid_text: Kontrolleras vid registrering och ansökan
  giltighet: Gäller så länge föreningen söker eller tar emot kommunalt stöd
  ordning: 2
  kalla_url: *norm
  giltighet_status: kontrollast
