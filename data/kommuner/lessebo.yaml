    datum:
    - 04-30
  krav:
  - Kostnader ska styrkas med underlag, till exempel kvitton eller fakturor
  - Anläggningen eller lokalen ska vara godkänd av Kultur- och fritidsutskottet
  - Vid permanent hyra ska Kultur- och fritidsutskottet godkänna både förhyrningen och lokalkostnaden
  - Telefonkostnader, förbrukningsmaterial och löner för vaktmästare eller lokalvårdare ger inte rätt till stöd
  - Ansökan ska lämnas in senast 30 april med underlag för föregående års kostnader
  belopp: 'Egen lokal/anläggning: 75 procent av kostnader (arrende, el, vatten, sophämtning, försäkringar, uppvärmning), högst
