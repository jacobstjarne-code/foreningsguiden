- id: lessebo-aktivitetsstod
  namn: Lokalt aktivitetsstöd 5–25 år
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med aktiviteter för barn och unga 5–25 år eller personer med funktionsvariation
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Stöd utgår till lokalföreningar inom barn- och ungdomsorganisationer berättigade till statsbidrag, eller idrottsföreningar
    anslutna till Riksidrottsförbundet eller motsvarande statsunderstödd idrottsorganisation
  - 'Bidragsberättigad sammankomst: minst 3 deltagare 5–25 år eller personer med funktionsvariation, minst 45 minuter, beslutad
    och ekonomiskt planerad av styrelse, sektion eller medlemsmöte, genomförd av lokalavdelningen'
  - Endast en gång per dag och grupp, oavsett antal deltagare eller aktivitetens längd
  - Grupp får inte delas för att ge fler sammankomstbidrag
  - Inget stöd för entrébelagda tävlingar, kommersiella arrangemang, styrelsemöten eller studiecirkelsammankomster
  - Närvaro ska föras vid varje sammankomst och gruppledaren intyga att uppgifterna är riktiga
  - Gruppledaren ska vara närvarande och kan inte vara ledare för flera grupper under samma timme
  - Redovisning senast 25 februari och 25 augusti varje år; för sent inkommen ansökan ger inte rätt till bidrag
  belopp: 12 kronor per sammankomst och 3 kronor per medlemsaktivitet
  sen_ansokan: För sen ansökan ger inte rätt till bidrag
