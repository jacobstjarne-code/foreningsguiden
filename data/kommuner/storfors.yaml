  krav:
  - Vägen ska betjäna permanentboende, ligga i Storfors kommun och vara längre än 150 meter
  - Vägen ska underhållas tillfredsställande och hållas öppen för allmän trafik sommar och vinter; tillfällig stängning vid tjällossning är tillåten
  - Stöd ges inte till väg som betjänar fritidsbebyggelse, ägs av bolag, statlig eller kyrklig förvaltning eller huvudsakligen används för virkestransporter
  - Sökanden ska äga vägen eller företräda ägaren; flera ägare ska samordna ansökan så att samma väg inte söks dubbelt
  - Första ansökan eller ändrad väglängd ska innehålla karta med den sökta vägsträckan markerad
