  malgrupp: Ideella föreningar verksamma i Storfors kommun
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Bedriva ideell verksamhet inom Storfors kommun i drogfri miljö, vara uppbyggd enligt demokratiska principer och öppen
    för alla
  - Ha godkända stadgar, ansvarig styrelse och revisorer samt hålla årsmöte där verksamhetsberättelse, resultat- och balansräkning
    samt revisionsberättelse godkänns
  - Årligen redovisa sin verksamhet till kommunen samt meddela styrelsens aktuella telefonnummer och e-postadresser
  - Ha minst 10 medlemmar folkbokförda i kommunen som regelbundet deltar i föreningens verksamhet
  - Ha ett plus- eller bankgiro samt ett organisationsnummer
  - Låta minst en person från styrelsen närvara när kommunen kallar till möte
  - Föreningen får normalt inte vara ekonomisk, politisk, skolidrotts- eller elevförening, knuten till svenska kyrkan eller
    försvaret, eller en stödförening (supporterklubb)
  - Kan endast sökas av föreningar som inte kan söka aktivitetsbidrag
  - Ansökan för nästkommande budgetår ska lämnas senast 30 april och innehålla verksamhetsplan, verksamhetsberättelse, ekonomisk
    redovisning och revisionsrapport
  belopp: Maximalt 3 000 kronor per år
  sen_ansokan: Ej angivet i källan
