forvaltning: Kultur- och fritidsförvaltningen
ansokningssystem:
  namn: E-tjänster
  url: https://flen.se/uppleva--gora/foreningsliv
kalla_url: https://flen.se/uppleva--gora/foreningsliv
verifierad: '2026-08-02'
bidrag:
- id: flen-allmant-foreningsstod
  namn: Allmänt föreningsstöd
  kategori:
  - idrott
  - kultur
  - social
  - pensionar
  - ovrig
  malgrupp: Kultur- och fritidsföreningar, sociala föreningar, pensionärsföreningar samt föreningar som äger eller förvaltar
    samlingslokaler
  deadlines:
    typ: fasta
    datum:
    - 09-30
  krav:
  - Föreningen ska vara hemmahörande i eller bedriva verksamhet i Flens kommun, vara en ideell organisation med organisationsnummer
    och vara registrerad i kommunens föreningsregister
  - Föreningen ska vara medlem i förekommande riksorganisation och ha ett aktuellt medlemsregister
  - Föreningen ska vara öppen för medlemskap för kommunens invånare och ta ut medlemsavgift som bidrar ekonomiskt till föreningens
    ekonomi
  - Föreningen ska ha plus- eller bankgirokonto
  - Föreningen ska begära in begränsat registerutdrag för ledare med direkt eller regelbunden kontakt med barn och unga, upprepat
    vartannat år
  - Ansökan ska innehålla styrelsens/sektionernas sammansättning och antal aktiva medlemmar, verksamhetsberättelse, resultat-
    och balansräkning, revisionsberättelse samt verksamhetsplan för kommande stödperiod, med uppgifterna aktuella per 15 september
  belopp: Ingen fast belopps- eller beräkningsformel. Bidragets storlek bedöms sammanvägt utifrån verksamhetens omfattning
    (fler aktiva/aktiviteter för barn, unga och personer med funktionsnedsättning ger normalt mer stöd), jämförelse med andra
    liknande föreningar samt den totala bidragsram nämnden fastställer i den årliga budgetprocessen.
  sen_ansokan: Ej angivet i källan
  kalla_url: https://flen.se/download/18.29a8d06319a0f45825e9692e/1762767271318/Reglemente%20f%C3%B6r%20f%C3%B6reningsbidrag%20i%20Flens%20kommun.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan gäller nästkommande år eller annan överenskommen period. Reglementet (rev. 2025-11-03) bekräftar att
    ingen fast beloppsformel finns.
- id: flen-arrangemangsbidrag
  namn: Arrangemangsbidrag
  kategori:
  - kultur
  - idrott
  malgrupp: Föreningar för arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Evenemanget ska vara offentligt och bedömas ha allmänintresse
  - Ansökan ska vara inkommen senast en månad före evenemangets genomförande
  - 'Vid val av förlustgaranti (i stället för förbestämd summa utan redovisningskrav): intäkter och kostnader ska redovisas
    efter evenemanget'
  belopp: 'Bidrag utan redovisningskrav i efterhand: förbestämd summa beslutad av nämnden. Bidrag med förlustgaranti: maxbelopp
    för närvarande 7 000 kr enligt kommunens e-tjänst.'
  sen_ansokan: Möjlig löpande
  kalla_url: https://etjanster.flen.se/oversikt/overview/543
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunens reglemente (rev. 2025-11-03) benämner denna stödform 'Evenemangsstöd'. Maxbeloppet 7 000 kr för förlustgarantin
    är bekräftat i e-tjänsten (overview/543); reglementet självt anger inget kronbelopp.
- id: flen-investeringsbidrag
  namn: Investeringsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för lokalmiljöer
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara registrerad i Flens kommuns föreningsregister och i övrigt uppfylla grundvillkoren för föreningsstöd
    (ideell organisation med organisationsnummer, medlemsavgift, plus- eller bankgirokonto m.m.)
  - Bidraget avser delfinansiering av mindre investeringar i föreningsägd eller förvaltad anläggning, eller stöd till inköp
    av betydelsefull utrustning (stödformen omfattar även skador och oförutsedda kostnader)
  - Föreningen ska på kommunens begäran kunna ställa räkenskaper och övriga redovisningshandlingar till förfogande
  belopp: Ingen fast belopps- eller medfinansieringsandel anges i reglementet. Bidragets storlek beslutas av nämnden inom
    den bidragsram som fastställs i den årliga budgetprocessen.
  sen_ansokan: Bidraget kan sökas löpande under året enligt reglementet, ingen fast sista ansökningsdag.
  kalla_url: https://flen.se/download/18.29a8d06319a0f45825e9692e/1762767271318/Reglemente%20f%C3%B6r%20f%C3%B6reningsbidrag%20i%20Flens%20kommun.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunens reglemente (rev. 2025-11-03) kallar stödformen 'Bidrag till oförutsedda kostnader' och omfattar utöver
    investeringar även skador/oförutsedda kostnader och utrustningsinköp. Rättar tidigare overifierad fast deadline 31 december
    till löpande ansökan.
