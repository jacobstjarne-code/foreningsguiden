bidrag:
- id: flen-hyressubvention
  namn: Hyressubvention i kommunala lokaler
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Lokala föreningar som hyr kommunala lokaler för föreningsverksamhet
  deadlines: {typ: okand, datum: []}
  krav:
  - Föreningen ska vara en lokal ideell förening som är registrerad och godkänd enligt kommunens allmänna villkor
  - Bokningen ska avse föreningsverksamhet i en kommunal lokal eller anläggning som omfattas av kommunens uthyrningsregler
  - Föreningen ska följa lokalens boknings-, ordnings- och användningsvillkor och debiteras enligt rätt kundkategori
  - Avgiften bestäms av den lokal, tid och verksamhet som bokas enligt kommunfullmäktiges aktuella taxa
  belopp: Reducerad lokalhyra enligt kommunfullmäktiges aktuella taxa; lokal föreningsverksamhet där samtliga deltagare är under 20 år kan hyra vissa kommunala lokaler avgiftsfritt
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen gemensam sista ansökningsdag för hyressubventionen; lokalen bokas enligt respektive bokningsrutin.
  kalla_url: https://flen.se/download/18.7448a5c119e6366d9766cb38/1780910964654/Avgifter%20inom%20fritidsverksamhet%20och%20lokalhyror%20f%C3%B6r%20Flens%20kommun.pdf
