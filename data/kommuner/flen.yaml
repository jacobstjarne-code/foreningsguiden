- id: flen-bidrag-studieforbund
  namn: Bidrag till studieförbund
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Studieförbund med lokal folkbildningsverksamhet i Flens kommun
  deadlines: {typ: fasta, datum: [03-01]}
  krav:
  - Studieförbundet ska bedriva verksamhet i Flens kommun och lämna verksamhetsplan och budget senast den 1 mars
  - Verksamhetsberättelse, ekonomisk redovisning och kommunintyg ska lämnas senast den 1 maj
  - Ett distrikt som omfattar flera kommuner ska särredovisa verksamhet och ekonomi för Flens kommun
  - Fördelningsunderlaget omfattar studietimmar, unika deltagare, annan folkbildningsverksamhet och kulturprogram
  - Studieförbundet ska delta i obligatorisk muntlig redovisning genom Länsbildningsförbundet mellan augusti och december
  - Planering, genomförande och utvärdering ska kunna följas och kommunens medel får inte användas i andra kommuner
  - Försenade underlag medför att förbundet förlorar sin andel och kvarvarande medel fördelas om
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Nämnden fastställer ett årligt totalanslag som Länsbildningsförbundet fördelar proportionellt mellan studieförbunden; totalsumman publiceras inte
  sen_ansokan: Ansökan, verksamhetsplan och budget ska lämnas senast 1 mars; årsredovisningen ska lämnas senast 1 maj.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
