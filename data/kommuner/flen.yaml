- id: flen-allmant-foreningsstod
  namn: Allmänt föreningsstöd
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: *alla
  malgrupp: Kultur- och fritidsföreningar, sociala föreningar, pensionärsföreningar samt föreningar som äger eller förvaltar samlingslokaler
  deadlines: {typ: fasta, datum: [09-30]}
  krav:
  - Föreningen ska vara hemmahörande i eller bedriva verksamhet i Flens kommun, vara ideell, ha organisationsnummer och vara registrerad i kommunens föreningsregister
  - Föreningen ska vara medlem i förekommande riksorganisation, ha ett aktuellt medlemsregister, vara öppen för kommuninvånare och ta ut medlemsavgift
  - Ansökan ska lämnas av styrelsen och innehålla styrelsens eller sektionernas sammansättning, aktiva medlemmar, verksamhetsberättelse, resultat- och balansräkning, revisionsberättelse samt plan för stödperioden
  - Uppgifterna ska vara aktuella den 15 september och förening som äger eller förvaltar anläggning ska även redovisa driftkostnader och intäkter
  - Föreningen ska beskriva samverkan med andra föreningar och senast den 30 september skriftligen redovisa hur föregående stöd har använts
  - Verksamhet för barn och unga samt personer med funktionsnedsättning prioriteras i den samlade bedömningen
  belopp: Ingen fast belopps- eller beräkningsformel publiceras; nämnden gör en samlad bedömning av verksamhet, drift, ledarutveckling och tidigare kommunalt aktivitetsstöd inom årets budget
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska vara komplett senast 30 september för nästkommande år eller annan överenskommen period; sena ansökningar behandlas inte.
  kalla_url: *norm
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-18'
- id: flen-bidrag-oforutsedda-kostnader
  namn: Bidrag till oförutsedda kostnader
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med skada, oförutsedd kostnad eller mindre investeringsbehov
  deadlines: {typ: lopande, datum: []}
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor för föreningsstöd och vara registrerad i föreningsregistret
  - Stödet ska avse en skada eller oförutsedd kostnad, delfinansiering av en mindre investering i föreningsägd eller förvaltad anläggning eller inköp av betydelsefull utrustning
  - Föreningen ska kunna ställa räkenskaper och övriga redovisningshandlingar till kommunens förfogande
  - Samarbete med företag ska redovisas så att kommunen kan säkerställa att stödet används i föreningens verksamhet
  - Felaktigt eller oanvänt stöd kan återkrävas och framtida stöd kan stoppas
  belopp: Kommunen publicerar ingen fast nivå eller medfinansieringsandel; beloppet prövas inom den årliga bidragsramen
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Stödet kan sökas löpande under året; kommunen publicerar ingen fast sista ansökningsdag.
  kalla_url: *norm
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-18'
- id: flen-evenemangsstod
  namn: Evenemangsstöd
  status: aktiv
  kategori: [kultur, idrott, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som arrangerar offentliga evenemang
  deadlines: {typ: relativ, datum: []}
  krav:
  - Sökanden ska vara en förening som uppfyller kommunens allmänna villkor för föreningsstöd
  - Evenemanget ska vara offentligt och bedömas ha ett allmänintresse
  - Ansökan ska beskriva evenemanget och innehålla en realistisk kostnads- och intäktsbudget
  - Ansökan ska vara insänd senast en månad före evenemangets genomförande
  - Vid förlustgaranti ska föreningen redovisa evenemangets faktiska intäkter och kostnader efter genomförandet
  belopp: Antingen ett förbestämt bidrag eller en förlustgaranti; förlustgarantin är för närvarande högst 7 000 kr
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan måste vara insänd senast en månad före evenemanget.
