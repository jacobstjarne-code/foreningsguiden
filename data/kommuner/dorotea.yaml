  - kultur
  malgrupp: Föreningar för specifika projekt
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Kan sökas för ändamål som inte omfattas av övriga bidragsnormer och som främjar föreningens verksamhet
  - Verksamheten ska bedömas vara av sådan art att kommunens stöd bör utgå
  - Specificerad kostnadssammanställning samt verifikationer ska uppvisas och minst täcka det beviljade bidraget, annars är
    föreningen återbetalningsskyldig
  - Verksamheten/investeringen ska vara genomförd senast ett år efter beviljat bidrag, och verifikationer ska visas senast
    3 månader efter verksamhetens slut
  belopp: Prövas individuellt av kultur- och utbildningsnämnden från fall till fall; ansökningar under 300 kronor prövas inte
