bidrag:
- id: dorotea-kommunalt-aktivitetsstod
  namn: Kommunalt aktivitetsstöd
  kategori:
  - idrott
  - kultur
  malgrupp: Ideella föreningar för barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Deltagare i åldern 7–25 år (gäller den som under året fyller 7 respektive 25 år)
  - Grupp om minst 3 bidragsberättigade deltagare
  - Gruppaktiviteten ska vara planerad, ledarledd och pågå i minst 60 minuter (inklusive omklädning)
  - 'Ansökan lämnas två gånger per år: senast 25 februari (för perioden 1/7–31/12) och senast 25 augusti (för perioden 1/1–30/6)'
  belopp: 50 kronor per sammankomst
  sen_ansokan: Följ ansökningsperioder
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/kommunalt-aktivitetsstod/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: dorotea-statligt-aktivitetsstod
  namn: Statligt aktivitetsstöd
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för statligt finansierade aktiviteter
  deadlines:
    typ: fasta
    datum:
    - 02-15
    - 08-15
  krav:
  - Ledarledd gruppaktivitet med minst tre deltagare i åldern 7–20 år utöver ledaren
  - Sammankomsten ska vara genomförd av lokalavdelningen och vara minst 60 minuter
  - Bidrag utgår för maximalt 30 deltagare per sammankomst
  - Sammankomsten ska innehålla en gemensam samling med någon form av instruktion
  - Bidrag utgår inte till entrébelagda tävlingar eller kommersiella arrangemang
  - Närvarokort ska fyllas i vid varje sammankomst
  - Ansökan ska skrivas under av en av styrelsen utsedd firmatecknare
  - Ansökan lämnas senast 15 februari (höstens aktiviteter) respektive 15 augusti (vårens aktiviteter); för sent inlämnad
    ansökan ger inte rätt till bidrag
  belopp: Bidraget varierar från år till år
  sen_ansokan: Följ statens tidplaner
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/statligt-aktivitetsstod/
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: dorotea-kulturbidrag
  namn: Kulturbidrag
  kategori:
  - kultur
  malgrupp: Kulturföreningar för kulturell verksamhet
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidrag utgår till föreningar/organisationer inom Dorotea kommun
  - Ansökan ska innehålla styrkt redovisning av de kostnader föreningen haft för arrangemanget och eventuella intäkter
  belopp: Högst 90 % av nettokostnaden för ett arrangemang, sammantaget högst 15 000 kronor per förening och år
  sen_ansokan: Följ ansökningsperioder
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/kulturbidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: dorotea-ledarutbildning
  namn: Ledarutbildningsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningsrepresentanter för ledarskapsutbildning
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Den som går utbildningen ska vara minst 15 år
  - Den som går utbildningen ska verka aktivt som ledare inom föreningen
  - Bidrag utgår från och med endagskurser vilkas program omfattar minst 6 timmar
  - Samåkning krävs
  - Bidrag utgår ej för konferenser, kongresser, förbundsmöten eller liknande, och ej för anställd administratör eller instruktör
  belopp: 'Bidrag till kursavgift, logi och mat samt resekostnader (högst 16 kr/mil vid egen bil). Maxbelopp per år efter
    antal bidragsberättigade medlemmar: under 50 medlemmar 4000 kr, 51–100 medlemmar 4500 kr, 101–200 medlemmar 5000 kr, 201–300
    medlemmar 5500 kr, 301–400 medlemmar 6000 kr. Flersektionsföreningar får ytterligare 750 kronor per sektion och år.'
  sen_ansokan: Ansökan ska göras av föreningens huvudstyrelse senast en månad efter avslutad kurs
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/ledarutbildningsbidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: dorotea-lokalbidrag
  namn: Lokalbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för lokalhyra
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Ansvarig styrelse ska finnas och minst två styrelsesammanträden ska ha hållits under föregående verksamhetsår
  - Bidrag utgår inte till förening som på annat sätt genom kommunens budget tillhandahålls lokal eller erhåller bidrag till
    omkostnaderna
  - Bidrag utgår ej till hyreskostnader på Medborgarhuset eller till enstaka förhyrningar
  belopp: 80 % av godkänd kostnad, dock högst 15 000 kr/år för hyrd anläggning och högst 18 000 kr/år för egen anläggning.
    För övriga samlingslokaler 50 % av godkänd kostnad, dock högst 15 000 kr/år
  sen_ansokan: Följ ansökningsperioder
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/lokalbidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: dorotea-anlaggningsbidrag
  namn: Anläggningsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för anläggningsunderhål och investeringar
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Årsmöte samt minst två styrelsesammanträden ska ha hållits under föregående verksamhetsår
  - Protokollsbeslut på åtgärden ska finnas och inlämnas
  - Bidraget kan inte sökas av förening som på annat sätt genom kommunens budget erhåller ekonomiskt bidrag för täckande av
    drift- respektive hyreskostnad
  belopp: 'Bidrag enligt anläggningstyp: elljusspår 5000 kr/spår och år + 400 kr per påbörjad 500 meter (max 8000 kr), skidspår
    (max 1000 kr), isbanor (max 1000 kr), badplatser skötselbidrag (max 1500 kr), badplatser underhåll (max 3000 kr), skjutbanor
    (max 1500 kr), bollplaner grus (max 1000 kr), bollplaner gräs (max 3000 kr), tennisbanor asfalt (max 500 kr), tennisbanor
    stybbunderlag (max 2000 kr), motoranläggningar/banor besiktade/godkända (max 4000 kr), små slalombackar besiktade/godkända
    (max 1000 kr)'
  sen_ansokan: Följ ansökningsperioder
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/anlaggningsbidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: dorotea-specialbidrag
  namn: Särskilda bidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för specifika projekt
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Kan sökas för ändamål som inte omfattas av övriga bidragsnormer och som främjar föreningens verksamhet
  - Verksamheten ska bedömas vara av sådan art att kommunens stöd bör utgå
  - Specificerad kostnadssammanställning samt verifikationer ska uppvisas och minst täcka det beviljade bidraget, annars är
    föreningen återbetalningsskyldig
  - Verksamheten/investeringen ska vara genomförd senast ett år efter beviljat bidrag, och verifikationer ska visas senast
    3 månader efter verksamhetens slut
  belopp: Prövas individuellt av kultur- och utbildningsnämnden från fall till fall; ansökningar under 300 kronor prövas inte
  sen_ansokan: Möjlig löpande
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/sarskilda-bidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'T8a: Översiktssidan gav inte verifierbart belopp eller uttrycklig beloppsregel.'
- id: dorotea-bygdemedel
  namn: Bygdemedel
  kategori:
  - ovrig
  malgrupp: Föreningar och projekt för landsbygdsutveckling
  deadlines:
    typ: fasta
    datum:
    - 01-31
  krav:
  - Föreningen/organisationen ska själv finansiera med 10 procent kontanta medel
  - Så många som möjligt i bygden ska få ta del av bidraget
  - Föreningen måste ha organisationsnummer och vara inregistrerad i kommunens föreningsregister
  - Bygdemedel beviljas inte till driftskostnader, investeringar som kan kräva fortsatt bidrag, investeringar som kan orsaka
    stat eller kommun oförutsedda utgifter, eller kommersiell verksamhet
  belopp: Högst 90 % av faktiska, godkända och styrkta kostnader. Vid projekt över 30 000 kr kan förskott sökas med 33 %
  sen_ansokan: Enligt Länsstyrelsens tidplan
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/bygdemedel/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Nationell/regional finansiering
