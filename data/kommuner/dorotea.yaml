  namn: Kulturbidrag
  kategori:
  - kultur
  malgrupp: Kulturföreningar för kulturell verksamhet
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidrag utgår till föreningar/organisationer inom Dorotea kommun
  - Stödet avser ordinarie kulturell verksamhet eller offentliga program inom exempelvis teater, musik, dans, konst, föreläsningar, hembygdsvård eller kulturminnesvård
  - Ansökan ska innehålla styrkt redovisning av de kostnader föreningen haft för arrangemanget och eventuella intäkter
  belopp: Högst 90 % av nettokostnaden för ett arrangemang, sammantaget högst 15 000 kronor per förening och år
  sen_ansokan: Följ ansökningsperioder
  kalla_url: https://www.dorotea.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod/kulturbidrag/
