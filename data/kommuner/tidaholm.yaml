- id: tidaholm-studieforbundsbidrag
  namn: Kommunalt bidrag till studieförbund och RF-SISU
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, annat]
  malgrupp: Lokala studieförbundsenheter och RF-SISU vars riksorganisation får statsanslag genom Folkbildningsrådet
  deadlines:
    typ: fasta
    datum: [06-30, 12-15]
  krav:
  - Den lokala enhetens riksorganisation ska få statligt anslag som fördelas av Folkbildningsrådet
  - Grundbidrag söks med en skriftlig verksamhets- och utvärderingsplan senast den 15 december
  - Rörliga bidrag söks med verksamhetsberättelse, ekonomisk redovisning och undertecknade kommunintyg senast den 30 juni
  - Bidragsgrundande former är studiecirklar, kulturarrangemang och annan gruppverksamhet
  - Fördelningsunderlaget omfattar grupper, studietimmar, deltagare och genomförda kulturarrangemang
