- namn: Verksamhetsbidrag (aktivitetsstöd)
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Registrerade föreningar med deltagare 3–25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara registrerad hos kultur- och fritidsförvaltningen i Tidaholm
  - En sammankomst ska vara ledarledd, omfatta minst tre bidragsberättigade deltagare och pågå minst 45 minuter
  - Närvaro ska redovisas vid varje sammankomst på numrerat närvarokort, undertecknat av ansvarig ledare
  - Ansökan undertecknas av en av styrelsen utsedd firmatecknare
  - Senast 25/8 respektive 25/2 ska närvarokort, årsmötesprotokoll, verksamhetsberättelse (med resultat- och balansräkning)
    samt revisionsberättelse lämnas in
  belopp: 25 kr per godkänd sammankomst och 5 kr per godkänd deltagare (10 kr per deltagare berättigad till extra stöd, t.ex.
    parasport)
  sen_ansokan: För sent inkommen ansökan ger inte rätt till bidrag
  kalla_url: https://www.tidaholm.se/upplevaochgora/foreningslivochbidrag/bidragstodochstipendier.1218.html
