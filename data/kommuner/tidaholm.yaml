- id: tidaholm-utvecklingsbidrag
  namn: Utvecklingsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som utvecklar verksamhet eller förbättrar och förnyar anläggningar
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Ansökan ska lämnas via Rbok och vara kommunen tillhanda innan projektet startar
  - Projektet ska innebära förnyelse, förbättring eller utveckling och får inte avse löpande driftskostnader
  - Stöd kan avse barn- och ungdomsverksamhet, integration, mångfald, friskvård, tillgänglighet eller investering som minskar driftskostnader
  - Oförutsedda reparationer kan stödjas när föreningen inte ansvarar för skadan och skadan inte täcks av försäkring
  - Offert eller kalkyl och andra styrkande handlingar ska bifogas; ideella timmar ersätts inte
  belopp: Normalt 30 procent av beräknad projektkostnad, högst 50 000 kr per projekt
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska vara inne före projektstart
