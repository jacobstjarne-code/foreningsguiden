- id: tidaholm-stod-till-lokal-utveckling
  namn: Stöd till lokal utveckling (SLU) – Vindkraftpark Velinga
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Verksamma föreningar inom det utpekade området kring Vindkraftpark Velinga
  deadlines:
    typ: fasta
    datum: [12-31]
  krav:
  - Sökanden ska vara en verksam förening inom det geografiska området som kommunen markerat för stödet
  - Insatsen ska främja kultur, näringsliv, service eller en god livsmiljö och bidra positivt till områdets utveckling
  - Projekt, investeringar och gemensamma anläggningar ska följa Vattenfalls krav på hållbar utveckling och respekt för människor, natur och biologisk mångfald
  - Medel får bland annat stödja barn och unga, kulturarv, energiomställning, gemensam infrastruktur, säkerhet eller samarbete mellan byar
  - Medlen får inte bekosta alkohol och användningen ska följa svensk lag, mänskliga rättigheter och förbud mot diskriminering
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: 120 000 kr per år under vindkraftparkens livslängd
  sen_ansokan: Ansökan för 2027 ska lämnas via Rbok senast den 31 december 2026
  kalla_url: https://www.tidaholm.se/upplevaochgora/foreningslivochbidrag/bidragstodochstipendier.1218.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
- id: tidaholm-tillfalligt-foreningsbidrag-vindkraftsstod-2026
  namn: Tillfälligt föreningsbidrag finansierat av statligt vindkraftsstöd
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ideella föreningar i Tidaholms kommun med utvecklingsprojekt eller investeringar som genomförs senast 2027
  deadlines:
    typ: fasta
    datum: [10-01]
  krav:
  - Föreningen ska uppfylla de allmänna bestämmelserna i kultur- och fritidsnämndens riktlinje för bidrag till föreningslivet
  - Projektet eller investeringen ska bidra till utveckling och nytta för lokalsamhället och vara genomförd senast under 2027
  - Landsbygdsutveckling utanför centralorten prioriteras före andra ändamål
  - Ansökan ska lämnas innan projektstart och innehålla offert, kalkyl eller andra styrkande handlingar
  - Ideella timmar ersätts inte och endast en ansökan per förening får lämnas, men den kan omfatta flera projekt
  - Slutredovisning krävs; outnyttjade medel ska återbetalas
  belopp: Högst 350 000 kr per förening; 75 procent betalas ut i december 2026 och resterande del efter godkänd slutredovisning
  belopp_avser: per_forening
  kommunens_pott: null
