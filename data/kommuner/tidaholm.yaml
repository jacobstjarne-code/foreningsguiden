- id: tidaholm-anlaggningsbidrag
  namn: Anläggningsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som äger eller hyr och driver den lokal eller anläggning där huvudverksamheten bedrivs
  deadlines:
    typ: fasta
    datum: [10-15]
  krav:
  - Föreningen ska äga eller hyra och driva den lokal eller anläggning där den har sin huvudsakliga verksamhet
  - Ansökan ska innehålla verksamhetsberättelse, resultat- och balansräkning, revisionsberättelse samt redovisning av aktiva medlemmar och barn- och ungdomsverksamhet
  - Grundbidraget baseras på anläggningens storlek och funktioner samt verifierade kostnader för el, värme, bränsle, vatten, renhållning, försäkring, arrende eller hyra
  - Personalkostnader är inte bidragsgrundande
  - Skötselbidraget grundas på aktiva medlemmar 7–25 år och kan även prioritera folkhälsa, generationsmöten och inkludering av grupper långt från föreningslivet
  belopp: Individuellt beslutat grundbidrag och skötselbidrag utifrån anläggning, verifierade driftskostnader, aktiva medlemmar och verksamhet; ingen fast generell nivå publiceras
