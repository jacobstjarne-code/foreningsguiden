- id: tidaholm-verksamhetsbidrag-aktivitetsstod
  namn: Verksamhetsbidrag (aktivitetsstöd)
  status: aktiv
  kategori: [idrott, kultur, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Registrerade ideella föreningar med verksamhet för deltagare 3–25 år samt parasport utan övre åldersgräns
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Aktiviteten ska ligga i linje med föreningens barn- och ungdomsverksamhet, vara planerad och ledarledd samt pågå minst 45 minuter
  - Gruppen ska ha minst tre bidragsberättigade deltagare utöver ledaren och högst 30 deltagare; ledaren ska vara utsedd av föreningen och minst 13 år
  - Deltagare ska vara 3–25 år och aktivt delta; ledare 13–25 år räknas och organiserad parasport har ingen övre åldersgräns
  - Närvaro med aktivitet, plats, tider, namn, födelsedata och kön ska redovisas och undertecknas av ansvarig ledare
  - Studiecirklar, aktiviteter under skoltid, privat verksamhet och verksamhet som får annat statligt stöd är inte bidragsgrundande
  - Firmatecknare ska underteckna ansökan och begärda närvarokort och årshandlingar ska lämnas för kontroll
  belopp: 25 kr per godkänd sammankomst och 5 kr per godkänd deltagare; 10 kr per deltagare som är berättigad till extra stöd inom parasport
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Den 25 augusti gäller perioden januari–juni och den 25 februari perioden juli–december; för sent inkommen ansökan ger inte rätt till bidrag
  kalla_url: https://www.tidaholm.se/download/18.7079ce8d19e7385a1963835e/1780492424292/Regler%20f%C3%B6r%20verksamhetsbidrag.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
