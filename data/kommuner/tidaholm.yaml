  krav:
  - Verksamhetsberättelse, resultaträkning, balansräkning och revisionsberättelse redovisas i ansökan
  - Redovisning av medlemsantal (aktiva) samt barn- och ungdomsverksamhet
  - Grundbidrag kräver verifierade kostnader (el, värme, bränsle, vatten, renhållning, försäkringar, arrende/hyra) bifogade
    ansökan
  belopp: Bidraget består av grundbidrag (baserat på anläggningens storlek, funktioner och verifierade driftskostnader) och
    bidrag till skötsel (baserat på antal aktiva medlemmar 7–25 år). Inget fast belopp anges; storleken bedöms individuellt
