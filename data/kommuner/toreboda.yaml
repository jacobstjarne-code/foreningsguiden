- id: toreboda-folkhalsomedel
  namn: Bidrag ur folkhälsans budget
  status: aktiv
  kategori: [social, pensionar, funktionsratt, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar och frivilligorganisationer med en ny folkhälsofrämjande eller förebyggande insats för kommuninvånare
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
  - Sökanden ska vara en frivilligorganisation eller förening som bedriver verksamhet i Töreboda kommun och har organisationsnummer, styrelse, stadgar och medlemsregister
  - Projektet eller insatsen ska ligga utanför den ordinarie verksamheten, främja hälsa eller förebygga ohälsa och ligga i linje med det gemensamma folkhälsoarbetets verksamhetsplan
  - Insatser för jämlik hälsa och grupper som annars är svåra att nå prioriteras, och deltagandet ska vara kostnadsfritt
  - Ansökan ska beskriva bakgrund, syfte, målgrupp, metod, eventuell samverkan, möjlighet till fortsatt verksamhet och projektets totala budget inklusive egen och annan finansiering
  - Organisationen ska aktivt stå för demokratiska värderingar, ta avstånd från våld, rasism och droger samt bifoga stadgar, årsmötesprotokoll, föregående års ekonomiska handlingar, revision och firmateckningsunderlag
  - Ekonomisk redovisning och projektutvärdering ska lämnas senast två månader efter projektets slut
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: 108 000 kr att söka ur folkhälsans budget
