  krav:
  - Föreningen ska bedriva verksamhet i och för medlemmar folkbokförda i Smedjebackens kommun
  - Föreningen ska ha antagna stadgar, tillsatt styrelse, medlemsregister och organisationsnummer
  - Föreningen ska ha bankkonto, Plusgiro eller Bankgiro
  - Av stadgarna ska framgå att föreningen är demokratiskt uppbyggd, öppen för alla som stödjer föreningens syfte, och bedrivs
    i miljöer som präglas av demokratiska värderingar, jämställdhet och mångfald
  - Föreningen ska följa kommunens policy gällande dopingfria idrottsanläggningar
  - Föreningen ska årligen redovisa verksamhetsberättelse och ekonomisk redovisning till kommunen, inklusive uppgift om bidrag/stöd
    från andra aktörer
