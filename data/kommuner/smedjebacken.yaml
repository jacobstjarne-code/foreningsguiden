  krav:
  - Verksamheten ska vara stabil kulturverksamhet i Smedjebackens kommun som sträcker sig över hela året
  - Stödet grundas på bedömning av verksamhetsberättelse, balans- och resultaträkning för senast avslutade verksamhetsår samt
    på bedömning av kommande års verksamhetsplan
  - Mottagare av verksamhetsstöd kan inte, annat än i undantagsfall, beviljas stöd ur nämndens övriga stödformer
