- id: eslov-grundstod
  namn: Grundstöd
  kategori: [pensionar, funktionsratt]
  malgrupp: Ideella pensionärs- och funktionshindersföreningar med aktiva fullvärdiga medlemmar folkbokförda i Eslövs kommun.
  foreningstyp: [social]
  deadlines:
    typ: fasta
    datum: [02-01]
  krav:
  - Föreningen ska vara godkänd som stödberättigad i Rbok för det aktuella året
  - Endast aktiva fullvärdiga medlemmar folkbokförda i Eslövs kommun får räknas
  - Medlemsförteckningen ska styrka antalet stödberättigade medlemmar och bifogas ansökan
  - Föreningen får välja grundstöd eller lokalt aktivitetsstöd för samma verksamhetsår, inte båda
