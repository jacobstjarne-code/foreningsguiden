  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Förbrukningsmaterial, lös inredning och löpande driftkostnader omfattas inte.
  senast_verifierad: '2026-08-18'
- id: eslov-utvecklingsstod
  namn: Utvecklingsstöd
  kategori: [idrott, pensionar, funktionsratt, ovrig]
