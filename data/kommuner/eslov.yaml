  kalla_url: https://eslov.se/app/uploads/reviderade-riktlinjer-for-stod-till-kultur-och-foreningslivet-i-eslovs-kommun-att-galla-fran-1-juli-2026.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Beviljat stöd ska återrapporteras senast ett år efter beslutet.
  senast_verifierad: '2026-08-18'
- id: eslov-arrangemangsstod
  namn: Stöd till kulturarrangemang
  kategori: [kultur]
  malgrupp: Ideella kulturföreningar och kulturstiftelser utan vinstsyfte, med säte i Eslövs kommun.
  foreningstyp: [kultur, hembygd, ungdom, annat]
  deadlines:
    typ: fasta
    datum: [10-31]
  krav:
  - Sökanden ska vara en stödberättigad ideell förening eller stiftelse utan vinstsyfte och ha säte i Eslövs kommun
  - Arrangemanget ska vara offentligt, ha kulturinriktning och genomföras i Eslövs kommun eller efter undantag inom Biosfärområdet Storkriket
  - Stöd ges inte till interna, vinstdrivande, tydligt religiösa eller politiska arrangemang, investeringar, mat eller dryck
  - Beviljat stöd ska framgå i marknadsföringen och återrapporteras i Rbok
  belopp: Stödet fastställs efter bedömning av kvalitet, genomförbarhet och den samlade geografiska, genremässiga och målgruppsmässiga bredden; ingen generell nivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast 31 oktober året före arrangemanget.
  kalla_url: https://eslov.se/app/uploads/reviderade-riktlinjer-for-stod-till-kultur-och-foreningslivet-i-eslovs-kommun-att-galla-fran-1-juli-2026.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stöd ges i första hand till kulturinnehåll som arvoden, resor för kulturutövare, scenteknik, licenser och workshopmaterial.
  senast_verifierad: '2026-08-18'
- id: eslov-foreningar-pa-stan
