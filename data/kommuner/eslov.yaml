  - Väghållningen ska skötas av en vägsamfällighet, ideell förening eller ett kommunalt godkänt samarbete mellan väghållare
  - Den sammanlagda stödberättigade väglängden ska vara minst 400 meter och får inte avse enskilda fastigheters utfarter
