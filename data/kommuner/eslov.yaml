  - Minst två personer från föreningen ska delta i varje vandring
  - Vandringen ska genomföras under en komplett sex timmars kväll mellan klockan 18 och 24
  - Deltagarna ska synas ute och får inte agera eller ingripa i händelser
  - Föreningen ska lämna återrapportering efter avslutad vandring
  belopp: 1 000 kr per komplett sex timmars vandring
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Höstterminens ansökan 2026 var öppen 22 juni–30 augusti.
