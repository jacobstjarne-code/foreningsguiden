  kategori: [ovrig]
  malgrupp: Föreningar som vill bidra till kommunens trygghetsskapande arbete genom kvälls- och nattvandring i Eslöv.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines:
    typ: fasta
    datum: [08-30]
