  krav:
  - Föreningen ska ha fått lokalt aktivitetsstöd eller grundstöd under samma verksamhetsår
  - Föreningen ska äga anläggningen eller ha ett långsiktigt hyres- eller nyttjanderättsavtal
  - Lokalen eller anläggningen ska ligga i Eslövs kommun och vara godkänd av kultur- och fritidsförvaltningen före ansökan
  - Kostnader för redan subventionerade kommunala lokaler och entrébelagda arrangemang får inte tas med
  belopp: 30 procent av stödberättigad hyres- eller driftskostnad samt ersättning per redovisad sammankomst för föreningar med lokalt aktivitetsstöd
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: 1–7 dagar sent ger 10 procents avdrag, 8–14 dagar ger 20 procents avdrag och senare ansökningar behandlas inte.
  kalla_url: https://eslov.se/app/uploads/reviderade-riktlinjer-for-stod-till-kultur-och-foreningslivet-i-eslovs-kommun-att-galla-fran-1-juli-2026.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Värme, el, vatten, avlopp, arrende, sophämtning och lokalens försäkring kan ingå. Ridsport kan få förstärkt ersättning per sammankomst.
  senast_verifierad: '2026-08-18'
