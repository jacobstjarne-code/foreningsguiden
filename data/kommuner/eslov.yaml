  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Passiva medlemmar och stödmedlemmar är inte bidragsgrundande.
  senast_verifierad: '2026-08-18'
- id: eslov-lokalt-aktivitetsstod
  ansokningsvag: null
  namn: Lokalt aktivitetsstöd
  kategori: [idrott, pensionar, funktionsratt, ovrig]
  malgrupp: Stödberättigade föreningar med regelbundna ledarledda gruppaktiviteter för deltagare 6–25 år, deltagare 65+ eller personer med funktionsnedsättning.
  foreningstyp: [idrott, friluft, social, ungdom, annat]
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Aktiviteten ska vara planerad av föreningen, ledas av en medlem som fyller minst 13 år och pågå minst 45 minuter
  - Minst tre stödberättigade deltagare ska delta och högst 20 deltagare får räknas per ledare
  - Närvaro ska registreras digitalt och underlaget sparas i minst två år
  - Verksamheten ska bedrivas regelbundet under året och får inte enbart bestå av lovverksamhet, möten eller öppen verksamhet
  belopp: Fast stöd per ledarledd gruppaktivitet, extra ledarstöd vid minst två ledare samt deltagarstöd med nivå efter åldersgrupp
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: 1–7 dagar sent ger 10 procents avdrag, 8–14 dagar ger 20 procents avdrag och senare ansökningar behandlas inte.
  kalla_url: https://eslov.se/app/uploads/reviderade-riktlinjer-for-stod-till-kultur-och-foreningslivet-i-eslovs-kommun-att-galla-fran-1-juli-2026.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Februariansökan avser juli–december och augustiansökan avser januari–juni. Deltagare med funktionsnedsättning saknar övre åldersgräns.
  alder_min: 6
  alder_max: 25
  senast_verifierad: '2026-08-18'
- id: eslov-lokalkompensationsstod
  namn: Lokalkompensationsstöd
  kategori: [idrott, pensionar, funktionsratt, ovrig]
  malgrupp: Stödberättigade föreningar som äger eller långsiktigt driver en lokal eller anläggning som kommunen inte kan ersätta med ett lämpligt alternativ.
  foreningstyp: [idrott, friluft, social, ungdom, annat]
  deadlines:
    typ: fasta
