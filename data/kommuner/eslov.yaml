  deadlines:
    typ: fasta
    datum: [05-01, 11-01]
  krav:
  - Föreningen ska ha fått lokalt aktivitetsstöd under samma verksamhetsår
  - Satsningen ska utveckla föreningens verksamhet och ligga i linje med kommunens övergripande och fritidspolitiska mål
  - Ansökan ska beskriva projekt, syfte, målgrupp, tidsplan och budget inför ett dialogmöte med kommunen
