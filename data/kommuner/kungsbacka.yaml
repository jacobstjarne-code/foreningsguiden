  - id: kungsbacka-driftbidrag-samlingslokaler
    namn: Driftbidrag till samlingslokaler
    kategori:
      - ovrig
    malgrupp: >-
      Ideella organisationer, stiftelser eller föreningar som äger eller genom långsiktigt hyresavtal disponerar en
      allmän samlingslokal i Kungsbacka kommun (fristående lokal, minst 50 sittplatser, öppen för föreningslivets möten
      och allmänheten)
    deadlines:
      typ: fasta
      datum:
        - 10-30
    krav:
      - Lokalen ska vara fristående — inte inbyggd i eller del av en förenings-/klubblokal — och ha minst 50 sittplatser
      - Organisationen ska arbeta utan vinstsyfte och vara fristående från kommunen eller kommunala företag
      - >-
        Verksamhetsberättelse, ekonomisk redovisning, revisionsberättelse, årsmötesprotokoll, uppgifter till
        föreningsregistret samt redovisning av medlemsantal/uthyrningsfrekvens ska lämnas årligen utan påminnelse
      - >-
        Föreningen ska vara ideell, demokratiskt uppbyggd och bedriva verksamhet som kommer Kungsbackas invånare till
        del
      - Föreningen ska vara registrerad i kommunens system och lämna aktuella förenings- och ekonomihandlingar
      - Beviljat stöd ska användas för sökt ändamål och redovisas enligt kommunens regler
    belopp: >-
      Max 132 kronor per kvadratmeter (nivå för år 2015 enligt regelverket, ska räknas upp årligen i takt med kommunens
      övriga kostnadsutveckling — inget nyare publicerat belopp hittat i källan). Bidraget avser att täcka underskott i
      lokaldriften och överstiger normalt inte föreningens egna intäkter, kommunalt bidrag oräknat.
    sen_ansokan: >-
      Handlingar ska vara Service, Fastigheter tillhanda senast 2 månader efter årsmötet, dock senast 30 oktober året
      före det år ansökan avser
    kalla_url: >-
      https://kungsbacka.se/download/18.4028632d1864b8f9bc313428/1676898790110/Anl%C3%A4ggningsst%C3%B6d%20till%20samlingslokaler,%20hembygdsg%C3%A5rdar%20och%20liknande.pdf
    belopp_status: kontrollast
    deadline_status: kontrollast
    krav_status: kontrollast
    krav_fullstandiga: true
    anteckning: >-
      Ligger helt utanför sidträdet 'Stöd för föreningar' (som administreras av Kultur & Fritid) — administreras i
      stället av Service, Fastigheter, med eget regelverk beslutat av Kommunfullmäktige § 142, 2015-10-15. 14
      samlingslokaler (kommun- och föreningsägda, bl.a. bygdegårdsföreningarna i Tölö, Älvsåker, Fjärås, Löftadalen och
      Vallda samt Buera Byastugeförening) var bidragsberättigade vid regelverkets antagande.
    senast_verifierad: '2026-08-17'
    belopp_avser: per_forening
    kommunens_pott: null
    foreningstyp:
      - annat
