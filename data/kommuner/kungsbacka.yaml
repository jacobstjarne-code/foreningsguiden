    namn: Stöd till badföreningar
    kategori:
      - ovrig
    malgrupp: >-
      Ideella badföreningar som sköter en badplats av stort intresse för kommunens invånare och som är tillgänglig för
      alla
    deadlines:
      typ: fasta
      datum:
        - 11-30
    krav:
      - Badplatsen ska finnas med på kommunens lista över badplatser
      - Signerade årsmöteshandlingar ska bifogas ansökan
      - Kvitton som visar hur föregående års stöd använts ska bifogas
      - >-
        Föreningen ska vara ideell, demokratiskt uppbyggd och bedriva verksamhet som kommer Kungsbackas invånare till
        del
      - Föreningen ska vara registrerad i kommunens system och lämna aktuella förenings- och ekonomihandlingar
      - Beviljat stöd ska användas för sökt ändamål och redovisas enligt kommunens regler
    belopp: >-
      Stormskador upp till 30 000 kronor. Ytterligare stöd för upprustning eller utveckling av badplats kan beviljas om
      budget tillåter.
    sen_ansokan: Ej angivet i källan
