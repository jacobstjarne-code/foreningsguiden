  - id: kungsbacka-anlaggningsstod-samlingslokaler
    namn: Anläggningsstöd till samlingslokaler (underhåll, investering och engångsbidrag)
    kategori:
      - ovrig
    malgrupp: >-
      Föreningsägda allmänna samlingslokaler i Kungsbacka kommun med behov av underhållsåtgärder, ny-/om-/tillbyggnad
      eller standardhöjande åtgärder
    deadlines:
      typ: fasta
      datum:
        - 10-30
    krav:
      - Åtgärden ska bedömas som nödvändig eller lämplig ur byggnadsteknisk synvinkel av Service, Fastigheter
      - Föreningen ska själv finansiera minst 20 procent av kostnaden vid engångsbidrag
      - Investeringsbidrag förutsätter att Boverket redan beviljat statligt bidrag för samma åtgärd
      - Utbetalning sker i efterhand efter godkänd prestation
      - >-
        Föreningen ska vara ideell, demokratiskt uppbyggd och bedriva verksamhet som kommer Kungsbackas invånare till
        del
      - Föreningen ska vara registrerad i kommunens system och lämna aktuella förenings- och ekonomihandlingar
      - Beviljat stöd ska användas för sökt ändamål och redovisas enligt kommunens regler
    belopp: >-
      Tre delformer med olika tak: (1) Underhållsåtgärd — 50 procent av kostnaden upp till max 200 000 kronor per år,
      alternativt (om driftbidraget samtidigt reduceras med minst 50 procent) 100 procent upp till max 400 000 kronor
      per år. (2) Investeringsbidrag tillsammans med Boverket — kommunen bidrar med max 30 procent (staten 50 procent,
      föreningen 20 procent). (3) Engångsbidrag — max 500 000 kronor per år, sammanlagt för samtliga föreningar
      tillsammans.
    sen_ansokan: Ingen separat deadline angiven utöver den allmänna dokumentationsfristen 30 oktober året före
    kalla_url: >-
      https://kungsbacka.se/download/18.4028632d1864b8f9bc313428/1676898790110/Anl%C3%A4ggningsst%C3%B6d%20till%20samlingslokaler,%20hembygdsg%C3%A5rdar%20och%20liknande.pdf
    belopp_status: kontrollast
    deadline_status: kontrollast
    krav_status: kontrollast
    krav_fullstandiga: true
    anteckning: >-
      Tre administrativt sammanhängande, behovsprövade stödformer (regelverkets punkter 2.3.2–2.3.5) skrivna som EN post
      eftersom de delar ansökningsväg (direktkontakt med Service, Fastigheter) och saknar egna namngivna e-tjänster —
      till skillnad från driftbidraget ovan, som är en fast årlig formel och skrivet separat. Kommunen avsätter årligen
      en samlad budgetram på 2,5 miljoner kronor för underhålls-, investerings- och engångsbidrag samt administrativa
      kostnader (drift ingår inte i den ramen).
    senast_verifierad: '2026-08-17'
