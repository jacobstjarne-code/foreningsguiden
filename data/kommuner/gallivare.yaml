  - Verksamhetsberättelse, ekonomisk redovisning och revisionsberättelse för föregående år bifogas ansökan
  - Verksamhetsplan och budget för kommande år bifogas ansökan
  belopp: null
  sen_ansokan: Inget separat regelverk för sen ansökan är publicerat; ansökan ska ha inkommit senast 14 april (baserat på
    2025 års ansökningsomgång, kan variera enstaka dagar mellan år).
  kalla_url: https://gallivare.se/omsorg-och-stod/arkiv/nyheter/2025/2025-03-03-aktivitetsstod-for-2025
