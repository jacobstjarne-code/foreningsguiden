  anteckning: Ungdoms-, fritids- och kulturförvaltningen fördelar stöd (verksamhetsbidrag, aktivitetsstöd, anläggningsstöd,
    startbidrag) enligt kommunens allmänna föreningsbidrag-sida, men ett eget bidrag benämnt 'Fritids- och kulturbidrag' med
    ansökningsdatum 15 oktober kunde inte återfinnas i officiella källor. Kommunens faktiska belopps-, deadline- och kravregler
    för detta bidrag är fortsatt overifierade.
- id: gallivare-kulturstod
  namn: Kulturstöd
  kategori:
  - kultur
  malgrupp: Kulturarbetare och kulturföreningar
  deadlines:
    typ: fasta
    datum:
    - 12-15
  krav:
  - Förening, organisation eller kulturarbetare med allmänkulturell inriktning (konst, musik, dans, film, teater, foto, konsthantverk,
    kulturarv)
  - 'Förening/organisation: antagna stadgar, vald styrelse och egen kassaförvaltning. Kulturarbetare: registrerad med organisationsnummer
    och egen kassaförvaltning'
  - Sökande ska vara registrerad/verksam i Gällivare kommun
  - Bidrag lämnas med högst 75 % till barn- och ungdomsverksamhet (t.o.m. 20 år) och högst 25 % till vuxenverksamhet, och
    avser endast nettokostnader
  - Verksamheten/arrangemanget ska vara öppet för allmänheten, och Gällivare kommun ska framgå som medarrangör vid marknadsföring
  - Helårsverksamhet med varierat programutbud och ungdomsverksamhet prioriteras
  - Alkohol- och drogfrihet ska gälla vid ungdomsarrangemang
  - Verksamhetsberättelse och ekonomisk redovisning ska lämnas senast 1 maj
  belopp: null
  sen_ansokan: Inget separat regelverk för sen ansökan är publicerat i e-tjänsten; ansökan ska ha inkommit senast 15 december
    året före den bedrivna verksamheten.
  kalla_url: https://gallivare.enamnd.se/oversikt/overview/3361
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Inget kronbelopp anges; bidraget begränsas till högst 75 % (barn/ungdom) respektive 25 % (vuxen) av nettokostnaden,
    se krav. Ansöknings- och behörighetsregler verifierade via kommunens e-tjänst för årligt Kulturstöd.
