- id: arjang-verksamhetsstod-till-ungdomsforening
  namn: Verksamhetsstöd till ungdomsförening
  kategori: [idrott, kultur, ovrig]
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Godkända ungdomsföreningar med regelbunden verksamhet för 7–25-åringar
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - &ungdomsgrund Föreningen ska vara godkänd av kultur- och fritidsnämnden, ha demokratiska stadgar och vald styrelse samt normalt vara ansluten till en statsbidragsberättigad riksorganisation
  - &ungdomsverksamhet Föreningen ska ha minst tio registrerade medlemmar 7–25 år och genomföra minst tio stödberättigade ungdomssammankomster per år
  - &ungdomspolicy Föreningen ska ha en fungerande drogpolicy som kultur- och fritidsnämnden godkänt och bedriva verksamheten på demokratisk grund
  - &ungdomsarsdocs Ansökan ska vara beslutad av styrelsen, undertecknad av ordförande, kassör eller sekreterare och kompletteras med verksamhetsberättelse, årsmötesprotokoll, resultat- och balansräkning samt revisionsberättelse
  - Stödet beräknas efter antalet registrerade och avgiftsbetalande medlemmar 7–25 år under senast avslutade verksamhetsår
  belopp: 70 kr per medlem för medlem 1–100, 50 kr per medlem för medlem 101–250 och 30 kr per medlem därutöver
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan senast 31 mars och komplettering senast 31 maj; sen ansökan kan ge 50 procent och för sen komplettering ger inget stöd.
  kalla_url: &ungdomsnorm https://www.arjang.se/download/18.593d8dad18529d4d62442de6/1773133609965/Regler%20ungdomsf%C3%B6rening.pdf
  belopp_status: kontrollast
