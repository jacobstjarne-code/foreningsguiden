- id: arjang-verksamhetsstod-till-ovrig-forening
  namn: Verksamhetsstöd till övrig förening
  kategori: [kultur, social, funktionsratt, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar som inte är ungdoms- eller pensionärsföreningar
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - &ovriggrund Föreningen eller organisationen ska ha verksamhet i Årjäng, årsmötesantagna stadgar, vald styrelse och konto i organisationens namn
  - &ovrigformalia Ansökan ska vara beslutad av styrelsen och undertecknad av ordförande, kassör eller sekreterare; ekonomiska eller yrkesorganisationer, stödföreningar, politiska och militära föreningar samt paraplyorganisationer omfattas inte
  - &ovrigarsdocs Verksamhetsberättelse, årsmötesprotokoll, resultat- och balansräkning samt revisionsberättelse för senast avslutade verksamhetsår ska bifogas
  - Föreningen ska varken vara ungdomsförening eller pensionärsförening enligt kommunens övriga stödregler
  - Verksamhetens totala kostnader, inklusive eventuell hyra, ska styrkas med fakturor eller markerad huvudbok
  - Samma verksamhet får inte samtidigt få stöd från annan kommunal nämnd eller styrelse
  belopp: Individuellt prövat utifrån verksamhetens styrkta kostnader och kommunens årliga budget; ingen fast nivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan senast 31 mars och komplettering senast 31 maj; sen ansökan eller komplettering behandlas inte.
  kalla_url: &ovrignorm https://www.arjang.se/download/18.593d8dad18529d4d62442de7/1773133634365/Regler%20%C3%B6vriga%20f%C3%B6reningar.pdf
