- id: arjang-studieforbundsstod
  namn: Stöd till studieförbund
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Statsbidragsberättigade studieförbund med verksamhet i Årjäng
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - *ovriggrund
  - Studieförbundet ska vara verksamt i Årjäng och ingå i en riksorganisation som Folkbildningsrådet godkänt
  - Verksamhetsplanen ska särredovisa lokala studietimmar, kulturarrangemang och integrationsverksamhet i kommunen
  - Verksamhetsberättelse, ekonomisk redovisning och revisionsberättelse ska bifogas
  - Integrationsdelen ska avse verksamhet som integrerar och inkluderar nyanlända
  - Samma verksamhet får inte samtidigt få stöd från annan kommunal nämnd eller styrelse
  belopp: 10 kr per studietimme, där kulturarrangemang räknas som nio studietimmar; 22 kr per timme för studieförbund med kontor i Årjäng
  belopp_avser: per_forening
  kommunens_pott: 100 000 kr per år, varav 30 000 kr till integration och 70 000 kr till övrig studie- och kulturverksamhet
  sen_ansokan: Ansökan senast 31 mars och komplettering senast 31 maj; sen ansökan eller komplettering behandlas inte.
