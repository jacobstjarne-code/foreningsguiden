  krav_status: kontrollast
  krav_fullstandiga: true
  status: aktiv
  senast_verifierad: '2026-08-19'
  anteckning: null
- id: arjang-investeringsstod
  namn: Investeringsstöd till föreningsverksamhet
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *allatyper
  malgrupp: Ideella föreningar, allmännyttiga stiftelser och bolag som investerar i stödberättigad föreningsverksamhet
  deadlines:
    typ: okand
    datum: []
  krav:
  - Sökanden ska vara en ideell förening, allmännyttig stiftelse eller ett bolag som bedriver verksamhet som uppfyller kommunens föreningsstödsregler
  - Investeringen ska avse den egna verksamheten och utveckla eller förbättra en anläggning eller nödvändig utrustning
  - Ansökan ska beskriva investeringen, nyttan, kostnaden och finansieringen samt redovisa andra sökta eller beviljade stöd
  - Senaste årsredovisning och aktuella resultat- och balansuppgifter ska kunna lämnas; ritningar, kartor, offerter eller fakturor ska styrka projektet
  - Investeringen och kostnaderna ska följas upp enligt kommunens beslut
  belopp: Högst 30 procent av den godkända totala investeringskostnaden
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen generell ansökningsfrist i den gällande riktlinjen.
