  - Arbetsjournal, verifierade kostnader eller markerad huvudbok ska bifogas och nya anläggningar ska godkännas av kommunen
  belopp: 100 procent av godkända kostnader inom kommunens anläggningsschabloner, bland annat högst 30 000 kr för gräsplan, 90 000 kr för rid- eller travanläggning, 35 000 kr för samlingslokal, 25 000 kr för elljusspår och 400 000 kr för slalomanläggning
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan senast 31 mars och komplettering senast 31 maj; sen ansökan kan ge 50 procent och för sen komplettering ger inget stöd.
