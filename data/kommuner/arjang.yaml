- id: arjang-arrangemangsbidrag
  namn: Arrangemangsbidrag
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, hembygd, social, ungdom, annat]
  malgrupp: Ideella föreningar med säte i Årjäng som ordnar offentliga arrangemang i kommunen
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningen ska vara ideell, ha säte i Årjäng, organisationsnummer, konto i föreningens namn, stadgar och registrering i kommunens föreningsregister
  - Arrangemanget ska vara offentligt, genomföras i kommunen, främja människors lika värde och ha en ekonomiskt försvarbar plan; kulturarrangemang prioriteras
  - Ansökan ska ange arrangör, innehåll, tid, plats, kontaktperson, marknadsföring och fullständig budget
  - Kommunens stöd ska synliggöras och arrangemanget marknadsföras, bland annat i Visit Årjängs kalender
  - Egen lokalhyra, ideellt arbete, anställningskostnader, ränta, amortering, skulder, studieresor och planeringsfika är inte stödgrundande
  - Genomförande och ekonomi ska redovisas med underlag senast sex veckor efter arrangemanget
  belopp: Individuellt prövat; kommunen publicerar ingen fast nivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan kan lämnas hela året men ska vara kommunen tillhanda minst tre månader före arrangemanget.
  kalla_url: https://www.arjang.se/download/18.3a3421bb1969f7cfb0c71dd/1746693683355/Riktlinje%20f%C3%B6r%20arrangemangsbidrag.pdf
