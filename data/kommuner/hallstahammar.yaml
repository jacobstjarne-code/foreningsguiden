  krav:
  - Stadgar godkända av Hallstahammars kommun
  - Minst tio medlemmar som regelbundet deltar i verksamheten
  - Säte och huvudsaklig verksamhet i Hallstahammars kommun
  - Egen styrelse och kassaförvaltning
  - Arbeta efter demokratiska värdegrunder
  - Vara en ungdomsfostrande verksamhet
  - Arbeta aktivt mot droger och missbruk
  - Föreningen ska vara öppen för alla
  - Föra närvarolista för sammankomsterna och lämna in den vid ansökan
  - Kunna verifiera kostnader för utbildningar (kursprogram, kursintyg med mera) och lämna in dessa vid ansökan
  - Ansluten till en riksorganisation som erhåller statligt bidrag via MUCF eller Riksidrottsförbundet, alternativt godkänd
    som bidragsberättigad efter särskild prövning av kultur- och fritidsnämnden
  - Följa Riksidrottsförbundets regler för barnidrott "Idrotten vill"
  - Bidragsberättigad medlem är den som under året fyller lägst 6 och högst 20 år
  - Ansökan ska bifogas verksamhetsberättelse, ekonomisk berättelse (balans- och resultaträkning), revisionsberättelse, verksamhetsplan
    och budget
  - Ansökan ska vara inlämnad senast en månad efter föreningens årsmöte
