  krav:
  - Stadgar godkända av Hallstahammars kommun
  - Minst tio medlemmar som regelbundet deltar i verksamheten
  - Säte och huvudsaklig verksamhet i Hallstahammars kommun
  - Egen styrelse och kassaförvaltning
  - Arbeta efter demokratiska värdegrunder
  - Föreningen ska hyra, äga eller ansvara för drift av lokal eller anläggning som nyttjas minst tre gånger per vecka under
    säsong för verksamheten
  - Endast föreningar med särskilda behov av egna lokaler för sin verksamhet kan beviljas lokalkostnadsbidrag
  - Föreningen kan tidigast beviljas lokalkostnadsbidrag från och med sitt andra verksamhetsår
  - Förening som beviljats bidrag ska efter samråd med kultur- och fritidsnämnden upplåta lokalen till andra föreningar i
    den utsträckning nämnden beslutat
  - Bidrag beviljas inte för lokalkostnad vid arrangemang eller tävlingar som är entré- eller deltagaravgiftsbelagda, eller
    för kommersiella arrangemang som dans, basarer och bingo
  - Barn- och ungdomsföreningar ska årligen redovisa sina kostnader för anläggningen till kultur- och fritidsförvaltningen
  - Ansökan ska vara inlämnad senast en månad efter föreningens årsmöte
  belopp: Hyrd extern lokal subventioneras med 20 procent. I kommunal lokal betalar ungdomsförening 170 kr/kvm och år, pensionärs- och funktionsrättsförening 330 kr och vuxenförening 430 kr; särskilda timtaxor gäller hallar och anläggningar
