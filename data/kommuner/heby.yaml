- id: heby-socialt-foreningsstod
  namn: Föreningsstöd för socialt arbete
  status: aktiv
  kategori: [social, pensionar, funktionsratt, ovrig]
  foreningstyp: [social, annat]
  malgrupp: Föreningar vars insatser sammanfaller med och kompletterar vård- och omsorgsnämndens ansvarsområde
  deadlines:
    typ: fasta
    datum: [12-15]
  krav:
  - Verksamheten ska stötta eller aktivera personer i behov av stöd utifrån sin sociala situation och komplettera kommunens insatser
  - Förebyggande arbete mot förtryck och våld eller för bättre folkhälsa kan omfattas
  - Ansökan ska beskriva föreningen, målgrupper, mål, aktiviteter, medlemsantal, sökt belopp och hur föregående stöd har använts
  - Personalkostnader och andra sökta eller beviljade bidrag för föregående, pågående och kommande år ska redovisas
  - Budget, resultat- och balansrapporter, revision, verksamhetsplan och verksamhetsberättelse ska bifogas; ny förening lämnar även stadgar och bildandebeslut
  belopp: Individuellt prövat föreningsstöd inom vård- och omsorgsnämndens budget; ingen generell nivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan om stöd för 2026 skulle vara kommunen tillhanda senast 15 december 2025.
  kalla_url: https://www.heby.se/arkiv/nyheter/2025/2025-10-27-dags-att-soka-foreningsstod-fran-vard--och-omsorgsnamnden
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ett publicerat 2026-beslut visar att stödet fördelas inom en befintlig budget och kan avvika från föreningens sökta belopp.
  senast_verifierad: '2026-08-18'
- id: heby-nattvandringsbidrag
  namn: Nattvandringsbidrag
  status: aktiv
  kategori: [social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar som nattvandrar bland unga på kommunens bokningsbara kvällar
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska vara bidragsberättigad i Heby kommun och boka ett tillgängligt nattvandringstillfälle i Rbok
  - Nattvandrarna ska vara trygga vuxna som rör sig bland ungdomar och bidrar till lugn, relationer och trygghet
  - Samtliga blivande nattvandrare ska genomföra den digitala utbildning som tillhandahålls genom Nattvandring.nu
  - Nattvandringen genomförs normalt klockan 20.00–24.00 på anvisad ort och kväll enligt den praktiska informationen vid bokningen
  belopp: Ersättning per genomförd nattvandringsinsats; kommunen publicerar inte nivån på den öppna webbsidan
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar bokningsbara datum i Rbok men ingen generell sista ansökningsdag.
  kalla_url: https://www.heby.se/omsorg-och-stod/vill-du-engagera-dig/nattvandra-som-forening
  belopp_status: ingen_regel
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Insatsen medfinansieras av Sala sparbank och genomförs med försäkring och krishantering via Nattvandring.nu.
  senast_verifierad: '2026-08-18'
- id: heby-subventionerad-hallhyra
  namn: Subventionerad hallhyra för föreningar i Heby kommun
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Lokala föreningar som bokar kommunens sport- och träningshallar
  deadlines:
    typ: okand
    datum: []
  krav:
  - Bokningen ska göras i Rbok som förening i Heby kommun och avse en kommunal hall eller lokal
  - Ansvarig hyresgäst ska vara minst 18 år och lämna organisationsnummer, kontaktuppgifter och uppgift om aktiviteten
  - Större arrangemang, matcher och cuper samt eventuell kioskverksamhet ska anges i bokningsansökan
  - Föreningen ska följa regler om städning, utrustning, återbud och kommunens rätt att avboka tider vid tävlingar eller andra evenemang
  belopp: 2026 års föreningstaxa är 80–120 kr/timme för sport- och träningshallar samt 150 kr/timme för konferensrummet i Östervåla; externa föreningar och företag betalar 150–400 kr/timme
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen sista bokningsdag; ordinarie säsonger är september–december och januari–maj.
  kalla_url: https://www.heby.se/kultur-och-fritid/idrott-motion-och-lek/hallar-och-bokningar
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Den ekonomiska förmånen är den särskilda lägre taxan för lokala föreningar; privatpersoner och externa aktörer har egna högre taxor.
  senast_verifierad: '2026-08-18'
