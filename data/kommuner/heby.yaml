  - Sökanden ska vara en förening eller organisation med lokal eller anläggning i Heby kommun
  - Ansökan ska avse en planerad underhållsåtgärd, nybyggnad, tillbyggnad eller ombyggnad av lokalen eller anläggningen
  - Föreningen ska beskriva åtgärden och sitt behov av kommunalt ekonomiskt stöd
  belopp: Kommunen publicerar ingen generell beloppsnivå för underhållsstödet
  belopp_avser: per_forening
