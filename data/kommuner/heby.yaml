- id: heby-folkets-hus-avtalsstod
  namn: Avtalsstöd till Folkets Hus-föreningar
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Folkets Hus-föreningarna som driver anläggningarna i Heby, Tärnsjö och Östervåla
  deadlines:
