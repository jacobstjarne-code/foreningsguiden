- id: heby-evenemangsstod
  namn: Stöd för att arrangera evenemang
  kategori:
  - kultur
  - ovrig
  malgrupp: Föreningar och andra aktörer som arrangerar evenemang i Heby kommun
  deadlines:
    typ: okand
    datum: []
  krav:
  - Ansökan ska innehålla evenemangets namn, arrangörens namn, organisationsnummer, kontaktuppgifter, adress och kontonummer
    (bankgiro/plusgiro)
  - Ansökan ska ange datum för evenemanget, antal förväntade deltagare och en beskrivning av evenemanget
  - Ansökan ska ange sökt bidragsbelopp och information om andra finansieringskällor
  - Evenemanget måste läggas upp på kommunens webbplats upplevhebykommun.se
  belopp: null
  sen_ansokan: Enligt kommunens sida gäller för 2026 att ansökan öppnar 16 februari och sista ansökningsdag är 19 mars 2026,
    med besked under april. Kontrollera kommunens aktuella information för kommande år.
  kalla_url: https://www.heby.se/upplev/upplevhebykommun/arrangera-evenemang
  belopp_status: okand
  deadline_status: okand
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: heby-investeringsstod-samlingslokal
  namn: Investeringsstöd för samlingslokaler
  kategori:
  - ovrig
  malgrupp: Föreningar som driver samlingslokaler
  deadlines:
    typ: fasta
    datum:
    - 10-01
  krav:
  - Aktören ska vara berättigad att uppbära föreningsstöd enligt Riktlinje för föreningsstöd, oavsett om aktören har sökt
    sådant eller inte
  - Aktören ska beviljas stöd från Boverket eller annan part för att kommunen ska betala ut sitt bidrag
  - Minst 12 aktivitetstillfällen per år ska genomföras i lokalen
  - Om en förening söker ska den ha minst 10 aktiva medlemmar och ha funnits i Heby kommun i minst 6 månader
  - Stödet måste sökas i förskott och kan inte beviljas för redan utförda åtgärder
  - Stöd kan inte sökas för investering i inventarier, till exempel möbler och datorer
  belopp: Max ett belopp motsvarande två prisbasbelopp per ansökan. Högst tre bidrag betalas ut per år
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.heby.se/download/18.a6a93d718e57473bd0e648/1710945848483/HebyFS202318%20Riktlinje%20för%20investeringsstöd%20till%20samlingslokaler.pdf
