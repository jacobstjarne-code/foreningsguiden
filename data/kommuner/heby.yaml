- id: heby-foreningsstod
  namn: Föreningsstöd
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade idrotts-, intresse- och kulturföreningar med medlemmar i Heby kommun
  deadlines:
    typ: fasta
    datum: [10-01]
  krav:
  - Föreningen ska först vara årligen godkänd som bidragsberättigad och ha uppdaterat medlemsantal, styrelse och kunduppgifter i Rbok
  - Föreningen ska bedriva ideell, öppen och icke-vinstdriven verksamhet med hemvist i Heby kommun och ha varit verksam där minst ett år
  - Organisationsnummer, demokratiskt vald styrelse, godkända stadgar, verksamhetsberättelse, årsmötesprotokoll och ekonomisk redovisning krävs
  - Föreningen ska arbeta demokratiskt, jämställt och inkluderande samt mot våld, rasism, alkohol, tobak, dopning och andra droger
  - Barn- och ungdomsföreningar ska följa barnkonventionen och ha policy för delaktighet, tillbud, ledarutbildning och utdrag ur belastningsregistret
  - Stödet bedöms efter planerad verksamhet, verksamhet för barn och unga upp till 20 år samt lokal- och anläggningskostnader, med ytterligare kriterier per föreningstyp
  belopp: Individuellt bedömt verksamhetsstöd efter publicerade verksamhets-, medlems-, aktivitets- och lokalkriterier; ingen generell kronnivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan är öppen 15 augusti–1 oktober. Ansökan 2–15 oktober minskas med 50 procent och 16–31 oktober med 75 procent; från 1 november behandlas den inte.
  kalla_url: https://www.heby.se/download/18.1747aaaf184b40179e8625ad/1781256412060/Riktlinjer%20f%C3%B6r%20f%C3%B6reningsst%C3%B6d%20i%20Heby%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunens ordinarie ansökan är en sammanhållen stödform där planerad verksamhet, aktiviteter och lokal- eller anläggningskostnader bedöms gemensamt.
  senast_verifierad: '2026-08-18'
- id: heby-evenemangsstod
  namn: Evenemangsstöd 2026
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som arrangerar lokala evenemang i Heby kommun
  deadlines:
    typ: fasta
    datum: [03-19]
  krav:
  - Evenemanget ska genomföras i Heby kommun och stärka sammanhållning, entreprenörskap eller kommunens attraktivitet för invånare och besökare
  - Ansökan ska ange arrangör, organisationsnummer, kontakt- och kontouppgifter, evenemangsdatum, beskrivning och förväntat deltagarantal
  - Sökt belopp och andra finansieringskällor ska redovisas
  - Kommunen bedömer antal som gynnas, ideellt engagemang, marknadsföring, samarbete, prioriterade målgrupper, ekologisk hållbarhet och utvecklingspotential
  - Evenemanget ska publiceras i kommunens evenemangskalender på upplevhebykommun.se och beviljat stöd följs upp under hösten
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: 100 000 kr per år, fördelat mellan lokala evenemang
  sen_ansokan: Ansökan för 2026 var öppen 16 februari–19 mars och beslut fattades i april.
  kalla_url: https://www.heby.se/arkiv/nyheter/2026/2026-02-02-dags-att-satta-heby-kommun-pa-kartan-ansok-om-evenemangsstod-2026
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet är även öppet för företag men den här posten beskriver den uttryckligen föreningsberättigade grenen. Enskilda personer anges inte som sökande.
  senast_verifierad: '2026-08-18'
- id: heby-investeringsstod-samlingslokal
  namn: Investeringsstöd för samlingslokaler
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, hembygd, social, annat]
  malgrupp: Föreningar som driver samlingslokaler
  deadlines:
    typ: fasta
    datum: [10-01]
  krav:
  - Aktören ska uppfylla kraven för kommunalt föreningsstöd, även om den inte har sökt det ordinarie stödet
  - Aktören ska beviljas stöd från Boverket eller annan part för att kommunen ska betala ut sitt bidrag
  - Minst 12 aktivitetstillfällen per år ska genomföras i lokalen
  - Om en förening söker ska den ha minst 10 aktiva medlemmar och ha funnits i Heby kommun i minst 6 månader
  - Stödet måste sökas i förskott och kan inte beviljas för redan utförda åtgärder
  - Stöd kan inte sökas för investering i inventarier, till exempel möbler och datorer
  - Ansökan ska ange åtgärd, verksamhetstillfällen, medlemsantal, kostnadskalkyl, sökt belopp och fullständiga organisations- och kontaktuppgifter
  - Genomförandet ska kostnadsredovisas med kvitton och fakturor och kunna visas upp på plats
  belopp: Högst två prisbasbelopp per ansökan och högst tre beviljade stöd per år
  belopp_avser: per_forening
  kommunens_pott: Kommunen meddelar senast 1 september om stöd kan sökas och hur stor årets samlade ram är
  sen_ansokan: Ansökan ska lämnas senast 1 oktober innan åtgärden har genomförts.
  kalla_url: https://www.heby.se/download/18.a6a93d718e57473bd0e648/1710945848483/HebyFS202318%20Riktlinje%20för%20investeringsstöd%20till%20samlingslokaler.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Vid fler än tre ansökningar prioriteras aktörer med flest medlemmar och aktivitetstillfällen samt aktörer som inte tidigare har fått investeringsstöd.
  senast_verifierad: '2026-08-18'
- id: heby-driftbidrag-kommunala-idrottsanlaggningar
  namn: Driftbidrag enligt avtal för kommunala idrottsanläggningar
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott]
  malgrupp: Heby AIF, Morgongåva SK, Tärnsjö IF och Östervåla IF med driftavtal för kommunala idrottsplatser
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska vara en av de fyra avtalsföreningarna för Tegelvallen, Morgongåva IP, Furuvallen eller Lundavallen
  - Ett arrendeupplåtelse- och driftavtal ska reglera föreningens självständiga verksamhet och fulla driftansvar för anläggningen
  - Föreningen ska följa avtalets villkor för förvaltning av den stora, kostnadskrävande och allmännyttiga idrottsanläggningen
  - Anläggningen kontrolleras särskilt varje år och en avtalsförening tas årligen ut för granskning
  belopp: Särskilt driftbidrag enligt respektive förenings drift- och arrendeavtal; generell nivå publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Stödet regleras i befintliga avtal och kommunen publicerar ingen öppen ansökningsdag.
  kalla_url: https://www.heby.se/download/18.1747aaaf184b40179e8625ad/1781256412060/Riktlinjer%20f%C3%B6r%20f%C3%B6reningsst%C3%B6d%20i%20Heby%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödformen är uttryckligen reglerad men bara tillgänglig för de fyra namngivna avtalsföreningarna.
  senast_verifierad: '2026-08-18'
