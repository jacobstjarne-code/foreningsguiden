  krav:
  - Sökanden ska vara den Folkets Hus-förening som driver en av de tre namngivna anläggningarna i Heby, Tärnsjö eller Östervåla
  - Föreningen ska ha ett gällande, mångårigt kontraktsavtal direkt med kommunledningen
  - Verksamheten och anläggningsdriften ska fullgöras enligt det individuella kontraktsavtalet
  belopp: Ersättningsnivå enligt respektive mångårigt kontraktsavtal; generell nivå publiceras inte
