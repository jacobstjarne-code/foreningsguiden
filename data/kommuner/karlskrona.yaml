- id: karlskrona-team-karlskrona
  namn: Team Karlskrona
  status: aktiv
  foreningstyp: [idrott]
  kategori: [idrott]
  malgrupp: Stödberättigade idrottsföreningar i Karlskrona som representerar en individuell elitidrottare på svensk landslagsnivå eller motsvarande
  deadlines:
    typ: fasta
    datum: ['10-15']
  krav:
  - Föreningen ska vara stödberättigad i Karlskrona och teckna avtal med kommunen om stödet
  - Den aktive ska representera en idrottsförening i Karlskrona under hela avtalsperioden och vara folkbokförd i kommunen, med undantag för studier på annan ort
  - Den aktives idrott ska tillhöra Riksidrottsförbundet och den aktive ska fylla minst 17 år under avtalsperioden samt tävla på junior- eller seniornivå
  - Den aktive ska minst vara uttagen till ett svenskt landslag eller ha aktuella resultat som motsvarar svensk landslagsnivå
  - Föreningen ska i ansökan redovisa hur stödet ska användas för medlemmen och visa kommunens eller Team Karlskronas logotyp på sin webbplats
  - Slutredovisning av kostnader och aktiviteter ska lämnas inom en månad efter avtalstidens slut
  belopp: Minst 10 000 kr per antagen medlem i Team Karlskrona
  belopp_avser: per_forening
  kommunens_pott: 150 000 kr för 2026, fördelat mellan sökande föreningar
  sen_ansokan: Ansökan ska lämnas senast den 15 oktober; slutredovisning inom en månad efter avtalstidens slut
