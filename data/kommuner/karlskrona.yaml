  anteckning: SAKNADES HELT I FÖREGÅENDE VERSION — administreras av Miljö- och samhällsbyggnadsförvaltningen (samhällsplanering
    och trafik), separat spår från kultur- och fritidsnämndens bidrag och lätt att missa om bara föreningsbidrags-sidorna
    genomsöks. Vägsamfälligheter kan även få statligt driftbidrag för vägunderhåll via Trafikverket, utöver detta kommunala
    bidrag. Ansökan sker på pappersblankett (BL5028, Word-format), inte via Interbook FRI. Inget publicerat maxbelopp eller
    fast ansökningsdatum hittades i källan — bidraget beskrivs som ett årligt underhållsbidrag utan vidare precisering.
