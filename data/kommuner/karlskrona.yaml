    lokal/anläggning
  deadlines:
    typ: fasta
    datum:
    - 03-15
  krav:
  - Föreningen ska vara godkänd stödberättigad, samt särskilt godkänd för att söka drift- och lokalstöd
  - Lokal som hyrs av kultur- och fritidsförvaltningen (t.ex. gymnastiksalar) är inte bidragsberättigad
  - Stöd för lokalkostnader kan inte ges till delar av en lokal som används kommersiellt
  - Föreningen eller organisationen ska vara godkänd som stödberättigad av Karlskrona kommun
  - Föreningen ska ha organisationsnummer
  - Föreningen ska ha bank- eller plusgiro, alternativt konto som tillhör föreningen
  - Föreningen ska ha antagna stadgar
  - Föreningen ska ha protokoll från bildandemöte eller senaste årsmöte
  belopp: 'Stöd för lokalkostnader (hyrd lokal): 20–40 % av bidragsgrundande kostnader (arrende, kallhyra, försäkring, myndighetsavgifter,
    sotning, vatten/avlopp, värme/el, fiber), lägst 10 000 kr/år i kostnad, maxbelopp 30 000–70 000 kr/år beroende på verksamhetstyp.
    Driftsstöd (egenägd lokal/anläggning): samma procentsatser, maxbelopp 30 000–250 000 kr/år beroende på objektstyp, plus
    separat skötselstöd för egenägda anläggningar (schablon: 20 000–40 000 kr för underhåll av omklädningsrum + 5 000–30 000
    kr per plan beroende på plantyp, där andelen som betalas ut är 10–80 % beroende på antal deltagartillfällen)'
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.karlskrona.se/globalassets/kultur-och-fritid/foreningar/dokument/belopp-och-ansokningstider-for-stod-inom-kultur-och-fritidsomradet-2026.pdf
