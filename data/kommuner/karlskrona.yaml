  namn: Kommunalt bidrag för underhåll av enskild utfartsväg
  kategori:
  - ovrig
  malgrupp: Väghållare (enskild fastighetsägare, vägförening eller vägsamfällighet) för enskild utfartsväg med längd minst
    100 meter till allmän väg, till stadigvarande nytta för fast boende befolkning
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Vägen ska vara minst 100 meter lång till allmän väg eller vägsamfällighet
  - Ansökan (blankett BL5028) ska ange väghållare, bidragsmottagare, vägsträckning, antal helårsbebodda fastigheter samt om
    vägförening/vägsamfällighet finns
  - Samtliga berörda fastighetsägare längs vägen ska godkänna att bidraget betalas ut till angiven bidragsmottagare
  - Föreningen eller organisationen ska vara godkänd som stödberättigad av Karlskrona kommun
  - Föreningen ska ha organisationsnummer
  - Föreningen ska ha bank- eller plusgiro, alternativt konto som tillhör föreningen
  - Föreningen ska ha antagna stadgar
  - Föreningen ska ha protokoll från bildandemöte eller senaste årsmöte
