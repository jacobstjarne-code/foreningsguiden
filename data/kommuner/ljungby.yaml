- id: ljungby-stad-90-ar
  namn: Evenemangsstöd Ljungby stad 90 år
  kategori: [kultur, ovrig]
  malgrupp: Organisationer och andra arrangörer som genomför publika jubileumsevenemang i Ljungby stad under 2026
  deadlines: { typ: lopande, datum: [] }
  krav:
  - Evenemanget ska arrangeras under 2026 och lyfta Ljungbys 90-årsjubileum genom tema eller innehåll
  - Evenemanget ska vara öppet för allmänheten, rikta sig till en bred målgrupp och vara politiskt och religiöst obundet
  - Evenemanget ska märkas med jubileumssymbolen och publiceras i kommunens evenemangskalender
  - Ansökan ska innehålla arrangör, datum, plats, beskrivning, specificerad kostnadsbudget och sökt belopp
  - Efter genomförandet ska en rapport lämnas med bekräftelse, synliggörande av jubileet och uppskattat besöksantal
  belopp: Högst 7 000 kr och högst 75 % av evenemangets totala kostnader per arrangör
