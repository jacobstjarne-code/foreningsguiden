    deadline_status: kontrollast
    krav_status: kontrollast
    krav_fullstandiga: true
    anteckning: >-
      25 feb avser aktiviteter 1/7–31/12 föregående år; 25 aug avser 1/1–30/6. Beslut 30 april respektive 30 oktober.
      Ansökan om aktivitetsbidrag genererar även sammankomstbidrag. Källan anger "Bidrag utgår med 30 kronor per
      sammankomst" för sammankomstbidraget. Bidrag ges inte för deltagare i entrébelagda tävlingar, kommersiella
      arrangemang eller avgiftsbelagd studiecirkel.
