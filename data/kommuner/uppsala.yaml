  - id: uppsala-aktivitetsbidrag-aldre
    namn: Aktivitets- och sammankomstbidrag för äldre 60+
    kategori:
      - pensionar
    malgrupp: Föreningar anslutna till Riksidrottsförbundet med aktiviteter för personer 60 år och äldre
    deadlines:
      typ: fasta
      datum:
        - 02-25
        - 08-25
    krav:
      - Föreningen måste vara ansluten till Riksidrottsförbundet
      - Godkänd aktör; minst tre stödberättigade medlemmar deltar per sammankomst
      - >-
        Sammankomsten ska pågå minst 60 minuter inklusive gemensam samling och avslutning som leds av gruppledaren, som
        inte får leda flera grupper samtidigt
      - >-
        Sökanden ska vara en juridisk person med organisationsnummer och ha ett bankkonto kopplat till
        organisationsnumret
      - Sökanden ska vara godkänd som aktör av berörd nämnd och driva verksamheten demokratiskt utan diskriminering
      - >-
        Beviljat bidrag ska användas för det sökta ändamålet och kunna styrkas genom ekonomisk redovisning och begärda
        handlingar
    belopp: >-
      Sammankomstbidrag 30 kronor per sammankomst. Aktivitetsbidraget ger 1 poäng per deltagare och sammankomst på minst
      60 minuter och 3 poäng vid minst 180 minuter; poängens värde beror på antalet ansökningar och budgeten
    sen_ansokan: Ej angivet i källan
    kalla_url: >-
      https://www.uppsala.se/kultur-idrott-fritid/foreningar/bidrag/bidrag-till-foreningsverksamhet-for-idrott-och-fritid/aktivitetsbidrag-och-sammankomstbidrag-for-aldre-60/
