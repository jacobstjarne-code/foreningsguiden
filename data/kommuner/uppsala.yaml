    krav:
      - Föreningen ska vara en enskild, självständig pensionärsförening
      - >-
        Föreningen ska ha minst 25 bidragsberättigade medlemmar, det vill säga pensionärer folkbokförda i Uppsala kommun
        som betalat medlemsavgift under förra redovisningsåret
      - Föreningen ska driva sin huvudsakliga verksamhet i Uppsala kommun
      - >-
        Aktivitetsbidrag kräver att sammankomsten är beslutad och ekonomiskt planerad av styrelse, sektion eller
        medlemsmöte, pågår minst en timme och har en närvarolista som sparas i fyra år
      - Lokalhyresbidrag ges inte för förhyrningar i kommunala lokaler
      - >-
        Sökanden ska vara en juridisk person med organisationsnummer och ha ett bankkonto kopplat till
        organisationsnumret
      - Sökanden ska vara godkänd som aktör av berörd nämnd och driva verksamheten demokratiskt utan diskriminering
      - >-
        Beviljat bidrag ska användas för det sökta ändamålet och kunna styrkas genom ekonomisk redovisning och begärda
        handlingar
    belopp: >-
      Grundbidrag 1 000 kronor plus högst 10 kronor per bidragsberättigad medlem, max 10 000 kronor per förening.
      Aktivitetsbidrag 100 kronor per aktivitet med 10–24 deltagare och 225 kronor per aktivitet med 25 deltagare eller
      fler. Lokalhyresbidrag 50 procent av lokalkostnaden, högst 10 kronor per bidragsberättigad medlem och max 10 000
      kronor per förening
