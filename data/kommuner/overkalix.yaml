  krav:
  - Föreningen ska bedriva sin verksamhet i och ha huvuddelen av sina medlemmar i Överkalix kommun
  - Föreningen ska vara demokratiskt uppbyggd, med vald styrelse och stadgar godkända av riksorganisation eller Överkalix
    kommun
  - Föreningen ska vara öppen för alla som önskar stödja föreningens ändamål och syfte
  - Föreningen ska ge flickor och pojkar samt kvinnor och män möjlighet att bedriva verksamhet på lika villkor
  - Föreningen ska främja barn och ungdomars medverkan
  - 'Föreningen får inte tillhöra någon av kategorierna: ekonomisk förening, politisk förening, elevförening, förening knuten
    till svenska försvaret, eller intresseförening (t.ex. facklig organisation eller företagarförening)'
  - Verksamhetsberättelse och årsmötesprotokoll ska bifogas ansökan
