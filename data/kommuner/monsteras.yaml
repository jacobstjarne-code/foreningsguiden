  - Evenemanget ska bidra till ett starkare föreningsliv eller näringslivsutveckling
  - Förhandsbesked ska inväntas och föreningen ska återrapportera efter genomförandet; utbetalning sker mot faktura när överenskomna villkor är uppfyllda
