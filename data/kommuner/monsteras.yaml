- id: monsteras-utbildningsbidrag
  namn: Utbildningsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med barn- och ungdomsverksamhet som utbildar ledare eller instruktörer
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Kursen ska avse kompetensutveckling för ledare eller instruktör i föreningens barn- och ungdomsverksamhet
  - Kursplanen ska godkännas och specificerade kostnader, kursprogram och kursintyg ska bifogas ansökan
  - Stöd lämnas inte till lokalt arrangerad kurs som får annat stöd, exempelvis en studiecirkel
  - Resor ska ske med billigaste färdsätt och endast resa, kursavgift och kurslitteratur är stödgrundande
  belopp: 300 kr per kursdag och högst 1 500 kr per kurs; dessutom högst 80 procent av godkända kostnader och normalt högst 10 000 kr per förening och år
  belopp_avser: per_forening
