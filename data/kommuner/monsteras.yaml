- id: monsteras-lovaktivitetsbidrag
  namn: Bidrag till lovaktiviteter
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som ordnar kostnadsfria aktiviteter för barn och unga under kommunens skollov
  deadlines:
    typ: okand
    datum: []
  krav:
  - Aktiviteten ska vara öppen för alla barn och unga i vald åldersgrupp och inte bara för föreningens egna medlemmar
  - Aktiviteten ska vara kostnadsfri, genomföras under de lovdagar kommunen anger och behandla alla deltagare lika utan behovsprövning
  - Ansökan ska beskriva aktiviteten fullständigt eftersom uppgifterna används i kommunens lovprogram
  belopp: 1 000 kr per aktivitet och dag samt ytterligare 300 kr per dag om föreningen erbjuder skjuts
