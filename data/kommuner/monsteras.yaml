- id: monsteras-stod-till-fritidsforeningar
  namn: Verksamhetsbidrag för fritidsföreningar
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade fritidsföreningar med ideell barn- och ungdomsverksamhet i Mönsterås kommun
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Föreningen ska vara registrerad i kommunens föreningsregister, ha styrelse och stadgar, vara öppen för alla och bedriva lokal verksamhet
  - Föreningen ska bedriva kontinuerlig ideell verksamhet för barn och unga 7–25 år eller likvärdig idrotts- eller hobbyverksamhet
  - Föreningen ska ha en aktuell policy för alkohol, narkotika, dopning och tobak samt trafiksäkerhet
  - Verksamhetsberättelse, kassarapport, revisionsberättelse och föreningspolicy ska bifogas ansökan
  belopp: 40 kr per medlem vid 1–100 medlemmar, 35 kr per medlem vid 101–200 och 30 kr per medlem från 201 medlemmar
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast den 31 mars och avser föregående verksamhetsår
  kalla_url: https://www.monsteras.se/uppleva-och-gora/foreningar-foreningsliv/foreningsbidrag-stod/stod-till-fritidsforeningar/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
- id: monsteras-lokalt-aktivitetsstod
  namn: Lokalt aktivitetsstöd
  status: aktiv
  kategori: [idrott, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Fritidsföreningar med ledarledda aktiviteter för deltagare 7–25 år eller paraidrott utan övre åldersgräns
  deadlines:
    typ: fasta
    datum: [02-25, 08-15]
  krav:
  - Sammankomsten ska vara ledarledd, pågå minst en timme och ha minst tre och högst 30 deltagare utöver ledaren
  - Samma deltagare får bara räknas en gång per dag och förening och entrébelagda tävlingar eller kommersiella arrangemang ger inte stöd
  - Närvarokort ska föras och skickas in med ansökan; RF-anslutna föreningar kan överföra sin ansökan från IdrottOnline
  - Föreningen ska vara registrerad, lokalt verksam och ha aktuell ANDT- och trafiksäkerhetspolicy
  belopp: Fast belopp per godkänd sammankomst och per deltagare; aktuell kronnivå publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Den aktuella webbsidan anger den 25 februari för höstsäsongen och den 15 augusti för vårsäsongen
  kalla_url: https://minasidor.monsteras.se/lokstod
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Den äldre bidragsnormen anger 25 augusti för vårsäsongen, medan kommunens aktuella sida och e-tjänst anger 15 augusti
  senast_verifierad: '2026-08-19'
- id: monsteras-lokalbidrag-fritidsforeningar
  namn: Lokalbidrag för fritidsföreningar
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Fritidsföreningar som äger eller hyr lokal för barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Lokalen ska användas för barn- och ungdomsverksamhet i Mönsterås kommun och stå i proportion till verksamhetens storlek och behov
  - Bidragsgrundande kostnader är hyra, uppvärmning, vatten och el under föregående verksamhetsår
  - Stöd lämnas inte för kommunalt ägd fastighet, kommunalt arrenderad mark, kommunens redan subventionerade lokaler eller verksamhet som får driftbidrag
  - Verksamhetsberättelse, kassarapport, revisionsberättelse och aktuell föreningspolicy ska bifogas
  belopp: Högst 25 kr per medlem 7–25 år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast den 31 mars och avser kostnader under föregående verksamhetsår
  kalla_url: https://minasidor.monsteras.se/oversikt/overview/379
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
