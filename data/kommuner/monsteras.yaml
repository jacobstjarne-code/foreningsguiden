- id: monsteras-extra-verksamhets-och-investeringsbidrag
  namn: Extra verksamhets- och investeringsbidrag
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Fritidsföreningar med större investering, projekt eller extraordinär verksamhets- eller underhållskostnad
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Ansökan ska avse större investering, projekt eller extra verksamhets- eller underhållskostnad som inte täcks av ordinarie stöd
  - Ansökan ska lämnas innan projektet eller investeringen påbörjas och innehålla tydlig motivering och ekonomisk kalkyl
  - Stöd lämnas inte till samma eller liknande investering inom fem år, med undantag för underhållskostnader
  - Användningen av beviljat stöd ska redovisas senast den 30 november samma budgetår
  belopp: Individuellt prövat belopp; ingen generell nivå publiceras
