    datum: []
  krav:
  - Föreningen ska vara registrerad och godkänd som bidragsberättigad av kultur- och fritidsnämnden
  - Bokningen ska avse kommunens sporthall, gymnastikhall, föreningshus eller idrottsplan och följa gällande boknings- och ordningsregler
  - Föreningen ska ha lokal ideell verksamhet och uppfylla kommunens villkor om stadgar, styrelse, öppenhet och redovisning
