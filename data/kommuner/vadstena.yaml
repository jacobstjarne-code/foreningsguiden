forutsattningar:
- id: vadstena-bidragsberattigad-registrerad-forening
  vad: Bidragsberättigande, föreningsregister och aktuella handlingar
  beskrivning: Föreningen ska vara ideell eller av liknande ideell art, ha säte och stadigvarande verksamhet i Vadstena, ha varit registrerad och verksam minst sex månader samt ha organisationsnummer. Den ska ha stadgar, minst tre styrelseledamöter, revisorer och årsmöte, minst fem frivilliga matrikelförda medlemmar varav flertalet är folkbokförda i kommunen och normalt ta minst 100 kronor i årsavgift. Föreningen ska följa demokratiska principer, arbeta för jämställdhet och mot diskriminering, ha drog- och dopingrutiner, följa bokföringslagen och ha eget konto. Barn- och ungdomsverksamhet ska dessutom vara alkohol- och tobaksfri, följa barnkonventionen, kontrollera belastningsregister och ha krisplan. Föreningen ska registreras i kommunens föreningsregister, hålla register- och styrelseuppgifterna uppdaterade och vid ansökan lämna aktuella stadgar, års-, ekonomi- och revisionshandlingar, årsmötesprotokoll samt verksamhetsplan och budget.
  system: E-serve Bidragsenheten Vadstena
  ledtid: null
  ledtid_text: Registrering och fullständiga uppgifter krävs vid ansökan; kommunen publicerar ingen separat giltighetstid eller förnyelsefrist
  giltighet: null
  ordning: 1
  kalla_url: *norm
  giltighet_status: ingen_regel
