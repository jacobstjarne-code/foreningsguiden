- id: vadstena-hyra
  namn: Hyresbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar med kostnader för verksamhet i icke-kommunal lokal eller anläggning
