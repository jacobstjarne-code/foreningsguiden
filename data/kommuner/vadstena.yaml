- id: vadstena-arrangemang
  namn: Arrangemangsbidrag
  status: aktiv
  kategori: [kultur, idrott, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar som arrangerar offentliga evenemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Evenemanget ska vara öppet för allmänheten och stärka Vadstena som hemvist eller besöksmål
  - Evenemanget ska bidra till kommunens attraktivitet, utveckla utbudet eller vara av kommunalt, regionalt, nationellt, internationellt eller tydligt medialt intresse
  - Ansökan ska göras i förväg minst tre månader före evenemanget, även när evenemanget är återkommande
  - Endast direkta evenemangskostnader som artistarvode, offentlig lokal, ljud och ljus eller marknadsföring är stödgrundande
  - Kommunen kan kräva att dess logotyp eller medfinansiering anges i marknadsföringen
  - Särskilt redovisningsformulär ska lämnas senast två månader efter evenemanget
  belopp: Individuellt prövat arrangemangsbidrag; kommunen publicerar ingen generell beloppsnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan är öppen löpande under 2026 men ska lämnas minst tre månader före evenemanget; efterhandsansökan beaktas inte
  kalla_url: *portal
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
