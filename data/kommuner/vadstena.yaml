    datum: [09-20]
  krav:
  - Lokalen eller anläggningen ska inte vara kommunalt ägd eller förvaltad
  - Samma anläggning får inte samtidigt ligga till grund för driftsbidrag
  - Stödgrundande kostnader är hyra, el för belysning, värme och städning i expeditions- eller klubblokal
