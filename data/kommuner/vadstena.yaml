- id: vadstena-arrangemang
  namn: Arrangemangsbidrag
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Aktörer och föreningar som ordnar enstaka eller flera arrangemang/projekt
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Ansökan ska göras i förväg, tre månader innan arrangemanget; ansökan i efterhand beaktas inte.
  - Bidraget omfattar endast direkta arrangemangskostnader, till exempel artistarvode, hyra för offentlig lokal, ljud- och
    ljusteknik samt marknadsföring.
  - Ansökan görs löpande och beslut fattas vid fyra tillfällen under året.
  - Redovisning ska lämnas i särskilt formulär via e-tjänsten senast två månader efter genomfört arrangemang.
  belopp: null
  sen_ansokan: Ansökan i efterhand beaktas inte.
  kalla_url: https://www.vadstena.se/wp-content/uploads/2024/07/riktlinje-for-bidrag-till-ideburen-och-ideell-sektor-fran-1-juli-2024.pdf
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
- id: vadstena-aktivitetsbidrag
  namn: Aktivitetsbidrag för ungdomsverksamhet
  kategori:
  - idrott
  - ovrig
  malgrupp: Verksamheter som engagerar barn och unga 7–25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Berättigade är föreningar som bedriver barn- och ungdomsverksamhet för deltagare mellan 7 och 25 år.
  - Gruppaktiviteten ska vara planerad och beslutad av styrelse, sektions- eller medlemsmöte, pågå minst 60 minuter och ha
    minst tre deltagare i åldern 7-25 år utöver ledare.
  - Ledare ska ha fyllt 13 år och vara medlem i föreningen; maximalt 30 deltagare får räknas per grupp och aktivitetstillfälle.
  - Bidrag utgår inte till entrébelagda tävlingar, kommersiella arrangemang eller aktiviteter under skoltid.
  - Ansökan görs i efterhand per termin via e-tjänsten med närvarokort som underlag (idrottsföreningar kan använda RF-LOK-stöd
    som underlag).
  belopp: null
  sen_ansokan: Ansökan görs i efterhand efter varje termin; sista ansökningsdatum är 25 februari för perioden 1 juli-31 december
    och 25 augusti för perioden 1 januari-30 juni.
  kalla_url: https://www.vadstena.se/wp-content/uploads/2024/07/riktlinje-for-bidrag-till-ideburen-och-ideell-sektor-fran-1-juli-2024.pdf
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
- id: vadstena-utveckling-investering
  namn: Utvecklings- och investeringsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med utvecklingsprojekt eller investeringar i anläggning och utrustning
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidraget är kvalitativt och dialogbaserat; beslut grundas på särskild prövning från fall till fall efter dialogmöte med
    föreningen.
  - Bidraget gäller särskilda projekt och kan inte sökas flera år i rad.
  - Ansökan startar digitalt via e-tjänsten och föredras därefter för en beredningsgrupp inom kommunen innan beslut och utbetalning.
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.vadstena.se/wp-content/uploads/2024/07/riktlinje-for-bidrag-till-ideburen-och-ideell-sektor-fran-1-juli-2024.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: vadstena-drift
  namn: Driftsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar som driver egen anläggning
  deadlines:
    typ: fasta
    datum:
    - 08-25
  krav:
  - Anläggningen ska ägas av föreningen eller drivas av föreningen under äganderättsliknande förhållande, till exempel avtal
    med nyttjanderätt eller arrende.
  - Bidrag utgår endast om anläggningen är i sådant skick att avsedda verksamheter kan genomföras; kommunen har rätt att årligen
    besikta anläggningen tillsammans med föreningen.
  - Avtal tecknas för en tvåårsperiod; uppföljning och tecknande av nytt avtal ska ske senast i november avtalets andra år.
  - Ny förening eller anläggning ansöker om avtal för kommande tvåårsperiod senast 25 augusti i e-tjänsten.
  belopp: Fast belopp per anläggning och år, fastställs individuellt i avtal mellan kultur- och utbildningsnämnden och föreningen.
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.vadstena.se/wp-content/uploads/2024/07/riktlinje-for-bidrag-till-ideburen-och-ideell-sektor-fran-1-juli-2024.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'Avtalsbaserad modell: befintliga avtal löper två år och förnyas senast i november avtalets andra år. Datumet
    25 augusti gäller endast ansökan om nytt avtal för nya föreningar/anläggningar, inte en generell årlig deadline.'
- id: vadstena-hyra
  namn: Hyresbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar med externa lokal- eller anläggningskostnader
  deadlines:
    typ: fasta
    datum:
    - 08-25
  krav:
  - Gäller lokalkostnader för anläggning/lokal som inte är kommunal, till exempel hyra, el, värme och städning för expeditions-
    och klubblokal.
  - Bidrag utgår inte om föreningen redan erhåller driftsbidrag för samma anläggning, eller om lokalkostnaderna täcks av entréavgifter.
  - Kostnader ska styrkas genom intyg från hyresvärd eller kopior på hyresverifikationer och fakturor.
  belopp: Högst 25 000 kronor per förening och år.
  sen_ansokan: Ansökningar som kommer in för sent riskerar att inte behandlas.
  kalla_url: https://www.vadstena.se/wp-content/uploads/2024/07/riktlinje-for-bidrag-till-ideburen-och-ideell-sektor-fran-1-juli-2024.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunens webbsida angav tidigare sista ansökningsdatum 30 september (förlängt 2025 till 31 oktober), men den
    gällande riktlinjen anger 25 augusti. Riktlinjen är den formellt beslutade källan och prioriteras här.
