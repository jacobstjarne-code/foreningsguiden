    datum: [09-20]
  krav:
  - Föreningen ska äga anläggningen eller driva den genom exempelvis arrende- eller servitutsavtal
  - Samma anläggning får inte samtidigt ligga till grund för hyresbidrag
  - Anläggningen ska vara i sådant skick att den avsedda verksamheten kan genomföras och kommunen får besikta den årligen
  - Ansökan ska göras i förväg för en tvåårig avtalsperiod
  - Föreningen ska kalla kommunen till uppföljningsmöte i slutet av avtalsperioden och därefter söka på nytt om avtalet ska förnyas
