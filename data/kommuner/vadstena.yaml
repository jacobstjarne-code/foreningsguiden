    datum: []
  krav:
  - Ansökan ska avse en större förändring eller verksamhetsutveckling eller en investering i föreningens anläggning eller utrustning
  - Ansökan ska göras i förväg och insatsen får inte vara genomförd när ansökan lämnas
  - Jämställdhetsarbete och insatser för att nå nya målgrupper prioriteras
  - Föreningen ska inför dialogmöte beskriva insats, syfte, mål, målgrupp, uppföljning, tidsplan och preliminär budget
  - Bidraget avser en särskild insats och kan inte sökas flera år i rad
  - Insatsen ska efter genomförandet redovisas både muntligt och skriftligt med resultat och ekonomi
