- id: vadstena-aktivitetsbidrag
  namn: Aktivitetsbidrag för barn- och ungdomsverksamhet
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar med deltagare mellan 7 och 25 år
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Gruppaktiviteten ska vara planerad, ekonomiskt beslutad, ledarledd och pågå minst 60 minuter
  - Minst tre deltagare mellan 7 och 25 år utöver ledaren ska delta
  - Ledaren ska vara minst 13 år, medlem i föreningen, närvara hela aktiviteten och får inte samtidigt leda flera grupper
  - Högst 20 deltagare per ledare får räknas och bidrag utgår endast en gång per grupp och dag
  - En deltagare får räknas i högst en gruppaktivitet per dag inom samma förening och en naturlig grupp får inte delas för att ge mer bidrag
  - Entrébelagda tävlingar, kommersiella arrangemang, skoltid, privat verksamhet och verksamhet som finansieras på annat sätt är inte stödgrundande
  - Närvarokort eller digitalt närvaroregister ska föras, ledaren ska intyga uppgifterna och underlagen ska sparas i minst tre år
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Fast budgeterad summa som fördelas efter deltagarstöd, ledarstöd och extra ledarstöd; totalsumman publiceras inte
  sen_ansokan: Ansökan görs terminsvis i efterhand, senast 25 februari för höstterminen och 25 augusti för vårterminen
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
