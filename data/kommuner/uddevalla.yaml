- id: uddevalla-lokal-och-driftsbidrag
  namn: Lokal- och driftsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Ideella föreningar med verksamhet i Uddevalla och lokal/anläggning, kansli/kontor eller förråd. Ekonomiska föreningar
    kan endast beviljas bidrag för drift och lokal om föreningen är delägd av Uddevalla kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Demokratiska stadgar, senast justerat årsprotokoll, underskriven revisionsberättelse och ekonomisk redovisning med balans-
    och resultatrapport
  - Hyres-/ägandeavtal, ekonomisk redovisning per lokal/anläggning och beskrivning av funktion ska bifogas
  - Minst 10 sammankomster föregående år (gäller ej friluftsnoder)
  - Krav på tillgänglighetsanpassning för driftbidrag avseende verksamhetslokaler
  - En förening kan inte få både driftbidrag och lokalbidrag för samma anläggning; flera objekt av samma typ läggs ihop och
    begränsas gemensamt av maxtaket för just den typen
  - Basbidrag (25 000 kr/år) kan endast ges till föreningar som äger sin lokal/anläggning
  - Driftbidrag ges endast för lokaler/anläggningar med kontinuerlig verksamhet, inte tillfälliga projekt eller enstaka arrangemang
  belopp: 'Verksamhetslokal/anläggning och kansli/kontor, andel av nettokostnad och maxtak per år: fotbollsanläggning 80 %
    (200 000 kr), ridanläggning 80 % (200 000 kr), skatelokal 80 % (200 000 kr), kansli/kontor 80 % (50 000 kr, varav högst
    5 000 kr/år får avse förråd), kultur/samlingslokaler/hembygdsföreningar 65 % (100 000 kr), bangolf-, skytte-, golf-, tennis-,
    motions-/gym-, båt-/segel-, motor- och kampsportsanläggning 50 % (65 000 kr). Basbidrag för ägd lokal: 25 000 kr/år. Driftbidrag
    friluftsområde (schablon): spår/leder 600 kr eget ansvar eller 2 000 kr/st tillsynsansvar, badplats 2 500 kr/st, belyst
    motionsspår 1 000 kr/st, fiskesjö 2 000–2 500 kr/st, preparerande skidspår 500 kr, stuga 65 % av kostnad (max 90 000 kr/förening),
    karta för friluftsliv 550 kr/km², vindskydd/eldstad 1 000 kr/st. Upprustningsbidrag kan ersätta upp till 100 % av kostnaden,
    maxbelopp fastställs årligen.'
  sen_ansokan: Ej angivet i källan
