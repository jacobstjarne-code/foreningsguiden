    datum: []
  krav:
  - Demokratiska stadgar, senast justerat årsprotokoll, underskriven revisionsberättelse och ekonomisk redovisning med balans-
    och resultatrapport
  - Om flera inriktningar söks prövas varje inriktning för sig utifrån sina specifika krav
  - För funktionsbidrag gäller att verksamheten ska rikta sig till personer med funktionsvariation
  - För lov- och after school-verksamhet gäller att verksamheten ska vara kostnadsfri för deltagarna; mat/fika och redan subventionerade
