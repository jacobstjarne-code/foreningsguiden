- id: uddevalla-verksamhetsbidrag
  namn: Verksamhetsbidrag
  kategori:
  - funktionsratt
  - social
  - ovrig
  malgrupp: Alla ideella föreningar och stiftelser (inklusive stiftelsedrivna museer) med verksamhet i Uddevalla kommun
  deadlines:
