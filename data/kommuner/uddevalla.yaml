  deadline_status: angivet
  krav_status: angivet
  krav_fullstandiga: null
  anteckning: Administreras av Kommunstyrelsen/kommunledningskontoret, inte Kultur- och fritidsnämnden, och ligger därför
    utanför de reviderade bestämmelserna för civilsamhällesorganisationer — ansökningar under 75 000 kr kan beslutas av kommunstyrelsens
    ordförande genom delegation, övriga av kommunstyrelsen. Kommunens sida bekräftar uttryckligen att sponsringen är oförändrad
    av 2026 års bidragsreform ('Ingenting har förändrats när det gäller sponsring'). Inkluderad trots det avvikande syftet
    (platsmarknadsföring snarare än stöd till ideell verksamhet) eftersom inget kategoriskt uteslutningsskäl enligt §2.4 föreligger
    — föreningar kan faktiskt söka och beviljas stödet.
