  anteckning: Specialkategori enligt §2.1.5 (stiftelser/fonder). Extern stiftelse (grundad 1958 i samband med Uddevallavarvets
    rekonstruktion) som stödjer föreningslivet i hela Bohuslän, inte enbart Uddevalla — men listas på och delvis administreras
    via kommunens egen sida för stipendier och fonder. Fullständig ansökningsprocess sker på stiftelsens egen webbplats (thordenstiftelsen.se),
    utanför kommunens domän, och används därför inte som primärkälla här (§4).
