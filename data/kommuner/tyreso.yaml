- id: tyreso-bidragsberattigad
  vad: Bli godkänd som bidragsberättigad förening
  beskrivning: Föreningen registrerar sig själv i kommunens boknings- och bidragssystem Rbok och ansöker därefter om status
    som bidragsberättigad förening (logga in på föreningen → 'Ansök' → 'Bidragsberättigad förening'). Kräver demokratiskt
    vald styrelse och antagna stadgar, att föreningen motverkar diskriminering utifrån de sju diskrimineringsgrunderna, alkohol-
    och drogfri barn- och ungdomsverksamhet, samt registrering i kultur- och fritidsnämndens föreningsregister. Föreningen
    ska årligen, efter respektive årsmöte, uppdatera föreningsuppgifter (verksamhetsberättelse, revisionsberättelse, ekonomisk
    redovisning) och medlemsantal i registret — de senast fastställda uppgifterna måste vara registrerade i samband med att
    föreningen lämnar in en bidragsansökan för att ansökan ska räknas som komplett.
  system: Rbok
  ledtid: null
  ledtid_text: Ingen handläggningstid för själva godkännandet som bidragsberättigad förening publicerad av kommunen.
  giltighet: null
  ordning: 1
  kalla_url: https://www.tyreso.se/uppleva--gora/forening/foreningsbidrag-och-stipendier/lokalt-aktivitetsstod-lok/allmanna-bestammelser---foreningsstod.html
  giltighet_status: ingen_regel
kommunsiffra: null
