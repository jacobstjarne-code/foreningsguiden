  - Minst en ansvarig ledare, minst 13 år, ska närvara hela sammankomsten
  - Minst tre deltagare 7–20 år (utöver ledaren) per sammankomst
  - Deltagaren ska vara individuellt ansluten och ha betalt föreningens årsavgift
  - Aktiviteten ska följa föreningens ändamål och demokratiska principer samt motverka diskriminering och brottslighet
  - Samma medlem får endast räknas en gång per dag i samma förening, om inte verksamheten bedrivs i självständiga sektioner
