  krav:
  - Föreningen ska vara registrerad och bidragsberättigad i Nykvarns kommun
  - Föreningen ska ha sin huvudsakliga verksamhet och sitt säte i Nykvarns kommun, om inte kommunen medger undantag
  - Föreningen ska ha minst tio aktiva medlemmar som betalar medlemsavgift
  - Minst 51 procent av medlemmarna ska vara folkbokförda i Nykvarns kommun
  - Verksamheten ska vara alkohol- och drogfri
  - Föreningen får inte vara en religiös eller politisk förening eller bedriva verksamhet med religiöst eller politiskt budskap
  - Föreningar med barn- och ungdomsverksamhet ska ha rutiner för registerutdrag för ledare med kontinuerlig direktkontakt
    med barn
  - Föreningen ska stå bakom demokratiska principer, mänskliga rättigheter och jämställdhet
  - Verksamheten ska vara öppen för alla och motverka diskriminering
  - Föreningen ska ha vald styrelse och demokratiskt antagna stadgar
  - Föreningen ska årligen lämna årsmötesprotokoll, verksamhetsberättelse, ekonomisk berättelse, revisionsberättelse och medlemsuppgifter
  - Renoveringen får inte vara påbörjad eller avslutad före beslut
  - Föreningen kan endast beviljas renoveringsbidrag en gång per år
  - Föreningen ska äga eller driva anläggningen under ägarliknande och långsiktiga förhållanden
