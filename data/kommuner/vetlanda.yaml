  malgrupp: Bidragsberättigade föreningar registrerade i Vetlanda kommun; medlems- och aktivitetsbidrag riktas till medlemmar
    7–25 år, handikappföreningar oavsett ålder
  deadlines:
    typ: fasta
    datum:
    - 02-28
  krav:
  - Föreningen ska vara registrerad i kommunens föreningsregister och uppfylla kommunens allmänna bestämmelser för föreningsbidrag
  - Föreningen ska ha minst tio registrerade medlemmar, varav mer än hälften folkbokförda i Vetlanda kommun
  - Föreningen ska närvara vid förvaltningens årliga föreningsträff (annars avdrag 10 000 kronor från bidraget)
  - Medlemmar ska betala en personlig medlemsavgift om lägst 50 kronor per år
  belopp: 32,70 kr per medlem 7–25 år (medlemsbidrag), 43,60 kr per sammankomst (aktivitetsbidrag, minst 60 minuter och minst
    tre deltagare), 50 kr per medlem för hyrda lokaler till ungdomsverksamhet (max 10 000 kr/år, handikapporganisationer högst
    12 000 kr/år), schablonbelopp för föreningsägda anläggningar enligt bilaga 1
  sen_ansokan: För sent inkommen ansökan behandlas inte
  kalla_url: https://www.vetlanda.se/download/18.7150ddee18e85ff00c5356b/1768904071819/Bidragsbestämmelser,%20policy.pdf
