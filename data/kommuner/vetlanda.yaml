  anteckning: SAKNADES I FÖREGÅENDE VERSION — tillagd vid korrigerande omkörning 2026-07-20 (specialkategori, byalag/samhällsföreningar).
    Förslag lämnas via e-tjänst (sjalvservice.vetlanda.se/oversikt/overview/556). Ansökningsfönstret 13 april–2 september
    gällde uttryckligen 2026 års omgång (avser satsningar 2027) — kan flytta något mellan år, verifiera datumen vid nästa
    omverifiering. Öppet även för företag, men skrivet här eftersom föreningar är en uttrycklig och central del av målgruppen
    (jämför Karlstads landsbygdsmedel, uteslutande föreningsriktat, samma specialkategori). Kommunen avsätter totalt 500 000
    kronor per år. Historiskt beviljade satsningar har varierat mellan cirka 15 000 och 80 000 kronor, men något publicerat
    tak per sökande anges inte.
