  krav_status: angivet
  krav_fullstandiga: false
  anteckning: Omfattar medlemsbidrag, lokal- och anläggningsbidrag samt aktivitetsbidrag i ett samlat ansökningsförfarande.
    Ansökningsperiod 1 januari–28 februari. Bilaga 1 (schablonbidrag för egna anläggningar, t.ex. fotbollsplan, ridbana, elljusspår,
    skidanläggning) omfattar även bygdegårdar/hembygdsgårdar som föreningsägd lokal — ingen separat bygdegårdsbidragsform
    finns i Vetlanda.
  senast_verifierad: '2026-08-03'
  giltighet_status: overifierat
