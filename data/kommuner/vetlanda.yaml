  beskrivning: Föreningen registrerar sig själv i föreningsregistret via e-tjänsten Friweb. Kräver att föreningen är ideell,
    har antagit stadgar, valt styrelse och varit verksam i minst ett år, har sitt säte i Vetlanda kommun, har minst tio registrerade
