- id: herrljunga-aktivitetsstod
  namn: Aktivitetsstöd
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara ideell, ha säte och verksamhet i Herrljunga, minst tio medlemmar 7–25 år, demokratiska stadgar, styrelse med minst tre personer, revisorer, organisationsnummer och föreningskonto
  - Föreningen ska vara ansluten till en godkänd riksorganisation eller godkännas av kommunen och lämna aktuella registeruppgifter, års-, ekonomi- och revisionshandlingar samt jämställdhetspolicy
  - Barn- och ungdomsverksamheten ska vara drogfri; föreningen ska ha antagen alkohol- och drogpolicy, utsedd droginformatör och redovisa det drogpreventiva arbetet
  - Stödberättigade deltagare är medlemmar 7–25 år; inom paraidrott finns ingen övre åldersgräns för deltagare eller ledare
  - Aktiviteten ska vara ledarledd, pågå minst 60 minuter med gemensam start och avslutning och omfatta 3–30 stödberättigade deltagare utöver ledaren
  - Ledaren ska vara utsedd av föreningen och minst 13 år, får bara ansvara för en grupp åt gången och högst två ledare 13–25 år får räknas per tillfälle
  - Minst 70 procent av den redovisade verksamheten ska vara knuten till föreningens godkända fritidsverksamhet och en deltagare får räknas högst en gång per dag och förening
  - Närvaro med ålder och kön för deltagare och ledare ska redovisas i föreningsregistret eller genom kommunfil, DAK-fil eller motsvarande styrkt underlag
  belopp: Ersättningen beräknas efter godkända sammankomster och deltagartillfällen; kommunen publicerar ingen aktuell kronnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: 1–7 dagar sent ger 10 procents avdrag, 8–14 dagar 20 procent, 15–21 dagar 30 procent och 22–28 dagar 40 procent; därefter betalas högst 35 procent av beräknat stöd.
