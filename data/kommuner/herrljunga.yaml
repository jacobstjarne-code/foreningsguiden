- id: herrljunga-kulturarrangemang-projekt
  namn: Kreativt kulturstöd till arrangemang och projekt
  kategori: [kultur]
  foreningstyp: [kultur, hembygd, annat]
  malgrupp: Ideella föreningar och andra icke-vinstdrivande juridiska personer som genomför publika kulturarrangemang eller projekt
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökanden ska vara en ideell förening, stiftelse eller annan juridisk person med icke-vinstdrivande verksamhet, ha säte och verksamhet i Herrljunga och vara demokratiskt uppbyggd
  - Ideell förening ska vara ansluten till en godkänd riksorganisation eller godkännas av kommunen; sökanden ska ha stadgar, styrelse, revisorer, organisationsnummer och föreningskonto
  - Arrangemanget eller projektet ska vara tillgängligt för allmänheten, i huvudsak genomföras i Herrljunga och utveckla en ny eller befintlig kulturform mot nya målgrupper
  - Kompletterande finansiering genom annan aktör, egen insats, biljettintäkter eller motsvarande krävs
  - Samma arrangemang eller projekt kan inte få stödet flera år i rad
  - Senaste verksamhets-, ekonomi-, revisions- och årsmöteshandlingar, jämställdhetspolicy och protokollsutdrag med beslut om satsningen ska finnas i föreningsregistret
  - Ansökan ska beskriva mål, syfte, budget och ansvarig kontaktperson
  - Ekonomiskt utfall, besöksantal och bedömning av genomslaget ska redovisas med bestyrkta underlag inom 60 dagar
