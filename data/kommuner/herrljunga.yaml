- id: herrljunga-stod-till-investeringar-och-satsningar
  namn: Utvecklingsstöd för investeringar och satsningar
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: *allatyper
  malgrupp: Föreningar med investeringar eller utvecklingssatsningar
  deadlines:
    typ: fasta
    datum:
    - 08-25
  krav:
  - Föreningen ska vara ansluten till en godkänd riksorganisation eller godkännas av kommunen, ha säte och verksamhet i Herrljunga och vara demokratiskt uppbyggd med öppna stadgar, styrelse, revisorer, organisationsnummer och föreningskonto
  - Aktuella registeruppgifter, verksamhetsberättelse, verksamhetsplan, resultat- och balansräkning, revisionsberättelse, årsmötesprotokoll samt jämställdhetspolicy eller motsvarande värdegrund ska finnas i föreningsregistret
  - Investeringen eller satsningen ska gynna föreningens medlemmar och allmänheten och prioriteras mot kommunens kultur- och fritidsplan; kompletterande finansiering ska sökas när det är möjligt
  - Investeringen eller satsningen bör inte påbörjas före beslut och förening som fått stöd kan normalt söka igen först efter tre år
  - 'För investeringar: kortfattad redogörelse för användning, karta/bild/ritningar, bestyrkt nyttjanderättshandling (t.ex.
    arrendeavtal) eller köpebevis/lagfart, investeringsbudget inklusive driftsbudget, finansieringsplan, föreningens senaste
    bokslut, bestyrkt protokollsutdrag från styrelse eller årsmöte med investeringsbeslut'
  - 'För satsningar: projektplan, budget, finansieringsplan, bestyrkt protokollsutdrag från styrelse eller årsmöte med beslut
    om satsningen'
  - Ansökan ska ange start- och slutdatum; efter avslutat projekt ska ekonomisk sammanställning, revisorsbestyrkta bokföringsutdrag och dokumentation lämnas inom sex månader
  belopp: Individuellt prioriterat stöd inom kvarvarande budget efter de fasta föreningsstöden; någon generell nivå publiceras inte
  belopp_avser: per_forening
