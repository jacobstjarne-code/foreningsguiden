    typ: fasta
    datum: [08-31]
  krav:
  - Sökanden ska vara en ideell organisation i Herrljunga kommun; kommunen sponsrar inte enskilda, företag, religiösa samfund, politiska organisationer eller kommunala bolag
  - Laget och dess representanter ska ge kommunen uppmärksamhet inom eller utanför kommungränsen och ha ett medialt intresse
  - Ansökan ska beskriva laget, hur pengarna ska användas, syftet i förhållande till kommunens mål samt kommunens och mottagarens motprestationer
  - Kommunens logotyp ska exponeras på organisationens webbplats och klubblokal samt, vid högre nivå, i annonsering och på lagets klubbdräkt
  - Ett skriftligt ettårigt sponsringsavtal ska tecknas och verksamheten ska bedrivas ansvarsfullt, lagligt och enligt god marknadsföringssed
  - Användningen av medlen ska redovisas senast tre månader efter avtalsperioden och innan en ny ansökan kan behandlas
