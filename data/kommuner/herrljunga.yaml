- id: herrljunga-snabba-slanten
  namn: Snabba slanten
  kategori:
  - kultur
  - ovrig
  malgrupp: Ungdomar och ungdomsgrupper som vill genomföra kultur- eller fritidsaktiviteter
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara 13 till 20 år (räknat från det år man fyller åren)
  - Projektet ska vara offentligt, öppet för alla och äga rum i Herrljunga kommun
  - Projektet får inte vara ordinarie föreningsverksamhet, skolprojekt, partipolitisk verksamhet eller redan etablerad verksamhet,
    och får inte vara vinstdrivande
  - Projektet ska genomföras på en plats fri från alkoholförsäljning
  - Ansökan ska innehålla projektplan samt en ekonomisk kalkyl
  - Bidraget beviljas högst två gånger per person och år, och kan bara sökas en gång för ett och samma projekt
  - Projektet ska redovisas senast en månad efter att det är genomfört
  belopp: null
  sen_ansokan: Ansökan behandlas löpande
