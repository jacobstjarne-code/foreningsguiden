  anteckning: null
- id: herrljunga-socialt-foreningsstod
  namn: Socialt föreningsstöd
  kategori: [social, funktionsratt, ovrig]
  foreningstyp: [social, annat]
  malgrupp: Föreningar med förebyggande eller rehabiliterande verksamhet
  deadlines:
    typ: fasta
    datum: [08-25]
  krav:
  - Föreningen ska ha antagit stadgar, valt styrelse och bedriva en av kommunen godkänd verksamhet
  - Föreningen får inte vara enbart beroende av bidrag för sin fortsatta existens och ska ha fastställt en medlemsavgift
  - Föreningen ska vara aktiv och utåtriktad, hålla regelbundna möten med bärande innehåll och följa förändringar inom sitt område
  - Föreningen ska arbeta förebyggande och/eller rehabiliterande för invånare i Herrljunga kommun
  - Ansökan ska innehålla verksamhetsberättelse, verksamhetsplan, bestyrkt resultat- och balansräkning samt revisionsberättelse
  - Föreningar som riktar sig till personer med psykisk eller fysisk funktionsnedsättning, missbruksproblem eller deras anhöriga prioriteras
  - Föreningen får inte få eller kunna få stöd från en annan kommunal nämnd eller styrelse; flerkommunal verksamhet beräknas efter invånarantal
  belopp: Individuellt prövat utifrån socialnämndens tillgängliga medel för kommande budgetår; någon generell nivå publiceras inte
