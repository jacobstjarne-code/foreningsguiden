  - Ett skriftligt sponsringsavtal ska tecknas och verksamheten ska bedrivas ansvarsfullt, lagligt och enligt god marknadsföringssed
  - Användningen av medlen ska redovisas senast tre månader efter aktiviteten eller evenemanget; inställt arrangemang eller utebliven redovisning kan ge återbetalningskrav
