- id: tingsryd-lovbidrag
  namn: Lovaktivitetsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som ordnar kostnadsfria lovaktiviteter för barn och unga
  deadlines: {typ: relativ, datum: []}
  krav:
  - Aktiviteten ska vara kostnadsfri och rikta sig till barn och unga i åldern 6–15 år
  - Aktiviteten ska ge stimulans och personlig utveckling, främja deltagande och integration samt skapa kontakter mellan barn med olika social bakgrund
  - Alla barn ska behandlas lika i fråga om tillgång och deltagande och ingen behovsprövning får göras
  - Ansökan ska lämnas senast två veckor före sport-, påsk-, sommar-, höst- eller jullovet
  - Genomförd aktivitet ska redovisas i kommunens e-tjänst senast två månader efteråt
  belopp: Kommunen publicerar ingen generell beloppsnivå
