- id: tingsryd-evenemangsstod-mindre-arrangemang
  namn: Evenemangsstöd – mindre arrangemang
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar som ordnar mindre offentliga evenemang
  deadlines: {typ: relativ, datum: []}
  krav:
  - Evenemanget ska ha ett allmänintresse, välkomna alla grupper och marknadsföras till allmänheten
  - Evenemanget ska ha fastställd entré- eller biljettavgift, gage- eller hyreskostnader och en förväntad publik på minst 25 personer
  - Ansökan ska lämnas före evenemanget och ange sponsorer och medarrangörer samt deras ekonomiska insatser
  - Årsmöten samt kostnader för fika, mat och marknadsföring är inte stödberättigade
  - Efter evenemanget ska faktisk publik och könsfördelning redovisas innan utbetalning kan ske
  belopp: Högst 150 kr per såld biljett eller entré och aldrig mer än det maxbelopp som beviljades före evenemanget
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Stödet kan sökas hela året men ansökan ska lämnas innan evenemanget äger rum
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
