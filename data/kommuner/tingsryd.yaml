  malgrupp: Föreningar i kommunen som bokar kommunala lokaler eller idrottsanläggningar
  deadlines: {typ: okand, datum: []}
  krav:
  - Bokningen ska avse en kommunal idrottshall, gymnastiksal, isanläggning, konstgräsplan eller annan lokal där föreningstaxa gäller
  - Den lägre ungdomstaxan gäller ledarledd ungdomsverksamhet i en förening
  - Den lokala föreningstaxan förutsätter att föreningen är verksam i Tingsryds kommun
  - Bokningsförfrågan ska lämnas i god tid och en helgbokning senast två vardagar före önskad tid
  belopp: Föreningstaxan 2026 är från 54 kr per timme för ledarledd ungdomsverksamhet, 108 kr för seniorverksamhet, 100 kr för halv konstgräsplan och 165 kr för ungdomsverksamhet i Dackehallen
