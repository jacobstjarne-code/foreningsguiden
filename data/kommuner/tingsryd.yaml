- id: tingsryd-verksamhetsstod
  namn: Verksamhetsstöd
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade barn-, ungdoms-, fritids-, kultur-, samlingslokals- samt individ- och samhällsfrämjande föreningar
  deadlines: {typ: fasta, datum: [02-15]}
  krav:
  - Föreningen ska vara verksam i Tingsryds kommun, öppen för alla, demokratiskt uppbyggd och registrerad i kommunens föreningsregister
  - Föreningen ska ha godkända stadgar, organisationsnummer, föreningskonto, aktuellt medlemsregister, dokumenterad verksamhet och egen ekonomisk bärkraft
  - Verksamheten ska följa svensk lag, barnkonventionen, diskrimineringsgrunderna och kommunens krav på alkohol-, drog- och dopningsfri miljö
  - Ansökan ska innehålla verksamhetsberättelse, resultat- och balansrapport samt revisionsberättelse; vid första ansökan även stadgar och kommunens efterfrågade policyer och planer
  - Föreningar med regelbunden barn- och ungdomsverksamhet ska kontrollera berörda ledares begränsade registerutdrag och intyga detta i den årliga ansökan
  belopp: Barn-, ungdoms- och fritidsföreningar kan få bland annat 5 kr per deltagartillfälle och anläggningsschabloner; kulturföreningar högst 15 000 kr; samlingslokaler grundbidrag högst 5 000 kr eller 60 kr per kvm samt högst 70 kr per uthyrning; lokala utvecklingsgrupper högst 7 000 kr, pensionärsföreningar högst 5 000 kr och övriga föreningar högst 4 000 kr
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioden är 1 december–15 februari; komplett ansökan och föreningshandlingar ska vara inne senast 15 februari
