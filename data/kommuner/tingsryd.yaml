  deadlines: {typ: fasta, datum: [04-30]}
  krav:
  - Investeringen ska avse en föreningsägd anläggning eller lokal eller inköp av betydelsefull utrustning
  - Ansökan ska lämnas och beviljas innan investeringen eller arbetet påbörjas
  - Kostnadskalkyl och relevanta offerter ska bifogas och föreningen bör ha undersökt annan medfinansiering
