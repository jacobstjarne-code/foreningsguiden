  malgrupp: Studieförbund som bedriver folkbildningsverksamhet i Tingsryds kommun
  deadlines: {typ: okand, datum: []}
  krav:
  - Studieförbundet ska bedriva och redovisa verksamhet i Tingsryds kommun
  - Redovisningen ska omfatta deltagartimmar som rapporterats till SCB inom studiecirklar, annan gruppverksamhet och kulturprogram
  - Kommunen fördelar det årliga anslaget mellan studieförbunden efter redovisad lokal verksamhet
  - Studieförbundet ska lämna de verksamhets- och ekonomiska underlag som kommunen begär för beslut och uppföljning
