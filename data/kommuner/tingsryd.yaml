bidrag:
- namn: Verksamhetsstöd
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 12-01
    - 02-15
  krav:
  - Föreningen är verksam i Tingsryds kommun
  - Föreningen är öppen för alla och har ett aktuellt medlemsregister med spårbar medlemsidentitet
  - Föreningens verksamhet är demokratisk och följer svensk lagstiftning, barnkonventionen och principen om alla människors
    lika värde
  - Föreningen följer diskrimineringsgrunderna enligt svensk lagstiftning
  - Föreningen verkar mot doping och droger; aktiviteter bedrivs i alkohol- och drogfri miljö
  - Föreningen har godkända stadgar
  - Föreningen är registrerad i kommunens föreningsregister
  - Föreningen har dokumenterad verksamhet och egen ekonomisk bärighet
  - Föreningen har giltigt bank-, plusgiro- eller postgirokonto samt organisationsnummer
  - Föreningen håller årsmöte där verksamhetsberättelse, resultat- och balansräkning samt revisionsberättelse godkänns
  - Föreningen ska årligen skicka in verksamhetsberättelse, resultatrapport, balansrapport och revisionsberättelse
  - Vid första ansökan ska även drogpolicy, jämställdhetsplan, tillgänglighetsplan, hållbarhetsplan, plan mot mobbning och
    särbehandling samt stadgar skickas in
  - Från och med 2020 ska föreningen begära begränsat registerutdrag ur belastningsregistret för ledare med direkt och regelbunden
    kontakt med barn
  belopp: 'Varierar per föreningskategori enligt Riktlinjer för föreningsstöd: barn-/ungdoms-/fritidsföreningar t.ex. aktivitetsbidrag
    5 kr/deltagartillfälle och driftsbidrag enligt anläggningsschablon; kulturföreningar (bl.a. hembygdsföreningar) max 15
    000 kr; samlingslokalägande föreningar grundbidrag upp till 5 000 kr eller 60 kr/kvm samt aktivitetsbidrag max 70 kr/tillfälle;
    pensionärsföreningar upp till 5 000 kr; övriga föreningar upp till 4 000 kr.'
  sen_ansokan: Ansökningsperiod 1 december–15 februari. Sen ansökan efter detta datum är inte angiven i källan.
  kalla_url: https://tingsryd.se/wp-content/uploads/2025/05/riktlinjer-for-foreningsstod-2311061.pdf
  belopp_status: olast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Engångsbelopp, kan endast sökas en gång per år. Beslut fattas av teknik- och fritidsnämnden. Möjlighet finns
    till dialogmöte med kommunen om vad stödet ska omfatta.
  id: tingsryd-verksamhetsstod
- namn: Evenemangsstöd – mindre arrangemang
  kategori:
  - kultur
  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Evenemanget ska välkomna alla grupper i samhället och marknadsföras till allmänheten
  - Evenemanget ska ha en fastställd entré- eller biljettavgift samt utgifter i form av gager och hyreskostnader
  - Förväntad publik bör vara minst 25 personer
  - Årsmöten är inte bidragsberättigade; kostnader för fika, mat eller marknadsföring räknas inte in
  - Ansökan om stödet ska göras innan evenemanget äger rum
  - Redovisning av antal kvinnor respektive män som besökt evenemanget krävs för att utbetalning ska ske
  - I ansökan ska det framgå vilka som sponsrar eller är medarrangör, samt med vilket belopp
  - Redovisning ska göras i e-tjänsten Evenemangsstöd redovisning – mindre arrangemang snarast efter avslutat evenemang
  belopp: Upp till 150 kr per såld biljett eller entré (förlustgaranti). Ett maxbelopp fastställs vid beviljande och stödet
    kan aldrig överstiga detta, oavsett faktisk publiksiffra.
  sen_ansokan: Kan sökas hela året, men ansökan ska göras innan evenemanget äger rum. Sen ansökan efter genomfört evenemang
    är inte möjlig enligt källan.
  kalla_url: https://tingsryd.se/wp-content/uploads/2025/05/riktlinjer-for-foreningsstod-2311061.pdf
  belopp_status: olast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kallas förlustgaranti i riktlinjerna. Bidraget överstiger aldrig 150 kr per såld biljett eller entré, och aldrig
    det maxbelopp som beviljats innan evenemanget.
  id: tingsryd-evenemangsstod-mindre-arrangemang
- namn: Evenemangsstöd – större arrangemang
  kategori:
  - kultur
  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 01-01
    - 04-30
  krav:
  - Evenemanget ska ha ett allmänintresse, till exempel konserter, utställningar eller festivaler
  - Arrangemanget ska bedömas vara av stort värde för kommunen utifrån antal besökare från ett stort upptagningsområde
  - Ingen sponsring från kommunen ges om stödet beviljas
  - Tingsryds kommuns logotyp ska synas i evenemangets marknadsföring; planerad exponering ska framgå i ansökan
  - Redovisning av antal kvinnor respektive män som närvarat krävs för att utbetalning ska ske
  - Redovisning ska göras i e-tjänsten Evenemangsstöd redovisning – större arrangemang snarast efter avslutat evenemang
  belopp: Beloppet fastställs individuellt av teknik- och fritidsnämnden utifrån evenemangets värde för kommunen; ingen fast
    schablon anges i källan.
  sen_ansokan: Ansökningsperiod 1 januari–30 april. Sen ansökan efter detta datum är inte angiven i källan.
  kalla_url: https://tingsryd.se/wp-content/uploads/2025/05/riktlinjer-for-foreningsstod-2311061.pdf
  belopp_status: olast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökningar behandlas av teknik- och fritidsnämnden som fastställer beloppet i varje enskilt fall.
  id: tingsryd-evenemangsstod-storre-arrangemang
- namn: Investeringsstöd
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 01-01
    - 04-30
  krav:
  - Stödet gäller föreningsägd anläggning eller lokal, eller inköp av betydelsefull utrustning
  - Ansökan ska göras innan investeringen påbörjas; påbörjade arbeten och investeringar godkänns inte
  - Ansökan ska göras tillsammans med kostnadskalkyl och eventuella offerter
  - Föreningen bör ha undersökt om det finns eventuella medfinansiärer
  - Periodiskt underhåll medges inte som investering
  - Efter avslutad investering ska redovisning med bifogade fakturor skickas in för att utbetalning ska ske, via e-tjänsten
    Investeringsstöd redovisning
  belopp: 30 % av redovisade kostnader, dock max 25 000 kr. I vissa fall kan högre belopp beviljas vid samansökan med t.ex.
    Boverket, vilket kräver 30 % kommunal delfinansiering och prövas separat.
  sen_ansokan: Ansökningsperiod 1 januari–30 april. Ansökan måste vara beviljad innan investeringen påbörjas; sen ansökan
    för redan påbörjad investering godkänns inte.
  kalla_url: https://tingsryd.se/wp-content/uploads/2025/05/riktlinjer-for-foreningsstod-2311061.pdf
  belopp_status: olast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet betalas ut efter slutredovisning.
  id: tingsryd-investeringsstod
- namn: Utvecklingsstöd
  kategori:
  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 01-01
    - 04-30
  krav:
  - Sökande organisation får inte falla inom ramen för övriga föreningsstöd (verksamhets-, evenemangs- eller investeringsstöd)
  - Stödet är ett arrangörsstöd/uppmuntrande bidrag, till exempel för lokala utvecklingsgrupper, jourverksamhet av ideell
    karaktär eller projekt
  - Nattpatruller kan söka upp till 5 000 kr, bedöms utifrån verksamhet
  - Individ- och samhällsfrämjande föreningar/organisationer kan söka upp till 4 000 kr, bedöms utifrån verksamhet
  - Specifika arrangemang prövas i varje enskilt fall
  belopp: 'Varierar per delkategori: nattpatruller upp till 5 000 kr; individ- och samhällsfrämjande föreningar/organisationer
    upp till 4 000 kr; specifika arrangemang prövas i varje enskilt fall utan angivet maxbelopp.'
  sen_ansokan: Ansökningsperiod 1 januari–30 april. Sen ansökan efter detta datum är inte angiven i källan.
  kalla_url: https://tingsryd.se/wp-content/uploads/2025/05/riktlinjer-for-foreningsstod-2311061.pdf
  belopp_status: olast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Avsett för organisationer som inte faller inom ramen för övriga föreningsstöd.
  id: tingsryd-utvecklingsstod
- namn: Lovbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar som ordnar lovaktiviteter för barn och unga
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Kan sökas av föreningar, evenemangsbolag, övriga arrangörer och entreprenörer
  - Ansökan ska göras senast två veckor innan avsett skollov (sportlov, påsklov, sommarlov, höstlov, jullov)
  - Aktiviteterna ska vara kostnadsfria för barn och unga i åldrarna 6–15 år
  - Aktiviteterna ska ge barn och unga stimulans och personlig utveckling
  - Aktiviteterna ska stimulera barns och ungas deltagande, främja integration och skapa nya kontaktytor mellan barn med olika
    social bakgrund
  - Ingen behovsprövning får göras av de barn som deltar
  - Redovisning ska göras via e-tjänsten Redovisning för lovaktiviteter efter genomförd aktivitet
  belopp: null
  sen_ansokan: Kan sökas hela året, dock senast två veckor innan avsett lov. Ansökan efter denna tidsfrist är inte angiven
    i källan.
  kalla_url: https://tingsryd.se/wp-content/uploads/2025/05/riktlinjer-for-foreningsstod-2311061.pdf
  belopp_status: okand
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Öppet även för evenemangsbolag, övriga arrangörer och entreprenörer, inte enbart föreningar.
  id: tingsryd-lovbidrag
