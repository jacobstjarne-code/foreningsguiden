- id: tingsryd-kulturnatten-2026
  namn: Bidrag till kulturevenemang under Kulturnatten 2026
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar och organisationer med verksamhet i Tingsryds kommun som arrangerar under Kulturnatten
  deadlines: {typ: fasta, datum: [08-23]}
  krav:
  - Föreningen ska vara godkänd och registrerad i kommunens föreningsregister och den ansvariga arrangören ska vara över 18 år
  - Evenemanget ska genomföras i Tingsryds tätort under Kulturnatten den 7 november 2026
  - Evenemanget ska vara publikt, alkohol- och drogfritt, ha fri entré och ha kulturellt eller konstnärligt innehåll
  - Arrangören ansvarar för säkerhet, tillstånd, försäkringar, teknik och marknadsföring med kommunens och Kulturnattens logotyper
  - Om evenemanget inte genomförs ska det beviljade bidraget återbetalas
  belopp: Högst 20 000 kr per förening eller organisation
  belopp_avser: per_forening
  kommunens_pott: 100 000 kr för Kulturnatten 2026
  sen_ansokan: Sista ansökningsdag är 23 augusti 2026; sena eller ofullständiga ansökningar behandlas inte
  kalla_url: &kulturnatt https://bibliotek.tingsryd.se/-/kulturnatten-2026
