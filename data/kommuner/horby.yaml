- id: horby-verksamhetsbidrag
  namn: Verksamhetsbidrag
  kategori:
  - kultur
  malgrupp: Föreningar med egen lokal
  deadlines:
    typ: fasta
    datum:
    - 10-31
  krav:
  - Verksamheten ska bidra till att skapa ett varierat kulturliv i kommunen
  - Byföreningars verksamhet ska bidra till gemenskap i byarna på landsbygden i kommunen
  - Hembygdsföreningars verksamhet ska bidra till att värna kultur- och/eller hembygdshistoria
  - 'Bidrag söks för godkända lokalkostnader: hyra, arrende, el, värme, vatten, sophantering, försäkring och löpande underhåll'
  - Ansökan ska innehålla verksamhetsplan, ekonomisk kalkyl för ansökt år och förenklad verksamhetsberättelse för innevarande
    år
  belopp: Maximalt 45 procent av godkända lokalkostnader (hyra, arrende, el, värme, vatten, sophantering, försäkring, löpande
    underhåll)
  sen_ansokan: 'Möjlig men medför avdrag: 1-14 dagar sen ger 5% avdrag på godkänt bidragsbelopp, 15-30 dagar sen ger 10% avdrag;
    efter 30 dagar behandlas inte ansökan'
  kalla_url: https://fri.horby.se/bidrag/ansokaninfo.aspx?type=32&year=2025
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: En ansökan per år, senast 31 oktober (ej två gånger per år som tidigare stod). Gäller kulturföreningar, byföreningar
    och hembygdsföreningar.
- id: horby-studieförbund
  namn: Studieförbundsbidrag
  kategori:
  - kultur
  malgrupp: Studieförbund
  deadlines:
    typ: fasta
    datum:
    - 02-28
  krav:
  - Studieförbundet ska vara godkänt av Folkbildningsrådet och berättigat till statsbidrag
  - Bidrag fördelas utifrån poäng för verksamhet inom kommunens prioriterade områden under föregående år
  - Studieförbundet ska redovisa verksamheten (studiecirklar, kulturprogram, annan folkbildande verksamhet) enligt mall från
    Kultur- och Fritid
  - Bidrag för samarbeten i kulturprogram och annan folkbildande verksamhet ges endast om studieförbundet haft en avgörande
    roll i samarbetet
