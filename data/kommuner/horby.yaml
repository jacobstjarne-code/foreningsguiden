bidrag:
- id: horby-evenemangsbidrag
  namn: Evenemangsbidrag
  kategori:
  - kultur
  - idrott
  malgrupp: Föreningar för offentliga arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Öppet för allmänheten
  - God kvalitet, kunnande, kreativitet och kompetens hos arrangören
  - Bidrar till Hörbys attraktionskraft och marknadsför kommunen positivt
  - Präglas av kreativitet, gemenskap och framtidstro
  - Religiöst och politiskt obundet
  - Välgörenhetsevenemang måste vara gratis att besöka för att få bidrag
  - Ges ej till evenemang som gynnar enskilda personers ekonomiska intressen, anordnas av kommunen eller avser investeringar
    i utrustning
  - Vid återkommande evenemang ges bidrag max 3 gånger för samma/liknande evenemang per förening
  - Ska genomföras inom Hörby kommuns gränser (undantag vid samverkan med Mitt Skånes kommuner, t.ex. Höör och Eslöv)
  belopp: Totalt maximalt 40 000 kr delas ut i evenemangsbidrag per år; bidraget kan utgöra en del eller merparten av evenemangets
    kostnader, ej fast belopp per ansökan
  sen_ansokan: Löpande, men ansökan måste lämnas senast 1 månad innan evenemanget arrangeras; bidrag beviljas ej retroaktivt
  kalla_url: https://fri.horby.se/bidrag/ansokaninfo.aspx?type=39&year=2025
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 40 000 kr är kommunens totala årliga budget för evenemangsbidrag, inte ett tak per ansökan. Ansökan senast 1
    månad innan evenemanget.
- id: horby-aktivitetsbidrag
  namn: Lokalt aktivitetsstöd 7-25 år
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för ungdomar 7-25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Minst tre deltagare i ledarledd aktivitet om lägst 60 minuter (ledaren måste vara minst 15 år)
  - Max 30 deltagare per gruppaktivitet är bidragsberättigade
  - Sammankomsten ska genomföras av föreningen själv, inte av riks- eller distriktsorganisationen
  - Närvarokort ska föras och vara tillgängliga i minst 3 år
  - Minst 10 godkända sammankomster per termin (1/1-30/6 respektive 1/7-31/12)
  - Bidrag ges endast till aktivt utövande/skapande, ej t.ex. styrelsemöten, föreläsningar eller åskådande vid idrottsevenemang
  - Bidrag ges inte till studiecirklar eller kommersiella arrangemang som danser, bingo eller medlemsträffar
  - Endast ett bidragstillfälle per dag oavsett antal deltagare eller aktivitetens längd
  belopp: 'Verksamhetsbidrag per deltagare och tillfälle: 7-12 år 7 kr, 13-16 år 13 kr, 17-20 år 10 kr, 21-25 år 7 kr'
  sen_ansokan: 'Möjlig men medför avdrag: 1-14 dagar sen ger 5% avdrag på godkänt bidragsbelopp, 15-30 dagar sen ger 10% avdrag;
    efter 30 dagar behandlas inte ansökan'
  kalla_url: https://fri.horby.se/bidrag/default.aspx
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökningsdatum är 25 februari och 25 augusti (ej 15:e). Bidraget är en del av samma regelverk som gäller för
    60+ och funktionsnedsatta.
