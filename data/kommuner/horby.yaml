  senast_verifierad: '2026-08-18'
- id: horby-aktivitetsbidrag
  namn: Verksamhetsbidrag 7–25 år, 60+ och funktionsnedsatta
  kategori: [idrott, kultur, pensionar, funktionsratt, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med aktiviteter för 7–25-åringar, personer 60+ eller personer med funktionsnedsättning
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Minst tre deltagare i ledarledd aktivitet om lägst 45 minuter; ledaren ska vara minst 15 år
  - Max 30 deltagare per gruppaktivitet är bidragsberättigade
  - Sammankomsten ska genomföras av föreningen själv, inte av riks- eller distriktsorganisationen
  - Närvarokort ska föras och vara tillgängliga i minst 3 år
  - Minst 10 godkända sammankomster per termin (1/1-30/6 respektive 1/7-31/12)
  - Bidrag ges endast till aktivt utövande/skapande, ej t.ex. styrelsemöten, föreläsningar eller åskådande vid idrottsevenemang
  - Bidrag ges inte till studiecirklar eller kommersiella arrangemang som danser, bingo eller medlemsträffar
  - Endast ett bidragstillfälle per dag oavsett antal deltagare eller aktivitetens längd
  - För 7–9 år får högst tre och för 10–25 år högst fem aktiviteter per vecka räknas; funktionsnedsatta från 26 år följer femgränsen
  belopp: 'Per deltagare och tillfälle: 7–12 år 7 kr, 13–16 år 13 kr, 17–20 år 10 kr, 21–25 år 7 kr, 60+ 7 kr och funktionsnedsatta i alla åldrar 25 kr; hela årsbudgeten för 7–25 år könsutjämnas'
  belopp_avser: per_forening
  kommunens_pott: Hela årets budgeterade verksamhetsbidrag fördelas; totalsumman publiceras inte
  sen_ansokan: 'Möjlig men medför avdrag: 1-14 dagar sen ger 5% avdrag på godkänt bidragsbelopp, 15-30 dagar sen ger 10% avdrag;
    efter 30 dagar behandlas inte ansökan'
  kalla_url: https://fri.horby.se/bidrag/ansokaninfo.aspx?type=1&year=2026
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-18'
