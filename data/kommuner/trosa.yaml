  status: aktiv
  kategori: [idrott, kultur, social, pensionar, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Nystartade bidragsberättigade föreningar
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara nystartad och ha varit verksam i högst 12 månader
  - Kultur- och fritidsnämnden ska ha godkänt föreningen som bidragsberättigad
  - Föreningen ska vara demokratisk, partipolitiskt och religiöst obunden, öppen och ta ut medlemsavgift
  - Organisationsnummer, föreningskonto, styrelseuppgifter och verksamhetsplan ska finnas eller vara under ansökan
  - Föreningar för barn och unga ska arbeta mot kränkningar och ANDT samt kontrollera barnledares belastningsregister
  belopp: 3 000 kr som automatiskt engångsbidrag för första verksamhetsåret
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Stödet betalas ut i samband med beslutet om bidragsberättigande.
  kalla_url: &norm https://cms.trosa.se/wp-content/uploads/2023/12/regler-for-foreningsbidrag-2024-2027-1.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-18'
- id: trosa-aktivitetsbidrag-idrott
  namn: Aktivitetsbidrag för idrottsföreningar
  status: aktiv
  kategori: [idrott]
  foreningstyp: [idrott]
  malgrupp: Bidragsberättigade idrottsföreningar med verksamhet för barn och unga
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska uppfylla Riksidrottsförbundets föreskrifter för statligt LOK-stöd
  - Aktiviteten ska ske i föreningens regi, vara ledarledd och pågå minst 60 minuter inklusive omklädning
  - Minst tre bidragsberättigade deltagare utöver ledaren ska vara 7–25 år; stöd kan även lämnas för ledare 13–25 år
  - Ledaren ska vara utsedd av föreningen och ha fyllt 13 år
  - Gruppen får inte delas för att skapa flera sammankomster och en deltagare får bara räknas en gång per dag
  - Föreningen ska kunna redovisa antal sammankomster, deltagare och närvarounderlag
  belopp: 19,80 kr per godkänd sammankomst och 16,50 kr per godkänd deltagare
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen gemensam sista ansökningsdag i den gällande regeln.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-18'
- id: trosa-studieforbund
  namn: Bidrag till studieförbund
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Studieförbund som bedriver folkbildningsverksamhet i Trosa kommun
  deadlines:
    typ: okand
    datum: []
  krav:
  - Studieförbundet ska bedriva folkbildningsverksamhet i Trosa kommun
  - Studieförbundet ska uppfylla statens och Folkbildningsrådets villkor för statsbidrag
  - Verksamheten ska bidra till demokrati, delaktighet, minskade utbildningsklyftor och ett breddat kulturliv
  - Verksamhetsunderlag ska lämnas så att den kommunala andelen kan fördelas genom Länsbildningsförbundet Sörmland
  - Kommunen ska kunna kontrollera den lokala verksamheten och användningen av stödet
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Årligt kommunanslag fördelas mellan statsbidragsberättigade studieförbund genom Länsbildningsförbundet Sörmland; totalsumman och 2026 års fördelningsnyckel publiceras inte
  sen_ansokan: Kommunen publicerar ingen generell sista ansökningsdag.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Den separata skannade 1998-regeln anger den äldre modellen 70 procent grund, 10 procent volym och 20 procent målgrupp; 2024–2027-regeln säger att senare Folkbildningsrådsmodell ska styra, därför används inte 1998-procentsatserna som aktuell nivå.
  senast_verifierad: '2026-08-18'
- id: trosa-ledarutbildningsbidrag
  namn: Ledarutbildningsbidrag
  status: aktiv
  kategori: [idrott]
  foreningstyp: [idrott]
  malgrupp: Idrottsföreningar som utbildar ledare för sin verksamhet
  deadlines: {typ: relativ, datum: []}
  krav:
  - Föreningen ska uppfylla Riksidrottsförbundets villkor för statligt LOK-stöd
  - Utbildningen ska skapa eller höja kompetens som hjälper föreningen att nå sina stadgeenliga mål
  - Kursdeltagaren ska vara minst 13 år och efter utbildningen verka i föreningens verksamhet
  - Intern utbildnings kursplan, kostnadskalkyl och deltagarantal ska godkännas av kommunen före genomförandet
  - Bevis på genomförd utbildning och föreningens faktiska nettokostnader ska bifogas ansökan
  - Kongress, förbundsmöte, läger eller motsvarande ger inte stöd
  belopp: 75 procent av föreningens faktiska nettokostnader för ledarutbildning inklusive resor
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Sök retroaktivt under samma kalenderår eller senast en månad efter utbildningen.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: En förening som inte tillhör en riksorganisation kan beviljas stöd efter särskild prövning.
  senast_verifierad: '2026-08-18'
- id: trosa-verksamhetsbidrag-kultur
  namn: Verksamhetsbidrag för kulturföreningar
  status: aktiv
  kategori: [kultur]
  foreningstyp: [kultur, hembygd]
  malgrupp: Bidragsberättigade kulturföreningar med planerad verksamhet i Trosa kommun
  deadlines: {typ: fasta, datum: [03-31, 09-30]}
  krav:
  - Föreningen ska vara godkänd i kommunens kategori kulturförening
  - Ansökan ska baseras på planerad verksamhet under innevarande år
  - Aktiviteterna ska genomföras i Trosa kommun
  - Helår eller första halvår söks senast 31 mars; andra halvår söks senast 30 september
  - Samtliga aktiviteter i verksamhetsplanen ska redovisas efter avslutad period
  - Prioriterade målgrupper är barn och unga, nyanlända och personer med funktionsvariation
  belopp: 77 kr per medlem, 1 000 kr per öppen aktivitet, 2 000 kr per aktivitet för prioriterad målgrupp och 400 kr per dag för konstutställning; högst 40 000 kr per år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Helår och första halvår senast 31 mars; andra halvår senast 30 september.
