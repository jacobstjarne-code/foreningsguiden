- id: trosa-arrangemangsbidrag
  namn: Arrangemangsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar som genomför offentliga arrangemang i kommunen
  deadlines: {typ: relativ, datum: []}
  krav:
  - Arrangemanget ska äga rum i Trosa kommun och vara öppet för allmänheten
  - Arrangemanget ska vara oplanerat och inte ingå i föreningens verksamhetsplan för året
  - Föreningen ska ha andra finansieringsmöjligheter och redovisa dem i kostnadskalkylen
  - Ansökan ska innehålla en fullständig kostnadskalkyl
  - Arrangemanget och dess ekonomi ska redovisas under samma kalenderår
  - Utbetalning sker efter genomfört och godkänt redovisat arrangemang
