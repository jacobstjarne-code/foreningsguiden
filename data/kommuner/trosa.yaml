- id: trosa-driftbidrag-lokal-anlaggning
  namn: Driftbidrag för lokal och anläggning
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar som driver, förvaltar eller hyr icke kommunal lokal eller anläggning
  deadlines: {typ: okand, datum: []}
  krav:
  - Föreningen ska driva, förvalta eller hyra en lokal eller anläggning som inte ägs eller redan subventioneras av kommunen
  - Kommunens godkännande ska inhämtas före förändring eller nyanskaffning av lokal eller anläggning
  - Bidragsgrundande löpande kostnader är hyra, amortering, ränta, uppvärmning, förbrukningsel, försäkring, sophämtning och sotning
  - Nettokostnader ska redovisas och hyresförening ska ha hyreskontrakt
  - Kommunal lokal ger inte kontant driftbidrag eftersom den redan hyrs till subventionerad föreningstaxa
  belopp: Idrottsförening får högst 60 procent av nettokostnaden och högst 110 000 kr; kultur-, social- och pensionärsförening högst 40 procent och 44 000 kr
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen gemensam sista ansökningsdag i den gällande regeln.
