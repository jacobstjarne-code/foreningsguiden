- id: trosa-utvecklingsprojekt-sarskilda-insatser
  namn: Stöd för utvecklingsprojekt och särskilda insatser
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar med längre eller fördjupade projekt och lokalanpassningar
  deadlines: {typ: okand, datum: []}
  krav:
  - Kultur-, social- och pensionärsförening ska vara bidragsberättigad och inte vinstdrivande; idrottsförening ska dessutom uppfylla aktivitetsbidragets krav
  - Projektet ska testa en ny verksamhetsgren, rikta sig till särskild målgrupp eller vara en annan fördjupad utvecklingsinsats
  - Lokalanpassning kräver egen lokal eller förstahandskontrakt för icke kommunal lokal; idrottsförening ska ha redovisat minst 50 aktivitetstillfällen föregående år
  - Prioritering görs för barn och unga, nyanlända, personer med funktionsvariation, folkhälsa, samverkan och målgruppsinflytande
  - Budgeten ska innehålla minst två leverantörsofferter samt tidplan
  - Ordinarie verksamhet och underhåll ger inte stöd; projektet ska redovisas efter genomförandet
  belopp: Högst ett prisbasbelopp per projekt
