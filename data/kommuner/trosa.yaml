- id: trosa-subventionerad-foreningstaxa
  namn: Subventionerad föreningstaxa i kommunala lokaler
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar och godkända ideella organisationer som bokar kommunala lokaler
  deadlines: {typ: okand, datum: []}
  krav:
  - Bidragsberättigad förening får föreningstaxa; annan förening eller organisation kan få den för en öppen, ideell, politiskt och religiöst obunden sammankomst efter prövning
  - Bokningen ska avse en lokal eller anläggning i kommunens aktuella taxebeslut
  - Sluten eller kommersiell sammankomst av icke bidragsberättigad förening debiteras privattaxa och ger inte subventionen
  - Bokaren ska följa kommunens hyres-, ordnings-, städ- och avbokningsregler
  belopp: Föreningstaxan är 40 procent av privattaxan; 2026 exempelvis 199 kr per timme för hel Multum- eller Hedebyhall mot 497 kr privat och 73 kr för gymnastiksal mot 186 kr privat
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ingen gemensam sista ansökningsdag publiceras; lokalen bokas enligt tillgänglighet och hyresregler.
  kalla_url: https://www.trosa.se/app/uploads/2026/06/kfn_2026_28-taxor-for-uthyrning-av-kommunala-lokaler.pdf
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Föreningsbidragsregeln likställer uttryckligen den subventionerade föreningstaxan med kontantstöd.
  senast_verifierad: '2026-08-18'
