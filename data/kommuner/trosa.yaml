  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Procentsats och tak gäller både egenägd och externt hyrd lokal eller anläggning inom respektive föreningskategori.
