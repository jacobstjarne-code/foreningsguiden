  vad: Årlig redovisning för fortsatt bidragsberättigande
  beskrivning: För fortsatt bidragsberättigande ska föreningen varje år redovisa föregående års verksamhetsberättelse och reviderade årsredovisning samt kommande budget och verksamhetsplan, ungdomsekonomi och medlemsantal fördelat på ålder och kön. Registeruppgifterna ska också uppdateras årligen.
  system: Interbook GO
