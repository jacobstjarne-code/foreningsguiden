  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Redovisningsperioder 1 januari–30 juni och 1 juli–31 december. Ansökan senast 25 februari respektive 25 augusti,
    bidraget utbetalas i oktober respektive april (ordning enligt källan).
  senast_verifierad: '2026-08-18'
