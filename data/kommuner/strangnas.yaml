- id: strangnas-foreningsbidrag-social
  namn: Föreningsbidrag (socialnämnden)
  kategori:
  - social
  malgrupp: Ideella, demokratiska föreningar registrerade hos Skatteverket vars verksamhet är förenlig med socialtjänstens
    mål (SoL och LSS) och riktar sig till kommunens invånare
  foreningstyp: [social]
  deadlines:
    typ: fasta
    datum:
    - 05-15
  krav:
  - Ideell, demokratisk förening med registreringsbevis från Skatteverket
  - Verksamheten ska förebygga, komplettera, stödja eller ersätta delar av socialtjänstens egna insatser
  - Verksamheten ska rikta sig till Strängnäs kommuns invånare
  - Föreningen ska ha tillräckliga förutsättningar att genomföra den sökta verksamheten
  - Ansökan ska visa hur föreningen kompletterar socialtjänstens insatser och ange om medel redan sökts/beviljats från annan
    bidragsgivare
  belopp: Beloppet beslutas av socialnämnden efter bedömning av ansökan och tillgänglig budget
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: För sent inkommen ansökan ger inte rätt till bidrag.
  kalla_url: https://www.strangnas.se/omsorg-och-hjalp/pengar-bidrag-och-ekonomi/foreningsbidrag
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan (senast 15 maj året före bidragsåret) görs i e-tjänst eller på blankett och ska vara socialkontoret
    tillhanda. Slutligt beslut fattas av socialnämnden under hösten, bidrag betalas ut i december. Ansökan ska bland annat
    innehålla stadgar, årsmöteshandlingar, drog- och alkoholpolicy och organisationsnummer.
  senast_verifierad: '2026-08-18'
