- id: strangnas-fritidsbidrag-aktivitetsbidrag
  namn: Fritidsbidrag — Aktivitetsbidrag
  kategori:
  - idrott
  - funktionsratt
  malgrupp: Barn och ungdomar 7-25 år i föreningens ledarledda gruppaktiviteter (ingen övre åldersgräns för funktionsrättsorganisationer)
