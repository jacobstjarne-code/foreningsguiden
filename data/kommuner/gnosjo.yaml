- id: gnosjo-startbidrag
  namn: Startbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Nybildade föreningar samt intresse- och ungdomsgrupper som ännu inte är bidragsberättigade
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Den nya föreningen eller gruppen ska bestå av minst tre personer
  - En verksamhetsplan ska visa att minst fem aktiviteter kommer att genomföras under året
  - En nybildad förening ska bifoga årsmötesprotokoll, stadgar och registreringsbevis
  - Ansökningsblankett beställs från kommunens fritidskontor och ska ange att ansökan avser startbidrag
  belopp: 3 000 kr till en nybildad förening
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan kan lämnas löpande under hela året
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/startbidrag
