- id: gnosjo-grundbidrag
  namn: Grundbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar som behöver ekonomisk grundtrygghet
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
  - Föreningen ska vara ansluten till en riksorganisation, verksam i Gnosjö kommun och ha minst tio avgiftsbetalande medlemmar i ett upprättat medlemsregister
  - Föreningen ska följa kommunens demokrati-, barnrätts-, jämlikhets- och jämställdhetsvillkor samt aktivt motverka våld, rasism, diskriminering, kränkningar och kriminalitet
  - Senaste årsmötesprotokoll ska visa att kommunens gemensamma värdegrund har behandlats
  - Ansökan ska innehålla senaste verksamhetsberättelse, ekonomiska berättelse, revisionsberättelse och antidrogpolicy
  - För dubbelt grundbidrag ska föreningen föregående kalenderår ha redovisat minst tio aktivitetstillfällen för ungdomar 7–25 år och sökt kommunalt lokalt aktivitetsstöd för dessa
  belopp: 1 500 kr per förening; 3 000 kr om villkoren för dubbelt grundbidrag är uppfyllda
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioden är 1 januari–31 mars; en sen ansökan kan avslås helt eller delvis
