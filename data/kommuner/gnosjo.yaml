bidrag:
- id: gnosjo-grundbidrag
  namn: Grundbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Alla registrerade föreningar
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Registrerad förening
  - Minst 10 aktivitetstillfällen för ungdomar 7-25 år under föregående kalenderår samt ansökt om lokalt aktivitetsstöd, för
    förhöjt bidrag (3000 kr)
  - Bifoga senaste verksamhetsberättelse och ekonomisk berättelse med tillhörande revisionsberättelse
  - Bifoga antidrogpolicy
  belopp: 1500 kr, eller 3000 kr om min 10 möten för ungdomar 7-25 år
  sen_ansokan: Ej möjlig efter 31 mars
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/grundbidrag
