- id: gnosjo-lokalbidrag
  namn: Anläggningsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade föreningar med föreningsägd eller externt förhyrd lokal eller anläggning
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
  - Föreningen ska vara godkänd som bidragsberättigad och ha beviljats grundbidrag av Gnosjö kommun
  - En förhyrd lokal ska vara nödvändig för verksamheten och förhyrningen ska vara godkänd av fritidsenheten
  - Förhyrningsbidrag avser kallhyra, uppvärmning, el, vatten, renhållning och försäkring för en lokal som föreningen disponerar helt enligt egen planering
  - Bidrag för en föreningsägd anläggning beräknas efter godkända lokala aktiviteter under föregående kalenderår; elljusspår undantas från aktivitetsbegränsningen
  - Ansökan avser föregående kalenderår och ska följa kommunens allmänna föreningsvillkor
  belopp: 'Förhyrd lokal: 80 % av godkända kostnader, högst 6 600 kr per förening och år. Föreningsägd anläggning: 50 % utan godkända aktiviteter, 75 % vid 30–39 aktiviteter och 100 % vid minst 40 aktiviteter av kommunens publicerade anläggningsschabloner'
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioden är 1 januari–31 mars och avser föregående kalenderår
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/anlaggningsbidrag
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Schablonerna omfattar bland annat fotbollsplaner, omklädnings- och klubbrum, samlingssalar, sommarhem, ridhus, skjutbana och tennishall; övriga anläggningar prövas individuellt
  kraver_registrering: true
  sate_i_kommunen: true
- id: gnosjo-investeringsbidrag
  namn: Investeringsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar som driver en fritidsanläggning som bedöms vara angelägen för kommunen
  deadlines:
    typ: fasta
    datum: ['01-31']
  krav:
  - Föreningen ska uppfylla kommunens allmänna bidragsbestämmelser och driva en fritidsanläggning som är angelägen för kommunen
  - Investeringen ska uppgå till minst 5 000 kr och avse ny-, till- eller ombyggnad, större maskin eller utrustning för anläggningens drift, eller nyritning eller revidering av orienteringskarta
  - Arbetet eller inköpet får inte vara påbörjat innan bidraget prövas
  - Föreningen ska om möjligt söka externa bidrag; dessa räknas av från totalkostnaden före kommunal utbetalning
  - Offert och betalningsunderlag ska bifogas; ideellt arbete värderas enligt kommunalarbetarnas GS-avtal grupp 1
  - Ett outnyttjat bidrag kan senast 1 december begäras reserverat i högst ett år om investeringsobjektet kvarstår
  belopp: Individuellt prövat investeringsbidrag; kommunen publicerar ingen generell bidragsandel eller maxnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Den antagna regelns bidragstabell anger ansökningsperioden 1–31 januari
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/investeringsbidrag
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Kommunens ansökningsöversikt anger 31 mars medan den antagna regelns bidragstabell anger 31 januari; regelns datum används
  kraver_registrering: true
  sate_i_kommunen: true
- id: gnosjo-ledarutbildningsbidrag
  namn: Bidrag för ledarutbildning
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar som kompetensutvecklar sina ledare
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Kursen ska arrangeras av en riks-, distrikts- eller lokalorganisation; lokala kurser med annan utformning kan godkännas efter särskild prövning
  - En endagskurs ska omfatta minst sex kurstimmar, en tvådagarskurs minst tio, en tredagarskurs minst 16 och en veckokurs minst 28 kurstimmar om 45 minuter
  - Kursprogram, kursintyg och kvitto på betald kursavgift ska bifogas ansökan
  - Stöd lämnas inte till en lokalt arrangerad kurs som får annat kommunalt bidrag, exempelvis en studiecirkel
  - Bidragsgrundande kostnader är kursavgift, resa, kursmaterial och förlorad arbetsförtjänst
  belopp: 75 % av kostnaderna, högst 300 kr per deltagare för en dag, 500 kr för två dagar, 700 kr för tre dagar och 2 500 kr för en vecka; högst 5 000 kr per år för en förening med en sektion och 7 000 kr för en förening med flera sektioner
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast en månad efter avslutad utbildning
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/bidrag-for-ledarutbildning
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
  kraver_registrering: true
  sate_i_kommunen: true
