- id: gnosjo-studieforbundsbidrag
  namn: Bidrag till studieförbund
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, annat]
  malgrupp: Studieförbund med lokal verksamhet i Gnosjö vars riksorganisation får bidrag från Folkbildningsrådet
  deadlines:
    typ: fasta
    datum: ['05-31']
  krav:
  - Studieförbundets riksorganisation ska få bidrag från Folkbildningsrådet och lokalavdelningen ska vara verksam i Gnosjö kommun
  - Om avdelningen omfattar flera kommuner ska verksamhet och ekonomi för Gnosjö särredovisas tydligt
  - Ansökan ska innehålla verksamhetsplan, ekonomisk redovisning, verksamhetsberättelse och verksamhetsstatistik för Gnosjö kommun
  - Under 2026 ska underlag för verksamhetsåren 2023, 2024 och 2025 bifogas som pdf-filer via kommunens webbformulär
  - Uppdragsutbildning är inte bidragsberättigad och en ofullständig eller sen ansökan behandlas inte
