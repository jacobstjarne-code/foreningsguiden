- id: gnosjo-aktivitetsbidrag
  ansokningsvag: "RF-anslutna föreningar som har sökt statligt LOK-stöd behöver inte lämna en separat kommunal ansökan; kommunen hämtar redovisningen från RF. Övriga föreningar ansöker via Actor Smartbook."
  namn: Lokalt aktivitetsstöd, LOK
  status: aktiv
  kategori: [idrott, kultur, funktionsratt, ovrig]
  foreningstyp: *allatyper
  malgrupp: Barn- och ungdomsföreningar samt funktionsrättsföreningar med ledarledda aktiviteter
  deadlines:
    typ: fasta
    datum: ['02-25', '08-25']
  krav:
  - Aktiviteten ska omfatta minst tre och högst 30 deltagare utöver ledaren i åldern 3–25 år
  - Ansvarig ledare ska vara minst 13 år
  - Föreningen ska följa Riksidrottsförbundets rutin för kontroll av registerutdrag för ledare i barn- och ungdomsverksamhet och kunna visa kommunens fritidsenhet att kontrollen är utförd
  - Föreningen ska uppfylla kommunens allmänna föreningsvillkor och använda stödet för den målgrupp som stödet har beviljats för
  - En RF-ansluten förening som har sökt statligt lokalt aktivitetsstöd behöver inte lämna en separat kommunal ansökan eftersom kommunen hämtar redovisningen från RF
  belopp: Högst 50 kr per godkänd sammankomst; den faktiska nivån bestäms av avsatt totalbelopp och antal redovisade aktiviteter
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Höstterminen söks 1 januari–25 februari och vårterminen 1 juli–25 augusti; en sen ansökan kan avslås helt eller delvis
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/lokalt-aktivitetsstod-lok
  belopp_status: kontrollast
