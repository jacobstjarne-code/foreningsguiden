  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: null
- id: gnosjo-aktivitetsbidrag
  namn: Aktivitetsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för barn och ungdom 7-25 år
  deadlines:
    typ: fasta
    datum:
    - 08-25
    - 02-25
  krav:
  - Aktivitet med minst 3 och max 30 deltagare (utöver ledare) i åldern 3-25 år
  - Ansvarig ledare får inte vara under 13 år
  - Föreningen ska praktisera Riksidrottsförbundets rutin för kontroll av registerutdrag för ledare, med dokumentation som
    kan visas för Fritidsenheten
  belopp: Max 50 kr per godkänd sammankomst (lokalt aktivitetsstöd, LOK)
  sen_ansokan: Ej möjlig efter deadline
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/lokalt-aktivitetsstod-lok
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: null
- id: gnosjo-startbidrag
  namn: Startbidrag/Etableringsstöd
  kategori:
  - idrott
  - kultur
  malgrupp: Nya föreningar eller nya verksamheter
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Nystartad förening med minst tre medlemmar
  - Förening eller intresse-/ungdomsgrupp som ännu inte uppfyller kraven för att vara bidragsberättigad
  - Upprättad verksamhetsplan där det framgår att minst fem aktiviteter kommer att genomföras
  - Bifoga årsmötesprotokoll, föreningens stadgar och registreringsbevis
  belopp: 3000 kr (engångsbidrag till nybildad förening)
  sen_ansokan: Ej möjlig efter 31 mars
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/startbidrag
  belopp_status: kontrollast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Källans sida för startbidrag anger inget separat ansökningsdatum. Tidigare uppgift om deadline 31 mars/sen_ansokan
    kvarstår overifierad mot denna sida.
- id: gnosjo-lokalbidrag
  namn: Lokalbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar med egen/hyrd lokal
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Föreningen ska vara godkänd som bidragsberättigad och erhålla grundbidrag från Gnosjö kommun
  - Lokalen/anläggningen ska vara godkänd av fritidsförvaltningen som nödvändig för verksamheten
  belopp: 'Schablonbelopp efter verksamhetsnivå: under 30 sammankomster 50%, 30-39 sammankomster 75%, över 40 sammankomster
    100% av fastställt schablonbelopp (t.ex. gräsfotbollsplan 22 000 kr/år/plan, omklädningsrum med dusch 126 kr/år/kvm, samlingslokal
    33 kr/år/kvm)'
  sen_ansokan: Ej möjlig efter 31 mars
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/anlaggningsbidrag
  belopp_status: kontrollast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Motsvaras numera av 'Anläggningsbidrag' på kommunens sajt (tidigare 'lokalbidrag'-sida gav 404). Ansökan avser
    föregående kalenderårs verksamhet; sidan anger inget fast ansökningsdatum, så tidigare uppgift om deadline 31 mars kvarstår
    overifierad.
- id: gnosjo-investeringsbidrag
  namn: Investeringsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för investeringar
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Investeringen ska uppgå till minst 5000 kr
  - Investeringen ska avse ny-, till- eller ombyggnad av fritidsanläggning, eller inköp av större maskiner eller utrustning
  - Bidrag beviljas inte till redan påbörjade arbeten eller gjorda inköp
  - Föreningen ska i första hand söka externa bidrag; dessa räknas av från totalkostnaden före utbetalning av kommunalt bidrag
  - Allmänna bidragsbestämmelser ska vara uppfyllda
  belopp: null
  sen_ansokan: Ej möjlig efter 31 mars
  kalla_url: https://www.gnosjo.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-och-stod-till-foreningar/investeringsbidrag
  belopp_status: okand
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Sidan anger ingen exakt bidragsandel/procentsats för själva utbetalningen, endast minimigränsen för investeringen
    (5000 kr) och att beviljat men ej nyttjat bidrag kan reserveras till 1 december. Beloppsregeln kvarstår därför okänd.
