  namn: Bidrag för verksamhet riktad till personer med funktionsnedsättning
  status: aktiv
  kategori: [social, funktionsratt]
  foreningstyp: [social, annat]
  malgrupp: Lokala funktionsrättsföreningar och, efter särskild prövning, närliggande lokalavdelningar med verksamhet för Gnosjöbor
  deadlines:
    typ: okand
    datum: []
  krav:
  - Lokalavdelningen ska bedriva bidragsberättigad verksamhet i Gnosjö kommun
  - Om lokalavdelning saknas i kommunen kan en avdelning i annan kommun prövas om verksamheten finns i Gnosjö eller angränsande kommuner och är tillgänglig för Gnosjöbor
  - Lokalavdelningen ska normalt ha minst tio avgiftsbetalande medlemmar med funktionsnedsättning som var registrerade under föregående redovisningsår
  - Familjemedlemmar och närstående får räknas om de har betalat medlemsavgift och uppfyller föreningens stadgar och årsmötesbeslut; avvikelser kräver särskild prövning
  - Föreningen ska följa samma grundprinciper och allmänna föreningsvillkor som kommunens barn- och ungdomsföreningar
