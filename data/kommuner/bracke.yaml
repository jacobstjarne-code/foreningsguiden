- id: bracke-vagbelysningsbidrag
  namn: Bidrag till vägbelysningsföreningar
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Vägbelysningsföreningar med befintlig belysning för allmänt ändamål
  deadlines:
    typ: fasta
    datum: [03-31]
  krav:
  - Sökande ska vara en vägbelysningsförening med befintlig belysning för allmänt ändamål
  - Natt- och sommarsläckning ska vara införd och bidraget avser 2 300 brinntimmar per år och armatur
  - Belysning för infarter till enstaka fastigheter och belysning som anordnats utan kommunens medgivande ger inte bidrag
