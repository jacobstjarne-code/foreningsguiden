bidrag:
- id: bracke-aktivitetsstod
  namn: Aktivitetstöd
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Organisationer för aktiviteter för åldrar 0-25 och 65+
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Organisationen måste bedriva aktiviteter för åldrar 0-25 eller 65+ (undantag för annan verksamhet än idrott kan godkännas
    efter särskild överenskommelse, t.ex. slöjdklubbar)
  - Deltagarna ska vara medlemmar i föreningen
  - Minst tre deltagare och en ledare per sammankomst
  - Aktiviteten ska pågå minst 60 minuter, kortare tid kan godkännas för yngsta och äldsta åldersgrupperna
  - Bidrag utgår per deltagartillfälle, men endast en gång per dag och grupp
  - Bidrag utgår inte till entrébelagda arrangemang, publika uppvisningar, tävlingar, medlemsmöten eller resor
  - Bidrag utgår inte till aktivitet som anordnas av riksorganisation eller distrikt
  - Varje aktivitet får bara rapporteras av en huvudman
  - Deltagarnärvaro med födelsenummer ska rapporteras två gånger per år, senast 25 februari och 25 augusti
  belopp: Kommunalt aktivitetsstöd utbetalas med 20 kronor per deltagartillfälle.
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Möjlig med närvaro-rapportering vid deadline
  kalla_url: *huvud
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Styrdokumentet 'Program för bidrag till föreningslivet inom kultur och fritid' (KF § 140/2024) bekräftar att
    aktivitetsstöd utbetalas med 20 kronor per deltagartillfälle, samt fullständiga kvalificeringskrav.
  senast_verifierad: '2026-08-23'
