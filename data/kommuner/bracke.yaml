  anteckning: 'Officiellt styrdokument (KF § 140/2024) bekräftar beloppsregeln: upp till 60% av deltagaravgiften, max 720
    kr/dag och deltagare.'
- id: bracke-utvecklingsbidrag
  namn: Utvecklingsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar för pilotprojekt och ny samverkan
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Nya verksamhetsformer, t.ex. försöksverksamhet, föreningssamverkan, läger- och lovverksamhet, startbidrag för nystartade
    föreningar, drogförebyggande verksamhet eller verksamhet för personer med funktionsnedsättning
  - Ansökan ska innehålla målgrupp, syfte och finansiering
  - Efter avslutat projekt ska föreningen redovisa resultatet
  - Barn- och ungdomsverksamhet, drogförebyggande arbete och föreningssamverkan prioriteras
  - För renodlade evenemang gäller samma regler som för kulturbidrag
  - Ansökan via e-tjänstportal
  belopp: Bedöms från fall till fall inom fastställd budgetram (ingen fast beloppsgräns publicerad).
  sen_ansokan: Möjlig löpande
