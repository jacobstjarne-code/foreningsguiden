  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Flerparter samverkan prioriteras
- id: bracke-samlingsplatsstod
  namn: Samlingsplatsstöd
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar för drift av samlingslokaler
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Endast lokaler på kommunens fastställda förteckning kan söka bidraget (bl.a. Ansjö Bygdegård, Flatnor Föreningshus, Fugelsta
    bygdegård, Gastsjö Bygdegård, Hällesjö Folkets Hus, Hunge Folkets Hus, Ljungå Bygdegård, Kullagården, Nor-Gåsböle Bystuga,
    Sidsjö Bystuga, Stavre Bygdegård, Fanbyns Bygdegård, Tossengård, Zenit i Rissna, Övsjö Bygdegård)
  - Ansökan ska bifoga föregående års verksamhetsberättelse med fastställt bokslut samt verifikat på redovisade kostnader
  - Endast den del av fastigheten som är allmän samlingslokal berättigar till bidrag; uthyrning eller annan verksamhet ger
    avräkning på stödet
  - Ansökan via e-tjänstportal
  belopp: Max 50% av redovisade driftskostnader (uppvärmning, el, VA-kostnader, renhållningsavgift, snöröjning, fastighetsförsäkring
    samt räntor och amorteringar på av kommunen godkända lån).
  sen_ansokan: Ej möjlig efter 30 april
  kalla_url: https://www.bracke.se/kulturochfritid/foreningslivochbidrag.4.73773db514ee2ab085a9efe.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: null
- id: bracke-kulturbidrag
  namn: Kulturbidrag
  kategori:
  - kultur
  malgrupp: Organisationer för offentliga kulturuppträdanden
  deadlines:
    typ: lopande
    datum: []
  krav:
  - 'Kulturverksamhet/evenemang med konstnärligt innehåll: musik, teater, dans, bild och form, film och media, litteratur
    och kulturhistoria'
  - Evenemanget ska ske inom kommunens gränser och vara öppet för alla (får vara entrébelagt)
  - Föreningen ska marknadsföra evenemanget och ange att det har stöd av Bräcke kommun, samt sprida det via Bräcke turistinformations
    Facebook-sida eller affischer till biblioteken
  - Ansökan ska lämnas i god tid före evenemanget, och utfallet ska redovisas till kommunen efteråt
  - Barn- och ungdomsverksamhet ger högre kostnadstäckning
  - Ansökan via e-tjänstportal
  belopp: Bedöms från fall till fall inom fastställd budgetram, baserat på kostnader kopplade till konstnärlig verksamhet
    och extern marknadsföring; barn- och ungdomsverksamhet ger högre kostnadstäckning. Biograferna i Bräcke och Kälarne kan
    söka 1 000 kr per filmtitel, upp till 30 filmer eller digitala visningar per år.
  sen_ansokan: Möjlig löpande
  kalla_url: https://www.bracke.se/kulturochfritid/foreningslivochbidrag.4.73773db514ee2ab085a9efe.html
  belopp_status: kontrollast
  deadline_status: olast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Officiellt styrdokument (KF § 140/2024) bekräftar att kulturbidrag prövas från fall till fall inom fastställd
    budgetram; ingen fast kronsumma publiceras utöver 1 000 kr/filmtitel för biograferna i Bräcke och Kälarne.
