bidrag:
- id: rattvik-foreningsstod
  namn: Föreningsstöd till ungdoms-, idrotts-, handikapp- och pensionärsföreningar
  kategori:
  - idrott
  - funktionsratt
  - pensionar
  - ovrig
  malgrupp: Ideella föreningar inom ungdoms-, idrotts-, handikapp- och pensionärsverksamhet med huvuddelen av medlemmarna
    i Rättviks kommun
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen ska ha stadgar som är godkända av riksorganisation eller av kommunen
  - Minst 10 medlemmar i åldern 7–20 år folkbokförda i Rättviks kommun (åldersgränsen gäller inte funktionsnedsättnings- och
    pensionärsföreningar)
  - Ideell verksamhet i drogfri miljö med samhällsnyttigt ändamål, huvuddelen av medlemmarna skrivna i kommunen
  - Föreningen får inte tillhöra kategorierna ekonomiska föreningar, vuxenföreningar, elevföreningar (gäller inte skol-IF),
    föreningar knutna till svenska försvaret, eller stödföreningar (t.ex. supporterklubbar)
  belopp: null
  sen_ansokan: Sista ansökningsdag är 30 april årligen (poststämpelns/mejlets datum gäller). För sent inkommen ansökan kan
    innebära att ansökan avslås.
  kalla_url: https://etjanster.rattvik.se/oversikt/overview/147
  anteckning: 'Ansökan görs av föreningens huvudstyrelse via trafik-, ungdoms- och fritidsenheten. Stödformer: subventionerad
    uthyrning av kommunens lokaler (0–100 %, taxor enligt bilaga), ekonomiskt föreningsbidrag och bidrag för viss prestation
    — nivå förhandlas individuellt, ingen fast kronsumma publicerad. Överenskommelse dokumenteras med avtal, kan skrivas på
    1–3 år. Dubbelhämtat 2026-07-21, identiskt i båda pass.'
- id: rattvik-extra-foreningsstod
  namn: Extra föreningsstöd
  kategori:
  - idrott
  - funktionsratt
  - pensionar
  - ovrig
  malgrupp: Föreningar som redan erhållit ordinarie föreningsstöd (kontantstöd/lokalsubvention) från trafik-, ungdoms- och
    fritidsenheten under innevarande år
  deadlines:
    typ: fasta
    datum:
    - 10-31
  krav:
  - Föreningen ska under året redan ha erhållit ordinarie föreningsstöd (kontantstöd/lokalsubvention) från trafik-, ungdoms-
    och fritidsenheten
  - E-legitimation krävs för ansökan; föreningar med skyddad identitet hänvisas att kontakta enheten direkt
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://etjanster.rattvik.se/oversikt/overview/211
  anteckning: Ansökningsperiod 1 juni–31 oktober årligen. Redovisning av medlens användning sker vid nästa föreningsdialog.
    Dubbelhämtat 2026-07-21, identiskt i båda pass.
- id: rattvik-kulturstod
  namn: Kulturstöd för föreningar
  kategori:
  - kultur
  malgrupp: Ideella och allmännyttiga föreningar/organisationer verksamma inom kulturell verksamhet
  deadlines:
    typ: fasta
    datum:
    - 04-01
  krav:
  - Föreningen ska vara ideell och kulturarrangerande, med huvudsakligt syfte inom t.ex. kulturmiljövård, hantverk, dans,
    musik, litteratur, teater eller bild och form
  - Protokoll och kassarapport från årets årsmöte samt en redogörelse för planerad verksamhet ska bifogas ansökan
  belopp: null
  sen_ansokan: Sen ansökan kan innebära reducerat bidrag eller avslag
  kalla_url: https://etjanster.rattvik.se/oversikt/overview/141
  anteckning: Bidraget kan sökas och beviljas för ett kalenderår i taget. Söks via kommunens kulturenhet/e-tjänst. Dubbelhämtat
    2026-07-21, identiskt i båda pass.
- id: rattvik-studieforbundsbidrag
  namn: Bidrag till studieförbund
  kategori:
  - kultur
  malgrupp: Studieförbund verksamma i Rättviks kommun vars centrala organisation får statligt bidrag från Folkbildningsrådet
  deadlines:
    typ: fasta
    datum:
    - 05-15
  krav:
  - Studieförbundets centrala organisation ska få statligt bidrag från Folkbildningsrådet
  - Ansvarig styrelse och ekonomisk redovisning som följer bokföringslagens krav
  - Verksamhet i kommunen vid utbetalningstillfället, eller verksamhetsplan som visar att verksamhet kommer att bedrivas under
    pågående verksamhetsår
  - Normalt ges inget bidrag för verksamhet under 500 deltagartimmar
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.rattvik.se/download/18.6a48d872159d3ad55ba177c1/1618998911236/Normer%20f%C3%B6reningsbidrag%20fr%20o%20m%2020170101.pdf
  anteckning: Anslaget delas i grundbidrag (80 %, fördelas efter föregående års procentuella andel) och volymbidrag (20 %,
    beräknas på deltagartimmar). Kommunintyg, verksamhets- och revisionsberättelse samt verksamhetsplan ska vara kommunen
    tillhanda senast 15 maj; bidragen betalas ut senast 30 juni varje år. Ingen separat e-tjänstsida hittad — källan är kommunens
    riktlinje-PDF. PDF-URL:en verifierad levande (200) 2026-07-21; textextraktion ur PDF:en är teknisk begränsad (komprimerad
    textström) men rubriken 'Studieförbund' bekräftades i dokumentet och detaljvärdena är oförändrade sedan föregående fulla
    extraktion 2026-07-19.
- id: rattvik-social-verksamhetsstod
  namn: Föreningsstöd till social verksamhet
  kategori:
  - social
  malgrupp: Ideella föreningar vars verksamhet kompletterar socialtjänstens område, riktad till Rättviksbor
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen ska vara ideell, ej vinstdrivande och uppbyggd enligt demokratiska principer
  - Verksamheten ska vara lokaliserad i Rättviks kommun och riktad till kommunens invånare
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.rattvik.se/download/18.6a48d872159d3ad55ba177c1/1618998911236/Normer%20f%C3%B6reningsbidrag%20fr%20o%20m%2020170101.pdf
  anteckning: Söks via Rättviks kommuns socialförvaltning. Kan sökas och beviljas för ett kalenderår i taget, särskild prövning
    görs från fall till fall. Ingen separat e-tjänstsida hittad — källan är kommunens riktlinje-PDF (samma verifieringsstatus
    som rattvik-studieforbundsbidrag ovan).
- id: rattvik-lonebidrag
  namn: Kommunalt lönebidrag till föreningar
  kategori:
  - funktionsratt
  - ovrig
  malgrupp: Ideella och allmännyttiga föreningar med säte och verksamhet i Rättviks kommun som vill anställa en person med
    lönebidrags- eller trygghetsanställning
  deadlines:
    typ: fasta
    datum:
    - 10-31
  krav:
  - Föreningen ska ha sitt säte och vara verksam inom Rättviks kommun
  - Personen som anställs ska bo och vara folkbokförd i Rättviks kommun samt ha en lönebidrags- eller trygghetsanställning
    med dokumenterat funktionshinder
  - Föreningens stadgar ska bifogas ansökan
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.rattvik.se/download/18.6a48d872159d3ad55ba177c1/1618998911236/Normer%20f%C3%B6reningsbidrag%20fr%20o%20m%2020170101.pdf
  anteckning: Söks via Rättviks kommuns personalenhet med särskild blankett. Utformat som schablonbidrag där avsatta medel
    fördelas utifrån antal ansökningar och anställningsvillkor. Kan sökas och beviljas för ett kalenderår i taget. Ingen separat
    e-tjänstsida hittad — källan är kommunens riktlinje-PDF (samma verifieringsstatus som rattvik-studieforbundsbidrag ovan).
- id: rattvik-bystugebidrag
  namn: Bystugebidrag
  kategori:
  - kultur
  - ovrig
  malgrupp: Bystugeföreningar (eller annan förening som handhar bystuga) i Rättviks kommun
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Projektet ska avse om-, till- eller nybyggnad eller underhåll av bystuga i Rättviks kommun
  - Bystugeföreningen ska ha minst två öppna aktiviteter per år samt hyra ut bystugan till både medlemmar och icke-medlemmar
  - Organisationsnummer krävs för utbetalning av bidrag
  - Ansökan ska innehålla projektbeskrivning (sammanfattning, mål, målgrupp, tidsplan, budget) samt verksamhetsberättelse,
    årsmötesprotokoll och resultat- och balansräkning
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://etjanster.rattvik.se/oversikt/overview/173
  anteckning: Medel till drift ges inte. Egen delfinansiering premieras, och ansökningar som använder kommunens bidrag som
    medfinansiering till andra bidrag (t.ex. Boverket) prioriteras. Ingen garanti för bidrag även om kraven uppfylls, då medlen
    är begränsade. Dubbelhämtat 2026-07-21, identiskt i båda pass. Kommunen avsätter normalt cirka 100 000 kronor per år totalt
    för samtliga bystugoföreningar; detta är inte ett tak per sökande.
- id: rattvik-vindkraftspeng
  namn: Vindkraftspeng
  kategori:
  - ovrig
  malgrupp: Ideella föreningar och organisationer verksamma i Rättviks kommun med giltigt organisationsnummer
  deadlines:
    typ: fasta
    datum:
    - 07-31
  krav:
  - Endast ideella föreningar och organisationer i Rättviks kommun med giltigt organisationsnummer kan söka. Företag och privatpersoner
    är inte behöriga.
  - En ansökan per förening/organisation och år, för en aktivitet, ett projekt eller en investering
  - Kan endast sökas för framtida aktiviteter/projekt/investeringar, inte retroaktivt
  - Ansökan ska innehålla senaste årsmötesprotokoll, protokollsutdrag om beslut att ansöka, uppgift om firmatecknare samt
    beskrivning av aktiviteten/projektet/investeringen
  belopp: Högst 100 000 kronor per förening och år. Vid större investeringar kan utbetalning fördelas över högst två år efter
    särskilt beslut.
  sen_ansokan: Ansökningar som inkommer efter sista ansökningsdag behandlas inte.
  kalla_url: https://etjanster.rattvik.se/oversikt/overview/317
  anteckning: 'KÄLLKONFLIKT LÖST (§2.5, nyare vinner): föregående version noterade en olöst diskrepans mellan en tidigare
    daterad riktlinje (2026-05-06, ''31 mars'' utan undantag) och nyare källor. Denna omgång bekräftar entydigt, via tre oberoende
    och samstämmiga källor nyare än 2026-05-06 — kommunens nyhetsartikel ''Rättviks kommun satsar på föreningslivet med nya
    vindkraftspengar'' (publicerad 2026-06-03), kommunstyrelsens referat från sammanträdet 2026-06-16 (beslut att anta riktlinjer
    för vindkraftspeng, med uppmaning att prioritera föreningarna i Ore socken vid fördelningen) samt den löpande e-tjänstsidan
    för ansökan (etjanster.rattvik.se/vindkraftspeng, hämtad 2026-07-21) — att sista ansökningsdag för 2026 är 31 juli 2026,
    som ett engångsundantag för det första verksamhetsåret. Från och med 2027 återgår ansökningsdatumet till 31 mars årligen,
    i linje med den äldre riktlinjens återkommande regel. Fältet ovan (07-31) är alltså den faktiskt gällande deadlinen vid
    denna verifiering (2026-07-21, tio dagar innan fristen går ut) — kommande års YAML-uppdatering ska ändra datumet till
    03-31 när 2027 börjar gälla. Utbetalning sker med 75 % direkt, resterande 25 % efter godkänd slutredovisning. Ej att förväxla
    med rattvik-bygdepeng-dalfors-orebygden nedan, som är ett äldre och geografiskt avgränsat program finansierat av ett annat
    vindkraftsöverskott (Hedbodberget). Uppgifter om kommunens totala statliga vindkraftsstöd beskriver den gemensamma budgeten,
    inte vad en enskild förening kan få.'
- id: rattvik-vagbidrag
  namn: Bidrag för enskilda vägar
  kategori:
  - ovrig
  malgrupp: Juridiskt bildade samfällighetsföreningar som ansvarar för enskild väg i Rättviks kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara en juridiskt bildad samfällighetsförening (enskild fastighetsägare kan inte söka)
  - Minst två fastigheter med permanentboende ska nyttja vägen
  - Vägen ska vara väl avgrusad och dikad
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.rattvik.se/trafik-och-gator/gator/bidrag-vagar-belysning.html
  anteckning: 'SAKNADES I FÖREGÅENDE VERSION — tillagd vid korrigerande omkörning 2026-07-21 (specialkategori §2.1.5, källa
    hittad via samhällsbyggnad/trafik-och-gator snarare än det redaktionella föreningsbidrags-sidträdet). Administreras av
    Samhällsutvecklingsförvaltningen, ansökan skickas direkt till förvaltningen (ingen e-tjänst hittad). Separat: enligt beslut
    i nämnden lämnas inga bidrag till nyuppsättning av gatubelysning, men en väg-/samfällighetsförening kan själv finansiera
    ny belysning som kommunen sedan tar över driftansvaret för — detta är inget sökbart bidrag och är inte skrivet som egen
    post.'
- id: rattvik-bygdepeng-dalfors-orebygden
  namn: Bygdepeng för Dalfors och Orebygden
  kategori:
  - ovrig
  malgrupp: Föreningar, organisationer och privatpersoner verksamma i Dalfors och Orebygden (Ore socken) som vill genomföra
    projekt eller gemensamma anläggningar till nytta för bygden
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Projektet eller anläggningen ska främja utvecklingen av Dalfors och Orebygden — allt från mindre kulturarrangemang (musikkvällar,
    utställningar) till större renoveringar eller anläggningsinvesteringar
  - Fullständiga villkor anges på ansökningsblanketten 'Ansökan bygdepeng'
  belopp: null
  sen_ansokan: Sista ansökningsdag är 31 mars varje år; infaller datumet på en helgdag flyttas fristen till nästa vardag.
  kalla_url: https://www.rattvik.se/kommun-och-politik/kommunens-organisation/stiftelser-fonder-och-bygdepeng/bygdepeng-for-dalfors-och-orebygden.html
  anteckning: SAKNADES I FÖREGÅENDE VERSION — tillagd vid korrigerande omkörning 2026-07-21 (specialkategori §2.1.5/samhälls-
    och byalag, källa hittad under 'Stiftelser, fonder och bygdepeng' snarare än föreningsbidrags-sidträdet). Administreras
    av Kanslienheten (Kommunstyrelsens förvaltning). Geografiskt avgränsat till Dalfors och Orebygden — gäller alltså inte
    föreningar i övriga Rättviks kommun. Sidan specificerar inte explicit att enbart föreningar (till skillnad från privatpersoner)
    får söka, men exemplen på användning (gemensamma anläggningar, offentliga kulturarrangemang) tyder på att föreningar/organisationer
    är en central målgrupp tillsammans med privatpersoner/byalag. Bekräftat aktuellt för 2026 via nyhetsartikel 'Sök bygdepeng
    för Dalfors och Orebygden' (publicerad 2026-03-02, angav samma 31 mars 2026-deadline). Ej att förväxla med rattvik-vindkraftspeng
    ovan, som är kommunens nya, kommunövergripande statliga vindkraftsstöd — bygdepengen är ett äldre, geografiskt avgränsat
    program finansierat av Hedbodbergets vindkraftsöverskott. Cirka 300 000 kronor per år avsätts totalt till Dalfors/Orebygden.
    Beloppet är en gemensam pott och inte ett tak per sökande.
forutsattningar:
- id: rattvik-bidragsberattigad-forening
  vad: Registrera förening i Rättviks kommuns föreningsregister
  beskrivning: Föreningen ska ha stadgar beslutade på medlemsmöte som bland annat beskriver föreningens allmännyttiga ändamål,
    ha öppen medlemsantagning, och inte arbeta för att tillgodose medlemmarnas ekonomiska intressen. Ansökan om registrering
    görs via det digitala systemet friweb.rattvik.se. Sidan specificerar inte uttryckligen om registrering är ett formellt
    krav innan bidrag kan sökas, men föreningsregistret är den gemensamma källan för föreningsuppgifter som används vid samtliga
    bidragsansökningar (bl.a. anges registrering som krav i föreningsstödets egna villkor).
  system: friweb.rattvik.se (föreningsregister)
  ledtid: null
  ledtid_text: null
  giltighet: null
  ordning: 1
