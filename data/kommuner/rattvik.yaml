  - idrott
  - friluft
  - social
  - ungdom
  - annat
  anteckning: Ansökningsperioden är 1 juni–31 oktober varje år. Redovisning av medlens användning sker vid nästa föreningsdialog.
  senast_verifierad: '2026-08-03'
- id: rattvik-kulturstod
  namn: Kulturstöd för föreningar
  kategori:
  - kultur
  malgrupp: Ideella och allmännyttiga föreningar/organisationer verksamma inom kulturell verksamhet
  deadlines:
    typ: fasta
    datum:
    - 04-01
  krav:
  - Föreningen ska vara ideell och kulturarrangerande, med huvudsakligt syfte inom t.ex. kulturmiljövård, hantverk, dans,
    musik, litteratur, teater eller bild och form
  - Protokoll och kassarapport från årets årsmöte samt en redogörelse för planerad verksamhet ska bifogas ansökan
  - Bidraget söks för ett kalenderår i taget och sökanden ska representera föreningen
  belopp: Belopp beslutas individuellt; kommunen publicerar inget fast belopp
  belopp_avser: per_forening
  sen_ansokan: Sen ansökan kan innebära reducerat bidrag eller avslag
  kalla_url: https://etjanster.rattvik.se/oversikt/overview/141
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp:
  - kultur
  - hembygd
  anteckning: Bidraget kan sökas och beviljas för ett kalenderår i taget via kommunens kulturenhet.
  senast_verifierad: '2026-08-03'
- id: rattvik-studieforbundsbidrag
  namn: Bidrag till studieförbund
  kategori:
  - kultur
  malgrupp: Studieförbund verksamma i Rättviks kommun vars centrala organisation får statligt bidrag från Folkbildningsrådet
  deadlines:
    typ: fasta
    datum:
    - 05-15
  krav:
  - Studieförbundets centrala organisation ska få statligt bidrag från Folkbildningsrådet
  - Ansvarig styrelse och ekonomisk redovisning som följer bokföringslagens krav
  - Verksamhet i kommunen vid utbetalningstillfället, eller verksamhetsplan som visar att verksamhet kommer att bedrivas under
    pågående verksamhetsår
  - Normalt ges inget bidrag för verksamhet under 500 deltagartimmar
  belopp: 80 procent av kommunens anslag fördelas som grundbidrag efter föregående års andel och 20 procent som volymbidrag efter deltagartimmar
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.rattvik.se/download/18.6a48d872159d3ad55ba177c1/1618998911236/Normer%20f%C3%B6reningsbidrag%20fr%20o%20m%2020170101.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp:
  - kultur
  - annat
  anteckning: Kommunintyg, verksamhets- och revisionsberättelse samt verksamhetsplan ska lämnas senast 15 maj. Bidraget
    betalas ut senast 30 juni.
  senast_verifierad: '2026-08-03'
- id: rattvik-social-verksamhetsstod
  namn: Föreningsstöd till social verksamhet
  kategori:
  - social
  malgrupp: Ideella föreningar vars verksamhet kompletterar socialtjänstens område, riktad till Rättviksbor
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen ska vara ideell, ej vinstdrivande och uppbyggd enligt demokratiska principer
  - Verksamheten ska vara lokaliserad i Rättviks kommun och riktad till kommunens invånare
  - Verksamheten ska komplettera socialtjänstens område och utgå från socialförvaltningens värdegrund
  belopp: Belopp prövas individuellt från fall till fall; kommunen publicerar inget fast belopp
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.rattvik.se/download/18.6a48d872159d3ad55ba177c1/1618998911236/Normer%20f%C3%B6reningsbidrag%20fr%20o%20m%2020170101.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp:
  - social
  anteckning: Bidraget söks via socialförvaltningen och kan beviljas för ett kalenderår i taget.
  senast_verifierad: '2026-08-03'
- id: rattvik-lonebidrag
  namn: Kommunalt lönebidrag till föreningar
  kategori:
  - funktionsratt
  - ovrig
  malgrupp: Ideella och allmännyttiga föreningar med säte och verksamhet i Rättviks kommun som vill anställa en person med
    lönebidrags- eller trygghetsanställning
  deadlines:
    typ: fasta
    datum:
    - 10-31
  krav:
  - Föreningen ska ha sitt säte och vara verksam inom Rättviks kommun
  - Personen som anställs ska bo och vara folkbokförd i Rättviks kommun samt ha en lönebidrags- eller trygghetsanställning
    med dokumenterat funktionshinder
  - Föreningens stadgar ska bifogas ansökan
  belopp: Schablonbidrag där avsatta medel fördelas efter antalet ansökningar och personernas anställningsvillkor
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.rattvik.se/download/18.6a48d872159d3ad55ba177c1/1618998911236/Normer%20f%C3%B6reningsbidrag%20fr%20o%20m%2020170101.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp:
  - social
  - annat
  anteckning: Bidraget söks via personalenheten med särskild blankett och kan beviljas för ett kalenderår i taget.
  senast_verifierad: '2026-08-03'
- id: rattvik-bystugebidrag
  namn: Bystugebidrag
  kategori:
  - kultur
  - ovrig
  malgrupp: Bystugeföreningar (eller annan förening som handhar bystuga) i Rättviks kommun
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Projektet ska avse om-, till- eller nybyggnad eller underhåll av bystuga i Rättviks kommun
  - Bystugeföreningen ska ha minst två öppna aktiviteter per år samt hyra ut bystugan till både medlemmar och icke-medlemmar
  - Organisationsnummer krävs för utbetalning av bidrag
  - Ansökan ska innehålla projektbeskrivning (sammanfattning, mål, målgrupp, tidsplan, budget) samt verksamhetsberättelse,
    årsmötesprotokoll och resultat- och balansräkning
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: "100 000 kr per år"
  sen_ansokan: Ej angivet i källan
  kalla_url: https://etjanster.rattvik.se/oversikt/overview/173
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp:
  - hembygd
  - annat
  anteckning: Medel ges inte till drift. Egen delfinansiering och användning av kommunstödet som medfinansiering till andra
    bidrag prioriteras. Beloppet är kommunens gemensamma årspott, inte ett tak per förening.
  senast_verifierad: '2026-08-03'
- id: rattvik-vindkraftspeng
  namn: Vindkraftspeng
  kategori:
  - ovrig
  malgrupp: Ideella föreningar och organisationer verksamma i Rättviks kommun med giltigt organisationsnummer
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Endast ideella föreningar och organisationer i Rättviks kommun med giltigt organisationsnummer kan söka. Företag och privatpersoner
    är inte behöriga.
  - En ansökan per förening/organisation och år, för en aktivitet, ett projekt eller en investering
  - Kan endast sökas för framtida aktiviteter/projekt/investeringar, inte retroaktivt
  - Ansökan ska innehålla senaste årsmötesprotokoll, protokollsutdrag om beslut att ansöka, uppgift om firmatecknare samt
    beskrivning av aktiviteten/projektet/investeringen
  belopp: Högst 100 000 kronor per förening och år. Vid större investeringar kan utbetalning fördelas över högst två år efter
    särskilt beslut.
  belopp_avser: per_forening
  sen_ansokan: Ansökningar som inkommer efter sista ansökningsdag behandlas inte.
  kalla_url: https://etjanster.rattvik.se/oversikt/overview/317
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp:
  - idrott
  - kultur
  - hembygd
  - friluft
  - social
  - ungdom
  - annat
  anteckning: Från 2027 är sista ansökningsdag 31 mars varje år; 31 juli 2026 var ett engångsundantag. Utbetalning sker med
    75 procent efter beslut och resterande 25 procent efter godkänd slutredovisning.
  senast_verifierad: '2026-08-03'
- id: rattvik-vagbidrag
  namn: Bidrag för enskilda vägar
  kategori:
  - ovrig
  malgrupp: Juridiskt bildade samfällighetsföreningar som ansvarar för enskild väg i Rättviks kommun
  deadlines:
    typ: okand
    datum: []
  krav:
  - Sökande ska vara en juridiskt bildad samfällighetsförening (enskild fastighetsägare kan inte söka)
  - Minst två fastigheter med permanentboende ska nyttja vägen
  - Vägen ska vara väl avgrusad och dikad
  belopp: Kommunen publicerar inget fast belopp eller beräkningssätt
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.rattvik.se/trafik-och-gator/gator/bidrag-vagar-belysning.html
  belopp_status: ingen_regel
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp:
  - annat
  anteckning: Ansökan skickas direkt till samhällsutvecklingsförvaltningen. Kommunen ger inte bidrag till ny gatubelysning.
  senast_verifierad: '2026-08-03'
- id: rattvik-bygdepeng-dalfors-orebygden
  namn: Bygdepeng för Dalfors och Orebygden
  kategori:
  - ovrig
  malgrupp: Föreningar, organisationer och privatpersoner verksamma i Dalfors och Orebygden (Ore socken) som vill genomföra
    projekt eller gemensamma anläggningar till nytta för bygden
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Projektet eller anläggningen ska främja utvecklingen av Dalfors och Orebygden — allt från mindre kulturarrangemang (musikkvällar,
    utställningar) till större renoveringar eller anläggningsinvesteringar
  - Fullständiga villkor anges på ansökningsblanketten 'Ansökan bygdepeng'
  - Sökanden ska vara verksam i Dalfors eller Orebygden och använda medlen till lokal nytta i området
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: "300 000 kr per år"
  sen_ansokan: Sista ansökningsdag är 31 mars varje år; infaller datumet på en helgdag flyttas fristen till nästa vardag.
  kalla_url: https://www.rattvik.se/kommun-och-politik/kommunens-organisation/stiftelser-fonder-och-bygdepeng/bygdepeng-for-dalfors-och-orebygden.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp:
  - kultur
  - hembygd
  - friluft
  - social
  - ungdom
  - annat
  anteckning: Stödet är geografiskt avgränsat till Dalfors och Orebygden och kan sökas av både föreningar och privatpersoner.
    Beloppet är områdets gemensamma årspott, inte ett tak per sökande.
  senast_verifierad: '2026-08-03'
forutsattningar:
- id: rattvik-bidragsberattigad-forening
  vad: Registrera förening i Rättviks kommuns föreningsregister
  beskrivning: Föreningen ska ha stadgar beslutade på medlemsmöte som bland annat beskriver föreningens allmännyttiga ändamål,
    ha öppen medlemsantagning, och inte arbeta för att tillgodose medlemmarnas ekonomiska intressen. Ansökan om registrering
    görs via det digitala systemet friweb.rattvik.se. Sidan specificerar inte uttryckligen om registrering är ett formellt
    krav innan bidrag kan sökas, men föreningsregistret är den gemensamma källan för föreningsuppgifter som används vid samtliga
    bidragsansökningar (bl.a. anges registrering som krav i föreningsstödets egna villkor).
  system: friweb.rattvik.se (föreningsregister)
