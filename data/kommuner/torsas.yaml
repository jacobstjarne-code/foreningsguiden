bidrag:
- namn: Föreningsbidrag
  kategori:
  - idrott
  - idrott
  malgrupp: Föreningar och organisationer i Torsås kommun
  deadlines:
    typ: fasta
    datum:
    - 01-31
  krav:
  - Föreningen ska ha stadgar godkända av riksorganisationen eller av kommunen
  - Föreningen ska ha minst 5 medlemmar i åldrarna 5–25 år som regelbundet deltar i föreningens ledarledda verksamhet
  - Föreningen ska ha minst 25 ledarledda sammankomster per år, med minst 5 deltagare (exkl. ledare) i bidragsberättigad ålder
  - Föreningen ska bedriva sin verksamhet och ha huvuddelen av sina medlemmar i kommunen
  - Föreningen ska ha varit verksam i minst 6 månader
  - Föreningen får normalt inte vara ekonomisk förening, politisk förening, religiös förening, knuten till svenska försvaret
    eller en stöd-/supporterklubb
  - Ansökan ska göras av föreningens huvudstyrelse och innehålla ansökningsblankett, verksamhetsplan, årsmötesprotokoll samt
    ekonomisk- och revisionsberättelse
  belopp: 'Grundbidrag enligt normer: 1 500 kr för 5–10 aktiva i åldrarna 5–25 år, 4 000 kr för fler än 10 aktiva, samt 225
    kr per aktiv medlem 5–25 år. Anläggnings- och lokalbidrag enligt norm, exempelvis klubbhus med omklädning/dusch 15 000
    kr, lokalbidrag för hyrd extern lokal (50 % av hyran) högst 15 000 kr, A-plan 20 000 kr och ridhus 60 000 kr, bland flera
    poster i normlistan.'
  sen_ansokan: Ej angivet i källan
