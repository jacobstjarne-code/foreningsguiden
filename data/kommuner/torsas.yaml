  krav_fullstandiga: true
  anteckning: Kommunen anger 1 oktober eller löpande; registrerat som fast huvuddatum med notering om att löpande ansökan
    också kan förekomma.
  id: torsas-investeringsbidrag-av-mindre-slag
- namn: Kulturbidrag
  kategori:
  - kultur
  malgrupp: Föreningar och organisationer i Torsås kommun
  deadlines:
    typ: fasta
    datum:
    - 03-01
  krav:
  - Sökande ska vara förening, organisation, offentlig förvaltning eller studieförbund med verksamhet i Torsås kommun
  - Kulturverksamheten ska bedrivas inom Torsås kommun, med prioritet för barn- och ungdomsverksamhet
  - Ansökan ska innehålla program, verksamhetsbeskrivning och kostnadsbudget
  - Sökande kan bara beviljas antingen bidrag eller förlustgaranti per år, inte båda
  - Om verksamheten inte genomförs efter beviljat bidrag ska bidraget återbetalas
  belopp: Inget fast belopp anges. Storleken på bidraget avgörs av bildningsnämndens ekonomiska förutsättningar.
