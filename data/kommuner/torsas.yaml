- id: torsas-subventionerad-kommunal-lokal
  namn: Subventionerad uthyrning av kommunens lokaler
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar som bokar kommunala lokaler och anläggningar
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor för bidragsberättigade föreningar
  - Bokningen ska göras av en ansvarig myndig företrädare för föreningen
  - Alkohol, droger och rökning är förbjudna i kommunens lokaler och anläggningar
  - Föreningen ska följa anvisningarna och ordningsreglerna för den bokade lokalen eller anläggningen
  belopp: Subventionerad hyra enligt kommunens taxor; kommunen publicerar ingen generell aktuell stödnivå
