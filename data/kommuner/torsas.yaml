bidrag:
- namn: Föreningsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar och organisationer i Torsås kommun
  deadlines:
    typ: fasta
    datum:
    - 01-31
  krav:
  - Föreningen ska ha stadgar godkända av riksorganisationen eller av kommunen
  - Föreningen ska ha minst 5 medlemmar i åldrarna 5–25 år som regelbundet deltar i föreningens ledarledda verksamhet
  - Föreningen ska ha minst 25 ledarledda sammankomster per år, med minst 5 deltagare (exkl. ledare) i bidragsberättigad ålder
  - Föreningen ska bedriva sin verksamhet och ha huvuddelen av sina medlemmar i kommunen
  - Föreningen ska ha varit verksam i minst 6 månader
  - Föreningen får normalt inte vara ekonomisk förening, politisk förening, religiös förening, knuten till svenska försvaret
    eller en stöd-/supporterklubb
  - Ansökan ska göras av föreningens huvudstyrelse och innehålla ansökningsblankett, verksamhetsplan, årsmötesprotokoll samt
    ekonomisk- och revisionsberättelse
  belopp: 'Grundbidrag enligt normer: 1 500 kr för 5–10 aktiva i åldrarna 5–25 år, 4 000 kr för fler än 10 aktiva, samt 225
    kr per aktiv medlem 5–25 år. Anläggnings- och lokalbidrag enligt norm, exempelvis klubbhus med omklädning/dusch 15 000
    kr, lokalbidrag för hyrd extern lokal (50 % av hyran) högst 15 000 kr, A-plan 20 000 kr och ridhus 60 000 kr, bland flera
    poster i normlistan.'
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Sista vardagen i januari.
  kalla_url: https://www.torsas.se/kultur-och-fritid/forenings-och-investeringsbidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Sista vardagen i januari.
  senast_verifierad: '2026-08-23'
  id: torsas-foreningsbidrag
- namn: Investeringsbidrag av mindre slag
  kategori:
  - ovrig
  - idrott
  - kultur
  foreningstyp: *alla
  malgrupp: Föreningar och organisationer i Torsås kommun
  deadlines:
    typ: fasta
    datum:
    - 10-01
  krav:
  - Föreningen som söker ska vara berättigad till föreningsbidrag/kulturbidrag eller driva en allmän samlingslokal
  - Föreningen ska medfinansiera investeringen med minst en tredjedel av eget ideellt arbete eller egna medel (ideellt arbete
    värderas till 220 kr per timme)
  - Anläggningen/lokalen ska användas i betydande omfattning
  - Ansökan ska bifogas protokollsutdrag, kostnadskalkyl, finansieringsplan, ritningar och eventuella offerter samt övrigt
    föreningen vill åberopa
  - Föreningen ska i möjligaste mån visa att försök gjorts att finansiera investeringen på annat sätt
  - Bidrag söks på förhand och projektet får inte ha påbörjats
  belopp: Maxbelopp 30 000 kr, dock högst 66 procent (två tredjedelar) av den totala investeringskostnaden. Utbetalning sker
    i efterhand när investeringen är avslutad.
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ordinarie ansökan senast 1 oktober året före budgetåret; ansökan kan även göras löpande under budgetåret om medel finns kvar.
  kalla_url: https://www.torsas.se/wp-content/uploads/Regler-investeringsbidrag-av-mindre-slag_reviderad.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunen anger 1 oktober eller löpande; registrerat som fast huvuddatum med notering om att löpande ansökan
    också kan förekomma.
  senast_verifierad: '2026-08-23'
  id: torsas-investeringsbidrag-av-mindre-slag
- namn: Kulturbidrag
  kategori:
  - kultur
  foreningstyp: [kultur, hembygd, annat]
  malgrupp: Föreningar och organisationer i Torsås kommun
  deadlines:
    typ: fasta
    datum:
    - 03-01
  krav:
  - Sökande ska vara förening, organisation, offentlig förvaltning eller studieförbund med verksamhet i Torsås kommun
  - Kulturverksamheten ska bedrivas inom Torsås kommun, med prioritet för barn- och ungdomsverksamhet
  - Ansökan ska innehålla program, verksamhetsbeskrivning och kostnadsbudget
  - Sökande kan bara beviljas antingen bidrag eller förlustgaranti per år, inte båda
  - Om verksamheten inte genomförs efter beviljat bidrag ska bidraget återbetalas
  belopp: Inget fast belopp anges. Storleken på bidraget avgörs av bildningsnämndens ekonomiska förutsättningar.
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan senast 1 mars.
  kalla_url: https://www.torsas.se/kultur-och-fritid/kultur/kulturbidrag/
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
  id: torsas-kulturbidrag
- namn: Föreningsbidrag inom socialnämndens område
  kategori:
  - social
  - pensionar
  - funktionsratt
  foreningstyp: [social, ungdom, annat]
  malgrupp: Föreningar och organisationer i Torsås kommun
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Föreningen ska bedriva verksamhet inom socialnämndens område och ha medlemmar från Torsås kommun
  - Föreningen ska ha antagna stadgar och en vald styrelse
  - Ansökan ska vara undertecknad av föreningens ordförande samt kassör/sekreterare och revisor
  - Ansökan ska innehålla föregående års verksamhetsberättelse med uppgift om omfattning, kostnader och medlemsantal (totalt,
    aktiva och stödmottagare)
  - Bidrag beviljas inte för fasta och/eller driftskostnader
  belopp: Inget fast belopp anges. Storleken på bidragen beror på socialnämndens budgetram.
