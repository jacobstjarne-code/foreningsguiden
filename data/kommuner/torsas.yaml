- id: torsas-allmanna-samlingslokaler
  namn: Bidrag till allmänna samlingslokaler
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, hembygd, social, annat]
  malgrupp: Ideella föreningar som driver en allmän samlingslokal
  deadlines:
    typ: fasta
    datum: [04-01]
  krav:
  - Föreningen ska äga eller disponera lokalen och ansvara för dess förvaltning och uthyrning
  - Lokalen ska vara öppen för föreningsmöten, studier, kultur- och fritidsverksamhet samt andra allmänna sammankomster på skäliga och likvärdiga villkor
  - Föreningen ska vara demokratiskt uppbyggd och verksamheten ska drivas utan vinstsyfte
  - Det ska finnas ett varaktigt lokalt behov, en allsidig användning och en godtagbar standard på lokalen
  - Föreningen ska ha årsmötesantagna stadgar, minst fem styrelseledamöter och ordnad bokföring
  - Ansökan ska innehålla föregående årsmötesprotokoll, verksamhetsberättelse, ekonomisk berättelse, revisionsberättelse och planerad verksamhet; verksamhetsberättelsen ska redovisa uthyrningens omfattning
  belopp: Bildningsnämnden beslutar årligen om bidragets storlek; kommunen publicerar ingen generell beloppsnivå eller beräkningsregel
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan senast 1 april; sena ansökningar behandlas inte.
  kalla_url: https://www.torsas.se/wp-content/uploads/regler_bidrag_allmanna_samlingslokaler.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
- id: torsas-studieforbundsstod
  namn: Studieförbundsstöd
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, annat]
  malgrupp: Studieförbund med lokal folkbildningsverksamhet i Torsås kommun
  deadlines:
    typ: okand
    datum: []
  krav:
  - Studieförbundet ska redovisa lokala studiecirkeltimmar, deltagare och unika deltagare i Torsås kommun
  - Studieförbundet ska redovisa annan folkbildningsverksamhet med timmar och deltagare samt kulturprogram med antal arrangemang och deltagare
  - Redovisningen ska beskriva verksamheten i Torsås, samarbeten med lokala föreningar eller andra aktörer och vilka målgrupper som nåtts
  - Ansvarig kontaktperson, adress, telefonnummer och bankgiro ska anges i kommunens redovisningsmall
