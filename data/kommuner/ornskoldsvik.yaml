  beskrivning: Föreningen ska vara skriven och ha verksamhet i Örnsköldsviks kommun samt vara registrerad i kommunens föreningsregister.
    Föreningen ska vara ideell, ansluten till en riksorganisation eller motsvarande, ha antagna stadgar, vald styrelse, fungera
    enligt demokratiska principer, ha minst tio aktiva (betalande, deltagande) medlemmar och ha varit verksam i minst ett
    år innan bidrag kan sökas. Organisationsnummer krävs (söks hos Skatteverket) samt plus- eller bankgiro i föreningens namn.
