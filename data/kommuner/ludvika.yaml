  krav:
  - Föreningen ska bedriva fritids- eller idrottsverksamhet inom Ludvika kommun
  - Föreningen ska äga eller hyra anläggning/lokal inom Ludvika kommun; hyrd anläggning/lokal ska vara fastställd i avtal
    med Ludvika kommun eller annan hyresvärd
  - Föreningen ska ha godkända stadgar, vara egen juridisk person med säte i Ludvika, ha huvuddelen av medlemmarna i kommunen
    och minst tio medlemmar som regelbundet deltar i verksamheten
  - Föreningen ska vara öppen för alla som följer stadgarna, ha betald medlemsavgift, bygga på frivilligt ansvarstagande och
    ha en aktiv kontaktperson med e-postadress
  - Barn- och ungdomsverksamhet ska bedrivas i en tobaks-, alkohol-, drog- och dopningsfri miljö
  - Bidrag utgår inte till lokaler/anläggningar som bokas via kommunens lokalbokningssystem, och inte till kanslier
