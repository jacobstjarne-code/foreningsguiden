  krav:
  - Föreningen ska vara verksam i Ludvika kommun
  - Personen med lönebidragsanställning ska vara folkbokförd i Ludvika kommun
  - Arbetsförmedlingen ska ha beviljat statsbidrag (lönebidrag) för den aktuella anställningen
  - Ansökan görs per anställd på blanketten 'Ansökan om kommunalt bidrag för ny lönebidragsanställning' tillsammans med kopia
