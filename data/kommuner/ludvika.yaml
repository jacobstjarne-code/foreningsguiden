  - social
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 09-15
  krav:
  - Föreningen ska vara en förening för personer med funktionsnedsättning eller en pensionärs-/äldreförening, eller en samorganisation
    till sådana föreningar (stöd beviljas inte samtidigt till förening och samorganisation)
  - Föreningen/samorganisationen ska vara representerad med medlemmar och styrelse i Ludvika (Ludvika/Smedjebacken)
  - Verksamhetsstöd beviljas i direkt proportion till medlemsantalet, dock inte mer än vad föreningen sökt eller till förening
    som uppenbart inte är i behov av ekonomiskt stöd
  - Ansökan ska redovisa antal medlemmar, verksamhetsförslag och kostnadsberäkning för ansökningsåret samt årsmöteshandlingar
    (verksamhetsberättelse, bokslut, revisionsberättelse) från senaste årsmöte
