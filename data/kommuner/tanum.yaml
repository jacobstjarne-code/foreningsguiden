  krav:
  - Arrangemanget ska vara ideellt och äga rum inom Tanums kommun, eller vara ett samarrangemang mellan flera kommuner
  - Arrangemanget ska vara offentligt, så att allmänheten kan delta utan att vara medlem i föreningen
  - Arrangörsbidraget ska sökas innan arrangemanget genomförs
  - Eventuellt överskott från arrangemanget ska återgå till den ideella verksamheten och redovisas
  - Slutredovisning ska lämnas till barn- och utbildningsförvaltningen senast tre månader efter arrangemanget
