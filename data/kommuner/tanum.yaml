- namn: Ledarutbildningsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med ledarutbildning
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Föreningen ska ha minst 10 medlemmar i åldern 3-25 år folkbokförda i Tanums kommun
  - Föreningen, inte den enskilda ledaren, väljer kurs och ansöker om bidraget
  - Kursdeltagaren ska ha fyllt 13 år
  - Bidrag kan sökas för kursavgift, resa, boende och kursmaterial, men inte för kurser som arrangeras tillsammans med Tanums
    kommun
  - Ansökan ska bifogas bevis på genomgången kurs, kvitto på betald kursavgift och kursprogram
  belopp: Föreningen anger själv sökt belopp, max 5 000 kr per år och förening. Föreningar som föregående år redovisat fler
    än 300 sammankomster för lokalt aktivitetsstöd får ytterligare 15 kr per sammankomst utöver 300, upp till max 10 000 kr
    per år
  sen_ansokan: Ansökan ska göras senast 60 dagar efter avslutad kurs, och endast för kurser genomförda under aktuellt kalenderår
