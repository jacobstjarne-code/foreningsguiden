  krav:
  - Studieförbundet ska vara godkänt av Folkbildningsrådet eller SISU Idrottsutbildarna
  - Verksamheten ska bedrivas i Tanums kommun, och studieförbundet ska ha egen ekonomisk förvaltning och en ansvarig styrelse
    med säte i kommunen eller Västra Götalandsregionen
  - 'Bidraget fördelas i fyra delar: grundbidrag (50%), kulturbidrag (10%), förstärkningsbidrag (15%) och verksamhetsbidrag
    (25%), där de tre senare kräver redovisad skattefinansierad verksamhet från föregående år'
  - Ansökan ska bifogas verksamhetsberättelse, årsredovisning, revisionsberättelse för föregående år samt verksamhetsplan
    för innevarande år
  belopp: Grundbidraget fördelas efter respektive studieförbunds andel av föregående års totala anslag. Studieförbund som
