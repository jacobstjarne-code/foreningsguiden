- namn: Bidrag till handikapp- och pensionärsföreningar
  kategori:
  - pensionar
  - funktionsratt
  malgrupp: Pensionärs- och funktionsrättsföreningar
  deadlines:
    typ: fasta
    datum:
    - 03-31
    - 09-30
  krav:
  - Föreningen ska vara en intresseförening för personer med funktionsnedsättning eller pensionärer, ansluten till en riks-
    eller paraplyorganisation
  - Föreningen ska uppfylla de allmänna bestämmelserna
  - Föreningen ska tidigare ha ansökt om och beviljats startbidrag; kan inte få både startbidrag och grundbidrag samma kalenderår
  - För föreningar vars verksamhetsområde omfattar flera kommuner utgår bidrag endast till de medlemmar som är folkbokförda
    i Tanums kommun
  - För föreningar med verksamhet för funktionsnedsatta räknas endast personer med funktionsnedsättning som medlem, men en
    familjemedlem kan räknas med om även denne betalar medlemsavgift
  - Ansökan ska bifogas resultaträkning, balansräkning, undertecknad revisionsberättelse och verksamhetsberättelse från föregående
    år
  belopp: '10-50 medlemmar: 3 000 kr. 51 medlemmar och fler: 20 kr per medlem'
