    - 02-25
    - 08-25
  krav:
  - En gruppaktivitet ska pågå minst 60 minuter med en ledare närvarande som samlar alla i början och slutet; ledaren får
    inte leda flera aktiviteter samtidigt
  - Ledaren ska ha fyllt 13 år och vara medlem i en förening inom Riksidrottsförbundet
  - Minst 3 och max 30 deltagare räknas per aktivitet, i åldern 7-25 år (ingen övre åldersgräns för deltagare med funktionsnedsättning),
