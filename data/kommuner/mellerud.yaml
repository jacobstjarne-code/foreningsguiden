- id: mellerud-kommunalt-investeringsbidrag-bygdepeng
  namn: Kommunalt investeringsbidrag – bygdepeng
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Lokala föreningar registrerade hos kommunstyrelsen som investerar i lokaler, anläggningar eller varaktig utrustning
  deadlines:
    typ: fasta
    datum: ['09-30']
  krav:
  - Sökanden ska vara en lokal förening registrerad hos kommunstyrelsen; företag och privatpersoner är inte behöriga
  - Investeringen ska vara nödvändig för verksamheten och avse material till ny-, till- eller ombyggnad, ett särskilt stort renoveringsbehov, mötesplats, tillgänglighet, energi- eller miljöåtgärd eller varaktig utrustning
  - Föreningen ska ha god medfinansiering i pengar eller ideell tid, redovisa andra sökta stöd och normalt invänta beslut innan arbetet börjar
  - Föreningen ska äga, arrendera eller långtidshyra objektet; fastighetsägaren ska godkänna byggnationen om föreningen inte äger det
  - Ansökan ska innehålla syfte, kostnadsberäkning med särredovisat arbete och material, beskrivning eller ritning, tre kostnadsförslag, verksamhetsberättelse, ekonomi, revision och behöriga underskrifter
  - Användning och effekt ska redovisas med fakturor eller kvitton senast ett år efter utbetalningen; outnyttjade eller felanvända medel återkrävs
  belopp: Individuellt prövat investeringsbidrag inom årlig budget och efter avräkning av annan finansiering; ingen generell maxnivå publiceras
