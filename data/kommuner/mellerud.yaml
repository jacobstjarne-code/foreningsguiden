- id: mellerud-studieforbundsbidrag
  namn: Bidrag till studieförbund
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, annat]
  malgrupp: Studieförbund som bedriver verksamhet i Mellerud och vars centralorganisation är statsbidragsgodkänd av Folkbildningsrådet
  deadlines:
    typ: fasta
    datum: ['04-30']
  krav:
  - Studieförbundet ska vara verksamt i Mellerud och dess centralorganisation ska vara godkänd för statsbidrag av Folkbildningsrådet
  - Uppdragsutbildning och verksamhet som får kommunalt aktivitetsstöd eller motsvarande stöd är inte bidragsgrundande
  - Ansökan ska innehålla ekonomisk redovisning, verksamhets- och revisionsberättelse för senast avslutat verksamhetsår samt verksamhetsplan och riktlinjer för kommande år
  - Ett studieförbund med verksamhet i flera kommuner ska särredovisa verksamhet och ekonomi för Mellerud
  - Bidragsmottagaren ska på kommunens begäran ställa räkenskaper och redovisningshandlingar till förfogande
