- id: mellerud-foreningsbidrag-inom-socialnamndens-verksamhetsomrade
  namn: Föreningsbidrag inom socialnämndens verksamhetsområde
  status: aktiv
  kategori: [social, pensionar, funktionsratt]
  foreningstyp: [social, annat]
  malgrupp: Pensionärsorganisationer, funktionsrättsföreningar och anhörigföreningar med verksamhet och medlemsbas i Mellerud
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
  - Sökanden ska vara en pensionärsorganisation, förening inom funktionsrättsrörelsen eller anhörigförening; en pensionärsorganisation ska rikta verksamheten till pensionärer eller ha minst två tredjedelar pensionärer bland de bidragsberättigade medlemmarna
  - Föreningen ska ha verksamhet och en bas av medlemmar i Melleruds kommun även om det geografiska verksamhetsområdet är större
  - Bedömningen skiljer mellan helt lokala föreningar, föreningar som stöder kommuninvånare men har begränsad lokal verksamhet och lokala sammanslutningar vars grundföreningar får eget stöd
  - Ansökan ska innehålla årsmötesprotokoll, föregående års verksamhetsberättelse, bokslut och revisionsberättelse, registrerat plus- eller bankgiro samt underskrift av firmatecknare
  - Föreningens planerade verksamhet väger särskilt tungt vid bedömningen
