    datum: ['03-15']
  krav:
  - Föreningen ska uppfylla kommunens allmänna bidragsvillkor och lokalen eller anläggningen ska behövas för bidragsberättigad verksamhet för barn och unga
  - Lokalen får inte omfattas av kommunens subventionerade hyrestaxor
  - Föreningen ska föregående år ha genomfört minst 20 bidragsberättigade aktiviteter och fått aktivitetsbidrag; nyligen godkända föreningar är undantagna
  - Bokningsbara tider ska i möjligaste mån göras tillgängliga för andra ideella föreningar i Mellerud och endast de delar som används i verksamheten får räknas
  - Hyra eller arrende, ränta, värme och el, renhållning, sotning, vatten och avlopp samt fastighetsförsäkring ska styrkas; andra fastighetsbidrag och verksamhetens ungdomsandel påverkar beräkningen
