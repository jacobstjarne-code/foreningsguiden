- id: hoor-lokalbidrag
  namn: Anläggningsbidrag – barn- och ungdomsföreningar
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar med lokal
  deadlines:
    typ: fasta
    datum:
    - 04-01
  krav:
  - Föreningen ska bedriva stödberättigad barn- och ungdomsverksamhet
  - Lokal/anläggning ligger inom Höörs kommun, är godkänd av nämnden och uppfyller myndighetskrav (bygglov, brandsäkerhet,
    försäkring)
  - Godkända kostnader styrkta med kvitto
  - Vid första ansökan bifogas kopia av hyreskontrakt
  - Ny eller förändrad hyra ska anmälas senast 1 september året före
  belopp: Max 70% av godkända kostnader (hyra, arrende, värme, el, vatten/avlopp, renhållning, försäkring, löpande underhåll).
    Föreningar som driver egen anläggning kan i stället teckna ett särskilt avtal baserat på föregående års bokslut, tecknat
    på 3 år.
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: 'Möjlig men med reducerat belopp: 25% reducering vid försenad ansökan, 50% efter 15 dagar. Ansökan mer än en
    månad försent behandlas ej.'
