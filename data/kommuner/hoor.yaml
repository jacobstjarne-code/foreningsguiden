- id: hoor-aktivitetsbidrag
  ansokningsvag: "En separat kommunal ansökan eller aktivitetsredovisning krävs via InterbookFRI och Höörs e-tjänster; RF-rapporteringen räcker inte ensam."
  namn: Lokalt aktivitetsstöd
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
