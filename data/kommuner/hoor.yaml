- id: hoor-kulturverksamhet
  namn: Verksamhetsbidrag – kulturföreningar
  foreningstyp: [kultur, hembygd]
  kategori:
  - kultur
  malgrupp: Kulturföreningar
  deadlines:
    typ: fasta
    datum:
    - 04-01
  krav:
  - Föreningen ska bedriva kontinuerlig kulturverksamhet i Höör och vara registrerad och drogfri
  - Föreningen är registrerad hos sektorn för kultur, arbete och folkhälsa
  - Verksamheten är drogfri
  - Ansökan bifogas årsmöteshandlingar (protokoll, verksamhetsberättelse, verksamhetsplan, ekonomisk redovisning, revisionsberättelse,
    budget)
  - Stödet ska i första hand möjliggöra kulturarrangemang som annars inte blir av och kan omfatta bygdegårdsdrift
  - Samma verksamhet får inte finansieras dubbelt av kommunen
  belopp: Individuellt prövat utifrån bland annat föregående års överskott och verksamhetens omkostnader
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: 'Ej möjlig efter deadline. Undantag: anstånd kan beviljas av nämnden vid särskilda skäl.'
