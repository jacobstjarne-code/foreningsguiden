  - Godkända kostnader styrkta med kvitto
  - Vid första ansökan bifogas kopia av hyreskontrakt
  belopp: Max 70% av godkända kostnader (hyra, arrende, värme, el, vatten/avlopp, renhållning, försäkring, löpande underhåll).
