- id: hoor-subventionerad-foreningstaxa
  namn: Subventionerad föreningstaxa och träningstider
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, ovrig]
  malgrupp: Bidragsberättigade Höörföreningar som bokar kommunala lokaler och anläggningar
  deadlines: { typ: fasta, datum: [03-01, 04-30, 09-01] }
  krav:
  - Föreningen ska vara bidragsberättigad i Höör och söka säsongstid inom rätt ansökningsperiod
  - En vuxen företrädare ansvarar för bokningen och lokalerna ska vara drog- och rökfria
  - Fördelningen bedöms efter grupper, aktiva, tidigare nyttjande och behov samt ska vara könsneutral och tillgänglig
  belopp: Subventionerad U-taxa 2026, från 50 kr per timme i bibliotekslokal till 111 kr per timme för vissa hallar och anläggningar
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Säsongsansökan senast 1 mars, 30 april eller 1 september beroende på anläggning och säsong; strötider kan bokas löpande
  kalla_url: https://www.hoor.se/app/uploads/kaf_taxa_och_riktlinjer_for_uthyrning_av_kommunala_lokaler_indexupprakning_ks_2025_12_02_c2a7_258.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Privatpersoner kan boka till ordinarie taxa, men den subventionerade U-taxan gäller endast bidragsberättigade föreningar.
  senast_verifierad: '2026-08-18'
- id: hoor-driftsbidrag-enskilda-vagar
  namn: Driftsbidrag till enskilda vägar
  foreningstyp: [annat]
  kategori: [ovrig]
  malgrupp: Vägorganisationer med dokumenterat väghållningsansvar
  deadlines: { typ: fasta, datum: [03-31] }
  krav:
  - Sökanden ska vara en vägförening, vägsamfällighet eller annan organiserad sammanslutning med dokumenterat väghållningsansvar
  - Vägen ska vara öppen för allmänt bruk och vara minst 400 meter eller få statsbidrag
  - Vägen får inte endast betjäna skogs-, lantbruks- eller industriverksamhet, en fastighet, en annan kommun eller redan underhållas av kommunen
  - Organisationen ansvarar för underhåll, snöröjning, diken, sikt, kontroll och kommunal insyn
  - En ny väg ska styrkas med lagakraftvunnen lantmäteriförrättning, protokoll, beslut, karta och delägarlista
  belopp: 3 kr per meter väg
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 31 mars; statsbidragsförening ansöker vart femte år men verifierar utbetalningsunderlag årligen
  kalla_url: https://www.hoor.se/trafik-gator-parker/trafik-och-gator/gator-och-vagar/bidrag-till-enskilda-vagar/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
