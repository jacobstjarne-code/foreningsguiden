  - kultur
  malgrupp: Föreningar för ungdomsaktiviteter
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen uppfyller kraven för bidragsberättigad förening
  - Gruppaktivitet minst 60 minuter med minst en ledare (minst 15 år)
  - Minst 3 och högst 30 deltagare per aktivitet och tillfälle
  - Närvarokort förs och sparas i minst 5 år
  belopp: Årligen beslutat belopp per poäng; en poäng per deltagande medlem 5–20 år och fem poäng för deltagare med funktionsnedsättning oavsett ålder
  belopp_avser: per_forening
