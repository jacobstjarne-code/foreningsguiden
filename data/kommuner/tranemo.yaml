- id: tranemo-folkhalsobidrag
  namn: Folkhälsobidrag
  status: aktiv
  kategori: [idrott, social, funktionsratt, pensionar, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som vill pröva en ny hälsofrämjande eller förebyggande insats för kommuninvånare
  deadlines: {typ: fasta, datum: [02-01, 08-01]}
  krav:
  - Insatsen ska främja hälsa eller förebygga ohälsa hos invånare i Tranemo kommun
  - Projektet ska ligga utanför föreningens ordinarie verksamhet och pröva nya metoder eller arbetssätt
  - Projektet ska ha tydlig start, halvtidsuppföljning och sluttid samt arbeta för att ett fungerande arbetssätt kan leva vidare i ordinarie verksamhet
  - Insatsen ska ligga i linje med kommunens verksamhetsplan för folkhälsa och riktas gärna till grupper som annars är svåra att nå
  - Kommunens prioriterade målgrupper 2026–2028 är barn och unga, äldre samt personer med funktionsnedsättning
  belopp: Individuellt beslutat inom folkhälsoarbetets utvecklingsmedel; ingen generell nivå publiceras
