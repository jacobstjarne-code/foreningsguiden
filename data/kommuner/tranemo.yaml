- id: tranemo-bidrag-till-funktionshinderforeningar
  namn: Bidrag till funktionsrättsföreningar
  status: aktiv
  kategori: [funktionsratt, social]
  foreningstyp: [social, annat]
  malgrupp: Lokala funktionsrättsföreningar eller föreningar på annan ort med aktiva Tranemomedlemmar när lokalavdelning saknas
  deadlines: {typ: fasta, datum: [03-31]}
  krav:
  - Föreningen ska verka för att personer med funktionsnedsättning i Tranemo kommun får sina intressen tillgodosedda
  - Föreningen ska ha lokalavdelning i Tranemo eller, om sådan saknas, kunna redovisa aktiva medlemmar från Tranemo i en lokalförening på annan ort
  - Föreningen ska vara ideell och demokratisk samt lämna kompletta årsmötes-, ekonomi- och medlemsunderlag
  - Föreningen ska så långt möjligt delta i kommunens samverkansformer för målgruppens intressen
  - Registrerade föreningar ska uppdatera uppgifter och årshandlingar senast två månader efter årsmötet
  belopp: Ett fast grundbidrag för administration och verksamhetsplanering samt en rörlig andel av bidragsramen utifrån antalet Tranemomedlemmar
