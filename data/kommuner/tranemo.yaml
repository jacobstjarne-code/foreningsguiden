- id: tranemo-utvecklingsbidrag
  namn: Utvecklingsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar med nya idéer som utvecklar orten eller föreningens verksamhet
  deadlines: {typ: fasta, datum: [02-01, 08-01]}
  krav:
  - Sökanden ska vara en bidragsberättigad och registrerad förening som uppfyller kommunens allmänna föreningskrav
  - Projektet eller aktiviteten ska utveckla orten fysiskt, utveckla befintlig verksamhet eller skapa ny verksamhet och får inte finansieras inom en annan kommunal bidragsform
  - Föreningen ska medfinansiera genom egna medel, andra finansiärer eller ideellt arbete
  - Ansökan ska tydligt beskriva idé, mål, genomförande och förväntat resultat
  - En fullständig projektbudget ska visa total finansiering och hur kostnaderna har beräknats
  - Barns och ungas delaktighet, samverkan, generationsmöten, inkludering, nya målgrupper och kommunens folkhälsomål är prioriterande kriterier
  belopp: Individuellt beslutat efter projektets innehåll och budget; ingen generell nivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Två ansökningstillfällen publiceras varje år, den 1 februari och den 1 augusti
  kalla_url: *huvud
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
