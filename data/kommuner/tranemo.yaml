- id: tranemo-kommunstrategiskt-foreningsbidrag
  namn: Kommunstrategiskt föreningsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med större strategiska projekt eller projekt som kräver kommunal medfinansiering
  deadlines: {typ: fasta, datum: [03-01]}
  krav:
  - Projektet ska vara av strategisk art och bidra till kommunens vision, mål eller utvecklingsområden
  - Ansökan ska avse minst 150 000 kronor och lämnas året före den planerade investeringen
  - Föreningen ska själv svara för en del av finansieringen och åta sig framtida skötsel och underhåll av den anläggning som stödet avser
  - Stöd ges inte för hyrda lokaler, lättare underhåll eller arbete som redan har påbörjats eller slutförts
  - Vid ansökan över 500 000 kronor ska föreningens ekonomiska rapport vara granskad av en oberoende auktoriserad revisor
  - Föreningen ska vara registrerad, uppfylla de allmänna föreningskraven och lämna fullständiga projekt-, ekonomi- och årsmötesunderlag
  belopp: Ansökan ska avse minst 150 000 kr; nivån beslutas politiskt och kan utgöra kommunal medfinansiering
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast den 1 mars året före investeringen; redan påbörjade eller avslutade arbeten får inte stöd
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
- id: tranemo-investerings-och-upprustningsbidrag
  namn: Investerings- och upprustningsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med ungdomsverksamhet vid egen eller arrenderad anläggning samt föreningar som äger och driver samlingslokaler
  deadlines: {typ: fasta, datum: [08-31]}
  krav:
  - Investeringen ska avse nyanläggning, om- eller tillbyggnad eller upprustning av en föreningsägd eller arrenderad anläggning, samlingslokal eller bygdegård
  - Varaktiga inventarier kan omfattas om de hör till kärnverksamheten och har ett anskaffningsvärde på minst 20 000 kronor
  - Ansökan ska lämnas innan arbetet påbörjas och föreningen ska ha en underhållsplan som sträcker sig fem år framåt
  - Föreningen ska undersöka andra stöd från exempelvis Boverket, Riksidrottsförbundet och Allmänna arvsfonden
  - Tillgänglighet, ökat nyttjande, barn- och ungdomsverksamhet, jämställdhet samt miljö- och energieffektivisering prioriteras
  - Stöd ges inte för hyrd lokal, lättare underhåll eller redan påbörjat eller slutfört arbete utan särskilt igångsättningstillstånd
  - Genomförandet och godkända kostnader ska kontrolleras och redovisas före slututbetalning
  belopp: Högst 50 procent av totalkostnaden och högst 150 000 kr; utbetalningen räknas om om den godkända slutkostnaden blir lägre
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast den 31 augusti året före byggstart; föreningen har två år på sig att hämta ut beviljat stöd
  kalla_url: *huvud
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
