  - Ansökan om kommunbidrag och verksamhetsplan ska lämnas senast den 15 december året före utbetalningen
  - Föregående års lokala verksamhet ska rapporteras senast den 30 juni med unika deltagare, studietimmar, deltagare med funktionsnedsättning och antal kulturprogram
  - Verksamhetsberättelse med ekonomisk redovisning för kommunen och underskrivna kommunintyg ska lämnas senast den 30 juni
