bidrag:
- id: tranemo-verksamhetsbidrag
  namn: Verksamhetsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Idrotts- och övriga föreningar med barn- och ungdomsverksamhet samt kulturföreningar, hembygdsföreningar, byalag och samhällsföreningar
  deadlines: {typ: fasta, datum: [03-31]}
  krav:
  - Föreningen ska vara ideell, registrerad i kommunens föreningsregister och ha säte och verksamhet i Tranemo kommun
  - Föreningen ska ha organisationsnummer, föreningskonto, allmän e-postadress, demokratiska stadgar, vald styrelse och revisorer samt vara öppen för alla som följer stadgarna
  - Komplett ansökan ska innehålla aktuella föreningsuppgifter, medlemsantal, verksamhetsberättelse, resultat- och balansräkning, revisionsberättelse och justerat årsmötesprotokoll
  - Barn- och ungdomsföreningar ska ha minst tio medlemmar till och med 20 år och årligen redovisa en antagen och godkänd alkohol- och drogpolicy
  - Barn- och ungdomsverksamheten ska vara lekfull, allsidig och fri från urval och utslagning; elitsatsning får inte ske på bekostnad av breddverksamhet
  - Kulturföreningar ska långsiktigt bidra till bredd, kvalitet och mångfald; byalag och samhällsföreningar ska arbeta inkluderande för bred lokal utveckling
  belopp: Individuellt beslutat utifrån bland annat verksamhetens kvalitet, föreningens storlek och statliga LOK-stödsvolym; ingen generell nivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Bidraget söks en gång per år senast den 31 mars; kommunen publicerar ingen särskild regel för sena ansökningar
  kalla_url: *huvud
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
- id: tranemo-lokal-och-anlaggningsbidrag
  namn: Lokal- och anläggningsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som äger, arrenderar eller hyr lokaler och anläggningar samt föreningar som driver allmänna samlingslokaler
  deadlines: {typ: fasta, datum: [03-31]}
  krav:
  - Föreningen ska vara registrerad och uppfylla kommunens allmänna krav på ideell, demokratisk och lokalt verksam förening
  - Lokalen eller anläggningen ska vara godkänd för verksamheten enligt bygglov, brandskydd och övriga tillämpliga säkerhetsregler
  - Ny lokal ska godkännas av kommunen innan den anskaffas; ansökan ska innehålla driftkostnadsredovisning och vid hyra även hyreskontrakt och hyresfaktura
  - En allmän samlingslokal ska hållas öppen och tillgänglig för ortens föreningsliv, studier, kultur och andra mötes- och fritidsaktiviteter; endast en sådan lokal per ort kan få stödet
  - Bidrag ges inte för hyra av konstgräsplan med tillhörande omklädningsrum, hyra i egen lokal eller lokal i en annan kommun
  - Föreningar som driver samlingslokaler eller bygdegårdar ska ta ansvar för en ansvarsfull uthyrning till unga
  belopp: 40–70 procent av redovisade kostnader eller enligt särskild överenskommelse; kommunala idrottshallar kan subventioneras med högst 70 procent och Andrummet är kostnadsfritt för registrerade föreningar
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Årsansökan ska lämnas senast den 31 mars; tillfälligt hyrda lokaler kan omfattas högst två gånger per år
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
