  krav:
  - Sökanden ska vara en vägförening som ansvarar för en enskild väg i Hedemora kommun
  - För ordinarie stöd ska vägen ha statligt driftbidrag och föreningen ska ta ut medlemsavgift eller finansiera motsvarande andel på annat sätt
  - Vägförening utan statsbidrag kan prövas om vägen fyller flera funktioner och ger samhällsnytta, exempelvis för kollektivtrafik, utryckningsfordon eller allmänhetens kultur- och fritidsmiljöer
  - Föreningen ska årligen redovisa verksamhet och ekonomi och ansökan avser föregående års drift
  - Extra stöd kräver särskilda skäl och en rimlig, redovisad merkostnad
  belopp: Högst 20 % av statens beräknade drift- och underhållskostnad; väg utan statsbidrag beräknas mot likvärdig statsbidragsväg och extra stöd prövas efter faktisk kostnad
