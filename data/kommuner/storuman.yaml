  krav:
  - Minst tre deltagare i åldern 7–25 år ska delta i sammankomsten
  - Sammankomsten ska pågå minst en timme
  - Ledaren ska vara minst 13 år
  - Aktiviteten ska vara kostnadsfri för deltagarna och genomföras lokalt
  - En aktivitet får inte delas upp i flera mindre grupper för att öka bidraget
  - Närvarokort ska föras vid varje sammankomst och sparas av föreningen i minst 4 år
  belopp: 50 kronor per sammankomst/tillfälle (minst en timme, minst tre deltagare i åldern 7–25 år)
