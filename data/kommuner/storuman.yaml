- id: storuman-bygdemedel
  namn: Bygdemedel för utvecklingsinsatser
  kategori: [idrott, kultur, ovrig]
  malgrupp: Ideella föreningar och organisationer som gör allmännyttiga investeringar eller utvecklingsinsatser i kommunen
  deadlines:
    typ: fasta
    datum: [01-31]
  krav:
  - Sökanden ska vara en organisation med organisationsnummer och vara registrerad i Storumans kommuns föreningsregister
  - Projektet ska vara en allmännyttig investering eller utvecklingsinsats i en bygd som påverkats av vattenkraftsutbyggnaden
  - Ansökan ska innehålla syfte, kostnads- och finansieringsbudget, stadgar, firmateckningsprotokoll samt senaste verksamhets-, ekonomi- och revisionshandlingar
  - Projektet får inte avse affärsverksamhet och föreningen ska bidra med egen eller annan finansiering
  belopp: Normalt högst 90 procent av faktiska, godkända och styrkta projektkostnader
  sen_ansokan: För Storuman är ansökningsperioden 1 december–31 januari
