- id: storuman-attraktivitetshojande-insatser-2026
  namn: Attraktivitetshöjande utvecklingsinsatser 2026
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar och andra organisationer som genomför allmännyttiga utvecklingsinsatser i Storumans kommun
  deadlines:
    typ: fasta
    datum: [04-30]
  krav:
  - Insatsen ska stärka attraktivitet, livsmiljö eller utveckling i Storumans kommun och komma fler än en enskild till nytta
  - Stödet kan avse aktiviteter och evenemang, mindre investeringar eller medfinansiering av större utvecklingsprojekt
  - Insatsen får inte konkurrera med näringsverksamhet, ersätta kommunens eller statens ordinarie ansvar eller skapa nya löpande kommunala kostnader
  - Ansökan ska beskriva insatsen, nyttan, genomförandet samt kostnads- och finansieringsbudget
  - Beviljade medel ska användas och redovisas inom ett år; outnyttjade medel ska återbetalas
  belopp: Högst 100 procent av godkända kostnader efter individuell prövning
  sen_ansokan: Ansökan för 2026 skulle lämnas senast 30 april
  kalla_url: https://www.storuman.se/kommun/kultur-fritid/Foreningar/stod-bidrag-och-stipendier/attraktivitetshojande-utvecklingsinsatser/
