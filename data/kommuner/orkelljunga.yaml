  - Aktiviteterna ska rikta sig till barn och unga 6–16 år under jul-, sport-, påsk-, sommar- eller läslov (höstlov)
  - Aktiviteterna ska ligga utanför föreningens ordinarie verksamhet, vara ledarledda, genomföras på en nivå som inte kräver
    förkunskaper, och vara kostnadsfria för deltagaren
  - Anmälan om planerad aktivitet görs via kommunens e-tjänst senast fyra veckor innan genomförandet, med 'Lovaktivitet' ikryssad
    som kategori
  - Redovisning av genomförda aktiviteter ska lämnas senast 14 dagar efter genomförandet enligt anvisning
