- namn: Verksamhetsbidrag till studieförbund
  kategori:
  - kultur
  - ovrig
  foreningstyp:
  - kultur
  - annat
  malgrupp: Studieförbund som stöds av Region Skåne och bedriver verksamhet i Örkelljunga
  deadlines:
    typ: fasta
    datum:
    - 04-01
  krav:
  - Organisationen ska vara ett studieförbund som stöds av Region Skåne inom ramen för regionens stöd till studieförbund.
  - Den gemensamma ansökan ska beskriva studieförbundets organisation och förändringar samt arbetet med demokrati, delaktighet, utbildningsklyftor och kulturliv inom Familjen Helsingborg.
  - Som underlag för grundbidraget ska föregående års studiegruppstimmar, genomförda studiecirklar och unika deltagare redovisas separat för Örkelljunga.
  - Som underlag för aktivitetsbidraget ska planerade projekt, kulturarrangemang, annan bildningsverksamhet och motsvarande för andra halvåret innevarande år och första halvåret kommande år redovisas separat för kommunen.
  - Ansökan ska vara enkel, kort och koncis och lämnas digitalt genom den gemensamma ansökningsprocessen senast den 1 april.
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Två tredjedelar av kommunens årliga studieförbundsanslag fördelas proportionellt efter föregående års studiegruppstimmar; en tredjedel fördelas efter nämndens bedömning av planerad verksamhet utanför studiecirklar. Totalsumman publiceras inte.
  sen_ansokan: Ansökan ska lämnas digitalt senast den 1 april. Beslut fattas normalt vid ansvarig nämnds möte i juni eller snarast därefter.
