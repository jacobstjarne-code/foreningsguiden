  krav:
  - 'Föreningen ska uppfylla kommunens grundkrav för föreningsstöd: vara registrerad i Örkelljunga kommuns föreningsregister,
    vara öppen för alla och välkomna nya medlemmar, vara uppbyggd enligt demokratiska principer och arbeta mot kränkningar
    och diskriminering, bedriva allmännyttig ideell verksamhet under större delen av året med huvuddelen förlagd till Örkelljunga
    kommun, ha antagna stadgar arkiverade hos kommunen samt en drog- och likabehandlingspolicy antagen av varje ny styrelse,
    ha organisationsnummer från Skatteverket, och senast 1 april ha lämnat in senaste årsmötesprotokoll tillsammans med ekonomisk
    redovisning och revisionsberättelse för senaste verksamhetsåret. Stöd betalas inte ut till studieorganisationer/förbund,
    stödföreningar, skolidrottsföreningar med verksamhet på skoltid eller sektioner/underföreningar.'
  - Föreningen ska uppfylla definitionen som barn- och ungdomsförening (minst 5 aktiva medlemmar 1–19 år), handikapporganisation
    (minst 5 aktiva medlemmar med funktionsnedsättning) eller pensionärsförening (minst 5 aktiva medlemmar med pension/förtidspension)
  - Föreningen ska redovisa sina sammankomster i digitalt närvarokort och redovisa minst 10 sammankomster per kalenderår (5
    per ansökningsperiod)
  - Sammankomst definieras som ett planerat, ledarlett aktivitetstillfälle om minst 45 minuter med minst fem medlemmar enligt
    ovanstående kategorier; får inte vara en entrébelagd tävling, ett kommersiellt evenemang, en studiecirkel eller ett styrelsemöte
  - Samma person får bara redovisas i en aktivitet/dag och förening; en grupp får inte delas i mindre grupper för att erhålla
    mer aktivitetsstöd
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: "Total årsbudget fastställs; 70% till barn/unga, 30% till handikapp-/pensionärsföreningar"
  sen_ansokan: Vid särskilda skäl kan ansökningar behandlas vid annan tidpunkt under kalenderåret än den avsedda, och senare
    inlämning av handlingar kan accepteras enligt kommunens bedömning.
