  - Föreningen ska ha kostnader för lokaler som används för barn- och ungdomsverksamhet, verksamhet för funktionshindrade
    eller verksamhet för pensionärer
  - 'Ansökan baseras på föreningens faktiska hyres-/driftkostnader: kallhyra (max 5 000 kr/månaden), värme och el, samt vatten
