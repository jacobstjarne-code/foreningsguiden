  - Föreningen ska ha sökt stöd hos annan finansiär
  - Stödet är ett förluststöd avsett att täcka föreningens eventuella underskott på evenemanget; fördelas i första hand till
    arrangemang för kommunens prioriterade grupper
  - Stöd kan inte beviljas för lön avsedd för projektledning eller för mat och dryck
  - Med ansökan ska bifogas beskrivning av arrangemangets karaktär och syfte, tid och plats för genomförande, uppgift om eventuell
    entréavgift, ekonomisk kalkyl inklusive uppgift om andra stöd, uppgift om konto för utbetalning, samt redovisning av vilka
    andra stöd som sökts och beviljats
  - Utbetalning sker efter redovisning som ska innehålla verifikation på utgifter
  belopp: Arrangemangsstöd kan beviljas med max 10 000 kronor per ansökan.
  sen_ansokan: Vid särskilda skäl kan ansökningar behandlas vid annan tidpunkt under kalenderåret än den avsedda, och senare
