- id: nora-evenemangsstod
  namn: Evenemangsstöd
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som arrangerar offentliga evenemang i Nora kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska ha säte eller verksamhet i Nora och evenemanget ska vara offentligt, inkluderande samt partipolitiskt och religiöst obundet
  - Evenemanget ska genomföras i Nora kommun och bedöms bland annat efter miljö, hälsa, jämställdhet, mångfald och ungas delaktighet
  - Ansökan ska innehålla budget, uppgift om annan finansiering, säkerhet och tillstånd samt en plan för kommunikation
  - Nora kommuns stöd ska synliggöras enligt anvisning och genomförande, ekonomi, publik och kommunikation ska redovisas i Rbok
  - Oanvända medel ska återbetalas och väsentliga ändringar ska godkännas av kommunen
