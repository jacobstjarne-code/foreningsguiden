  deadlines:
    typ: relativ
    datum: []
  krav:
  - Aktiviteten ska genomföras under ett skollov och rikta sig till barn och unga 3–20 år
  - Aktiviteten ska vara kostnadsfri, öppen för alla i målgruppen och genomföras av en förening
  - Ansökan ska lämnas före lovet med uppgifter om aktivitet, målgrupp, tid, plats och kostnader
  - Genomförandet ska följa kommunens allmänna villkor för föreningsstöd och redovisas enligt beslutet
