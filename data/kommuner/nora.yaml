- id: nora-foreningshandlingar-och-insyn
  vad: Föreningshandlingar, värdegrund och kommunal insyn
  beskrivning: Föreningen ska ha stadgar, vald styrelse och revisor, föra medlemsregister och räkenskaper samt kunna lämna årsmötesprotokoll, verksamhets- och revisionsberättelse, ekonomisk redovisning, verksamhetsplan och närvarounderlag. Verksamheten ska vara fri från alkohol, narkotika, dopning och tobak enligt kommunens policy.
  system: Rbok och kommunens e-tjänster
