  malgrupp: Bidragsberättigade föreningar med regelbunden verksamhet för barn och unga
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Föreningen ska vara lokalt verksam och ansluten till en bidragsberättigad riksorganisation
  - Aktiviteten ska vara planerad av styrelse, sektion eller medlemsmöte och pågå minst 60 minuter
  - Minst fem deltagare 3–20 år ska delta; ledare i åldersgruppen får räknas och samma person får bara räknas en gång per dag och förening
  - Endast lokala aktiviteter och tävlingar utan entré berättigar till stöd; dans, basar, bingo, studiecirklar och distrikts- eller riksarrangemang utesluts
  - Närvarokort ska undertecknas av ledaren och sparas i minst fyra år
  belopp: 25 kronor per bidragsberättigad sammankomst
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Höstens aktiviteter redovisas senast 25 februari och vårens senast 25 augusti; sena ansökningar behandlas inte.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunens två källor säger olika om åldern. E-tjänsten anger deltagare 3-25 år medan bidragsreglerna, antagna av fullmäktige 2015-10-14 och fortfarande gällande, anger 3-20 år. Fältet följer bidragsreglerna.
  senast_verifierad: '2026-09-18'
- id: nora-driftsbidrag
  namn: Driftsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
