- id: nora-utvecklingsbidrag
  namn: Utvecklingsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som utvecklar kultur- och fritidsverksamheten och når nya grupper
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Insatsen ska utveckla eller bredda kultur- och fritidsverksamheten och ligga utanför föreningens ordinarie verksamhet
  - Barn och unga, jämställdhet, personer med funktionsnedsättning, integration och folkhälsa är prioriterade områden
  - Projekt med extern medfinansiering prioriteras och ansökan ska beskriva ändamål, målgrupp, genomförande och ekonomi
