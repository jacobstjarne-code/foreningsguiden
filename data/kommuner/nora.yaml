  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska äga anläggningen eller ha ett långsiktigt nyttjanderättsavtal och svara för driften
  - Anläggningen ska ligga i Nora kommun, användas regelbundet för föreningens huvudsakliga verksamhet och vara tillgänglig för föreningar och kommuninvånare
  - Föreningen ska bedriva barn- och ungdomsverksamhet och uppfylla kommunens allmänna bidragsvillkor
  - Ansökan ska avse kommande drift och får inte lämnas retroaktivt om det inte följer av ett särskilt avtal
  belopp: Kommunen publicerar ingen generell beloppsnivå; stödet prövas efter anläggningens drift och föreningens verksamhet
