- id: nora-ungt-initiativ
  namn: Ungt initiativ
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ungdomar 13-25 år bosatta i Nora som vill ordna kultur- eller fritidsarrangemang för andra ungdomar
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Sökanden ska vara mellan 13 och 25 år och bo i Nora kommun; flera kan söka tillsammans och någon förening krävs inte
  - Arrangemanget ska vara utåtriktat och rikta sig till andra ungdomar i Nora kommun
  - Arrangemanget ska vara öppet för alla, genomföras i Nora kommun på offentlig plats och vara drogfritt
  - Arrangemanget får inte innehålla religiös eller partipolitisk propaganda och ska inte vara kopplat till skolarbete
  - En åldersgräns för deltagande hindrar inte stöd i de fall en sådan är motiverad
  - Efter arrangemanget ska en enkel ekonomisk redovisning lämnas tillsammans med uppgift om antalet arrangörer, volontärer och deltagare
  belopp: Högst 5 000 kronor per ansökan
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast två veckor innan arrangemanget genomförs. Kommunen kontaktar sökanden inom en vecka för ett möte och lämnar slutligt besked inom ytterligare en vecka.
  kalla_url: https://www.nora.se/uppleva-och-gora/kultur/priser-och-stipendier/ungt-initiativ/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunens sida motsäger sig själv om fristen och anger i samma stycke både två veckor och en månad före arrangemanget. Bidragsreglerna säger två veckor, vilket fältet följer. Stödet kallas stipendium i regeldokumentet men söks och redovisas som ett bidrag.
  senast_verifierad: '2026-09-18'
