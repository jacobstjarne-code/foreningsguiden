- id: nora-bidrag-for-ungdomsledarutbildning
  namn: Bidrag för ungdomsledarutbildning
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar som utbildar ledare för ungdomsverksamhet
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Utbildningen ska avse ledare i föreningens ungdomsverksamhet och föreningen ska uppfylla kommunens allmänna bidragsvillkor
  - Ansökan ska lämnas innan utbildningen börjar och innehålla kurs- och kostnadsuppgifter
  - Resan ska göras med billigaste färdsätt; tåg ersätts i andra klass och bil enligt Skatteverkets norm med samåkning när det är möjligt
  - En förening kan få stöd för högst tre ledarutbildningar per år
  belopp: Högst 80 procent av kurskostnaden och 80 procent av resekostnaden inom Norden, totalt högst 1 500 kronor; maximalt tre bidrag per förening och år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast två veckor innan utbildningen börjar.
