- id: svedala-anlaggningsbidrag
  namn: Anläggningsbidrag
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar med egen lokal eller anläggning, eller förstahandskontrakt hos annan hyresvärd än kommunen
  deadlines:
    typ: fasta
    datum: [04-30]
  krav:
  - Föreningen och lokalen eller anläggningen ska finnas i Svedala kommun och merparten av föreningens verksamhet ska bedrivas där
  - Föreningen ska kunna genomföra minst 500 aktivitetstillfällen för barn och unga per år och lämna redovisning
  - Driftbidrag får avse lokalhyra, försäkring, fastighetsränta, el, vatten, värme, renhållning och icke standardhöjande underhåll
  - Investeringsbidrag får avse tillgänglighetsanpassning, energieffektivisering eller byggåtgärder som minskar anläggningskostnaderna
  belopp: Högst 50 procent av godkända driftkostnader eller investeringskostnaden
