    datum: []
  krav:
  - Föreningen ska uppfylla kommunens grundläggande regler och boka en kommunal kultur- eller fritidslokal eller anläggning
  - Subvention kan avse föreningsverksamhet för barn och unga 0–20 år, vuxna 21–64 år eller äldre över 65 år
  - Kulturverksamhet kan omfattas oavsett deltagarnas ålder när den bidrar till ett levande lokalt kulturliv, med prioritet för barn och unga
  - Kommunen fastställer subventionen vid bokningen utifrån föreningstyp och verksamhet
