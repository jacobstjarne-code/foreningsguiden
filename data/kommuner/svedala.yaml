  - Deltagarna ska vara medlemmar och 0–20 år; för verksamhet för personer med funktionsnedsättning gäller ingen åldersgräns
  - Aktiviteten ska vara planerad, innehålla gemensam samling och avslutning samt sakna entréavgift
  - Närvaro ska registreras löpande och samma deltagare får räknas högst en gång per förening, sektion och dag
  belopp: 12 kr per deltagartillfälle för föreningar anslutna till specialförbund eller Riksidrottsförbundet och 21 kr för övriga föreningar samt verksamhet för personer med funktionsnedsättning
