- id: svedala-kulturbidrag
  namn: Kulturbidrag
  kategori: [kultur]
  malgrupp: Ideella föreningar som bedriver verksamhet inom kultur- eller kulturarvsområdet i Svedala kommun
  deadlines:
    typ: fasta
    datum: [04-30]
  krav:
  - Föreningen ska bedriva verksamhet inom kultur- eller kulturarvsområdet och uppfylla kommunens grundläggande föreningsregler
  - Ansökan ska innehålla en utvecklingsplan med fokus på barn och unga, nya målgrupper, kulturell kvalitet eller breda kultursamarbeten
  - Bedömningen väger in kvalitet, publik räckvidd, delaktighet, jämställdhet, flerkulturellt perspektiv och föreningens ekonomiska resurser
  - Bidraget kan sökas en gång per år, får inte avse lokalinvesteringar och följs upp vid nästa års ansökan
  belopp: Kommunen publicerar ingen generell beloppsnivå; bidraget prövas utifrån verksamhetens kvalitet, räckvidd och ekonomiska förutsättningar
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioden är 1 mars–30 april
