- id: arboga-verksamhetsbidrag-foreningar
  namn: Verksamhetsbidrag föreningar
  status: aktiv
  kategori: [idrott, kultur, pensionar, funktionsratt, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ideella föreningar
  deadlines:
    typ: fasta
    datum:
    - 08-31
  krav:
  - Föreningen måste vara ideell enligt stadgarna
  - Registrering i Arbogas föreningsregister krävs
  - Föreningen ska bedriva verksamhet för medlemmar bosatta i Arboga kommun
  - Föreningen ska aktivt arbeta för drogfrihet och en drogfri miljö
  - Medlemmarna ska bidra med skälig egeninsats för föreningens självfinansiering
  - Vid ungdomsverksamhet krävs minst fem barn eller ungdomar till och med 19 år i verksamheten
  - Ansökan ska ske på fastställd blankett och vara undertecknad av behörig firmatecknare
  - Ansökan ska innehålla årsmötesprotokoll, verksamhetsplan med budget för kommande år samt verksamhetsberättelse för senaste
    verksamhetsåret
  - Bokslut med balans- och resultaträkning samt revisionsberättelse undertecknad av valda revisorer ska bifogas
  - Handlingsplan för att skapa trygga föreningsmiljöer för barn ska bifogas
  - Föreningen ska ha minst 10 betalande och aktiva medlemmar folkbokförda i Arboga, bedriva verksamheten lokalt och uppfylla kommunens värdegrund
  belopp: Individuellt verksamhetsbidrag där medlemsantal, verksamhetsplan och verksamhetsberättelse påverkar nivån och bidragsutskottet beslutar beloppet
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: För sent inkommen ansökan behandlas ej
  kalla_url: https://arboga.se/uppleva-och-gora/foreningar-anlaggningar-och-lokaler/soka-foreningsbidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Bidraget består av kontant verksamhetsstöd och kan även kombineras med indirekt stöd genom hyressubvention i kommunens lokaler.
  senast_verifierad: '2026-08-18'
- id: arboga-verksamhetsbidrag-studieforbund
  namn: Verksamhetsbidrag studieförbund
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, annat]
  malgrupp: Studieförbund
  deadlines:
    typ: fasta
    datum:
    - 02-15
  krav:
  - Studieförbundet måste vara erkänt och dess riksorganisation ska erhålla statligt stöd
  - Folkbildningsverksamhet ska bedrivas i Arboga kommun
  - Verksamheten ska i princip bedrivas efter Folkbildningsrådets regler
  - Studieförbundet ska aktivt arbeta för drogfrihet och en drogfri miljö
  - Ansökan ska ske på fastställd blankett och vara undertecknad av ordförande eller kassör
  - Ansökan ska innehålla årsmötesprotokoll, senast upprättad verksamhetsberättelse, senast upprättat bokslut med resultat-
    och balansräkning, revisionsberättelse, verksamhetsplan och budget för innevarande år samt STUV-lista/kommunsammandrag
    för föregående år
  - Produktion, vinprovning, uppdragsverksamhet och kommersiell verksamhet är normalt inte stödberättigade
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Kommunens årliga studieförbundsanslag fördelas procentuellt mellan de sökande efter deras verksamhet i Arboga; totalsumman publiceras inte
  sen_ansokan: Ofullständig eller för sent inkommen ansökan kan avslås
  kalla_url: https://arboga.se/uppleva-och-gora/foreningar-anlaggningar-och-lokaler/soka-foreningsbidrag.html
