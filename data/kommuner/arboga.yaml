  anteckning: null
- id: arboga-verksamhetsbidrag-studieforbund
  namn: Verksamhetsbidrag studieförbund
  kategori:
  - kultur
  malgrupp: Studieförbund
  deadlines:
    typ: fasta
    datum:
    - 01-15
  krav:
  - Studieförbundet måste vara erkänt och dess riksorganisation ska erhålla statligt stöd
  - Folkbildningsverksamhet ska bedrivas i Arboga kommun
  - Verksamheten ska i princip bedrivas efter Folkbildningsrådets regler
  - Studieförbundet ska aktivt arbeta för drogfrihet och en drogfri miljö
  - Ansökan ska ske på fastställd blankett och vara undertecknad av ordförande eller kassör
  - Ansökan ska innehålla årsmötesprotokoll, senast upprättad verksamhetsberättelse, senast upprättat bokslut med resultat-
    och balansräkning, revisionsberättelse, verksamhetsplan och budget för innevarande år samt STUV-lista/kommunsammandrag
    för föregående år
  belopp: Bidraget fördelas procentuellt utifrån studieförbundets andel av det totala antalet studietimmar bland sökande studieförbund
    i Arboga kommun
  sen_ansokan: Ofullständig eller för sent inkommen ansökan kan avslås
