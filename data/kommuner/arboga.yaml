  malgrupp: En gång till nystartad förening
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökanden ska vara en nybildad ideell förening och registrera sig i Arboga kommuns föreningsregister
  - Föreningen ska vara demokratiskt uppbyggd, ha fastställda stadgar samt vald styrelse och revisor
  - Stadgar, registreringsbevis från Skatteverket och protokoll från det konstituerande mötet där föreningen och styrelsen bildades ska bifogas
  - En verksamhetsplan ska bifogas ansökan
  - Föreningen ska bedriva lokal verksamhet, ha ordnad ekonomi och uppfylla kommunens gemensamma värdegrunds- och medlemsvillkor
