- id: arboga-lovbidrag
  namn: Lovbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar för aktiviteter under skolloven
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Aktiviteterna ska vara kostnadsfria
  - Genomförda under sportlov, påsklov eller höstlov
  - Ledare som minst är 18 år ska vara på plats när aktiviteterna genomförs
  - Aktiviteterna ska vara öppna för alla barn och inte för slutna grupper
  - Föreningen ska ha en lättillgänglig kontaktperson
  - Föreningen ansvarar själv för bokning av lokaler
  - Aktiviteten ska anmälas till kommunens lovprogram och publiceras i evenemangskalendern med datum, plats, beskrivning och kontaktuppgifter
  belopp: 500 kronor per lov
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast en vecka före sportlovet, påsklovet eller höstlovet. Jullov kan omfattas om budgetutrymme finns.
  kalla_url: https://arboga.se/uppleva-och-gora/foreningar-anlaggningar-och-lokaler/ordna-lovaktiviteter.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Bidraget är 500 kronor per lov oavsett antal kostnadsfria aktiviteter och gäller så länge budgetmedel finns.
  senast_verifierad: '2026-08-18'
- id: arboga-investeringsbidrag
  namn: Investeringsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med egna anläggningar
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen ska ha en egen anläggning eller lokal
  - Investeringen ska vara stadigvarande och finnas kvar i verksamheten under flera år
  - Investeringen får inte vara genomförd innan ansökan prövas
  - Föreningen ska ange varje investeringsobjekt, antal och sökt belopp på kommunens blankett
  - Förening som endast söker investeringsbidrag ska bifoga aktuell verksamhetsberättelse, ekonomisk berättelse, revisionsberättelse och årsmötesprotokoll
  - Genomförd investering ska redovisas till kommunen
  belopp: Kommunal delfinansiering av den del av investeringen som bidragsutskottet godkänner; andelen beror på antalet ansökningar
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Bidrag ges inte till redan genomförda investeringar och ansökan ska vara inkommen senast 30 april.
  kalla_url: https://arboga.se/download/18.6a8720811957be0bff0c72a1/1742367268238/Ans%C3%B6kan%20om%20investeringsbidrag.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Flera investeringspunkter kan tas upp i samma ansökan och bidragsutskottet avgör vad som räknas som investering.
  senast_verifierad: '2026-08-18'
- id: arboga-arrangorsbidrag
  namn: Arrangörsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Arrangörer av återkommande evenemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökanden ska vara en bidragsberättigad förening
  - Stödet ska avse återkommande arrangemang för allmänheten och kan inte sökas för ett enstaka arrangemang
  - Föreningen och fritids- och kulturförvaltningen ska träffa en skriftlig överenskommelse om vilka arrangemang som genomförs under året
  - Överenskommelsen ska reglera ersättningen och hur länge stödet fortlöper
  - Föreningen ska skriftligen beskriva sitt önskemål om arrangörsbidrag till förvaltningen
