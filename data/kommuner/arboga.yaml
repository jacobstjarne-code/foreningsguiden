  - Arrangemanget ska utöka eller bredda utbudet av aktiviteter i Arboga kommun och vara något extra utöver föreningens ordinarie verksamhet
  - Ansökan ska prövas mot kommunens riktlinjer och policy för stöd till organisationer
  - Föreningen ska lämna en komplett ansökan senast den publicerade ansökningsdagen
