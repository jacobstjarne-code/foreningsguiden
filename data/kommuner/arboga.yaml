- id: arboga-subventionerad-hyra
  namn: Subventionerad hyra
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som hyr lokaler från kommunen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara bidragsberättigad och hyra en kommunal lokal eller anläggning
  - Bidragsutskottet beslutar föreningens klassificering och ser över subventionen varje år
  - Klass A ger bidragsberättigade föreningar rabatt på den ordinarie hyran
  - Klass B kräver barn- och ungdomsverksamhet och ger 0-kronorstaxa på de anläggningar där taxan finns
  - Föreningen ska följa kommunens boknings-, taxe- och lokalregler
  belopp: Rabatterad hyra enligt klassificering. Klass B (barn/ungdom) betalar 0 kr.
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan om att bli bidragsberättigad kan ske löpande under året; hyressubventionen ses över årligen.
  kalla_url: https://arboga.se/uppleva-och-gora/foreningar-anlaggningar-och-lokaler/soka-foreningsbidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunen uppger att cirka 80 procent av föreningsstödet betalas som subvention av lokalkostnader i kommunala lokaler och anläggningar.
  senast_verifierad: '2026-08-18'
- id: arboga-socialt-foreningsbidrag
  namn: Föreningsbidrag för socialt inriktad verksamhet
  status: aktiv
  kategori: [social, pensionar, funktionsratt, ovrig]
  foreningstyp: [social, annat]
  malgrupp: Föreningar och ideella organisationer som stödjer och kompletterar socialförvaltningens verksamheter för Arbogas invånare
  deadlines:
    typ: fasta
    datum: [08-31]
  krav:
  - Verksamheten ska utgöra stöd och komplement till socialförvaltningens verksamheter eller ligga i linje med socialtjänstlagens mål och inriktning
  - Organisationen ska stödja kommuninvånare och beskriva den lokala nyttan av den verksamhet som bidraget avser
  - Sökanden ska vara demokratiskt uppbyggd, ha stadgar, vald styrelse och revisor samt vara registrerad hos Skatteverket
  - Föreningen ska ha årligt årsmöte, ordnad ekonomisk redovisning godkänd av revisorerna och uppfylla kommunens gemensamma värdegrund
  - Ansökan ska redovisa planerade aktiviteter, sökt belopp och hur stödet ska användas
  belopp: Individuellt prövat föreningsbidrag inom socialnämndens budget; någon generell nivå publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan om 2027 års bidrag ska vara inkommen senast 31 augusti 2026.
  kalla_url: https://arboga.se/download/18.1c06a14f19a7bcc07d3546f6/1763461696759/Socialn%C3%A4mndens%20protokoll%202025-11-12.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Socialnämnden beviljade 2026 stöd till Arboga anhörig- och vårdarförening, BRIS och Kvinnojouren; beloppen beslutas per organisation.
  senast_verifierad: '2026-08-18'
