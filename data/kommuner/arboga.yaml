  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-18'
- id: arboga-driftbidrag
  namn: Driftbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar för driftskostnader
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökanden ska vara en bidragsberättigad förening
  - Föreningen ska efter överenskommelse med kommunen ta ansvar för regelbunden skötsel av en kommunalt angelägen anläggning eller miljö
  - Stödet kan avse motionsspår, elljusspår, vandringsleder, skidspår eller motsvarande driftuppdrag
  - Ett driftavtal ska reglera uppdraget, ersättningen och stödets fortlevnad
  - Föreningen ska skriftligen beskriva det driftbidrag eller driftuppdrag som önskas
  belopp: Ersättning enligt föreningens individuella driftavtal med kommunen
