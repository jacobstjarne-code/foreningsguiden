bidrag:
- namn: Verksamhetsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Föreningen ska ha minst 10 medlemmar
  - Föreningen ska lämna in stadgar/arbetsordning till Kultur och fritid
  - Föreningen ska redovisa planerad verksamhet för nästkommande verksamhetsår
  - Medlemsantalet ska anges till det antal som gäller vid ansökningstillfället
  - Föreningen ska äga organisatorisk fasthet, ha stadgar och ha en styrelse som svarar för en medlemsmatrikel med medlems
    fullständiga namn, födelseår och uppgift om betald medlemsavgift (minimiavgift lägst 50 kronor per år)
  - Ansökan ska undertecknas av föreningens ordförande och kassör eller sekreterare
  - Föreningen ska årligen skicka in verksamhetsberättelse med bokslut och revisionsberättelse
  - Vid ansökan om bidrag till ungdomsverksamhet ska årligen en policy för föreningens strategi och förebyggande arbete mot
    droger redovisas tillsammans med ansökan, annars kan bidraget reduceras eller helt utebli
  belopp: 50 kronor per medlem för föreningar med huvudverksamhet ungdom 6–25 år, 20 kronor per medlem för föreningar med
    verksamhet i övrig ålder
  sen_ansokan: Ansökan ska ha inkommit senast 31 mars aktuellt bidragsår. Utbetalning sker senast 1 maj aktuellt bidragsår.
  kalla_url: https://kungsor.se/uppleva-och-gora/foreningsliv/foreningsstod-och-bidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
  id: kungsor-verksamhetsbidrag
- namn: Aktivitetsbidrag
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med barn- och ungdomsaktiviteter
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Bidrag ges för ungdomar mellan 6 och 25 år
  - Minst 3 medlemmar ska delta i en instruktörsledd aktivitet som pågår i minst en timme
  - Aktivitetsstöd kan inte sökas för studiecirkel, entrébelagd tävling eller arrangemang med vinstsyfte
  - Ledaren ska vara lägst 13 år och får inte vara redovisningsansvarig för flera grupper samtidigt
  - Föreningen ska äga organisatorisk fasthet, ha stadgar och ha en styrelse som svarar för en medlemsmatrikel med medlems
    fullständiga namn, födelseår och uppgift om betald medlemsavgift (minimiavgift lägst 50 kronor per år)
  - Ansökan ska undertecknas av föreningens ordförande och kassör eller sekreterare
  - Föreningen ska årligen skicka in verksamhetsberättelse med bokslut och revisionsberättelse
  - All ungdomsverksamhet ska bedrivas i en drogfri miljö, och föreningen ska årligen redovisa en policy för sitt förebyggande
    arbete mot droger tillsammans med bidragsansökan, annars kan bidraget reduceras eller helt utebli
  belopp: 30 kronor per medlem och aktivitet
  sen_ansokan: Ansökan ska ha inkommit senast 25 februari respektive 25 augusti. Utbetalning sker senast 15 april respektive
    15 oktober.
  kalla_url: https://kungsor.se/uppleva-och-gora/foreningsliv/foreningsstod-och-bidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
  id: kungsor-aktivitetsbidrag
- namn: Ledarutbildningsbidrag
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar som utbildar ledare
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Utbildningen ska vara beslutad av föreningens styrelse eller årsmöte
  - Kursintyg ska uppvisas efter genomförd utbildning för att bidraget ska betalas ut
  - Föreningen ska äga organisatorisk fasthet, ha stadgar och ha en styrelse som svarar för en medlemsmatrikel med medlems
    fullständiga namn, födelseår och uppgift om betald medlemsavgift (minimiavgift lägst 50 kronor per år)
  - Ansökan ska undertecknas av föreningens ordförande och kassör eller sekreterare
  - Föreningen ska årligen skicka in verksamhetsberättelse med bokslut och revisionsberättelse
  belopp: Max 50 kronor per medlem och år, dock högst 75 procent av kurskostnaden
  sen_ansokan: Ansökan ska lämnas senast en månad före utbildningen. Utbetalning sker senast två veckor efter utbildningen,
    efter uppvisat kursintyg.
  kalla_url: https://kungsor.se/uppleva-och-gora/foreningsliv/foreningsstod-och-bidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
  id: kungsor-ledarutbildningsbidrag
- namn: Lovverksamhetsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar som ordnar lovverksamhet
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Aktiviteten ska äga rum under skollov för lediga grundskole- eller gymnasieelever och pågå i minst tre timmar
  - Aktiviteten ska ge möjlighet till friluftsliv, lek, idrott, bad eller kulturverksamhet
  - Redovisning ska lämnas in för att bidraget ska betalas ut
  - Föreningen ska äga organisatorisk fasthet, ha stadgar och ha en styrelse som svarar för en medlemsmatrikel med medlems
    fullständiga namn, födelseår och uppgift om betald medlemsavgift (minimiavgift lägst 50 kronor per år)
  - Ansökan ska undertecknas av föreningens ordförande och kassör eller sekreterare
  - Föreningen ska årligen skicka in verksamhetsberättelse med bokslut och revisionsberättelse
  - All ungdomsverksamhet ska bedrivas i en drogfri miljö, och föreningen ska årligen redovisa en policy för sitt förebyggande
    arbete mot droger tillsammans med bidragsansökan, annars kan bidraget reduceras eller helt utebli
  belopp: 50 kronor per deltagare
  sen_ansokan: Ansökan ska lämnas senast två veckor före aktiviteten. Utbetalning sker efter inlämnad redovisning.
  kalla_url: https://kungsor.se/uppleva-och-gora/foreningsliv/foreningsstod-och-bidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
  id: kungsor-lovverksamhetsbidrag
- namn: Arrangemangsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar som arrangerar publikt evenemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Ansökan ska innehålla syftet med arrangemanget, en budget och uppgift om arrangemangsansvariga i föreningen
  - Arrangemanget ska stimulera till positiva mötesplatser för Kungsörsborna och vara riktat till allmänheten
  - Redovisning av arrangemanget ska lämnas in för att bidraget ska betalas ut
  - Föreningen ska äga organisatorisk fasthet, ha stadgar och ha en styrelse som svarar för en medlemsmatrikel med medlems
    fullständiga namn, födelseår och uppgift om betald medlemsavgift (minimiavgift lägst 50 kronor per år)
  - Ansökan ska undertecknas av föreningens ordförande och kassör eller sekreterare
  - Föreningen ska årligen skicka in verksamhetsberättelse med bokslut och revisionsberättelse
  belopp: null
  sen_ansokan: Ansökan ska lämnas senast en månad före aktiviteten. Utbetalning sker senast en månad efter aktiviteten, enligt
    redovisning.
  kalla_url: https://kungsor.se/uppleva-och-gora/foreningsliv/foreningsstod-och-bidrag.html
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
  id: kungsor-arrangemangsbidrag
- namn: Anläggningsbidrag
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med lokal eller anläggning
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Bidraget gäller egna eller tillfälligt förhyrda anläggningar och lokaler, och omfattar 60 procent av driftskostnaden (ej
    hyra), högst 15 000 kronor per år
  - Bidragsberättigad är inte lokal som bokats i idrottsanläggning, sporthall eller skola som förvaltas av kommunen, lokal
    utanför Kungsörs kommun, eller lokal som subventioneras på annat sätt
  - Föreningen ska äga organisatorisk fasthet, ha stadgar och ha en styrelse som svarar för en medlemsmatrikel med medlems
    fullständiga namn, födelseår och uppgift om betald medlemsavgift (minimiavgift lägst 50 kronor per år)
  - Ansökan ska undertecknas av föreningens ordförande och kassör eller sekreterare
  - Föreningen ska årligen skicka in verksamhetsberättelse med bokslut och revisionsberättelse
  belopp: 60 procent av driftskostnaden (ej hyra), högst 15 000 kronor per år, för egna eller tillfälligt förhyrda anläggningar
    och lokaler
  sen_ansokan: Ansökan ska ha inkommit senast 31 mars bidragsåret. Utbetalning sker senast 1 maj bidragsåret.
  kalla_url: https://kungsor.se/uppleva-och-gora/foreningsliv/foreningsstod-och-bidrag.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
  id: kungsor-anlaggningsbidrag
