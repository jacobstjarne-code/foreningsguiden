  krav:
  - Ansökan ska lämnas in av en interimsstyrelse med protokollsutdrag som visar föreningens tänkta verksamhet
  - Föreningen kan få upp till 1 000 kronor för att komma igång med verksamheten
  belopp: Upp till 1 000 kronor
  sen_ansokan: Ansökan ska lämnas senast en månad efter att föreningen startats. Utbetalning sker senast en månad efter beviljat
