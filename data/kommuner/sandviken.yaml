  anteckning: SAKNADES I FÖREGÅENDE VERSION — tillagd vid korrigerande omkörning 2026-07-20. Beslutas av kultur- och fritidsnämnden.
    Strukturerat som en 'affärsmässig relation' (sponsring mot exponering) snarare än traditionellt bidrag, men är ett faktiskt
    ekonomiskt stöd till föreningar/kulturaktörer administrerat direkt av kommunen — uppfyller inget uteslutningsskäl i §2.4.
    Länkas inte från huvudsidan för föreningsstöd, bara från kultur- och fritidsnämndens egen sida. Ansökan sker digitalt
    via ActorSmartBook.
