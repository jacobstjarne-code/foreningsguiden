  deadline_status: olast
  krav_status: olast
  krav_fullstandiga: null
  anteckning: SAKNADES HELT I FÖREGÅENDE VERSION, utan dokumenterad uteslutning — tillagd vid korrigerande omkörning 2026-07-20.
    Kommunens stipendie-/fondsida listar nio fonder; sju uteslutna enligt §2.4 (se YAML-headerkommentar för fullständig lista
    och skäl — bl.a. Göranssonska Stiftelserna, som är fristående med egen styrelse och INTE kommun-administrerad trots att
    den delar ut 70–100 mkr/år till Sandvikens föreningsliv). Skrivet som ETT samlat bidrag enligt §2.7. Gunvor Göranssons
    kulturstiftelses ansökningsbara målgrupp (föreningar) är inte lika explicit formulerad på kommunens egen sida som Lars
    Bucans — inferens stärkt av att båda stiftelserna administreras identiskt och att extern källa (stiftelser.nu) uttryckligen
    nämner 'föreningar' för Gunvor Göransson; om Fable vid granskning bedömer att detta är för svagt underbyggt bör raden
    delas och Gunvor Göransson-delen omprövas.
  senast_verifierad: '2026-08-03'
