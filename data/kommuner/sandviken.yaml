  kategori:
  - kultur
  - ovrig
  malgrupp: Föreningar, institutioner och enskilda personer i Sandvikens kommun (Gunvor Göranssons kulturstiftelse omfattar
    även Gävleborgs län) enligt respektive stiftelses ändamål
  deadlines:
    typ: fasta
    datum:
    - 01-31
    - 03-09
    - 04-30
    - 05-11
    - 08-17
    - 09-30
    - 11-30
  krav:
  - 'Lars Bucans kulturstiftelse: bidrag och årligt kulturpris till enskilda personer, föreningar och institutioner som aktivt
    och förtjänstfullt främjar kultur i Sandviken. Fyra ansökningsperioder per år (2025 års datum: 9 mars, 11 maj, 17 augusti,
    30 november — administreras av kultur- och fritidskontoret).'
  - 'Gunvor Göranssons kulturstiftelse: bidrag till välgörande, sociala, konstnärliga eller andra allmännyttiga ändamål med
    anknytning till Sandvikens kommun eller Gävleborgs län. Beviljas högst en gång per år. Tre ansökningsperioder 2026: 31
    januari, 30 april, 30 september (administreras av Kommunledningskontoret).'
  - Ingen av stiftelserna ger bidrag till förlorad arbetsförtjänst, uppehälle, resor eller ny-/ombyggnation
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://sandviken.se/kommunochpolitik/stipendierfonderochutmarkelser.10051.html
