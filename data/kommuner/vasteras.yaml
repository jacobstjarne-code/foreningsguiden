      - Kommunens stöd är medfinansiering och ansökan ska samordnas med den externa finansieringen
      - >-
        Föreningen ska bedriva sin huvudsakliga verksamhet i Västerås kommun och vara öppen för alla som instämmer i
        föreningens mål
      - >-
        Föreningen ska ha organisationsnummer, antagna stadgar, medlemsmatrikel, årsmötesvald styrelse och ett svenskt
        bankkonto
      - >-
        Föreningen ska arbeta demokratiskt, följa stadens värdegrund och verka för jämställdhet, tillgänglighet och
        inkludering
