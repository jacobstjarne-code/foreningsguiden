- namn: Bidrag för feriearbetare
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Hallsbergsföreningar som anställer feriearbetande ungdomar 2026
  deadlines:
    typ: fasta
    datum: [04-01]
  krav:
  - Föreningen är arbetsgivare, rekryterar ungdomen och ska vara registrerad som arbetsgivare hos Skatteverket
  - Föreningen ansvarar för arbetsmiljö, giltig ansvarsförsäkring, regler för minderåriga och registerutdrag vid arbete med barn
  - Ungdomen ska vara folkbokförd i Hallsberg, gå i grund- eller gymnasieskola, vara född 2008–2010 och under 18 år vid start
  - Stödet betalas i efterskott mot lönekopia och fullständig redovisning senast 15 september 2026
  belopp: 70 kr per timme inklusive semesterersättning, högst 80 timmar och 5 600 kr per ungdom, plus arbetsgivaravgift och 7 kr per timme i OB 2026
  belopp_avser: per_forening
  kommunens_pott: null
