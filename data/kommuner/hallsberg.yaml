- id: hallsberg-vagbidrag-enskilda-vagar
  namn: Bidrag till enskilda vägar
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Vägföreningar, vägsamfälligheter, samfällighetsföreningar och ideella föreningar som är väghållare
  deadlines:
