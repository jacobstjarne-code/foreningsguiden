    datum: [03-31]
  krav:
  - Sökanden ska vara väghållare, exempelvis vägförening, vägsamfällighet, samfällighetsförening eller ideell förening
  - För bidrag som grundas på Trafikverkets underlag ska väghållaren få statligt vägbidrag
  - Vägen ska hållas öppen för trafik hela året utan bom, vägmärke eller annan avstängning
  - Allmänheten ska ha rätt att färdas på vägen
  - Kommunen kan begära årsstämmoprotokoll och protokoll som visar vem som är behörig firmatecknare
  - För övrig utfartsväg ska sträckan överstiga 200 meter räknat från tomtgräns eller gårdsplan och betjäna en permanentbostad
  belopp: För vägar med statligt bidrag baseras kommunens bidrag på Trafikverkets underlag; för övriga utfartsvägar 1 krona per meter över 200 meter
