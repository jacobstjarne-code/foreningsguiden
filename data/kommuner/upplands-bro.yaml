- id: upplands-bro-verksamhetsbidrag-kultur
  namn: Verksamhetsbidrag för kulturföreningar
  kategori: [kultur]
  malgrupp: Ideella kultur- och kulturarvsföreningar med säte i Upplands-Bro och etablerad verksamhet av allmänintresse.
  foreningstyp: [kultur, hembygd, ungdom, annat]
  deadlines: { typ: fasta, datum: [07-31] }
  krav:
  - Verksamheten ska ha god kvalitet, vara av allmänintresse och bidra till ett brett kulturutbud
  - Verksamheten ska huvudsakligen gynna boende i Upplands-Bro kommun
  - Bidraget får inte användas till investeringar i lokaler
  - Verksamhet med religiös eller politisk inriktning omfattas inte
  - Bedömningen omfattar kvalitet, publik- och medlemsarbete, bredd, säkerhet, tillstånd och försäkringar
