- id: upplands-bro-lokalt-aktivitetsstod
  ansokningsvag: "En separat kommunal närvaroredovisning och ansökan krävs i APN. RF-rapporteringen räcker inte ensam."
  namn: Lokalt aktivitetsstöd (LOK-stöd)
  kategori: [idrott, kultur, funktionsratt, ovrig]
  malgrupp: Ideella föreningar med återkommande aktiviteter för medlemmar 3–25 år eller personer med funktionsnedsättning oavsett ålder.
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [02-25, 08-25] }
  krav:
  - En stödberättigad gruppaktivitet ska ha minst tre deltagare i åldern 3–25 år och pågå minst 60 minuter
  - Deltagarna ska vara medlemmar och ledaren ska vara minst 13 år samt närvara under hela aktiviteten
  - Aktiviteten ska vara planerad, ha gemensam samling och avslutning och närvaro ska registreras
  - En deltagare får räknas i högst en gruppaktivitet per förening och dag, med undantag för skilda sektioner
  - Föreningen ska löpande föra fullständig redovisning som kommunen kan kontrollera
  belopp: Ersättningsnivån per deltagartillfälle fastställs årligen av kultur- och fritidsnämnden
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan lämnas senast 25 februari respektive 25 augusti. Vid försening tillämpas Riksidrottsförbundets regler om föreningen visar rimliga och relevanta skäl.
  kalla_url: https://www.upplands-bro.se/download/18.ed24e5b1821f28587337/1658386384968/Regler%20f%C3%B6r%20ekonomiskt%20st%C3%B6d%20och%20bidrag%20f%C3%B6r%20kultur-%20och%20fritidsverksamhet%20-%20antagna%20av%20Kommunfullm%C3%A4ktige%20den%2030%20mars%202022.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: För personer med funktionsnedsättning finns ingen övre åldersgräns. Stödet betalas efter avslutad redovisningsperiod och kan inte betalas i förskott.
  alder_min: 3
  alder_max: 25
  senast_verifierad: '2026-08-18'
- id: upplands-bro-projektstod-publika-arrangemang
  namn: Projektstöd för publika arrangemang
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar och andra juridiska personer med säte i Upplands-Bro som genomför publika, tidsbegränsade arrangemang i kommunen.
