  - Projektplan och ekonomisk plan ska bifogas ansökan
  - Projekt med religiös eller politisk inriktning, välgörenhetsgalor och projekt vars syfte är vinst omfattas inte
  - Investeringar i lokaler eller utrustning som berikar mottagaren efter arrangemanget omfattas inte
  - Säkerhet, nödvändiga tillstånd och försäkringar ska vara ordnade
