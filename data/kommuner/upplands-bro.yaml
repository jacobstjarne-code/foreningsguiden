- id: upplands-bro-aldre-omsorg
  namn: Föreningsbidrag från äldre- och omsorgsnämnden
  kategori: [pensionar, social]
  malgrupp: Ideella och allmännyttiga föreningar med huvudsaklig verksamhet för äldre i Upplands-Bro kommun.
  foreningstyp: [social, annat]
  deadlines: { typ: okand, datum: [] }
  krav:
  - Föreningen ska ha minst tio medlemmar folkbokförda i kommunen och ta ut minst 50 kr i årlig medlemsavgift
  - Föreningen ska ha huvudsaklig verksamhet i kommunen, vara registrerad i föreningsregistret och vara ansluten till riks- eller distriktsorganisation om sådan finns
  - Föreningen ska vara ideell och allmännyttig, ha stadgar, demokratiskt vald styrelse och revisor samt bedriva kontinuerlig verksamhet
  - Ett aktuellt medlemsregister med namn, födelseår, adress och betald medlemsavgift ska finnas
  - Organisationsnummer, verksamhetsberättelse, verksamhetsplan, fullständig resultat- och balansräkning samt revisionsberättelse ska lämnas
  - Verksamheten ska följa kommunens demokrati- och likabehandlingsvärdegrund och får inte vara politisk eller religiös
  belopp: 110 kr per stödberättigad medlem
  belopp_avser: per_forening
