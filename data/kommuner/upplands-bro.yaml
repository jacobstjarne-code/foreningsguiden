- id: upplands-bro-uppdragsbidrag
  namn: Uppdragsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Ideella föreningar med säte i kommunen som utför särskilda uppdrag till nytta för Upplands-Bro.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: lopande, datum: [] }
  krav:
  - Föreningen ska utöver medlemsverksamheten rikta verksamhet eller anläggning till allmänheten, sköta kommunal anläggning eller utföra ett särskilt kommunnyttigt uppdrag
  - Föreningen ska ha sitt säte i Upplands-Bro kommun
  - Uppdraget ska regleras genom överenskommelse eller avtal och avtal får tecknas för högst tre år
  - Bidraget får inte överstiga kommunens kostnad för att själv utföra uppdraget
  - Prioritering görs efter uppdragets angelägenhet och tillgängliga resurser
  belopp: Högst den kostnad kommunen skulle haft för att själv utföra uppdraget
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kontakt om uppdragsbidrag kan tas löpande med kultur- och fritidskontoret.
