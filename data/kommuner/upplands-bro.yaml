  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Engångsbidrag redovisas senast tre månader efter utfört uppdrag; fleråriga stöd följs upp årligen.
  senast_verifierad: '2026-08-18'
- id: upplands-bro-lokal-drift
  namn: Lokal- och driftsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Ideella föreningar med verksamhet i egen eller icke-kommunal lokal, eller i lokal utanför kommunen när lämplig lokal saknas i Upplands-Bro.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [03-31] }
  krav:
  - Föreningen ska ha sitt säte i Upplands-Bro och merparten av verksamheten ska bedrivas i lokalen eller anläggningen
  - Bidrag kan bara ges när kommunen inte kan erbjuda en lokal för verksamheten
  - Kostnader och intäkter ska styrkas och ansökan grundas på föregående års kostnader
  - Bidragsgrundande kostnader kan vara media, fastighetsförsäkring, hyra, fastighetsränta och icke standardhöjande underhåll
  - Föreningar som inte tidigare fått bidraget ska kontakta kommunen för bedömning före ansökan
  belopp: För ungdomsverksamhet högst 85 procent av nettolokalkostnaden och 4,5 prisbasbelopp; för kulturhistoriskt värdefull byggnad högst 25 procent och 0,5 prisbasbelopp
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan lämnas senast 31 mars och fungerar även som redovisning av föregående års bidrag.
  kalla_url: https://www.upplands-bro.se/download/18.ed24e5b1821f28587337/1658386384968/Regler%20f%C3%B6r%20ekonomiskt%20st%C3%B6d%20och%20bidrag%20f%C3%B6r%20kultur-%20och%20fritidsverksamhet%20-%20antagna%20av%20Kommunfullm%C3%A4ktige%20den%2030%20mars%202022.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kultur- och fritidsnämnden kan i särskilda fall besluta om högre procentandel eller belopp.
  senast_verifierad: '2026-08-18'
- id: upplands-bro-projektbidrag-sarskilt-stod
  namn: Projektbidrag – särskilt stöd
  kategori: [idrott, kultur, funktionsratt, social, ovrig]
  malgrupp: Bidragsberättigade ideella föreningar med säte och huvudsaklig verksamhet i Upplands-Bro kommun.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [11-01] }
  krav:
  - Projektet ska bidra till hållbar utveckling av föreningens verksamhet eller följa kultur- och fritidsnämndens prioriteringar
  - Särskilt stöd kan avse utbildning, läger, lokalutrustning eller behov som inte täcks av andra bidrag
  - Föreningen ska vara bidragsberättigad, ha sitt säte i kommunen och huvudsakligen bedriva verksamheten där
  - Projektets angelägenhet och tillgängliga resurser ligger till grund för prioriteringen
  - Verksamhet och ekonomi ska redovisas senast 31 oktober året efter beslut och oanvända medel återbetalas
