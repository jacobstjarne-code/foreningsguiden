- id: osby-verksamhetsstod-till-studieforbund
  namn: Verksamhetsstöd till studieförbund
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Studieförbund med planerad och organiserad folkbildningsverksamhet i Osby kommun
  deadlines:
    typ: fasta
    datum: [05-25]
  krav:
  - Studieförbundet ska bedriva kontinuerlig, planerad och organiserad studiecirkelverksamhet, annan folkbildning eller kulturarrangemang i Osby kommun
  - Ansökan ska lämnas årligen med de två senaste årens verksamhet som underlag
  - Studieförbundet ska redovisa studietimmar i cirkelverksamhet, kulturarrangemang och annan folkbildning samt timmar för prioriterade målgrupper
  - Uppgift om organisationen har ett kontor i Osby kommun ska lämnas som del av fördelningsunderlaget
  - Studieförbund utan verksamhet i Osby kommun kan inte beviljas stöd
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Årligen fastställd kommunal budget som fördelas mellan studieförbunden efter de publicerade verksamhetskriterierna; totalsumman är inte publicerad
