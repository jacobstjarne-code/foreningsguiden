- id: osby-subventionerade-lokaler-och-anlaggningar
  namn: Subventionerade kommunala lokaler och anläggningar
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som hyr kommunala lokaler eller anläggningar för sin verksamhet
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor och följa de separata reglerna för uthyrning av lokaler och anläggningar
  - Verksamhet för barn och unga 5–25 år, personer med funktionsnedsättning och personer över 65 år prioriteras vid fördelning av tider
  - Den mest subventionerade föreningstaxan för verksamhet 5–25 år gäller föreningar som har beviljats kommunalt aktivitetsstöd
  - Föreningslokal i en kommunalt driven anläggning kräver ett skriftligt hyresavtal som revideras regelbundet
  belopp: Subvention genom kommunens fastställda föreningstaxa för lokaler och anläggningar
