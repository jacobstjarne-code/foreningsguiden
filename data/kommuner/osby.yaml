  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska ha minst 5 aktiva medlemmar mellan 5 och 25 år, eller 5 medlemmar med funktionsnedsättning över 5 år
  - Gruppverksamhet med minst 3 och högst 30 deltagare som fyllt 5 men inte 26 år, eller deltagare med funktionsvariation
    över 5 år
  - Ansvarig ledare ska ha fyllt 13 år och får inte vara ansvarig för flera gruppaktiviteter samtidigt
  - Sammankomsten ska pågå minst 45 minuter med gemensam samling och avslutning, och närvaro ska registreras vid varje aktivitet
