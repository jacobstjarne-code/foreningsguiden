- id: osby-investeringsstod
  namn: Investeringsstöd
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som investerar i en föreningsägd eller långsiktigt disponerad lokal eller anläggning
  deadlines:
    typ: fasta
    datum: [02-25]
  krav:
  - Föreningen ska uppfylla de allmänna villkoren och äga eller långsiktigt driva eller hyra lokalen eller anläggningen
  - Investeringen ska avse nybyggnad, förbättring, reparation eller större underhåll; lös utrustning kan stödjas när den är en del av anläggningen eller särskilt motiverad
  - Investeringen får inte vara påbörjad före beslut, utom när kommunen har godkänt särskilda skäl, och nödvändiga tillstånd ska vara ordnade
  - Föreningen ska finansiera minst 30 procent med egna medel eller annan extern finansiering; eget ideellt arbete räknas inte som finansiering
  - Ansökan får avse högst 50 000 kronor och ska innehålla kostnadsunderlag, finansieringsplan och beskrivning av åtgärden
  - Genomförandet ska redovisas i SmartBook senast sex månader efter att investeringen slutförts; ändrad eller utebliven åtgärd kan medföra återbetalning
  belopp: Högst 70 procent av investeringens totala kostnad och högst 50 000 kronor per ansökan
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ordinarie sista dag är 25 februari; om medel återstår kan kommunen efter 25 april öppna en löpande kompletterande ansökningsperiod
  kalla_url: https://www.osby.se/download/18.6f202186192472b6d005006e/1728304260443/Riktlinjer%20f%C3%B6r%20st%C3%B6d%20till%20f%C3%B6reningar%2C%20studief%C3%B6rbund%20och%20civilsamh%C3%A4llet%20i%20Osby%20kommun%202025%20.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
