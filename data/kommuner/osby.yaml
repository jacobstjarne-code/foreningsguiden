  senast_verifierad: '2026-08-19'
- id: osby-verksamhetsstod-till-kultur-och-fritidsforeningar-och-samlingslokaler
  namn: Verksamhetsstöd till kultur- och fritidsföreningar och samlingslokaler
  status: aktiv
  kategori: [idrott, kultur, social, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med kontinuerlig kultur- eller fritidsverksamhet samt föreningar som driver samlingslokaler eller sociala mötesplatser
  deadlines:
    typ: fasta
    datum: [02-25]
  krav:
  - Föreningen ska uppfylla de allmänna villkoren och bedriva kontinuerlig kultur- eller fritidsverksamhet i Osby kommun
  - Barn- och ungdomsföreningar samt föreningar för personer med funktionsnedsättning utanför Riksidrottsförbundet ska ha minst fem aktiva medlemmar 5–25 år eller fem medlemmar med funktionsnedsättning
  - En samlingslokal eller social mötesplats ska hållas öppen och tillgänglig för föreningar, civilsamhälle och allmänhet på skäliga villkor
  - Kulturarv, musik, teater, dans, konst, film, kvalitativa kulturprogram, ungas organisering och ett brett fritidsutbud för barn och unga prioriteras
  - Föreningar som beviljas mer än 75 000 kronor ska ingå en överenskommelse med kommunen om stödet och verksamheten
  belopp: Individuellt fördelat ur en årligen fastställd budget efter verksamheten och kommunens övergripande fördelningskriterier
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 februari; kommunen publicerar ingen senregel
