- id: osby-drift-och-hyresstod
  namn: Drift- och hyresstöd
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som äger eller hyr en lokal eller anläggning eller driver en kommunägd anläggning
  deadlines:
    typ: fasta
    datum: [02-25]
  krav:
  - Föreningen ska uppfylla de allmänna villkoren och äga eller hyra lokalen eller anläggningen eller driva en kommunägd anläggning
  - Verksamheten ska huvudsakligen rikta sig till barn och unga, personer med funktionsnedsättning eller personer över 65 år
  - Lokalen eller anläggningen ska normalt finnas i Osby kommun och verksamheten ska bedrivas i eller i direkt anslutning till den; förråd berättigar inte till stöd
  - Stöd lämnas endast när kommunen inte kan erbjuda en likvärdig lokal och inte för en lokal som redan subventioneras genom kommunens timtaxa
  - Föreningen ska redovisa lokalens eller anläggningens typ, storlek och nyttjandegrad; samordning med andra föreningar ska ske när det är möjligt
  belopp: Individuellt beräknat ur den årliga budgeten efter en poängbedömning av lokalens eller anläggningens typ, storlek och nyttjandegrad
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 februari; kommunen publicerar ingen senregel
