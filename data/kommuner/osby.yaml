  - Verksamheten ska rikta sig till grupper som i lägre grad deltar i föreningslivet eller samhället eller möter särskilda hinder för en aktiv fritid och social gemenskap
  - Föreningen ska verka för lika möjligheter, ökad inkludering, inflytande och delaktighet för grupper som behöver särskilt stöd för sin organisering eller verksamhet
  - Ansökan bedöms efter medlemsantal och kommunens övergripande fördelningskriterier
