  krav:
  - Föreningen ska bedriva kontinuerlig kulturverksamhet eller verksamhet för barn och unga
  - Föreningar med verksamhet för personer med funktionsvariation som inte är anslutna till Riksidrottsförbundet ska ha minst
    5 aktiva medlemmar mellan 5-25 år eller 5 medlemmar med funktionsvariation
  - Kan även sökas av föreningar som driver samlingslokaler eller sociala mötesplatser som hålls öppna och tillgängliga för
    föreningar, grupper och allmänhet
  - För föreningar som beviljas ett stöd på över 75 000 kronor upprättas en överenskommelse kring stöd och verksamhet
