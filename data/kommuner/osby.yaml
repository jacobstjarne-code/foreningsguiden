- id: osby-lokalt-aktivitetsstod
  ansokningsvag: "En separat kommunal ansökan eller aktivitetsredovisning krävs via Actor SmartBook; RF-rapporteringen räcker inte ensam."
  namn: Lokalt aktivitetsstöd
  status: aktiv
  kategori: [idrott, kultur, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med gruppverksamhet för barn och unga eller personer med funktionsnedsättning
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Föreningen ska uppfylla de allmänna villkoren och ha minst fem aktiva medlemmar 5–25 år eller minst fem medlemmar med funktionsnedsättning från 5 års ålder
  - Aktiviteten ska vara planerad och ledarledd, pågå minst 45 minuter och ha gemensam samling och avslutning
  - Gruppen ska bestå av 3–30 deltagare 5–25 år; för deltagare med funktionsnedsättning gäller ingen övre åldersgräns
  - Ledaren ska vara minst 13 år, vara närvarande under hela aktiviteten och får inte ansvara för flera grupper samtidigt
  - Närvaro ska registreras vid varje aktivitet och en deltagare får räknas högst en gång per dag i samma förening
  belopp: Årligt fastställt grundbelopp per godkänt deltagartillfälle; för deltagare med funktionsnedsättning lämnas 2,5 gånger grundbeloppet
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: 25 februari gäller perioden juli–december föregående år och 25 augusti perioden januari–juni innevarande år; kommunen publicerar ingen senregel
  kalla_url: https://www.osby.se/se--gora/foreningsliv/foreningsstod.html
