  senast_verifierad: '2026-08-19'
- id: ockero-ledarutbildningsbidrag
  namn: Ledarutbildningsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar som utbildar ledare eller styrelseledamöter för prioriterade målgrupper
  deadlines:
    typ: fasta
    datum: [03-15, 06-15, 09-15]
  krav:
  - Utbildningen ska vara direkt kompetenshöjande för ledaruppdrag i verksamhet för barn och unga, personer med funktionsnedsättning eller personer 65+, eller för ett styrelseuppdrag
  - Intern utbildning får hållas i den egna föreningen, med annan förening eller med kommunen; extern deltagare ska vara medlem, ha en ledarfunktion och vara minst 14 år
  - Bidrag lämnas inte för föreningsanställda, inspirationskurser eller konferenser
  - Kursintyg, kursprogram och verifikat för kursavgift och andra kostnader ska bifogas
  - Föreningen ska efter kursen och inom samma kalenderår redovisa hur stödet har använts
  belopp: Individuellt bedömt efter behovet av ledare, ledarnas åldersfördelning samt utbildningens utbud, målgrupp, könsfördelning och geografiska spridning
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan görs efter genomförd utbildning senast 15 mars, 15 juni eller 15 september
  kalla_url: https://minasidor.ockero.se/oversikt/overview/413
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
- id: ockero-riktat-bidrag
  namn: Riktat bidrag
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar som utvecklar eller startar verksamhet för barn och unga, personer med funktionsnedsättning eller äldre
  deadlines:
    typ: fasta
    datum: [03-15, 06-15, 09-15]
  krav:
  - Satsningen ska utveckla befintlig verksamhet, starta en ny verksamhet eller nå en ny prioriterad målgrupp
  - Stödet får användas för lovverksamhet för barn och unga samt för personer med funktionsnedsättning
  - Ansökan ska lämnas före genomförandet och innehålla beskrivning, kostnadskalkyl, finansieringsplan, sökt kommunalt belopp och relevanta bilagor
  - Graden av nyskapande samt kommunal angelägenhet utifrån utbud, målgrupp, kön och geografisk spridning ligger till grund för bedömningen
  - Genomförande och användning av stödet ska redovisas skriftligt efter satsningen och inom samma kalenderår
  belopp: Individuellt bedömt efter nyskapandegrad samt satsningens utbud, målgrupp, könsfördelning och geografiska spridning
