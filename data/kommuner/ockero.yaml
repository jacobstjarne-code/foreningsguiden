  krav:
  - I huvudsak bedriva verksamhet i Öckerö kommun för kommunens invånare och huvudsakligen ha medlemmar som är folkbokförda
    i kommunen
  - Bedriva regelbunden aktivitet med minst fyra sammankomster per år
  - Beakta jämställdhetsperspektivet och verka för att alla medlemmar oavsett kön ges samma förutsättningar att utöva sina
    aktiviteter
  - Ha antagit stadgar och hålla årsmöte där verksamhetsplan, budget, verksamhetsberättelse och ekonomisk berättelse godkänns
  - Ha ett organisationsnummer
  - Ha ett bankkonto, bankgiro eller plusgiro
  - Lämna kontaktuppgifter (telefon och e-post till ordförande och kassör samt föreningens postadress) till kommunen
  - Hålla föreningens uppgifter uppdaterade i föreningsregistret
  - Motverka alkohol, droger och doping
  - Motverka kränkande behandling
  - Årligen lämna in verksamhetsberättelse, verksamhetsplan och ekonomisk redovisning samt medverka vid förvaltningens obligatoriska
    föreningsträffar
  - Ekonomiskt stöd kan endast erhållas av huvudförening, inte av undersektion
