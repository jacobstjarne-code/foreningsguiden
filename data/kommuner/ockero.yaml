- id: ockero-bidrag-for-specifika-andamal
  namn: Bidrag för specifika ändamål
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar med behov av projekt, investeringar, renoveringar, byggnation eller annan särskild insats
  deadlines:
    typ: fasta
    datum: [11-15]
  krav:
  - Sökanden ska vara en bidragsberättigad förening i Öckerö kommun; stöd lämnas inte till föreningsanställda eller enskilda personer
  - Ansökan ska avse ett projekt, en investering, renovering, byggnation eller annat särskilt ändamål som främjar föreningens fortlevnad eller verksamhet
  - Ansökan ska lämnas före satsningen och innehålla ändamål, tidsplan, kostnadskalkyl, finansieringsplan, sökt belopp och relevanta bilagor
  - Behovet och nyttan för barn och unga, personer med funktionsnedsättning och äldre vägs in i fördelningen
  - Föreningen ska efter avslutad satsning lämna en skriftlig redovisning enligt den angivna tidsplanen
  belopp: Individuellt behovsprövat ur årets budget och kvarvarande föreningsbidragsmedel, med hänsyn till prioriterade målgrupper
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioden är 1 oktober–15 november; kommunen publicerar ingen senregel
