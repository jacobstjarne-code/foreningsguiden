- id: ockero-lokal-och-anlaggningsbidrag
  namn: Lokal- och anläggningsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar som äger eller hyr en lokal eller anläggning för föreningsverksamhet i Öckerö
  deadlines:
    typ: fasta
    datum: [05-15]
  krav:
  - Föreningen ska vara bidragsberättigad, ideell och bedriva sin huvudsakliga verksamhet i Öckerö för kommunens invånare
  - Idrotts- och ungdomsföreningar som söker enligt målgruppsnivåerna ska ha minst 10 medlemmar 0–20 år, drogpolicy och minst 60 sammankomster per år med minst fem deltagare ur prioriterad målgrupp
  - Konst-, kultur-, kulturarvs-, idrotts-, fritids-, frilufts- och övriga målgruppsföreningar ska bedriva verksamhet i kommunen och ha huvuddelen av medlemmarna folkbokförda där
  - Föreningen ska äga eller hyra lokalen eller anläggningen och redovisa verksamhetens omfattning samt lokal- och anläggningskostnader i kommunen
  - Huvudföreningen ska söka genom e-tjänsten och ha lämnat aktuella stadgar, årsmöteshandlingar, verksamhetsplan, ekonomisk redovisning och kontaktuppgifter
  belopp: Max 1 prisbasbelopp vid minst 60, 1,5 prisbasbelopp vid minst 300 och 2 prisbasbelopp vid minst 600 sammankomster för prioriterade målgrupper; övriga kategorier max 0,5 prisbasbelopp
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioden är 1 mars–15 maj; kommunen publicerar ingen senregel
