- id: ockero-simskolebidrag
  namn: Simskolebidrag och förlustbidrag
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som arrangerar simskola för barn och unga
  deadlines:
    typ: fasta
    datum: [04-30]
  krav:
  - Simskolan ska ha minst sex deltagare, högst en timmes lektion per grupp och pågå i minst två veckor
  - Lön får beräknas enligt Svenska Sim- och Livräddningssällskapets rekommendationer endast för utbildade simlärare; för assistenter 18 år eller yngre gäller kommunens löneavtal
  - Deltagaravgiften ska bestämmas i dialog med kommunen och undervisningsmaterial får bara köpas enligt överenskommelse med förvaltningen
  - Föreningen ska anmäla simskolan under april och redovisa antal sammankomster och deltagare senast under september
  - Utbildning av simlärare bekostas av föreningen men kan sökas separat genom ledarutbildningsbidraget
  belopp: Grundbidrag för genomförd simskola samt förlustbidrag för hela eller delar av en eventuell förlust
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Anmälan ska göras under april; kommunen publicerar ingen senregel
  kalla_url: https://minasidor.ockero.se/oversikt/overview/326
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Redovisning sker senast under september och utbetalning under oktober
  senast_verifierad: '2026-08-19'
- id: ockero-bidrag-for-nattvandring
  namn: Bidrag för nattvandring
  status: aktiv
  kategori: [social, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar i Öckerö kommun som tecknar samverkansavtal om nattvandring
  deadlines:
    typ: fasta
    datum: [12-15]
  krav:
  - Föreningen ska ansöka genom e-tjänsten och teckna överenskommelse om uppdraget med Nattvandring.nu
  - Föreningen ska genomföra och redovisa 12 tilldelade nattvandringspass under året, främst riskhelger omkring klockan 21–24
  - Minst två personer som har fyllt 20 år ska delta samtidigt vid varje pass och föreningen ska utse en kontaktperson
  - Deltagarna ska följa kommunens instruktioner och genomgå den grundutbildning som ingår i överenskommelsen
  - Bidrag betalas efter att uppdraget genomförts och redovisningen godkänts
  belopp: 20 000 kr efter 12 genomförda och redovisade nattvandringspass
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioden är 1 november–15 december för nästa års nattvandring
  kalla_url: https://minasidor.ockero.se/oversikt/overview/427
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Fem föreningar per år får uppdraget
  senast_verifierad: '2026-08-19'
- id: ockero-bidrag-for-strandstadning
  namn: Bidrag för strandstädning
  status: aktiv
  kategori: [ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som genomför beviljade strandstädningspass i Öckerö under juni–augusti
  deadlines:
    typ: fasta
    datum: [08-31]
  krav:
  - Föreningen ska anmäla intresse genom e-tjänsten från 1 april och få uppdraget beviljat innan städningen genomförs
  - Ett städtillfälle ska genomföras av minst 10 föreningsmedlemmar som är över 15 år under minst fyra timmar
  - Föreningen ska använda Strandstädarkartan och följa kommunens instruktioner för tilldelat område och städpass
  - Tillfällena fördelas i turordning med hänsyn till geografisk spridning och tillgängligt antal pass
  - Genomförandet ska redovisas med beskrivande text och bilder senast den 1 september
  belopp: 5 000 kr per beviljat, genomfört och redovisat städtillfälle
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Intresseanmälan är öppen 1 april–31 augusti; ett begränsat antal pass fördelas löpande
  kalla_url: https://minasidor.ockero.se/oversikt/overview/447
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet finansieras med statliga medel
  senast_verifierad: '2026-08-19'
- id: ockero-stod-till-bildningsforbund
  namn: Kommunbidrag för studieförbund och bildningsförbund
