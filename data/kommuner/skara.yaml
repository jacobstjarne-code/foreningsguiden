- id: skara-lokalt-aktivitetsstod
  namn: Lokalt aktivitetsstöd
  foreningstyp: [idrott, ungdom]
  kategori: [idrott]
  malgrupp: Godkända idrotts- och ungdomsföreningar med ledarledd verksamhet för barn och unga
  deadlines: { typ: fasta, datum: [02-25, 08-25] }
  krav:
  - Deltagarna ska vara 6–20 år; för registrerad verksamhet för personer med funktionsnedsättning finns ingen övre åldersgräns
  - Sammankomsten ska vara planerad, ledarledd, pågå minst 30 minuter och ha minst tre deltagare utöver ledaren
  - Närvarokort ska bifogas om föreningen inte söker statligt LOK-stöd; RF-anslutna föreningar ska ge kommunen åtkomst till aktuell LOK-stödsfil
  - En deltagare får räknas en gång per dag och stödet minskas med 25 % för föreningar som använder kommunens anläggningar
  - Fester, läxläsning, matlagning, högtidsfirande, trossamfunds- och skolverksamhet samt studiecirklar och SISU-timmar är inte stödgrundande
  belopp: 27 kr per stödberättigad sammankomst och 2 kr per deltagare, för 3–30 deltagare
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 februari för höstens verksamhet och 25 augusti för vårens verksamhet
  kalla_url: *huvud
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
