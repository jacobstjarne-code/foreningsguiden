  - Årsredovisning, årsmötesprotokoll, verksamhetsberättelse och revisionsberättelse ska bifogas
  belopp: 500 kr per utåtriktad aktivitet för högst åtta aktiviteter samt 500 kr för årsmöte, högst 4 500 kr per år
