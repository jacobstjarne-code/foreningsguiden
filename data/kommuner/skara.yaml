  - Avtalet grundas på föreningens verksamhet, en underhållsplan för kommande tre år och godkända driftskostnader
  - Årsmötesprotokoll, verksamhetsberättelse, ekonomisk redovisning och revisionsberättelse ska lämnas varje år under avtalsperioden
  - Godkända kostnader är hyra, el, vatten, avlopp, renhållning, bränsle, arrende och fastighets- eller lokalförsäkring
