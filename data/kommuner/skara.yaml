- id: skara-anslag-studieforbund-sisu
  namn: Anslag till studieförbund och SISU
  foreningstyp: [kultur, social, annat]
  kategori: [kultur, social, ovrig]
  malgrupp: Godkända studieförbund och SISU Idrottsutbildarna med verksamhet i Skara
  deadlines: { typ: fasta, datum: [08-31] }
  krav:
  - Studieförbundet ska vara godkänt och bedriva verksamhet som uppfyller statens syften med stödet till folkbildningen
  - Ansökan ska redovisa unika deltagare, studietimmar och deltagare med funktionsnedsättning i studiecirklar och annan folkbildning
  - Kulturverksamheten ska redovisas som antal kulturarrangemang
  - SISU-stöd beslutas en gång per år efter redovisning av föregående års verksamhet
  belopp: Fördelas enligt Västergötlands Bildningsförbunds rekommendation; 70 % efter studiecirklar, 10 % efter annan folkbildning och 20 % efter kulturarrangemang
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 31 augusti varje år via ACTOR
  kalla_url: *huvud
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Nya studieförbund fasas in efter genomförd verksamhet med 50 % första utbetalningsåret och 100 % det andra.
  senast_verifierad: '2026-08-18'
- id: skara-allmanna-samlingslokaler
  namn: Kommunalt bidrag till allmänna samlingslokaler
  foreningstyp: [hembygd, annat]
  kategori: [kultur, social, ovrig]
  malgrupp: Föreningar som driver allmänna samlingslokaler där ett motsvarande kommunalt alternativ saknas
  deadlines: { typ: lopande, datum: [] }
  krav:
  - Föreningen ska vara registrerad i kommunens föreningsregister och årligen lämna verksamhetsberättelse, årsmötesprotokoll, resultat- och balansräkning samt revisionsberättelse
  - Lokalen ska ligga i Skara kommun, ägas eller disponeras genom ett långsiktigt hyresavtal och uppfylla myndighetskrav
  - Lokalen ska vara en varaktigt behövd allmän samlingslokal som hyrs ut till skäliga villkor till aktörer med demokratisk värdegrund
  - Projektet får inte vara påbörjat och ansökan ska innehålla projektbeskrivning, detaljerad kostnadskalkyl, finansieringsplan och relevanta föreningshandlingar
  - Efter kommunens beslut om medfinansiering ska föreningen styrka att ansökan har lämnats till Boverket innan utbetalning
  belopp: Individuellt prövat stöd utifrån projektets finansiering och kommunens ekonomiska förutsättningar
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ej tillämpligt (löpande); stödet är inte avsett för omedelbara eller akuta projekt
  kalla_url: https://www.skara.se/kommunochpolitik/styrandedokument/riktlinjer/riktlinjeforkommunaltbidragtillallmannasamlingslokaler.3530.html
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Utbetalning förutsätter även godkänd ekonomisk redovisning och en samordnad betalningsplan.
  senast_verifierad: '2026-08-18'
