- id: skara-utvecklingsmedel
  namn: Utvecklingsmedel
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Bidragsgodkända föreningar med en särskild aktivitet, utvecklingsinsats eller ett arrangemang
  deadlines: { typ: fasta, datum: [11-15] }
  krav:
  - Insatsen ska vara en särskild aktivitet, föreningsutveckling eller ett arrangemang som inte ryms i kommunens andra stödformer
  - Ansökan ska beskriva förväntat resultat och hur stödet ska användas samt innehålla budget med intäkter och kostnader
  - Årsmötesprotokoll, verksamhetsberättelse, ekonomisk redovisning och revisionsberättelse ska bifogas
  - Vid inköp av tjänster ska tre offerter redovisas
  - Föreningen ska kunna följa upp användningen och kan bli återbetalningsskyldig om stödet används för annat ändamål
  belopp: Individuellt prövat stöd; kommunen publicerar ingen fast nivå
