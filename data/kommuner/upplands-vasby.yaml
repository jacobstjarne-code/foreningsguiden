- id: upplandsvasby-foreningsregister
  vad: Registrera föreningen i kommunens föreningsregister
  beskrivning: 'Alla föreningar som söker kommunalt bidrag ska vara registrerade i kommunens föreningsregister och löpande
    uppdatera uppgifter och kontaktuppgifter. Registret nås via två parallella system beroende på bidragstyp: Aktivitetskort
    på nätet (ApN) för kultur- och fritidsnämndens bidrag, samt FRI-GO för kommunstyrelsens bidrag (funktionsnedsättning,
    frivillig- och intresseorganisationer, studieförbund, folkhälsobidrag, Adolf Stafs Fond). Det är ett krav att föreningen
    har uppdaterat och godkänt uppgifterna innan bidrag beviljas.'
