- id: upplandsvasby-fritidsbidrag
  namn: Fritidsbidrag
  foreningstyp: [idrott, friluft, ungdom, annat]
  kategori:
  - idrott
  - ovrig
  malgrupp: Fritidsföreningar. Idrottsförening ansluten till Riksidrottsförbundet utan tillräcklig barn- och ungdomsverksamhet
    för grund-/aktivitetsbidrag kan i vissa fall söka, max 5 år i följd
  deadlines:
    typ: fasta
    datum:
    - 10-15
  krav:
  - Ansökan i kommunens bidragssystem samt dialogmöte med handläggare på kultur- och fritidskontoret där behoven redovisas
  - Bidraget får inte användas till internrepresentation (t.ex. fika vid styrelsemöten, gåvor till styrelsemedlemmar)
  - 'RF-ansluten idrottsförening: bidraget reduceras med 50 % efter 3 år och upphör efter ytterligare 2 år (karens 3 år därefter)'
  - Föreningen ska vara registrerad och uppfylla nämndens grundläggande krav på organisationsnummer, konto, demokrati, öppenhet och årlig medlemsavgift
  - Planerad verksamhet, antal aktiva medlemmar och föreningens förnyelsearbete ska redovisas; verksamhet för barn och unga prioriteras
  - Bidraget ska användas till verksamhet för medlemmar eller allmänheten och får inte användas till internrepresentation
  - Avtal tecknas efter beslut och användningen redovisas vid nästa bidragsmöte
  belopp: Individuellt verksamhetsbidrag utifrån antalet sökande, planerad verksamhet, aktiva medlemmar och förnyelsearbete; något fast belopp publiceras inte
  sen_ansokan: 100 % av godkänt bidrag vid ansökan i tid. Komplettering inom 7 dagar efter sista ansökningsdag ger 70 %. Senare
    komplettering godkänns inte.
  kalla_url: https://www.upplandsvasby.se/download/18.5b8b3897193799f8ea023de/1737039756712/Kultur-%20och%20fritidsn%C3%A4mndens%20bidragsregler.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  belopp_avser: per_forening
  anteckning: Verksamhetsbidrag som betalas ut i förskott för kommande verksamhetsår. Avtal tecknas mellan kultur- och fritidskontoret
    och föreningen; bryts avtalet ska bidraget återbetalas.
  senast_verifierad: '2026-08-18'
