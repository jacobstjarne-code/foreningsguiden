    datum: []
  krav:
  - Föreningen ska vara en nystartad idrotts-, kultur- eller fritidsförening
  - Föreningen ska ha minst 14 medlemmar
  - Föreningen ska ha varit verksam i minst tre månader
  - Föreningen ska vara registrerad i Upplands Väsby kommuns föreningsregister
  - Föreningen ska uppfylla kultur- och fritidsnämndens grundläggande bidragskrav
  - Föreningen ska ha organisationsnummer samt bank- eller plusgiro och ta ut minst 50 kronor i årlig medlemsavgift
  - Föreningens verksamhet ska bedrivas i Upplands Väsby och vara demokratisk, öppen, jämlik och jämställd
  - Årsmöteshandlingar och föreskrivna policyer ska vara uppladdade och uppgifterna i föreningsregistret aktuella
  belopp: 6 000 kronor under det första verksamhetsåret
  sen_ansokan: Löpande under hela året, när föreningen har varit verksam i tre månader och övriga kriterier är uppfyllda
  kalla_url: https://www.upplandsvasby.se/download/18.5b8b3897193799f8ea023de/1737039756712/Kultur-%20och%20fritidsn%C3%A4mndens%20bidragsregler.pdf
