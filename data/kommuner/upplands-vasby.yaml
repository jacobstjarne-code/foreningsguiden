- id: upplandsvasby-aktivitetsbidrag
  namn: Aktivitetsbidrag
  foreningstyp: [idrott]
  kategori:
  - idrott
  - funktionsratt
  malgrupp: Idrottsföreningar anslutna till Riksidrottsförbundet med minst 14 aktiva medlemmar 7–20 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Minst 5 aktiviteter per halvår; sammankomst minst 60 minuter med minst 3 deltagare utöver ledare
  - Medlem ska vara 7–20 år, ha deltagit minst 8 gånger per år och betalat minst 50 kr i medlemsavgift
  - Max 60 sammankomster per person och halvår. Ingen övre åldersgräns eller krav på gruppstorlek för deltagare med funktionsvariation
  - Sammankomsten ska vara en ledarledd gruppaktivitet i föreningens regi med gemensam samling och avslutning; drop-in och studiecirklar ger inte bidrag
  - Samma medlem får räknas högst en gång per dag i samma förening och ansvarig ledare ska vara närvarande under hela aktiviteten
  - Föreningen ska vara registrerad, uppfylla grundkraven och ha senaste årsmöteshandlingarna tillgängliga i bidragssystemet
  belopp: 68 kr/sammankomst (7–13 år), 85 kr/sammankomst (14–20 år)
  sen_ansokan: 100 % av godkänt bidrag vid ansökan i tid. Komplettering inom 7 dagar efter sista ansökningsdag ger 70 %. Senare
    komplettering godkänns inte.
  kalla_url: https://www.upplandsvasby.se/download/18.5b8b3897193799f8ea023de/1737039756712/Kultur-%20och%20fritidsn%C3%A4mndens%20bidragsregler.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  belopp_avser: per_forening
  anteckning: 'Två ansökningsperioder: 1/1–30/6 (ansöks senast 25 augusti) och 1/7–31/12 (ansöks senast 25 februari).'
  senast_verifierad: '2026-08-18'
