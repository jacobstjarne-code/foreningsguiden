  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunens ansökningssida tillåter även företag och enskilda, men denna post gäller endast föreningars ansökningar.
  senast_verifierad: '2026-08-18'
- id: upplandsvasby-musikradets-bidrag
  namn: Bidrag från Upplands Väsby musikråd
  foreningstyp: [kultur]
  kategori:
  - kultur
  malgrupp: Lokala musik- och dansföreningar samt föreningar som arrangerar konserter, festivaler eller andra musikarrangemang i Upplands Väsby
  deadlines:
    typ: okand
    datum: []
  krav:
  - Sökanden ska vara en lokal förening eller arrangör inom musik- eller dansområdet
  - Bidraget ska användas till en konsert, festival eller annat arrangemang som utvecklar det lokala musiklivet
  - Ansökan lämnas till Upplands Väsby musikråd, som fördelar kommunens årliga anslag till musiklivet
  belopp: Individuellt arrangemangsbidrag fördelas av musikrådet; något fast belopp publiceras inte av kommunen
  belopp_avser: per_forening
  sen_ansokan: Ingen sista ansökningsdag publiceras på kommunens sida
  kalla_url: https://www.upplandsvasby.se/uppleva-och-gora/foreningar-och-foreningsliv/bidrag-stod-och-stipendier.html
  belopp_status: ingen_regel
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kommunen ger ett årligt anslag till Upplands Väsby musikråd, som fördelar stöd till det lokala musiklivet. Musikrådets individuella musikstipendium ingår inte i denna föreningspost.
  senast_verifierad: '2026-08-18'
