- id: upplandsvasby-intresseorganisationer
  namn: Föreningsbidrag till intresseorganisationer
  foreningstyp: [social, annat]
  kategori:
  - ovrig
  malgrupp: Organisationer som tar tillvara en viss grupps intressen i en verksamhet som är en kommunal angelägenhet
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Det frivilliga ideella arbetet ska vara grunden i verksamheten; kommunbidraget ska vara av kompletterande art
  - Innehållet bör ha ett stort mått av allmänintresse och verka för ökad integration mellan grupper i samhället
  - Organisationen ska vara ideell, registrerad med organisationsnummer och eget konto samt lämna föreskrivna års- och ekonomihandlingar
  belopp: Bedöms utifrån angelägenhetsgrad och verksamhetens omfattning
  belopp_avser: per_forening
  sen_ansokan: 100 procent av godkänt bidrag vid ansökan i tid. Komplettering inom 7 dagar efter sista ansökningsdag ger 70
    procent. Senare komplettering godkänns inte.
  kalla_url: https://www.upplandsvasby.se/download/18.13568ed118a91dd06791214/1695895050521/riktlinjer-for-foreningsbidrag-for-organisationer-for-personer-med-funktionsnedsattning-samt-frivillig-och-intresseorganisationer.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Samverkan mellan organisationer, och mellan organisationer och kommunen, prioriteras. Beslutas av kommunstyrelsens
    klimat-, miljö- och hållbarhetsutskott.
  senast_verifierad: '2026-08-18'
- id: upplandsvasby-engangs-och-projektbidrag-ks
  namn: Engångsbidrag och projektbidrag (kommunstyrelsen)
  foreningstyp: [social, ungdom, annat]
  kategori:
  - social
  - funktionsratt
  - ovrig
  malgrupp: Föreningar och organisationer inom funktionsnedsättning, frivilligverksamhet och intresseverksamhet
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Engångsbidraget ska avse föreningens jubileum eller ett liknande enstaka ändamål, eller projektbidraget ett tidsbegränsat projekt
  - Föreningen ska vara ideell och registrerad i kommunens föreningsregister med organisationsnummer och eget bank- eller plusgiro
  - Ansökan ska innehålla föreskrivna års- och ekonomihandlingar samt redovisning av tidigare kommunbidrag
  belopp: Individuellt bidrag bedöms efter ändamål och underlag; något fast belopp publiceras inte
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.upplandsvasby.se/download/18.13568ed118a91dd06791214/1695895050521/riktlinjer-for-foreningsbidrag-for-organisationer-for-personer-med-funktionsnedsattning-samt-frivillig-och-intresseorganisationer.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Regelverket anger att engångsbidrag kan beviljas till föreningars jubileum och liknande samt att bidrag till tidsbegränsade projekt kan beviljas. Den gemensamma årliga ansökningsdagen i riktlinjen är 30 november.
  senast_verifierad: '2026-08-18'
- id: upplandsvasby-folkhalsobidrag-senior
  namn: Folkhälsobidrag till seniorföreningar
  foreningstyp: [social, annat]
  kategori:
  - pensionar
  malgrupp: Seniorföreningar verksamma i Upplands Väsby kommun, registrerade i kommunens föreningsregister som seniorförening
  deadlines:
    typ: fasta
    datum:
    - 08-31
  krav:
  - Ansökan registreras i bidragssystemet FRI senast 31 augusti
  - Ansökan ska beskriva planerade aktiviteter/projekt samt budget, och ange totalt antal medlemmar, planerade folkhälsofrämjande
    aktiviteter och bedömt antal deltagande seniorer
  - Årsmötesprotokoll, verksamhetsberättelse och bokslut från senaste årsmöte bifogas
  - Föreningen ska vara registrerad som seniorförening i Upplands Väsby och verksamheten ska vara folkhälsofrämjande för seniorer
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: "Total bidragsbudget 120 000 kronor fördelas mellan beviljade föreningar"
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.upplandsvasby.se/download/18.11ea930419a75a29e90ac5/1763710673455/Riktlinjer%20f%C3%B6r%20folkh%C3%A4lsobidrag%20till%20seniorf%C3%B6reningar%20i%20Upplands%20V%C3%A4sby%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Beslut fattas av kultur- och fritidsnämnden senast 30 november, utbetalning sker i december. Riktlinjerna antogs
    2019-05-21 och reviderades senast 2025-11-11. Kommunens totala bidragsbudget är 120 000 kronor och fördelas mellan beviljade
    föreningar. Detta är inte ett tak per sökande.
  senast_verifierad: '2026-08-18'
- id: upplandsvasby-adolf-stafs-fond
  namn: Adolf Stafs Fond
  foreningstyp: [social, annat]
  kategori:
  - pensionar
  malgrupp: Föreningar som bedriver fritidsverksamhet för pensionärer, särskilt i särskilt boende eller annan omsorgsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Årsredovisning med revisionsberättelse bifogas
  - Beskrivning av hur bidraget ska användas samt redogörelse för föregående års bidrag
  - Kontaktuppgifter och bankkontouppgifter
  - Föreningen ska vara registrerad i kommunens föreningsregister och årligen bekräfta att uppgifterna är aktuella
  - Fritidsverksamheten ska rikta sig till pensionärer; fonden prioriterar verksamhet vid särskilt boende eller annan omsorgsverksamhet
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: "85 % av fondens avkastning till pensionärsorganisationer; 15 % kan sökas av andra föreningar"
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.upplandsvasby.se/omsorg-och-hjalp/ekonomi-ekonomiskt-bistand/stipendier-och-fonder.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Förvaltas av kommunstyrelsens klimat-, miljö- och hållbarhetsutskott. 85 % av fondens avkastning fördelas till
    pensionärsorganisationer med minst 50 ålderspensionärer som medlemmar; resterande 15 % kan sökas av pensionärsföreningar
    och andra ideella föreningar för fritidsverksamhet riktad till pensionärer.
  senast_verifierad: '2026-08-18'
- id: upplandsvasby-statsbidrag-finskt-forvaltningsomrade
  namn: Statsbidrag för finskt förvaltningsområde
  foreningstyp: [kultur, ungdom, annat]
  kategori:
  - kultur
  - ovrig
  malgrupp: Föreningar som arbetar med sverigefinsk kultur och språk i kommunen
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Organisationsnummer samt postgiro/bankgiro
  - Verksamhetsbeskrivning med mål, målgrupp, tidsplan och budget
  - Insatsen ska främja och synliggöra finska språket eller den sverigefinska kulturen och vara öppen för kommunens sverigefinska befolkning
  - Verksamheten ska genomföras i Upplands Väsby; insatser för barn, unga, äldre och språkbevarande prioriteras
  belopp: Föreningen anger sökt belopp och budget; något fast högsta belopp publiceras inte
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
