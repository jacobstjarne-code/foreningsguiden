- namn: Lokalt aktivitetsstöd för pensionärsföreningar
  kategori:
  - pensionar
  malgrupp: Pensionärsföreningar
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Sammankomsten ska ha minst 5 deltagare i åldrarna 7–25 år eller pensionärer 65 år eller äldre
  - Sammankomsten ska vara minst 60 minuter lång
  - Sammankomsten ska vara beslutad och ekonomiskt planerad av styrelse, sektion, medlemsmöte eller motsvarande
  - Bidrag utgår endast till lokalavdelning, inte till riksorganisation, distrikt eller lokalt samarbetsorgan
  - Bidrag utgår max en gång per dag och grupp, oavsett antal deltagare eller aktivitetens längd
  - Bidrag utgår inte för entrébelagda tävlingar eller kommersiella arrangemang som danser, bingo eller basarer
  - Närvarokort ska föras vid varje sammankomst och intygas av gruppledaren
