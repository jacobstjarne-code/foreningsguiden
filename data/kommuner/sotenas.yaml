bidrag:
- namn: Kulturföreningsbidrag
  kategori:
  - kultur
  malgrupp: Kulturföreningar
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Föreningen ska ha ideell målsättning, stadgar, medlemsmatrikel och vald styrelse där huvuddelen av styrelsen är folkbokförd
    i Sotenäs
  - Föreningen ska ha antagit kommunens tillämpningsföreskrifter till det drogpolitiska handlingsprogrammet
  - Medlemsmatrikeln ska ange fullständigt namn, födelsedata, adress och telefon, och stadgeenlig medlemsavgift ska vara erlagd
  - Ansökan ska vara inkommen inom föreskriven tid; för sent inkomna ansökningar beviljas inte bidrag
  - Ansökan görs på blankett från fritidsenheten och ska lämnas av den lokala huvudorganisationen, inte av sektioner eller
    avdelningar
  - Föreningen ska årligen, efter avhållet årsmöte, skicka in verksamhetsberättelse och ekonomisk berättelse
  - Bidraget betalas ut i efterskott till föreningens bank- eller plusgirokonto
  - Föreningen är skyldig att ge nämnden och kommunens revisorer den insyn i verksamheten som krävs för att kontrollera att
    bidraget används rätt
