- id: sotenas-lokalt-aktivitetsstod-for-pensionarsforeningar
  namn: Lokalt aktivitetsstöd för pensionärsföreningar
  status: aktiv
  kategori: [pensionar]
  foreningstyp: [social, annat]
  malgrupp: Pensionärsföreningar med ledarledda aktiviteter för deltagare som är minst 65 år
  deadlines:
    typ: fasta
    datum: ['02-25', '08-25']
  krav:
  - Sammankomsten ska ha minst fem deltagare som är 65 år eller äldre och pågå i minst 60 minuter
  - Aktiviteten ska vara beslutad och ekonomiskt planerad av styrelsen, en sektion, ett medlemsmöte eller motsvarande organ
  - Stödet lämnas endast till en lokalavdelning och högst en gång per dag och grupp; en deltagare får räknas högst en gång per dag i samma lokalavdelning
  - Gruppen får inte delas för att ge fler bidragsgrundande sammankomster
  - Entrébelagda tävlingar och kommersiella arrangemang som dans, bingo eller basar är inte bidragsgrundande
  - Närvarokort ska föras vid varje sammankomst och intygas av en ledare som närvarar hela tiden och inte samtidigt ansvarar för en annan grupp
  - Föreningens ordförande och revisor eller kassör ska intyga ansökan
