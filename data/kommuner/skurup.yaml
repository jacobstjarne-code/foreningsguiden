- namn: Lokalt aktivitetsstöd
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med deltagare 6–20 år eller 65 år och äldre
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Sammankomst ska omfatta minst 3 stödberättigade deltagare (6–20 år eller 65 år eller äldre) utöver ledare, max 30 deltagare
    per sammankomst
  - Ledare ska vara 13–20 år eller 65 år eller äldre och får inte ansvara för flera gruppaktiviteter samtidigt
  - Aktiviteten ska vara planerad och beslutad av styrelse/sektion, pågå minst 1 timme och innehålla gemensam samling och
    avslutning
  - En deltagare får endast räknas en gång per dag och förening
  belopp: '6–12 år: max 11 kr/deltagartillfälle. 13–20 år: max 15 kr/deltagartillfälle. 65 år eller äldre: max 6 kr/deltagartillfälle.'
  sen_ansokan: Ej angivet i källan
