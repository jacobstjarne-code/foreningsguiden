    Nöbbelövs Byalag)
  - Stödet upphör för den del som berörs om byalaget inte längre medverkar i byalagsrådet
  belopp: 10 000 kr per år (fast stöd)
  sen_ansokan: Ej tillämpligt – årligt fast stöd till angivna byalag, ingen ansökningsfrist. Utbetalas i maj.
