- namn: Lokal- och anläggningsstöd
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Ideella föreningar i kommunen
  deadlines:
    typ: fasta
    datum:
    - 03-15
  krav:
  - Kommunen ska ha godkänt förhyrning i förväg; kommunala lokaler/anläggningar ska nyttjas i första hand
  - Stödet grundas på föregående verksamhetsårs bokslut och faktiska kostnader
  - 'Godkända kostnader: hyra/arrende, el, uppvärmning, vatten och avlopp, sophämtning och brandförsäkring'
  - Lokalen/anläggningen ska uppfylla myndighetskrav (bygglov, brandsäkerhet, försäkring)
  belopp: 'Max 60 % av godkända kostnader (minst 500 deltagartillfällen föregående verksamhetsår för 6–20 år eller 65+), annars
    max 20 %. Byalag i kommunens byalagsråd: max 60 %. Maxbelopp 100 000 kr per förening och år.'
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.skurup.se/uppleva-och-gora/foreningar/sok-foreningsstod
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: null
