    datum:
    - 05-15
  krav:
  - Studieförbundets centrala organisation ska vara statsberättigat studieförbund
  - Kulturarrangemang ska vara öppna för alla medborgare och marknadsföras i kommunens evenemangskalender
  - Verksamheten ska bedrivas lokalt och redovisa viktade unika deltagare, studietimmar, unga deltagare och kulturarrangemang
  - Kortutbildade över 20 år och personer med funktionsnedsättning är prioriterade målgrupper
  - Verksamhetsberättelse och verksamhetsplan ska lämnas med ansökan
  - Stöd ges inte till förbund som utbildar i extremistisk tro/livsåskådning eller religionsutövning, eller till kurser i
    utomeuropeiska språk
  belopp: 50 procent av anslaget fördelas efter relativ andel viktade unika deltagare och 50 procent efter relativ andel studietimmar; ett kulturprogram motsvarar nio studietimmar
