    - 03-15
  krav:
  - Föreningen ska vara antagen som stödberättigad förening och ha bedrivit verksamhet i minst 12 månader
  - Föreningen ska ha långsiktig tillgång till lokalen/anläggningen (normalt minst 10 år) genom ägande eller nyttjanderättsavtal
  - Stöd utgår inte för inventarier eller utrustning
  - Investeringen får inte påbörjas innan ansökan mottagits av Serviceförvaltningen
  - Investeringen ska vara färdigställd inom ett år från utbetalning, annars är föreningen återbetalningsskyldig
  belopp: Upp till 50 procent av investeringskostnaden
