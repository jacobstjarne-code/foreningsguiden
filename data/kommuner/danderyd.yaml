  namn: Kommunalt aktivitetsstöd till barn- och ungdomsföreningar
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar med barn- och ungdomsverksamhet, medlemmar 6-25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Minst 10 bidragsberättigade medlemmar i åldern 6-25 år, som betalat medlemsavgift och är upptagna i medlemsförteckningen
  - Minst 10 bidragsberättigade deltagartillfällen per år, vart och ett minst 45 minuter, minst 3 bidragsberättigade medlemmar
    och närvarande gruppledare
  - Bidrag utgår inte för entrébelagda tävlingar, kommersiella arrangemang (bingo, danser, basarer m.m.) eller avgiftsbelagd
    studiecirkel
