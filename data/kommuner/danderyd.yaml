- id: danderyd-socialnamndens-foreningsbidrag
  namn: Socialnämndens föreningsbidrag
  kategori: [social, pensionar, funktionsratt]
  malgrupp: Ideella föreningar inom socialnämndens ansvarsområden som bedriver verksamhet i Danderyd för kommuninvånare, exempelvis pensionärsföreningar samt anhörig- och stödorganisationer.
  foreningstyp: [social, annat]
  deadlines: { typ: fasta, datum: [03-31] }
  krav:
  - Föreningen ska vara ideell, registrerad hos Skatteverket, ha stadgar, demokratiskt vald styrelse, revisorer och stabil ekonomi
  - Verksamheten ska bedrivas i Danderyd, rikta sig till kommuninvånare och komplettera socialnämndens uppdrag med socialt stödjande, förebyggande eller annan relevant verksamhet
  - Ansökan ska lämnas i e-tjänsten med förenings- och kontaktuppgifter, verksamhetsplan, planerade aktiviteter och kostnader samt antal medlemmar folkbokförda i Danderyd
  - Andra kommunala bidrag ska uppges och ansökan ska undertecknas av ordförande och firmatecknare eller kassör
  - Förening som fått stöd tidigare måste ha lämnat föregående års redovisning innan en ny ansökan prövas
  - Redovisning ska lämnas senast sista februari och innehålla verksamhetsberättelse, aktiviteter och kostnader, deltagarantal, resultaträkning och revisionsberättelse
