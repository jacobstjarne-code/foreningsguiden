- id: danderyd-aktivitetsstod-ungdom
  namn: Kommunalt aktivitetsstöd till barn- och ungdomsföreningar
  kategori: [idrott, kultur, ovrig]
  malgrupp: Bidragsberättigade barn- och ungdomsföreningar med regelbundna gruppaktiviteter för medlemmar 6–25 år.
  foreningstyp: [idrott, kultur, friluft, ungdom, annat]
  deadlines: { typ: fasta, datum: [02-25, 08-25] }
  krav:
  - Föreningens verksamhet i Danderyd ska omfatta minst tio aktiva medlemmar i åldern 6–25 år som har betalat medlemsavgift och finns i medlemsförteckningen
  - Föreningen ska ha minst tio stödberättigade deltagartillfällen per år
  - Varje gruppaktivitet ska pågå minst 45 minuter, ha minst tre stödberättigade deltagare och en närvarande ledare som registrerar och intygar närvaron
  - En ledare får inte leda flera stödberättigade grupper under samma timme och ett lag eller en grupp får inte delas upp i mindre redovisningsgrupper
  - En medlem får bara ge stöd en gång per dag och grupp; åldersgruppen 13–16 år ger extra ersättning
  - Stöd ges inte för entrébelagda tävlingar, bingo, danser, basarer, kommersiella arrangemang eller avgiftsbelagd studiecirkel
  belopp: '2026 års nivå: 18 kr per gruppaktivitet, 5 kr per deltagartillfälle och ytterligare 5 kr per deltagartillfälle för deltagare 13–16 år'
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Sammanställning för höstterminen lämnas senast 25 februari och för vårterminen senast 25 augusti. Sen ansökan kan medföra uteblivet bidrag.
  kalla_url: https://www.danderyd.se/globalassets/globala-filer/kommun-och-politik/ovriga-styrdokument-ny/styrande-dokument---kultur-och-fritid/regler-for-foreningsbidrag---galler-fr.o.m.-2025-01-01.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Den uppdaterade regeln från 3 februari 2026 anger 6–25 år. Kommunens webbsida visar fortfarande 7–25 år; den nyare beslutade regeln används. 2026 års nivå framgår av nämndens fördelningsbeslut den 28 april 2026.
  min_medlemmar: 10
  alder_min: 6
  alder_max: 25
  kraver_registrering: true
  sate_i_kommunen: true
  senast_verifierad: '2026-08-18'
