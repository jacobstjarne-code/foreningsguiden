- id: simrishamn-drift-lokal
  namn: Driftsbidrag för egen anläggning eller hyrd lokal
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar med egen eller minst treårigt hyrd anläggning eller lokal för kontinuerlig kultur- eller idrottsverksamhet
  deadlines: { typ: fasta, datum: [04-15] }
  krav:
  - Föreningen ska bedriva kontinuerlig kultur- eller idrottsverksamhet i egen lokal eller med hyresavtal på minst tre år
  - Kommunal anläggning ska användas i första hand och lokalen får inte redan vara kommunalt subventionerad
  - Endast en förening kan få stöd för samma anläggning eller lokal
  - Ansökan ska styrka föregående års godkända driftkostnader och redovisa hyresintäkter
  - Verksamhet med hög nyttjandegrad och barn, unga, pensionärer eller personer med funktionsnedsättning prioriteras
  belopp: Högst 70 % av godkända kostnader vid minst 250 stödberättigade deltagartillfällen, annars högst 45 %; hyresintäkter över 60 000 kr minskar underlaget
