  malgrupp: Samfälligheter och vägföreningar som ansvarar för stödberättigad enskild väg
  deadlines: { typ: fasta, datum: [07-31] }
  krav:
  - Vägen ska gå från allmän väg till sista permanentbostad, vara öppen för allmän trafik och hållas farbar året runt
  - Vägnätet ska vara minst 100 meter och uppfylla kommunens krav på bredd och mötesplatser
  - Sökanden ska ha styrelse, årligt möte och organiserad verksamhet
  - Kommunalt stöd utan statsbidrag söks året efter bidragsåret med blankett, fakturor och undertecknat årsmötesprotokoll
