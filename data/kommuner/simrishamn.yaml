  namn: Utvecklingsbidrag för egen anläggning eller hyrd lokal
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, ovrig]
  malgrupp: Bidragsberättigade föreningar med egen eller hyrd anläggning eller lokal
  deadlines: { typ: fasta, datum: [10-01] }
  krav:
  - Projektet får inte påbörjas före kommunens beslut och ska avse en investering på 10 000–200 000 kr inklusive moms
  - Varje ansökan ska avse en investering och redovisa samtliga kostnader, offerter eller kalkyler samt annan offentlig finansiering
  - Eget arbete ersätts inte, utom inköpt arbete av behörig specialist enligt reglerna
  - Miljö- och energiåtgärder, tillgänglighet, bevarande och mindre till- eller ombyggnad prioriteras
