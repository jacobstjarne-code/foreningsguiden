- id: bromolla-studieforbundsbidrag
  namn: Kommunalt studieförbundsbidrag
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Folkbildningsrådsgodkända studieförbund med lokal verksamhet i Bromölla kommun
