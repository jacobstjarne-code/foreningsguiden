- id: bromolla-allmanna-villkor
  vad: Uppfyll de allmänna villkoren
  beskrivning: Föreningens ändamål ska vara ideellt. Föreningen ska kunna lämna räkenskaper och andra underlag för granskning, inte köpa alkohol eller andra droger för likvida medel samt ha policy mot sexuella övergrepp med aktuell handlingsplan. Kultur-, idrotts- och fritidsföreningar ska ha huvudsaklig verksamhet i kommunen, vara öppna och kunna samverka om resurser.
  system: Kommunens föreningsregler
  ledtid: null
  ledtid_text: Villkoren ska vara uppfyllda före ansökan
  giltighet: Villkoren gäller så länge föreningen söker kommunalt föreningsbidrag
  ordning: 2
  kalla_url: https://www.bromolla.se/globalassets/kommun-och-politik/regler-och-styrande-dokument/bestammelser-externa/regler-for-bromolla-kommuns-foreningsbidrag.pdf
  giltighet_status: kontrollast
- id: bromolla-ars-och-policyhandlingar
  vad: Lämna årshandlingar och tillämpliga policyer
  beskrivning: Senaste årsmötesprotokoll, föregående års verksamhetsberättelse, ekonomiska redovisning och revisionsrapport ska följa ansökan. Nya eller ändrade stadgar och policy mot sexuella övergrepp lämnas när reglerna kräver det. Föreningar med verksamhet för personer under 20 år ska ha rutin för begränsat belastningsregisterutdrag och en ANDTS-policy med handlingsplan; ungdomslagidrott ska även ha breddpolicy.
  system: Interbook FRI
  ledtid: null
  ledtid_text: Handlingarna lämnas med respektive bidragsansökan
  giltighet: Handlingarna ska vara de senaste och policyernas handlingsplaner aktuella
  ordning: 3
  kalla_url: https://www.bromolla.se/globalassets/kommun-och-politik/regler-och-styrande-dokument/bestammelser-externa/regler-for-bromolla-kommuns-foreningsbidrag.pdf
  giltighet_status: kontrollast
- id: bromolla-andts-policy
  vad: Ha ANDTS-policy för verksamhet under 20 år
  beskrivning: Föreningar med verksamhet för barn och ungdomar under 20 år ska ha en ANDTS-policy med aktuell handlingsplan och totalförbud mot alkohol, narkotika, dopning, tobak, nikotinprodukter och spel om pengar.
  system: Kommunens föreningsregler
