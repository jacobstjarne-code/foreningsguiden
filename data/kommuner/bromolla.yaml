- id: bromolla-driftbidrag-kultur-idrott-fritid
  namn: Driftbidrag till lokal för kultur-, idrotts- och fritidsföreningar
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, ungdom, annat]
  malgrupp: Kultur-, idrotts- och fritidsföreningar som äger en anläggning eller har ett långtidskontrakt för lokal
  deadlines: {typ: fasta, datum: [10-31]}
  krav:
  - Lokalen eller anläggningen ska ligga i Bromölla kommun, vara nödvändig och lämplig för verksamheten samt inte vara kommunalt subventionerad
  - Ansökan ska bygga på föregående års bokslut och styrkta faktiska kostnader för de uttryckligen godkända driftsposterna
  - Personalkostnader, investeringar, ränta, amortering, internet, medlemskap, fastighetsskatt, porto och nybyggnation är inte stödberättigade
  - Den del som fördelas efter barn- och ungdomsverksamhet kräver godkända aktivitetstillfällen på just den anläggning som bidraget avser
  - Årshandlingar, kostnadsunderlag och tillämpliga barn- och ungdomspolicyer ska bifogas
  belopp: Ägd anläggning högst 70 procent av godkända kostnader och 100 000 kr; hyrd lokal högst 50 procent och 30 000 kr; löpande underhåll får tas upp med högst 15 000 kr
