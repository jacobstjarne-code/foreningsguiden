- id: bromolla-investeringsbidrag-kultur-idrott-fritid
  namn: Investeringsbidrag för kultur-, idrotts- och fritidsföreningar
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, ungdom, annat]
  malgrupp: Kultur-, idrotts- och fritidsföreningar med framtida investeringar i lokal eller verksamhetsutveckling
  deadlines: {typ: fasta, datum: [10-31]}
  krav:
  - Investeringen ska genomföras kalenderåret efter ansökan och ge en varaktig förbättring med ekonomisk livslängd på flera år
  - Stödet kan avse större standardhöjande renovering, större inventarier, maskiner, teknisk utrustning eller varaktig verksamhetsutveckling
  - Löpande drift, normalt underhåll, reparationer, förbrukningsmaterial och återkommande service är inte stödberättigade
  - Budget och investeringsbeskrivning ska bifogas; en etappindelad eller större investering kräver även investeringsplan med omfattning, syfte, totalkostnad och tidsplan
  - Föreningen ska delta i ett möte om ansökan och lämna de allmänna föreningshandlingarna
  belopp: Lägst 5 000 kr och högst 50 000 kr per ansökan
