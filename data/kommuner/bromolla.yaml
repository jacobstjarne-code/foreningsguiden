- id: bromolla-registrering
  vad: Registrera föreningen och håll uppgifterna aktuella
  beskrivning: Föreningen ska vara registrerad i Bromölla kommuns föreningsregister, ha en officiell e-postadress i föreningens namn och hålla registeruppgifterna aktuella. Kommunen publicerar ingen giltighetstid eller fast förnyelsedag för registreringen.
