  - Verksamheten ska vara lokal, statsbidragsberättigad och utan kommersiellt syfte samt främja de demokrati-, jämlikhets-, mötesplats- och kulturmål som reglerna anger
  - Verksamhetsplan, budget, verksamhetsberättelse, ekonomisk redovisning och verksamhetsstatistik med STUV-sammandrag ska lämnas digitalt
  - Prioriterad verksamhet för det riktade bidraget är barn och unga 13–25 år, samarbete med Kulturpunkten och kultur riktad till kommunens äldreomsorg
  - Bemannad fysisk närvaro eller motsvarande tillgänglighet i kommunen krävs för del av spridningsbidraget
