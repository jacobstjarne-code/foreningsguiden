- id: bromolla-strategiskt-utvecklingsbidrag
  namn: Strategiskt utvecklingsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med statligt eller regionalt stöd och en flerårig strategisk utvecklingsplan
  deadlines: {typ: fasta, datum: [03-01]}
  krav:
  - Föreningen ska få regionalt eller statligt stöd i pengar eller andra resurser och ha en strategisk plan som sträcker sig minst tre år
  - Verksamheten ska representera kommunen utanför den egna medlemskretsen och berika kommunens kultur- eller besöksnäringsutbud
  - Verksamheten ska vara utåtriktad, inkluderande och inriktad på samverkan lokalt och regionalt; nationellt och internationellt samarbete premieras
  - Strategi för tre år, nästa års budget och de allmänna årshandlingarna ska bifogas, och föreningen ska delta i ett möte om ansökan
  - Beviljat strategiskt stöd kan inte kombineras med annat kommunalt verksamhets-, investerings- eller driftbidrag
  belopp: Högst 100 000 kr per år i tre år, under förutsättning att verksamheten är liknande eller vidareutvecklad
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Stödet kan sökas vart tredje år, 2023, 2026 och 2029; nästa ansökningsdag är 1 mars 2029
  kalla_url: https://www.bromolla.se/globalassets/kommun-och-politik/regler-och-styrande-dokument/bestammelser-externa/regler-for-bromolla-kommuns-foreningsbidrag.pdf
