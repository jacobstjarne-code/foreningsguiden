- id: gagnef-projektbidrag-kultur
  namn: Projektbidrag för kulturverksamhet
  status: aktiv
  kategori: [kultur]
  foreningstyp: [kultur, hembygd]
  malgrupp: Religiöst och partipolitiskt obundna kulturföreningar med ett nytt tidsbegränsat projekt
  deadlines:
    typ: fasta
    datum: [03-31, 09-30]
  krav:
  - Projektet ska vara nytt och tidsbegränsat, avse en konstform och mynna ut i ett publikt arrangemang eller annan nytta för kommuninvånarna
  - Återkommande arrangemang omfattas inte; nyskapande, nya publikgrupper, gränsöverskridande arbete och hög kvalitet prioriteras
  - Stödet kan avse arvoden, marknadsföring och lokalhyra; medieproduktion stöds bara undantagsvis vid starkt lokalt kulturintresse
  - Förvaltningsberättelse för föregående år samt innevarande års årsmötesprotokoll och verksamhetsplan ska bifogas
  - Genomförande och ekonomi ska redovisas senast två månader efter projektets slut
  belopp: Kommunen publicerar ingen generell beloppsnivå; stödet prövas per kulturprojekt
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Den 31 mars gäller projekt 1 maj–31 oktober samt helår; den 30 september gäller projekt 1 november–30 april.
  kalla_url: *huvud
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
