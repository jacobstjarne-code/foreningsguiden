- id: gagnef-personalkostnadsbidrag
  namn: Personalkostnadsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, ungdom, annat]
  malgrupp: Kultur-, fritids- och idrottsföreningar med anställd personal eller motsvarande köpt tjänst
  deadlines:
    typ: fasta
    datum: [09-30]
  krav:
  - Kostnaden ska avse anställd personal för kansli eller skötsel av föreningens fastighet eller anläggning, alternativt motsvarande köpt tjänst
  - Föreningen ska kontakta förvaltningen inför nyanställning eller tjänsteköp och bara en förening får stöd för samma person
  - Annan finansiering ska redovisas och styrelsebeslut, förvaltningsberättelse samt offert eller myndighetsbeslut ska bifogas när de är relevanta
  - Lönespecifikation eller faktura ska lämnas löpande och stödet betalas bara under det kalenderår som kostnaden avser
  belopp: Högst 35 procent av nettokostnaden inklusive sociala avgifter, maximalt 8 000 kronor per månad och heltidsanställd samt totalt 12 000 kronor per förening och månad
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan för kommande kalenderår ska lämnas senast 30 september.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
- id: gagnef-lokalt-aktivitetsstod
  ansokningsvag: "En separat kommunal ansökan om verksamhetsbidrag krävs. RF-anslutna föreningars 7–25-årsverksamhet hämtas från RF, men 3–6 år redovisas till kommunen; övriga föreningar redovisar allt till kommunen via Mina sidor eller blankett."
  namn: Lokalt aktivitetsstöd
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: &fritid [idrott, kultur, friluft, ungdom, annat]
  malgrupp: Fritids- och idrottsföreningar med organiserad barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum: [02-25, 03-31, 08-25]
  krav:
  - Föreningen ska ha aktiva medlemmar under 20 år och lämna verksamhetsbidragsansökan senast 31 mars
  - Aktiviteten ska vara planerad, ledarledd, pågå minst 45 minuter och ha minst tre deltagare utöver en ledare som är minst 13 år
  - Stödet avser deltagartillfällen 3–25 år; RF-anslutna idrottsföreningar redovisar 7–25 år till Riksidrottsförbundet och 3–6 år till kommunen
  - Övriga föreningar redovisar sammankomster och könsuppdelade deltagartillfällen 3–25 år till kommunen
  - Förvaltningsberättelse, årsmötesprotokoll, verksamhetsplan och uppföljning av föregående plan ska bifogas verksamhetsbidragsansökan
  belopp: Belopp per deltagartillfälle; nivån fastställs inom kommunens verksamhetsbidrag och kan variera mellan år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Höstens deltagartillfällen redovisas senast 25 februari, vårens senast 25 augusti och verksamhetsbidragsansökan senast 31 mars.
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
