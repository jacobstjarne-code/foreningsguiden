  status: aktiv
  kategori: [social, pensionar, funktionsratt]
  foreningstyp: [social, annat]
  malgrupp: Föreningar och organisationer med social verksamhet för invånare i Gagnefs kommun
  deadlines:
    typ: fasta
    datum: [04-30]
  krav:
  - Verksamheten ska ligga inom det sociala området i Gagnefs kommun och rikta sig till kommuninvånare
  - Föreningen eller organisationen ska vara ideell, öppen för sin målgrupp och arbeta demokratiskt med medlemsinflytande
  - Verksamheten ska stimulera det sociala klimatet och bidra till en varm och trygg kommun
  - Föreningen ska ha medlemmar eller verksamhet i kommunen och ha lämnat sina stadgar till socialförvaltningen
  - Ansökan ska beskriva aktiviteter eller löpande verksamhet och lämnas på kommunens blankett
