- id: gagnef-investeringsbidrag
  namn: Investeringsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med en driftsbidragsberättigad byggnad eller anläggning
  deadlines:
    typ: fasta
    datum: [11-30]
  krav:
  - Investeringen ska avse ny- eller ombyggnad av en driftsbidragsberättigad byggnad eller anläggning
  - Normalt underhåll, maskinpark och kostnader under 6 000 kronor stöds inte; försäkrad akut skada kan få stöd till självrisken
  - Investeringen ska finnas i föreningens årligen uppdaterade investeringsplan och får inte påbörjas före beslut
  - Styrelsebeslut, offert eller noggrann kalkyl, eventuell medfinansiering och påverkan på framtida drift ska redovisas
  - Utbetalning sker mot fakturor under det kalenderår som bidraget avser
  belopp: Högst 75 procent av investeringskostnaden; akut oförutsedd skada kan ge högst 75 procent av självrisken
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningar på 6 000–45 000 kronor behandlas löpande; högre ansökningar ska lämnas senast 30 november året före åtgärden.
