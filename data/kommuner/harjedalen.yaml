- id: harjedalen-samlingslokaler
  namn: Bidrag till samlingslokaler
  kategori:
  - kultur
  - ovrig
  malgrupp: Prioriterade föreningsdrivna samlingslokaler i Härjedalens kommun enligt kommunens särskilda förteckning
  deadlines:
    typ: okand
    datum: []
  krav:
  - Lokalen ska finnas i kommunens förteckning över bidragsberättigade samlingslokaler
  - Ungdomsaktiviteter i lokalen ska vara drogfria
  - Årsredovisning och uppgifter om lokalens fasta kostnader, intäkter och likvida tillgångar ska lämnas som underlag
  belopp: Underskottstäckning enligt kommunens beräkningsmodell, dock högst 50 % av lokalens fasta kostnader. Vid överskott
    kan stimulansbidrag om 5 % av fasta kostnader utgå.
  sen_ansokan: Ansökningsdatum framgår inte av den öppna riktlinjesidan; kontrollera blankett eller kontakta kommunen.
  kalla_url: https://www.herjedalen.se/kommun-och-politik/styrdokument-och-regler/bidrag-och-stod-for-evenemang-foreningar-lokaler-och-studieforbund/bidrag-till-samlingslokaler.html
  anteckning: Detta stöd regleras separat och omfattas uttryckligen inte av den allmänna föreningsstödsriktlinjen.
  krav_status: angivet
  krav_fullstandiga: false
  belopp_status: overifierat
  deadline_status: overifierat
  giltighet_status: overifierat
  senast_verifierad: '2026-08-03'
- id: harjedalen-studieforbund
  namn: Stöd till studieförbund
  kategori:
  - kultur
  - ovrig
  malgrupp: Statsbidragsberättigade studieförbund som redovisar lokal folkbildnings- och kulturverksamhet i Härjedalens kommun
  deadlines:
    typ: fasta
    datum:
    - 05-01
  krav:
  - Studieförbundets centrala organisation ska få statsbidrag via Folkbildningsrådet
  - Verksamheten ska vara statsbidragsberättigad och genomförd i kommunen för kommunens invånare
  - Föregående års verksamhet och kommunintyg samt innevarande års verksamhetsplan ska lämnas senast 1 maj
  belopp: Kommunens ramanslag fördelas som 75 % grundanslag, 5 % efter unika deltagare och 20 % förstärkningsanslag.
  sen_ansokan: Underlag som lämnas efter 1 maj riskerar att inte ingå i årets fördelning.
  kalla_url: https://www.herjedalen.se/kommun-och-politik/styrdokument-och-regler/bidrag-och-stod-for-evenemang-foreningar-lokaler-och-studieforbund/studieforbund.html
