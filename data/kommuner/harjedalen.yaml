  krav_fullstandiga: false
  belopp_status: overifierat
  deadline_status: overifierat
  giltighet_status: overifierat
  senast_verifierad: '2026-08-03'
- id: harjedalen-evenemangsstod
  namn: Evenemangsstöd
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Föreningar och organisationer som genomför evenemang i Härjedalens kommun
  deadlines:
