    datum:
    - 01-15
    - 05-15
    - 10-01
  krav:
  - Evenemanget ska bidra till kommunens attraktivitet och bedöms enligt kommunens särskilda riktlinje
  - Ansökningar över 25 000 kronor ska lämnas minst tre månader före evenemanget
  belopp: Skäligt belopp efter bedömning. Ansökningar över 25 000 kronor beslutas av kommunstyrelsen.
  sen_ansokan: Ansökningar handläggs tre gånger per år; större ansökningar ska dessutom lämnas minst tre månader före evenemanget.
