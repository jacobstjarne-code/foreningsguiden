    datum:
    - 02-25
    - 08-25
  krav:
  - &ideell Bedriver ideell lokal verksamhet inom Härjedalens kommuns geografiska område
  - &formalia Har stadgar, vald styrelse, revisorer, organisationsnummer och bankkonto, plusgiro eller bankgiro i föreningens namn
  - &register Finns i kommunens föreningsregister och uppdaterar kontaktinformationen efter årsmötet
  - &arshandlingar Lämnar en gång per år verksamhetsplan, verksamhetsberättelse, revisionsberättelse, resultat- och balansräkning samt nya föreningsuppgifter
  - Minst 75 procent av de redovisade tillfällena ska vara idrott; högst 25 procent får vara kringaktiviteter som utbildningar eller möten
  - Ledaren ska vara medlem, utsedd för aktiviteten och minst 18 år
  - Varje tillfälle ska pågå minst 60 minuter och ha minst tre deltagare
  - En medlem kan ge deltagarstöd vid högst ett tillfälle per dag; ledaren räknas inte som deltagare
  - Entrébelagda tävlingar, matcher, träningar och kommersiella arrangemang ger inte stöd
  - Alla ska ges möjlighet att delta efter sina förutsättningar och närvaron ska redovisas på kommunens blankett eller sammanställning från IdrottOnline
  belopp: 5 kr per deltagare och 15 kr per ledare samt 10 kr för en extra ledare per gruppaktivitet
