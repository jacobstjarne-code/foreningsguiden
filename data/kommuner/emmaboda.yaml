- id: emmaboda-investeringsbidrag
  namn: Investeringsbidrag
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar verksamma i Emmaboda som investerar i en lokal, anläggning, maskin eller inventarie
  deadlines:
    typ: fasta
    datum: ['04-01']
  krav:
  - Investeringen ska avse ny-, till- eller ombyggnad av anläggning eller lokal eller inköp av maskin eller inventarie för föreningens verksamhet
  - Inventarien eller anläggningen ska ha längre livslängd än tre år och ett anskaffningsvärde på minst 1 000 kr
  - Ansökan ska lämnas och beslut inväntas innan projektet eller inköpet påbörjas
  - Ansökan ska innehålla behovsbeskrivning samt ekonomisk analys av kostnader och finansiering
