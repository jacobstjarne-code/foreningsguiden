- id: sater-kulturarrangemangsbidrag
  namn: Bidrag till kulturarrangemang
  status: aktiv
  kategori: [kultur]
  foreningstyp: [kultur, hembygd]
  malgrupp: Kulturföreningar i Säter som genomför offentliga kulturarrangemang
  deadlines:
    typ: fasta
    datum: [10-15]
  krav:
  - Sökanden ska vara en kulturförening i Säter och arrangemanget ska vara en kulturell mötesplats, exempelvis konsert, teater,
    utställning, historisk vandring eller föredrag
  - Projektet ska bidra till minst ett av kommunens kulturmål, såsom jämlik tillgång, barns delaktighet, fler kulturyttringar,
    kulturmötesplatser, samverkan eller tillgängligt kulturarv
  - Stödet får inte användas till en enskild persons verksamhet, studieresa eller utbildning
  - Ansökan ska vara inlämnad och behandlad före arrangemanget och innan marknadsföringen påbörjas
  - Alla program som fått stöd ska redovisas skriftligt senast två månader efter genomförandet
  belopp: Kommunen publicerar ingen generell beloppsnivå
