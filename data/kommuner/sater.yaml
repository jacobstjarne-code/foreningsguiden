- id: sater-evenemangsstod
  namn: Bidrag till större evenemang
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som genomför större, kortvariga evenemang i Säters kommun
  deadlines:
    typ: fasta
    datum: [03-01]
  krav:
  - Sökanden ska vara en förening och arrangemanget ska vara ett större, kortvarigt evenemang, inte löpande verksamhet eller
    ett mindre arrangemang
  - Evenemanget ska ge positiva effekter på besöksnäringen, utveckla befintliga evenemang, stärka bilden av Säter eller ge
    meningsfulla upplevelser för invånare och besökare
  - Evenemanget får inte strida mot kommunens demokratiska värdegrund eller diskriminera någon och ska eftersträva god tillgänglighet
  - Föreningen ska ha god genomförandekapacitet och föra dialog med evenemangsrådet under planering, genomförande och uppföljning
  - Kommunen ska erbjudas synlighet och föreningen ska lämna uppföljning efter genomfört evenemang
  - Budget och verksamhetsberättelse ska lämnas med ansökan
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: 200 000 kr för evenemangsbidrag 2026
  sen_ansokan: Sista ansökningsdag för 2026 års stöd är 1 mars 2026.
