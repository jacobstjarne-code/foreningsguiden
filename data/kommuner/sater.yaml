- id: sater-kommunalt-aktivitetsstod
  namn: Kommunalt aktivitetsstöd
  status: aktiv
  kategori: [idrott, funktionsratt, ovrig]
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Idrottsföreningar och godkända barn- och ungdomsföreningar med stödgrundande aktiviteter i Säters kommun
  deadlines:
    typ: fasta
    datum: [05-15]
  krav:
  - Ideell förening som är medlem i ett RF-anslutet specialidrottsförbund, har begränsat medlemskap eller samarbetsavtal med
    specialidrottsförbund; annan barn- och ungdomsförening måste vara godkänd av fritidsutskottet
  - Aktiviteten ska anordnas av föreningen, vara ledarledd och ligga i linje med föreningens idrottsliga verksamhet och idé
  - Ledaren ska vara utsedd av föreningen, minst 13 år och får inte redovisas som ledare för flera grupper samtidigt
  - Minst tre stödberättigade deltagare utöver ledaren krävs och högst 30 deltagare per sammankomst får räknas
  - Sammankomsten ska pågå minst 60 minuter med gemensam samling och avslutning; för åldersgruppen 0–7 år minst 40 minuter
  - Deltagare ska vara medlemmar, bosatta i Säter och 0–25 år; ledare 13–25 år. För idrott för personer med funktionsnedsättning
    finns ingen övre åldersgräns
  - En deltagare får räknas en gång per dag och idrott; vid match eller tävling redovisar respektive förening sina deltagare
  - Ansökan senast 15 maj avser föregående års verksamhet
  belopp: Fördelas efter stödgrundande aktiviteter; godkänd barn- och ungdomsförening utanför RF får en poäng per aktivitetstillfälle
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan för föregående års verksamhet ska vara kommunen tillhanda senast 15 maj.
  kalla_url: &norm https://sater.se/wp-content/uploads/2023/01/ks2021_0434-6-regler-foreningsbidrag-1.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-19'
