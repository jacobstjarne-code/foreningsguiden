- id: alvdalen-skotsel-underhall-anlaggning
  namn: Bidrag till skötsel och underhåll av egen anläggning
  kategori:
  - idrott
  - ovrig
  foreningstyp: [idrott, friluft, ungdom, annat]
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 10-01
  krav:
  - Sökanden ska vara en förening som sköter och underhåller en egen anläggning
  - Anläggningen ska vara av en stödberättigad typ, exempelvis skidspår, fotbollsplan, badplats, isrink, motorbana, cykelbana eller skateboardramp
  - Föreningen ska vara registrerad i kommunens föreningsregister och ansöka via föreningsportalen
  - Ansökan ska avse föreningens skötsel och underhåll av anläggningen
  belopp: Individuellt prövat bidrag till skötsel och underhåll; kommunen publicerar ingen generell nivå
