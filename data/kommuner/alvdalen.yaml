  deadlines:
    typ: lopande
    datum: []
  krav:
  - Riktar sig till ideella föreningar som ordnar kulturarrangemang med professionella kulturaktörer
  - Arrangemanget ska stärka det offentliga kultur- och fritidsutbudet i kommunen
