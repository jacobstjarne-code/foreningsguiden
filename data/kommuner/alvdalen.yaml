- id: alvdalen-sponsring
  namn: Sponsring
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: *alla
  malgrupp: Föreningar och organisationer som söker ett sponsoravtal för verksamhet eller ett särskilt evenemang i Älvdalens kommun
  deadlines:
    typ: fasta
    datum:
    - 03-01
    - 09-01
  krav:
  - Verksamheten eller evenemanget ska genomföras i Älvdalens kommun
  - Sponsringen ska stärka en positiv bild av Älvdalens kommun
  - Sponsringen får inte avse verksamhet med alkohol- eller droginriktning
  - Kommunens logotyp ska synas i annonser och under verksamheten och kommunens grafiska profil ska följas
  - Genomförd sponsring ska redovisas med ekonomiskt utfall, utvärdering, resultat, statistik och dokumentation
  belopp: Individuellt prövad sponsring; kommunen publicerar ingen generell nivå eller maxgräns
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 1 mars för verksamhet juli–december och 1 september för verksamhet januari–juni; sena ansökningar beviljas inte.
  kalla_url: *huvud
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet är öppet även för privatpersoner och andra arrangörer; föreningar konkurrerar om samma sponsringsmedel. Ett offentligt beslut 2026 bekräftar kommunal sponsring till en förening.
  senast_verifierad: '2026-08-23'
- id: alvdalen-sommarlovsaktiviteter-2026
  namn: Ersättning för sommarlovsaktiviteter 2026
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: *alla
  malgrupp: Föreningar och organisationer som ordnar kostnadsfria sommarlovsaktiviteter för barn 6–15 år
  deadlines:
    typ: fasta
    datum:
    - 05-04
  krav:
  - Sökanden ska vara en förening eller organisation
  - Aktiviteten ska rikta sig till barn och unga i åldrarna 6–15 år
  - Aktiviteten ska vara gratis för deltagande barn
  - Aktiviteten ska anmälas till kommunens gemensamma sommarlovsprogram
  - Genomförda aktiviteter ska redovisas senast 15 september 2026 med antal deltagande pojkar och flickor 6–15 år
  belopp: Viss kommunal ersättning för att aktiviteten ska kunna vara gratis; kommunen publicerar ingen generell nivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Anmälan för 2026 ska vara kommunen tillhanda senast 4 maj.
  kalla_url: https://www.alvdalen.se/uppleva-och-gora/foreningar/arrangera-sommarlovsaktiviteter.html
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
forutsattningar:
- id: alvdalen-registrering
  vad: Registrering och aktuella föreningsuppgifter
  beskrivning: Föreningen ska finnas i kommunens föreningsregister och ha minst en kontaktperson registrerad med personnummer för inloggning i föreningsportalen. För föreningsstöd krävs dessutom godkända stadgar, demokratisk öppen verksamhet, minst fem medlemmar, huvudsaklig verksamhet och huvuddelen av medlemmarna i kommunen samt aktuell drogpolicy. Kommunen publicerar ingen giltighetstid eller återkommande förnyelsefrist för registreringen.
