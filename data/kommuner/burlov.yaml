- id: burlov-kulturforeningar
  namn: Verksamhetsstöd
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Stödberättigade föreningar utanför Riksidrottsförbundet samt statsbidragsgodkända studieförbund
  deadlines:
    typ: fasta
    datum: [03-25]
  krav:
  - Sökande förening ska uppfylla Burlövs kriterier för stödberättigad förening och får inte vara medlem i Riksidrottsförbundet
  - Ett sökande studieförbund ska vara godkänt av Folkbildningsrådet och bedriva verksamhet i Burlöv för deltagare som är kommuninvånare
  - Verksamheten ska bidra till ett varierat och inkluderande kultur- och fritidsutbud
  - Bedömningen utgår från hur många kommuninvånare verksamheten når och hur väl den svarar mot kommunens fokusområden
  - Stöd ges inte för aktivitet som fått stöd från en annan kommun eller till en annan förening eller ett annat studieförbund
  belopp: Individuellt bedömt efter räckvidd och överensstämmelse med kommunens kultur- och fritidsstrategi; fast belopp publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 mars varje år
  kalla_url: https://burlov.se/kulturfritid/foreningariburlov/ekonomiskastod.4.529b5b9c19a0a1e99e18e8a3.html
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-18'
- id: burlov-drift-hyresstod
  namn: Drift- och hyresstöd
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  malgrupp: Föreningar som äger eller långtidshyr och driver lokal eller anläggning i Burlövs kommun
  deadlines:
    typ: fasta
    datum: [03-25]
  krav:
  - Föreningen ska uppfylla Burlövs kriterier för stödberättigad förening och äga eller långtidshyra en lokal eller anläggning där föreningen ansvarar för driften
  - Vid långtidshyra ska ett skriftligt avtal finnas; kommunala driftuppdrag ska regleras genom avtal med Burlövs kommun
  - Verksamheten ska rikta sig till barn och unga 0–20 år, personer med funktionsnedsättning eller personer som är minst 65 år
  - Stöd får avse drift, hyra, värme, vatten och el men inte redan subventionerad kommunal lokal, entrébelagt eller vinstinriktat arrangemang eller lokal i annan kommun
  - Ansökan ska redovisa lokalens eller anläggningens typ och yta i kvadratmeter
  belopp: Högst 75 % av godkända kostnader för drift, hyra, värme, vatten och el
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 mars varje år
  kalla_url: https://burlov.se/download/18.4fca773018e5a91a6b5111e2/1711098659868/Allm%C3%A4nna%20best%C3%A4mmelser%20f%C3%B6r%20st%C3%B6d%20till%20f%C3%B6reningar%20och%20medborgarinitiativ%20inom%20Kultur%20och%20fritid%202021-12-08.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-18'
- id: burlov-projekt-och-utvecklingsstod
  namn: Projekt- och utvecklingsstöd
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Föreningar som vill utveckla sin verksamhet eller genomföra en ideell aktivitet för Burlövs invånare
  deadlines:
    typ: fasta
    datum: [03-25, 08-25]
  krav:
  - Föreningens projekt ska utveckla verksamheten, exempelvis genom ledarutbildning, verksamhetsplanering eller medlemsrekrytering, eller vara ett ideellt arrangemang
  - Aktiviteten ska vara öppen för alla och rikta sig till Burlövs invånare; insatser för barn och unga 0–20 år prioriteras
  - Ansökan ska beskriva projektet, målgruppen, genomförandet och ekonomin samt lämnas innan aktiviteten genomförs
  - Bedömningen utgår från kultur- och fritidsstrategins fokusområden och görs i dialog med kommunens föreningsutvecklare
  - Nystartade föreningar kan inom stödformen få högst 3 000 kr under sitt första verksamhetsår
  belopp: Individuellt prövat; nystartade föreningar kan få högst 3 000 kr under det första verksamhetsåret
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ordinarie ansökningsdagar är 25 mars och 25 augusti; särskilda lovaktiviteter har egna publicerade ansökningsperioder
  kalla_url: https://burlov.se/kulturfritid/foreningariburlov/ekonomiskastod.4.529b5b9c19a0a1e99e18e8a3.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet är även öppet för privatpersoner från 12 år. Föreningar konkurrerar därför med enskilda sökande om tillgängliga medel.
  senast_verifierad: '2026-08-23'
- id: burlov-starka-steg-2026
  namn: Starka Steg 2026
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, social, pensionar, ovrig]
  malgrupp: Föreningar och andra organisationer som ordnar kostnadsfria aktiviteter för flickor 12–20 år eller personer 65 år och äldre
  deadlines:
    typ: fasta
    datum: [03-31, 05-31, 07-31]
  krav:
  - Aktiviteten ska genomföras i Burlövs kommun och rikta sig till flickor 12–20 år eller personer som är 65 år och äldre
  - Deltagandet ska vara kostnadsfritt, inkluderande och utgå från målgruppens behov
  - Ansökan ska beskriva hur målgruppen nås och involveras samt hur aktiviteten dokumenteras och följs upp
  - Stöd kan avse ledararvoden, lokal, uppsökande arbete, skolbesök, ambassadörer, material och utrustning
  - Genomförande och redovisning ska följa den tidsperiod som hör till respektive ansökningsomgång
  belopp: Individuellt prövat; ingen generell beloppsnivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Vårens ansökan senast 31 mars, sommarens senast 31 maj och höstens senast 31 juli 2026
  kalla_url: https://burlov.se/kulturfritid/starkasteg2026.4.3071d9e219c47c51c084bc77.html
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet är även öppet för kommunala verksamheter, privata företag och andra ideella organisationer. Föreningar konkurrerar därför med andra aktörstyper om medlen.
  senast_verifierad: '2026-08-23'
