bidrag:
- id: burlov-idrottsforeningar
  namn: Aktivitetsstöd
  foreningstyp: [idrott]
  kategori: [idrott]
  malgrupp: Stödberättigade föreningar anslutna till Riksidrottsförbundet
  deadlines:
    typ: fasta
    datum: [02-25]
  krav:
  - Föreningen ska vara ansluten till Riksidrottsförbundet och uppfylla Burlövs kriterier för stödberättigad förening
  - Varje gruppaktivitet ska ha minst tre deltagare utöver ledare eller tränare och pågå minst 60 minuter med gemensam start och avslut
  - Matcher i serier, cuper eller turneringar är inte bidragsberättigade
  - Högst tre ledare per gruppaktivitet får räknas med
  - Ansökan ska redovisa föregående kalenderårs deltagartillfällen och inget stöd får ha beviljats för aktiviteten från en annan kommun
  belopp: Deltagarstöd baserat på redovisade deltagartillfällen och högst tre ledare per aktivitet; aktuell kronnivå publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 februari för hela föregående kalenderårs aktiviteter
