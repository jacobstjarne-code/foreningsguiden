  - Partnerskapet får inte avse verksamhet som ska upphandlas enligt LOU, ska vara förenligt med kommunallagen och EU:s statsstödsregler,
    och får inte vara en del av det normerade föreningsbidraget
  - Organisationen ska fungera enligt allmänt vedertagna demokratiska principer och alla människors lika rätt som värdegrund
  - Både organisationen och kommunen ska finansiera verksamheten (pengar eller andra insatser)
