  krav:
  - Initiativet till samarbetet ska komma från den idéburna organisationen, inte från kommunen
  - Partnerskapet får inte avse verksamhet som ska upphandlas enligt LOU, ska vara förenligt med kommunallagen och EU:s statsstödsregler,
