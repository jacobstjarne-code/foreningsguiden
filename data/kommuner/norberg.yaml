  - Föreningen ska ha minst tre medlemmar, inte begränsa medlemsantalet samt ha bankkonto och organisationsnummer
  - Insatsen ska utveckla eller anpassa verksamheten, exempelvis genom nya ledare, målgrupper, aktiviteter, lokalanpassning eller digital satsning
