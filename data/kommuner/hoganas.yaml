- id: hoganas-funktionsnedsattning
  namn: Funktionsnedsättningsstöd
  kategori:
  - social
  malgrupp: Föreningar för funktionshinder och social omsorg
  deadlines:
    typ: fasta
    datum:
    - 01-01
    - 03-31
  krav:
  - Lokal förening ansluten till HSO (Handikappföreningarnas samarbetsorganisation i Höganäs), eller funktionshinderförening
    med aktiv verksamhet för medlemmar bosatta i Höganäs kommun
  belopp: 3 400 kr grundbidrag per förening (23 372 kr till HSO) + 166 kr/medlem baserat på medlemsantal 31 december föregående
    år
  sen_ansokan: Ej möjlig efter 31 mars
  kalla_url: https://www.hoganas.se/besok--upplev/foreningar-och-foreningsliv/sokbara-stod-i-hoganas/funktionshinderforening.html
