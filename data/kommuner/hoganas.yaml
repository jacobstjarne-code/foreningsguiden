  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Årligt grundbidrag plus medlemsbaserat tillägg
- id: hoganas-lokalstod
  namn: Lokalstöd
  kategori:
  - idrott
  malgrupp: Idrottsföreningar utan kommunal lokal
  deadlines:
    typ: fasta
    datum:
    - 02-15
  krav:
  - Lokalen ska vara belägen inom Höganäs kommun
  - Lokalen ska uppfylla myndighetskrav (bygglov, brandskydd, försäkring)
  - Föreningen får inte bedriva verksamhet i kommunal lokal
  - Gäller endast barn- och ungdomsverksamhet
  - Föreningen får inte ha skulder till kommunen
  belopp: 30 kr per sammankomst/träning, dock högst 70 procent av redovisad hyreskostnad
  sen_ansokan: För sent inkommen ansökan behandlas inte
  kalla_url: https://www.hoganas.se/besok--upplev/foreningar-och-foreningsliv/sokbara-stod-i-hoganas/lokalstod.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: hoganas-utvecklingsstod
  namn: Utvecklingsstöd
  kategori:
  - idrott
  malgrupp: Elitidrottsföreningar
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökbart i första hand för idrottsföreningar i Höganäs kommun, individer kan söka efter särskild prövning
  - Aktiva kan få stöd från och med det år de fyller 15 år
  - Kvalificering baseras på föregående års tävlingsresultat
  belopp: null
