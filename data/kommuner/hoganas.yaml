  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: hoganas-pensionarer
  namn: Pensionärsorganisationsbidrag
  kategori:
  - social
  malgrupp: Pensionärsorganisationer
  deadlines:
    typ: fasta
    datum:
    - 01-01
    - 03-31
  krav:
  - Ansluten till en av de fem rikstäckande pensionärsorganisationerna
  - Aktiv lokalförening i Höganäs kommun
  - Bedriver kompletterande verksamhet för pensionärer och äldre utöver övriga samhällsinsatser
  belopp: 3 400 kr grundbidrag per samorganisation + 41 kr/medlem, dock högst två prisbasbelopp
  sen_ansokan: Ej möjlig efter 31 mars
  kalla_url: https://www.hoganas.se/besok--upplev/foreningar-och-foreningsliv/sokbara-stod-i-hoganas/pensionarsorganisation.html
