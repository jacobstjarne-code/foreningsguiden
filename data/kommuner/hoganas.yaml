  namn: Aktivitetsstöd ungdom
  kategori:
  - idrott
  - kultur
  malgrupp: Ungdomsidrottsföreningar
  deadlines:
    typ: fasta
    datum:
    - 02-15
  krav:
  - Öppen för medlemmar 7–25 år (ingen övre åldersgräns för föreningar med funktionsnedsättningsinriktning)
  - Stadgar, demokratiskt vald styrelse och medlemsmatrikel
  - Minst 10 bokförda medlemmar 7–25 år, majoriteten folkbokförda i Höganäs kommun
  - Ansluten till godkänd riksorganisation eller godkänd som stödberättigad organisation
  - Deltagande vid kultur- och fritidsförvaltningens årliga föreningskväll
  belopp: 90 kr per sammankomst/träning
  sen_ansokan: Ej möjlig efter 15 februari
  kalla_url: https://www.hoganas.se/besok--upplev/foreningar-och-foreningsliv/sokbara-stod-i-hoganas/aktivitetsstod.html
  belopp_status: kontrollast
