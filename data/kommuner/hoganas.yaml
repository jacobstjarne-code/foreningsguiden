- id: hoganas-startbidrag
  namn: Startbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Nystartade föreningar inom kultur- och fritidsområdet
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Förening inom kultur- och fritidsområdet i Höganäs kommun
  - Kan inte sökas för ordinarie föreningsverksamhet, fester/jubileum eller interna föreningsaktiviteter
  - Kan inte sökas för projekt/arrangemang med övervägande religiöst, politiskt eller vinstsyfte
  - I marknadsföringen ska det framgå att föreningen/individen stöds av Höganäs kommun
  - Ansökan ska ha inkommit minst en månad före arrangemangets eller projektets genomförande
  belopp: null
  sen_ansokan: Ansökan behandlas löpande
  kalla_url: https://www.hoganas.se/besok--upplev/foreningar-och-foreningsliv/sokbara-stod-i-hoganas/startbidrag.html
