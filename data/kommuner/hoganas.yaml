  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: hoganas-socialtjanstens-verksamhet
  namn: Föreningsbidrag inom socialtjänstens verksamhet
  kategori:
  - social
  malgrupp: Ideella föreningar med verksamhet som kompletterar socialtjänstens insatser
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Ideell demokratisk förening med anknytning till Höganäs kommun eller dess invånare
  - Lokal förening i kommunen, eller verksamhet som i väsentlig grad gynnar kommunens invånare
  - Bedriver kompletterande verksamhet, t.ex. aktivering och/eller uppsökande verksamhet
  belopp: Socialnämnden avsätter totalt 200 000 kr/år för föreningsbidrag inom socialnämndens verksamhetsområde (ingen individuell
    beloppsformel per förening)
  sen_ansokan: Ansökningar efter 31 mars prövas inte
  kalla_url: https://www.hoganas.se/besok--upplev/foreningar-och-foreningsliv/sokbara-stod-i-hoganas/socialtjanstens-verksamhet.html
