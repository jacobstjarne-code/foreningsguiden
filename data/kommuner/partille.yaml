- id: partille-foreningsregister
  vad: Registrera föreningen i föreningsregistret hos kultur- och fritidsförvaltningen
  beskrivning: Föreningen ska ha sitt säte i Partille kommun, bedriva regelbunden ideell verksamhet öppen för alla i minst
    sex månader, vara ansluten till en riks-/distriktsorganisation (idrott) eller ha organisatorisk fasthet (kultur), ha stadgar,
    medlemsmatrikel, demokratiskt vald styrelse och revisorer samt minst 10 medlemmar som betalat minst 100 kr/år i medlemsavgift.
    Bidragsberättigad förening ska varje år skicka in blankett med föreningsuppgifter, verksamhetsberättelse, ekonomisk berättelse,
    revisionsberättelse och årsmötesprotokoll till kultur- och fritidsförvaltningens föreningsregister.
