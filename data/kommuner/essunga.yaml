  giltighet_status: kontrollast
- id: essunga-policy-och-insyn
  vad: Policyer, bokföring och kommunal insyn
  beskrivning: Ansökan ska innehålla föreningens drog-, tobaks- och kränkningspolicy samt värdegrund. Föreningen ska föra kassabok, låta kommunen granska räkenskaper, protokoll och andra handlingar och kan bli återbetalningsskyldig eller avstängd vid felaktiga uppgifter.
  system: Kommunal granskning
  ledtid: null
  ledtid_text: Underlag lämnas med ansökan och på begäran
