    datum: [04-30]
  krav:
  - Anläggningen ska ligga i Essunga kommun och regelbundet användas för barn- och ungdomsverksamhet
  - För driftbidrag ska föreningen helt ansvara för anläggningens drift- och underhållskostnader
  - Driftstödet avser verifierade kostnader för försäkring, energi, värme, sotning, vatten och avlopp, fastighetsskatt, sophämtning, ränta eller hyra
  - Ansökan ska avse föregående verksamhetsårs kostnader och föreningen ska på begäran visa verifikationer
  belopp: Skötselbidrag enligt anläggningsschablon 900–4 100 kronor; driftbidrag 200 kronor per medlem 7–25 år, högst 40 procent av godkända kostnader
