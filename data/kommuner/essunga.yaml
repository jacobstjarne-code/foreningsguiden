  beskrivning: Förening som får kommunalt föreningsstöd ska senast 30 april varje år lämna verksamhetsberättelse, ekonomisk berättelse och revisionsberättelse. Handlingarna lämnas normalt tillsammans med bidragsansökan.
  system: Kommunens självservice och föreningsregister
  ledtid: null
