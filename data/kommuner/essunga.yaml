- id: essunga-ledarutbildningsbidrag
  namn: Ledarutbildningsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Föreningar som utbildar ideella ledare från 14 år
  deadlines:
    typ: relativ
    datum: []
  krav:
  - Deltagaren ska vara minst 14 år och ha gått en utbildning som är särskilt upplagd för ledare
  - Kommunen beaktar om deltagaren arbetar oavlönat som ledare eller funktionär i en ungdomsorganisation i Essunga
  - Samma ledare kan få stöd högst två gånger per år och kurser längre än två dagar ersätts för högst tre deltagare
  - Föreningen kan få kursstöd för en ledare per påbörjat tiotal medlemmar
  - Utbildning som kan väntas ge deltagaren ekonomisk vinning är inte stödberättigad; kostnader, kursintyg och kursprogram ska styrkas
  belopp: 70 procent av kostnaden, högst 1 000 kronor per ledare och kurs; kurskostnad under 250 kronor ersätts inte
