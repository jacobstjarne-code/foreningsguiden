  giltighet_status: kontrollast
- id: essunga-grundvillkor
  vad: Bidragsberättigad ideell förening i Essunga
  beskrivning: Föreningen ska ha stadgar, stadgeenligt vald styrelse och revisor, hålla årsmöte, ha styrelsens säte i kommunen, organisationsnummer och konto i föreningens namn samt normalt minst 75 procent av medlemmarna folkbokförda i Essunga. Medlemsavgiften ska vara minst 25 kronor under 18 år och 50 kronor från 18 år.
  system: Kommunens föreningsregister
  ledtid: 180
  ledtid_text: Minst sex månaders lokal verksamhet krävs för flera ordinarie stöd
  giltighet: Villkoren ska vara uppfyllda så länge föreningen söker eller får kommunalt stöd
  ordning: 2
