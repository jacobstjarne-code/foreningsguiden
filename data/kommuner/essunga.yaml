- id: essunga-aktivitetsstod
  namn: Kommunalt aktivitetsbidrag
  kategori: [idrott, kultur, social, funktionsratt, ovrig]
  malgrupp: Föreningar i Essunga med regelbunden verksamhet för barn och unga eller deltagare med funktionsnedsättning
  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Föreningen ska bedriva verksamhet i Essunga kommun och ha minst 15 medlemmar i åldern 7–20 år
  - En vanlig sammankomst ska pågå minst 60 minuter och ha minst tre deltagare i åldern 7–20 år; högst 30 deltagare ersätts
  - Inom parasport räcker en deltagare för en godkänd aktivitet, varje deltagare räknas som en aktivitet och sammankomsten ska pågå minst 30 minuter
  - Samma deltagare får bara räknas en gång per dag och närvaroförteckningen ska visa namn och födelseår samt sparas i minst fyra år
  - Verksamheten ska vara öppen för kommuninvånarna och ansökan ska avse rätt halvårsperiod
  belopp: 30 kronor per sammankomst och 5 kronor per deltagare; för deltagare med funktionsnedsättning lämnas det högre sammankomststödet utan deltagarbelopp
  sen_ansokan: Ansökan senast 25 augusti för januari–juni och 25 februari för juli–december; 1–5 dagar sent ger 20 procents avdrag, 6–10 dagar 35 procent, 11–14 dagar 50 procent och senare ansökan avslås
