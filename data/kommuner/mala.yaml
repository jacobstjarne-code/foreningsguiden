  krav:
  - Föreningen ska ha valt styrelse, antagit stadgar och fungera efter allmänt vedertagna demokratiska principer
  - Föreningen ska vara verksam i Malå kommun och ha uppdaterat sina uppgifter i det digitala föreningsregistret
  - Föreningen ska ha en policy som verkar för jämställdhet, motverkar diskriminering/mobbning/rasism, motverkar tobak/alkohol/narkotika/dopning
