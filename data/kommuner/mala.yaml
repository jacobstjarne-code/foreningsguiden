- id: mala-studieforbund
  namn: Bidrag till studieförbund
  kategori:
  - kultur
  malgrupp: Studieförbund med verksamhet i Malå kommun
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Studieförbundet ska vara godkänt för statsbidrag enligt förordningen (2015:218) om statsbidrag till fortbildning och vara
    anslutet till bransch- och intresseorganisationen Studieförbunden
  - Studieförbundet ska ha bemannat lokalkontor i Malå kommun där verksamheten bedrivits
  - Verksamheten ska vara kopplad till kommunens mål och inriktningsmål för föreningsbidrag
  - Studieförbundet ska senast den 30 april till kommunstyrelsen lämna in ansökningshandlingar över sin verksamhet i Malå
    för det gångna året, inklusive beskrivning av hur man arbetat med kommunens mål
  - Studieförbundet ska lämna in handlingar från årsmöte samt kopior på närvarokort eller annan sammanställning
  - Bidrag lämnas inte till verksamhet som liknar den allmänna skolans, som kan finansieras kommersiellt, eller som allmänna
    skolan/vårdinstitutioner ska svara för
  - Ansökan om bidrag för studieförbund görs inte via e-tjänst, till skillnad från övriga föreningsbidrag
  belopp: null
