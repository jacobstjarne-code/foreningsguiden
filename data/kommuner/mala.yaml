- id: mala-studieforbund
  namn: Bidrag till studieförbund
  kategori:
  - kultur
  malgrupp: Studieförbund med verksamhet i Malå kommun
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Studieförbundet ska vara godkänt för statsbidrag enligt förordningen (2015:218) om statsbidrag till fortbildning och vara
    anslutet till bransch- och intresseorganisationen Studieförbunden
  - Studieförbundet ska ha bemannat lokalkontor i Malå kommun där verksamheten bedrivits
  - Verksamheten ska vara kopplad till kommunens mål och inriktningsmål för föreningsbidrag
  - Studieförbundet ska senast den 30 april till kommunstyrelsen lämna in ansökningshandlingar över sin verksamhet i Malå
    för det gångna året, inklusive beskrivning av hur man arbetat med kommunens mål
  - Studieförbundet ska lämna in handlingar från årsmöte samt kopior på närvarokort eller annan sammanställning
  - Bidrag lämnas inte till verksamhet som liknar den allmänna skolans, som kan finansieras kommersiellt, eller som allmänna
    skolan/vårdinstitutioner ska svara för
  - Ansökan om bidrag för studieförbund görs inte via e-tjänst, till skillnad från övriga föreningsbidrag
  belopp: 'Bidraget delas in i två kategorier: volymbidrag (80 % av kommunens totala anslag, fördelas utifrån genomsnittligt
    antal genomförda studietimmar de två senaste åren) och kulturbidrag (20 %, fördelas utifrån genomsnittligt antal genomförda
    kulturprogram de två senaste åren)'
  sen_ansokan: Ansökan ska vara kommunstyrelsen tillhanda senast den 30 april
  kalla_url: https://www.mala.se/kultur-och-fritid/foreningsinformation/foreningsbidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  status: aktiv
  senast_verifierad: '2026-08-02'
- id: mala-bygdemedel
  namn: Bygdemedel
  kategori:
  - ovrig
  malgrupp: Ideella föreningar och andra aktörer med projekt som gynnar berörd bygd
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Ansökan ska utgå från kommunens beslutade handlingsplan för bygdemedel för aktuellt år
  - Ansökan ska innehålla syfte med projektet, kostnads- och finansieringsbudget, senaste verksamhetsberättelse, senaste resultat-
    och balansräkning, senaste revisionsberättelse, protokoll som visar vilka som är firmatecknare samt föreningens stadgar
  - Medlen ska användas till investeringar eller projekt med investeringskaraktär för ändamål som främjar näringsliv eller
    service i bygden eller annars är till nytta för denna
  - Ansökan görs digitalt via kommunens e-tjänst
  belopp: null
  sen_ansokan: Ansökan görs mellan den 15 februari och den 15 april
