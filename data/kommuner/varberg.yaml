  ansokningsvag: "En separat kommunal ansökan krävs i Interbook Go efter att underlaget från IdrottOnline eller Närvaro Go har exporterats."
  namn: Lokalt aktivitetsstöd (LOK-stöd)
  kategori:
  - idrott
  - pensionar
  - funktionsratt
  malgrupp: Barn- och ungdomsföreningar (7–25 år), föreningar för personer med funktionsnedsättning (alla åldrar) samt föreningar
    med seniorverksamhet (65+ år), registrerade och verksamma i Varbergs kommun. Förening inom kulturområdet som erhåller
    kulturstöd kan inte söka LOK-stöd för sin verksamhet.
  deadlines:
    typ: fasta
    datum:
    - 02-28
    - 08-28
  krav:
  - Minst 10 medlemmar och minst 20 godkända aktiviteter föregående år
  - Minst 3 deltagare per aktivitet (barn/ungdom max 20 deltagare per ledare; funktionsnedsättning/senior minst 3 deltagare)
  - Aktiviteten ska vara minst 45 minuter med gemensam samling och avslutning
  - Aktiviteten ska vara planerad och beslutad av styrelse, sektion eller medlemsmöte, och genomföras i föreningens regi
  - Aktiviteten/gruppen ska ha minst en ledare; ledare får inte leda flera grupper under samma timme
  - Aktiviteterna ska vara alkohol- och drogfria
  belopp: '90 kronor fast summa per godkänd aktivitet (samtliga målgrupper), plus rörlig summa per deltagare för barn-/ungdomsverksamhet
