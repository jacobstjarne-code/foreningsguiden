forutsattningar:
- id: alvkarleby-registrering
  vad: Kommunalt registrerad förening
  beskrivning: Föreningen ansöker om kommunalt godkännande med fullständig styrelsesammansättning, verksamhetsplan och, om verksamhet redan bedrivits, verksamhetsberättelse. Godkännandet ger rätt att söka föreningsstöd och finnas i föreningsregistret.
  system: Rbok och formuläret Föreningsuppgifter
  ledtid: null
  ledtid_text: Kommunen publicerar ingen handläggningstid för den första registreringen.
  giltighet: Registreringen behålls genom aktuella föreningsuppgifter; en förening avregistreras om aktuella uppgifter inte har lämnats under de senaste tre åren.
  ordning: 1
  kalla_url: *norm
  giltighet_status: kontrollast
- id: alvkarleby-arsmoteshandlingar
  vad: Årlig uppdatering efter årsmötet
  beskrivning: Undertecknad verksamhetsberättelse, ekonomisk rapport och revisionsberättelse ska lämnas efter varje årsmöte. Ändrade registeruppgifter lämnas via formuläret Föreningsuppgifter.
  system: Rbok och formuläret Föreningsuppgifter
  ledtid: 60
  ledtid_text: Senast två månader efter årsmötet och i samtliga fall före 15 september.
  giltighet: Uppgifterna uppdateras årligen; om årshandlingarna saknas den 15 september tas föreningen bort ur registret.
  ordning: 2
  kalla_url: *norm
  giltighet_status: kontrollast
- id: alvkarleby-grundvillkor
  vad: Lokala och demokratiska grundvillkor
  beskrivning: Föreningen ska normalt ha godkända stadgar, minst tio regelbundet deltagande medlemmar, minst nio månaders verksamhet, lokal förankring, demokratisk öppenhet och en trygg, drogfri och icke-diskriminerande verksamhet.
  system: Kommunens regler för föreningsstöd
  ledtid: null
  ledtid_text: Villkoren prövas när föreningen registreras och vid varje ansökan.
  giltighet: Grundvillkoren ska vara uppfyllda under hela stödperioden; kommunen kan annars stänga av föreningen från stöd och säga upp hyresavtal.
  ordning: 3
  kalla_url: *norm
  giltighet_status: kontrollast
