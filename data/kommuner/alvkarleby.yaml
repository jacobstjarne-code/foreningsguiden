- id: alvkarleby-kultur-i-varden
  namn: Kultur i vården
  kategori: [kultur, social]
  foreningstyp: [kultur, social, annat]
  malgrupp: Studieförbund som genomför riktad kultur- eller folkbildningsverksamhet inom kommunal omsorg
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökanden ska vara ett studieförbund som får statsbidrag genom Folkbildningsrådet och bedriver verksamhet i Älvkarleby kommun
  - Den särskilda ansökan ska avse mindre, specifik och riktad verksamhet inom kommunal omsorg, exempelvis service- eller gruppboende
  - Verksamheten ska vara icke-kommersiell och följa folkbildningsstödets syfte och kommunens prioriteringar
  - Studieförbundet ska senast 15 november ha lämnat en övergripande verksamhetsplan för Älvkarleby kommun
  - Genomförd verksamhet och användningen av stödet ska redovisas och räkenskaperna hållas tillgängliga för kommunens kontroll
