bidrag:
- id: alvkarleby-foreningsstod
  namn: Föreningsstöd
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Kommunalt registrerade ideella föreningar med verksamhet i Älvkarleby kommun
  deadlines:
    typ: fasta
    datum: [09-15]
  krav:
  - &registrerad Föreningen ska vara kommunalt registrerad och ansökan ska lämnas av styrelsen samt undertecknas av ordföranden
  - &stadgar Föreningen ska ha stadgar som godkänts av en riksorganisation eller kommunen, vara demokratiskt uppbyggd och öppen för alla
  - &lokal Föreningen ska ha minst tio regelbundet deltagande medlemmar, ha bedrivit verksamhet i minst nio månader och bedriva verksamheten med huvuddelen av medlemmarna i Älvkarleby kommun
  - &vardering Verksamheten ska bedrivas i en rök-, alkohol- och drogfri miljö och vara fri från rasistisk, sexuell och annan kränkande diskriminering
  - Ansökan ska avse innevarande års verksamhet och innehålla verksamhetsplan samt senaste verksamhetsberättelse, ekonomiska rapport och revisionsberättelse
  - Ekonomiska föreningar, politiska vuxenföreningar, religiösa föreningar, elevföreningar utom skol-IF, försvarsanknutna föreningar och stödföreningar får normalt inte stöd
  - Beviljat stöd regleras i ett ettårigt avtal som anger verksamheten, stödformerna och utbetalningstidpunkterna och följs upp av kommunen
  belopp: Individuellt prövat efter ansökan, dialog och avtal inom kommunens budget; ingen generell beloppsnivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Komplett ansökan ska vara fritidskontoret tillhanda senast 15 september.
