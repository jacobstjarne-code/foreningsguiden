- id: alvkarleby-enskilda-vagar
  namn: Driftbidrag till enskilda vägar
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Vägföreningar som ansvarar för enskilda vägar i Älvkarleby kommun
  deadlines:
    typ: fasta
    datum: [06-30]
  krav:
  - Vägen ska ligga inom Älvkarleby kommun och underhållas så att dess standard inte försämras
  - Vägföreningen ska ha antagna stadgar och en styrelse som utsetts av årsmötet
  - Föreningen ska till varje årsmöte upprätta verksamhetsberättelse med balansräkning, årsmötesprotokoll och budgetförslag
  - Ansökan ska ange föreningens totala väglängd i kommunen, vägarnas namn och innehålla en karta där vägarna markerats
  - Verksamhetsberättelse och budgetförslag för innevarande år ska bifogas ansökan
  - Bidrag lämnas inte till områden med fritidsbebyggelse eller sökande som inte har bildat förening
  belopp: 3 kronor per löpmeter väg
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska ha kommit in senast 30 juni.
