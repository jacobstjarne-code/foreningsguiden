- id: alvkarleby-studieforbundsbidrag
  namn: Kommunalt bidrag till studieförbund
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Statsbidragsberättigade studieförbund med icke-kommersiell verksamhet i Älvkarleby kommun
  deadlines:
    typ: fasta
    datum: [11-15]
  krav:
  - Studieförbundet ska få statsbidrag genom Folkbildningsrådet och ha en självständig ekonomi och ansvarig styrelse
  - Den sökta verksamheten ska uppfylla villkoren för statligt bidrag, genomföras i Älvkarleby kommun och vara icke-kommersiell
  - Ansökan ska ange kontaktperson, behörig uppgiftslämnare, organisationsnummer, utbetalningskonto och en tydlig beskrivning av den planerade verksamheten
  - Studieförbundet ska delta i kommunens dialog och följa de mål och villkor som gäller för det beviljade stödet
  - Årsredovisning eller verksamhetsberättelse, bokslut och revisionsberättelse ska lämnas direkt efter avdelningens årsmöte, senast 30 april
  - Det ska tydligt framgå hur det tidigare kommunala bidraget har använts i Älvkarleby kommun och räkenskaperna ska kunna granskas
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: Samhällsbyggnadsnämnden fastställer årligen ett anslag som prioriteras och fördelas mellan studieförbunden; totalsumman publiceras inte
  sen_ansokan: Ansökan för nästa kalenderår ska lämnas senast 15 november.
