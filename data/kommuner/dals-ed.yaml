- id: dalsed-social-stod
  namn: Föreningsbidrag — Socialnämnden
  kategori:
  - social
  - ovrig
  malgrupp: Ideella föreningar inom socialnämndens område
  deadlines:
    typ: fasta
    datum:
    - 06-22
  krav:
  - Föreningen ska bedriva verksamhet som hjälper personer inom socialnämndens område (äldreomsorg, individ- och familjeomsorg,
    LSS)
  - Föreningen ska vara ideell, ha antagna stadgar, vald styrelse, kontinuerlig verksamhet, årlig medlemsavgift, medlemsregister
    och minst 10 medlemmar (undantag för byalag)
  - Föreningen ska ha sitt säte i Dals-Ed (eller bedriva verksamhet där enligt stadgarna), organisationsnummer, bank-/postgirokonto
    och vara registrerad i kommunens föreningsregister
  - Bidragsmottagande förening ska årligen lämna verksamhetsberättelse, resultat- och balansräkning, revisionsberättelse och
    årsmötesprotokoll
  - Bidrag betalas inte till stödföreningar, supporterklubbar, jaktskytteföreningar, skolidrottsföreningar, föräldraföreningar
    eller föreningar knutna till företag/industrier
  belopp: null
  sen_ansokan: Enligt socialnämndens tidplan
  kalla_url: https://www.dalsed.se/nyheter/nyhetsarkiv-2025/dags-att-soka-foreningsbidrag-av-socialnamnden-i-dals-ed-2025/
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: '2026 års ansökningsdeadline är 22 juni (källa: nyhetsarkiv-2026/dags-att-soka-foreningsbidrag-av-socialnamnden-i-dals-ed-2026/);
    tidigare noterat 23 juni avsåg 2025 års omgång. Exakt datum fastställs årligen via separat annons (maj-juni) och kan variera
    mellan år. Krav baserade på nämndens regelverk fastställt 2017.'
