  krav:
  - Utvecklingsarbetet ska vara hälsofrämjande eller tidigt förebyggande på grupp- eller befolkningsnivå
  - Insatsen ska stödja fullföljda studier, psykisk hälsa eller goda levnadsvanor
  - Medlen får inte finansiera ordinarie verksamhet, om inte verksamheten öppnas för invånargrupper som föreningen inte når i dag
  - Stödet ska avse en långsiktig insats; enstaka aktiviteter godtas bara när de ingår i ett långsiktigt arbete
  - Insatser för ökad jämlikhet i hälsa prioriteras och arbetet ska vara religiöst och partipolitiskt obundet
  - Medlen ska användas under 2026 och ansökan ska lämnas på folkhälsorådets formulär
