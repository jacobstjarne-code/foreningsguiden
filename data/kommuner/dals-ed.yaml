- id: dalsed-hyresbidrag-foreningslokal
  namn: Hyresbidrag till föreningslokal
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Föreningar med nödvändig egen eller externt hyrd föreningslokal
  deadlines:
    typ: fasta
    datum: [05-15]
  krav:
  - Den årliga hyreskostnaden ska överstiga 3 000 kronor och lokalen ska vara nödvändig för verksamhetens art eller omfattning
  - Bidrag till en lokal i en icke-kommunal fastighet beviljas normalt inte om kommunen kan anvisa en lämplig lokal
  - Deltagar- och medlemsavgifter ska vara jämförbara med liknande verksamhet i andra kommuner
  - Minst ett publicerat nyttokriterium ska uppfyllas, exempelvis dokumenterad ungdomsverksamhet, jämställdhet, omfattande pensionärs- eller funktionsrättsverksamhet eller verksamhet som främst gagnar andra än medlemmarna
  - Hyresavtal eller faktura och redovisning av hyra, energi, försäkring, avfall, VA och löpande underhåll ska bifogas
  belopp: Individuellt hyresbidrag; i mycket speciella fall kan högst 100 procent av totalhyran beviljas
  sen_ansokan: Den gemensamma lokalblanketten ska lämnas så snart som möjligt och senast 15 maj
