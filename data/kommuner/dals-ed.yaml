- id: dalsed-anlaggningslokalbidrag
  namn: Driftbidrag till föreningsägd anläggning
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar som äger och driver en fritids- eller föreningsanläggning
  deadlines:
    typ: fasta
    datum: [05-15]
  krav:
  - Föreningen ska äga och driva den anläggning som ansökan avser
  - Anläggningens driftkostnader ska särredovisas från föreningens övriga ekonomi och personalkostnader är inte stödgrundande
  - Föreningens egna insatser, antal barn- och ungdomsaktiviteter samt verksamhetens omfattning ska framgå av redovisningen
  - Verksamhetsberättelse, kassaberättelse, revisionsberättelse och årsmötesprotokoll ska bifogas
  - Bidragsnivån bedöms bland annat efter ungdomsverksamhet, jämställdhet, geografiskt läge, anläggningens bygdenytta, nyttjandegrad och föreningens ekonomi
  belopp: Som utgångspunkt 50 procent av anläggningens driftkostnader exklusive personal; nivån kan höjas eller sänkas enligt publicerade bedömningskriterier
  sen_ansokan: Den gemensamma anläggningsblanketten ska lämnas så snart som möjligt och senast 15 maj
