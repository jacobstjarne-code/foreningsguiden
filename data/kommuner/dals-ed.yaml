- id: dalsed-folkhalsomedel-2026
  namn: Utvecklingsmedel för folkhälsoinsatser 2026
  kategori: [social, funktionsratt, ovrig]
  malgrupp: Lokala föreningar och organisationer som genomför långsiktiga folkhälsoinsatser
  deadlines:
