- id: dalsed-samlingslokalsbidrag
  namn: Årsbidrag till föreningsägd samlingslokal
  kategori: [kultur, ovrig]
  malgrupp: Föreningar som äger och driver en allmän samlingslokal
  deadlines:
    typ: fasta
    datum: [05-15]
  krav:
  - Föreningen ska äga en samlingslokal som Fokusnämnden har klassat som bidragsberättigad
  - Lokalen ska vara en levande och tillgänglig mötesplats för alla åldrar, kunna användas hela året och upplåtas till andra föreningar och enskilda mot skälig hyra
  - Minst 35 externa uthyrningar per år ska redovisas
  - Föreningen ska redovisa föregående års fasta fastighetskostnader och verksamhet samt lämna fullständiga års- och revisionshandlingar
  - Högst 5 000 kronor för löpande underhåll får räknas in i den bidragsgrundande årskostnaden
  belopp: 65 procent av föregående års bidragsgrundande kostnader för el, uppvärmning, försäkring, sophämtning och andra fasta fastighetskostnader
  sen_ansokan: Den gemensamma lokalblanketten ska lämnas så snart som möjligt och senast 15 maj
