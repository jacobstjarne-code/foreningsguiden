- id: dalsed-social-stod
  namn: Socialnämndens föreningsbidrag
  kategori: [social, funktionsratt, pensionar, ovrig]
  malgrupp: Ideella föreningar inom socialnämndens verksamhetsområde
  deadlines:
    typ: fasta
    datum: [06-22]
  krav:
  - Föreningen ska bedriva verksamhet som hjälper personer inom äldreomsorg, individ- och familjeomsorg eller LSS och bidra till kommunens mål
  - Föreningen ska vara ideell, demokratisk och öppen, ha stadgar, vald styrelse, kontinuerlig verksamhet, medlemsavgift och normalt minst tio medlemmar
  - Föreningen ska ha säte eller stadgeenlig verksamhet i Dals-Ed, organisationsnummer, föreningskonto och registrering i kommunens föreningsregister
  - Ansökan ska innehålla verksamhetsbeskrivning, sökt belopp, budget, medlemsuppgifter och uppgifter om andra sökta eller beviljade bidrag
  - Årsmötesprotokoll, verksamhetsberättelse, resultat- och balansräkning samt revisionsberättelse ska lämnas årligen
  - Stöd-, supporter-, skolidrotts- och föräldraföreningar samt föreningar knutna till företag omfattas inte
  belopp: Individuellt beslutat föreningsbidrag; kommunen publicerar ingen generell beloppsnivå
