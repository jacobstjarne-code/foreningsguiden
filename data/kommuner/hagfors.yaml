  deadlines:
    typ: fasta
    datum:
    - 11-15
  krav:
  - Föreningen ska ha säte i Hagfors, godkända stadgar och minst tio aktiva medlemmar
  - Minst 80 procent av medlemmarna och föreningens verksamhet ska finnas i kommunen; medlemsavgiften ska vara minst 50 kr för vuxna och 25 kr för yngre
  - Insatsen ska bland annat vara publik, utveckla föreningens verksamhet, bidra till miljö, besöksnäring eller större evenemang eller marknadsföra Hagfors positivt
  - Ansökan ska beskriva evenemanget, plats och tid, budget med kostnader och intäkter samt andra sökta bidrag
  - Kommunens stöd ska framgå i marknadsföringen; ansökningar över 20 000 kr ska styrkas med styrelsebeslut och firmatecknare
