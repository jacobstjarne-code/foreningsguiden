  - &formalia Föreningen ska vara ideell, ha stadgar som godkänts av riksorganisationen eller kultur- och föreningsutskottet samt bankgiro, plusgiro eller bankkonto i föreningens namn
  - &arsunderlag Ansökan ska innehålla verksamhetsplan och budget för stödåret samt senaste verksamhetsberättelse, ekonomiska berättelse och revisionsberättelse
