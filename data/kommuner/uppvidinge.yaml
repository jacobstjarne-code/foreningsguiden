- id: uppvidinge-aktivitetsstod
  namn: Kommunalt aktivitetsstöd
  status: aktiv
  kategori: [idrott, kultur, pensionar, funktionsratt, ovrig]
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Stödberättigade föreningar med ledarledda aktiviteter för barn och unga 5–25 år, personer med funktionsvariation eller personer 65 år och äldre
  deadlines:
    typ: fasta
    datum: ['02-25', '08-25']
  krav:
  - Aktiviteten ska vara beslutad och planerad av styrelse, sektion, medlemsmöte eller motsvarande och genomföras i föreningens regi
  - Aktiviteten ska pågå minst 45 minuter och ha minst tre deltagare samt högst 20 deltagare per ledare
  - Deltagare 5–9 år får räknas vid högst tre tillfällen per idrott och vecka; deltagare 10–25 år, personer med funktionsvariation och personer 65 år eller äldre får räknas vid högst fem
  - Endast medlemmar får räknas, med undantag för prova-på-tillfällen och liknande
  - Entrébelagda tävlingar, kommersiella arrangemang och studiecirkelsammankomster ger inte stöd
  - Närvaron ska redovisas genom IdrottOnline eller kommunens anvisade e-tjänst för varje halvår
  belopp: Stödnivån per godkänd aktivitet beslutas årligen; någon kronnivå framgår inte av den publicerade riktlinjen eller beslutstexten för 2026
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan för respektive halvår ska lämnas senast 25 februari och 25 augusti
  kalla_url: *norm
