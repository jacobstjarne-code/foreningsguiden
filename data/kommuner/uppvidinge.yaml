- id: uppvidinge-investeringsstod-fritidsforening
  namn: Investeringsstöd till fritidsföreningar
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, friluft, ungdom, annat]
  malgrupp: Fritidsföreningar som utvecklar en egen eller långsiktigt disponerad lokal eller anläggning
  deadlines:
    typ: fasta
    datum: ['09-15']
  krav:
  - Föreningen ska äga lokalen eller anläggningen eller ha ett nyttjanderättsavtal som täcker investeringens minst femåriga användningstid
  - Stödet kan avse reparation, ny-, till- eller ombyggnad, maskiner och inventarier för drift samt i vissa fall verksamhetsspecifik specialutrustning
  - Förbrukningsartiklar är inte stödberättigade och stödet kan inte sökas retroaktivt
  - Föreningen ska söka stöd även från andra bidragsgivare och redovisa finansieringsplan, mål och syfte
  - Barn och unga, inkludering, fysisk tillgänglighet, miljö och energi samt arbetsmiljö prioriteras
  - Projektet ska normalt slutföras inom ett år; högst ett års förlängning kan sökas och kostnader ska styrkas före utbetalning
  belopp: Högst 70 % av investeringens totalkostnad; eget ideellt arbete får räknas som egen finansiering
