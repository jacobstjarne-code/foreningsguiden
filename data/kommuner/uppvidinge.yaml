- id: uppvidinge-ungdomsstyrelse
  namn: Ungdomsstöd till styrelse eller sektion
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar med dokumenterad ungdomsstyrelse eller ungdomssektion
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
