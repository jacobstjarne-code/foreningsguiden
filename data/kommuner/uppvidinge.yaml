  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar som utbildar ledare för sin barn- och ungdomsverksamhet 5–25 år
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska uppfylla kommunens krav för aktivitetsstöd
  - Utbildningen ska avse ledare som arbetar med föreningens barn- och ungdomsverksamhet 5–25 år
  - Kursen ska arrangeras av en riks- eller distriktsorganisation och följa en godkänd kursplan
  - Stöd ges inte för specialkurs som senare ger deltagaren personlig ekonomisk vinning
  - Kursavgift och logi kan räknas som kurskostnad
  - Intyg med deltagare, kursinnehåll, kurskostnader och kvitto för logi ska bifogas
