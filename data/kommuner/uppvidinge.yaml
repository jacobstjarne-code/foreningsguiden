  - Ungdomsstyrelsen eller sektionen ska ha minst tre medlemmar
  - Minst fyra protokollförda möten ska genomföras varje år
  - Föreningen kan få högst ett stöd per år för ungdomsstyrelse eller sektion
  - Stödet ska användas till att utveckla och stimulera föreningens barn- och ungdomsverksamhet
  - Ungdomsstyrelsens egen verksamhetsberättelse och verksamhetsplan ska ingå i årshandlingarna
