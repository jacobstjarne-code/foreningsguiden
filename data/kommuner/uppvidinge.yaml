- id: uppvidinge-driftsstod-lokal-anlaggning
  namn: Driftsstöd till fritidsförenings lokal eller anläggning
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: [idrott, kultur, friluft, ungdom, annat]
  malgrupp: Stödberättigade fritidsföreningar som driver en lokal eller anläggning för främst barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
  - Föreningen ska vara stödberättigad och själv bära en väsentlig del av drift- och investeringskostnaderna
  - Den skäliga delen av kostnaderna bedöms utifrån barn- och ungdomsverksamheten och antalet medlemmar under 25 år
  - Ansökan får omfatta hyra, värme, el, vatten, renhållning, arrende och försäkring
  - Hyresintäkter och andra intäkter från lokalen eller anläggningen ska redovisas
  - Korpförening måste uppfylla de allmänna villkoren och bedriva verksamhet som ger kommunalt aktivitetsstöd
  - Samtliga föreningshandlingar som kommunen kräver ska lämnas med ansökan
  belopp: Skälig del av godkända driftskostnader enligt årligt beslutad stödnivå; någon fullständig 2026-tabell publiceras inte i protokollet
