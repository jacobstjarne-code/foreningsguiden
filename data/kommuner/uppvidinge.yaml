verifierad: '2026-07-31'
bidrag:
- id: uppvidinge-aktivitetsstod
  namn: Aktivitetsstöd
  kategori:
  - idrott
  - ovrig
  malgrupp: Ideella föreningar med bidragsberättigade aktiviteter
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Aktiviteten ska ha minst 3 och max 20 deltagare per ledare och tillfälle, och vara minst 45 minuter lång
  - Deltagare 5–9 år ger stöd för upp till 3 tillfällen per idrott och kalendervecka; deltagare 10–25 år, deltagare med funktionsnedsättning
    samt personer 65 år eller äldre ger stöd för upp till 5 tillfällen per idrott och kalendervecka
  - Aktiviteten ska vara beslutad och planerad av styrelse, sektion, medlemsmöte eller motsvarande och genomföras i föreningens
    regi
  - Endast föreningens medlemmar får räknas som deltagare, med undantag för prova-på-tillfällen
  - Stöd utbetalas inte till entrébelagda tävlingar eller kommersiella arrangemang som matcher, danser, bingo och basarer
  - Stöd utbetalas inte till studiecirkelsammankomster
  belopp: null
  sen_ansokan: Ansökan görs halvårsvis och ska vara inlämnad senast 25 februari respektive 25 augusti. Stödet betalas vanligtvis
    ut före nästa månads slut.
  kalla_url: https://minasidor.uppvidinge.se/oversikt/getflowform/732/530
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
- id: uppvidinge-arrangemangsstod
  namn: Arrangemangsstöd
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Föreningar som genomför evenemang eller arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Arrangemanget ska vara öppet för allmänheten
  - Stöd kan sökas av en förening registrerad i Uppvidinge kommun
  - En förening kan få maximalt 10 000 kronor i stöd under samma kalenderår, med maximalt 25 % av arrangemangets totala kostnad
  - Förening som beviljas kulturföreningsstöd kan inte samtidigt beviljas arrangemangsstöd
  - Stöd ges inte till privata arrangemang
  - Kostnader för förtäring och servering är inte stödgrundande
  - Ansökan ska lämnas senast 45 dagar före arrangemanget och innehålla program samt kostnadskalkyl
  - Förening som beviljas stöd ska anmäla arrangemanget till kommunens evenemangskalender och ange i marknadsföringen att
    stöd erhålls från Uppvidinge kommun
  belopp: Maximalt 10 000 kronor per förening och kalenderår, högst 25 % av arrangemangets totala kostnad
  sen_ansokan: Ansökan görs senast 45 dagar före arrangemanget. Kultur- och fritidsavdelningen beslutar om tilldelning inom
    30 dagar. Redovisning ska ske senast sex veckor efter genomfört arrangemang och stöd betalas ut senast 4 veckor efter
    godkänd redovisning.
  kalla_url: https://minasidor.uppvidinge.se/oversikt/getflowform/732/530
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
- id: uppvidinge-driftsstod-samlingslokal
  namn: Driftsstöd till samlingslokal
  kategori:
  - ovrig
  malgrupp: Föreningar som driver samlingslokaler
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Stödet riktar sig i första hand till föreningar med egen anläggning eller lokal, alternativt ett långsiktigt nyttjanderättsavtal
    på anläggningen eller lokalen
  - Lokalen ska stå till föreningslivets och allmänhetens förfogande
  - Föreningen ska kunna uppvisa att man haft aktiviteter och/eller uthyrning av lokalen, vilket ska framgå av verksamhetsberättelsen
  - Möjligheten för personer med funktionsvariationer att nyttja anläggningen beaktas vid fördelning av stöd
  - Driftstöd kan beviljas med maximalt 70 % av godkända kostnader
  - Driftkostnader som täcks av intäkter från affärsmässig verksamhet, till exempel lägenhets- eller kontorsuthyrning och
    restaurangverksamhet, får inte räknas som driftkostnad och ska redovisas separat
  - Stöd ges inte till lokal som omfattas av stöd till fritidsföreningar
  belopp: Maximalt 70 % av godkända kostnader
  sen_ansokan: Ansökan görs senast 31 mars för innevarande år och baseras på föregående års redovisning samt verksamhetsplan
    för innevarande år. Verksamhetsberättelse, ekonomisk redovisning, revisionsberättelse och specifikation över lokalens
    nyttjande ska bifogas.
  kalla_url: https://minasidor.uppvidinge.se/oversikt/getflowform/732/530
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ej angivet i källan
