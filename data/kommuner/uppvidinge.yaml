  namn: Lokalstöd till fritidsförening för hyrd lokal eller anläggning
  status: aktiv
  kategori: [idrott, kultur, pensionar, funktionsratt, ovrig]
  foreningstyp: *allatyper
  malgrupp: Stödberättigade föreningar som hyr en icke-kommunal lokal eller anläggning i Uppvidinge kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara stödberättigad i Uppvidinge kommun
  - Lokalen eller anläggningen ska ligga i Uppvidinge kommun och både lokalen och kostnaden ska godkännas av kultur- och föreningsutskottet
  - Stöd ges inte för kommunala lokaler eftersom deras hyra redan är subventionerad
  - Barn- och ungdomsverksamhet samt rörelse och fysisk hälsa för personer med funktionsvariation eller personer 65 år och äldre prioriteras
  - Kvitton, hyresavtal eller motsvarande underlag som visar de faktiska kostnaderna ska bifogas
  belopp: Högst 50 % av hyran eller den del som utskottet bedömer skälig, maximalt 10 000 kr per förening och verksamhetsår
