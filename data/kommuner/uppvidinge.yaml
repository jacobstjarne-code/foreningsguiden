- id: uppvidinge-studieforbund
  namn: Grundstöd till studieförbund
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Statsbidragsberättigade studieförbund med dokumenterad folkbildnings- och kulturverksamhet i Uppvidinge kommun
  deadlines:
    typ: fasta
    datum: ['03-31']
  krav:
  - Studieförbundet ska uppfylla Folkbildningsrådets grundläggande, organisatoriska och verksamhetsmässiga villkor
  - Det kommunala stödet ska användas för verksamhet i Uppvidinge kommun och för kommunens invånare
  - Organisationen ska vara demokratiskt styrd, följa diskrimineringsgrunderna och förankra mänskliga rättigheter och jämställdhet
  - Verksamheten ska vara öppen och tillgänglig för alla
  - Barn- och ungdomsverksamhet ska följa barnkonventionen och berörda medarbetare ska kunna visa registerutdrag
  - Studietimmar, unika deltagare och hur verksamheten uppfyller kommunens prioriterade kriterier ska redovisas för föregående år
  belopp: null
  belopp_avser: ren_pott
