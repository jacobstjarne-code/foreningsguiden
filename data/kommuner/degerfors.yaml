  - Avtalet ska avse föreningens skötsel och nyttjanderätt av en kommunal anläggning eller kommunens rätt att nyttja en anläggning som föreningen äger
  - Ett separat skriftligt avtal ska upprättas mellan kommunen och föreningen och undertecknas av båda parter
  - Avtalets längd och parternas överenskomna åtaganden ska framgå
  - Ansökan ska innehålla verksamhetsplan, budget och senaste verksamhets-, ekonomi- och revisionshandlingar och vara komplett senast den 15 april
  belopp: Stödets innehåll och ekonomiska värde regleras i det separata avtalet; ingen generell nivå publiceras
