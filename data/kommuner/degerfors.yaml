  namn: Specialbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för särskilda projekt och arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Projekt eller arrangemang med specifik syftesbeskrivning
  - Ansökan via e-tjänstportal löpande
  - Föreningen ska uppfylla kommunens allmänna grundvillkor för bidragsberättigande (godkända stadgar, registrerat organisationsnummer,
    registrering i föreningsregistret, ingen skuld till kommunen, drogfri och demokratisk verksamhet)
  - Bidraget kan även beviljas till en nystartad förening
  belopp: null
  sen_ansokan: Möjlig löpande
