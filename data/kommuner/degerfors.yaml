- id: degerfors-lokalsubvention
  namn: Lokalsubvention och nolltaxa
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade föreningar med behov av kommunal lokal eller godkänd samlingslokal
  deadlines:
    typ: fasta
    datum: [04-15]
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor om stadgar, organisationsnummer, föreningsregister, lokal anknytning, demokrati, öppenhet och drogfri verksamhet
  - Stödet ska avse föreningens behov av en lokal avsedd för uthyrningsverksamhet eller en godkänd samlingslokal
  - Ansökan ska göras en gång per kalenderår och ett godkännande gäller endast innevarande kalenderår
  - Efter godkänd ansökan får verksamheten boka valfri ledig godkänd samlingslokal under det kalenderåret
  - Den årliga ansökan ska vara komplett senast den 15 april
  belopp: Lägre hyreskostnad eller nolltaxa för uthyrningslokal eller godkänd samlingslokal
