  anteckning: Stödet kan även beviljas en nystartad förening.
- id: degerfors-forlustback
  namn: Förlusttäckningsgaranti
  status: aktiv
  kategori:
  - kultur
  - idrott
  - ovrig
  foreningstyp: *allatyper
  malgrupp: Föreningar som genomför ett särskilt arrangemang med ekonomisk risk
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Garantin ska avse en möjlig ekonomisk förlust i samband med ett specificerat arrangemang
  - Både arrangemanget och förlusttäckningsgarantin ska godkännas av kommunen i förväg
  - Föreningen ska uppfylla kommunens allmänna villkor om stadgar, organisationsnummer, föreningsregister, lokal anknytning, demokrati, öppenhet och drogfri verksamhet
  - Ansökan ska beskriva arrangemanget och dess ekonomi och lämnas genom kommunens särskilda e-tjänst
  belopp: Ekonomisk garanti för den eventuella förlust som kommunen godkänner i förväg; ingen generell maxnivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan kan lämnas löpande men måste godkännas före arrangemanget
  kalla_url: *special
  belopp_status: ingen_regel
