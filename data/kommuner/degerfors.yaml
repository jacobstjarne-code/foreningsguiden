  namn: Utbildningsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade föreningar som utbildar medlemmar och ledare
  deadlines:
    typ: fasta
    datum: [04-15]
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor om stadgar, organisationsnummer, föreningsregister, lokal anknytning, demokrati, öppenhet och drogfri verksamhet
  - Utbildningen ska avse föreningens medlemmar, exempelvis ungdomsledare eller personer med styrelsefunktioner
  - Kommunen ska ha godkänt utbildningen innan den genomförs
  - Ansökan ska innehålla verksamhetsplan och budget samt senaste verksamhets-, ekonomi- och revisionshandlingar
  - Ansökan ska vara komplett och undertecknad av ordförande och kassör senast den 15 april
