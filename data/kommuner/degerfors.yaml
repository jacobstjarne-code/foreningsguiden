bidrag:
- id: degerfors-verksamhetsbidrag
  namn: Årligt verksamhetsbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar med planerad verksamhet under kalenderåret
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen ska ha godkända stadgar, registrerat organisationsnummer, vara registrerad i kommunens föreningsregister och inte ha en oreglerad skuld till kommunen
  - Verksamheten ska bygga på demokratiska grunder, vara öppen för alla som följer stadgarna och bedrivas fri från alkohol, narkotika, dopning och tobak
  - Verksamheten och merparten av medlemmarna ska finnas i Degerfors kommun; undantag kan göras för verksamhet som bedrivs tillsammans med andra kommuner
  - Föreningen ska tillhöra en publicerad stödberättigad grupp, exempelvis barn- och ungdomsförening, kultur- eller hembygdsförening, social eller etnisk förening, studieförbund eller uppdragsförening
  - Barn- och ungdomsförening ska ha minst 10 regelbundet deltagande medlemmar 6–25 år och kunna visa belastningsregisterutdrag för samtliga barn- och ungdomsledare på kommunens begäran
  - Föreningen ska ha beviljats startbidrag i två omgångar innan årligt verksamhetsbidrag kan erhållas
  - Ansökan ska innehålla verksamhetsplan och budget, verksamhetsberättelse, ekonomisk berättelse och revisionsberättelse
    från senaste årsmötet, komplett ifylld och undertecknad av ordförande och kassör
  belopp: Individuellt kontantbidrag som bedöms utifrån verksamhetens omfattning, ekonomiska ställning, verksamhetsplan, budget och övrigt offentligt stöd; ingen generell nivå publiceras
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ofullständig eller senare inkommen ansökan behandlas inte för innevarande kalenderår
  kalla_url: &norm https://degerfors.se/download/18.594fd2b416073aa95fe7cf/1516349433611/Riktlinje%20f%C3%B6reningsst%C3%B6d%20i%20Degerfors%20kommun.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Verksamhetsbidraget ska ge föreningen grundtrygghet under verksamhetsåret.
- id: degerfors-startbidrag
  namn: Startbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  foreningstyp: *allatyper
  malgrupp: Nya föreningar under de två första bidragsomgångarna
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen ska vara ny och uppfylla kommunens allmänna villkor om stadgar, organisationsnummer, föreningsregister, lokal anknytning, demokrati, öppenhet och drogfri verksamhet
  - Barn- och ungdomsförening ska ha minst 10 regelbundet deltagande medlemmar 6–25 år och kunna visa belastningsregisterutdrag för ledarna på kommunens begäran
  - Startbidrag ska beviljas i två omgångar innan föreningen kan övergå till årligt verksamhetsbidrag
  - Ansökan ska innehålla verksamhetsplan och budget samt de verksamhets-, ekonomi- och revisionshandlingar som finns tillgängliga för föreningen
  - Ansökan ska vara komplett och undertecknad av ordförande och kassör senast den 15 april
  belopp: Individuellt bedömt startbidrag; kommunen publicerar ingen generell beloppsnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ofullständig eller senare inkommen ansökan behandlas inte för innevarande kalenderår
  kalla_url: *huvud
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Startbidraget utgör de två första bidragsomgångarna före årligt verksamhetsbidrag.
- id: degerfors-specialbidrag
  namn: Specialbidrag
  status: aktiv
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade eller nystartade föreningar med ett särskilt arrangemang, projekt eller aktivitet
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Ansökan ska avse ett specificerat arrangemang, projekt eller en aktivitet
  - Sökanden ska vara en bidragsberättigad förening eller en nystartad förening
  - Föreningen ska uppfylla kommunens allmänna villkor om stadgar, organisationsnummer, föreningsregister, lokal anknytning, demokrati, öppenhet och drogfri verksamhet
  - Ansökan ska beskriva ändamålet och lämnas genom kommunens särskilda e-tjänst
  belopp: Individuellt bedömt särskilt bidrag; kommunen publicerar ingen generell beloppsnivå
