  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Verifierat mot kommunens riktlinje för föreningsstöd (KF § 41/2017-06-19, dnr KS 262-2016), avsnitt 4.5 'Särskilt
    bidrag'. Ansökan kan lämnas löpande under året. Ingen fast beloppsregel — beviljas efter kommunens bedömning.
- id: degerfors-forlustback
  namn: Förlusttäckning / Arrangemangsbidrag
  kategori:
  - kultur
  - idrott
  malgrupp: Föreningar för evenemang med ekonomisk risk
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Arrangemanget måste ha dokumenterad ekonomisk risk
  - Budgetförslag och risk-analys krävs
  - Ansökan via e-tjänst löpande
  - Både arrangemanget och förlusttäckningsgarantin ska vara godkända av kommunen i förväg
  - Föreningen ska uppfylla kommunens allmänna grundvillkor för bidragsberättigande
  belopp: null
  sen_ansokan: Möjlig löpande
  kalla_url: https://www.degerfors.se/uppleva-och-gora/foreningar-och-foreningsstod
  belopp_status: ingen_regel
