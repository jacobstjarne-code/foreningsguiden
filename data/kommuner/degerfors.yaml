  krav_fullstandiga: true
  anteckning: Verifierat mot kommunens riktlinje för föreningsstöd (KF § 41/2017-06-19, dnr KS 262-2016), avsnitt 4.6 'Förlusttäckningsgaranti'.
    Arrangemang och garanti ska godkännas av kommunen i förväg. Ansökan löpande under året. Ingen fast beloppsregel.
- id: degerfors-kulturbidrag
  namn: Kulturbidrag
  kategori:
