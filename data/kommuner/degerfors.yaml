  anteckning: Kommunfullmäktige fastställde den nuvarande årsvisa nolltaxeregeln 2023-06-12 § 76.
- id: degerfors-skotsel-och-nyttjanderattsavtal
  namn: Skötsel- och nyttjanderättsavtal
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *allatyper
  malgrupp: Bidragsberättigade föreningar som sköter eller upplåter en anläggning
  deadlines:
