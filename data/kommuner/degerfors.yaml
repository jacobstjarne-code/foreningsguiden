  malgrupp: Kulturföreningar och studieförbund
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Kulturverksamhet ska bedras i Degerfors
  - Dokumentation av kulturell verksamhet krävs
  - Ansökan mellan 15 mars och 15 april
  - 'Föreningen ska klassas som kulturförening: förening som genomför kulturarrangemang och/eller aktiviteter samt hembygdsförening'
  - Föreningen ska uppfylla kommunens allmänna grundvillkor (godkända stadgar, registrerat organisationsnummer, registrering
    i föreningsregistret, ingen skuld till kommunen, drogfri och demokratisk verksamhet)
  - Ansökan ska innehålla verksamhetsplan, budget, verksamhetsberättelse, ekonomisk berättelse och revisionsberättelse från
    senaste årsmötet
