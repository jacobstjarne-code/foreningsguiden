bidrag:
- id: degerfors-verksamhetsbidrag
  namn: Årligt verksamhetsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Etablerade föreningar för årlig verksamhet
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen måste ha mottagit startbidrag två gånger innan årligt stöd kan erhållas
  - Verksamheten ska bedras i Degerfors kommun
  - Ansökan med bilagor måste lämnas in senast 15 april
  - Föreningen ska ha godkända stadgar
  - Föreningen ska bedriva verksamhet fri från alkohol, narkotika, dopning och tobak, på demokratiska grunder
  - Föreningen ska ha registrerat organisationsnummer hos Skatteverket och vara registrerad i kommunens föreningsregister
  - Föreningen får inte ha skuld till kommunen vid ansökningstillfället
  - Ansökan ska innehålla verksamhetsplan och budget, verksamhetsberättelse, ekonomisk berättelse och revisionsberättelse
    från senaste årsmötet, komplett ifylld och undertecknad av ordförande och kassör
  belopp: null
  sen_ansokan: Ej möjlig efter 15 april
  kalla_url: https://www.degerfors.se/uppleva-och-gora/foreningar-och-foreningsstod
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'Ansökningsperiod: 15 mars – 15 april. Verifierat mot kommunens riktlinje för föreningsstöd (KF § 41/2017-06-19,
    dnr KS 262-2016): bidraget baseras på individuell helhetsbedömning (verksamhetens omfattning, ekonomi, plan och budget)
    — ingen fast beloppsregel finns.'
- id: degerfors-startbidrag
  namn: Startbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Nya eller växande föreningar
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Föreningen måste vara etablerande eller växa
  - Maximalt två gånger innan övergång till årligt bidrag
  - Ansökan via e-tjänst mellan 15 mars och 15 april
  - Föreningen ska ha godkända stadgar, registrerat organisationsnummer hos Skatteverket och vara registrerad i kommunens
    föreningsregister
  - Föreningen ska bedriva verksamhet fri från alkohol, narkotika, dopning och tobak, på demokratiska grunder
  - Föreningen får inte ha skuld till kommunen vid ansökningstillfället
  - Ansökan ska innehålla verksamhetsplan och budget samt övriga begärda handlingar från senaste årsmötet, komplett ifylld
    och undertecknad av ordförande och kassör
  belopp: null
  sen_ansokan: Ej möjlig efter 15 april
  kalla_url: https://www.degerfors.se/uppleva-och-gora/foreningar-och-foreningsstod
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'Steg mot årligt verksamhetsbidrag. Verifierat mot kommunens riktlinje för föreningsstöd (KF § 41/2017-06-19,
    dnr KS 262-2016): bidraget baseras på individuell helhetsbedömning — ingen fast beloppsregel finns.'
