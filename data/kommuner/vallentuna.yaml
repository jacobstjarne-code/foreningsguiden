- id: vallentuna-aktivitetsbidrag
  namn: Aktivitetsbidrag
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar med minst 15 bidragsberättigade medlemmar (barn/unga 7-20 år samt personer med funktionsnedsättning
    oavsett ålder) folkbokförda i Vallentuna kommun
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  deadlines:
    typ: fasta
    datum:
    - 08-25
    - 02-25
  krav:
  - Minst 15 bidragsberättigade medlemmar folkbokförda i Vallentuna kommun
  - Minst 10 redovisade sammankomster under ansökningsperioden (20/år totalt)
  - Sammankomsten ska pågå minst 45 minuter, vara ledarledd med minst tre deltagare utöver ledaren
  - Närvarokort med personnummer förs vid varje sammankomst, registreras i e-tjänsten för aktivitetsstöd
  - Bidrag beviljas inte till entrébelagda tävlingar, kommersiella arrangemang, styrelsemöten eller liknande
  - Föreningen ska via webben hålla uppgifterna i föreningsregistret aktuella och ha status 'godkänd'
  belopp: Fast grundbidrag per sammankomst samt ersättning per deltagare, maximalt 30 deltagare inklusive ledare; nivåerna fastställs årligen
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.vallentuna.se/fritid-och-kultur/foreningar-och-foreningsliv/bidrag-och-stod/aktivitetsbidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan för perioden 1 jan-30 jun lämnas senast 25 augusti; för 1 jul-31 dec senast 25 februari påföljande år.
    Bidraget består av en fast del per sammankomst och en rörlig del per deltagare (max 30 deltagare inkl. ledare), belopp
    fastställs årligen av fritidsnämnden. Idrottsföreningar anslutna till specialidrottsförbund kan även söka LOK-stöd direkt
    från RF.
  senast_verifierad: '2026-08-18'
