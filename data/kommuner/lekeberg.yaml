  krav:
  - Föreningen ska ha stadgar, styrelse och organisationsnummer samt ha sitt säte i och bedriva verksamhet i Lekebergs kommun
  - Anläggningen ska vara belägen i kommunen, användas för barn-/ungdomsverksamhet och skötas och underhållas av föreningen
  - Föreningen ska följa de krav för utövning och säkerhet som ställs av myndigheter och riksorganisationer
  - Ansökan ska bygga på föreningens faktiska drift- och underhållskostnader föregående kalenderår
  - Bidrag kan som mest utbetalas för en föreningslokal A och fem övriga objekt, enligt kommunens objektstabell
  - Förening som har separat avtal om skötsel av kommunal anläggning kan inte söka skötselbidrag för samma anläggning
  belopp: 'Maxbelopp per objektstyp och år: föreningslokal A 25 000 kr, B 13 000 kr, C 10 000 kr, D 5 000 kr, E 1 000 kr;
