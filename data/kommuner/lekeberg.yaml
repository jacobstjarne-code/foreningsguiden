  krav:
  - Föreningen ska ha sin huvudsakliga verksamhet i Lekebergs kommun, uppfylla kommunens villkor för bidrag och ställa sig
    bakom värdegrunden
  - Bidrag för samma arrangemang kan sökas högst tre gånger, därefter bedöms det som drift av verksamhet
  - Arrangemanget ska vara nytt eller ha nytt innehåll (inte redan pågående/återkommande drift), vara öppet för alla (åldersgräns
