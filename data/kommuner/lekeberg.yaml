  krav:
  - Sökande ska vara en lokal ideell förening med egen lokal som fungerar som samlingsplats för trakten (gäller inte traditionella
    hembygdsgårdar, museer, kyrkor eller kyrkolokaler)
  - Verksamheten ska i huvudsak bedrivas ideellt, ha bredd, vara tillgänglig för olika målgrupper och äga rum under hela året
  - Föreningen ska följa kommunens allmänna villkor för bidrag samt bifoga sedvanliga föreningshandlingar och årsplanering
    för verksamheten
  - Föreningar som söker skötselbidrag för idrottsanläggningar kan inte samtidigt söka detta bidrag
  - Bidrag kan endast sökas för innevarande kalenderår, och en rapport med uppföljning av föreningens verksamhet och ekonomi
