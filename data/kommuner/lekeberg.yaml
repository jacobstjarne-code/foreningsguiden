  - Sammankomsten ska vara planerad och genomförd, omfatta minst 45 minuter och ha minst tre deltagande bidragsberättigade
    medlemmar (6–25 år)
  - Bidrag för samma medlem utgår för högst en sammankomst per dag i samma förening
