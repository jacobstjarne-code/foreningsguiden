  krav:
  - Föreningen ska ha stadgar, styrelse och organisationsnummer samt ha sitt säte i och bedriva verksamhet i Lekebergs kommun
  - Sammankomsten ska vara planerad och genomförd, omfatta minst 45 minuter och ha minst tre deltagande bidragsberättigade medlemmar
  - Barn- och ungdomsstödet avser medlemmar 6–25 år; kommunen beslutar även återkommande om aktivitetsbidrag för deltagare 65 år och äldre enligt samma redovisningsperioder
  - Bidrag för samma medlem utgår för högst en sammankomst per dag i samma förening
  - Ledare/ansvarig för sammankomsten ska under kalenderåret vara 13–25 år för att bidrag ska utgå även för ledaren
  - Föreningen ska föra närvarokort med föreningens namn, aktivitet, plats, datum, tid samt deltagares och ledares namn, födelsedatum
    och närvaro, undertecknat av ansvarig ledare
  - Årsmötesprotokoll och årsredovisning ska bifogas ansökan
  belopp: 45 kr per genomförd sammankomst
