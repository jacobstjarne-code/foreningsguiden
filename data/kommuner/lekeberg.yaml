  krav:
  - Föreningen ska ha sin huvudsakliga verksamhet i Lekebergs kommun, ha stadgar, styrelse och organisationsnummer samt ha
    sitt säte i kommunen
  - Föreningen ska uppfylla kommunens villkor för bidrag och ställa sig bakom de gemensamma värderingarna
  - Bidraget ska avse utveckling av föreningens egen verksamhet (t.ex. långsiktiga satsningar, samverkan eller utbildning)
    eller ett nyskapande enstaka arrangemang med tydlig uppmärksamhetseffekt – inte inköp av material
  - Bidrag kan inte sökas för redan genomförda projekt
  - I ansökan ska framgå hur föreningen avser finansiera projektet om inte hela det sökta beloppet beviljas
  - Vid inställt utvecklingsprojekt ska hela bidraget återbetalas
