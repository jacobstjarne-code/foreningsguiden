- id: lekeberg-sponsring
  namn: Sponsring av idrotts- och kulturarrangemang
  status: aktiv
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: *allatyper
  malgrupp: Föreningar och organisationer som genomför publika idrotts- eller kulturarrangemang med stort genomslag
  deadlines:
    typ: okand
    datum: []
  krav:
  - Sponsringen ska avse ett idrotts- eller kulturarrangemang som bedöms dra stor publik och stärka bilden av Lekebergs kommun
  - Samarbetet ska vara affärsmässigt, objektivt och bygga på en motprestation vars värde står i rimlig proportion till kommunens insats
  - Vid sponsring av en arena eller lokal ska allmänheten ha tillträde till verksamheten eller arrangemanget
  - Sponsringen får avse marknadsföring av kommunen men får inte utformas så att kommunens oberoende eller trovärdighet kan ifrågasättas
  - Villkoren, parternas prestationer och sponsringens omfattning ska regleras i ett skriftligt avtal
  - Om arrangemanget ställs in eller organisationen upphör kan kommunen kräva tillbaka hela eller delar av stödet
  belopp: Individuellt avtalad sponsringsinsats; kommunen publicerar ingen generell beloppsnivå
