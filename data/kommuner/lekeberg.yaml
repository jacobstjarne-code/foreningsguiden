    datum: []
  krav:
  - Föreningen eller studieförbundet ska boka en lokal eller anläggning som kommunen hyr ut genom lokalbokningen
  - Lägsta taxan gäller lokala föreningars verksamhet för 0–25 år och studieförbunds verksamhet som huvudsakligen riktas till samma åldersgrupp
  - Lägsta taxan gäller även föreningar för personer med funktionsnedsättning och pensionärsföreningar med säte i Lekebergs kommun
  - Reducerad taxa gäller lokala föreningars verksamhet för deltagare från 26 år och studieförbunds verksamhet som huvudsakligen riktas till den åldersgruppen
  - Bokningen ska följa kommunens regler för ansvar, avbokning, nycklar, ordning och användning av lokalen eller anläggningen
  belopp: Subvention genom lägsta eller reducerad kommunal taxa beroende på föreningstyp och deltagarnas ålder
