- id: karlsborg-aktivitetsbidrag
  namn: Aktivitetsbidrag
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  malgrupp: Bidragsberättigade föreningar med ledarledd idrotts-, fritids- eller kulturverksamhet för 6–25-åringar, personer från 65 år eller personer med funktionsnedsättning
  deadlines: {typ: fasta, datum: [02-25, 08-25]}
  krav:
  - Föreningen ska ha fler än tio medlemmar och bedriva kontinuerlig verksamhet
  - Sammankomsten ska vara ledarledd, pågå minst 60 minuter och ha 3–30 deltagare i stödberättigad ålder
  - Ledaren ska vara minst 13 år, närvarande och får inte ansvara för flera grupper samtidigt
  - En deltagare får räknas högst en gång per dag och verksamhet i samma förening; vid tävling räknas endast den egna föreningens deltagare
  - Aktiviteten ska anordnas av den lokala föreningen, följa verksamhetsidén och innehålla gemensam samling och avslutning
  - Entrébelagda tävlingar, kommersiella arrangemang och studieförbundsverksamhet är inte stödberättigade
  belopp: 'Riktvärde per deltagartillfälle: 12 kr för 6–25 år, 8 kr från 65 år och 12 kr för personer med funktionsnedsättning oavsett ålder; nivåerna kan justeras efter anslag och ansökningsutfall'
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: För sent inkommen ansökan behandlas inte
