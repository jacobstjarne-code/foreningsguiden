  namn: Evenemangsbidrag
  foreningstyp: *alla
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar och organisationer som ordnar offentliga idrotts-, fritids- eller kulturevenemang i Karlsborg
  deadlines: {typ: relativ, datum: []}
  krav:
  - Evenemanget ska vara offentligt och bidra till ett varierat utbud som gynnar Karlsborgs invånare och besökare
  - Sökanden ska vara verksam i Karlsborgs kommun och uppfylla kommunens demokrati-, allmännytte- och organisationskrav
  - Ansökan ska lämnas i Rbok minst sex veckor före evenemanget
  - Karlsborgs kommun ska anges som samarbetspartner eller bidragsgivare i marknadsföringen
  - Beviljat och nyttjat bidrag ska redovisas i Rbok senast tre månader efteråt innan en ny utbetalning kan ske
