- id: karlsborg-kulturbidrag
  namn: Verksamhetsbidrag till kulturverksamheter med stor allmännytta
  foreningstyp: [kultur, hembygd, annat]
  kategori: [kultur]
  malgrupp: Kulturföreningar och andra organisationer med säte och verksamhet i Karlsborg som erbjuder ett brett, offentligt kulturutbud
  deadlines: {typ: fasta, datum: [09-01]}
  krav:
  - Verksamheten ska vara öppen för allmänheten, nå en bred publik och ha dokumenterat allmänintresse för kommunen
  - Verksamheten ska stödja kulturaktiviteter och mötesplatser samt främja delaktighet, lärande och skapande för barn, unga och vuxna
  - Sökanden ska vara verksam och ha sitt säte i Karlsborgs kommun
  - Årsmöteshandlingarna ska årligen visa verksamhetens omfattning, deltagande och allmännytta
  - Ett flerårigt stöd förutsätter att verksamheten fortsatt uppfyller villkoren och visar dokumenterat mervärde; ny prövning görs efter högst tre år
