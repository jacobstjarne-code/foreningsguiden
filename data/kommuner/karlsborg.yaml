- id: karlsborg-socialnamndens-foreningsstod
  namn: Ekonomiskt stöd till föreningar och förbund från socialnämnden
  foreningstyp: [social, annat]
  kategori: [social, funktionsratt, ovrig]
  malgrupp: Föreningar med lokal anknytning vars verksamhet gynnar Karlsborgs invånare inom socialnämndens prioriterade områden
  deadlines: {typ: okand, datum: []}
  krav:
  - Föreningen ska ha lokal anknytning till Karlsborg och verksamheten ska på något sätt kunna gynna kommunens invånare
  - Verksamheten ska värna om barn och barns rättigheter, eller värna om och hjälpa personer som utsatts för våld, övergrepp eller andra utsatta situationer
  - Stöd kan också ges till verksamhet som hjälper och utbildar adopterade barn och blivande adoptionsföräldrar
  - Minst ett av socialnämndens tre publicerade ändamålskriterier ska vara uppfyllt
