- id: laxa-kommunalt-vagbidrag
  namn: Kommunalt bidrag till enskild väg med statligt driftbidrag
  kategori: [ovrig]
  malgrupp: Väg-, samfällighets- och ideella föreningar samt andra väghållare som får statligt driftbidrag
  deadlines:
    typ: okand
    datum: []
  krav:
  - Väghållaren kan vara en vägförening, vägsamfällighet, samfällighetsförening, ideell förening eller privatperson
  - Trafikverket ska ha beviljat statligt driftbidrag för den enskilda vägen
  - Vägen ska hållas öppen för allmän trafik året runt och får inte stängas med bom, vägmärke eller liknande
