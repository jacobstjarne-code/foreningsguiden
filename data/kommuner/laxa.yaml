- id: laxa-sydnarkebidrag
  namn: Sydnärkebidrag
  kategori: [funktionsratt, social]
  malgrupp: Föreningar för personer med funktionsvariation som verkar i minst två Sydnärkekommuner
  deadlines:
    typ: fasta
    datum: [05-01]
  krav:
  - Föreningen ska bedriva verksamhet i minst två av Askersund, Hallsberg, Kumla och Laxå och ha sitt säte i någon av kommunerna
  - Föreningen ska normalt tillhöra en riksorganisation, vara demokratiskt uppbyggd och öppen för alla som vill stödja ändamålet; undantag från riksorganisationskravet kan beviljas
  - Föreningen ska ha egen ekonomi med medlemsavgifter, organisationsnummer och bank- eller plusgiro samt uppge stöd från andra bidragsgivare
  - Verksamhetsberättelse, ekonomisk redovisning, årsmötesprotokoll, medlemsregister och vid behov stadgar ska bifogas
  - Ansökan ska redovisa kostnader för lokal, personal, utbildning och information
  belopp: Kommunerna beslutar beloppet gemensamt efter prövning; ingen generell individuell nivå publiceras
  sen_ansokan: Senast 1 maj före utbetalningsåret; ansökan avser verksamhet som genomfördes föregående år
  kalla_url: https://www.kumla.se/uppleva-och-gora/foreningar/bidrag/sydnarkebidrag.html
