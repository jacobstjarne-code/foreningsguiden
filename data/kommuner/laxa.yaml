- id: laxa-kurs-och-lagerbidrag
  namn: Kurs- och lägerbidrag
  kategori: [idrott, kultur, funktionsratt, ovrig]
  malgrupp: Bidragsberättigade föreningar som genomför kurs eller läger för sin verksamhet
  deadlines:
    typ: fasta
    datum: [12-15]
  krav:
  - Föreningen ska vara registrerad och omfattas av kommunens grundbidrag för verksamhet 4–25 år eller för personer med funktionsvariation
  - Kurs eller läger får genomföras på hemmaplan och föreningen bestämmer själv hur den beviljade ramen fördelas mellan kurs och läger
  - Ansökan ska lämnas så snart som möjligt efter genomförandet och innehålla kursprogram underskrivet av kursledaren
  - Deltagarförteckning och ekonomisk redovisning med kvitton eller motsvarande underlag ska bifogas
  - Huvudstyrelsens ordförande eller kassör ska söka och föreningen ska lämna den redovisning kommunen begär vid revision
  belopp: 100 procent av kostnaden inom en ram på 5 kronor per aktivitetstillfälle, dock lägst 850 kronor och högst 10 000 kronor per förening och år
  sen_ansokan: Så snart som möjligt efter genomförd kurs eller läger, senast 15 december
  kalla_url: https://www.laxa.se/download/18.9e9341817f9775950bee10/1647596093404/Bidragsregler%201%20januari%202022.pdf
