- id: laxa-subventionerad-foreningstaxa
  namn: Subventionerad föreningstaxa i kommunala idrottshallar
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar i Laxå kommun som bokar kommunens idrottshallar och gymnastiksalar
  deadlines:
    typ: okand
    datum: []
  krav:
  - Sökanden ska vara en förening i Laxå kommun för att få den särskilda föreningstaxan
  - En preliminär bokning blir giltig först när kommunen har bekräftat förfrågan
  - Ansvarig bokare ska vara över 18 år
  - Hallarna är bokningsbara september–maj och nya kunder rekommenderas att boka minst tre arbetsdagar i förväg
  belopp: Föreningstaxa 65 kronor per timme i Laxå-Hallen och Hasselfors sporthall samt 52 kronor per timme i Saltängsskolans och Finnerödja skolas gymnastiksalar; ordinarie taxor är 300 respektive 150 kronor per timme
  sen_ansokan: Ingen sista ansökningsdag publiceras; bokning görs löpande och bör lämnas minst tre arbetsdagar i förväg för nya kunder
