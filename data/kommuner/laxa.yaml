- id: laxa-medlemsbidrag
  namn: Medlemsbidrag
  kategori: [idrott, kultur, funktionsratt, ovrig]
  malgrupp: Registrerade föreningar med regelbundet aktiva medlemmar 4–25 år eller medlemmar med funktionsvariation
  deadlines:
    typ: fasta
    datum: [08-31]
  krav:
  - Medlemmen ska vara registrerad i föreningen, uppfylla stadgarnas medlemskrav och regelbundet delta i verksamheten
  - Bidragsberättigad ålder är 4–25 år; verksamhet för personer med funktionsvariation omfattas också av kommunens grundbidrag
  - Föreningen ska vara lokalt registrerad eller särskilt godkänd av kommunstyrelsen
  - Ansökan ska lämnas av huvudstyrelsens ordförande eller kassör
  - Verksamhets- och revisionsberättelse samt årsmötesprotokoll ska vara aktuella i föreningsregistret
  belopp: 25 kronor per medlem för medlem 1–200, 15 kronor per medlem för medlem 201–400 och 5 kronor per medlem från medlem 401
