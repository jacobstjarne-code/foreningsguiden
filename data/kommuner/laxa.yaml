  namn: Aktivitetsbidrag
  kategori: [idrott, kultur, funktionsratt, ovrig]
  malgrupp: Registrerade föreningar med aktiviteter för barn och unga 4–25 år eller personer med funktionsvariation
  deadlines:
    typ: fasta
    datum: [08-31]
  krav:
  - Sökanden ska vara en lokal organisation registrerad som förening i Laxå kommun eller en förening som kommunstyrelsen särskilt har beslutat ska omfattas
  - Bidraget avser verksamhet för barn och unga 4–25 år samt personer med funktionsvariation
  - Minst tre medlemmar i bidragsberättigad ålder ska delta vid varje aktivitetstillfälle
  - Ansökan ska lämnas av föreningens huvudstyrelse genom ordförande eller kassör
  - Senaste verksamhetsberättelse, revisionsberättelse och årsmötesprotokoll ska finnas i föreningsregistret vid ansökan
  belopp: 23 kronor per aktivitetstillfälle
  sen_ansokan: Senast 31 augusti via föreningswebben; kommunen publicerar ingen särskild senregel
