- id: laxa-finskt-forvaltningsomrade
  namn: Bidrag för projekt och aktiviteter inom finskt förvaltningsområde
  kategori: [kultur, social, ovrig]
  malgrupp: Föreningar och organisationer med projekt som främjar den sverigefinska minoritetens språk och kultur
  deadlines:
    typ: fasta
    datum: [01-31, 03-31, 08-31, 10-31]
  krav:
  - Sökanden ska vara en förening eller organisation
  - Projektet eller aktiviteten ska skydda och främja den sverigefinska minoritetsgruppen, dess språk eller kultur
  - Stöd lämnas inte till föreningens ordinarie verksamhet
  - Ansökan ska beskriva syfte, mål, målgrupp, genomförande, budget, sökt stöd och tidpunkt
  - Efter avslutad aktivitet ska en redovisning lämnas till Laxå kommun i kommunens särskilda e-tjänst
  belopp: null
  sen_ansokan: Ansökningar behandlas efter 31 januari, 31 mars, 31 augusti och 31 oktober
