- namn: Lokalbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: *alla
  malgrupp: Bidragsberättigade föreningar med lokalkostnader
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Kan sökas av föreningar som hyr eller äger en lokal som är en förutsättning för verksamheten och som används kontinuerligt,
    förutsatt att kommunägda lokaler inte kan ställas till förfogande
  - Bidraget baseras på faktiska hyreskostnader för hyrd lokal eller driftskostnader för egen lokal (t.ex. årshyra, räntor
    på fastighetslån, värme, el, sophämtning, sotning, vatten/avlopp, arrende, försäkringar) — telefon, internet, förbrukningsmaterial
    och investeringar ingår inte
  - Kostnaderna ska finnas med i föreningens ekonomiska redogörelse, och kvitton ska kunna visas upp utan dröjsmål vid förfrågan
  - Föreningar som hyr in sig hos andra föreningar kan få lokalbidrag om hyresavtal eller annan skriftlig överenskommelse
    kan uppvisas
  belopp: Max 60 % av hyran/driftskostnaden, dock högst 40 000 kronor per år.
  belopp_avser: per_forening
  kommunens_pott: null
