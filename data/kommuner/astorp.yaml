  - pensionar
  - funktionsratt
  - ovrig
  malgrupp: Bidragsberättigade föreningar som ordnar lovaktivitet för barn 6–16 år
  deadlines:
    typ: relativ
    datum: []
  krav:
  - 'Föreningen ska vara en bidragsberättigad förening: barn- och ungdomsförening, kulturförening, pensionärsförening eller
    handikappförening'
  - Aktiviteten ska ligga utanför föreningens ordinarie verksamhet och rikta sig till målgruppen 6–16 år
  - Ansökan ska ha inkommit senast fyra veckor innan aktiviteten
  - Redovisning ska ha inkommit senast fyra veckor efter aktiviteten, och bidraget betalas ut först efter att redovisningen
    är inlämnad
  - Till ansökan bifogas protokoll från årsstämma, verksamhetsberättelse, ekonomisk redogörelse, revisionsberättelse, verksamhetsplan
    samt blanketten föreningsuppgifter (separat e-tjänst)
