bidrag:
- namn: Lokalt aktivitetsstöd
  kategori:
  - idrott
  - ovrig
  malgrupp: Bidragsberättigade föreningar med ledarledd gruppverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Varje sammankomst ska ha minst 3 bidragsberättigade deltagare utöver ledare
  - Bidrag utgår för maximalt 30 deltagare per sammankomst, inklusive bidragsberättigad ledare
  - En ledare i åldern 15–20 år är bidragsberättigad per sammankomst, det kalenderår hen fyller år
  - Samma person, inklusive ledare, får endast redovisas i en aktivitet per dag och förening
  - En sammankomst ska vara minst en timme, omklädning får räknas in i tiden
  - Vid varje sammankomst ska det finnas en myndig ansvarig person på plats
  belopp: 4 kronor per tillfälle och deltagare. Vid sammanhängande aktiviteter (t.ex. läger eller hajker) utgår 1 deltagartillfälle
    per person och dygn, dock max 7 dygn.
  sen_ansokan: Vid ansökan 1–14 dagar för sent görs avdrag med 25 %, vid 15–21 dagar för sent avdrag med 50 %. Ansökan senare
    än 21 dagar är inte berättigad till stöd. Anstånd kan ges om särskilda skäl föreligger.
  kalla_url: https://astorp.se/download/18.35a497f4176844134183ac12/1610010770264/Bidragsbest%C3%A4mmelser%20f%C3%B6r%20f%C3%B6reningsst%C3%B6d%20-21.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  id: astorp-lokalt-aktivitetsstod
- namn: Medlemsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Bidraget grundas på antalet aktiva medlemmar som betalat medlemsavgift under föreningens föregående år, räknat vid räkenskapsårets
    slut
  - Bidrag utgår endast för aktiva medlemmar, inte för stödmedlemmar
  - Föreningar med verksamhet i flera kommuner kan i särskilda fall få bidrag endast för medlemmar som är bosatta i Åstorps
    kommun, medlemsregister ska då bifogas ansökan
  belopp: 25 kronor per aktiv medlem, lägst 1 500 kronor och högst 8 000 kronor per år och förening.
  sen_ansokan: Vid ansökan 1–14 dagar för sent görs avdrag med 25 %, vid 15–21 dagar för sent avdrag med 50 %. Ansökan senare
    än 21 dagar är inte berättigad till stöd. Anstånd kan ges om särskilda skäl föreligger.
  kalla_url: https://astorp.se/download/18.35a497f4176844134183ac12/1610010770264/Bidragsbest%C3%A4mmelser%20f%C3%B6r%20f%C3%B6reningsst%C3%B6d%20-21.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  id: astorp-medlemsbidrag
- namn: Lokalbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar med lokalkostnader
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Kan sökas av föreningar som hyr eller äger en lokal som är en förutsättning för verksamheten och som används kontinuerligt,
    förutsatt att kommunägda lokaler inte kan ställas till förfogande
  - Bidraget baseras på faktiska hyreskostnader för hyrd lokal eller driftskostnader för egen lokal (t.ex. årshyra, räntor
    på fastighetslån, värme, el, sophämtning, sotning, vatten/avlopp, arrende, försäkringar) — telefon, internet, förbrukningsmaterial
    och investeringar ingår inte
  - Kostnaderna ska finnas med i föreningens ekonomiska redogörelse, och kvitton ska kunna visas upp utan dröjsmål vid förfrågan
  - Föreningar som hyr in sig hos andra föreningar kan få lokalbidrag om hyresavtal eller annan skriftlig överenskommelse
    kan uppvisas
  belopp: Max 60 % av hyran/driftskostnaden, dock högst 40 000 kronor per år.
  sen_ansokan: Vid ansökan 1–14 dagar för sent görs avdrag med 25 %, vid 15–21 dagar för sent avdrag med 50 %. Ansökan senare
    än 21 dagar är inte berättigad till stöd. Anstånd kan ges om särskilda skäl föreligger.
  kalla_url: https://astorp.se/download/18.35a497f4176844134183ac12/1610010770264/Bidragsbest%C3%A4mmelser%20f%C3%B6r%20f%C3%B6reningsst%C3%B6d%20-21.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  id: astorp-lokalbidrag
- namn: Anläggningsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar med anläggningskostnader
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Kan sökas av förening som äger eller hyr en anläggning
  - Gäller endast lokal/anläggning som kräver särskilda förutsättningar och utrustning som inte kan tillgodoses på annat sätt,
    och som kultur- och fritidsenheten bedömt som anläggning, t.ex. en ridanläggning
  - Bidraget avser drift av lokalen/anläggningen (t.ex. årshyra, räntor på fastighetslån, värme, el, sophämtning, sotning,
    vatten/avlopp, arrende, försäkringar) — telefon, internet, förbrukningsmaterial och investeringar ingår inte
  - Kostnaderna ska finnas med i föreningens ekonomiska redogörelse, och kvitton ska kunna visas upp utan dröjsmål vid förfrågan
  belopp: Max 60 % av hyran/faktiska driftskostnaden, dock högst 140 000 kronor per år.
  sen_ansokan: Vid ansökan 1–14 dagar för sent görs avdrag med 25 %, vid 15–21 dagar för sent avdrag med 50 %. Ansökan senare
    än 21 dagar är inte berättigad till stöd. Anstånd kan ges om särskilda skäl föreligger.
  kalla_url: https://astorp.se/download/18.35a497f4176844134183ac12/1610010770264/Bidragsbest%C3%A4mmelser%20f%C3%B6r%20f%C3%B6reningsst%C3%B6d%20-21.pdf
