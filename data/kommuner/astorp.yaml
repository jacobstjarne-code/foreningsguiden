  krav:
  - Evenemanget ska vara av allmänt intresse, ha kommunal anknytning och genomföras professionellt med hög kvalitet
  - Evenemanget ska vara öppet, demokratiskt samt etiskt, socialt och miljömässigt godtagbart och motverka diskriminering
  - Evenemanget ska äga rum inom kommunen, stärka Åstorps varumärke och bidra till inresande besökare
