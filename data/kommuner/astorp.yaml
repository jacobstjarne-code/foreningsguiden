    datum:
    - 02-25
    - 08-25
  krav:
  - Varje sammankomst ska ha minst 3 bidragsberättigade deltagare utöver ledare
  - Bidrag utgår för maximalt 30 deltagare per sammankomst, inklusive bidragsberättigad ledare
  - En ledare i åldern 15–20 år är bidragsberättigad per sammankomst, det kalenderår hen fyller år
  - Samma person, inklusive ledare, får endast redovisas i en aktivitet per dag och förening
  - En sammankomst ska vara minst en timme, omklädning får räknas in i tiden
  - Vid varje sammankomst ska det finnas en myndig ansvarig person på plats
  belopp: 4 kronor per tillfälle och deltagare. Vid sammanhängande aktiviteter (t.ex. läger eller hajker) utgår 1 deltagartillfälle
    per person och dygn, dock max 7 dygn.
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Vid ansökan 1–14 dagar för sent görs avdrag med 25 %, vid 15–21 dagar för sent avdrag med 50 %. Ansökan senare
    än 21 dagar är inte berättigad till stöd. Anstånd kan ges om särskilda skäl föreligger.
