- id: vindeln-ungdomsledarutbildning
  namn: Bidrag till ungdomsledarutbildning
  kategori:
  - idrott
  - ovrig
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: lopande
