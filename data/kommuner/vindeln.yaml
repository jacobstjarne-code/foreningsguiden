  krav:
  - Bidraget lämnas till ungdomsledare som fyllt 14 år
  - Ämnet för kursen ska överensstämma med Riksidrottsförbundets rekommendationer för ungdomsledarkurser (till exempel ungdomspsykologi,
    föreningskunskap, ledarskap)
  - Bidraget lämnas endast till kurser som anordnas av riksförbund eller läns- och distriktsorganisationer och som genomförs
    i Sverige. Undantag kan göras för lokalt anordnad ungdomsledarutbildning efter beslut av kommunstyrelsen
  - Ansökan ska göras senast två månader efter avslutad kurs eller utbildning. Till ansökan ska kursprogram och verifikat
    på kostnader bifogas
  - Bidrag beviljas inte för deltagande i konferenser eller förbundsmöten
  belopp: 80 % av kostnaden för ungdomsledare, dock högst 3 000 kr inklusive eventuellt resebidrag. Resebidrag vid utbildning
    ges med max 500 kr. Beviljas utifrån utrymme i kommunstyrelsens budget
