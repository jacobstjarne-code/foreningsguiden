- id: gislaved-aktivitetsbidrag
  namn: Lokalt aktivitetsbidrag
  kategori:
  - idrott
  malgrupp: Barn- och ungdomsföreningar med deltagare 7–25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska ha beviljats grundbidrag eller startbidrag
  - Deltagarna ska vara 7–25 år
  - En godkänd grupp ska bestå av minst tre deltagare i åldern 7–25 år
  - Föreningen ska ha genomfört minst 100 deltagaraktiviteter under året
  - Sammankomsten ska vara planerad och ledarledd
  - Sammankomsten ska pågå minst 45 minuter och innehålla gemensam samling och avslutning
  - En deltagare kan bara generera bidrag vid en sammankomst per dygn och förening
  - Fullständiga personnummer krävs för deltagarna
  - Fester, läxläsning, högtidsfirande, religiösa sammankomster eller studier, entrébelagda arrangemang och matcher, skolverksamhet
    och studiecirklar får inte räknas
  - Vid tävling eller liknande får arrangören bara räkna deltagare från den egna föreningen
  belopp: Bestäms utifrån kommunens totalbelopp och antal deltagaraktiviteter
  sen_ansokan: 25 augusti för perioden 1 januari–30 juni och 25 februari för perioden 1 juli–31 december
  kalla_url: https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar
