# Källa verifierad 2026-07-10 mot gislaved.se. Extraherat ur kommunens
# publicerade bidragsregler. Belopp och vissa villkor är sammanfattade;
# spot-checkas av Jacob före publik deploy (leveransordning steg 4).
kommun: "Gislaved"
kommun_slug: "gislaved"
lan: "Jönköpings län"
befolkning: 30000
forvaltning: "Samhällsutvecklingsförvaltningen"
ansokningssystem:
  namn: "Kommunens e-tjänst / föreningsportal"
  url: "https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar"
kalla_url: "https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar"
verifierad: 2026-07-10
bidrag:
  - id: "gislaved-arrangemangsbidrag"
    namn: "Arrangemangs- och projektbidrag"
    kategori: ["kultur"]
    malgrupp: "Bidragsberättigade föreningar med säte i Gislaveds kommun, för öppna publika arrangemang och projekt"
    deadlines:
      typ: "fasta"
      datum: ["01-31", "04-30", "07-31", "10-31"]
    krav:
      - "Föreningen ska vara hemmahörande (säte) i Gislaveds kommun"
      - "Allmänheten ska ha tillträde och ha informerats om arrangemanget"
      - "Det ska framgå i marknadsföringen att arrangemanget genomförs med stöd från Gislaveds kommun"
      - "Arrangemanget ska läggas in i evenemangskalendern"
    belopp: null
    sen_ansokan: "Ej angivet i källan"
    kalla_url: "https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar"
    anteckning: "Handläggning fyra gånger per år. Bidrag beviljas inte till interna sammankomster (årsmöten, konferenser, jubileer)."
# FIX 2026-07-31 (Jacob): "gislaved-godkannande-bidragsberattigad" fanns
# tidigare BÅDE här (som ett falskt tredje bidrag) och nedan under
# forutsattningar (korrekt — det är ett förkrav, inte ett bidrag man
# kan söka). Samma sak dubbellagrad på fel plats. Gislaved har ETT
# bidrag och ETT förkrav — ströks här, forutsattningar-posten är
# källan. golden-set/gislaved-godkannande-bidragsberattigad.yaml
# (facit mot det falska bidraget) borttagen i samma commit.
forutsattningar:
  - id: "gislaved-bidragsberattigad"
    vad: "Bli godkänd som bidragsberättigad förening"
    beskrivning: "Föreningen ansöker om att godkännas som bidragsberättigad. Kräver vald styrelse, av årsmötet antagna stadgar, organisationsnummer och bankkonto i föreningens namn. Är föreningen ansluten till en statsbidragsberättigad riksorganisation ska den vara det."
    system: "Kommunens e-tjänst"
    # FIX 2026-07-31 (Jacob): ledtid var 90 — inte en publicerad
    # handläggningstid, utan "tre månader" felläst ur ledtid_text (som
    # handlar om NÄR den subventionerade taxan börjar gälla EFTER
    # godkännande, inte om själva handläggningstiden). "Räkna med 90
    # dagars handläggning" fanns alltså inte i källan. null = okänd
    # handläggningstid, samma disciplin som alla andra ledtid:null-fält.
    ledtid: null
    ledtid_text: "Subventionerad föreningstaxa gäller tidigast tre månader efter godkänt beslutsdatum"
    giltighet: null
    ordning: 1
    kalla_url: "https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar"
