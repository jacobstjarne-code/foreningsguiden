- id: gislaved-arrangemangsbidrag
  namn: Arrangemangsbidrag kultur
  kategori:
  - kultur
  malgrupp: Föreningar och studieförbund för enskilda offentliga arrangemang
  deadlines:
    typ: fasta
    datum:
    - 01-31
    - 04-30
    - 07-31
    - 10-31
  krav:
  - Arrangemanget eller projektet ska vara värdefullt för kommunens invånare ur kultursynpunkt, utveckla kulturlivet och bidra
    till ett varierat utbud
  - Ansökan ska lämnas senast två månader före genomförandet
  - Bidrag ges i första hand när arrangemanget eller projektet annars inte skulle kunna genomföras på grund av kostnader
  - Gage, resor, lokalhyra och marknadsföring kan vara bidragsberättigade kostnader
  - Material, servering, försäljningsartiklar och gåvor till artister beviljas normalt inte, med möjlighet till undantag för
    större projekt
  - Samarrangemang mellan flera föreningar prioriteras
  - Ekonomisk redovisning ska lämnas efter genomförandet
  - Arrangemanget ska äga rum i Gislaveds kommun
  - Lokalen eller platsen där arrangemanget genomförs ska vara tillgänglighetsanpassad
  - Arrangemang och projekt som vänder sig till barn och ungdomar ska vara drogfria
  - Allmänheten ska ha tillträde till arrangemanget och ha informerats om det genom lokal massmedia, sociala medier och/eller
    affischering
  - Det ska tydligt framgå i marknadsföringen att arrangemanget genomförs med stöd från Gislaveds kommun, och arrangemanget
    ska läggas in i evenemangskalendern
  - Ansökan ska klart ange arrangemangets art, tid och plats, tidsrymd för projektet samt medverkande och ansvariga
  - Ansökan ska innehålla en detaljerad kostnads- och inkomstkalkyl där budgeten är i balans för att kunna behandlas
  - Bidrag som sökts eller erhållits från andra bidragsgivare ska redovisas
  - Redovisning av arrangemanget eller projektet ska ske senast två månader efter genomförandet, annars återkallas beslutet
    om beviljat bidrag
  - Kvitto som styrker kostnader och intäkter ska bifogas redovisningen
  - En förening kan bara ansöka om bidrag för samma arrangemang eller projekt från en kommunal nämnd
  - Bidrag beviljas inte till interna sammankomster såsom årsmöten, konferenser, jubileer eller andra tillställningar som
    endast vänder sig till föreningens medlemmar och inbjudna gäster
  - Bidrag kan betalas ut som förlustgaranti som endast faller ut om arrangemanget går med ekonomisk förlust, och delutbetalning
    kan ske enligt samhällsutvecklingsnämndens särskilda beslut
  belopp: Beslutas efter individuell prövning; kommunen publicerar ingen generell beloppsnivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast två månader före genomförandet; handläggning sker efter 31 januari, 30 april, 31 juli och 31 oktober
  kalla_url: https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Normdokumentets villkor för bidragsgivning (kulturförening) bekräftar att samhällsutvecklingsnämnden beslutar
    om belopp och eventuella delutbetalningar individuellt i varje enskilt fall, inklusive möjlighet till förlustgaranti och
    reducering vid överskott - det finns alltså ingen fast beloppsregel, snarare en individuell bedömning. Flera krav har
    lagts till från normdokumentets villkorslista som saknades i kravlistan.
  foreningstyp: [kultur, hembygd, annat]
  senast_verifierad: '2026-08-18'
