- id: gislaved-anlaggningsbidrag
  namn: Anläggningsbidrag
  kategori:
  - idrott
  - ovrig
  malgrupp: Barn- och ungdomsföreningar med hyrd lokal eller egen anläggning
  deadlines:
    typ: fasta
    datum:
    - 03-15
  krav:
  - Föreningen ska vara bidragsberättigad
  - Föreningen ska ha redovisat minst 100 deltagaraktiviteter föregående år
  - Hyres- eller nyttjandekontrakt ska löpa på minst tre år
  - Anläggningen eller lokalen ska uppfylla myndighetskrav, inklusive OVK och brandskydd där det är tillämpligt
  - Anläggningen eller lokalen ska vara fri från alkohol, narkotika, dopning och tobak
  - Anläggningen eller lokalen ska vara godkänd av samhällsutvecklingsnämnden
  - Anläggningen eller lokalen ska ligga i Gislaveds kommun
  - För hyrd lokal ska gällande hyreskontrakt eller hyresavi kunna styrkas
  - Förhyrningen och lokalkostnaden ska vara godkända av samhällsutvecklingsnämnden
  - Tillfällig eller säsongsvis hyra ger inte lokalbidrag
  belopp: 'Hyrd lokal: 210 kronor per bidragsberättigad medlem och år, högst 75 % av hyreskostnaden. Föreningsägda anläggningar:
    fasta normbelopp per anläggningstyp samt aktivitetsbaserad reducering (20–100 %).'
  sen_ansokan: 15 mars varje år
  kalla_url: https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar
