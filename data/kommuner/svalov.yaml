  deadlines:
    typ: fasta
    datum: [02-25, 08-25]
  krav:
  - Aktiviteten ska omfatta minst tre bidragsberättigade deltagare utöver en utsedd ledare och pågå minst 60 minuter
  - För barn- och ungdomsverksamhet ska deltagarna vara 0–20 år och ledaren minst 13 år; seniorverksamhet avser personer 65 år eller äldre
  - Styrelse- och årsmöten är inte stödgrundande och statligt aktivitetsstöd måste sökas separat
  - Varje sammankomst ska redovisas på undertecknat närvarokort och ansökan och närvarokort ska sparas i fem år
  - Anpassat stöd för extra ledare kräver att föreningen visar behov av större ledartäthet för deltagare med funktionsvariation
  belopp: 60 kr per sammankomst för 0–20 år; 52 kr per sammankomst för seniorer och personer med funktionsvariation; dessutom 25 kr per extra ledare och sammankomst vid styrkt behov
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan 1–10 dagar för sent minskas med 10 procent; senare ansökan ger inget stöd.
