  namn: Grundbidrag
  kategori: [ovrig]
  malgrupp: Bidragsberättigade föreningar i Ydre kommun
  deadlines: {typ: fasta, datum: [02-25]}
  krav:
  - Föreningen ska ha varit verksam minst sex månader och ha minst tio betalande medlemmar med en medlemsavgift på minst 50 kronor, om inte kommunen medger ett särskilt motiverat undantag
  - Medlemsantalet ska avse betalande medlemmar i medlemsförteckningen den 31 december föregående år
  - Föreningen ska ha styrelse, stadgar, organisationsnummer, riksanslutning eller motsvarande samt vara demokratiskt och ideellt inriktad
  belopp: 25 kronor per medlem; lägst 250 kronor och högst 5 000 kronor per år
