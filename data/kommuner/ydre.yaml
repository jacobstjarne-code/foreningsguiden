- id: ydre-anlaggningsbidrag-hyra
  namn: Anläggningsbidrag – hyreskostnader
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar med bidragsberättigad barn- och ungdomsverksamhet i externt hyrd lokal eller anläggning
  deadlines: {typ: fasta, datum: [02-25]}
  krav:
  - Föreningen ska uppfylla aktivitetsstödets villkor och hyran ska avse barn- och ungdomsverksamhet till och med 25 år
  - Stödet gäller icke-kommunal inom- eller utomhusanläggning samt vissa kostnader för expeditions- eller klubblokal
  - Samma lokal får inte samtidigt få driftbidrag, och kostnader vid entrébelagd verksamhet räknas inte
  - Föregående års kostnader ska styrkas med hyresvärdsintyg, hyresverifikationer eller fakturor
  belopp: 75 procent av föregående kalenderårs hyreskostnad, högst 10 000 kronor per förening och år
  sen_ansokan: Ansökan för föregående års kostnader ska lämnas senast 25 februari
