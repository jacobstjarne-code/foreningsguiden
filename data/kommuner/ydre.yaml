- id: ydre-anlaggningsbidrag-drift
  namn: Anläggningsbidrag – drift
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar som ansvarar för samtliga driftkostnader för en egen eller ägarlikt disponerad anläggning
  deadlines: {typ: fasta, datum: [08-25]}
  krav:
  - Föreningen ska äga anläggningen eller ha nyttjanderätt eller arrende som löper minst tre år från ansökningsdagen och själv svara för samtliga driftkostnader
  - En ny anläggning ska godkännas före utbetalning; begäran om omvärdering ska lämnas senast 1 april
  - Anläggningen ska vara användbar, kunna besiktas årligen och i mån av utrymme upplåtas till kommunen och andra Ydreföreningar på rimliga marknadsvillkor
  - Underlaget omfattar godkända drift- och skötselkostnader efter avräkning av hyresintäkter, lokalens faciliteter, skött anläggningsyta och aktivitetsmiljöer
