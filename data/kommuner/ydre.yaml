- id: ydre-bygdepeng
  namn: Bygdepeng
  kategori: [social, ovrig]
  malgrupp: Lokala utvecklingsgrupper, föreningar eller grupper av boende som samlar bygden kring gemensam utveckling
  deadlines: {typ: okand, datum: []}
  krav:
  - Gruppen ska verka för alla boende inom ett avgränsat landsbygdsområde eller en ort med färre än 1 000 invånare
  - Endast en utvecklingsgrupp per geografiskt område kan få stödet och gruppen ska bjuda in boende och föreningar till gemensamma beslut
  - Pengarna ska användas till omkostnader för lokalt utvecklingsarbete och får inte användas till lön
  - Slutredovisning med användning och effekter ska lämnas senast 31 oktober; tidigare stöd ska vara förbrukat eller bundet till ett bestämt ändamål före ny ansökan
  belopp: 6 000 kronor per bygdepeng, varav Ydre kommun bidrar med 2 000 kronor och Region Östergötland med 4 000 kronor
