- id: ydre-aktivitetsstod
  namn: Kommunalt lokalt aktivitetsstöd
  kategori: [idrott, kultur, funktionsratt, ovrig]
  malgrupp: Föreningar med barn- och ungdomsverksamhet eller verksamhet för personer med funktionsnedsättning
  deadlines: {typ: fasta, datum: [02-25, 08-25]}
  krav:
  - Aktiviteten ska vara beslutad och ekonomiskt planerad, pågå minst 45 minuter och ha minst tre deltagare utöver ledaren
  - Deltagare får vara högst 25 år; för deltagare med funktionsnedsättning finns ingen övre åldersgräns
  - Ledaren ska fylla minst 13 år, vara medlem och närvara hela aktiviteten; högst 20 deltagare får räknas per ledare
  - En deltagare får räknas högst en gång per dag i samma förening och närvarounderlag ska sparas i minst tre år
  - Entrébelagda tävlingar, kommersiella arrangemang, studiecirklar, skoltid och verksamhet som får annat stöd räknas inte
  belopp: 25 kronor per ledarledd gruppaktivitet, 5 kronor i extra ledarstöd vid minst två ledare och cirka 7 kronor per deltagare och aktivitetstillfälle
  sen_ansokan: Senast 25 februari för 1 juli–31 december och 25 augusti för 1 januari–30 juni; sena ansökningar riskerar att inte behandlas
  kalla_url: *norm
  belopp_status: kontrollast
  belopp_avser: per_forening
  kommunens_pott: null
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kraver_registrering: true
