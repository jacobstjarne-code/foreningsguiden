- id: ydre-anlaggningsbidrag-investering
  namn: Anläggningsbidrag – investering
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar som äger eller långsiktigt disponerar en anläggning
  deadlines: {typ: lopande, datum: []}
  krav:
  - Föreningen ska äga anläggningen eller ha nyttjanderätt eller arrende som löper minst tre år från ansökningsdagen
  - Projektet får inte vara påbörjat när ansökan lämnas och föreningen kan få stöd högst en gång per år och specialidrott
  - Stödet kan avse nya aktivitetsmiljöer, renovering, energi- och miljöåtgärder samt säkerhets- och trygghetsprojekt enligt normens avgränsningar
  - Ansökan ska innehålla investeringskalkyl, finansieringsplan, offerter eller kostnadsunderlag och undertecknat styrelseprotokoll
  - Projekt och faktiska kostnader ska återrapporteras senast ett år efter beslut
  belopp: Högst 75 000 kronor per projekt
  sen_ansokan: Ansökan kan lämnas löpande under året men projektet får inte ha påbörjats
