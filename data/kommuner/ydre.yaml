- id: ydre-snabba-cash
  namn: Snabba Cash – kultur- och fritidsbidrag för unga
  kategori: [idrott, kultur, ovrig]
  malgrupp: Unga 13–30 år och föreningar som genomför unga personers kultur- eller fritidsprojekt
  deadlines: {typ: lopande, datum: []}
  krav:
  - Projektet ska initieras och drivas av unga 13–30 år och sökanden ska vara skriven i Ydre
  - Projektet ska vara publikt eller offentligt, äga rum i Ydre och ha konstnärlig, kulturell eller fritidsinriktad karaktär
  - Stöd lämnas inte till vuxendrivna projekt, projekt där alkohol serveras, lön, uppehälle, välgörenhet eller skolarbete
  belopp: Högst 7 000 kronor per ansökan
