  - Sökanden ska vara en förening eller organisation verksam i Hässleholms kommun
  - Samarbetet ska ge kommunen en tydlig motprestation som motsvarar sponsorinsatsen och regleras i ett tidsbegränsat avtal
  - Aktiviteten ska överensstämma med kommunens värdegrund och övergripande mål samt stärka kommunens varumärke
  - Politiska och religiösa organisationer får inte sponsring
  - Ansökan ska ange sponsringskategori, uppfyllda kriterier, aktivitetens syfte och mål, samarbetspartner och övriga sponsorer
  - Verksamhetsberättelse ska bifogas om organisationen inte redan lämnar den årligen till kommunen
  - Föreningen ska årligen redovisa sin avtalade motprestation innan ett nytt eller förlängt avtal kan tecknas
  - Utbetalda medel ska återbetalas om evenemanget inte genomförs eller kriterierna inte längre uppfylls
