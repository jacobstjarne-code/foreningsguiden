  kategori:
  - idrott
  - funktionsratt
  - ovrig
  malgrupp: Frilufts-, funktionsrätts-, idrotts-, nykterhets- och skolidrottsföreningar med aktiv fritidsverksamhet för 7–20-åringar, samt FSS-verksamhet utan åldersgräns
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara registrerad och bidragsberättigad i Hässleholms kommun
  - Verksamheten ska omfatta aktivt utövande i föreningens egen regi för 7–20-åringar eller FSS-verksamhet utan åldersgräns
  - Föreningen ska ha minst tio sammankomster och minst 50 deltagartillfällen per halvår
  - Varje sammankomst ska vara ledarledd, pågå minst 60 minuter och ha 3–30 bidragsberättigade deltagare utöver ledaren
