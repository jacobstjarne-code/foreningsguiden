  - Idrottsföreningar ska beskriva hur toppning motverkas för barn till och med tolv år
  - Studiecirklar, drop-in, publikbesök, skolundervisning, läxhjälp, konfessionell verksamhet, årsmöten och fester är inte bidragsberättigade
  belopp: Kommunens regler anger bidrag per deltagartillfälle men publicerar ingen taxa för 2026
  sen_ansokan: Efter 25 februari eller 25 augusti minskas bidraget 25 procent; efter 31 mars respektive 30 september ges inget bidrag
  kalla_url: https://www.hassleholm.se/download/18.4a95204f19a7180d0601ed2/1762854437865/Regler%20och%20riktlinjer%20f%C3%B6r%20st%C3%B6d%202026.pdf
