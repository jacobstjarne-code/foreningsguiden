    typ: fasta
    datum:
    - 02-25
  krav:
  - Föreningen ska vara registrerad och bidragsberättigad i Hässleholms kommun
  - Lokalen eller anläggningen ska höra till föreningens verksamhetsidé och användas för minst tio sammankomster per halvår
  - Lokalen eller anläggningen ska ligga i kommunen, vara godkänd av förvaltningen och uppfylla krav på bygglov, brandsäkerhet och försäkring
