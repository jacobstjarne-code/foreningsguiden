- id: bjurholm-kostnadsfria-kommunala-lokaler
  namn: Kostnadsfria kommunala lokaler och anläggningar
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: *alla
  malgrupp: Registrerade föreningar och organisationer i Bjurholms kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen eller organisationen ska vara verksam i kommunen och registrerad i kommunens föreningsregister
  - Kostnadsfri bokning gäller föreningsverksamhet och föreningsträffar, inte privata evenemang för en enskild medlem
  - De lokaler som omfattas är Castorhallen, Folkets Hus, sammanträdesrummen Ogen och Krögaren samt angivna kommunala anläggningar
  - Föreningen ska följa kommunens regler för korttidshyra av lokaler och anläggningar
  - Fasta läsårstider i Castorhallen söks i en särskild årlig omgång; för 2026 förlängdes sista dagen till 31 juli
  - Föreningar som söker samma Castorhallstid ansvarar för att samverka och komma överens
  belopp: Kostnadsfri upplåtelse av angivna kommunala lokaler och anläggningar för föreningsverksamhet
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Enstaka bokningar görs löpande; efter stoppdatum för fasta Castorhallstider kan föreningen välja bland kvarvarande tider
  kalla_url: https://e-tjanster.bjurholm.se/oversikt/overview/320
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
- id: bjurholm-uppdragsersattning
  namn: Uppdragsersättning till föreningar
  kategori:
  - idrott
  - kultur
  - ovrig
  foreningstyp: *alla
  malgrupp: Föreningar som utför ett särskilt allmännyttigt uppdrag åt kommunen
  deadlines:
    typ: okand
    datum: []
  krav:
  - Uppdraget ska vara till nytta för allmänheten och av stor vikt för kommunen eller avse verksamhet som annars skulle utföras i kommunal regi
  - Uppdraget ska harmoniera med föreningens ordinarie verksamhet, stadgar och intressen
  - Föreningen ska följa kommunens mål, allmänna föreningsregler och riktlinjer
  - Ett skriftligt avtal ska tecknas efter dialog med kommunen om uppdragets omfattning och tidsperiod
  - Avtalet ska tydligt ange föreningens respektive kommunens ansvar
  - Uppföljning och redovisning ska genomföras innan full ersättning betalas ut
  belopp: Ersättningen fastställs genom politiskt beslut och skriftligt avtal utifrån uppdraget och kommunens budgetram
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ingen öppen ansökningsfrist publiceras; dialog och avtal ska föregå uppdraget
  kalla_url: *norm
  belopp_status: ingen_regel
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Exempel är underhåll av leder, kulturella platser och idrottsanläggningar samt ersättning för vissa utlägg.
  senast_verifierad: '2026-08-23'
