bidrag:
- id: bjurholm-lokalbidrag
  namn: Lokalbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Registrerade föreningar för bidrag till lokaler
  deadlines:
    typ: fasta
    datum:
    - 08-15
  krav:
  - Föreningen måste vara registrerad i Bjurholms föreningsregister
  - Ansökan skickas genom e-tjänsten
  - Föreningen måste företrädas av behörig person
  - Föreningen måste äga sina lokaler eller långtidshyra dem (gäller ej bostadsutrymme)
  - Bidrag kan endast beviljas för en lokal per förening
  - Ansökan avser föreningens kostnader för föregående verksamhetsår
  - Föreningen ska ha sitt säte och vara verksam i Bjurholms kommun
  - Föreningen ska ha ett registrerat organisationsnummer
  - Föreningen ska i samband med ansökan lämna in årsmötesprotokoll, verksamhetsberättelse samt revisionsberättelse
  belopp: Högst 40 procent av godkända kostnader, maximalt 6 000 kr
  sen_ansokan: Ej möjlig efter 15 augusti
  kalla_url: https://www.bjurholm.se/uppleva-och-gora/foreningar/lokalbidrag
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'Motstridiga källor för sista ansökningsdag: riktlinjedokumentet ''Riktlinjer för samverkan med föreningar i
    kommunen'' (KF 2025-04-28 §13, giltigt fr.o.m. 2025-05-21) anger 15 augusti, medan bjurholm.se/uppleva-och-gora/foreningar/lokalbidrag
    (senast uppdaterad 2026-04-02) anger 31 augusti 2026. Ej verifierat vilket datum som faktiskt gäller — bör klargöras med
    kommunen innan ändring.'
- id: bjurholm-studieforbund
  namn: Bidrag till studieförbund
  kategori:
  - kultur
  malgrupp: Studieförbund registrerade i Bjurholm
  deadlines:
    typ: fasta
    datum:
    - 05-31
  krav:
  - Studieförbundet måste vara registrerat i Bjurholms föreningsregister
  - Ansökan skickas genom e-tjänsten
  - Ansökan ska innehålla senaste verksamhetsberättelsen
  - Ansökan ska innehålla senaste årsmötesprotokollet inklusive revisionsberättelse samt resultat- och balansräkning
  - E-legitimation krävs för att ansöka
  belopp: Bidraget utbetalas med 70 procent grundbidrag (baserat på föregående års studietimmar) och 30 procent volymbidrag
    (baserat på föregående års deltagartimmar)
  sen_ansokan: Ej möjlig efter 31 maj
  kalla_url: https://e-tjanster.bjurholm.se/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: bjurholm-arrangemangsbidrag-kultur
  namn: Arrangemangsbidrag — Kultur
  kategori:
  - kultur
  malgrupp: Föreningar för kulturella arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen måste vara registrerad i Bjurholms föreningsregister
  - Arrangemanget ska vara av kulturell karaktär
  - Budgetförslag och programbeskrivning krävs
  belopp: Max 1 000 kronor per ansökan
  sen_ansokan: Möjlig löpande
  kalla_url: https://www.bjurholm.se/uppleva-och-gora/bibliotek-och-kultur/kultur
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Föreningar måste rapportera efter arrangemanget
- id: bjurholm-bygdemedel
  namn: Bygdemedel
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Ideella föreningar och idéburet verksamhet för bygdeutveckling
  deadlines:
    typ: fasta
    datum:
    - 04-15
  krav:
  - Projektet ska främja näringsverksamhet eller service på landsbygden
  - Organisationen måste ha säte i påverkad område (hela Bjurholm)
  - Godkända och dokumenterade kostnader krävs
  - Föreningar måste tillskjuta minst 10% i egenfinansiering (kontant)
  - Projekt får inte redan vara genomförda
  - Endast fasta kostnader — inte möbler eller lösa inventarier
  belopp: "Max 90 % av godkända kostnader"
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ej möjlig efter 15 april
  kalla_url: https://www.bjurholm.se/uppleva-och-gora/foreningar/bygdemedel
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Ansökan via Länsstyrelsen Min ansökan-portal. Årlig budget ca 140 000 kronor för Bjurholm. Arbetsinsatser räknas
    inte längre som egenfinansiering.
- id: bjurholm-lovaktivitetsbidrag
  namn: Bidrag till lovaktivitet
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar, studieförbund och kyrkliga samfund som ordnar kostnadsfria lovaktiviteter för barn 6–15 år
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Aktiviteten ska vara kostnadsfri
  - Aktiviteten ska rikta sig till barn 6–15 år
  - Bidrag beviljas så länge medel finns
  - Alla barn ska behandlas lika vad gäller tillgång och deltagande
  - Aktiviteterna ska stimulera alla barns deltagande och främja integration
  - Aktiviteten ska marknadsföras som arrangemang med lovstöd från Bjurholms kommun
  - Föreningen ska rapportera aktiviteten på avsett formulär efter genomförande
  belopp: Högst 3 000 kr
  sen_ansokan: Möjlig löpande så länge medel finns
