    - 04-15
  krav:
  - Projektet ska främja näringsverksamhet eller service på landsbygden
  - Organisationen måste ha säte i påverkad område (hela Bjurholm)
  - Godkända och dokumenterade kostnader krävs
  - Föreningar måste tillskjuta minst 10% i egenfinansiering (kontant)
