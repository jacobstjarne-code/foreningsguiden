  malgrupp: Registrerade föreningar för bidrag till lokaler
  deadlines:
    typ: fasta
    datum:
    - 08-31
  krav:
  - Föreningen måste vara registrerad i Bjurholms föreningsregister
  - Ansökan skickas genom e-tjänsten
  - Föreningen måste företrädas av behörig person
  - Föreningen måste äga sina lokaler eller långtidshyra dem (gäller ej bostadsutrymme)
  - Bidrag kan endast beviljas för en lokal per förening
  - Ansökan avser föreningens kostnader för föregående verksamhetsår
  - Föreningen ska ha sitt säte och vara verksam i Bjurholms kommun
  - Föreningen ska ha ett registrerat organisationsnummer
  - Föreningen ska i samband med ansökan lämna in årsmötesprotokoll, verksamhetsberättelse samt revisionsberättelse
