- id: vimmerby-kommunalt-lok-stod
  ansokningsvag: "En separat kommunal ansökan krävs via Vimmerby kommuns blankett eller e-tjänst. RF/SISU-anslutna föreningar bifogar bekräftelsen från den statliga LOK-ansökan; RF-rapporteringen räcker inte ensam."
  namn: Kommunalt LOK-stöd
  status: aktiv
  kategori: [idrott, kultur, ovrig, funktionsratt]
  foreningstyp: *alla
  malgrupp: Föreningar med ledarledda aktiviteter för barn och unga 6–25 år eller deltagare med funktionsnedsättning
  deadlines: {typ: fasta, datum: [02-25, 08-25]}
  krav:
  - Aktiviteten ska ligga i linje med föreningens verksamhetsidé, vara ledarledd, pågå minst 60 minuter och ha minst tre deltagare 6–25 år
  - För deltagare med funktionsnedsättning finns ingen övre åldersgräns
  - Stöd ges högst en gång per dag, deltagare och grupp; en grupp får inte delas för att ge flera stöd
  - Närvarokort ska föras vid varje sammankomst, sparas i fyra år och visas på begäran
  - Kommersiella arrangemang och studiecirklar är inte stödberättigade
  - RF/SISU-anslutna föreningar ska bifoga bekräftelsen från sin statliga LOK-ansökan; kommunen hämtar närvarouppgifterna från RF/SISU
  belopp: 53 kr per stödberättigad sammankomst 2026
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Senast 25 februari för 1 juli–31 december och 25 augusti för 1 januari–30 juni. Kommunens generella senregel gäller.
