  deadlines: {typ: fasta, datum: [04-15]}
  krav:
  - Föreningen ska uppfylla kommunens grundvillkor, ha minst tio betalande medlemmar, eget konto, minst sex månaders verksamhet och minst fem styrelsemöten eller sammankomster per år
  - Nivå 1 kräver att samtliga grundvillkor är uppfyllda; en nystartad förening ska vid första ansökan även lämna bildandeprotokoll och stadgar
  - Nivå 2 kräver minst 50 betalande medlemmar, minst 40 aktivitetstillfällen under föregående år och minst två insatser inom ANDTS, inkludering, barn och unga eller pensionärer
  - Nivå 3 kräver att tidigare nivåer är uppfyllda, minst 300 betalande medlemmar, minst 100 aktivitetstillfällen och minst två insatser inom ungdomsinflytande, funktionsvariation eller socialt ansvar
  - Insatserna ska avse föregående års verksamhet och kunna styrkas med verksamhetsberättelse, policydokument eller motsvarande
  belopp: 'Nivå 1: 3 150 kr; nivå 2: 5 250 kr; nivå 3: 10 500 kr för 2026. Modellen är ackumulerande.'
