- id: atvidaberg-medfinansieringsbidrag
  namn: Kommunal medfinansiering till ideella föreningar
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Ideella föreningar som behöver kommunal medfinansiering för stöd från annan aktör
  deadlines: {typ: lopande, datum: []}
  krav:
  - En annan myndighet eller organisation ska kräva kommunal medfinansiering för projektet
  - Projektet ska utveckla eller garantera föreningens fortsatta verksamhet och skapa långsiktigt mervärde för kommuninvånarna
  - Föreningens egen insats ska vara minst 15 procent; eget arbete får värderas till 200 kr per timme
  - Föreningens stadgar ska visa ideellt syfte utan enskild ekonomisk vinning; företag, ekonomiska föreningar, stödföreningar, försvarsanknutna och fackliga organisationer utesluts
  belopp: Högst 35 procent av totalkostnaden och högst 100 000 kr per projekt
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Handläggningstiden bör inte överstiga fyra månader för komplett ansökan
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  anteckning: null
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
- id: atvidaberg-aktivitetsstod-barn-unga
  namn: Aktivitetsbidrag för barn- och ungdomsverksamhet
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med verksamhet för barn och unga 0–25 år
  deadlines: {typ: fasta, datum: [02-25, 08-25]}
  krav:
  - Sammankomsten ska ske i föreningens regi och ha minst tre deltagare 0–25 år utöver minst en ledare som är minst 13 år
  - Aktiviteten ska pågå minst 60 minuter med gemensam samling och avslutning; högst 30 deltagare får redovisas
  - Närvaro för deltagare och ledare ska registreras och godkännas av ansvarig ledare
  - Föreningen ska årligen beskriva sitt arbete med minst fem av åtta kriterier om likabehandling, drogpolicy, unga ledare, ledarutveckling, fair play, prova-på, samverkan och inkludering
  - Entrébelagda tävlingar och kommersiella arrangemang är inte stödgrundande
  belopp: 30 kr per sammankomst och 2 kr per deltagare om alla åtta kvalitetskriterier uppfylls; 15 kr per sammankomst och 2 kr per deltagare om minst fem uppfylls
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: För sent inkommen ansökan ger inte rätt till stöd
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  anteckning: null
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
- id: atvidaberg-hyresbidrag
  namn: Hyresbidrag
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med kontinuerlig barn- och ungdomsverksamhet som hyr icke-kommunal lokal
  deadlines: {typ: fasta, datum: [02-25]}
  krav:
  - Föreningen ska ha minst en ungdomsgrupp med kontinuerliga träffar, minst tre deltagare 0–25 år och en ledare äldre än 13 år
  - Hyran ska betalas till annan hyresvärd än Åtvidabergs kommun och vara skälig
  - Stöd utgår inte när entréavgift tas ut och föregående års medlemsantal ska ligga till grund för ansökan
  - Vid översökning bedöms samhällsnytta, antal unga och totala nyttjare, driftkostnader samt andra intäktsmöjligheter
  belopp: 50 procent av skälig hyra, högst 30 kr per medlem 0–25 år och högst 15 000 kr per förening och år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: För sent inkommen ansökan ger inte rätt till stöd
