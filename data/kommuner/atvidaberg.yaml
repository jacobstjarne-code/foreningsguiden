- id: atvidaberg-investeringsbidrag
  namn: Investeringsbidrag
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med barn- och ungdomsverksamhet som investerar i sin anläggning
  deadlines: {typ: fasta, datum: [02-25]}
  krav:
  - Föreningen ska normalt ha minst en kontinuerlig ungdomsgrupp med minst tre deltagare 0–25 år och en ledare äldre än 13 år
  - Investeringen ska avse maskiner, redskap eller fasta inventarier som behövs för anläggningens skötsel, drift eller funktion
  - Arbeten eller inköp får inte påbörjas före beslut utan särskilt medgivande och statliga stöd ska nyttjas om möjligt
  - Ansökan ska redovisa projektets kostnader, finansiering och framtida drift; kostnader och effekter redovisas skriftligen efteråt
  belopp: Individuell prövning; någon generell beloppsnivå publiceras inte
