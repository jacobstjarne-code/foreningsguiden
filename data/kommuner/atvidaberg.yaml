- id: atvidaberg-evenemangsbidrag
  namn: Evenemangsbidrag
  kategori: [kultur, idrott, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar som arrangerar tillfälliga offentliga evenemang eller regelbunden offentlig kulturverksamhet
  deadlines: {typ: fasta, datum: [02-25, 08-25]}
  krav:
  - Evenemanget ska ha lokal anknytning eller allmänt intresse för kommuninvånarna
  - Evenemanget ska vara offentligt, marknadsföras brett och publiceras i kommunens kostnadsfria evenemangskalender
  - Stödet avser ett enskilt tillfälle eller aktivitet under högst en vecka; interna evenemang, tävlingar, utflykter och studiebesök stöds inte
  - Varor för försäljning och andra förbrukningsvaror stöds inte men ska framgå av budgeten
  - Genomförande och ekonomi ska redovisas i det digitala föreningssystemet
  belopp: Individuell prövning utifrån avsatta medel, samhällsnytta, tidigare stöd och föreningens möjlighet till andra intäkter; fast nivå publiceras inte
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan prövas vid två årliga ansökningstillfällen
