  giltighet_status: kontrollast
- id: atvidaberg-lokal-verksamhet
  vad: Lokal verksamhet och fullständiga årshandlingar
  beskrivning: Föreningen ska bedriva verksamhet i och vända sig till kommuninvånarna, ha tydlig målsättning och verksamhetsplan samt årligen upprätta verksamhetsberättelse och bokslut.
  system: Interbook
  ledtid: null
  ledtid_text: Uppgifterna och årshandlingarna hålls aktuella varje år
  giltighet: Kalenderår
  ordning: 2
