- id: atvidaberg-utvecklingsbidrag-noder
  namn: Utvecklingsbidrag för noder för bebyggelse och service
  kategori: [kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med tydlig anknytning till Björsäter, Grebo, Falerum eller Hannäs socken
  deadlines: {typ: fasta, datum: [02-25]}
  krav:
  - En lokal förening med tydlig geografisk anknytning till en av de fyra noderna ska stå som sökande
  - Insatsen ska vara tillgänglig för hela ortens befolkning utan krav på medlemskap
  - Stödet får användas till flerårigt utvecklingsprojekt, anläggningsutveckling eller offentlig medfinansiering, men inte löpande verksamhet
  - Arbete och inköp får inte påbörjas före beslut utan särskilt medgivande
  - Projektets effekter ska redovisas skriftligt och muntligt och kommunen ska synliggöras som finansiär
  belopp: Högst 25 000 kr per ansökan
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: För sent inkommen ansökan ger inte rätt till stöd
  kalla_url: *huvud
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Föreningen kan vara ombud för privatperson eller företag, men kommunen kräver att en lokal förening är formell sökande
- id: atvidaberg-bygdepeng
  namn: Bygdepeng
  kategori: [kultur, social, ovrig]
  foreningstyp: [hembygd, social, annat]
  malgrupp: Lokala utvecklingsgrupper som verkar för en landsbygdsbygds gemensamma utveckling
  deadlines: {typ: fasta, datum: [02-25]}
  krav:
  - Sökanden ska vara en förening som uppfyller grundreglerna och representerar en lokal utvecklingsgrupp i en ort med färre än 1 000 invånare eller en utpekad nod
  - Utvecklingsgruppen ska vara medlem i Hela Sverige ska leva, finnas och verka i området samt omfatta alla boende i sitt utvecklingsarbete
  - Pengarna ska avse planerade omkostnader för lokalt utvecklingsarbete, exempelvis möten, lokal, webb, material, resor eller föreläsare
  - Alla boende och föreningar i området ska bjudas in att gemensamt besluta om användningen
  - Endast en grupp per område kan få stödet; löner, ideellt arbete och kostnader som täcks av annat stöd är inte stödgrundande
  belopp: 6 000 kr per bygdepeng, varav Region Östergötland bidrar med 4 000 kr och Åtvidabergs kommun med 2 000 kr
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan efter 25 februari behandlas inte
  kalla_url: *norm
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: Stödet fanns i den fulla normen men saknades i huvudmenyn
- id: atvidaberg-subventionerad-foreningstaxa
  namn: Subventionerad föreningstaxa i kommunala lokaler och anläggningar
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som bokar kommunala hallar, planer, kultur- och konferenslokaler
  deadlines: {typ: okand, datum: []}
  krav:
  - Bokningen ska göras av en förening och följa kommunens bokningsregler
  - Föreningstaxan gäller kommunala idrottsanläggningar och vissa kultur- och konferenslokaler enligt 2026 års taxa
  - Bokningsförfrågan ska normalt skickas minst sju dagar före tillfället och den som hyr ska vara minst 18 år
  belopp: Lägre föreningstaxa än normaltaxa; 2026 kostar exempelvis gymnastiksalar 72–93 kr per timme, Kopparvallen 670 kr per timme och bibliotekets konferenslokal är kostnadsfri
  belopp_avser: per_forening
