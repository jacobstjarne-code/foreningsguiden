  vad: Registrerad och ideell förening
  beskrivning: Föreningen ska vara ideell och demokratiskt uppbyggd, ha årsmötesvald styrelse, vara öppen för medlemskap och arbeta efter årsmötesfastställda stadgar.
  system: Interbook
  ledtid: null
  ledtid_text: Registrering kräver bland annat stadgar, protokoll från konstituerande möte, budget och verksamhetsberättelse
