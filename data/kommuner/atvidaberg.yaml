- id: atvidaberg-driftsbidrag
  namn: Driftsbidrag för egen anläggning
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med barn- och ungdomsverksamhet som äger eller ägarlikt driver en anläggning
  deadlines: {typ: fasta, datum: [02-25]}
  krav:
  - Föreningen ska ha minst en kontinuerlig ungdomsgrupp med minst tre deltagare 0–25 år och en ledare äldre än 13 år
  - Föreningen ska helt svara för anläggningens drift och kostnader; tomträtt eller långsiktigt arrende kan räknas som ägarlikt
  - Stöd utgår inte för lokal som används till bingo, dans eller annat inkomstbringande eller entrébelagt evenemang
  - Ansökan bygger på föregående års medlemsantal och redovisas i samband med ansökan
  belopp: Schabloner per anläggningsdel, bland annat 1,50 kr/m² klippt gräsyta, 1 500–2 500 kr per omklädningsrum och 2 500 kr per elljusspår; högst 50 000 kr per förening och år
  belopp_avser: per_forening
