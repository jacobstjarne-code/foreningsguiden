# Källa verifierad 2026-07-27 mot kavlinge.se enligt HAIKU_SPEC v3 §B1-B6.
# Kävlinge kommuns webbsida för föreningsbidrag (uppleva-och-gora/foreningar/soka-
# foreningsbidrag) och bidragsbestämmelser lästa tillsammans. Bidragstyper
# identifierade från både huvudsida och detaljsida. Deadlines hämtade från
# officiell källa. För vissa bidrag är detaljerade belopp specificerade (t.ex.
# lokalt aktivitetsstöd: 14.30 kr per deltagartillfälle), andra är case-by-case.
# Verksamhetsbidraget för kultur har deadline Sep 15 - Oct 15, för sociala
# föreningar Apr 15 - May 15. Systemet för idrottsföreningar är "Aktivitetskort på
# Nätet" (ApN). Spot-checkas av Jacob före publik deploy.
