- id: alvesta-projekt-kultur
  namn: 'Projektbidrag: Kulturarrangemang'
  kategori:
  - kultur
  malgrupp: Kulturföreningar för arrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Arrangemanget ska vara inom ett konstnärligt område, t.ex. musik, teater, film, dans eller konst
  - Arrangemanget ska äga rum i Alvesta kommun och vara öppet för allmänheten
  - Alvesta kommun ska finnas med i all marknadsföring av arrangemanget
  - Ansökan ska lämnas senast tre veckor innan arrangemanget startar
  - Stöd beviljas ej till stödgalor eller arrangemang för välgörande ändamål, och ej för mat och dryck
  - Stödet är ett arrangemangsstöd och avser ej produktion
  belopp: Upp till 20 000 kronor, kan ges som förlustbidrag
  sen_ansokan: Rapportering senast 2 månader efter projektet
  kalla_url: https://www.alvesta.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod-och-externa-bidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: alvesta-investeringsstod
  namn: Investeringsstöd
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar för investeringar i anläggning eller utrustning
  deadlines:
    typ: fasta
    datum:
    - 10-01
  krav:
  - Investeringen ska avse anläggning eller lokal och kan omfatta energieffektiviserande åtgärder, ny-, till- eller ombyggnation,
    maskiner för drift av anläggningen eller åtgärder som förbättrar tillgängligheten
  - Stöd utgår ej för förbrukningsartiklar, normalt underhåll eller investeringar som redan är påbörjade
  - Föreningens ideella arbetsinsats får ej räknas in i investeringskostnaden
  - Ansökan ska lämnas senast 1 oktober och avse investeringar som planeras genomföras under nästkommande kalenderår
  - Redovisning med fakturor och kontoutdrag ska lämnas senast 31 december samma år som investeringen genomförs
  belopp: Upp till 50% av investeringskostnaden. Lägsta summa som kan sökas är 10 000 kronor.
  sen_ansokan: Ansökan för återkommande investeringar senast 1 oktober
  kalla_url: https://www.alvesta.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod-och-externa-bidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Akuta åtgärder eller reparationer, samt redan påbörjade investeringar som kräver omedelbar åtgärd, kan i stället
    sökas som löpande investeringsstöd (ansökan löpande, beslut senast tre veckor efter ansökan).
- id: alvesta-ledarutbildning
  namn: Ledarutbildningsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för utbildning av ledare och instruktörer
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska ha barn- och ungdomsverksamhet
  - Stödet avser ledare verksamma inom föreningens barn- och ungdomsverksamhet
  - Ansökan ska vara kultur- och fritidsförvaltningen tillhanda senast tre månader efter avslutad kurs
  - För att räknas på innevarande verksamhetsår ska ansökan skickas in senast 31 december
  belopp: '100% av kurskostnaderna (ej reseersättning eller förlorad arbetsförtjänst). Takbelopp beroende på antal gruppaktiviteter
    föregående år: 20-99 aktiviteter 6 000 kronor, 100-249 aktiviteter 8 000 kronor, 250-399 aktiviteter 10 000 kronor, 400+
    aktiviteter 15 000 kronor.'
  sen_ansokan: Ansökan ska vara kultur- och fritidsförvaltningen tillhanda senast tre månader efter avslutad kurs. För att
    räknas på innevarande verksamhetsår ska ansökan skickas in senast 31 december.
  kalla_url: https://www.alvesta.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod-och-externa-bidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: alvesta-rantstod
  namn: Räntestöd för föreningslån
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med kommunalt godkänt lån för investeringar
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska ha kommunal borgen beviljad för lånet
  - Lånet ska godkännas av kommunstyrelsen som stödberättigat innan det tecknas
  belopp: 90% av räntekostnaderna under den beslutade amorteringstiden
  sen_ansokan: Ej tillämpligt (löpande)
  kalla_url: https://www.alvesta.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod-och-externa-bidrag/
