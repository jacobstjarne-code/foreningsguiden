  - kultur
  malgrupp: Föreningar för ungdomsledda projekt
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Projektet ska planeras och genomföras av barn och unga i åldern 13-25 år
  - Ansökan ska lämnas senast tre veckor innan evenemanget eller projektet startar
  - Redovisning ska lämnas senast två månader efter genomfört evenemang/projekt
  - Stöd utgår ej för ledararvode
  belopp: Upp till 15 000 kronor
  sen_ansokan: Rapportering senast 2 månader efter projektet
