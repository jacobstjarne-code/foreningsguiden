  malgrupp: Ideella föreningar med stödberättigade gruppaktiviteter för deltagare 7–25 år
  deadlines: { typ: fasta, datum: [05-31] }
  krav:
  - Aktiviteten ska pågå minst 45 minuter och ha minst tre deltagare utöver ledare
  - Deltagarna ska vara 7–25 år; för deltagare med funktionsnedsättning finns ingen övre åldersgräns och ledare 13–25 år får räknas som deltagare
  - Aktiviteten ska ledas av en utsedd ledare över 13 år och det ska finnas minst en ledare per 20 deltagare
  - En deltagare får räknas i högst en gruppaktivitet per förening och veckodag
  - Närvaro ska föras och sparas i fyra år; studiecirklar och kommersiella arrangemang ger inte stöd
