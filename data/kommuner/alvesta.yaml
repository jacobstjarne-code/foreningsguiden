forutsattningar:
- id: alvesta-rbok-registrering
  vad: Registrering i Rbok-systemet
  beskrivning: Föreningen måste vara registrerad i kommunens Rbok-system. Föreningen ska bedriva ideell, icke vinstdrivande
    verksamhet och ha demokratisk struktur med godkända stadgar. Ordförande och ledare som arbetar med barn/ungdom måste ha
    polisanmälan för barnmisshandling, grov misshandling och sexualbrott. Årsredovisning med resultat- och balansräkning krävs
    årligen.
