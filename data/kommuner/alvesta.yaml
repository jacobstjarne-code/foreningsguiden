bidrag:
- id: alvesta-verksamhetsstod
  namn: Årligt verksamhetsstöd
  kategori:
  - idrott
  - kultur
  - pensionar
  - funktionsratt
  - ovrig
  malgrupp: Registrerade föreningar i Alvesta kommun
  deadlines:
    typ: fasta
    datum:
    - 05-31
  krav:
  - Verksamhetsberättelse för föregående år ska bifogas
  - Revisionsberättelse för föregående år ska bifogas
  - Resultat- och balansrapport för föregående år ska bifogas
  - Verksamhetsplan för innevarande år ska bifogas
  - Budget för innevarande år ska bifogas
  belopp: 'Aktivitetsstöd: 7 kronor per deltagare och gruppaktivitet (ålder 7-25 år). Stöd till förhyrda lokaler: upp till
    60% av hyreskostnaden, max 50 000 kronor per år och lokal. Stöd till drift av egen anläggning/lokal: fast del (underhålls-
    och tillsynspoäng x 450 kronor) samt rörlig del om 80% av vissa driftskostnader. Främjandestöd: beviljas efter individuell
    prövning, ingen fast summa.'
  sen_ansokan: Ansökan som inkommer efter 31 maj behandlas ej utan att särskilda skäl föreligger. Utbetalning görs i februari
    till föreningens konto.
  kalla_url: https://www.alvesta.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod-och-externa-bidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Omfattar verksamhetsstöd, anläggningsstöd, hyresstöd och utvecklingsstöd. Individuell bedömning per förening.
- id: alvesta-nystartat-bidrag
  namn: Stöd till nystartade föreningar
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Nystartade föreningar med minst 6 månaders verksamhet
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningens stadgar ska bifogas
  - Konstituerande styrelseprotokoll ska bifogas
  - Intyg om registrerat organisationsnummer från Skatteverket ska bifogas
  - Verksamhetsplan för kommande år ska bifogas
  - Ekonomisk redovisning och budget för kommande år ska bifogas
  - Vid ansökan om att bli godkänd barn- och ungdomsförening ska även föreningens alkohol- och drogpolicy bifogas
  belopp: Upp till 2 500 kronor
  sen_ansokan: Ej tillämpligt (löpande)
  kalla_url: https://www.alvesta.se/uppleva-och-gora/foreningar-och-foreningsliv/foreningsstod-och-externa-bidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
