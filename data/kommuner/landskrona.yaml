    datum:
    - 02-10
    - 05-10
    - 09-10
    - 11-10
  krav:
  - Projektet ska vara öppet för allmänheten och tidsbegränsat (konsert, utställning, föreläsning, workshop eller verksamhetsutveckling)
  - Förankrat i Landskronas kulturstrategi med minst ett utvecklingsområde
  - Ej religiös eller partipolitisk verksamhet, egen konstnärlig produktion, eller arrangemang utanför Landskrona
  - Marknadsföring ska ange att projektet stöds av Landskrona stads kulturnämnd
  belopp: Beloppet beslutas efter projektets kvalitet, delaktighet, ekonomi och koppling till kulturstrategin; inget fast belopp publiceras
