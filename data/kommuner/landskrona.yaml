- id: landskrona-verksamhetsstod-kultur
  namn: Verksamhetsstöd till kulturföreningar
  foreningstyp: [kultur, hembygd]
  kategori:
  - kultur
  malgrupp: Kulturföreningar med säte i Landskrona som bedriver kontinuerlig, publik verksamhet inom kulturområdet året om.
    Kulturarvsaktörer undantas kravet på publik verksamhet men ska driva öppen kulturarvsverksamhet med aktivt deltagande.
