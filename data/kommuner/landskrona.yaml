  - Verksamhetsberättelse, ekonomisk berättelse och revisionsberättelse för föregående verksamhetsår
  - Medlemsantal uppdelat på åldersgrupperna 0–6, 7–25, 26–65 samt 66 år och äldre, varav mantalsskrivna i Landskrona
  - Verksamhetsplan för kommande år
  - Nystartade föreningar hänvisas till projektstöd för att starta ny förening i stället
  belopp: Beloppet beslutas efter bedömning av föreningens verksamhet och planerade verksamhet; inget fast belopp publiceras
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.landskrona.se/uppleva-och-gora/kultur/bidrag-stod-och-stipendier/verksamhetsstod-till-kulturforeningar/
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Stödet beräknas främst utifrån föregående års aktiviteter och deltagande medlemmar, med hänsyn till föreningstyp.
  senast_verifierad: '2026-08-18'
- id: landskrona-kulturprojektstod
  namn: Kulturprojektstöd
  foreningstyp: [kultur]
  kategori:
  - kultur
  malgrupp: Juridiska personer (organisationer inom kulturella och kreativa branscher, föreningar och studieförbund) samt
    fysiska personer med F-skattsedel, för tidsbegränsade, publika kulturprojekt/arrangemang i Landskrona
  deadlines:
