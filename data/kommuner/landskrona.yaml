  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.landskrona.se/uppleva-och-gora/kultur/bidrag-stod-och-stipendier/kulturprojektstod/
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'Ansökningar upp till 50 000 kr beslutas av tjänsteperson på kulturförvaltningen, större belopp av kulturnämnden.
    Ska ej förväxlas med föreningarnas ordinarie projektstöd (kulturnämndens regelverk) som är förbehållet bidragsberättigade
    kulturföreningar — detta stöd har en bredare målgrupp. 2026 års första ansökningsrunda: 9 ansökningar om drygt 500 000
    kr, 3 beviljade om totalt 95 000 kr.'
  senast_verifierad: '2026-08-18'
