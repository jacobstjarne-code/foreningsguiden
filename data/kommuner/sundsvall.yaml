- id: sundsvall-kultur-idrottspotten
  namn: Kultur- och idrottspotten
  kategori:
    - kultur
    - idrott
  malgrupp: Privatpersoner, föreningar och företag som vill genomföra ett nytänkande projekt i eller för Sundsvall
  deadlines:
    typ: fasta
    datum:
      - 10-01
  krav:
    - >-
      Sökanden ska vara verksam i Sundsvalls kommun och projektet ska genomföras i Sundsvall eller rikta sig till
      Sundsvallsbor
    - >-
      Projektet ska vara nytänkande inom kultur eller idrott och förstärka, bredda eller fördjupa kommunens kultur-
      och idrottsliv
