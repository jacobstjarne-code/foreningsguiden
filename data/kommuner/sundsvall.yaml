  kalla_url: https://sundsvall.se/kommun/uppleva-och-gora/foreningar-foreningsliv/bidrag-stod-och-stipendier/bidragstyper
  anteckning: 'KORRIGERAD 2026-07-21: uteslöts felaktigt vid föregående körning (2026-07-19) med motiveringen ''engångsutbetalning
    kopplad till specifika vindkraftsavtal, avgränsad till fem tätorter — inte ett återkommande föreningsbidrag''. Det skälet
    finns inte med i den uttömmande listan i §2.4 (individuellt pris till privatperson / endast för företag-privatpersoner
    / annan huvudman) och är därför inte giltigt — geografisk avgränsning och tidsbegränsning är inte godkända uteslutningsskäl.
    Bidraget riktar sig uttryckligen till föreningar och administreras av Sundsvalls kommun på samma sida och med samma ansökningsväg
    som övriga bidragstyper. Ansökningsperiod 8 juni–9 augusti, utbetalning juli/augusti beroende på inlämningsdag. SKRIVET_EJ_I_REGELVERK
    — ingår inte i ''Regler för föreningsbidrag''. Geografiskt avgränsat till fem tätorter kopplat till ett vindkraftsavtal;
    oklart om bidraget återkommer 2027, flaggat för uppföljning vid nästa omverifiering.'
  krav_status: angivet
  krav_fullstandiga: false
