  krav:
  - Arrangemanget ska vara offentligt och annonserat i massmedia eller affischerat
  - Ansökan senast sex veckor före arrangemanget
  - Endast arrangemang av icke-kommersiell natur
  - Ekonomisk redovisning och budget för arrangemanget krävs, senast två månader efter arrangemanget
