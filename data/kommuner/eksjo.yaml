- id: eksjo-lokalbidrag
  namn: Lokalbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar med egna eller hyrda lokaler för medlemmar 7-20 år
  deadlines:
    typ: fasta
    datum:
    - 11-01
  krav:
  - Lokalen/anläggningen ägs eller hyrs av föreningen och används av medlemmar 7-20 år
  - Föreningsägd lokal ska vara öppen för annan verksamhet än föreningens egen, vilket ska framgå av årsredovisningen
  - 'Hyrd lokal: bidrag ges med högst 3 000 kr/år, dock max 80 procent av årskostnaden'
  - Bidrag ges inte för hyror till kommunägda eller kommunalt subventionerade lokaler
  - Föreningsuppgifterna ska vara uppdaterade och godkända av föreningen
  belopp: 'Föreningsägd lokal/anläggning: bidrag enligt riktvärden per anläggningstyp, t.ex. gräsfotbollsplan 29 000 kr, grusplan
