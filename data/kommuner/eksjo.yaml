    omklädningsrum 70-180 kr/kvm, klubbrum 50-90 kr/kvm, belysning fotboll/bandy 16 000 kr. Hyrd lokal: högst 3 000 kr/år,
    max 80% av årskostnaden. Handikapporganisationer: 3 000 kr/år utan krav på ungdomsverksamhet.'
  sen_ansokan: Möjlig upp till 1 månad efter deadline (10% avdrag), upp till 2 månader (20% avdrag), mer än 2 månader ger
    avslag
