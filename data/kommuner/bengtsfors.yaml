- id: bengtsfors-aktivitetsstod
  namn: Aktivitetsstöd till barn- och ungdomsverksamhet
  status: aktiv
  kategori: [idrott, kultur, ovrig]
  foreningstyp: &allatyper [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Bidragsberättigade föreningar med ledarledd gruppverksamhet för barn och unga 5–25 år
  deadlines:
    typ: fasta
    datum: ['02-25', '08-25']
  krav:
  - Gruppen ska bestå av minst tre deltagare 5–25 år och vara naturligt sammansatt, exempelvis ett lag eller en nybörjargrupp
  - Aktiviteten ska pågå minst 60 minuter och innehålla gemensam samling och avslutning
  - Gruppledaren ska vara närvarande och föra närvarokort vid varje sammankomst
  - Samma deltagare får räknas i högst en grupp per dag och förening och en aktivitet får bara redovisas som en sammankomst även om gruppen delas
  - Entrébelagda tävlingar och verksamhet genom studieförbund är inte stödberättigade
  - Närvarokort och kommunens begärda årshandlingar ska bifogas ansökan
  belopp: 55 kr per godkänd sammankomst
  belopp_avser: per_forening
  kommunens_pott: 290 000 kr per år
  sen_ansokan: Ansökan för juli–december ska lämnas senast 25 februari och för januari–juni senast 25 augusti
