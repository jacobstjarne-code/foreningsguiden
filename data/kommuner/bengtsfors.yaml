  beskrivning: Föreningen ska årligen lämna aktuella grunduppgifter, adress och kontaktperson till fritidskontorets föreningsregister. Kommunen publicerar ingen gemensam kalenderdag för uppdateringen.
  system: Interbook Go föreningsregister
  ledtid: null
  ledtid_text: Årlig uppdatering utan publicerad gemensam sista dag
  giltighet: kalenderår
  ordning: 1
  kalla_url: *allmanna
  giltighet_status: kontrollast
- id: bengtsfors-allmanna-villkor
  vad: Uppfyll kommunens allmänna föreningsvillkor
  beskrivning: Föreningen ska vara ideell, ha säte och verksamhet i Bengtsfors kommun, godkända stadgar, vald styrelse och revisorer, vara öppen och demokratisk, ha bedrivit verksamhet i minst sex månader och normalt ha minst tio betalande kommunmedlemmar samt organisationsnummer och eget bank-, bankgiro- eller plusgirokonto.
  system: Bengtsfors kommuns föreningsbidrag
  ledtid: null
  ledtid_text: Minst sex månaders verksamhet innan ordinarie föreningsstöd kan beviljas
  giltighet: kalenderår
  ordning: 2
  kalla_url: *allmanna
  giltighet_status: kontrollast
- id: bengtsfors-arsmoteshandlingar
  vad: Lämna fullständiga årsmötes- och ekonomihandlingar
  beskrivning: Ansökan ska göras av föreningens firmatecknare och innehålla verksamhetsberättelse, årsmötesprotokoll, balans- och resultatrapport samt revisionsberättelse. Kommunen får begära insyn, hålla inne stöd eller återkräva felaktigt beviljade medel och reglerar kommunskuld före utbetalning.
  system: Interbook Go eller aktuell kommunal blankett
  ledtid: null
  ledtid_text: Handlingarna lämnas med ansökan eller registreras för årets bidragsomgång
  giltighet: kalenderår
  ordning: 3
  kalla_url: *allmanna
  giltighet_status: kontrollast
kommunsiffra: null
