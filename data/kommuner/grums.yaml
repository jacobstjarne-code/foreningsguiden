  foreningstyp: [idrott, friluft, ungdom, annat]
  malgrupp: Stödberättigade föreningar som använder kommunala idrottslokaler för träning, barn- och ungdomsverksamhet eller årsmöte
  deadlines:
    typ: fasta
    datum: ['06-01']
  krav:
  - Föreningen ska ha verksamhet och hemvist i Grums kommun och vara godkänd som stödberättigad
  - Den subventionerade taxan gäller träning för deltagare 7–25 år och personer med funktionsnedsättning utan övre åldersgräns samt föreningens årsmöte
  - Stödet gäller kommunens idrottslokaler men inte aktivitetshuset Gruvan
  - Matcher, cuper och andra tävlingar debiteras full taxa
  - Kommersiell verksamhet, föreningsfester och partipolitiska eller religiösa sammankomster omfattas inte
  - Föreningen ska lämna de uppgifter kommunen kräver för kommande års fördelning av lokaltider
