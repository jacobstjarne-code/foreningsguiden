    datum: ['10-01']
  krav:
  - Föreningen ska vara stödberättigad och ha sökt kommunalt aktivitetsstöd minst en gång under föregående år
  - Lokalen eller anläggningen ska ägas, hyras eller drivas av föreningen och vara godkänd med hänsyn till säkerhet, energi och tillgänglighet
