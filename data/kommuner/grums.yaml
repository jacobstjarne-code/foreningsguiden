  - Föregående års faktiska kostnader och intäkter för anläggningen ska redovisas och styrkas
  - Ansökan ska redovisa antalet aktiva medlemmar, sammankomster och deltagartillfällen samt hur anläggningen används
  - Ägarförhållande, hyres- eller nyttjanderättsavtal och föreningens fullständiga årshandlingar ska bifogas när kommunen begär det
