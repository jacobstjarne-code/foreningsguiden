  deadlines:
    typ: fasta
    datum: ['02-25', '08-25']
  krav:
  - Verksamheten ska följa Riksidrottsförbundets principer för lokalt aktivitetsstöd
  - Deltagarna ska vara 7–25 år; någon övre åldersgräns gäller inte för deltagare med funktionsnedsättning
  - Föreningen ska ha minst tio medlemmar i åldern 7–25 år och redovisa minst tio aktiviteter per år
  - Studiecirklar och aktiviteter under skoltid är inte stödberättigade
  - Föreningen ska redovisa närvaro genom IdrottOnline eller kommunens blankett och låta behöriga företrädare intyga uppgifterna
  - Ansökan ska avse föregående halvår och lämnas innan årets anslag har fördelats
