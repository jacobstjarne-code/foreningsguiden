- id: grums-foreningsutvecklingsbidrag
  namn: Föreningsutvecklingsbidrag
  status: aktiv
  kategori: [idrott, ovrig]
  foreningstyp: [idrott]
  malgrupp: Idrottsföreningar i Grums kommun som utvecklar verksamhet eller föreningsdrivna lokaler och anläggningar för barn 7–15 år
  deadlines:
    typ: fasta
    datum: ['04-30']
  krav:
  - Sökanden ska vara en idrottsförening med aktiv verksamhet i Grums kommun för barn 7–15 år
  - Stödet kan avse renovering, ny-, till- eller ombyggnad, maskiner, större inventarier, djur eller verksamhetsutveckling
  - Investeringen eller utvecklingsinsatsen får inte vara påbörjad före beslut
  - Insatser som minskar driftkostnader och miljöpåverkan, ökar tillgänglighet, breddar verksamheten eller stärker folkhälsa och jämställdhet prioriteras
  - Ansökan ska beskriva behov, användning, arbetsinsats, investerings- och driftkalkyl samt innehålla ritningar eller arbetsbeskrivning när det är relevant
  - Möjlig extern finansiering ska sökas och redovisas
  - Stadgar, årsmötesprotokoll, verksamhetsplan, verksamhetsberättelse och en beskrivning av hur projektet stödjer kommunens strategiska mål ska bifogas
  - Projektet ska genomföras och redovisas inom ett år från beslutet
