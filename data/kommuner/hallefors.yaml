  krav:
  - Sökande förening ska ha minst 10 medlemmar i åldern 6–20 år
  - Föreningen ska ha minst 15 medlemmar, registrerade och med betald medlemsavgift under senaste verksamhetsåret
  - Föreningen ska ha varit verksam i minst sex månader och bedriva ideell, allmännyttig verksamhet för kommunens invånare
  - Föreningen ska ha godkända stadgar, vald styrelse och organisationsnummer
  - Minst 51 procent av medlemmarna ska bo i Hällefors kommun och föreningen ska vara registrerad i kommunens föreningsregister
  - Föreningen ska tillhöra en riksorganisation där så är möjligt, vara öppen för alla och präglas av demokratiska principer
  - Föreningen ska följa Hällefors ANDTS-policy och ha plusgiro, bankgiro eller bankkonto
  - Aktiviteten ska bedrivas i Hällefors kommun; bidrag ska sökas senast en månad före genomförandet (två månader för ansökningar
    under vecka 26–32) och kan inte beviljas retroaktivt
