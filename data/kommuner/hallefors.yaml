- namn: Evenemangsstöd
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Aktörer och föreningar som genomför evenemang med betydelse för kommunen
  deadlines:
    typ: okand
    datum: []
  krav:
  - Stödet ska riktas till ett angivet evenemang eller aktivitet
  - Kommunens medel för medfinansiering ska i första hand riktas till förstärkning av marknadsföring och till att ge lokala
    företag/aktörer goda förutsättningar att synas
  - Evenemangets profil ska stämma överens med Hällefors kommuns platsvarumärke/bilden av Hällefors
  - Evenemanget ska vara öppet för allmänheten och aktivt involvera lokala företag/aktörer i en eller flera branscher
  - Arrangören ska presentera en marknadsföringsplan där bilden av Hällefors sprids i regionala, nationella och/eller internationella
    medier
  - Medfinansieringen ska stå i rimlig proportion till arrangörens presenterade budget, särskilt marknadsföringsinsatser
  - Hällefors kommun ska anges som medarrangör vid annonsering och affischering om stöd beviljas
  - Genusperspektivet ska vägas in i beslutet, och arrangören ska redovisa hur marknadsföringsstödet använts
  - Medfinansieringen ska grundas på ett skriftligt avtal mellan Hällefors kommun och arrangören
  - För evenemang under sommarmånaderna juni–augusti ska ansökan vara inne senast i maj för att beslut ska hinna fattas
