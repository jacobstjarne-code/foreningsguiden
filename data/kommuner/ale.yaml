  kalla_url: https://ale.se/download/18.2134b5a919c47ae6ddd30687/1771320172923/Riktlinje%20f%C3%B6r%20f%C3%B6reningsbidrag%20i%20Ale%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Den aktuella webbsidan anger även målgruppen 70 år och äldre, som saknas i den samtidigt gällande riktlinjens kortare uppräkning. Utbetalning sker i slutet av mars respektive oktober.
  alder_min: 6
  alder_max: null
  senast_verifierad: '2026-08-18'
- id: ale-ledarutbildning
  namn: Ledarutbildningsbidrag
  kategori: [idrott, kultur, ovrig]
  malgrupp: Ideella barn- och ungdomsföreningar som utbildar ledare för sin verksamhet.
