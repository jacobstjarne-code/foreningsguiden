- id: ale-byggnadsbidrag-enskild-vag
  namn: Byggnadsbidrag till enskild väg
  kategori: [ovrig]
  malgrupp: Väghållare, däribland samfällighets- och vägföreningar, med en enskild väg av allmänt trafikintresse eller allmän plats med enskilt huvudmannaskap.
  foreningstyp: [annat]
  deadlines: { typ: fasta, datum: [03-01] }
  krav:
  - Projektet ska avse omläggning eller upprustning av en bidragsberättigad enskild väg och ha en kalkylerad kostnad över 1 miljon kr
  - Vägen ska hållas öppen för allmän trafik; för väg utanför detaljplan ska väghållaren förbinda sig att hålla den öppen i minst 20 år efter byggnadsåret
  - Projektet får inte avse ny väg, eftersatt underhåll, väghållarens eget arbete eller kostnader som uppstått före kommunens reservationsbeslut, med undantag för projektering
  - Skriftlig ansökan ska ange byggnadsår och andra sökta stöd samt innehålla ritningar, kostnadsberäkning och nödvändiga myndighetstillstånd eller tillståndsansökan
  - Efter genomförandet ska ekonomisk redovisning, fakturor och kvitton lämnas senast 15 november året efter byggnadsåret
