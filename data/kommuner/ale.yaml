  - Utbildningen ska utveckla föreningens ledare och vara relevant för barn- och ungdomsverksamheten
  - Lokalt anordnad utbildning prioriteras; stöd kan lämnas för föreläsare och utbildningsmaterial
  - Vid distrikts- eller riksorganisationsutbildning kan kursavgift och billigaste resa ersättas
  - Ansökan ska lämnas efter genomförd utbildning och innehålla kursintyg, kursprogram och kvitton
  - Föreningen ska uppfylla kommunens allmänna villkor och vara registrerad i föreningsregistret
  belopp: Högst 5 000 kr per år för förening med färre än 200 medlemmar och högst 8 000 kr per år för förening med fler än 200 medlemmar
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan lämnas så snart som möjligt efter genomförd utbildning och senast 1 december.
  kalla_url: https://ale.se/download/18.2134b5a919c47ae6ddd30687/1771320172923/Riktlinje%20f%C3%B6r%20f%C3%B6reningsbidrag%20i%20Ale%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Riktlinjen anger inte vilken nivå som gäller vid exakt 200 medlemmar; kommunen behöver därför avgöra det gränsfallet.
  senast_verifierad: '2026-08-18'
