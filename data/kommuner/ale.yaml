  kalla_url: https://ale.se/uppleva-och-gora/foreningar-foreningsliv/trygg-forening---bidrag.html
  belopp_status: kontrollast
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Efter det treåriga arbetet kan föreningen fortsätta få ett årligt trygghetsbidrag genom att upprätthålla kraven. Årets bidrag betalas senast 31 december.
  senast_verifierad: '2026-08-18'
