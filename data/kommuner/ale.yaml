- id: ale-aktivitetsbidrag
  namn: Aktivitetsbidrag
  kategori: [idrott, kultur, pensionar, funktionsratt, ovrig]
  malgrupp: Bidragsberättigade föreningar med ledarledda gruppaktiviteter för barn och unga 6–20 år, personer 70 år och äldre eller personer med funktionsnedsättning oavsett ålder.
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [02-28, 08-28] }
  krav:
