  - Minst tre och högst 30 stödberättigade deltagare får räknas per gruppaktivitet; en deltagare får bara räknas i en gruppaktivitet per förening och dag
  - Deltagare ska vara 6–20 år eller 70 år och äldre; för personer med funktionsnedsättning finns ingen åldersgräns
  - Närvaron ska redovisas med fullständigt personnummer för varje deltagare
  - Stöd ges inte för fester, högtidsfiranden, religiös missionerande verksamhet eller politisk verksamhet
  belopp: Ersättning lämnas per deltagartillfälle enligt kommunens beslutade nivå; sammanlagt utbetalat aktivitetsbidrag ska vara minst 1 500 kr
