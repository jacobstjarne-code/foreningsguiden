- id: ale-trygg-forening
  namn: Trygg förening-bidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Ideella barn- och ungdomsföreningar som genomför Ale kommuns treåriga trygghetsarbete tillsammans med RF-SISU.
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  deadlines: { typ: okand, datum: [] }
  krav:
  - Föreningen ska bilda en arbetsgrupp med minst två styrelseledamöter, en ungdom, en förälder och en ledare
  - År 1 ska föreningen ta fram arbetsplan, genomföra workshop och ha rutiner för belastningsregisterutdrag
  - År 2 ska föreningen redovisa och planera trygghetsarbetet, utbilda ledare och informera medlemmar
  - År 3 ska föreningen genomföra utvecklingsmöten, slutföra checklistan och presentera arbetet vid diplomering
  - Belastningsregisterutdrag ska kontrolleras årligen och årets arbete ska redovisas senast 1 december
  belopp: 2 000 kr år 1, 4 000 kr år 2, 8 000 kr år 3 och därefter 2 000 kr per år
  belopp_avser: per_forening
  kommunens_pott: null
