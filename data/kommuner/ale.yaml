- id: ale-driftsbidrag
  namn: Driftsbidrag till föreningsägd anläggning
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar som äger en fritidsanläggning, bygdegård eller annan allmän samlingslokal och ansvarar för driften.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [04-01] }
  krav:
  - Anläggningen ska ägas och drivas av föreningen och uppfylla villkoren för fritidsanläggning eller allmän samlingslokal
  - Ansökan ska redovisa föregående års faktiska kostnader för värme, vatten, sotning, avfall, väg, förbrukningsmaterial och nödvändiga reparationer
  - Reparationer får normalt kosta högst 10 000 kr; större underhåll ska finnas i en plan som tagits fram med kommunens handläggare minst två månader före ansökan
  - Hyresintäkter ska särredovisas och i första hand användas till mindre reparationer, men minskar inte i sig stödet
  - Lokalen ska när den är ledig kunna upplåtas till kommunens verksamheter och andra föreningar till kommunens beslutade taxor
  - Kostnaderna ska styrkas med betalningsunderlag och flera fastigheter ska redovisas var för sig
  belopp: Beräknas på föregående års faktiska stödberättigade driftskostnader; förskott kan betalas med högst 50 procent av föregående års bidrag
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan lämnas senast 1 april. Förskott kan betalas senast 31 mars och resterande bidrag senast 30 juni.
  kalla_url: https://ale.se/download/18.2134b5a919c47ae6ddd30687/1771320172923/Riktlinje%20f%C3%B6r%20f%C3%B6reningsbidrag%20i%20Ale%20kommun.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Anläggningen får inte permanent hyras ut till kommunen eller annan organisation.
  senast_verifierad: '2026-08-18'
