    - 01-20
  krav:
  - Föreningen ska uppfylla de allmänna kraven i kommunens bidragsreglemente
  - Arrangemanget ska vara öppet för allmänheten och genomföras under perioden januari till december
  - En förening får lämna en ansökan per år men den kan omfatta ett eller flera egna eller gemensamma arrangemang
  - Ansökan ska ange belopp och övrig finansiering samt beskriva användning, invånarnytta, inkludering, jämställdhet och barn-, tillgänglighets- och hållbarhetsperspektiv
  - Stödet får användas till arvoden, inköp och andra nödvändiga genomförandekostnader
  - Redovisning med beskrivning, antal arrangemang och besökare samt ekonomiskt utfall ska lämnas inom två månader och senast 31 december
