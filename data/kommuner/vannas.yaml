- id: vannas-boverket-medfinansiering
  namn: Kommunal medfinansiering av Boverkets investeringsbidrag för allmänna samlingslokaler
  status: aktiv
  kategori: [kultur, social, ovrig]
  foreningstyp: *allatyper
  malgrupp: Ideella föreningar och andra organisationer utan vinstsyfte som söker Boverkets investeringsbidrag
  deadlines:
    typ: fasta
    datum: ['10-01']
  krav:
  - Ansökan ska avse en allmän samlingslokal i Vännäs kommun som organisationen äger eller disponerar genom långsiktig nyttjanderätt
  - Lokalen ska vara tillgänglig för föreningsliv, möten, studier, kulturarrangemang eller fritidsaktiviteter
  - En sökande förening ska vara registrerad i kommunens register; organisationen ska ha eget organisationsnummer och konto samt vara skuldfri hos kommunen
  - Åtgärden ska vara stödberättigad hos Boverket och den kompletta Boverketansökan ska bifogas
  - Boverket måste bevilja investeringsbidraget och dess godkända slutredovisningsbeslut ska senare lämnas till kommunen
  - Underkänd slutredovisning medför full återbetalning och kommunens stöd ska framgå i marknadsföringen
  belopp: Minst 30 procent av den projektkostnad som Boverket godkänner; stödet kan vara ekonomiskt eller likvärdigt
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska vara kommunstyrelseförvaltningen tillhanda senast 1 oktober; sena ansökningar behandlas inte
  kalla_url: https://vannas.se/kultur-och-fritid/foreningsliv-och-foreningar/stod-bidrag-och-stipendium/investeringsbidrag-via-boverket
