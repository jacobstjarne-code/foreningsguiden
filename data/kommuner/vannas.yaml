- id: vannas-sammankomstbidrag
  namn: Sammankomstbidrag
  status: aktiv
  kategori: [idrott, kultur, social, funktionsratt, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar som ordnar aktiviteter för barn och unga 6–25 år eller personer med funktionsnedsättning
  deadlines:
    typ: fasta
    datum: ['02-25', '08-25']
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor och aktiviteten ska genomföras som en del av föreningens verksamhet
  - Aktiviteten ska ledas av en ledare som är minst 13 år
  - Sammankomsten ska pågå minst 45 minuter och ha minst tre deltagare utöver ledaren i åldern 6–25 år eller anordnas för personer med funktionsnedsättning oavsett ålder
  - En naturlig grupp får inte delas och bidrag betalas endast en gång per dag och grupp
  - Studiecirkelverksamhet och aktiviteter i samarbete med skolan under skoltid är inte stödgrundande
  - Underlagen ska sparas i tre år för kommunens stickprovskontroll
  belopp: 50 kr per bidragsberättigad sammankomst
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan för 1 juli–31 december ska lämnas senast 25 februari och för 1 januari–30 juni senast 25 augusti
  kalla_url: https://vannas.se/kultur-och-fritid/foreningsliv-och-foreningar/stod-bidrag-och-stipendium/sammankomstbidrag
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
