- id: vannas-ungdomsstiftelse
  namn: Bidrag från Östen Berglunds ungdomsstiftelse
  kategori:
  - kultur
  - ovrig
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: fasta
    datum:
    - 10-09
  krav:
  - Mottagare kan vara enskild under 20 år, grupp av enskilda under 20 år eller förening som har eller planerar att starta
    verksamhet riktad till barn och ungdomar under 20 år
  - Enskild eller grupp av enskilda ska vara folkbokförd i Vännäs kommun för att kunna beviljas medel
  - Föreningen ska vara registrerad i Vännäs kommun och/eller ha verksamhet i Vännäs kommun för att kunna beviljas medel
  - Medel som mottas ska endast riktas till verksamhet som är fri från alkohol, tobak, narkotika och doping
  - Ansökan ska innehålla uppgift om vad mottagaren avser använda medlen till
  belopp: Inget fast belopp - stiftelsen delar ut avkastningen av stiftelsekapitalet; efter de första 20 åren högst 5 % av
    ursprungskapitalet per år
