  senast_verifierad: '2026-08-19'
  anteckning: Kommunens medfinansiering förutsätter budgetutrymme och bifall från Boverket.
  kraver_registrering: true
  sate_i_kommunen: true
- id: vannas-kulturforening-verksamhetsbidrag
  namn: Verksamhetsbidrag för ideella kulturföreningar 2026–2028
  status: aktiv
  kategori: [kultur]
  foreningstyp: [kultur, hembygd]
  malgrupp: Etablerade ideella kulturföreningar som löpande breddar kulturutbudet för Vännäs invånare
  deadlines:
    typ: fasta
    datum: ['04-15']
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor och ha varit verksam i minst fem år
  - Föreningen ska vara ansluten till en riksorganisation eller motsvarande; undantag kan beviljas efter särskild prövning
  - Verksamheten ska ge invånarna kulturupplevelser vid flera tillfällen per år och komplettera eller bredda kommunens kulturutbud
  - Föreningen ska synliggöra verksamheten, publicera evenemang på Visit Vännäs eller enligt överenskommelse och arbeta mot verksamhetsplanens mål
  - Ansökan ska innehålla stadgar, signerat årsmötesprotokoll, verksamhetsplan samt föregående års verksamhets-, revisions- och ekonomihandlingar
  - Föreningen ska årligen återrapportera användningen samt lämna verksamhetsberättelse, resultat- och balansräkning och verksamhetsplan senast 31 mars
  belopp: Högst två prisbasbelopp per år under den treåriga överenskommelsen 2026–2028
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan för avtalsperioden 2026–2028 skulle lämnas senast 15 april 2026
  kalla_url: https://vannas.se/download/18.7b0b1b7219cfccb61f5201/1774512615728/Verksamhetsbidrag%20f%C3%B6r%20ideella%20kulturf%C3%B6reningar,%20riktlinje%20och%20bed%C3%B6mningskriterier.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
