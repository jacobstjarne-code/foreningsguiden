  anteckning: Reglerna är öppna för alla föreningstyper och kräver inte anslutning till idrottsrörelsen.
  kraver_registrering: true
  sate_i_kommunen: true
- id: vannas-fri-lokalhyra
  namn: Fri lokalhyra
  status: aktiv
  kategori: [idrott, kultur, social, funktionsratt, ovrig]
  foreningstyp: *allatyper
  malgrupp: Föreningar med sammankomstbidrag och stödgrundande verksamhet i kommunens lokaler och anläggningar
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska uppfylla kommunens allmänna villkor och vara berättigad till sammankomstbidrag
  - Föreningen ska ha minst 20 aktiviteter per år; kravet gäller inte verksamhet för personer med funktionsnedsättning
  - Den fria hyran gäller lokaler och anläggningar som ägs och drivs av Vännäs kommun
  - Fri hyra gäller inte verksamhet med enbart deltagare över 25 år, om de inte är ledare eller har funktionsnedsättning
  - En bokad tid som inte utnyttjas debiteras enligt ordinarie taxa
  - I ishallen gäller den fria hyran endast föreningar vars huvudsakliga verksamhet bedrivs på is
  belopp: Fri hyra i kommunägda och kommunalt drivna lokaler och anläggningar
