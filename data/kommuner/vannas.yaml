  anteckning: En beviljad förening har som utgångspunkt inte rätt till ytterligare kommunal sponsring eller kulturarrangemangsbidrag under avtalsperioden.
  kraver_registrering: true
  sate_i_kommunen: true
- id: vannas-studieforbund
  namn: Bidrag till studieförbund
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, social, annat]
  malgrupp: Statsbidragsberättigade studieförbund med lokalt förankrad verksamhet i Vännäs kommun
  deadlines:
    typ: fasta
    datum: ['05-01']
  krav:
  - Studieförbundet ska ingå i Folkbildningsrådet, få statsbidrag och ha lokal förankring för planering och ledning
  - Bidrag ges endast för verksamhet i Vännäs kommun och ska användas till kostnader direkt knutna till verksamheten
  - Bidraget får inte förmedlas som ekonomisk förmån till enskilda deltagare, grupper eller föreningar
  - Skollik, institutionsfinansierad eller kommersiell verksamhet samt fritidsaktiviteter som får stöd på annat sätt är uteslutna
  - Verksamhetsredovisningen ska beskriva föregående års lokala verksamhet och komplettera statistiken
  - Kommunen kan begära ytterligare handlingar och nya studieförbund beslutas första året i särskild ordning
