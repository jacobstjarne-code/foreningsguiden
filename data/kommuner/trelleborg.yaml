- id: trelleborg-arrangorsbidrag-kultur
  namn: Arrangörsbidrag kulturverksamhet
  foreningstyp: [kultur, hembygd]
  kategori:
  - kultur
  malgrupp: Föreningar med kultur som kärnverksamhet (musik, dans, konst, teater, film, kulturarv eller litteratur) som arrangerar
    publika kulturarrangemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska ha kultur som kärnverksamhet (musik, dans, konst, teater, film, kulturarv eller litteratur)
  - Arrangemanget ska vara publikt, präglas av kvalitet och bidra till ett brett utbud som intresserar allmänheten i Trelleborg
  - En tydlig plan för arrangemanget ska bifogas ansökan
  - Beviljas inte till investeringar i lokaler/utrustning som efteråt berikar föreningen, arrangemang med övervägande religiös
    eller politisk inriktning, stödgalor där överskott går till välgörenhetsorganisationer, arrangemang med kommersiellt vinstsyfte,
    arrangemang inom utbildning/forskning, eller renodlade pedagogiska arrangemang (t.ex. studiecirkelform)
  belopp: Belopp beslutas efter prövning och beviljas i mån av kvarvarande årsbudget; inget fast belopp publiceras
  belopp_avser: per_forening
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.trelleborg.se/app/uploads/2023/08/riktlinje-for-bidrag-till-foreningar-inom-trelleborgs-kommun-2025-version.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan görs löpande under året, dock senast 30 september för arrangemang under innevarande år. Medel beviljas
    i mån av kvarvarande årsbudget. Beviljat bidrag ska redovisas till kultur- och fritidsförvaltningen senast 31 januari
    nästföljande år. Verifierat oförändrat vid omkörning 2026-07-21.
  senast_verifierad: '2026-08-18'
