- id: trelleborg-en-miljon-ideer-foreningsbidrag
  namn: Föreningsbidrag inom En miljon idéer (medborgarbudget)
  kategori:
  - ovrig
  malgrupp: 'Föreningar i det landsbygdsområde som är aktuellt för årets omgång av medborgarbudgeten En miljon idéer (2026:
    norra landsbygdsområdet, som sträcker sig från Skåre i väster, över Skegrie och Anderslöv, till Gärdslöv i nordost) —
    kan söka bidrag för sociala arrangemang/aktiviteter samt föreslå fysiska investeringar'
  deadlines:
    typ: fasta
    datum:
    - 02-15
  krav:
  - Föreningen ska ha antagit skriftliga stadgar
  - Föreningen ska ha haft årsmöte där verksamhets- och revisionsberättelser samt resultat- och balansräkning har godkänts
  - Föreningen ska ha minst tio matrikelförda medlemmar
  - Föreningen ska ha verksamhet som bedrivs under större delen av året
  - Förslaget måste få minst 50 röster i den efterföljande demokratiska omröstningen för att genomföras
  belopp: Högst 20 000 kronor per förening och år
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.trelleborg.se/kommun-politik/en-miljon-ideer/foreningsbidrag-inom-en-miljon-ideer/
  belopp_status: angivet
  deadline_status: angivet
  krav_status: angivet
  krav_fullstandiga: false
  anteckning: 'SAKNADES HELT I FÖREGÅENDE VERSION — hittades under ''Kommun och politik'' (Kommunledningsförvaltningen), inte
    under kultur- och fritidsförvaltningens ordinarie bidragsspår, vilket sannolikt är varför det missades tidigare. Medborgarbudgeten
    ersatte 2020 en tidigare landsbygdsmiljön-fond och roterar mellan kommunens landsbygdsområden — endast föreningar i det
    aktuella området kan söka en given omgång; 2026 gäller norra landsbygdsområdet, tidigare år bl.a. södra landsbygdsområdet.
    KÄLLKONFLIKT (§2.5), delvis löst: förslagsinlämningens startdatum (15 februari) är identiskt i en nyhetsartikel om 2025
    års omgång och i kommunens nuvarande sida för 2026 — skrivet som fast deadline här. Slutdatum för inlämning skiljer sig
    mellan källorna (2025-artikeln anger 15 mars; 2026-sidan anger ingen egen slutdag för inlämning, bara röstningsperiod
    15 april–15 maj) och ingen källa har ett synligt revisionsdatum — inte skrivet som fast datum, verifiera aktuellt slutdatum
    direkt mot kommunens sida inför varje omgång. Administreras via enmiljonideer@trelleborg.se, inte Rbok. Föreningsförslag
    delar en gemensam årlig pott på 250 000 kronor inom medborgarbudgeten En miljon idéer. Den gemensamma potten är inte ett
    tak per förening.'
  senast_verifierad: '2026-08-03'
  giltighet_status: overifierat
- id: trelleborg-iop
  namn: Idéburet offentligt partnerskap (IOP)
  kategori:
  - social
  - ovrig
  malgrupp: Etablerade ideella organisationer med lokal förankring i Trelleborg som kan bidra till att lösa en definierad
    samhällsutmaning tillsammans med kommunen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Både föreningen och kommunen ska bidra med resurser, till exempel finansiering, lokaler eller ideellt arbete
  - Insatsen ska syfta till allmännytta och adressera en samhällsutmaning där en färdig lösning saknas
  - Passar inte när kommunen enbart köper en tjänst av föreningen — då gäller upphandling, inte IOP
  belopp: null
  sen_ansokan: Ej tillämpligt (löpande dialog, inget fast ansökningsdatum)
  kalla_url: https://www.trelleborg.se/uppleva-gora/foreningar/ideburet-offentligt-partnerskap-iop/
  belopp_status: overifierat
  deadline_status: angivet
  krav_status: angivet
  krav_fullstandiga: false
  anteckning: 'SAKNADES HELT I FÖREGÅENDE VERSION. Inte ett traditionellt sökbart bidrag med fast belopp/deadline, utan ett
    förhandlat samverkansavtal som initieras via dialog med kommunen — inkluderad som bidragsform i linje med hur Växjö kommuns
    motsvarande IOP-post hanteras i denna filserie (RESEARCH_SPEC_v2 §2.4: att formen avviker från en traditionell ansökan
    är inte ett giltigt uteslutningsskäl). Fyra aktiva partnerskap vid denna körning: Brottsofferjouren Söderslätt, Föräldraföreningen
    mot narkotika, Kvinnojouren Söderslätt, Trelleborgs FF.'
  senast_verifierad: '2026-08-03'
  giltighet_status: overifierat
forutsattningar:
- id: trelleborg-bidragsberattigad-forening
  vad: Bli registrerad som bidragsberättigad förening
  beskrivning: 'Föreningen fyller i en föreningsregistrering på hemsidan och skickar in undertecknat protokoll från konstituerande
    årsmöte, föreningens antagna stadgar, bekräftelse från Skatteverket på tilldelat organisationsnummer, bekräftelse från
    föreningens bank på tilldelat bankgiro/bankkonto, i förekommande fall bekräftelse på medlemskap i riksorganisation, samt
    föreningens adress, e-post och uppgifter till utsedd kontaktperson. Grundkrav enligt riktlinjen: säte i Trelleborgs kommun,
    stadgar godkända av årsmötet, icke vinstdriven, uppdaterad medlemsmatrikel, minst tio medlemmar, årlig medlemsavgift lägst
    50 kronor per medlem, registrerad hos Skatteverket med organisationsnummer, bankkonto/bankgiro/plusgiro i föreningens
    namn, stadgeenligt vald styrelse och valda revisorer, ordnad ekonomi med årlig redovisning, inte i konkurs eller likvidation.
    Nystartad förening ska genomgå grundutbildning i styrelsearbete samt en introduktion av bidragsbestämmelser från kultur-
    och fritidsförvaltningen; utbildningsbevis eller motsvarande ska uppvisas. Denna registrering krävs för de sex kultur-
    och fritidsbidragen ovan — vägbidraget, En miljon idéer och IOP har egna, separata processer (se respektive bidrags anteckning).'
  system: Rbok
  ledtid: null
  ledtid_text: null
  giltighet: Uppgifterna i föreningsregistret måste aktivt godkännas varje tolvmånadersperiod för att ansökan om bidrag ska
    vara möjlig.
  ordning: 1
  kalla_url: https://www.trelleborg.se/app/uploads/2023/08/riktlinje-for-bidrag-till-foreningar-inom-trelleborgs-kommun-2025-version.pdf
  giltighet_status: angivet
