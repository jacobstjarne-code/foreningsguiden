- id: trelleborg-en-miljon-ideer-foreningsbidrag
  namn: En miljon idéer — sociala arrangemang och aktiviteter
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - ovrig
  malgrupp: Föreningar i södra landsbygdsområdet, som är aktuellt för 2026 års omgång av medborgarbudgeten En miljon idéer, och vill genomföra sociala arrangemang eller aktiviteter
  deadlines:
    typ: fasta
    datum:
    - 03-15
  krav:
  - Föreningen ska ha antagit skriftliga stadgar
  - Föreningen ska ha haft årsmöte där verksamhets- och revisionsberättelser samt resultat- och balansräkning har godkänts
  - Föreningen ska ha minst tio matrikelförda medlemmar
  - Föreningen ska ha verksamhet som bedrivs under större delen av året
  - Arrangemanget eller aktiviteten ska vara öppet för allmänheten och etablera nytt, utöka eller utveckla något befintligt
  - Förslaget måste få minst 50 röster i den efterföljande demokratiska omröstningen för att genomföras
  - Förslaget ska genomföras inom ett år från utbetalning och slutredovisas med beskrivning, bilder och kvitton
  belopp: "Högst 20 000 kronor per förening och år"
  belopp_avser: per_forening
  kommunens_pott: "Föreningsförslag delar gemensam pott på 250 000 kronor"
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.trelleborg.se/kommun-politik/en-miljon-ideer/foreningsbidrag-inom-en-miljon-ideer/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Förslagsinlämningen 2026 pågår 15 februari–15 mars, följd av bearbetning och omröstning 15 april–15 maj.
  senast_verifierad: '2026-08-18'
- id: trelleborg-en-miljon-ideer-fysisk-investering
  namn: En miljon idéer — fysisk investering genom förening
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - ovrig
  malgrupp: Föreningar i södra landsbygdsområdet, som är aktuellt för 2026 års omgång av medborgarbudgeten En miljon idéer, och vill genomföra och underhålla en fysisk investering
  deadlines:
    typ: fasta
    datum:
    - 03-15
  krav:
  - Föreningen ska ha skriftliga stadgar, årsmöte, minst tio matrikelförda medlemmar och verksamhet under större delen av året
  - Investeringen ska avse natur, mötesplatser eller infrastruktur, vara till för en bred målgrupp och komma många till del
  - Förslaget ska följa lagar, ligga inom kommunens ansvarsområde och vara möjligt att genomföra
  - Förslaget måste få minst 50 röster i omröstningen för att kunna genomföras
  - Föreningen ansvarar för byggande och underhåll om förslaget röstas fram
  belopp: Föreningens bidrag beslutas efter omröstning och prövning; inget fast belopp per förening publiceras
  belopp_avser: per_forening
  kommunens_pott: Fysiska investeringar och sociala aktiviteter delar en föreningsbidragspott på 250 000 kronor under 2026 respektive 2027
  sen_ansokan: Förslag lämnas 15 februari–15 mars 2026
  kalla_url: https://www.trelleborg.se/kommun-politik/en-miljon-ideer/ramar-for-ideskapandet/
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Förslagsinlämningen följs av kommunens bearbetning och en omröstning 15 april–15 maj.
  senast_verifierad: '2026-08-18'
- id: trelleborg-iop
  namn: Idéburet offentligt partnerskap (IOP)
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  kategori:
  - social
  - ovrig
  malgrupp: Etablerade ideella organisationer med lokal förankring i Trelleborg som kan bidra till att lösa en definierad
    samhällsutmaning tillsammans med kommunen
  deadlines:
    typ: okand
    datum: []
  krav:
  - Både föreningen och kommunen ska bidra med resurser, till exempel finansiering, lokaler eller ideellt arbete
  - Insatsen ska syfta till allmännytta och adressera en samhällsutmaning där en färdig lösning saknas
  - Passar inte när kommunen enbart köper en tjänst av föreningen — då gäller upphandling, inte IOP
  belopp: Parterna avtalar vilka resurser var och en bidrar med, exempelvis pengar, lokal eller ideellt arbete; inget fast belopp publiceras
  belopp_avser: per_forening
  sen_ansokan: Ej tillämpligt (löpande dialog, inget fast ansökningsdatum)
  kalla_url: https://www.trelleborg.se/uppleva-gora/foreningar/ideburet-offentligt-partnerskap-iop/
  belopp_status: ingen_regel
  deadline_status: ingen_regel
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: IOP är en gemensamt framtagen samverkansöverenskommelse, inte en vanlig bidragsansökan med fast belopp eller sista ansökningsdag.
  senast_verifierad: '2026-08-18'
forutsattningar:
- id: trelleborg-bidragsberattigad-forening
  vad: Bli registrerad som bidragsberättigad förening
  beskrivning: 'Föreningen fyller i en föreningsregistrering på hemsidan och skickar in undertecknat protokoll från konstituerande
    årsmöte, föreningens antagna stadgar, bekräftelse från Skatteverket på tilldelat organisationsnummer, bekräftelse från
    föreningens bank på tilldelat bankgiro/bankkonto, i förekommande fall bekräftelse på medlemskap i riksorganisation, samt
    föreningens adress, e-post och uppgifter till utsedd kontaktperson. Grundkrav enligt riktlinjen: säte i Trelleborgs kommun,
    stadgar godkända av årsmötet, icke vinstdriven, uppdaterad medlemsmatrikel, minst tio medlemmar, årlig medlemsavgift lägst
    50 kronor per medlem, registrerad hos Skatteverket med organisationsnummer, bankkonto/bankgiro/plusgiro i föreningens
    namn, stadgeenligt vald styrelse och valda revisorer, ordnad ekonomi med årlig redovisning, inte i konkurs eller likvidation.
    Nystartad förening ska genomgå grundutbildning i styrelsearbete samt en introduktion av bidragsbestämmelser från kultur-
    och fritidsförvaltningen; utbildningsbevis eller motsvarande ska uppvisas. Denna registrering krävs för de sex kultur-
    och fritidsbidragen ovan — vägbidraget, En miljon idéer och IOP har egna, separata processer (se respektive bidrags anteckning).'
