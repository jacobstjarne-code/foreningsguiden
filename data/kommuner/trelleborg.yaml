bidrag:
- id: trelleborg-verksamhetsbidrag-barn-ungdom
  namn: Verksamhetsbidrag barn- och ungdomsverksamhet
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  kategori:
  - idrott
  - kultur
  - funktionsratt
  - ovrig
  malgrupp: Bidragsberättigade föreningar med minst tre deltagare i åldern 4–20 år (ingen övre åldersgräns för personer med
    funktionsnedsättning) och minst tio bidragsberättigade aktiviteter per halvår
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska vara godkänd bidragsberättigad förening
  - Minst tre deltagare i bidragsberättigad ålder (4–20 år, ingen övre åldersgräns för personer med funktionsnedsättning)
  - Minst tio bidragsberättigade aktiviteter per halvår
  - Aktivitet ska vara planerad av styrelse, sektion eller motsvarande och vara minst 45 minuter
  - Verksamheten ska bedrivas inom Trelleborgs kommun för samtliga deltagare under större delen av året
  - Deltagare ska vara medlem i föreningen och ha erlagt medlemsavgift
  belopp: Belopp per deltagare och per aktivitet fastställs vid varje bidragsfördelning och beror på antalet ansökningar, deltagare och deltagartillfällen
  belopp_avser: per_forening
  sen_ansokan: Ansökan som inkommer efter ansökningstidens utgång behandlas restriktivt och prövas i varje enskilt fall. En
    upprepad sen ansökan kommer att avslås.
  kalla_url: https://www.trelleborg.se/app/uploads/2023/08/riktlinje-for-bidrag-till-foreningar-inom-trelleborgs-kommun-2025-version.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan görs senast 25/8 för perioden 1/1-30/6 samt senast 25/2 för perioden 1/7-31/12. Beloppet per deltagare/aktivitet
    fastställs av förvaltningen vid varje bidragsfördelning och kan ändras beroende på totalt antal ansökningar. Representant
    för föreningen ska närvara vid föreningsträff som förvaltningen kallar till — uteblivande reducerar bidraget med 10 procent
    för nästkommande termin. Verifierat oförändrat vid omkörning 2026-07-21.
  senast_verifierad: '2026-08-18'
- id: trelleborg-lokalbidrag-egenagd
  namn: Lokalbidrag ungdomsverksamhet — egenägd lokal
  foreningstyp: [idrott, kultur, friluft, social, ungdom, annat]
  kategori:
  - idrott
  - kultur
  - funktionsratt
  - ovrig
  malgrupp: Bidragsberättigade föreningar som äger egen lokal eller anläggning för ungdomsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Föreningen ska vara godkänd bidragsberättigad förening
  - Avtal om inköp av lokal ska i förväg godkännas av kultur- och fritidsnämnden för att kostnaderna ska vara bidragsberättigade
  - Hyresintäkter ska redovisas i ansökan
  - Utebliven redovisning av aktiviteter enligt villkor för verksamhetsbidrag medför att lokalbidrag inte kan beviljas
  - Bidrag utgår inte för hyra eller skötsel av lokal när kommunen hyr ut lokalen
  belopp: 75 procent av kultur- och fritidsnämndens godkända lokalkostnader (lokalhyra, konsumtionsavgifter, räntekostnad,
    försäkring, städkostnader högst 1 200 kronor inklusive förbrukningsartiklar), max 8 000 kronor, dock högst 150 kronor
    per bidragsberättigad medlem (4–20 år, ingen åldersgräns vid funktionsnedsättning) som erlagt medlemsavgift
  belopp_avser: per_forening
  sen_ansokan: Ansökan som inkommer efter ansökningstidens utgång behandlas restriktivt och prövas i varje särskilt fall.
    En upprepad sen ansökan föranleder avslag.
  kalla_url: https://www.trelleborg.se/app/uploads/2023/08/riktlinje-for-bidrag-till-foreningar-inom-trelleborgs-kommun-2025-version.pdf
  belopp_status: kontrollast
