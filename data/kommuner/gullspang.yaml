bidrag:
- id: gullspang-foreningsbidrag
  namn: Föreningsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Ungdomsföreningar, intresseföreningar och samhällsföreningar
  deadlines:
    typ: fasta
    datum:
    - 01-15
    - 04-01
  krav:
  - Föreningen ska bedriva sin verksamhet inom kommunen samt vara registrerad i kommunens föreningsregister
  - Föreningen har antagit föreningsstadgar samt har en vald styrelse
  - Föreningen ska bedriva sin verksamhet i en drogfri miljö
  - Föreningen tillämpar demokratiska principer
  - Föreningen ska vara politiskt och religiöst obunden
  - Föreningen är öppen för alla människor oavsett nationalitet, trosuppfattning eller sexuell läggning
  - Föreningen främjar jämställdheten mellan män och kvinnor
  - Föreningen främjar integration
  - Idrottsföreningar som bedriver ungdomsverksamhet ska för varje bidragsår också söka Statligt lokalt aktivitetsstöd (LOK)
    för sin verksamhet
  belopp: 'Minst 3 000 kr per förening (generellt minimibelopp, gäller ej lokal- och anläggningsbidraget). Idrottsföreningar
    med ungdomsverksamhet: verksamhetsbidrag baserat på antal sammankomster och deltagande medlemmar, samt lokal- och anläggningsbidrag
    på 45–75 % av godkända kostnader beroende på antal sammankomster (lägst 5 000 kr, dock högst åtta gånger verksamhetsbidraget).
    Övriga intresse- och samhällsföreningar: bidrag per redovisad medlem.'
  sen_ansokan: Ej möjlig efter 1 april
  kalla_url: https://gullspang.se/download/18.162482e11991398bf5452d1/1764334553844/Riktlinje%20för%20föreningsbidrag.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: gullspang-investeringsbidrag
  namn: Investeringsbidrag
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar för utrustning, inventarier, anläggningar
  deadlines:
    typ: fasta
    datum:
    - 04-30
    - 11-01
  krav:
  - Bidrag ges för högst 30 % av den totala investeringskostnaden
  - Ansökan görs på avsedd blankett tillhandahållen av kommunen
  - Ansökan ska ha kommit in senast 30 april för att ingå i första prioriteringsomgången; därefter kan ansökan lämnas löpande
    till dess medlen tar slut, dock senast 1 november
  - Föreningen får inte påbörja eller ha genomfört investeringen innan ansökan har kommit in till kommunen
  - Föreningens senaste årsredovisning (verksamhetsberättelse, balans- och resultatrapport, revisionsberättelse, årsmötesprotokoll)
    ska bifogas ansökan
  - Vid om- och tillbyggnad av anläggningar och lokaler ska föreningen även ha sökt bidrag från en eller flera andra organisationer
    eller myndigheter, styrkt skriftligen
  - Efter genomförd investering ska kostnaderna redovisas med fakturor, dokumentation av det färdiga resultatet samt betalningskvitton
  belopp: Högst 30 % av den totala investeringskostnaden
  sen_ansokan: Ansökan kan lämnas löpande under året till och med 1 november
  kalla_url: https://gullspang.se/download/18.162482e11991398bf5452d2/1757486872650/Riktlinjer%20för%20investeringsbidrag.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: gullspang-arrangorsstod
  namn: Arrangörsstöd
  kategori:
  - kultur
  - idrott
  - ovrig
  malgrupp: Föreningar som arrangerar offentliga arrangemang i Gullspångs kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Ansökan ska lämnas in minst en månad innan arrangemanget
  - Arrangemanget ska vara offentligt, öppet för vem som helst, och genomföras inom kommunen
  - Politiska partier och politiska lobbyorganisationer kan inte få stödet
  - Stödet utgår inte för arrangemang som kan uppfattas som odemokratiska eller kränkande
  - Föreningar kan ansöka om arrangörsstödet högst två gånger per år
  - Retroaktiva stöd beviljas inte
  - Slutredovisning ska göras senast två månader efter att arrangemanget är genomfört
  belopp: Högst 5 000 kronor per tillfälle
  sen_ansokan: Minst en månad före arrangemanget
  kalla_url: https://gullspang.se/uppleva-och-gora/foreningsliv-och-foreningar/arrangorsstod
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kan användas för marknadsföring samt exempelvis lokal, utrustning eller tillstånd.
