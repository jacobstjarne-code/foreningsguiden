- id: gullspang-foreningspris
  namn: Gullspångs kommuns föreningspris
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  foreningstyp: *alla
  malgrupp: Ideella föreningar med verksamhet i Gullspångs kommun
  deadlines:
    typ: fasta
    datum:
    - 03-20
  krav:
  - Mottagaren ska vara en ideell förening med stadgar och demokratiskt vald styrelse, huvudsaklig verksamhet i kommunen och registrering i föreningsregistret
  - Föreningen ska ha varit aktiv i minst ett år, ha ordnad ekonomi och vara öppen för alla som delar föreningens syfte
  - Verksamheten ska präglas av jämställdhet, trygghet och drogfrihet samt vara politiskt och religiöst obunden
  - Föreningen får inte ha fått kommunens föreningspris under de senaste fem åren
  - Bedömningen omfattar engagemang och samhällsnytta, samverkan, utveckling, långsiktighet, inkludering, trygghet och folkhälsa
  - Nomineringen ska innehålla föreningens namn och kontaktuppgifter samt en motivering
  belopp: 5 000 kr, diplom och blombukett
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Nominering tas emot 1 januari–20 mars
