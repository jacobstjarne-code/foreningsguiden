  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
- id: gullspang-arrangorsstod
  namn: Arrangörsstöd
  kategori:
  - kultur
  - idrott
  - ovrig
  foreningstyp: *alla
  malgrupp: Föreningar som arrangerar offentliga arrangemang i Gullspångs kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Ansökan ska lämnas in minst en månad innan arrangemanget
  - Arrangemanget ska vara offentligt, öppet för vem som helst, och genomföras inom kommunen
  - Politiska partier och politiska lobbyorganisationer kan inte få stödet
  - Stödet utgår inte för arrangemang som kan uppfattas som odemokratiska eller kränkande
  - Föreningar kan ansöka om arrangörsstödet högst två gånger per år
  - Retroaktiva stöd beviljas inte
  - Slutredovisning ska göras senast två månader efter att arrangemanget är genomfört
  belopp: Högst 5 000 kronor per tillfälle
  belopp_avser: per_forening
  kommunens_pott: 200 000 kr avsatt till arrangörsstöd 2026
  sen_ansokan: Minst en månad före arrangemanget
  kalla_url: https://gullspang.se/uppleva-och-gora/foreningsliv-och-foreningar/arrangorsstod
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Kan användas för marknadsföring samt exempelvis lokal, utrustning eller tillstånd.
  senast_verifierad: '2026-08-23'
- id: gullspang-bygdegards-och-folketshusbidrag
  namn: Bidrag till bygdegårds- och Folkets Hus-föreningar
  kategori:
  - kultur
  - social
  - ovrig
  foreningstyp: [kultur, hembygd, social, annat]
  malgrupp: Ideella föreningar som driver bygdegård, Folkets Hus eller motsvarande allmän samlingslokal
  deadlines:
    typ: fasta
    datum:
    - 04-01
  krav:
  - Föreningen ska bedriva verksamhet i Gullspångs kommun, vara registrerad i kommunens föreningsregister och ha stadgar samt vald styrelse
  - Föreningen ska vara demokratiskt uppbyggd, politiskt och religiöst obunden samt främja inkludering, jämställdhet och integration
  - Kärnverksamheten ska vara uthyrning av den egna lokalen eller offentliga arrangemang i den egna lokalen
  - Verksamheten får inte bedrivas kommersiellt eller redan finansieras i oskäligt hög grad av annan kommunal eller statlig aktör
  - Ansökan bedöms utifrån samhällsnytta i relation till kostnader och tidigare stöd, bland annat antal uthyrningar, egna arrangemang,
    deltagande, verksamhetens bredd och kvalitet samt hur väl föreningen når och informerar målgrupper
  - Kommunen kan begära detaljerad redovisning av uthyrningarna och skriftlig motivering om föreningen åberopar särskilda skäl för undantag
  belopp: Individuellt bedömt efter lokalens samhällsnytta, föreningens kostnader, tidigare bidrag och kommunens årliga föreningsbudget
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioden för föreningsbidrag är 15 januari–1 april
  kalla_url: https://gullspang.se/download/18.162482e11991398bf5452ca/1764334404987/Riktlinjer%20f%C3%B6r%20bidrag%20till%20bygdeg%C3%A5rds-%20och%20folketshusf%C3%B6reningar%20eller%20motsvarande.pdf
  belopp_status: kontrollast
