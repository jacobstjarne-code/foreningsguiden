  namn: Grundbidrag
  foreningstyp: [idrott, kultur, hembygd, friluft, ungdom, annat]
  kategori: [idrott, kultur, ovrig]
  malgrupp: Bidragsberättigade ideella föreningar med verksamhet för barn, unga eller personer som är 65 år eller äldre
  deadlines:
    typ: fasta
    datum: [09-30]
  krav:
  - Föreningen ska ha varit verksam i minst ett år och vara registrerad som bidragsberättigad i Avesta kommun
  - Föreningen ska ha minst 10 betalande medlemmar samt vara öppen, demokratiskt uppbyggd och bedriva ideell verksamhet utan vinstsyfte
  - Idrotts- och friluftsföreningar som söker för medlemmar 65 år eller äldre ska sedan minst ett år bedriva kontinuerlig verksamhet för barn och unga
  - Kulturföreningars verksamhet för barn, unga eller personer som är 65 år eller äldre ska omfatta minst 10 workshoppar eller studiecirkeltillfällen per år
  belopp: 15 kr per medlem till och med 25 år och 15 kr per medlem från 65 år, högst 10 000 kr per förening och år
