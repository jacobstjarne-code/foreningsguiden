- id: avesta-omsorgsforeningsbidrag
  namn: Omsorgsstyrelsens föreningsbidrag
  foreningstyp: [social, annat]
  kategori: [social, pensionar, funktionsratt]
  malgrupp: Föreningar och organisationer vars arbete kompletterar omsorgens insatser för utsatta grupper
  deadlines:
    typ: fasta
    datum: [11-30]
  krav:
  - Föreningen ska ha registrerad adress i Avesta kommun, vara demokratiskt uppbyggd och bedriva allmännyttig verksamhet för utsatta grupper
  - Föreningen ska ha stadgar, vald styrelse och revisorer, ordnad ekonomi, eget bank- eller plusgiro och organisationsnummer
  - Ansökan ska beskriva aktivitet, målgrupp, deltagarantal, tidsåtgång, förväntat resultat och sökt belopp samt innehålla verksamhetsplan och ekonomiska handlingar
  - Stöd lämnas inte för kommersiella arrangemang eller arrangemang med entré, verksamhet som finansieras dubbelt eller verksamhet som är en annan myndighets ansvar
  belopp: Aktivitetsstöd prövas individuellt; stöd för egen lokal är 50 procent av faktisk kostnad, högst 20 000 kr per år
