  deadlines:
    typ: fasta
    datum: [09-30]
  krav:
  - Föreningen ska vara beviljad Grundbidrag och lokalen ska vara nödvändig och användas kontinuerligt i verksamheten
  - Lokalen ska ägas eller hyras av föreningen och får inte omfattas av kommunens subventionerade taxor
  - Hyresintäkter ska räknas bort och föreningen ska bifoga hyresavtal, fakturor eller andra specifikationer som styrker kostnaderna
  - Hembygdsföreningar ska genomföra publika kulturarrangemang för att vara bidragsberättigade
  belopp: Högst 30 procent av föregående års godkända lokal- eller driftskostnader och högst 30 000 kr per förening
