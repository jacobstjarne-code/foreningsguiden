  namn: Aktivitetsstöd för barn och unga
  kategori: [idrott, kultur, ovrig]
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Föreningar med stödberättigade aktiviteter för barn och unga 6–25 år
  deadlines: {typ: fasta, datum: [02-25, 08-25]}
  krav:
  - Aktiviteten ska uppfylla RF:s regler för lokalt aktivitetsstöd och deltagarna ska vara 6–25 år och bosatta i Vara kommun
  - En person får räknas högst en gång per dag och förening och högst 30 deltagare får räknas per tillfälle
  - En ansvarig ledare ska vara närvarande och vår- respektive höstperiod ska redovisas separat
  belopp: Andel av anslaget efter antal deltagartillfällen; exakt belopp kan inte fastställas i förväg
  belopp_avser: per_forening
  kommunens_pott: Kommunens anslag fördelas mellan alla sökande; totalsumman publiceras inte
  sen_ansokan: Ansökan senast 25 februari respektive 25 augusti.
