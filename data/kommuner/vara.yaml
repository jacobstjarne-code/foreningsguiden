- id: vara-verksamhetsbidrag-till-organisationer
  namn: Verksamhetsbidrag till organisationer
  kategori: [social, funktionsratt, ovrig]
  foreningstyp: [social, annat]
  malgrupp: Organisationer enligt socialnämndens regler
  deadlines: {typ: fasta, datum: [12-01]}
  krav:
  - Funktionsrättsorganisation ska normalt vara ansluten till riksorganisation och öppen för målgruppen; undantag kan prövas särskilt
  - Organisationen ska ha vald styrelse, stadgar, medlemsinflytande och årligen styrka verksamheten
  - En medlem ska vara registrerad, ha betalat avgift och kunna påverka beslut; kommunen får granska underlagen
  - Annan organisation ska höra till socialnämndens område, nå ett betydande antal personer och visa kontinuitet
  belopp: Lokal organisation 1 700 kr plus 20 kr per Vara-medlem; regional 850 kr plus 20 kr per medlem; nationell 50 kr per medlem; annan mycket nyttig organisation 0,40 kr per Vara-invånare
