- id: vara-investeringsstod
  namn: Investeringsstöd
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Ideella föreningar med större investeringar i ett eget objekt
  deadlines: {typ: fasta, datum: [03-01]}
  krav:
  - Föreningen ska vara ideell, ha säte och huvudsaklig verksamhet i Vara och vara allmännyttig och öppen på lika villkor
  - Föreningen ska äga objektet och ingen kostnad får finansieras dubbelt
  - Minst 50 procent ska finansieras med andra bidrag, eget kapital eller sponsring, inte lån
  - Projektbeskrivning, budget, sökt belopp, tidsplan, stadgar, årsredovisning och firmatecknare ska lämnas efter dialog med föreningssamordnaren
