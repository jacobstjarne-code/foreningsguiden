  - Lokalen ska ägas av en ideell organisation och vara öppen och tillgänglig för kultur, fritid, studier och möten
  - Minst tio externa uthyrningar ska redovisas, men ekonomiskt stöd börjar beräknas från den elfte uthyrningen
  - Bokningsjournal, hyresintäkter och offentlig egen aktivitet ska redovisas; interna möten räknas inte och högst 250 bokningar ingår
