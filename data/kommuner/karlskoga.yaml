  krav:
  - Föreningen ska ha organisationsnummer och säte i Karlskoga kommun samt vara registrerad i kommunens föreningsregister Rbok
  - Verksamheten ska bedrivas i Karlskoga kommun; endast verksamhet i kommunen är bidragsberättigad
  - Föreningen ska ha godkända stadgar, minst tre styrelseledamöter, minst en fristående revisor och minst tio aktiva medlemmar
  - Föreningen ska ta ut årlig medlemsavgift, bygga på demokratiska grunder och vara öppen för alla som följer stadgarna
  - Verksamhetsberättelse, revisionsberättelse, verksamhetsplan, årsmötesprotokoll samt resultat- och balansrapport ska lämnas
  - Barn- och ungdomsföreningar ska ha rutiner för belastningsregister, aktuell ANDTS-policy och vid anslutning till specialidrottsförbund ha sökt LOK-stöd eller motsvarande
  belopp: Inget fast belopp publiceras; stödet beslutas årsvis och betalas ut i januari och juni
  sen_ansokan: Ansökan efter den 15 oktober kan lämnas utan bidrag
