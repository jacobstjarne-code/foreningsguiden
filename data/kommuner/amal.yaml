  - Lokalen eller anläggningen ska bedömas lämplig och endast de delar som används i föreningsverksamheten är bidragsgrundande
  - Ansökan ska lämnas senast två månader efter årsmötet och redovisa driftkostnader samt samtliga intäkter från uthyrning
