- id: amal-generellt-verksamhetsbidrag
  namn: Generellt verksamhetsbidrag
  status: aktiv
  kategori: [kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: &icke_idrott [kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Icke-idrottsföreningar som uppfyller Åmåls generella bidragskriterier och inte har särskilt eller kulturstrategiskt uppdrag
  deadlines: {typ: lopande, datum: []}
  krav:
  - Föreningen ska vara icke vinstdrivande, ha säte och verksamhet i Åmål samt arbeta för barn och unga 5–20 år, äldre över 65 år, personer med funktionsvariation eller boende på landsbygden
  - Föreningen ska ha minst tio aktiva betalande medlemmar i Åmål, årlig medlemsavgift på minst 100 kronor, organisationsnummer, föreningskonto, stadgar, vald styrelse och revisor
  - Föreningen ska vara öppen och demokratisk, följa diskriminerings- och demokrativillkoren och vid barnverksamhet följa barnkonventionen, ha drogfri miljö och kontrollera belastningsregister
  - Ansökan ska göras efter årsmöte eller konstituerande möte och innehålla årsmötesprotokoll, senast antagna stadgar, verksamhetsberättelse och bokslut
  - Idrottsföreningar samt föreningar med särskilt eller kulturstrategiskt uppdrag kan inte få detta bidrag
  belopp: 1 500 kr per förening och år samt ytterligare 1 500 kr om styrelsen har en ordinarie ledamot eller mötesdeltagande suppleant som är 15–25 år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Söks efter genomfört årsmöte eller konstituerande möte; kommunen publicerar ingen gemensam sista kalenderdag
  kalla_url: https://amal.se/uppleva-och-gora/kultur/sok-stod-bidrag-eller-kulturpris/generellt-verksamhetsbidrag
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  senast_verifierad: '2026-08-19'
  anteckning: null
- id: amal-aktivitetsbaserat-verksamhetsbidrag
  namn: Aktivitetsbaserat verksamhetsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, pensionar, funktionsratt, ovrig]
  foreningstyp: *icke_idrott
  malgrupp: Icke-idrottsföreningar som genomför medlemsaktiviteter och uppfyller Åmåls generella bidragskriterier
  deadlines: {typ: fasta, datum: [06-30, 12-31]}
  krav:
  - Föreningen ska uppfylla kommunens generella kriterier och får inte vara idrottsförening eller ha särskilt eller kulturstrategiskt uppdrag
  - Varje aktivitet ska vara minst 60 minuter och ha minst en ledare och tre deltagande medlemmar; samtliga ledare och deltagare ska vara föreningsmedlemmar
  - Aktiviteten får inte vara förenad med entréavgift eller biljettköp och högst fem aktiviteter per kalendervecka ersätts
  - Ansökan ska redovisa tidpunkt, plats, aktivitetsbeskrivning och antal deltagare samt innehålla ifylld aktivitetsrapport
  - Föreningen ska dokumentera vilka medlemmar som deltog och kunna lämna underlaget vid kommunens uppföljning
  belopp: 15 kr per aktivitet samt 3 kr per deltagare; deltagare 7–25 år och 65 år eller äldre ger 5 kr per person
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningsperioderna öppnar 1 juni respektive 1 december och stänger 30 juni respektive 31 december
  kalla_url: https://amal.se/uppleva-och-gora/kultur/sok-stod-bidrag-eller-kulturpris/aktivitetsbaserat-verksamhetsbidrag
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
