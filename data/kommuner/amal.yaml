- id: amal-investeringsbidrag
  namn: Investeringsbidrag
  status: aktiv
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar med stor positiv betydelse för Åmåls invånare som behöver förstärka eller utveckla sin verksamhet genom en angelägen investering
  deadlines: {typ: lopande, datum: []}
  krav:
  - Föreningen ska uppfylla kommunens generella kriterier och genom medlemsantal, långsiktig verksamhet, besökare eller motsvarande visa avsevärd positiv inverkan för Åmåls invånare
  - Investeringen ska avse egen lokal, anläggning, teknisk apparatur, maskin eller motsvarande som föreningen inte klarar inom ordinarie resurser
  - Investeringen ska vara särskilt angelägen och avgörande för verksamheten eller öka samhällsnytta, trygghet, besöksattraktion eller miljömässig hållbarhet
  - Ansökan ska utförligt beskriva investeringen, förväntad effekt, kostnader, försök att få annan finansiering och långsiktig finansieringsplan
  belopp: Högst 50 procent av investeringskostnaden och maximalt 500 000 kr
