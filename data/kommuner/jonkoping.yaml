- id: jonkoping-traffpunktsbidrag
  namn: Träffpunktsbidrag
  kategori: [ovrig]
  malgrupp: Föreningar med öppen verksamhet för ungdomar 13–20 år
  deadlines: {typ: lopande, datum: []}
  krav:
  - Verksamheten ska vara öppen och rikta sig till ungdomar 13–20 år
  - Verksamheten ska komplettera Ung Fritids verksamhet geografiskt och innehållsmässigt
  - Verksamheten ska i första hand bedrivas fredag- eller lördagskvällar
