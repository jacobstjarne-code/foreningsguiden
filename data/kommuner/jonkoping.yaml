  - Föreningen ska följa kommunens grundläggande bestämmelser och vara godkänd som bidragsberättigad
  - Föreningen ska ha genomfört minst 10 godkända sammankomster under föregående kalenderår
  - En sammankomst ska vara ledarledd, pågå minst 45 minuter och ha minst tre deltagare samt en ledare
  - En deltagare får räknas högst en gång per dygn och förening
  - All närvaroregistrering ska ske digitalt och vara slutförd senast 1 mars
