  namn: Anläggningsbidrag – föreningsägd anläggning
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Ideella föreningar som äger och driver en anläggning för sin verksamhet i Falköpings kommun.
  foreningstyp: [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  deadlines: { typ: fasta, datum: [04-30] }
  krav:
  - Föreningen ska vara ideell, bedriva verksamhet i Falköpings kommun, ha minst fem medlemmar, antagna stadgar, vald styrelse och revisor samt konto i föreningens namn
  - Verksamheten ska vara öppen för alla och föreningen ska följa kommunens demokrati-, jämlikhets-, mångfalds- och drogförebyggande villkor
  - Ansökan ska avse en föreningsägd anläggning och styrkta kostnader för exempelvis el, uppvärmning, försäkring, vatten, avlopp, renhållning eller arrende
