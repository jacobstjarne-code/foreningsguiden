- id: katrineholm-bidrag-enskilda-vagar
  namn: Bidrag till enskilda vägar
  kategori:
  - ovrig
  malgrupp: Väghållare (privatperson eller samfällighetsförening) för enskild väg i Katrineholms kommun
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Vägen ska vara utfartsväg för fast boende utanför bebyggelseområde med minst en permanentbostad vid vägens/vägsträckans
    ändpunkt, ELLER vara minst 500 meter lång (avtagsväg minst 250 meter, med vägdelens slut minst 500 meter från annan väg)
  - Karta som visar vägens/vägdelarnas sträckning ska bifogas ansökan
  - Mötesprotokoll som visar beslut om kontaktperson, kassör och konto för utbetalning ska bifogas
  - Utdrag från Lantmäteriet som visar att samfällighet är bildad ska bifogas
  belopp: null
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.katrineholm.se/trafik-och-gator/bidrag-till-enskilda-vagar.html
  anteckning: SAKNADES HELT I FÖREGÅENDE VERSION — hittat via e-tjänstkatalogen (e.katrineholm.se, tjänst 'Kommunalt bidrag
    för enskild väg', id 470; uppdatering av uppgifter sker via id 1107). Administreras av Samhällsbyggnadsförvaltningen,
    inte Föreningsservice — helt utanför Interbook Go-spåret. Inget kronbelopp eller kr/meter-belopp publicerat på källsidan
    (till skillnad från t.ex. Halmstads motsvarande bidrag). Väghållare kan även söka statsbidrag från Trafikverket separat
    (ej kommunalt bidrag, därför inte med här).
