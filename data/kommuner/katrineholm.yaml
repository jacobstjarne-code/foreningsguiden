forutsattningar:
- id: katrineholm-bidragsberattigad-forening
  vad: Bli registrerad förening och godkänd som bidragsberättigad
  beskrivning: Föreningen bildas vid ett bildandemöte där stadgar antas och styrelse väljs (minst ordförande, sekreterare
    och kassör, gärna fler ledamöter samt två revisorer). Föreningen ansöker om organisationsnummer hos Skatteverket och öppnar
    bank- eller plusgirokonto i föreningens namn. Därefter registreras föreningen i kommunens föreningsregister, vilket krävs
    för att kunna ansöka om de flesta föreningsbidrag.
  system: Interbook Go
  ledtid: null
  ledtid_text: null
  giltighet: null
  ordning: 1
  kalla_url: https://www.katrineholm.se/uppleva-och-gora/foreningar/starta-forening.html
- id: katrineholm-arlig-redovisning-registrering
  vad: Lämna in årlig redovisning för att behålla föreningsregistrering och bidragsberättigande
  beskrivning: Föreningen ska varje år senast den 31 mars lämna in verksamhetsberättelse, verksamhetsplan, resultat- och balansräkning,
    revisionsberättelse samt årsmötesprotokoll till service- och teknikförvaltningen, samt uppdatera föreningsregistret vid
    förändringar (t.ex. ny styrelse eller kontaktperson). En förening som inte lämnar in dessa handlingar avregistreras och
    kan då inte längre söka föreningsbidrag. En registrerad förening har inte per automatik rätt till föreningsbidrag — grundbidrag,
    verksamhetsbidrag med mera prövas separat per bidrag. En förening ska dessutom ha minst 10 medlemmar (styrelsens ledamöter
    kan räknas in) för att bli registrerad.
  system: Interbook Go
  ledtid: null
  ledtid_text: null
  giltighet: Årlig inlämning krävs senast 31 mars varje år för fortsatt registrering, annars avregistreras föreningen.
  ordning: 2
  kalla_url: https://www.katrineholm.se/download/18.1bccd88c193ded135fadb77f/1736410346132/%C3%96vergripande%20riktlinjer%20f%C3%B6r%20f%C3%B6reningsst%C3%B6d,%20KF%202024-12-16,%20%C2%A7%20239.pdf
