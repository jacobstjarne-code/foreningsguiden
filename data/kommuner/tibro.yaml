    - 03-01
    - 09-01
  krav:
  - Minst tre deltagare i åldern 7–20 år krävs per sammankomst för att stödet ska betalas ut
  - Närvarokort ska föras vid varje sammankomst med uppgift om förening, plats, aktivitet, tid, datum, deltagares namn och
    födelseår samt ledares namn och födelseår, och intygas av närvarande ledare
  - Föreningen ska ha organisationsnummer, styrelse, stadgar och ett medlemsregister med namn, födelseår och uppgift om betald
    medlemsavgift
  - Föreningen ska ha sitt säte i Tibro kommun och minst hälften av medlemmarna ska vara folkbokförda i kommunen
  - Beviljade bidragsmottagare är skyldiga att bevara räkenskaps- och revisionshandlingar, medlemsregister och närvarokort
    i minst fem år
  belopp: 50 kr per sammankomst med minst tre deltagare i åldern 7–20 år
  sen_ansokan: Ej angivet i källan
