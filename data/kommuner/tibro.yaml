bidrag:
- namn: Hyreskostnadsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar som hyr lokal eller anläggning
  deadlines:
    typ: fasta
    datum:
    - 06-01
  krav:
  - Föreningen ska ha organisationsnummer, styrelse, stadgar och ett medlemsregister med namn, födelseår och uppgift om betald
    medlemsavgift
  - Föreningen ska ha sitt säte i Tibro kommun och minst hälften av medlemmarna ska vara folkbokförda i kommunen
  - Ansökan ska göras av den lokala huvudstyrelsen via Rbok, med verksamhetsberättelse, resultaträkning, balansräkning och
    revisionsberättelse bifogade
  - Bidragsgrundande kostnader är hyra, arrende, försäkring, uppvärmning och el för en lokal/anläggning som regelbundet används
    av föreningen och ligger i Tibro kommun
  - Endast en förening per lokal/anläggning, och föreningen får inte samtidigt få annat kommunalt bidrag eller subvention
    för samma lokal
  - Beviljade bidragsmottagare är skyldiga att bevara räkenskaps- och revisionshandlingar, medlemsregister och närvarokort
    i minst fem år
  belopp: 30 procent av kostnader för barn- och ungdomsföreningar, 20 procent för övriga
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.tibro.se/Kultur-fritid-och-idrott/forening/Bidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  id: tibro-hyreskostnadsbidrag
- namn: Driftskostnadsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar som äger lokal eller anläggning
  deadlines:
    typ: fasta
    datum:
    - 06-01
  krav:
  - Föreningen ska ha organisationsnummer, styrelse, stadgar och ett medlemsregister med namn, födelseår och uppgift om betald
    medlemsavgift
  - Föreningen ska ha sitt säte i Tibro kommun och minst hälften av medlemmarna ska vara folkbokförda i kommunen
  - Ansökan ska göras av den lokala huvudstyrelsen via Rbok, med verksamhetsberättelse, resultaträkning, balansräkning och
    revisionsberättelse bifogade
  - Bidragsgrundande kostnader är arrende, samfällighetsavgift, försäkring, uppvärmning, el, vatten/avlopp, renhållning och
    ränta för en lokal/anläggning som regelbundet används av föreningen i Tibro kommun
  - Endast en förening kan söka bidrag för en viss lokal/anläggning, och förening som på annat sätt får bidrag eller subvention
    från kommunen för aktuell lokal/anläggning har inte rätt till driftskostnadsbidrag
  - Beviljade bidragsmottagare är skyldiga att bevara räkenskaps- och revisionshandlingar, medlemsregister och närvarokort
    i minst fem år
  belopp: 40 procent av godkända kostnader plus 20 kr per godkänd deltagare
  sen_ansokan: Ej angivet i källan
  kalla_url: https://www.tibro.se/Kultur-fritid-och-idrott/forening/Bidrag/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  id: tibro-driftskostnadsbidrag
