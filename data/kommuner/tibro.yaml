- namn: Kulturaktivitet och evenemangsbidrag
  kategori:
  - kultur
  malgrupp: Kulturföreningar med aktiviteter och evenemang
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska vara en bidragsberättigad förening registrerad i Tibro kommun
  - Kulturaktiviteten ska falla inom de konstnärliga fälten ord, bild, scen, ton, film eller aktiviteter inom kulturarv
  - Aktiviteten ska vara offentlig, det vill säga allmänheten ska informeras och ha möjlighet att besöka arrangemanget, och
    äga rum i Tibro kommun
  - Ansökan ska innehålla en budget kopplad till evenemanget, och bidraget kan inte användas till löpande ordinarie verksamhet
  - Samma aktivitet kan som mest beviljas bidrag i tre år
  belopp: Högst 5 000 kr per aktivitet och förening per år
  sen_ansokan: Ej tillämpligt (löpande) - ansökan ska lämnas senast två månader före aktiviteten/evenemanget
