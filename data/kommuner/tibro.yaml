- namn: Verksamhetsbidrag till kulturföreningar
  kategori:
  - kultur
  malgrupp: Kulturföreningar med kontinuerlig utåtriktad verksamhet
  deadlines:
    typ: fasta
    datum:
    - 09-01
  krav:
  - Föreningen ska bedriva kontinuerlig verksamhet inom det konstnärliga eller kulturella fältet i Tibro kommun eller till
    gagn för Tibro kommun
  - Verksamheten ska vara offentlig eller resultera i verksamhet som kommer allmänheten till godo, och bygga på demokratiska
    grunder
  - Ansökan ska följa allmänna bidragsbestämmelser och åtföljas av verksamhetsberättelse, balansräkning, resultaträkning och
    revisionsberättelse
  - Beslut meddelas 30 november, med utbetalning i januari påföljande år
