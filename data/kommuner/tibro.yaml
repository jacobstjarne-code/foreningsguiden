- namn: Särskilt anläggningsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med särskilda anläggningsbehov
  deadlines:
    typ: fasta
    datum:
    - 09-01
  krav:
  - Ansökan ska innehålla projektbeskrivning, kostnadskalkyl, finansieringsplan och tidplan
  - Bidraget kan användas till nybyggnation eller större underhållsarbeten på anläggning samt inköp av utrustning för anläggningens
    drift
  - Föreningen ska ha fullgott försäkringsskydd, och vid upphörande, försäljning eller förstörelse av anläggningen utan återuppbyggnad
    blir en del av bidraget återbetalningsskyldigt
  - Ekonomisk redovisning till kultur- och fritidsnämnden är obligatorisk efter avslutat projekt, och understiger de faktiska
    kostnaderna kostnadskalkylen justeras bidraget ned med eventuell återbetalningsskyldighet
  belopp: Maximalt 70 procent eller 100 000 kr per inlämnad ansökan
  sen_ansokan: Ej angivet i källan
