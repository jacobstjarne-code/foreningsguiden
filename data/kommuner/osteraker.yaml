  krav:
  - Föreningen ska vara godkänd som bidragsberättigad av Kultur- och fritidsnämnden
  - Aktiviteten ska vara minst en timme lång med minst tre deltagare och en ledare
  - Deltagarna ska vara folkbokförda i Österåkers kommun
  - Föreningens senaste årsmöteshandlingar, konstituerande styrelseprotokoll, alkohol- och drogpolicy samt ledarpolicy ska vara uppdaterade i FRI senast 31 januari respektive 31 juli
