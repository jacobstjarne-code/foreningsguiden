- id: skinnskatteberg-etableringsbidrag
  namn: Etableringsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Nybildade föreningar, intressegrupper och ungdomsgrupper under en uppbyggnadsperiod
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Den sökande ska vara en nybildad förening, intressegrupp eller ungdomsgrupp som ännu inte omfattas av kommunens ordinarie bidragsöverenskommelse
  - Gruppen ska bestå av minst tre personer och ha en verksamhetsplan med minst fem planerade verksamhetstillfällen under året
  - Verksamheten ska vara öppen för alla, präglas av demokratiska värderingar och jämställdhet samt verka för drogfrihet
  - Ansökan om registrering i kommunens föreningsregister ska lämnas samtidigt och den nystartade verksamheten ska föra närvarostatistik
  belopp: Individuellt beslutat belopp; kommunen publicerar ingen generell nivå
  sen_ansokan: Ansökan kan lämnas löpande under hela året
