  anteckning: Stödet beslutas i dialog och betalas i förskott för det kommande verksamhetsåret; belopp upp till 10 000 kronor betalas i april och större stöd delas mellan april och oktober.
- id: skinnskatteberg-aktivitetsbidrag
  namn: Kommunalt aktivitetsbidrag
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Lokala föreningar som genomför aktiviteter för deltagare i åldern 0–20 år
  deadlines:
    typ: fasta
    datum: [02-15, 08-15]
  krav:
  - Aktiviteten ska genomföras av den lokala föreningen, omfatta minst 60 minuter och ha minst tre deltagare i åldern 0–20 år
  - Aktiviteten ska vara beslutad och ekonomiskt planerad samt ha gemensam samling med instruktion och gemensam avslutning
  - Närvarokort med deltagarnas kön och ålder ska bifogas; närvarande ledare ska intyga uppgifterna och får inte samtidigt leda flera stödgrundande grupper
  - Aktivitet som anordnas av en riksorganisation, ett distrikt eller ett lokalt samarbetsorgan är inte stödgrundande
  belopp: 4 kr per deltagare 0–15 år, 3 kr per deltagare 16–20 år, 30 kr per sammankomst med 5–15 deltagare och 50 kr med fler än 15 deltagare
  sen_ansokan: Den 15 februari avser 1 juli–31 december och den 15 augusti avser 1 januari–30 juni; för sent inkommen ansökan ger inte rätt till bidrag
  kalla_url: https://www.skinnskatteberg.se/app/uploads/2023/04/bidragsbestammelser-och-riktlinjer-for-kommunalt-foreningsbidrag-i-skinnskatteberg-2023.pdf
