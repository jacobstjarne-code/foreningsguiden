- id: skinnskatteberg-foreningsbidrag
  namn: Föreningsbidrag – dialogbaserad överenskommelse
  kategori: [idrott, kultur, social, ovrig]
  malgrupp: Ideella föreningar med huvudsaklig verksamhet och hemvist i Skinnskattebergs kommun
  deadlines:
    typ: fasta
    datum: [02-28]
  krav:
  - Föreningen ska vara registrerad hos kommunen, ha huvudsaklig verksamhet och hemvist i Skinnskatteberg samt uppfylla kommunens demokrati-, öppenhets- och drogfrihetsvillkor
  - Ansökan ska ange sökt stöd för lokal och/eller aktiviteter och koppla varje sökt summa till innevarande års verksamhetsplan och budget
  - Verksamhetsberättelse, senaste årsmötesprotokoll, revisionsberättelse, ekonomisk berättelse med resultat och balans, verksamhetsplan och budget ska bifogas
  - Stödet får inte användas som lön till en anställd eller projektledare i föreningen
  belopp: Individuellt överenskommet efter dialog om planerad verksamhet; kan vara kontant stöd, lokalsubvention, uppdragsersättning eller skötselbidrag
  sen_ansokan: Ansökan ska vara komplett senast 28 februari; för sent inlämnad ansökan ger inte rätt till bidrag, men dispens kan begäras i god tid
  kalla_url: https://www.skinnskatteberg.se/app/uploads/2024/01/ansokningsblankett-foreningsbidrag-skrivbar.pdf
