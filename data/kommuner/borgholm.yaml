  - Projektet ska slutredovisas och kunna slutbesiktigas inom två år från beslutet
  belopp: Högst 50 procent av godkänd nettokostnad, maximalt 150 000 kronor; ideellt arbete värderas till 200 kronor per timme
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan ska lämnas senast 1 mars eller 1 september och innan investeringen är färdigställd.
