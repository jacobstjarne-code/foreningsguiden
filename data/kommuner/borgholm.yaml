  - Ansökan ska lämnas före arrangemanget och innehålla beskrivning, budget och marknadsföringsplan
  - Stödet kan avse arvoden, marknadsföring, extern lokalhyra och andra kostnader som direkt hör till arrangemanget
  - Nya arrangemang och samarbete mellan flera föreningar prioriteras; ett återkommande arrangemang kan normalt få stöd i högst tre år
  - Lovaktiviteter och andra aktiviteter som redan omfattas av kommunalt stöd berättigar inte till arrangemangsbidrag
  - Redovisning ska lämnas inom fyra veckor efter arrangemanget och senast den 15 december
