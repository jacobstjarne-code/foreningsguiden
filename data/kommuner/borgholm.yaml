  - Investeringen ska avse ny-, till- eller ombyggnad, större maskinanskaffning, större reparation eller en oförutsedd myndighetskrävd åtgärd
  - Projektet får inte vara färdigställt när ansökan prövas och stöd lämnas inte till löpande drift eller normalt underhåll
  - Ansökan ska innehålla projektbeskrivning, ritningar, kostnadsberäkning, finansieringsplan, offerter samt bevis på ägande eller långsiktig nyttjanderätt
  - Föreningen ska redovisa sökta externa stöd och egen kontant eller ideell insats
