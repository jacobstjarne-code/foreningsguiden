- id: borgholm-arrangemangsbidrag
  namn: Arrangemangsbidrag
  status: aktiv
  kategori: [kultur, idrott, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som genomför offentliga arrangemang i Borgholms kommun
  deadlines:
    typ: fasta
    datum: [03-01, 09-01]
  krav:
