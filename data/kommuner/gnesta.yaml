- id: gnesta-landsbygdspott
  namn: Landsbygdspott
  status: aktiv
  kategori: [kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Ideella föreningar, lokala samverkansgrupper, byalag och andra icke-vinstdrivande organisationer med lokal förankring
  deadlines: {typ: lopande, datum: []}
  krav:
  - Den formella sökanden och mottagaren ska vara en ideell förening, organisation, lokal samverkansgrupp, byalag, kooperativ eller annan icke-vinstdrivande verksamhet
  - Projektet ska genomföras på Gnestas landsbygd, ha ett tydligt allmänintresse och vara till nytta för en bred målgrupp
  - Projektet ska bidra till minst ett mål i kommunens landsbygdsprogram och kan avse en förstudie, samverkan, aktivitet eller investering
  - Stöd ges inte till ordinarie löpande verksamhet, privat vinning, kommunens ordinarie verksamhet eller projekt som redan fått ett annat kommunalt bidrag
  - Ansökan ska innehålla projektbeskrivning, budget, tidplan, kontakt- och sökandeuppgifter samt plan för fortsatt förvaltning
  - Projektet ska slutföras inom tolv månader efter beslut och slutrapporteras med verksamhets- och ekonomiredovisning inom två månader
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: 500 000 kr för 2026; ingen fast individuell maxnivå och fördelningen bedöms efter projektens kvalitet, relevans, samhällsnytta, lokala förankring och bidrag till landsbygdsprogrammets mål
  sen_ansokan: Ansökan sker löpande under året.
  kalla_url: https://www.gnesta.se/download/18.668dbeb519d9a5cc7c72b9b7/1776847346879/Riktlinjer%20f%C3%B6r%20landsbygdspott%202026.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Privatpersoner kan initiera projekt men föreningen eller den lokala gruppen måste vara formell sökande och mottagare; företag kan endast medverka som samarbetspartner.
  senast_verifierad: '2026-08-19'
