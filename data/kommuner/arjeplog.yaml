bidrag:
- id: arjeplog-kulturkraft
  namn: Kulturkraft
  kategori:
  - kultur
  malgrupp: Organisationer, institutioner, föreningar och professionella inom kultur och kreativa sektorer
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Bidrag kan sökas av organisationer, institutioner, skola/utbildning, föreningar samt yrkesverksamma eller ideellt arbetande
    inom kulturella och kreativa sektorn
  - Projektet ska röra kulturella och kreativa insatser och/eller marknadsförings-/marknadssamarbete och hålla en kvalitet
    som förknippas med Arjeplogs kommuns attraktivitet och varumärke
  - Projektet ska vara utvecklingsinriktat; återkommande projekt ska visa på ett utvecklingsarbete
  - Stödet får inte användas till löpande driftskostnader eller för att täcka underskott
  - Bidrag lämnas inte retroaktivt till redan genomförda projekt
  - Projektet ska ha en tydligt angiven huvudman med ansvar för genomförande och ekonomi
  - Projektet ska överensstämma med kommunens lokala och regionala planer och strategier, t.ex. kulturplan
  belopp: null
  sen_ansokan: Beslut om kulturkraft fattas löpande under året vilket kan innebära att ansökningar under den senare delen
    kan avslås på grund av att årets medel för kulturkraft är använda
  kalla_url: https://arjeplog.se/foretag-forening-och-naringsliv/stod-och-bidrag-for-kultur-utveckling-och-folkhalsa/
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Inget fast belopp per ansökan anges. Kommunen budgeterar årligen i storleksordningen 200 000 kr totalt för Kulturkraft,
    med inriktningen att hälften av medlen går till insatser i samarbete med kommunala arrangemang (Riktlinjer för Kulturkraftstöd).
- id: arjeplog-utvecklingspeng
  namn: Utvecklingspeng
  kategori:
  - ovrig
  malgrupp: Lokala landsbygdsinitiativ och föreningar
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara en byaförening eller annan förening/organisation som vill utveckla byn/byaområdet/tätorten i samverkan
    med andra; enskilda grupper, privatpersoner eller företag kan inte söka (samfälligheter kan i undantagsfall beviljas stöd)
  - Föreningen ska vara organiserad som en sedvanlig förening med demokratiska principer, öppet medlemskap, årsmöten och regelbundna
    medlemsmöten, styrelse, stadgar samt verksamhets- och ekonomisk berättelse
  - Föreningens aktuella utvecklingsplan ska bifogas ansökan
  - Stödet får inte användas till löpande driftskostnader; alkoholhaltiga drycker är inte stödberättigade
  belopp: 5 000-20 000 kronor per insats/förening/år
  sen_ansokan: Ej tillämpligt (löpande)
  kalla_url: https://arjeplog.se/foretag-forening-och-naringsliv/stod-och-bidrag-for-kultur-utveckling-och-folkhalsa/
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Kommunen budgeterar årligen i storleksordningen 210 000 kr totalt för Utvecklingspeng (Riktlinjer för Utvecklingspeng).
