- id: arjeplog-aktivitetsstod
  namn: Kommunalt lokalt aktivitetsstöd
  kategori:
  - idrott
  - kultur
  malgrupp: Föreningar med barn- och ungdomsverksamhet
  deadlines:
    typ: fasta
    datum:
    - 02-15
    - 08-15
  krav:
  - Ansökan ska grundas på närvarokort med redovisade sammankomster och deltagare uppdelat på flickor och pojkar i åldrarna
    6-12, 13-16 och 17-25 år
  - Ansökan för perioden 1 januari-30 juni ska ha inkommit senast 15 augusti; ansökan för perioden 1 juli-31 december ska
    ha inkommit senast 15 februari
  - Uppgifterna ska vara i enlighet med kommunens Regler och riktlinjer för Stöd till föreningslivet, §7 Kommunalt aktivitetsstöd
  belopp: null
  sen_ansokan: Ansökan ska ha inkommit senast 15 augusti (vårterminen) respektive 15 februari (höstterminen). Konsekvenser
    vid sen ansökan anges inte i ansökningsblanketten.
  kalla_url: https://arjeplog.se/kommun-och-politik/blanketter/
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: null
  anteckning: Bidragsbeloppets storlek per sammankomst/deltagare framgår inte av ansökningsblanketten eller övriga tillgängliga
    källor. Det fullständiga regelverket §7 Kommunalt aktivitetsstöd (Regler och riktlinjer för Stöd till föreningslivet i
    Arjeplogs kommun) kunde inte återfinnas publicerat online.
