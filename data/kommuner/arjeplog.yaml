  anteckning: Stödet är även öppet för organisationer, institutioner, skola, yrkesverksamma och ideellt arbetande inom kulturella och kreativa sektorn; föreningar konkurrerar därför med andra sökande om potten.
- id: arjeplog-utvecklingspeng
  namn: Utvecklingspeng
  kategori:
  - ovrig
  malgrupp: Lokala landsbygdsinitiativ och föreningar
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara en byaförening eller annan förening/organisation som vill utveckla byn/byaområdet/tätorten i samverkan
    med andra; enskilda grupper, privatpersoner eller företag kan inte söka (samfälligheter kan i undantagsfall beviljas stöd)
  - Föreningen ska vara organiserad som en sedvanlig förening med demokratiska principer, öppet medlemskap, årsmöten och regelbundna
    medlemsmöten, styrelse, stadgar samt verksamhets- och ekonomisk berättelse
  - Föreningens aktuella utvecklingsplan ska bifogas ansökan
  - Stödet får inte användas till löpande driftskostnader; alkoholhaltiga drycker är inte stödberättigade
  - Stödet får användas till utvecklingsarbete, sysselsättningsskapande verksamhet, investeringar eller andra aktiviteter som är viktiga för byns utveckling; medfinansiering i större projekt prioriteras
  - Ansökningar i linje med byns utvecklingsplan och kommunala eller regionala strategier prioriteras, liksom områden som inte nyligen fått stöd
  - Slutrapport och verifikationer ska lämnas senast två månader efter projektets slut; tidigare stöd ska vara redovisat innan en ny ansökan behandlas
  belopp: "5 000–20 000 kronor per insats/förening/år"
  belopp_avser: per_forening
  kommunens_pott: "Kommunen budgeterar ca 210 000 kr totalt för Utvecklingspeng"
  sen_ansokan: Ej tillämpligt (löpande)
  kalla_url: https://arjeplog.se/wp-content/uploads/se/2024/11/riktlinjer-for-utvecklingspeng.pdf
