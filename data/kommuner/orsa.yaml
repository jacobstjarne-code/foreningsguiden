  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
- id: orsa-utbildningsbidrag
  namn: Utbildningsbidrag
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Ideella föreningar som utbildar medlemmar eller funktionärer
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Föreningen ska uppfylla kommunens grundläggande villkor för föreningsbidrag
  - Utbildningen ska ge medlemmar eller funktionärer allmän föreningskunskap eller särskild kunskap inom föreningens verksamhetsområde
  - Ansökan ska avse en utbildning som inte har påbörjats vid ansökningstillfället
  - Endast utbildningskostnaden är stödgrundande; resor, kost och logi får inte räknas med
  belopp: Individuellt prövad utbildningskostnad; kommunen publicerar ingen generell procentsats eller högsta nivå
