- id: orsa-storre-evenemangsstod
  namn: Evenemangsstöd för större evenemang
  kategori: [idrott, kultur, ovrig]
  foreningstyp: *alla
  malgrupp: Föreningar som arrangerar större evenemang i Orsa med omnejd
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Ansökan ska lämnas av föreningens behöriga firmatecknare och ange förening, kontaktperson, ordförande, kassör och sökt belopp
  - Evenemanget ska bidra till ett rikt utbud, stärka bilden och kännedomen om Orsa eller locka fler besökare och företag
  - Evenemanget ska hålla hög kvalitet, kunna utvecklas över tid och ligga i linje med kommunens vision och värdegrund
  - Ansökan ska beskriva mål, innehåll, tidplan och ekonomiska åtaganden
  - Efter genomförandet ska föreningen lämna ekonomisk och verksamhetsmässig slutredovisning till kommunen
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: 373 000 kronor är budgeterat för evenemangsstöd 2026 och fördelas mellan beviljade evenemang
  sen_ansokan: Ansökningar behandlas löpande under året.
  kalla_url: https://orsa.se/download/18.51b3e496167c5f867322cb52/1548335296881/Evenemangsstod19.pdf
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
- id: orsa-bygdepeng-vindkraft
  namn: Bygdepeng vindkraft
  kategori:
  - ovrig
  foreningstyp: *alla
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Projektet ska användas till ändamål som stimulerar näringslivsutveckling och försörjning i Orsa kommun
  - Utdelning av medel får inte gynna enbart en enskild kommersiell aktör utan att det finns ett mycket starkt allmänintresse
  - Ledande kriterier för fördelning är ökad sysselsättning, ökat antal besökare, ökad inflyttning och stärkt varumärke (ej
    sådant som normalt ingår i kommunala åtaganden)
  - Ansökan ska innehålla handlingar som styrker organisationens beslut och behörig företrädare samt senaste årets verksamhets-,
    kassa- och revisionsberättelse
  - Projektet får inte ha avslutats innan kommunen har fattat beslut
  belopp: null
  belopp_avser: ren_pott
  kommunens_pott: 0,5 procent av bruttoersättningen för vindkraftsel enligt kommunens avtal med OX2 fördelas till berättigade projekt
  sen_ansokan: Ansökningar behandlas löpande under året.
  kalla_url: https://orsa.se/uppleva-och-gora/foreningar/bidrag-stod-och-stipendier.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
- id: orsa-utvecklingsbidrag-vindkraft
  namn: Utvecklingsbidrag vindkraft
  kategori:
  - ovrig
  foreningstyp: *alla
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara ideell förening, ekonomisk förening eller samfällighet med säte i Orsa kommun, eller allmännyttig stiftelse
    (kan inte utgå till företag eller privatpersoner)
  - Föreningen ska ha av årsmöte antagna stadgar, föra medlemsförteckning, ha egen styrelse och kassaförvaltning
  - Projektet ska stärka bygdens attraktivitet för boende, verksamma och besökare, öka sammanhållning/engagemang i lokalsamhället,
    eller bidra till ekonomisk, social eller miljömässig hållbarhet
  - Projekt som medför framtida drift- och underhållskostnader ska ha en plan för hur dessa kostnader täcks
  - Medel ska inte utgå till kommunens ordinarie underhåll eller ordinarie kommunala investeringsprogram
  - Sökande ska ha redovisat eventuella tidigare beviljade projekt på ett tillfredsställande sätt
  belopp: "Max 300 000 kr utan medfinansiering; med medfinansiering max 30 % av projektkostnad, dock högst 500 000 kr"
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökan kan göras löpande under året. Tilldelningsbeslut fattas av kommunstyrelsen senast två månader efter
    inkommen ansökan.
  kalla_url: https://orsa.se/uppleva-och-gora/foreningar/bidrag-stod-och-stipendier.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  senast_verifierad: '2026-08-23'
