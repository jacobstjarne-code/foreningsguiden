- id: orsa-foreningsbidrag
  namn: Verksamhetsstöd
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  foreningstyp: &alla [idrott, kultur, hembygd, friluft, social, ungdom, annat]
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Ideell förening med utåtriktad verksamhet i Orsa kommun för Orsa kommuns invånare
  - Aktuella, antagna stadgar
  - Årsmöte varje år med av årsmötet vald styrelse
  - Ordnad ekonomisk hantering och redovisning som godkänns av föreningens revisorer
  - Minst 10 betalande, aktiva medlemmar (ej stödjande eller hedersmedlemmar)
  - Användning av senast erhållna föreningsbidrag ska vara redovisad
  - För idrottsföreningar anslutna till Riksidrottsförbundet krävs aktuellt vaccinationsintyg mot doping från Antidoping Sverige
  belopp: Bedöms från fall till fall utifrån en samlad bedömning av föreningens verksamhet, verksamhetsplan och ekonomi. Ingen
    fast beloppsgräns anges; summan som fördelas varierar mellan år
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Ansökningar efter angiven sista dag kan avvisas
  kalla_url: &policy https://orsa.se/download/18.46151b4b19686c7366f43bbf/1746428583972/Policy%20f%C3%B6r%20f%C3%B6reningsbidrag%202024.pdf
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
