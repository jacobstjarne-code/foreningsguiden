- id: orsa-uppdragsavtal
  namn: Uppdragsavtal med föreningar
  kategori: [idrott, kultur, social, ovrig]
  foreningstyp: *alla
  malgrupp: Ideella föreningar som utför ett särskilt uppdrag åt kommunen
  deadlines:
    typ: okand
    datum: []
  krav:
  - Föreningen ska åta sig ett särskilt uppdrag som kommunen vill få utfört
  - Uppdraget ska beskrivas i ett skriftligt avtal tillsammans med hur resultatet ska följas upp
  - Avtalet ska tecknas för en tidsbegränsad period och följas upp årligen
  - Avtalet utarbetas i dialog mellan kommunen och föreningen och saknar ett öppet generellt ansökningsförfarande
  belopp: Ersättningens storlek bestäms i det enskilda uppdragsavtalet; kommunen publicerar ingen generell nivå
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Kommunen publicerar ingen öppen ansökningsfrist; uppdragsavtal tas fram i dialog.
