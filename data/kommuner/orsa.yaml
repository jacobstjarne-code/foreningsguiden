- id: orsa-stod-till-studieforbund
  namn: Stöd till studieförbund
  kategori: [kultur, ovrig]
  foreningstyp: [kultur, annat]
  malgrupp: Studieförbund med folkbildningsverksamhet i Orsa kommun
  deadlines:
    typ: fasta
    datum: [04-30]
  krav:
  - Studieförbundet ska uppfylla Folkbildningsrådets definition och bedriva folkbildningsverksamhet i Orsa kommun
  - Studieförbundet ska årligen redovisa sin verksamhet till Folkbildningsrådet
  - Folkbildningsrådets rapportering ska bifogas ansökan
  - Ansökan ska innehålla en redogörelse för den kultur- och folkbildningsverksamhet som genomförts i Orsa kommun under föregående kalenderår
  belopp: null
