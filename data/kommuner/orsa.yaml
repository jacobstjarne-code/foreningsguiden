bidrag:
- id: orsa-foreningsbidrag
  namn: Föreningsbidrag
  kategori:
  - idrott
  - kultur
  - social
  - ovrig
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 11-30
  krav:
  - Ideell förening med utåtriktad verksamhet i Orsa kommun för Orsa kommuns invånare
  - Aktuella, antagna stadgar
  - Årsmöte varje år med av årsmötet vald styrelse
  - Ordnad ekonomisk hantering och redovisning som godkänns av föreningens revisorer
  - Minst 10 betalande, aktiva medlemmar (ej stödjande eller hedersmedlemmar)
  - Användning av senast erhållna föreningsbidrag ska vara redovisad
  - För idrottsföreningar anslutna till Riksidrottsförbundet krävs aktuellt vaccinationsintyg mot doping från Antidoping Sverige
  belopp: Bedöms från fall till fall utifrån en samlad bedömning av föreningens verksamhet, verksamhetsplan och ekonomi. Ingen
    fast beloppsgräns anges; summan som fördelas varierar mellan år
  sen_ansokan: Ansökningar efter angiven sista dag kan avvisas
  kalla_url: https://orsa.se/uppleva-och-gora/foreningar/bidrag-stod-och-stipendier.html
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: orsa-evenemangsstod
  namn: Evenemangsstöd
  kategori:
  - kultur
  - idrott
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska uppfylla kommunens grundläggande krav på föreningar (bl.a. minst 10 betalande medlemmar och ekonomisk redovisning
    godkänd av revisorer)
  - Arrangemanget ska vara offentligt och tillgängligt för allmänheten, med obligatorisk entréavgift
  - Arrangemanget ska genomföras i Orsa kommun och marknadsföras via kalendariet på orsa.se, med angivande av att det sker
    med bidrag från Orsa kommun
  - Stödet får endast täcka underskott och inte bidra till att arrangemanget går med vinst
  - Kan inte sökas för aktiviteter som föreningen samtidigt söker verksamhetsstöd för
  belopp: Max 10 000 kronor per arrangemang och max 50 procent av utgifterna. En förening kan totalt beviljas max 10 000 kronor
    per halvår (perioderna januari–juni respektive juli–december)
  sen_ansokan: Kontakta kommunen om ansökningsförfarandet
  kalla_url: https://orsa.se/uppleva-och-gora/foreningar/bidrag-stod-och-stipendier.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Ansökan senast fyra veckor före arrangemang.
- id: orsa-lokalt-aktivitetsstod
  namn: Lokalt aktivitetsstöd
  kategori:
  - idrott
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 02-28
    - 08-28
  krav:
  - Idrottsförening ansluten till Riksidrottsförbundet som bedriver barn- och ungdomsverksamhet
  - Följer förordningen (1999:1177) om statsbidrag till idrottsverksamhet samt Riksidrottsstyrelsens föreskrifter
  belopp: null
  sen_ansokan: Ansökningar efter angiven sista dag kan avvisas
  kalla_url: https://orsa.se/uppleva-och-gora/foreningar/bidrag-stod-och-stipendier.html
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: orsa-bygdepeng-vindkraft
  namn: Bygdepeng vindkraft
  kategori:
  - ovrig
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Projektet ska användas till ändamål som stimulerar näringslivsutveckling och försörjning i Orsa kommun
  - Utdelning av medel får inte gynna enbart en enskild kommersiell aktör utan att det finns ett mycket starkt allmänintresse
  - Ledande kriterier för fördelning är ökad sysselsättning, ökat antal besökare, ökad inflyttning och stärkt varumärke (ej
    sådant som normalt ingår i kommunala åtaganden)
  - Ansökan ska innehålla handlingar som styrker organisationens beslut och behörig företrädare samt senaste årets verksamhets-,
    kassa- och revisionsberättelse
  - Projektet får inte ha avslutats innan kommunen har fattat beslut
  belopp: Inget fast maxbelopp per projekt anges; bedöms från fall till fall utifrån tillgängliga medel (0,5 procent av bruttoersättningen
    för vindkraftsel enligt avtal med OX2)
  sen_ansokan: Kontakta kommunen om ansökningsförfarandet
  kalla_url: https://orsa.se/uppleva-och-gora/foreningar/bidrag-stod-och-stipendier.html
  belopp_status: ingen_regel
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
- id: orsa-utvecklingsbidrag-vindkraft
  namn: Utvecklingsbidrag vindkraft
  kategori:
  - ovrig
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: lopande
    datum: []
  krav:
  - Sökande ska vara ideell förening, ekonomisk förening eller samfällighet med säte i Orsa kommun, eller allmännyttig stiftelse
    (kan inte utgå till företag eller privatpersoner)
  - Föreningen ska ha av årsmöte antagna stadgar, föra medlemsförteckning, ha egen styrelse och kassaförvaltning
  - Projektet ska stärka bygdens attraktivitet för boende, verksamma och besökare, öka sammanhållning/engagemang i lokalsamhället,
    eller bidra till ekonomisk, social eller miljömässig hållbarhet
  - Projekt som medför framtida drift- och underhållskostnader ska ha en plan för hur dessa kostnader täcks
  - Medel ska inte utgå till kommunens ordinarie underhåll eller ordinarie kommunala investeringsprogram
  - Sökande ska ha redovisat eventuella tidigare beviljade projekt på ett tillfredsställande sätt
  belopp: Max 300 000 kronor utan medfinansiering. Med medfinansiering max 30 procent av total projektkostnad, dock högst
    500 000 kronor. Ideell tid räknas som medfinansiering med 200 kronor per arbetad timme
  sen_ansokan: Ansökan kan göras löpande under året. Tilldelningsbeslut fattas av kommunstyrelsen senast två månader efter
    inkommen ansökan.
  kalla_url: https://orsa.se/uppleva-och-gora/foreningar/bidrag-stod-och-stipendier.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Projekt för lokal utveckling. Kontakta kommunen om ansökningsförfarandet
