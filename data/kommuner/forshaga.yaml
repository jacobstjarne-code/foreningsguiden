forutsattningar:
- id: forshaga-stodberattigad-forening
  vad: Godkännande som stödberättigad förening
  beskrivning: Föreningen ska vara ideell, öppen och demokratiskt uppbyggd, ha huvudsäte och huvudsaklig verksamhet i Forshaga, minst 10 aktiva medlemmar från 7 år, antagna stadgar, ansvarig styrelse och revisor, organisationsnummer, medlemsavgift och eget bank- eller plusgiro. Verksamheten ska vara partipolitiskt och religiöst obunden, drogfri och motverka diskriminering, trakasserier och kränkningar.
  system: Rbok
  ledtid: null
  ledtid_text: Ansökan kan lämnas löpande; föreningsstödsärenden bereds en gång per månad
  giltighet: Beslutet som stödberättigad förening gäller i ett år från beslutsdatumet
  ordning: 1
  kalla_url: *norm
  giltighet_status: kontrollast
- id: forshaga-ars-och-ekonomihandlingar
  vad: Verksamhets- och ekonomihandlingar
  beskrivning: Till ansökan om stödberättigande ska föreningen lämna verksamhetsberättelse, balans- och resultaträkning, revisionsberättelse, senaste årsmötesprotokoll och stadgar om de inte redan har lämnats. Befintliga policyer mot trakasserier och kränkande särbehandling ska bifogas; föreningar som betalar ersättning för arbete ska även lämna F-skattsedel och eventuell personalförteckning.
  system: Rbok
  ledtid: null
  ledtid_text: Handlingarna lämnas med ansökan om eller förnyelsen av stödberättigandet
  giltighet: Underlaget ligger till grund för det ettåriga beslutet om stödberättigande
  ordning: 2
  kalla_url: *norm
  giltighet_status: kontrollast
