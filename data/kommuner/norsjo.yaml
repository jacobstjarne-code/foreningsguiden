  vad: Registrering och årliga föreningsuppgifter
  beskrivning: Föreningen ska vara registrerad i kommunens föreningsregister och minst en gång per år uppdatera och godkänna adressuppgifter, använda lokaler och anläggningar, genomförd verksamhet samt ekonomisk rapport. Styrelse, stadgar, organisationsnummer, minst fem aktiva medlemmar, lokal förankring, demokrati, öppenhet och kommunens ANDT-villkor ingår i grundkraven.
