  kraver_registrering: true
  sate_i_kommunen: false
  status: aktiv
  senast_verifierad: 2026-08-23
  anteckning: Stödet är öppet även för organisationer, institutioner samt yrkesverksamma och ideellt arbetande inom kulturella och kreativa sektorn. Föreningar konkurrerar därför om medlen med andra sökande.
