- id: norsjo-mikrostod-kultur-fritid
  namn: Mikrostöd – kultur och fritid
  kategori: [idrott, kultur, ovrig]
  malgrupp: Föreningar och andra aktörer med kultur-, fritids- eller marknadsföringsinsatser i Norsjö kommun
  deadlines: {typ: fasta, datum: [08-31]}
  krav:
  - Projektet ska genomföras i Norsjö kommun och röra kultur, kreativ verksamhet, sport, fritid eller marknadsföringssamarbete med tydlig koppling till kommunens mål om rik fritid
  - Stöd lämnas inte till löpande drift eller alkohol och sökanden ansvarar för nödvändiga tillstånd och markägarens medgivande
  - Föreningen ska ha lämnat årliga föreningsuppgifter före ansökan och projektet får inte vara påbörjat före beslut
  - Projektet ska genomföras inom ett år och redovisas med hela ekonomin, verifikationer, resultat och fotodokumentation senast två månader efter avslut
  belopp: 5 000–20 000 kronor per insats och förening under året
  sen_ansokan: Två ansökningsomgångar per år; höstens 2026-omgång hade sista dag 31 augusti, medan vårens datum inte längre publiceras på den aktuella sidan
  kalla_url: https://norsjo.se/wp-content/uploads/2026/02/norsjo-kommuns-handlingsplan-for-bygdemedel-2026.pdf
  belopp_status: kontrollast
  belopp_avser: per_forening
  kommunens_pott: null
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
