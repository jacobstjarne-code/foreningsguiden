- id: norsjo-anl-ggningsbidrag
  namn: Anläggningsbidrag
  kategori:
  - idrott
  - ovrig
  malgrupp: Ideella föreningar och organisationer i kommunen
  deadlines:
    typ: fasta
    datum:
    - 03-31
  krav:
  - Bidraget avser föreningsägda eller hyrda anläggningar som är öppna för allmänheten
  - 'Omfattar: ishockeybana med sarg, elljusspår, föreningsägda badplatser, föreningsägda rastplatser, underhåll av fotbollsplaner
    (ej seriespel), vandringsleder, skoterleder Norsjö och skoterleder Bastuträsk'
  - För badplatser krävs badhytter, toalett, livboj samt underhåll och städning av badstranden; tillsyn av badplatser med
    bidrag görs av kommunen
  - För rastplatser krävs soptunna, bänkar, bord samt underhåll och städning av rastplatsen; tillsyn av rastplatser med bidrag
    görs av kommunen
  belopp: Ishockeybana med sarg 3 000 kr, elljusspår 5 250 kr, underhåll av fotbollsplaner 1 500 kr, vandringsleder 8 000
    kr, skoterleder Norsjö 8 000 kr, skoterleder Bastuträsk 5 000 kr, badplatser 3 000 kr, rastplatser 500 kr (bidrag per
    förening/anläggning)
  sen_ansokan: Ansökan om anläggningsbidrag för föreningsägda anläggningar lämnas senast 31 mars.
