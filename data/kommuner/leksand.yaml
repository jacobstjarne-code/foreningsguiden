- id: leksand-upprustningsstod-enskild-vag
  namn: Upprustningsstöd till enskild väg
  kategori: [ovrig]
  foreningstyp: [annat]
  malgrupp: Väghållningsorganisationer som behöver rusta upp eller förbättra enskilda vägar i Leksands kommun
  deadlines: {typ: lopande, datum: []}
  krav:
  - Sökanden ska vara en gemensamhetsanläggning som förvaltas genom delägarförvaltning eller samfällighetsförening; annan väghållare kan godtas vid särskilda skäl
  - Sökanden ska ha juridisk rätt att använda och underhålla vägen och kunna visa en ordnad förvaltning eller en aktiv lantmäteriförrättning med berörda parters stöd
  - Vägen ska vara av allmänt intresse och hållas öppen för allmän trafik året runt
  - Åtgärden ska avse upprustning eller förbättring, exempelvis vägförstärkning, trumbyte, beläggning, ombyggnad eller brounderhåll
  - Kommunen kan kräva besiktning eller syn på plats före beslut och stödet betalas först efter utförd, godkänd och kostnadsredovisad åtgärd
  belopp: Högst 50 procent av redovisad faktisk kostnad; om samma åtgärd får statligt särskilt driftbidrag är kommunens stöd högst 50 procent av återstående kostnad
  belopp_avser: per_forening
  kommunens_pott: null
