    datum: []
  krav:
  - Den subventionerade taxan gäller bidragsberättigade föreningar i Ånge; verksamhet för barn och unga till och med 20 år samt pensionärs- och funktionsrättsföreningar har den lägsta taxan
  - Bokningen blir giltig först när kommunen har skickat en bokningsbekräftelse
  - En ansvarig vuxen eller annan behörig ledare ska närvara och se till att ordnings-, säkerhets- och städregler följs
  - Lokaler och anläggningar ska användas drog- och dopningsfritt och skador eller extra kostnader kan debiteras föreningen
  - Bidragsberättigad föreningsverksamhet och ungdomsverksamhet prioriteras när tider fördelas
  - Match ska avbokas minst 10 dagar och turnering eller arrangemang minst 30 dagar före användningsdagen för att undvika avgift enligt villkoren
  belopp: 'Exempel på föreningstaxor per timme: gymnastiksal 50 kr för ungdoms-, pensionärs- och funktionsrättsverksamhet och 100 kr för annan lokal föreningsverksamhet; Minervahallen 75 respektive 250 kr; ishallen vardag 100 respektive 400 kr och helg 100 respektive 600 kr; konstgräs för ungdom 100 kr och för seniorförening 100–300 kr beroende på säsong och användning'
