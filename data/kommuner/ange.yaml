    typ: lopande
    datum: []
  krav:
  - Stadgar bifogas ansökan
  - Protokoll från konstituerande möte bifogas ansökan
  - Verksamhetsbeskrivning bifogas ansökan
  belopp: 2 500 kr till nystartad förening för barn- och ungdomsverksamhet, utbetalas i två steg om 1 250 kr vardera (vid
    start samt när föreningen redovisat verksamhet till kommunen)
  sen_ansokan: Kontakta kommunen om ansökningsförfarandet
  kalla_url: https://invanare.ange.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-till-foreningar.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: 'Bidraget betalas ut i två steg: 1 250 kr vid start och resterande 1 250 kr när föreningen redovisat verksamhet
    till kommunen, t.ex. genom ansökan om Lokalt aktivitetsstöd eller kopia på aktivitetsrapport till studieförbund.'
- id: ange-lokalt-aktivitetsbidrag
  namn: Lokalt aktivitetsbidrag
  kategori:
  - idrott
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Minst 3 deltagare per sammankomst utöver ledare, samt minst en ledare (ledare 13–25 år är också bidragsberättigad)
  - Deltagare 7–25 år; ingen övre åldersgräns för deltagare/ledare i idrott för personer med funktionsnedsättning, samt för
    deltagare/ledare 65 år och äldre
  - Redovisning sker för två perioder per år (1 januari–30 juni och 1 juli–31 december) via närvarokort
  - Föreningen ska ha en öppen och demokratisk föreningsordning med stadgar och vald styrelse samt minst 10 medlemmar
  - Ansökan ska bifogas verksamhetsberättelse, ekonomisk rapport, verksamhetsplan, årsmötesprotokoll och revisionsberättelse
  belopp: 50 kr per sammankomst, minst 3 deltagare utöver ledare samt en ledare
  sen_ansokan: Sen ansökan ger inte rätt till bidrag
  kalla_url: https://invanare.ange.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-till-foreningar.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: För verksamhet för barn och ungdomar 7–25 år.
- id: ange-stimulansbidrag
  namn: Stimulansbidrag
  kategori:
  - idrott
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 02-25
  krav:
  - Mer än 100 redovisade sammankomster för Lokalt aktivitetsbidrag under föregående årsperiod (1 juli–30 juni)
  - Söks i samband med Lokalt aktivitetsbidrag, sista ansökningsdag 25 februari
  belopp: 'Trappstegsbelopp baserat på antal redovisade sammankomster föregående årsperiod (1 juli–30 juni): 1 500 kr (100–199),
    3 000 kr (200–299), 4 500 kr (300–399), 6 000 kr (400–499), 7 500 kr (500–599), 9 000 kr (600–699), 10 500 kr (700–799),
    13 500 kr (800 eller fler)'
  sen_ansokan: Ansökningar efter angiven sista dag kan avvisas
  kalla_url: https://invanare.ange.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-till-foreningar.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Extra stöd till föreningar som redovisar minst 100 aktiviteter per år.
- id: ange-anlaggningsbidrag
  namn: Anläggningsbidrag
  kategori:
  - idrott
  malgrupp: Ideella föreningar och organisationer enligt kommunens regler för stödformen
  deadlines:
    typ: fasta
    datum:
    - 12-01
  krav:
  - Föreningsägd anläggning som bedriver barn- och ungdomsverksamhet (Kategori A)
  - Minst 30 sammankomster/år för barn- och ungdomsverksamhet med beviljat Lokalt aktivitetsstöd, eller redovisade aktiviteter
    på annat sätt (t.ex. kopia på aktivitetsrapport till studieförbund), avseende föregående årsperiod 1 juli–30 juni
  - Fritidschef kan bevilja bidrag utan 30 sammankomster om anläggningen har stort allmänt intresse och anses främja folkhälsan
  - Ansökan ska bifogas verksamhetsberättelse, ekonomisk rapport, verksamhetsplan, årsmötesprotokoll och revisionsberättelse
  belopp: Fastställs årligen efter kommunens budgetram och anläggningens klassificering i nio grupper (nivå enligt budget
    2019), t.ex. 150 000 kr (motorcrossanläggning), 100 000 kr (fotbollsplan 100x60 godkänd för seriespel med omklädningsrum/samlingssal/kansli),
    85 000 kr, 50 000 kr, 40 000 kr, 25 000 kr, 15 000 kr respektive 10 000 kr (mindre anläggningar); hyresbidrag fastställs
    separat av fritidschef
  sen_ansokan: Sen ansökan ger inte rätt till bidrag
  kalla_url: https://invanare.ange.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-till-foreningar.html
  belopp_status: kontrollast
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: Driftbidrag till föreningsägda anläggningar med barn- och ungdomsverksamhet (Kategori A). Bidragsbeloppet klassificeras
    i nio grupper efter anläggningstyp och fastställs efter kommunens budgetram.
