  - Verksamhetsplan för kommande år ska lämnas senast den 15 december året före verksamhetsåret.
  - Verksamhetsberättelse inklusive ekonomisk berättelse för föregående år ska lämnas senast den 30 juni.
  - Påskrivet kommunsammandrag med den lokala verksamheten ska lämnas senast den 30 juni.
  - Underlaget ska redovisa unika deltagare, studietimmar, deltagare med funktionsnedsättning och antal kulturarrangemang.
