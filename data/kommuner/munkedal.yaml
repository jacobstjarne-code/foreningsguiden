bidrag:
- namn: Aktivitetsbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Föreningar med ungdomsaktiviteter för 6–25 år
  deadlines:
    typ: fasta
    datum:
    - 02-25
    - 08-25
  krav:
  - Föreningen ska ha sin huvudsakliga verksamhet och sitt säte i Munkedals kommun, vara riksanknuten och ideell, samt ha
    minst tio medlemmar i åldern 6–25 år (ingen övre åldersgräns för handikappverksamhet)
  - Bidraget beräknas efter totala antalet deltagare (personsammankomster) i redovisade sammankomster
  - Sammankomst = planerad ledarledd gruppaktivitet med minst tre bidragsberättigade deltagare i åldern 6–25 år utöver ledare,
    minst 60 minuter lång; ledare i åldern 13–25 år får medräknas som bidragsberättigade
  - Deltagare får bara delta i en bidragsgrundande sammankomst per dag
  - Närvarokort ska föras för varje sammankomst med föreningens namn, typ av aktivitet, datum/tid, plats, namn på ledare och
    deltagare, ålder och kön samt närvaromarkering; korten ska sparas hos föreningen i minst fyra år
  - Bidrag utbetalas endast för medlemmar folkbokförda i Munkedals kommun, undantag kan medges vid styrkt regelbundet deltagande
  - Föreningen ska årligen senast 30 april lämna verksamhetsberättelse, resultat- och balansräkning, revisionsberättelse och
    årsmötesprotokoll
  belopp: null
  sen_ansokan: 'Ansökan om aktivitetsbidrag görs vid två tillfällen per år: före 25 augusti avseende första halvårets aktiviteter
    och före 25 februari avseende andra halvårets aktiviteter.'
  kalla_url: https://www.munkedal.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-stod-och-stipendier
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
  id: munkedal-aktivitetsbidrag
- namn: Anläggningsbidrag
  kategori:
  - idrott
  - ovrig
  malgrupp: Föreningar som driver idrotts- eller fritidsanläggning
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningsdriven idrotts- eller fritidsanläggning, inklusive egen lokal, godkänd av kommunen eller uppförd med kommunalt
    stöd; vid hyrd eller arrenderad anläggning krävs ett av kommunen godkänt kontrakt
  - Anläggningens intäkter och kostnader ska redovisas separat på en egen resultaträkning i föreningens räkenskaper
  - Årsredovisning (verksamhetsberättelse, årsmötesprotokoll, resultat- och balansräkning samt verksamhetsplan för kommande
    år) ska inkomma senast 30 april
  - Bidraget utbetalas som ett fast årligt belopp avsett för föreningens kostnader för brandförsäkring, bränsle, sotning,
    el, vatten/avlopp, sophämtning och mindre underhåll; det fasta beloppet omprövas vart tredje år
  belopp: null
  sen_ansokan: Årsredovisning ska inkomma till kommunen senast 30 april avseende senaste verksamhetsåret. Utbetalning sker
    i samband med godkänd redovisning, dock senast 1 juni.
  kalla_url: https://www.munkedal.se/uppleva-och-gora/foreningar-foreningsliv/bidrag-stod-och-stipendier
  belopp_status: okand
  deadline_status: kontrollast
  krav_status: kontrollast
  krav_fullstandiga: true
  anteckning: null
