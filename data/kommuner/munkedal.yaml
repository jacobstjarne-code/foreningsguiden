  krav:
  - Sökande förening ska bedriva eller planera verksamhet för barn och unga 5–20 år i Munkedals kommun.
  - Verksamheten ska främja solidaritet och motverka rasism och främlingsfientlighet.
  - Insatsen ska bidra till förståelse för människors olika förutsättningar och kulturarv, demokratisk gruppverksamhet eller utveckling av nya och etablerade verksamheter.
  - Bidraget ska avse hantverk, sång, musik, dans, teater, annan kultur eller idrott.
  - Ansökan ska lämnas via e-post till Ödsbyfonden senast den 1 februari eller den 1 oktober.
