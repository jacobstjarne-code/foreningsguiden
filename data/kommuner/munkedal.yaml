  krav:
  - Söks för större reparationer eller underhåll, inköp av inventarier eller maskiner på en föreningsdriven idrotts- eller
    fritidsanläggning
  - Ansökan görs separat via kommunens hemsida senast 30 april
  - Ansökan ska innehålla beskrivning av ärendet, ritningar, kalkyler och annat underlagsmaterial för kommunens bedömning
    och handläggning
  belopp: null
  sen_ansokan: Särskilt anläggningsbidrag ansökes separat via kommunens hemsida senast 30 april. Handläggningstiden ska inte
