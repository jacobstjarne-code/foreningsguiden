  sen_ansokan: Verksamhetsplanen lämnas senast den 15 december året före. Verksamhetsberättelse, ekonomisk berättelse och påskrivet kommunsammandrag lämnas senast den 30 juni; utbetalning sker senast den 15 augusti.
