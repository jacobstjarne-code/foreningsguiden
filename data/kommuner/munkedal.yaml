- namn: Grundbidrag
  kategori:
  - idrott
  - kultur
  - ovrig
  malgrupp: Bidragsberättigade föreningar i Munkedals kommun
  deadlines:
    typ: fasta
    datum:
    - 04-30
  krav:
  - Föreningen ska vara registrerad i kommunens föreningsregister och via kommunens digitala kanal redovisa och godkänna föreningens
    uppgifter
  - Föreningen ska ha minst tio medlemmar folkbokförda i Munkedals kommun, vara ideell och uppfylla de allmänna bestämmelserna
    (demokratiska principer, jämställdhet och drogfrihet); bidrag utbetalas ej till stiftelser, samfällighetsföreningar, kommersiella
    aktörer eller religiösa samfund
  - Ansökan görs årligen senast 30 april med verksamhetsberättelse, resultat- och balansräkning, revisionsberättelse och årsmötesprotokoll
    för senast avslutade verksamhetsår
  belopp: 3 000 kronor
  sen_ansokan: Ansökan görs årligen senast 30 april via kommunens hemsida (blankettarkivet).
