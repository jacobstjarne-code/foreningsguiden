  - Föreningsdriven idrotts- eller fritidsanläggning, inklusive egen lokal, godkänd av kommunen eller uppförd med kommunalt
    stöd; vid hyrd eller arrenderad anläggning krävs ett av kommunen godkänt kontrakt
  - Anläggningens intäkter och kostnader ska redovisas separat på en egen resultaträkning i föreningens räkenskaper
  - Årsredovisning (verksamhetsberättelse, årsmötesprotokoll, resultat- och balansräkning samt verksamhetsplan för kommande
    år) ska inkomma senast 30 april
  - Bidraget utbetalas som ett fast årligt belopp avsett för föreningens kostnader för brandförsäkring, bränsle, sotning,
    el, vatten/avlopp, sophämtning och mindre underhåll; det fasta beloppet omprövas vart tredje år
  belopp: Ett fast årligt belopp per godkänd anläggning; 2026 års belopp höjdes med 2,5 procent från föregående nivå.
  belopp_avser: per_forening
  kommunens_pott: null
  sen_ansokan: Årsredovisning ska inkomma till kommunen senast 30 april avseende senaste verksamhetsåret. Utbetalning sker
    i samband med godkänd redovisning, dock senast 1 juni.
