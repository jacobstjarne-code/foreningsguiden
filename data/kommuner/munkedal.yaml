    kommuner, samt vara offentligt (allmänheten ges tillträde utan medlemstvång)
  - Nya former av arrangemang och konstellationer prioriteras
  - 'Ansökan görs före evenemanget, vid två tillfällen per år: senast 30 april respektive 30 september'
  - Evenemanget ska redovisas av ansvarig förening senast tre månader efter genomförandet; förening kan endast erhålla bidrag
    en gång per år/arrangemang
  belopp: Garanterat belopp beslutas individuellt före evenemanget, inom ramen för kommunens avsatta budgetram
