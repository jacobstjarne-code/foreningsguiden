# EXEMPEL — inte ett verifierat facit. Skriven av Code för att visa
# formatet åt Jacob/Fable (SPEC_GOLDEN_SET.md-schemat: P1/P2/P3 mot
# samma bidrag), som en verklig facit-skrivare läser och antingen
# godkänner, korrigerar, eller ersätter. "En människa skriver facit"
# var Jacobs egen instruktion — den här filen respekterar det genom att
# vara tydligt märkt som exempel, inte genom att låtsas vara bedömningen.
#
# scripts/verify-generator.ts KÖR mot den här filen precis som mot ett
# riktigt facit (.EXEMPEL-namnet är bara en läsbarhetsmarkör för
# människor) — det bevisar att PIPELINEN fungerar. Grönt här betyder
# INTE att grinden är godkänd i Jacobs mening: ingen människa har läst
# igenom och bekräftat raderna nedan ännu. Döp om till
# gislaved-arrangemangsbidrag.yaml (utan .EXEMPEL) när det är gjort.
#
# Körd och bekräftad mot verklig kod (node scripts/_probe-golden.mjs,
# engångskörning, 2026-07-27) — inte gissad för hand:
bidragId: "gislaved-arrangemangsbidrag"
kommunSlug: "gislaved"
kalla_url: "https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar"

profiler:
  # P1 — Komplett (verksamhet=idrott, storlek=m, alder=etablerad, sokt=ja).
  p1:
    forvantadTyp: "bidragsutkast"
    # En rad per Bidrag.krav[i] i data/kommuner/gislaved.yaml, samma ordning:
    #   1. "Föreningen ska vara hemmahörande (säte) i Gislaveds kommun"
    #      → ifyllt: profil.kommunSlug === kommun.kommun_slug bekräftar
    #        säte direkt (regel A, fyllKrav).
    #   2. "Allmänheten ska ha tillträde och ha informerats om
    #      arrangemanget" → lucka: Foreningsprofil samlar inte in data
    #      om ett specifikt arrangemangs publika karaktär.
    #   3. "Det ska framgå i marknadsföringen..." → lucka: samma skäl.
    #   4. "Arrangemanget ska läggas in i evenemangskalendern" → lucka:
    #      samma skäl.
    # Bidragets foreningstyp är osatt, så regel B (verksamhet) kan aldrig
    # slå till här oavsett vad P1/P2 sätter för verksamhet — förväntat,
    # inte ett tecken på att facit är fel.
    kravFacit:
      - forvantatStatus: "ifyllt"
      - forvantatStatus: "lucka"
      - forvantatStatus: "lucka"
      - forvantatStatus: "lucka"
    anteckningar: >
      Krav 1 är det enda regel A (säte) borde fånga i det här bidraget —
      krav 2–4 rör arrangemangets specifika genomförande, som
      Foreningsprofil inte samlar in data om alls.

  # P2 — Luckor (verksamhet=idrott, storlek=null, alder=null, sokt=ja).
  p2:
    forvantadTyp: "bidragsutkast"
    # Identiskt utfall som P1 för DETTA bidrag: fyllKrav() använder aldrig
    # storlek/alder (bara kommunSlug och verksamhet), så att de saknas
    # ändrar ingenting här. Det är en riktig, inte trivial, observation —
    # P2 skiljer sig bara från P1 på bidrag vars krav faktiskt refererar
    # medlemsantal/verksamhetstid (inga sådana krav finns hos detta bidrag).
    kravFacit:
      - forvantatStatus: "ifyllt"
      - forvantatStatus: "lucka"
      - forvantatStatus: "lucka"
      - forvantatStatus: "lucka"
    anteckningar: >
      Samma utfall som P1 — det här bidragets krav[] testar inte
      storlek/alder-luckor. Ett bättre facit-kandidat för att öva K3 på
      just DEN luckklassen är ett bidrag vars krav nämner medlemsantal
      eller verksamhetstid (se SPEC_GOLDEN_SET §5:s urvalskriterier).

  # P3 — Oregistrerad (samma som P1 men sokt=nej).
  p3:
    forvantadTyp: "registrering_forst"
    # kravFacit utelämnas — generatorn ger registrering_forst, ingen
    # kravRader-lista alls (spärr 4, gislaved-arrangemangsbidrag saknar
    # kraver_registrering men profil.sokt !== 'ja' räcker för gaten).
    anteckningar: >
      registreringForst() (utkastGenerator.ts) triggar på
      visaBorjaHar(profil, [bidrag]) — sokt='nej' ensamt räcker här,
      oavsett bidragets kraver_registrering-fält.
