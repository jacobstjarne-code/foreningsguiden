# EXEMPEL — inte ett verifierat facit. Skriven av Code för att visa formatet
# åt Jacob/Fable, som en verklig facit-skrivare kommer läsa och antingen
# godkänna, korrigera, eller ersätta. "En människa (jag/Jacob) skriver
# facit" var Jacobs egen instruktion (2026-07-26) — den här filen respekterar
# det genom att vara tydligt märkt som exempel, inte genom att låtsas vara
# den riktiga bedömningen.
#
# scripts/verify-generator.ts KÖR mot den här filen precis som mot ett
# riktigt facit (den läser alla golden-set/*.yaml, .EXEMPEL-namnet är bara
# en läsbarhetsmarkör för människor, ingen filtrering i scriptet) — det
# bevisar att SJÄLVA PIPELINEN fungerar. Men grönt här betyder INTE att
# grinden är godkänd i Jacobs mening: ingen människa har läst igenom och
# bekräftat kravStatus-raderna nedan ännu. Döp om till
# gislaved-arrangemangsbidrag.yaml (utan .EXEMPEL) när det är gjort, som
# signal att filen bytt status från demonstration till riktigt facit.
bidragId: "gislaved-arrangemangsbidrag"
kommunSlug: "gislaved"
profil:
  kommunSlug: "gislaved"
  verksamhet: ["kultur"]
  storlek: "s"
  alder: "etablerad"
  sokt: "ja"   # 'ja' = redan känd som registrerad — annars hade spärr 4
               # (registreringForst) gett registrering_forst i stället,
               # eftersom gislaved-godkannande-bidragsberattigad finns som
               # ett separat, eget bidrag i samma kommun.
forvantadTyp: "bidragsutkast"
# En rad per Bidrag.krav[i], i data/kommuner/gislaved.yaml, samma ordning:
#   1. "Föreningen ska vara hemmahörande (säte) i Gislaveds kommun"
#      → ifyllt: profil.kommunSlug === kommun.kommun_slug bekräftar säte
#        direkt (GUIDE_TRATT_COPY.ts fraga_kommun.hjalp definierar
#        kommunfrågan som just sätesfrågan).
#   2. "Allmänheten ska ha tillträde och ha informerats om arrangemanget"
#      → lucka: Foreningsprofil har inget fält om ett specifikt
#        arrangemangs publika karaktär.
#   3. "Det ska framgå i marknadsföringen att arrangemanget genomförs med
#      stöd från Gislaveds kommun" → lucka: samma skäl.
#   4. "Arrangemanget ska läggas in i evenemangskalendern" → lucka: samma
#      skäl.
kravStatus: ["ifyllt", "lucka", "lucka", "lucka"]
anteckningar: >
  Facit-motivering (läses av människa, används inte av grindscriptet).
  Krav 1 är den enda regel A (säte) borde fånga i det här bidraget —
  krav 2–4 rör det specifika arrangemangets genomförande, som
  Foreningsprofil inte samlar in data om alls. Om en människa bedömer
  att något av krav 2–4 ÄNDÅ borde vara ifyllbart ur andra fält (eller
  att krav 1 INTE borde vara det) — det är precis den typen av
  avvikelse grinden finns för att fånga.
