# FACIT 1 av 14 — ursprungligen skrivet av Opus/Fable 2026-07-27 mot
# data/kommuner/gislaved.yaml (då: "Arrangemangs- och projektbidrag",
# 4 krav). UPPDATERAT 2026-08-02 av Code, kod-audit under SPRINT
# Huvudprocessen: den parallella dataextraktionsprocessen skrev om HELA
# gislaved.yaml (commit f40a3e6, "helrevision block 03") — Gislaved gick
# från 1 bidrag till 11, och SAMMA id (gislaved-arrangemangsbidrag) fick
# NYTT namn ("Arrangemangsbidrag kultur") och NYA krav (2 st, inte 4).
# Facit under speglar den nya krav[]-listan — ingen kommundata rörd här,
# bara testfixturen synkad mot vad genereraUtkast() FAKTISKT ska
# producera mot den nu gällande texten (körd och verifierad mot
# fyllKrav()/utkastGenerator.ts, inte gissad för hand).
bidragId: "gislaved-arrangemangsbidrag"
kommunSlug: "gislaved"
kalla_url: "https://www.gislaved.se/uppleva-och-gora/foreningsliv/foreningsbidrag-fritid--och-kulturforeningar"

# Testar: K1 (rika krav), K2 (förbjudna tillägg), K3 (luckor — INGET av
# de två kraven matchar fyllKrav():s säte- eller verksamhet-regel).
#
# FÖRBJUDET (K2 — redan strukturellt garanterat av generatorns fasta
# mallar, se README §K2, men dokumenterat här för människor):
#   - Ett beloppstak eller sökt summa (belopp: null i den nya datan
#     också — "Individuell bedömning" är inget parseat belopp).
#   - Krav på verksamhetsberättelse, årsmötesprotokoll, budget eller
#     revisionsberättelse — inget av det står i krav[].
#   - Medlemsantal eller åldersgränser.
forvantadDeadlineTyp: "fast" # fyra fasta tillfällen/år, oförändrat i den nya datan

profiler:
  p1:
    forvantadTyp: "bidragsutkast"
    # Varken "Allmänheten ska ha tillträde" eller "Arrangemanget ska
    # marknadsföras" innehåller ett säte-/bedrivs-i-uttryck eller ett
    # verksamhet-nyckelord — fyllKrav()s Regel A och Regel B slår aldrig
    # till på något av de två, oavsett profil. Båda alltid lucka.
    kravFacit:
      - forvantatStatus: "lucka"
      - forvantatStatus: "lucka"
    anteckningar: >
      Till skillnad från den gamla krav-listan (som hade en ren
      säte-mening som krav 1) nämner inget av de två nya kraven var
      föreningen har sitt säte — bara vad SJÄLVA ARRANGEMANGET kräver
      (allmän tillträde, marknadsföring). Ingen av trattens fem svar
      (kommun/verksamhet/storlek/ålder/sökt) kan fylla i det.
  p2:
    forvantadTyp: "bidragsutkast"
    kravFacit:
      - forvantatStatus: "lucka"
      - forvantatStatus: "lucka"
    anteckningar: >
      Identiskt med P1 — fyllKrav() använder aldrig storlek/ålder, och
      inget av kraven är sate-/verksamhet-baserat att börja med.
  p3:
    forvantadTyp: "registrering_forst"
    anteckningar: >
      sokt=nej triggar registreringsgrenen universellt (visaBorjaHar:
      profil.sokt !== 'ja' räcker ensamt, oavsett bidragets egna fält).
